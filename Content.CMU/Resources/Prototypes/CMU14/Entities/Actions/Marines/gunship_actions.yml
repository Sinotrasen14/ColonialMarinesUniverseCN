- type: entity
  id: ActionGunshipMasterAlarmSilence
  name: 主警报静音
  description: 使所有可听武装直升机警报静音或恢复。视觉警告保持激活。
  components:
  - type: InstantAction
    event: !type:Content.Shared.CMU14.Dropship.TacticalLand.GunshipMasterAlarmToggleActionEvent
  - type: Action
    checkCanInteract: false
    useDelay: 0.25
    itemIconStyle: BigItem
  - type: Sprite
    layers:
    - sprite: CMU14/Structures/vehicles/Blackfoot/blackfoot_hud.rsi
      state: integrity
      map: ["enum.ActionVisuals.Icon"]

- type: entity
  id: ActionGunshipCycleCamera
  name: 循环机动摄像机
  description: 循环切换机动摄像机：后部、下部、上部和关闭。
  components:
  - type: InstantAction
    event: !type:Content.Shared.CMU14.Dropship.TacticalLand.GunshipCycleCameraActionEvent
  - type: Action
    checkCanInteract: false
    useDelay: 0.25
    itemIconStyle: BigItem
  - type: Sprite
    layers:
    - sprite: CMU14/ZLevels/Actions/misc.rsi
      state: down
      map: ["enum.ActionVisuals.Icon"]

- type: entity
  id: ActionGunshipDropshipOutline
  name: 查看运输机轮廓
  description: 切换上下机动摄像头上的运输机轮廓线。
  components:
  - type: InstantAction
    event: !type:Content.Shared.CMU14.Dropship.TacticalLand.GunshipDropshipOutlineToggleActionEvent
  - type: Action
    checkCanInteract: false
    useDelay: 0.25
    itemIconStyle: BigItem
  - type: Sprite
    layers:
    - sprite: CMU14/Structures/vehicles/Blackfoot/blackfoot_hud.rsi
      state: targeting-reticle
      map: ["enum.ActionVisuals.Icon"]

- type: entity
  id: ActionGunshipPilotPanning
  name: 切换飞行员摄像机平移
  description: 启用或禁用鼠标控制的飞行员摄像机平移。
  components:
  - type: InstantAction
    event: !type:Content.Shared.CMU14.Dropship.TacticalLand.GunshipPilotPanningToggleActionEvent
  - type: Action
    checkCanInteract: false
    useDelay: 0.25
    itemIconStyle: BigItem
  - type: Sprite
    layers:
    - sprite: CMU14/Structures/vehicles/Blackfoot/blackfoot_hud.rsi
      state: targeting-reticle
      map: ["enum.ActionVisuals.Icon"]

- type: entity
  id: ActionGunshipPilotZoom
  name: 切换 1.5x 飞行员视角缩放
  description: 切换飞行员摄像头的瞄准镜式1.5倍放大倍率。
  components:
  - type: InstantAction
    event: !type:Content.Shared.CMU14.Dropship.TacticalLand.GunshipPilotZoomToggleActionEvent
  - type: Action
    checkCanInteract: false
    useDelay: 0.25
    itemIconStyle: BigItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Objects/Weapons/Guns/Attachments/rail.rsi
      state: sniperscope
      map: ["enum.ActionVisuals.Icon"]
