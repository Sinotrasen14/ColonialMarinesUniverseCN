- type: entity
  id: ActionBlackfootEngineToggle
  name: 开关黑足引擎
  description: 启动或停止黑足引擎。
  components:
  - type: InstantAction
    event: !type:Content.Shared.CMU14.Blackfoot.BlackfootEngineToggleActionEvent
  - type: Action
    itemIconStyle: BigItem
  - type: Sprite
    layers:
    - sprite: CMU14/Structures/vehicles/Blackfoot/blackfoot_hud.rsi
      state: integrity
      map: ["enum.ActionVisuals.Icon"]

- type: entity
  id: ActionBlackfootTakeoff
  name: 黑足垂直起飞
  description: 开始垂直起降起飞序列。
  components:
  - type: InstantAction
    event: !type:Content.Shared.CMU14.Blackfoot.BlackfootTakeoffActionEvent
  - type: Action
    itemIconStyle: BigItem
  - type: Sprite
    layers:
    - sprite: CMU14/Structures/vehicles/Blackfoot/blackfoot_hud.rsi
      state: fuel
      map: ["enum.ActionVisuals.Icon"]

- type: entity
  id: ActionBlackfootLand
  name: 黑足垂直着陆
  description: 开始垂直起降着陆序列。
  components:
  - type: InstantAction
    event: !type:Content.Shared.CMU14.Blackfoot.BlackfootLandActionEvent
  - type: Action
    itemIconStyle: BigItem
  - type: Sprite
    layers:
    - sprite: CMU14/Structures/vehicles/Blackfoot/blackfoot_hud.rsi
      state: targeting-reticle
      map: ["enum.ActionVisuals.Icon"]

- type: entity
  id: ActionBlackfootFlightModeToggle
  name: 切换黑足飞行模式
  description: 在垂直起降悬停与前飞之间切换。
  components:
  - type: InstantAction
    event: !type:Content.Shared.CMU14.Blackfoot.BlackfootFlightModeToggleActionEvent
  - type: Action
    itemIconStyle: BigItem
  - type: Sprite
    layers:
    - sprite: CMU14/Structures/vehicles/Blackfoot/blackfoot_hud.rsi
      state: battery
      map: ["enum.ActionVisuals.Icon"]

- type: entity
  id: ActionBlackfootRearDoorToggle
  name: 切换黑足后门
  description: 打开或关闭黑足直升机的后门。
  components:
  - type: InstantAction
    event: !type:Content.Shared.CMU14.Blackfoot.BlackfootRearDoorToggleActionEvent
  - type: Action
    itemIconStyle: BigItem
  - type: Sprite
    layers:
    - sprite: CMU14/Structures/vehicles/Blackfoot/interiors/blackfoot.rsi
      state: rear-door-open
      map: ["enum.ActionVisuals.Icon"]

- type: entity
  id: ActionBlackfootStowToggle
  name: 收起黑足
  description: 在地面时折叠或展开Blackfoot。
  components:
  - type: InstantAction
    event: !type:Content.Shared.CMU14.Blackfoot.BlackfootStowToggleActionEvent
  - type: Action
    itemIconStyle: BigItem
  - type: Sprite
    layers:
    - sprite: CMU14/Structures/vehicles/Blackfoot/blackfoot_hardpoints.rsi
      state: engines
      map: ["enum.ActionVisuals.Icon"]

- type: entity
  id: ActionBlackfootAscendZLevel
  name: 黑足向上爬升
  description: 将黑足提升一个Z层级。
  components:
  - type: InstantAction
    event: !type:Content.Shared.CMU14.Blackfoot.BlackfootAscendZLevelActionEvent
  - type: Action
    checkCanInteract: false
    itemIconStyle: BigItem
  - type: Sprite
    layers:
    - sprite: CMU14/ZLevels/Actions/misc.rsi
      state: up
      map: ["enum.ActionVisuals.Icon"]

- type: entity
  id: ActionBlackfootDescendZLevel
  name: 黑足下降高度
  description: 将黑足下降一个Z轴高度。
  components:
  - type: InstantAction
    event: !type:Content.Shared.CMU14.Blackfoot.BlackfootDescendZLevelActionEvent
  - type: Action
    checkCanInteract: false
    itemIconStyle: BigItem
  - type: Sprite
    layers:
    - sprite: CMU14/ZLevels/Actions/misc.rsi
      state: down
      map: ["enum.ActionVisuals.Icon"]

- type: entity
  id: ActionBlackfootDoorGunZModeToggle
  name: 切换M866 Z-Fire
  description: 将M866在当前的Z轴高度射击和向下一层高度射击之间切换。
  components:
  - type: InstantAction
    event: !type:Content.Shared.CMU14.Blackfoot.BlackfootDoorGunZModeToggleActionEvent
  - type: Action
    checkCanInteract: false
    itemIconStyle: BigItem
  - type: Sprite
    layers:
    - sprite: CMU14/ZLevels/Actions/misc.rsi
      state: down
      map: ["enum.ActionVisuals.Icon"]
