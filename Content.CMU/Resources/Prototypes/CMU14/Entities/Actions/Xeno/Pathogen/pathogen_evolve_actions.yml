- type: entity
  parent: ActionXenoBase
  id: CMU14ActionXenoPathogenEvolve
  name: 进化
  description: 进化为新形态的下一阶层，或在有可用变体时选择一种变体。
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: evolve
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoOpenEvolutionsActionEvent

- type: entity
  parent: ActionXenoBase
  id: CMU14ActionXenoPathogenDevolve
  name: 退化
  description: 退化为新形态的上一级种姓。[color=red]你不会获得进化点数返还！[/color]
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: xeno_deevolve
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoOpenDevolveActionEvent
