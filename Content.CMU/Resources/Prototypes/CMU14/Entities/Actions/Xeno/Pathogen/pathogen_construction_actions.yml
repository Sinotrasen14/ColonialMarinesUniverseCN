- type: entity
  id: CMU14ActionXenoPathogenPlantWeeds
  parent: ActionXenoBase
  name: 种植菌毯（75）
  description: 种植一个菌毯节点，它会蔓延出更多菌毯。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 1
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: plant_weeds
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoPlantWeedsActionEvent
      prototype: CMU14XenoMyceliumWeedsSource
  - type: SwappableAction
    swappedEventTemplate: !type:XenoExpandWeedsActionEvent
    originalEventTemplate: !type:XenoPlantWeedsActionEvent

- type: entity
  id: CMU14ActionXenoPathogenChooseStructure
  parent: ActionXenoBase
  name: 选择树脂结构
  description: "选择一种结构，以使用“分泌树脂”动作进行分泌。"
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: TEMPLATE  # no place_resin in pathogen RSI
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoChooseStructureActionEvent
  - type: XenoChooseConstructionAction
  - type: RMCDazeableAction

- type: entity
  id: CMU14ActionXenoPathogenSecreteStructure
  parent: ActionXenoBase
  name: 分泌树脂
  description: "建造通过“选择树脂结构”行动选定的结构。"
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: secrete_resin
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    deselectOnMiss: false
    range: 0
    repeat: true
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:XenoSecreteStructureActionEvent
  - type: XenoConstructionAction
    checkStructureSelected: true
    checkWeeds: true
    canUpgrade: true
  - type: XenoHiveInstantBuildAction
  - type: RMCDazeableAction

- type: entity
  id: CMU14ActionXenoPathogenCoerceResin
  parent: ActionXenoBase
  name: 胁迫树脂
  description: "建造通过“选择树脂结构”行动选定的结构。如果你在菌毯上，也可以在视线范围内建造。"
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: secrete_resin
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    deselectOnMiss: false
    range: 0
    repeat: true
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:XenoSecreteStructureActionEvent
  - type: XenoConstructionAction
    checkStructureSelected: true
    checkWeeds: true
    canUpgrade: false
  - type: XenoHiveInstantBuildAction
  - type: RMCDazeableAction

- type: entity
  id: CMU14ActionXenoPathogenOrderConstruction
  parent: ActionXenoBase
  name: 建造指令
  description: 开始建造一个重要的巢穴结构。
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: morph_resin
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoOrderConstructionActionEvent
  - type: RMCDazeableAction

- type: entity
  id: CMU14ActionXenoPathogenResinHole
  parent: ActionXenoBase
  name: 植物树脂洞（200）
  description: 在菌毯上放置一个树脂洞。它可以被填充沸腾气体、酸液或寄生体。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 1
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: place_trap
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoPlaceResinHoleActionEvent
  - type: RMCDazeableAction

- type: entity
  id: CMU14ActionXenoPathogenFruitChoose
  parent: ActionXenoBase
  name: 更换水果
  description: 选择一种水果，以便通过“种植树脂水果”行动进行种植。
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: gardener_plant
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoFruitChooseActionEvent
  - type: XenoFruitChooseAction

- type: entity
  id: CMU14ActionXenoPathogenFruitPlant
  parent: ActionXenoBase
  name: 植物树脂果实（100）
  description: 在菌毯上种植选定的树脂果实，消耗生命和等离子。异形可以在果实成熟后采摘，你也可以提前拔掉植物以清除它。异形可以在手中使用或在地上食用以获得效果。它们也可以用于其他异形来喂食。你同时只能种植和采摘6个果实。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 5
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: gardener_plant
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoFruitPlantActionEvent

- type: entity
  id: CMU14ActionXenoPathogenPlantWeedsHardy
  parent: ActionXenoBase
  name: 种植耐寒菌毯（125）
  description: 种植一个菌毯节点，它会传播更顽强的菌毯，这些菌毯结果速度提高25%，生命值略高，并且可以传播到一些普通菌毯无法生长的表面上。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 120
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: plant_gardener_weeds
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoPlantWeedsActionEvent
      plasmaCost: 125
      prototype: XenoHardyWeedsSource

- type: entity
  id: CMU14ActionXenoPathogenFruitPlantLesser
  parent: CMU14ActionXenoPathogenFruitPlant
  name: 植物树脂果实（50）
  description: 以消耗生命和等离子为代价，在菌毯上种植树脂果实。
  components:
  - type: InstantAction
    event: !type:XenoFruitPlantActionEvent
      plasmaCost: 50

- type: entity
  id: CMU14ActionXenoPathogenDigTunnel
  parent: ActionXenoBase
  name: 挖掘隧道（200）
  description: 为蜂巢挖掘一条隧道，以便快速通行。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 300
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: build_tunnel
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoDigTunnelActionEvent

- type: entity
  parent: CMU14ActionXenoPathogenPlantWeeds
  id: CMU14ActionLesserDronePathogenPlantWeeds
  components:
  - type: InstantAction
    event: !type:XenoPlantWeedsActionEvent
      limitDistance: true

- type: entity
  parent: ActionXenoBase
  id: CMU14ActionXenoPathogenExpandWeeds
  name: 扩张菌毯（50）
  description: 扩张现有菌毯，或将一块菌毯地块变为节点。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.5
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: plant_weeds
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    checkCanAccess: false
    range: -1
    deselectOnMiss: false
  - type: WorldTargetAction
    event: !type:XenoExpandWeedsActionEvent
      source: CMU14XenoMyceliumWeedsSource
      expand: CMU14XenoMyceliumWeeds

- type: entity
  id: CMU14ActionXenoPathogenDesignerSelectedDesign
  parent: ActionXenoBase
  name: 已选设计
  description: 切换新放置的设计节点是墙壁节点还是门节点。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.2
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: design_mark_1
      map: ["enum.ActionVisuals.Icon"]
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: design_mark_2
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:Content.Shared._RMC14.Xenonids.Designer.DesignerSelectedDesignToggleActionEvent
  - type: RMCDazeableAction

- type: entity
  id: CMU14ActionXenoPathogenDesignerGreaterResinSurge
  parent: ActionXenoBase
  name: 强效树脂涌流（250）
  description: 消耗附近的设计节点，以创建临时的反射树脂墙。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 30
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: greater_resin_surge
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:Content.Shared._RMC14.Xenonids.Designer.DesignerGreaterResinSurgeActionEvent
  - type: RMCDazeableAction
