  - type: InstantAction
    event: !type:XenoHideActionEvent

- type: entity
  id: CMU14ActionXenoPathogenToggleCrest
  parent: ActionXenoBase
  name: 切换纹章防御
  description: 提高你对直接伤害的抗性，但会减慢你的速度。当你的冠饰降下时，你被视为大一个体型。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 2
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: crest_defense
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoToggleCrestActionEvent

- type: entity
  id: CMU14ActionXenoPathogenFortify
  parent: ActionXenoBase
  name: 强化
  description: 变为无法移动且生物无法穿过，大幅提高对直接伤害和爆炸的抗性。来自你面向方向的伤害进一步降低。你不会被小型爆炸击晕。加固期间你被视为大两个体型，并且仍然可以攻击建筑或使用尾击。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 5
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: fortify
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoFortifyActionEvent

- type: entity
  id: CMU14ActionXenoPathogenFortifySteelcrest
  parent: CMU14ActionXenoPathogenFortify
  name: 要塞化
  description: 变得缓慢许多，提高你对直接伤害和爆炸的抗性。来自你面向方向的伤害大幅降低。防御姿态下你被视为大两个体型，仍然可以攻击建筑或使用尾击，但你的斩击伤害降低。

- type: entity
  id: CMU14ActionXenoPathogenResinWalker
