  - type: InstantAction
    event: !type:XenoPheromonesActionEvent

- type: entity
  id: CMU14ActionXenoPathogenHide
  parent: ActionXenoBase
  name: 隐藏
  description: 躲在桌子和其他物体下面。
  components:
