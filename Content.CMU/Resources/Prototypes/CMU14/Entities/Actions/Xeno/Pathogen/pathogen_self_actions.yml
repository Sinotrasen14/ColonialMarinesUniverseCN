  - type: XenoResinSurgeAction

- type: entity
  parent: ActionXenoBase
  id: CMU14ActionXenoPathogenRetrieve
  name: 取回（180等离子，100狂怒）
  description: 将一只新形态拉向你，前提是它静止不动，需要0.6秒的持续动作。除非目标已倒地，否则你无法拉动体型很大的新形态。
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: retrieve
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 7
  - type: EntityTargetAction
    event: !type:XenoRetrieveActionEvent
  - type: XenoActionPlasma
    cost: 180
  - type: XenoActionEnergy
    cost: 100
  - type: ActionCooldown
    cooldown: 10
  - type: ActionBlockIfResting

- type: entity
  parent: ActionXenoBase
  id: CMU14ActionXenoPathogenAidHeal
  name: 援助新形态治疗（100等离子，100+生命储备）
  description: 治疗附近的友方异形。治疗其他异形时也会治疗你自己，并消耗你剩余生命储备的一半以提供额外治疗。[color=red]这无法治疗已点燃的新形态异形！[/color]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 10
  - type: Sprite
    layers:
