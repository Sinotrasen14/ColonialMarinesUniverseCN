- type: entity
  id: CMU14ActionXenoPathogenRest
  parent: ActionXenoBase
  name: 休息
  description: 躺在菌毯上以更快恢复生命值。[color=red]你的休息快捷键也会激活此动作，默认是 Shift+R。[/color]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 1
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: resting
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoRestActionEvent

- type: entity
  id: CMU14ActionXenoPathogenWatch
