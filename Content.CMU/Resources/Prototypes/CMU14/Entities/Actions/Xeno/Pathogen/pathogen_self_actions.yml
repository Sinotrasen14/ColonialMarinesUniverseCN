- type: entity
  id: CMU14ActionXenoPathogenResinSurge
  parent: ActionXenoBase
  name: 树脂涌动（75）
  description: 使用后立即长出一颗果实（冷却时间与生长时间成正比），对菌毯使用时会生成临时墙壁，对现有墙壁使用则将其加固，获得6000点生命值，持续15秒。对任何其他目标使用会在短暂延迟后生成一片3x3的弱粘性树脂。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 10
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/actions_pathogen.rsi
      state: gardener_resin_surge
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 7
    checkCanAccess: false
  - type: EntityTargetAction
    whitelist:
      components:
      - XenoConstruct
      - XenoFruit
      - XenoWeeds
  - type: WorldTargetAction
