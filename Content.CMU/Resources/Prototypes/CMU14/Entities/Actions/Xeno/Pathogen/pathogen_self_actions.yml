  name: 浸泡（20）
  description: 做好准备承受即将到来的伤害。如果你在6秒内吸收240点伤害，则恢复120点生命值并重置你的尾刺冷却时间。[color=red]如果未达到阈值，效果将失效且没有任何奖励。[/color]

- type: entity
