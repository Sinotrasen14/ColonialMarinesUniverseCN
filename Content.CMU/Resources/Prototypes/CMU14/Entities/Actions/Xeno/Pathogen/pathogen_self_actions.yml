      state: watch_xeno
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoWatchActionEvent

- type: entity
  id: CMU14ActionXenoPathogenPheromones
  parent: ActionXenoBase
  name: 释放信息素（35）
  description: 给予附近的新形态体增益效果。[color=cyan]每秒消耗2.5点等离子。[/color]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.33
  - type: Sprite
