  name: 赋能（50）
  description: 首次激活时，获得少量护盾。6秒后或再次使用后，根据周围敌人（最多6个）获得强化，从每个敌人身上获得护盾。如果从至少3个目标处获得强化，你将进入超级强化状态，近战攻击获得额外伤害，并改变你其他一些技能的效果。
