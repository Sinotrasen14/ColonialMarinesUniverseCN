- type: entity
  parent: ActionXenoBase
  id: CMUActionXenoBullPlow
  name: 犁
  description: 将你的冲锋设置为犁穿目标而不停下。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.25
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/Xeno/bull.rsi
      state: bull_charge
      map: ["enum.ActionVisuals.Icon"]
    - sprite: CMU14/Actions/Xeno/bull.rsi
      state: bull_ready_charge
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:CMUXenoBullChargeActionEvent { mode: Plow }

- type: entity
  parent: ActionXenoBase
  id: CMUActionXenoBullHeadbutt
  name: 头槌
  description: 将你的冲锋设为把目标撞到一旁并结束冲刺。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.25
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/Xeno/bull.rsi
      state: bull_headbutt
      map: ["enum.ActionVisuals.Icon"]
    - sprite: CMU14/Actions/Xeno/bull.rsi
      state: bull_headbutt
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:CMUXenoBullChargeActionEvent { mode: Headbutt }

- type: entity
  parent: ActionXenoBase
  id: CMUActionXenoBullGore
  name: 血
  description: 将你的冲锋设置为顶撞目标以造成更重伤害并结束冲刺。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.25
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/Xeno/bull.rsi
      state: bull_gore
      map: ["enum.ActionVisuals.Icon"]
    - sprite: CMU14/Actions/Xeno/bull.rsi
      state: bull_gore
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:CMUXenoBullChargeActionEvent { mode: Gore }
