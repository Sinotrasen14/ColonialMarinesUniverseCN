- type: entity
  parent: ActionXenoBase
  id: ActionApeLeap
  name: 跃迁
  description: 向指定位置跳跃，并击倒第一个命中的敌人。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 3
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: pounce
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 15
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:Content.Shared.CMU14.Threats.Mobs.Ape.ApeLeapActionEvent
  - type: RMCDazeableAction

- type: entity
  parent: ActionXenoBase
  id: ActionApeDestroy
  name: 摧毁
  description: 片刻后，跳向目标位置，摧毁3x3范围内的建筑并肢解敌人。可越过路障和其他矮墙。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 60
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: charge
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 7
    checkCanAccess: false
    deselectOnMiss: false
  - type: WorldTargetAction
    event: !type:Content.Shared.CMU14.Threats.Mobs.Ape.ApeDestroyActionEvent

- type: entity
  parent: ActionXenoBase
  id: ActionApeCharge
  name: 冲锋
  description: 猿类专属冲锋。点击一个地块蓄力并冲锋至该处，眩晕并伤害被击中的敌人。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 14
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: ready_charge
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 9
    checkCanAccess: false
  - type: WorldTargetAction
    # Use ape-specific charge event
    event: !type:Content.Shared.CMU14.Threats.Mobs.Ape.ApeChargeActionEvent

- type: entity
  parent: ActionXenoFling
  id: ActionApeRam
  name: 公羊
  description: 猿类专属冲撞。瞄准一名敌人进行冲撞，消耗少量等离子。
  components:
  - type: Action
    useDelay: 10
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: fling
      map: ["enum.ActionVisuals.Icon"]
  - type: EntityTargetAction
    # Use ape-specific ram event
    event: !type:Content.Shared.CMU14.Threats.Mobs.Ape.ApeRamActionEvent
    toggleOutline: false
  # Ape ram does not consume plasma

- type: entity
  parent: ActionXenoBase
  id: ActionApeHeadbite
  name: 头咬
  description: 猿类专用啃咬头部，对失去意识的目标施加啃咬头部效果。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 10
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: headbite
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 1.5
    checkCanAccess: false
    deselectOnMiss: false
  - type: EntityTargetAction
    event: !type:Content.Shared.CMU14.Threats.Mobs.Ape.ApeXenoHeadbiteActionEvent
  - type: ActionBlockIfResting
  - type: XenoOffensiveAction

- type: entity
  parent: ActionXenoBase
  id: ActionApeLimbRip
  name: 撕下肢体
  description: 从尸体上撕下一条肢体。肢体是很好的投掷材料。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 8
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: gut
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 1.5
    checkCanAccess: false
    deselectOnMiss: false
  - type: EntityTargetAction
    event: !type:Content.Shared.CMU14.Threats.Mobs.Ape.ApeLimbRipActionEvent
    toggleOutline: false

- type: entity
  parent: ActionXenoBase
  id: ActionApeHurl
  name: 投掷碎屑
  description: 扯下一块碎片，用力掷向目标。攻击力强，可使怪物眩晕，能破坏路障，并可攻击到上一z层。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 6
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: xeno_spit
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 15
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:Content.Shared.CMU14.Threats.Mobs.Ape.ApeHurlActionEvent

- type: entity
  parent: BaseItem
  id: CMUApeDebrisRock
  name: 抛掷的碎石
  description: 一块沉重的岩石，被某种非常强大的力量从地面撕扯下来。
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Decoration/Flora/flora_rockssolid.rsi
    state: rocksolid01
  - type: Item
    size: Normal
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 25
        Structural: 150
