- type: entity
  parent: BaseItem
  id: AU14PropItemLaptop
  name: 笔记本电脑
  description: 一台便携式电脑。
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite:  CMU14/Items/laptop.rsi
    state: laptop_off

- type: entity
  parent: RMCOverwatchConsoleGovfor
  id: AU14ItemLaptopOverwatchGOVFOR
  name: 守望先锋笔记本电脑
  description: 一台用于观察和监控友方单位的便携式战术计算机。
  suffix: GOVFOR
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite:  CMU14/Items/laptop.rsi
    state: laptop_off_govfor
  - type: AU14CallsignConsole
    faction: govfor
  - type: UserInterface
    interfaces:
      enum.OverwatchConsoleUI.Key:
        type: OverwatchConsoleBui
      enum.TacticalMapComputerUi.Key:
        type: TacticalMapComputerBui
      enum.DialogUiKey.Key:
        type: DialogBui
      enum.AU14CallsignConsoleUI.Key:
        type: AU14CallsignConsoleBui

- type: entity
  parent: RMCOverwatchConsoleOpfor
  id: AU14ItemLaptopOverwatchOPFOR
  name: 守望先锋笔记本电脑
  description: 一台用于观察和监视友方单位的便携式战术计算机。
  suffix: OPFOR
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite:  CMU14/Items/laptop.rsi
    state: laptop_off_opfor
  - type: AU14CallsignConsole
    faction: opfor
  - type: UserInterface
    interfaces:
      enum.OverwatchConsoleUI.Key:
        type: OverwatchConsoleBui
      enum.TacticalMapComputerUi.Key:
        type: TacticalMapComputerBui
      enum.DialogUiKey.Key:
        type: DialogBui
      enum.AU14CallsignConsoleUI.Key:
        type: AU14CallsignConsoleBui

# standalone directory laptops for mapping outside the overwatch consoles
# (command posts, briefing rooms), left-click opens the directory
- type: entity
  parent: AU14PropItemLaptop
  id: AU14ItemLaptopCallsignGOVFOR
  name: 通信网目录
  description: 一个列出阵营网络中所有空间站呼号的现场终端。
  suffix: GOVFOR
  components:
  - type: Sprite
    sprite: CMU14/Items/laptop.rsi
    state: laptop_off_govfor
  - type: InteractionOutline
  - type: ActivatableUI
    key: enum.AU14CallsignConsoleUI.Key
  - type: UserInterface
    interfaces:
      enum.AU14CallsignConsoleUI.Key:
        type: AU14CallsignConsoleBui
  - type: AU14CallsignConsole
    faction: govfor

- type: entity
  parent: AU14ItemLaptopCallsignGOVFOR
  id: AU14ItemLaptopCallsignOPFOR
  suffix: OPFOR
  components:
  - type: Sprite
    sprite: CMU14/Items/laptop.rsi
    state: laptop_off_opfor
  - type: AU14CallsignConsole
    faction: opfor

- type: entity
  parent: AU14ItemLaptopCallsignGOVFOR
  id: AU14ItemLaptopCallsignCLF
  suffix: CLF
  components:
  - type: AU14CallsignConsole
    faction: clf