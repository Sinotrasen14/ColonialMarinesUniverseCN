- type: entity
  parent: BaseItem
  id: CMUBaseGasMaskFilter
  abstract: true
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: CMU14/Items/gas_mask_filter.rsi
    layers:
    - state: icon
  - type: Tag
    tags:
    - CMUGasMaskFilter
  - type: GasMaskFilter
    neurotoxinResist: false
    neurotoxinDamageMultiplier: 10 #1 second
    chemicalIrritantDamageMultiplier: 2.25 #1 and a half-ish CN20 gas clouds
    baseIntegrity: 100

- type: entity
  parent: CMUBaseGasMaskFilter
  id: CMUGasMaskFilter
  name: 防毒面具滤毒罐
  description: 一个小金属气罐，据称内含活性炭过滤器，可防止有害的空气悬浮颗粒要了你的命。

- type: entity
  parent: CMUBaseGasMaskFilter
  id: CMUGasMaskFilterUPP
  name: ShMB/4防毒面具滤毒罐
  description: 一个小金属气罐。可能也能过滤空气中的污染物。侧面贴有石棉警告标签。
  components:
  - type: Sprite
    sprite: CMU14/Items/gas_mask_filter.rsi
    layers:
    - state: upp

- type: entity
  parent: CMUBaseGasMaskFilter
  id: CMUGasMaskFilterHAZOPS
  name: CBRN防毒面具滤毒罐
  description: 一个小小的金属气罐，里面装着一大块元素周期表。适用于涉及化学、生物、放射性或核危害的环境。
  components:
  - type: GasMaskFilter
    neurotoxinResist: true
    neurotoxinDamageMultiplier: 2.5 # 4 seconds
    orbitalGasProtectionSeconds: 15
    chemicalIrritantDamageMultiplier: 1.75 # 2 complete CN20 gas clouds and some extra
    baseIntegrity: 100
  - type: Sprite
    sprite: CMU14/Items/gas_mask_filter.rsi
    layers:
    - state: fancy

- type: entity
  parent: CMUBaseGasMaskFilter
  id: CMUGasMaskFilterWY
  name: WY X-16防毒面具滤毒罐
  description: 一个小金属气罐。你不知道里面装了什么。它可以过滤掉尚未被正式发现的化学物质。
  components:
  - type: GasMaskFilter
    neurotoxinResist: true
    neurotoxinDamageMultiplier: 1.25 # 8 seconds
    orbitalGasProtectionSeconds: 15
    chemicalIrritantDamageMultiplier: 1 # 4-ish CN20 gas clouds
    baseIntegrity: 100
  - type: Sprite
    sprite: CMU14/Items/gas_mask_filter.rsi
    layers:
    - state: wy