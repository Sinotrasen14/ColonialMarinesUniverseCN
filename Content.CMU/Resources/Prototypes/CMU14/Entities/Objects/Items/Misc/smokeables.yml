    sprite: CMU14/Items/Smokes/balaji_imperials.rsi

- type: entity
  parent: RMCCigarettePackLuckySloths
  id: AU14CigaretteKoorlander
  name: 克兰德烟包
  description: 最初作为基础必需品批量发放给地球化改造队，这种香烟易于点燃、燃烧均匀，提供直接而可靠的烟感。平淡而带有尘土味的口感以及稳定的吸阻，很快使其成为殖民地常备品。Koorlander后来在边疆农业星球扩大生产，并与殖民地管理局锁定了独家贸易协议。
  components:
  - type: Sprite
    sprite: CMU14/Items/Smokes/koorlander.rsi

- type: entity
  parent: RMCCigarettePackLuckySloths
  id: AU14CigaretteLadyFingers
  name: 库兰德女士手指饼干包
  description: 库兰德公司一次大胆的营销实验，这些粗犷、无滤嘴的薄荷香烟采用灰玫瑰色包装，瞄准殖民地女性。气味浓烈到有时被用来驱赶野战帐篷里的虫子。尽管费尽心思，它们却鲜有人问津，大多原封不动地躺在自动售货机里，默默挑衅着谁敢一试。至于是否真有人喜欢，那就是另一个问题了。
  components:
  - type: Sprite
    sprite: CMU14/Items/Smokes/lady_fingers.rsi
