  name: 巴拉克里希纳帝国包装
  description: 一包巴拉克帝国香烟。由巴拉克家族企业在三界帝国生产的手卷滤嘴香烟。历经六代仍由家族经营，该公司以将高级合成烟草与微量真烟叶混合而闻名。价格昂贵，口感顺滑，深受军官和走私者的喜爱。
