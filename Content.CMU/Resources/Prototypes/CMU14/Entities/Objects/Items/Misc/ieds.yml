- type: entity
  name: 简易爆炸背心
  description: 一件破旧的自杀式爆炸背心，旨在重创步兵。使用者将有去无回……
  parent: [RMCBaseJacket, BasePlasticExplosive, BaseSyndicateContraband]
  id: AU14IEDVest
  components:
  - type: Sprite
    sprite: CMU14/Clothing/CLF/pbied.rsi
    state: icon
    layers:
    - state: icon
      map: ["base"]
  - type: Clothing
    sprite: CMU14/Clothing/CLF/pbied.rsi
    slots:
    - OUTERCLOTHING
    quickEquip: false
    equipDelay: 10
    unequipDelay: 6
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
      cluster-payload: !type:Container
  - type: TimerTrigger
    keysIn:
    - trigger
    - stuck
    delay: 0.1
    delayOptions: [3, 4]
    initialBeepDelay: 0
    beepSound: /Audio/CMU14/IED/vestbeep.ogg
  - type: WornSlotTriggerCondition
    requiredSlots: OUTERCLOTHING
    keys:
    - trigger
    - stuck
  - type: PreventThrowWhenArmed
  - type: TriggerOnSignal
    port: Timer
  - type: DeviceLinkSink
    ports:
    - Timer
  - type: Explosive
    explosionType: CMUIED # FLOW-09: own tank blast multiplier; otherwise RMC.
    totalIntensity: 1500
    intensitySlope: 10
    maxIntensity: 100
    canCreateVacuum: false
  - type: ProjectileGrenade
    fillPrototype: CMProjectileShrapnel
    capacity: 40
  - type: GibOnTrigger
    keysIn:
    - timer
    deleteItems: false

- type: entity
  parent: CMPaperWritten
  id: AU14IEDGuide
  name: 简易爆炸物指南
  components:
  - type: Paper
    content: "1. Grab yerself an IED make sure it ain tickin.
      2. Plug it into yer phone usin that fancy access tuner thing I put in the equipment rack.
      3. Hide real good bu make sure you can see when dem feds are nearby your bomb.
      4. Use the phone to call the dam IED.
      5. Dont be standin there when it goes she blows fast.
      The big one will blow up a whole 7 or 8 meters I rekon. The small one youll hav to blow up closa maybe four or fiv. Try puttin em in a closet or somethin hide it well.
      Be careful it wil blow up if you touch it to much even after connectin it.
      If god forbid you chose to use the vest god speed an make it count. You hook it up the same way.
      Now I gotta get goin fore them feds find this place. for lif limb and libertie
      -Uncle Derek Totter"
