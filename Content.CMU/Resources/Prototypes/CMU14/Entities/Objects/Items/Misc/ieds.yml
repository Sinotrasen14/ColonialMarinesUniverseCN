- type: entity
  parent: RemoteSignaller
  id: AU14RemoteSignallerAdvanced
  name: 质子呼叫 XL 便携式电话
  description: 一台由维兰德-汤谷通信部门子公司制造的砖头手机。大概是从某个公司蠢货的死手里撬出来的。这一台正被用来拨号引爆CLF的IED。有人在侧面刻了“去他妈的联合美洲”。
  components:
  - type: Sprite
    sprite: CMU14/Items/IEDs/signaller.rsi
    state: advanced
  - type: Item
    inhandVisuals:
      left:
      - state: advanced-inhand-left
      right:
      - state: advanced-inhand-right
  - type: WirelessNetworkConnection
    range: 600
  - type: StaticPrice
    price: 30

- type: entity
  name: 简易爆炸装置
  description: 一种遥控炸药，旨在瘫痪步兵和轻装甲车辆。破坏者和叛乱分子最喜欢的恐怖工具。小心……它非常不稳定。
  parent: [BasePlasticExplosive, BaseSyndicateContraband]
  id: AU14IED
  components:
  - type: LandMine
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
        ents: []
        showEnts: False
        occludes: True
  - type: Item
    size: Huge
  - type: Sprite
    sprite: Objects/Weapons/Bombs/c4.rsi
    state: icon
    layers:
    - state: icon
      map: ["base"]
  - type: TimerTrigger
    keysIn:
    - trigger
    - stuck
    delay: 3
    delayOptions: [3, 4]
    initialBeepDelay: 2
    beepSound: /Audio/CMU14/IED/detonate.ogg
  - type: TriggerOnSignal
    port: Timer
  - type: DeviceLinkSink
    ports:
    - Timer
  # built to cripple light vehicles, credit the blast against hulls like a rocket
  - type: VehicleDamageMultiplier
    multiplier: 12
  - type: Explosive
    explosionType: CMUIED # FLOW-09: own tank blast multiplier; otherwise RMC.
    totalIntensity: 1400
    intensitySlope: 1.5
    maxIntensity: 80
    canCreateVacuum: false
  - type: ProjectileGrenade
    fillPrototype: CMProjectileShrapnel
    capacity: 25

