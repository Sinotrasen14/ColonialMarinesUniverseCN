- type: entity
  parent: CMBackpackMarine
  id: CMUDroneOperatorChoicePackFilled
  name: 无人机操作员部署包
  description: 包含一个无人机选择套件。部署后使用该套件选择人形无人机、火炮无人地面载具或火焰无人地面载具装备。
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Back/Backpacks/Marines/tech/jungle-desert-classic.rsi
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,29,2
  - type: StorageFill
    contents:
    - id: CMUDronePlatformKit

- type: entity
  parent: BaseItem
  id: CMUDronePlatformKit
  name: 无人机选择套件
  description: 使用此套件选择一种人形无人机、火炮无人地面载具或火焰无人地面载具组装包。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Storage/procase_mini.rsi
    state: closed
  - type: Item
    size: Small
  - type: CMUDronePlatformKit
  - type: ActivatableUI
    key: enum.CMUDronePlatformKitUi.Key
    inHandsOnly: false
    verbText: cmu-drone-platform-title
  - type: UserInterface
    interfaces:
      enum.CMUDronePlatformKitUi.Key:
        type: CMUDronePlatformKitBui

- type: entity
  parent: BaseItem
  id: CMUDroneControlTablet
  name: 无人机控制平板
  description: 一台加固型指挥部平板电脑，用于在短战术范围内链接并远程驾驶一台无人机仿生人或履带式战斗无人机。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/command_tablet.rsi
    state: cotablet
  - type: Item
    size: Small
  - type: CMUDroneControlTablet
    range: 30

- type: entity
  parent: CMBackpackMarine
  id: CMUDroneOperatorPackFilled
  name: 无人机操作员野战背包
  description: 一个紧凑的野战背包，随附无人机控制器、拆解的无人机仿生人框架、工具和可替换的无人机模块。
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Back/Backpacks/Marines/tech/jungle-desert-classic.rsi
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,29,2
  - type: StorageFill
    contents:
    - id: CMUDroneControlTablet
    - id: CMUDroneBodyFrame
    - id: CMUDroneHeadAssembly
    - id: CMUDroneLeftArmAssembly
    - id: CMUDroneRightArmAssembly
    - id: CMUDroneLeftLegAssembly
    - id: CMUDroneRightLegAssembly
    - id: CMUDroneSynthKey
    - id: CMScrewdriver
    - id: CMWrench
    - id: CMWelder
    - id: CMUDroneModuleCombat
    - id: CMUDroneModuleCare

- type: entity
  parent: BaseItem
  id: CMUDroneBodyFrame
  name: 无人机仿生人体框架
  description: 一个裸露的合成躯干框架，带有密封的肢体接口和一个空的激活插槽。
  components:
  - type: ContainerContainer
    containers:
      cmu-drone-frame-parts: !type:Container
        ents: []
        showEnts: False
        occludes: True
  - type: Sprite
    sprite: CMU14/Mobs/DroneAndroid/parts.rsi
    state: torso_m
  - type: Item
    size: Normal
  - type: CMUDroneFrame
    dronePrototype: CMUDroneAndroid

- type: entity
  abstract: true
  parent: BaseItem
  id: CMUDronePartBase
  name: 无人机安卓部件
  description: 一个用于无人机仿生人的剥离合成装配部件。
  components:
  - type: Sprite
    sprite: CMU14/Mobs/DroneAndroid/parts.rsi
  - type: Item
    size: Small

- type: entity
  parent: CMUDronePartBase
  id: CMUDroneHeadAssembly
  name: 无人机安卓头部
  description: 一个仅配备最基础传感器和控制硬件的裸露合成头部组件。
  components:
  - type: Sprite
    state: head_m
  - type: CMUDroneAssemblyPart
    part: Head

- type: entity
  parent: CMUDronePartBase
  id: CMUDroneLeftArmAssembly
  name: 无人机仿生人左臂
  description: 一个带有外露执行器束的左臂组件。
  components:
  - type: Sprite
    state: l_arm
  - type: CMUDroneAssemblyPart
    part: LeftArm

- type: entity
  parent: CMUDronePartBase
  id: CMUDroneRightArmAssembly
  name: 无人机安卓右臂
  description: 一个右臂组件，带有外露的执行器束。
  components:
  - type: Sprite
    state: r_arm
  - type: CMUDroneAssemblyPart
    part: RightArm

- type: entity
  parent: CMUDronePartBase
  id: CMUDroneLeftLegAssembly
  name: 无人机安卓左腿
  description: 一个带有强化膝关节舵机的左腿组件。
  components:
  - type: Sprite
    state: l_leg
  - type: CMUDroneAssemblyPart
    part: LeftLeg

- type: entity
  parent: CMUDronePartBase
  id: CMUDroneRightLegAssembly
  name: 无人机 仿生人 右腿
  description: 一个带有强化膝关节舵机的右腿组件。
  components:
  - type: Sprite
    state: r_leg
  - type: CMUDroneAssemblyPart
    part: RightLeg

- type: entity
  parent: BaseItem
  id: CMUDroneSynthKey
  name: 无人机合成器键
  description: 一把锁定的合成授权密钥，用于激活已完成的无人机仿生人框架。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/synth_token.rsi
    state: coin_synth
  - type: Item
    size: Tiny
  - type: CMUDroneSynthKey

- type: entity
  abstract: true
  parent: BaseItem
  id: CMUDroneModuleBase
  name: 无人机模块
  description: 一种可更换的控制模块，专为无人机仿生人的内部工具总线设计。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/module.rsi
    state: std_mod
  - type: Item
    size: Small
  - type: CMUDroneModule

- type: entity
  parent: CMUDroneModuleBase
  id: CMUDroneModuleCombat
  name: 无人机战斗模块
  description: 一个战术战斗模块，内置近身格斗与枪械作战程序。
  components:
  - type: Sprite
    state: mcontroller
  - type: CMUDroneModule
    skills:
      RMCSkillCqc: 4
      RMCSkillFirearms: 4

- type: entity
  parent: CMUDroneModuleBase
  id: CMUDroneModuleCare
  name: 无人机护理模块
  description: 一个医疗护理模块，搭载了医生级治疗和手术程序。
  components:
  - type: Sprite
    state: power_mod
  - type: CMUDroneModule
    skills:
      RMCSkillMedical: 4
      RMCSkillSurgery: 4
