- type: entity
  parent: CMUCombatDroneOperatorPackFilled
  id: CMUFlamerDroneOperatorPackFilled
  name: 火焰无人车操作员野战背包
  description: 一具喷火无人车车体、爪式焚烧器组件、两个燃料箱、控制器和维修补给。
  components:
  - type: StorageFill
    contents:
    - id: CMUDroneControlTablet
    - id: CMUFlamerDroneHull
    - id: CMUFlamerDroneTurretAssembly
    - id: CMUFlamerDroneFuelTank
      amount: 2
    - id: CMWelder
    - id: RMCCableCoil30

- type: entity
  parent: CMUCombatDroneHull
  id: CMUFlamerDroneHull
  name: 火焰无人车车体
  description: 一个折叠式履带底盘，带有铰接爪。将其放置在地面上，安装其爪式焚烧器组件，然后装入一个燃料气瓶即可使其上线。
  components:
  - type: ContainerContainer
    containers:
      cmu-combat-drone-turret: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: Sprite
    sprite: CMU14/Mobs/CombatDrone/flamer_ugv.rsi
    layers:
    - state: body
      color: "#9d9d9d"
      map: ["enum.CMUCombatDroneVisuals.Turret"]
  - type: GenericVisualizer
    visuals:
      enum.CMUCombatDroneVisuals.Turret:
        enum.CMUCombatDroneVisuals.Turret:
          True: {state: body, color: "#ffffff"}
          False: {state: body, color: "#9d9d9d"}
  - type: CMUCombatDroneHull
    weapon: Flamer
    dronePrototype: CMUFlamerDrone

- type: entity
  parent: BaseItem
  id: CMUFlamerDroneTurretAssembly
  name: 无人地面车爪式焚化器组件
  description: 一个用于火焰无人车铰接爪的燃料调节器和双火焰喷嘴。将其安装到火焰无人车车体上。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/m34.rsi
    state: base
  - type: Item
    size: Normal
  - type: CMUCombatDroneTurretAssembly
    weapon: Flamer

- type: entity
  parent: RMCTankFlamer
  id: CMUFlamerDroneFuelTank
  name: 无人车焚化炉燃料箱
  description: 火焰无人车的气瓶，容量200单位凝固汽油。可从兼容的燃料补给处重新加注。
  components:
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 200
        reagents:
        - ReagentId: RMCNapalmUT
          Quantity: 200
