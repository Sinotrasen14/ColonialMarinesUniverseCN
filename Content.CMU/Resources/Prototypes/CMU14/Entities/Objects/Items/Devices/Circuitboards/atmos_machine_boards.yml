- type: entity
  parent: BaseMachineCircuitboard
  id: CMUThermomachineFreezerMachineCircuitBoard
  name: 冷冻机温控机电路板
  description: 看起来你可以用螺丝刀来切换电路板类型。
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: CMUGasThermoMachineFreezer
    stackRequirements:
      CMSteel: 2
      RMCCable: 2
      CMGlass: 1
  - type: Construction
    deconstructionTarget: null
    graph: CMUThermomachineBoard
    node: freezer

- type: entity
  parent: BaseMachineCircuitboard
  id: CMUThermomachineHeaterMachineCircuitBoard
  name: 加热器恒温机电路板
  description: 看起来你可以用螺丝刀来切换电路板类型。
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: CMUGasThermoMachineHeater
    stackRequirements:
      CMSteel: 2
      RMCCable: 2
      CMGlass: 1
  - type: Construction
    deconstructionTarget: null
    graph: CMUThermomachineBoard
    node: heater

- type: entity
  parent: BaseMachineCircuitboard
  id: CMUCondenserMachineCircuitBoard
  name: 冷凝器机器电路板
  description: 冷凝器机器印刷电路板。
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: CMUGasCondenser
    stackRequirements:
      CMSteel: 2
      RMCCable: 2

- type: constructionGraph
  id: CMUThermomachineBoard
  start: freezer
  graph:
  - node: freezer
    entity: CMUThermomachineFreezerMachineCircuitBoard
    edges:
    - to: heater
      steps:
      - tool: Screwing
        doAfter: 2
  - node: heater
    entity: CMUThermomachineHeaterMachineCircuitBoard
    edges:
    - to: freezer
      steps:
      - tool: Screwing
        doAfter: 2

- type: entity
  parent: BaseMachineCircuitboard
  id: CMUExhaustVentMachineCircuitboard
  name: 排气通风机电路板
  description: 一个用于排气口的机器印刷电路板。
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: CMUExhaustVent
    stackRequirements:
      CMSteel: 1
      RMCCable: 1
