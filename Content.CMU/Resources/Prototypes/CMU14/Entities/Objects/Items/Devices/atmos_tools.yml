- type: entity
  parent: BaseItem
  name: '“金丝雀”AS-5大气扫描仪'
  id: CMUAtmosScanner
  description: 一个笨重、难用的装置。可读出当地的大气成分。外勤人员称它为“金丝雀”，得名于它所取代的那只鸟。与那只鸟不同，它只在你死的时候才会坏。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/atmos_scanner.rsi
    layers:
    - state: icon
  - type: GasAnalyzer
  - type: RMCLoreExaminable
    content: rmc-lore-examinable-atmospheric-composition-scanner
  - type: ActivatableUI
    inHandsOnly: true
    singleUser: true
    requireActiveHand: false
    key: enum.GasAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.GasAnalyzerUiKey.Key:
        type: GasAnalyzerBoundUserInterface
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.GasAnalyzerVisuals.Enabled:
        enabled:
          True: { state: working }
          False: { state: icon }
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 30
      CMGlass: 20

- type: entity
  parent: trayScanner
  id: CMTRayScanner
  name: '“深耳”PS-9脉冲测量单元'
  description: 一台笨重的勘测设备。它通过甲板发出低频声波，将地板下的基础设施、管道和电缆一并绘制到一块小小的绿色CRT上。那本四磅重的手册向你保证，操作它绝对安全。
  suffix: trayScanner
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Tools/t-ray.rsi
    layers:
    - state: tray-off
      map: [ "base" ]
  - type: TrayScanner
    range: 1
  - type: Item
    sprite: _RMC14/Objects/Tools/t-ray.rsi
    storedRotation: 0
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TrayScannerVisual.Visual:
        base:
          On: { state: tray-on }
          Off: { state: tray-off }
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_RMC14/Handling/multitool_pickup.ogg
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Items/multitool_drop.ogg
      params:
        volume: -4
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/multitool_drop.ogg
      params:
        volume: -4
