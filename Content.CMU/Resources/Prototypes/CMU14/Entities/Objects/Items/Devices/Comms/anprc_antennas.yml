- type: entity
  abstract: true
  id: ANPRCAntennaBase
  name: AN/PRC-117G天线
  parent: BaseItem
  components:
  - type: Item
    size: Small

- type: entity
  parent: ANPRCAntennaBase
  id: ANPRCWhipAntenna
  name: AN/PRC-117G鞭状天线
  description: >-
    一种柔性钢带鞭状天线，是便携式电台的标准配置。可绕开灌木丛和门框弯曲而不会折断。
  components:
  - type: Sprite
    sprite: CMU14/Objects/Radio/anprc117g.rsi
    state: antenna_w
  - type: ANPRCAntenna
    label: anprc-antenna-whip
    fullRange: 30
    partialRange: 45
    requiresStationary: false

- type: entity
  parent: ANPRCAntennaBase
  id: ANPRCWireAntenna
  name: 简易线状天线
  description: >-
    一卷绝缘线、一个陶瓷绝缘子和一段伞绳。把它抛过树枝或椽子，就能把网固定在一起，在装进包里时看起来就像废料，直到被拉起来才显眼。
  components:
  - type: Sprite
    sprite: CMU14/Objects/Radio/anprc117g.rsi
    state: antenna_w
  - type: ANPRCAntenna
    label: anprc-antenna-wire
    fullRange: 35
    partialRange: 50
    requiresStationary: true
    movingRangeMultiplier: 0.5

- type: entity
  parent: ANPRCAntennaBase
  id: ANPRCMastAntenna
  name: AN/PRC-117G桅杆天线
  description: >-
    可折叠高增益桅杆天线。用于架设在指挥部或转发站上方，而非在巡逻中随身携带。
  components:
  - type: Sprite
    sprite: CMU14/Objects/Radio/anprc117g.rsi
    state: antenna_m
  - type: ANPRCAntenna
    label: anprc-antenna-mast
    fullRange: 55
    partialRange: 80
    requiresStationary: true
    movingRangeMultiplier: 0.5
