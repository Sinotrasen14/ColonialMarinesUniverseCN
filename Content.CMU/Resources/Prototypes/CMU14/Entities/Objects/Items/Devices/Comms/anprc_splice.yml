- type: entity
  parent: BaseItem
  id: AU14CLFNetSpliceKit
  name: 网络拼接套件
  suffix: CLF, Sapper
  description: >-
    一个从偷来的馈线电缆中绕出的分接抽头、一个密钥模块，以及一台由原本并非配套的零件拼凑而成的频段示波器。把它夹到桅杆的馈线上，然后去寻找主干载波。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/sentrycomp.rsi
    state: sentrycomp_cl
    color: "#7a6a4a"
  - type: Item
    size: Small
  - type: AU14NetSpliceKit

- type: entity
  parent: BaseStructure
  id: AU14CLFNetSpliceTap
  name: 馈线分接
  suffix: CLF
  description: >-
    一个接线盒接入桅杆的馈线，自顾自地嗡嗡作响。它和其余硬件格格不入。
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _RMC14/Objects/Devices/sentrycomp.rsi
    state: sentrycomp_on
    color: "#8a7a5a"
    drawdepth: SmallObjects
    scale: 0.8, 0.8
    offset: 0.25, -0.15
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 40
        mask:
        - None
  - type: Damageable
    damageModifierSet:
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: AU14NetSpliceTap
