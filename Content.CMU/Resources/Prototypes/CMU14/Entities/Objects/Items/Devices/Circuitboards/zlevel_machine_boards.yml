# Machine boards for the cross-deck z-level infrastructure: opening vents,
# pipe risers, power risers, and the automatic transfer switch.
# Parts pools only use stacks obtainable in CM rounds: CMSteel, RMCCable,
# CMGlass. Upstream Manipulator/Cable/Glass are R&D or NT-supply goods this
# fork never stocks, and empty pools build for free.
- type: entity
  parent: CMBaseMachineCircuitboard
  id: CMUOpeningVentMachineCircuitboard
  name: 打开排气机电路板
  description: 一个用于跨甲板通风口的机器印刷电路板。
  components:
  - type: Sprite
    state: power_mod
  - type: MachineBoard
    prototype: CMUOpeningVentDown
    stackRequirements:
      CMSteel: 1
      RMCCable: 1

- type: entity
  parent: CMBaseMachineCircuitboard
  id: CMUPipeRiserMachineCircuitboard
  name: 管道立管机电路板
  description: 用于跨甲板管道立管的机器印刷电路板。
  components:
  - type: Sprite
    state: power_mod
  - type: MachineBoard
    prototype: CMUPipeRiserUp
    stackRequirements:
      CMSteel: 1
      RMCCable: 1

- type: entity
  parent: CMBaseMachineCircuitboard
  id: CMUPowerRiserMachineCircuitboard
  name: 电源转接板机器电路板
  description: 一种用于跨甲板高压电力竖井的机器印刷电路板。
  components:
  - type: Sprite
    state: power_mod
  - type: MachineBoard
    prototype: CMUPowerRiserDown
    stackRequirements:
      CMSteel: 2
      RMCCable: 2

- type: entity
  parent: CMBaseMachineCircuitboard
  id: CMUAutoTransferSwitchMachineCircuitboard
  name: 自动转换开关机器板
  description: 自动转换开关的机器印刷电路板。
  components:
  - type: Sprite
    state: power_mod
  - type: MachineBoard
    prototype: CMUAutoTransferSwitch
    stackRequirements:
      CMSteel: 1
      RMCCable: 2
      CMGlass: 1
