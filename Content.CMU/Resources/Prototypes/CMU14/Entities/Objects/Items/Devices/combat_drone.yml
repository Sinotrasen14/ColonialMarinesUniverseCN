- type: entity
  parent: CMBackpackMarine
  id: CMUCombatDroneOperatorPackFilled
  name: 枪械无人地面载具操作员野战包
  description: 一套履带式战斗无人机套件，包含车体、脉冲炮塔、标准弹药箱和穿甲弹药箱、控制器以及维修补给品。
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Back/Backpacks/Marines/tech/jungle-desert-classic.rsi
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,29,2
  - type: StorageFill
    contents:
    - id: CMUDroneControlTablet
    - id: CMUCombatDroneHull
    - id: CMUCombatDroneTurretAssembly
    - id: CMUCombatDroneAmmoBox
    - id: CMUCombatDroneAmmoBoxAP
    - id: CMWelder
    - id: RMCCableCoil30

- type: entity
  parent: BaseItem
  id: CMUCombatDroneHull
  name: 枪械无人地面载具车体
  description: 一个折叠式履带底盘。将其放置在地面上，安装其脉冲炮塔，然后装入标准或AP弹药箱即可使其上线。
  components:
  - type: ContainerContainer
    containers:
      cmu-combat-drone-turret: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: Sprite
    sprite: CMU14/Mobs/CombatDrone/ugv.rsi
    layers:
    - state: healthy-hull
      map: ["enum.CMUCombatDroneVisuals.Turret"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CMUCombatDroneVisuals.Turret:
        enum.CMUCombatDroneVisuals.Turret:
          True: {state: healthy}
          False: {state: healthy-hull}
  - type: Item
    size: Normal
  - type: CMUCombatDroneHull

- type: entity
  parent: BaseItem
  id: CMUCombatDroneTurretAssembly
  name: 战斗无人机脉冲炮塔
  description: 一座紧凑型M41A型脉冲炮塔，配备固定IFF互锁装置和180度前向射击弧。将其安装在战斗无人机机身上。
  components:
  - type: Sprite
    sprite: CMU14/Mobs/CombatDrone/ugv.rsi
    state: healthy-turret
  - type: Item
    size: Normal
  - type: CMUCombatDroneTurretAssembly

- type: entity
  parent: CMMagazineRifleBase
  id: CMUCombatDroneAmmoBox
  name: 战斗无人机弹药箱（10x24毫米）
  description: 一盒200发标准M41A弹药，用于战斗无人机脉冲炮塔。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/un571c.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Normal
  - type: CMUCombatDroneAmmoBox
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
    zeroOnlyOnEmpty: true
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags: [CMCartridgeRifle10x24mm]
    proto: CMCartridgeRifle10x24mm
    capacity: 200
  - type: Tag
    tags: [CMUCombatDroneAmmoBox]

- type: entity
  parent: CMUCombatDroneAmmoBox
  id: CMUCombatDroneAmmoBoxAP
  name: 战斗无人机AP弹药箱（10x24mm）
  description: 一盒200发装的M41A穿甲弹药，用于战斗无人机脉冲炮塔。
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags: [CMCartridgeRifle10x24mmAP]
    proto: CMCartridgeRifle10x24mmAP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
      color: "#85b085"
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: Tag
  id: CMUCombatDroneAmmoBox
