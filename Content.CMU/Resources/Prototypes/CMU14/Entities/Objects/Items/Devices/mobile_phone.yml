- type: entity
  parent: BaseItem
  id: CMUMobilePhone
  name: 手机
  description: 一部ProtonCall XL便携式电话。一部Weyland-Yutani的砖头手机，用于拨打殖民地周围的其他电话。拿在手中可用于拨打、接听或挂断。来电者名称可用螺丝刀更改。
  components:
  - type: Sprite
    sprite: CMU14/Items/IEDs/signaller.rsi
    state: advanced
  - type: Item
    size: Small
    inhandVisuals:
      left:
      - state: advanced-inhand-left
      right:
      - state: advanced-inhand-right
  - type: CMUMobilePhone
  - type: RotaryPhone
    category: Mobile Phones
    canDnd: true
    tryGetHolderName: false
  - type: UserInterface
    interfaces:
      enum.RMCTelephoneUiKey.Key:
        type: CMUMobilePhoneBui
  - type: ActivatableUIBlacklist
    blacklist:
      components:
      - Xeno
  - type: StaticPrice
    price: 30
