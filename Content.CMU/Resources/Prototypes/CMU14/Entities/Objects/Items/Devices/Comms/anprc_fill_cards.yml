- type: entity
  abstract: true
  id: ANPRCFillCard
  name: 通信保密填充卡
  description: 一张用于AN/PRC-117G无线电的加固型密码填充卡。比它所插入的无线电还值钱。
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/synth_reset_key.rsi
    state: reset_key
  - type: Item
    size: Tiny
  - type: ANPRCFillCard

- type: entity
  parent: ANPRCFillCard
  id: ANPRCFillCardGOVFOR
  name: 政府专用通信保密填充卡
  description: >-
    一张GOVFOR KY-99A密码填充卡。信号部门财产，遗失必须立即上报，没人想经历接下来的后果。
  components:
  - type: ANPRCFillCard
    faction: govfor
    designation: KY-99A

- type: entity
  parent: ANPRCFillCard
  id: ANPRCFillCardOPFOR
  name: 敌方通信保密填充卡
  description: >-
    一张假想敌的KY-58加密填充卡。序列号被反复盖印了三次以上。
  components:
  - type: ANPRCFillCard
    faction: opfor
    designation: KY-58

- type: entity
  parent: ANPRCFillCard
  id: ANPRCFillCardCLF
  name: INSFOR通信保密填充卡
  description: >-
    一张INSFOR KY-38密码填充卡，虽有磨损，却被精心呵护。它比无线电更难替换，这一点人尽皆知。
  components:
  - type: ANPRCFillCard
    faction: clf
    designation: KY-38

# vendor and requisitions stock. keys itself to the side of the ship it turns up on, or of
# the first marine to pick it up (ANPRCSideKeyingSystem)
- type: entity
  parent: ANPRCFillCard
  id: ANPRCFillCardIssued
  name: 通信保密填充卡（未加密）
  suffix: Issue, keys to side
  description: >-
    一张刚从信号部门取出的加密填充卡，正等待装入持有者所效忠那一方的密钥。
  components:
  - type: ANPRCSideKeyed
    variants:
      govfor: ANPRCFillCardGOVFOR
      opfor: ANPRCFillCardOPFOR
