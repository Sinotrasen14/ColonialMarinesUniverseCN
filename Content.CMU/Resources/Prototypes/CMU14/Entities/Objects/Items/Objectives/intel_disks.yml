- type: entity
  parent: RMCIntelBase
  id: CMUIntelDataDisk
  name: 加密数据磁盘
  description: 一个装满乱序数据的计算机磁盘。分析仪无法解读它；需要在情报计算机上破解。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/computer_disks.rsi
    state: disk3
  - type: Item
    size: Tiny
    sprite: _RMC14/Objects/Misc/computer_disks.rsi
    inhandVisuals:
      left:
      - state: disk3-inhand-left
      right:
      - state: disk3-inhand-right
  - type: Tag
    tags:
    - RMCDataDisk
  - type: CMUIntelDataDisk
    value: 1
  - type: UserInterface
    interfaces:
      enum.CMUIntelDecryptUiKey.Key:
        type: CMUIntelDecryptBui
