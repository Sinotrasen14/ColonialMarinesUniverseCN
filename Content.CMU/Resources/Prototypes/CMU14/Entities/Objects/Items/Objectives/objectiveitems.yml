- type: entity
  id: AU14ObjectiveItemAIProcessor
  parent: RMCAICoreProcessor
  name: AI处理器
  description: 一个用于AI的外部处理器，用于处理海量信息。
  placement:
    mode: SnapgridCenter
  components:
  - type: IntelDetectorTracked # objective items show on intel detectors
  - type: InteractionOutline
  - type: Clickable
  - type: Corrodible
    isCorrodible: false
  - type: ApcPowerReceiver
    powerLoad: 250
    needsPower: true
  - type: RMCPowerReceiver
    idleLoad: 5
    activeLoad: 10
    channel: Equipment
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/aicoremachinery.rsi
    layers:
    - state: cpu_off
    - state: cpu
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 168
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: AU14ObjectiveItemHackableComputer
  parent: BaseItem
  name: "外勤操作计算机"
  description: 一台加固型军用笔记本电脑，内含加密通信数据。可对其进行黑客攻击以提取关键情报。
  components:
  - type: IntelDetectorTracked # objective items show on intel detectors
  - type: Item
    size: Normal
  - type: Sprite
    sprite: CMU14/Items/laptop.rsi
    state: laptop_off
  - type: Corrodible
    isCorrodible: false
