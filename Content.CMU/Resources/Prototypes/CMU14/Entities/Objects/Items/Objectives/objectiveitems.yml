- type: entity
  parent: BaseItem
  id: AU14ObjectiveItemPortableRadioTransceiver
  name: "AN/PRC-982便携式无线电收发两用机箱"
  description: 一个灰色的无线电盒，用于接收远程通信。它还会记录其接收到的所有无线电通信内容。
  components:
  - type: IntelDetectorTracked # objective items show on intel detectors
  - type: Item
    size: Small
  - type: Sprite
    sprite:  CMU14/Items/objectiveprops.rsi
    state: objective1
  - type: Corrodible
    isCorrodible: false

- type: entity
  parent: BaseItem
  id: AU14ObjectiveItemBlackboxRecorder
  name: "CIR-60“黑匣子”殖民地信息记录仪"
  description: 一个记录殖民地公告、殖民者死亡以及其他关键读数的小红盒。通常被称为黑匣子，尽管这个盒子是血红色的。
  components:
  - type: CMUIntelSurveyOnAnalyze # prints the top intel areas when recovered at an Analyzer
  - type: IntelDetectorTracked # objective items show on intel detectors
  - type: Item
    size: Normal
  - type: Sprite
    sprite:  CMU14/Items/objectiveprops.rsi
    state: objective2
  - type: Corrodible
    isCorrodible: false

- type: entity
  parent: BaseItem
  id: AU14ObjectiveItemAtmosphericRadarStorageUnit
  name: "ARCS-9大气雷达数据存储单元"
  description: 一个用于存储大气雷达阵列信息的黑色数据盒。
  components:
  - type: IntelDetectorTracked # objective items show on intel detectors
  - type: Item
    size: Large
  - type: Sprite
    sprite:  CMU14/Items/objectiveprops.rsi
