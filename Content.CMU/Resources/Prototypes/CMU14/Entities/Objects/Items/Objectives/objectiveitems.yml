- type: entity
  parent: BaseItem
  id: AU14ObjectiveItemWYLaptop
  name: 维兰德-汤谷科研部笔记本电脑
  description: 一台便携式计算机，内含韦兰-尤坦尼公司的科研部数据。设有密码保护并经过加密，破解起来要费不少功夫。
  components:
  - type: IntelDetectorTracked # objective items show on intel detectors
  - type: Item
    size: Normal
  - type: Sprite
    sprite:  CMU14/Items/laptop.rsi
    state: laptop_off_objective
  - type: Corrodible
    isCorrodible: false

- type: entity
