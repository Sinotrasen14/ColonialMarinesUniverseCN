# ├──[ Aegis | Warhead ]─────────────────────────────────────────────┤
- type: entity
  parent: RMCCrateSupply
  id: CMUCrateAegisLobby
  name: “神盾”追踪设备板条箱（3个定位器，1本手册）
  description: 一个货运部板条箱，内含AEGIS ID追踪设备和文件。
  components:
  - type: StorageFill
    contents:
    - id: CMUPinpointerAegisID
      amount: 3
    - id: CMPamphletPowerloader
      amount: 1

- type: entity
  parent: RMCPinpointerBase
  id: CMUPinpointerAegisID
  suffix: AEGIS
  components:
  - type: Pinpointer
    component: AegisTrackable
    targetName: AEGIS ID card

# Spawners
- type: entity
  parent: RMCAegisSpawner
  id: CMUAegisSpawner
  name: AEGIS 核弹生成
  suffix: CMU, Add to Warship/Planet

- type: entity
  parent: RMCAegisCorpseSpawner
  id: CMUAegisCorpseSpawner
  name: AEGIS尸体生成 - 科学家
  suffix: CMU, Id Unlocks AEGIS

# Warhead
- type: entity
  parent: RMCOrbitalCannonWarheadAegis
  id: CMUOrbitalCannonWarheadAegis
  description: "AEG-538-KRA，即KRAKEN，一种实验性基于phoron的轨道弹头，直接来自AEGIS的研究与开发部。设计用于对付单个轨道弹头远远不够的目标。"
  name:  AEG-538-KRA
  suffix: CMU
  components:
  - type: OrbitalCannonWarhead
    explosion: CMUOrbitalCannonExplosionAegis
    isAegis: true
    firstWarningRange: 60
    secondWarningRange: 55
    thirdWarningRange: 45
    intelPointsAwarded: 5

# Warhead Explosion
- type: entity
  parent: MarkerBase
  id: CMUOrbitalCannonExplosionAegis
  name: 疯狂的爆炸性宙斯盾OB爆炸
  suffix: CMU, FIRES AN OB!!!
  components:
  - type: OrbitalCannonExplosion
    multiZ: true
    steps:
    - type: RMCOBXenoTunnel
      total: 120000
      slope: 6000
      max: 600
      delay: 0.5
    - type: RMCOBXenoTunnel
      total: 600000
      slope: 60
      max: 450
      delay: 0.3
    - type: RMCOBXenoTunnel
      total: 280000
      slope: 40
      max: 350
      delay: 0.4
    - fire: CMUTileFireOBAegis
      fireRange: 55
  - type: WarpPoint
    location: cmu-warp-location-orbital-bombardment-one

# Warhead Tile Fire
- type: entity
  parent: RMCTileFireOBAegis
  id: CMUTileFireOBAegis
  suffix: CMU
  components:
  - type: RMCIgniteOnCollide
    intensity: 240
    duration: 200
    maxStacks: 40
    burnColor: "#ffd700"
    tileDamage:
      types:
        Heat: 3
  - type: TileFire
    id: CMUTileFireOBAegis
    extinguishInstantly: false
