# Medical oxygen tank: the anesthetic tank's body, filled with pure oxygen for patients on internals.
- type: entity
  parent: CMAnestheticTank
  id: CMUMedicalOxygenTank
  name: 医用氧气瓶
  description: 一瓶纯医用氧气。通过呼吸面罩让患者使用，以帮助他们从窒息伤中恢复。

- type: entity
  parent: CMUMedicalOxygenTank
  id: CMUMedicalOxygenTankFilled
  suffix: Filled
  components:
  - type: GasTank
    releasePressure: 21.3
    air:
      # same fill as the standard oxygen tank, about 31 minutes
      volume: 5
      moles:
      - 2.051379050 # oxygen
      temperature: 293.15
