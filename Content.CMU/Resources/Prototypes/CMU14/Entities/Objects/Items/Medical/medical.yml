    inhandVisuals:
      left:
      - state: qc_left
      right:
      - state: qc_right

- type: entity
  parent: CMBaseHealingItem
  id: AU14HemostaticGauze
  name: 止血纱布
  description: 一条浸有粉末状凝血剂的纱布条。一旦拆开包装，就意味着抢救时间开始倒数，把它深深塞进伤口，在还来得及之前止住出血。
  components:
  - type: Tag
    tags:
    - Brutepack
  - type: Sprite
    sprite: CMU14/Items/quickclot.rsi
    state: hemgauze
  - type: Item
    sprite: CMU14/Items/quickclot.rsi
    inhandVisuals:
      left:
      - state: hemgauze_left
      right:
      - state: hemgauze_right
