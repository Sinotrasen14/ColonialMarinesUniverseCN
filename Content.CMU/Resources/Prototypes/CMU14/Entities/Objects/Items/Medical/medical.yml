- type: entity
  parent: CMBaseHealingItem
  id: AU14HemostaticGauzePacket
  name: 止血纱布包
  description: 一包真空密封的化学处理纱布，专为快速止住动脉出血而设计。那粉末烧得跟地狱一样疼，但确实管用。一次性使用。撕开，塞进去，然后祈祷好运。
  components:
  - type: Sprite
    sprite: CMU14/Items/quickclot.rsi
    state: quickclot
