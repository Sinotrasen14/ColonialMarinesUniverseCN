#new medicines
- type: reagent
  parent: [ CMReagentMedicine, Dexalin ]
  id: AU14Albuterol
  name: reagent-name-albuterol
  desc: reagent-desc-albuterol
  color: "#1f83a7"
  overdose: 20
  metabolisms:
    Bloodstream:
      metabolismRate: 0.04
      effects:
      - !type:EqualHealthChange
        damage:
        - Airloss: -4
      - !type:ClearRespiratoryStrain
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          min: 20
        damage:
          types:
            Poison: 0.25
            Radiation: 0.25
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          min: 30
        damage:
          types:
            Blunt: 0.33
            Slash: 0.33
            Piercing: 0.34
            Poison: 1
            Radiation: 1

- type: reagent
  parent: [ CMReagentMedicine, DexalinPlus ]
  id: AU14Naloxone
  name: reagent-name-cmnaloxone
  desc: reagent-desc-cmnaloxone
  color: "#a3adbf"
  overdose: 200
  metabolisms:
    Bloodstream:
      metabolismRate: 0.02
      effects:
      - !type:RemoveDamage
        group: Toxin
      - !type:CureDrugAllergyReaction
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          min: 15
        damage:
          types:
            Poison: 0.37
            Radiation: 0.38
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          min: 25
        damage:
          types:
            Blunt: 0.5
            Slash: 0.5
            Piercing: 0.5
            Poison: 1.5
            Radiation: 1.5
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: CMUParacetamol
          min: 1
      - !type:AdjustReagent
        reagent: CMUParacetamol
        amount: -1000
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: CMUTramadol
          min: 1
      - !type:AdjustReagent
        reagent: CMUTramadol
        amount: -1000
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: CMUOxycodone
          min: 1
      - !type:AdjustReagent
        reagent: CMUOxycodone
        amount: -1000
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: CMUFentanyl
          min: 1
      - !type:AdjustReagent
        reagent: CMUFentanyl
        amount: -1000
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: CMUSleen
          min: 1
      - !type:AdjustReagent
        reagent: CMUSleen
        amount: -1000
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: CMUSoporific
          min: 1
      - !type:AdjustReagent
        reagent: CMUSoporific
        amount: -1000

#injectors
- type: entity
  parent: CMAutoInjector
  id: AU14NaloxoneAutoInjector
  name: 纳洛酮自动注射器
  description: 一支装有纳洛酮的自动注射器，用于立即抵消毒素伤。主要用于治疗用药过量。无需任何训练即可使用。
  components:
  - type: Sprite
    sprite: CMU14/Items/naloxone_auto_injector.rsi
    layers:
    - state: autoinjector
    - state: autoinjector1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: null
  - type: Hypospray
    transferAmount: 3
    injectSound: /Audio/_RMC14/Medical/air_release.ogg
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 3
        reagents:
        - ReagentId: AU14Naloxone
          Quantity: 3
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
  - type: MedicallyUnskilledDoAfter
    min: 0
    doAfter: 0
  - type: IconLabel
    labelTextLocId: AU14-naloxone-medicine-container-label-text

