- type: entity
  parent: CMBaseHealingItem
  id: AU14Tourniquet
  name: 止血带
  description: 一种为在交火中自行使用而设计的战斗应用止血带。它使用高张力魔术贴束带和绞盘杆来切断四肢的动脉出血。有效、疼痛，而且并不温和。过度使用可能导致神经损伤或截肢。不过，残废总比死了好。设计为一次性使用，但紧急情况下也可以重复使用。
  components:
  - type: Tag
    tags:
    - Brutepack
  - type: Sprite
    sprite: Objects/Specific/Medical/medical.rsi
    state: tourniquet
  - type: Item
    sprite: Objects/Specific/Medical/medical.rsi
    inhandVisuals:
      left:
      - state: tourniquet-inhand-left
      right:
      - state: tourniquet-inhand-right
  - type: CMUTourniquetItem
    applyDelay: 1.5
    removeDelay: 1.0
    consumedOnApply: true
    refundOnRemove: AU14Tourniquet
