- type: entity
  parent: BaseItem
  id: CMUUniversalPaperTool
  name: 通用纸张工具
  description: 由韦兰-尤塔尼公司通信与研发部制造的小型文件伪造装置。专为快速现场办公设计，可接受标准纸张，并从其内部模板库中打印预先授权的企业、军事和政府信笺。不要问墨水从何而来。
  components:
  - type: ContainerContainer
    containers:
      paper_slot: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: Sprite
    sprite: CMU14/Items/universal_paper_tool.rsi
    state: icon
  - type: Item
    size: Small
    sprite: CMU14/Items/universal_paper_tool.rsi
  - type: ActivatableUI
    key: enum.UniversalPaperToolUiKey.Key
    requiresComplex: false
  - type: UserInterface
    interfaces:
      enum.UniversalPaperToolUiKey.Key:
        type: UniversalPaperToolBui
  - type: ItemSlots
    slots:
      paper_slot:
        name: cmu-universal-paper-tool-paper-slot-name
        insertSound: /Audio/Machines/terminal_insert_disc.ogg
        ejectSound: /Audio/Machines/tray_eject.ogg
        insertOnInteract: true
        ejectOnInteract: false
        whitelist:
          tags:
          - Paper
        insertSuccessPopup: cmu-universal-paper-tool-paper-inserted
        whitelistFailPopup: cmu-universal-paper-tool-paper-invalid
  - type: UniversalPaperTool
    printSound:
      path: /Audio/Machines/short_print_and_rip.ogg
    templates:
    - prototype: CMUPaperBase #Regular papers
      name: 白皮书
      description: 一张清爽明亮、外观经典的纸张。
    - prototype: CMUPaperCream
      name: 奶油纸
      description: 一张暖色调的纸张，质感柔和优雅。
    - prototype: CMUPaperBlue
