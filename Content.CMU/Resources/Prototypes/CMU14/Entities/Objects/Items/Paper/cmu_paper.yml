# ICSC
- type: entity
  parent: CMPaper
  id: CMUPaperICSC
  name: ICSC论文
  description: 带有独立核心系统殖民地信头的论文。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/paper.rsi
    layers:
    - state: paper
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: icsc_letterhead
      visible: true
    - state: paper_stamped
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    headerImagePath: "/Textures/CMU14/Interface/Paper/ICSCHeader.png"
    backgroundImagePath: "/Textures/CMU14/Interface/Paper/paper_bkg.png"
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    footerImagePath: "/Textures/CMU14/Interface/Paper/ICSCFooter.png"
    footerMargin: 0, 40, 0, 0

