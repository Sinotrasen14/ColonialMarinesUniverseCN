- type: entity
  id: CMUPaperSlipBase
  parent: CMPaper
  name: 纸片
  description: 一张普通的纸条。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/paper.rsi
    layers:
    - state: paper_slip
    - state: paper_slip_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamped
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: Item
    size: Tiny
    sprite: _RMC14/Objects/Misc/paper.rsi
    heldPrefix: paper_slip
  - type: Paper
    contentSize: 1000
  - type: PaperVisuals
    backgroundImagePath: "/Textures/CMU14/Interface/Paper/NoteSlip.png"
    backgroundModulate: "#eaedde"
    maxWritableArea: 300, 300
    contentMargin: 20, 40, 60, 30

- type: entity
  parent: CMPaper
  id: CMUPaperBase
  name: 论文
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/paper.rsi
    layers:
    - state: paper
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamped
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    backgroundImagePath: "/Textures/CMU14/Interface/Paper/paper_bkg.png"
    backgroundModulate: "#eaedde"
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    defaultTextColor: "#ffffff"

# DEDICATED PAPER SLIPS /*//////////////////////////////////////////////////

- type: entity
  id: CMUPaperSlipMedication
  parent: CMUPaperSlipBase
  name: 用药单
  suffix: Purple
  description: 红十字国际委员会制作的标准处方单。医务人员用于授权、追踪并严格配给受管制药品的分发。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/paper.rsi
    layers:
    - state: paper_slip
      color: "#dbbce3"
    - state: paper_slip_words
      map: ["enum.PaperVisualLayers.Writing"]
      color: "#dbbce3"
      visible: false
    - state: paper_stamped
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: Item
    size: Tiny
    sprite: _RMC14/Objects/Misc/paper.rsi
    heldPrefix: paper_slip
  - type: Paper
    contentSize: 600
    content: |
      [color=#1a1a1a][bold]MEDICATION AUTHORIZATION[/bold]
      [bold]Patient Name:[/bold] [form]
      [bold]Medication:[/bold] [form]
      [bold]Dosage/Amount:[/bold] [form]
      [bold]Notes / Instructions:[/bold]
      [form]
      [bold]Attending Physician:[/bold]
      [signature][/color]
  - type: PaperVisuals
    backgroundImagePath: "/Textures/CMU14/Interface/Paper/MedicalSlip.png" #"/Textures/Interface/CMUPaper/MedicalSlip.png"
    backgroundModulate: "#dbbce3"
    maxWritableArea: 300, 300
    contentMargin: 20, 25, 10, 10

