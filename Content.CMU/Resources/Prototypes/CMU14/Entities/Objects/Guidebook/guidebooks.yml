# LAWS (marine)
- type: entity
  parent: RMCGuidebookBase
  id: AU14GuidebookLawMarine
  name: 统一军事司法法典
  description: "通常是军队中任何宪兵成员最爱读的书，其全部意义在于充当在众多军队舰船上挥舞的正义之剑的天平，从而维护和平与秩序。它的昵称可能包括但不限于：魔鬼红皮书、万罪圣经、那本书、UCMJ、红砖、酷刑手册、万罪红魔鬼酷刑圣经。"
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Books/Other/marine_law.rsi
  - type: GuideHelp
    guides:
    - AU14UCMJ

# LAWS (colonial)
- type: entity
  parent: RMCGuidebookBase
  id: AU14GuidebookLawColonial
  name: 殖民地民法典
  description: "一本厚重、被翻得卷边却破损不堪的书，上面盖有轨道法庭和殖民地管理署的印章。这是《殖民地民法典》的历史初版，印刷于最新改革之前很久。其书页被认为已然过时，满是现代法学家以可疑的法律推理加以质疑的先例，以及从未更新过的条款。没有两位律师能就其中一半内容的实际含义达成一致，然而每个殖民地办公室似乎都有一本，它仍在流通，提醒着人们法律是活的事物。它被亲切地称为：“蓝皮书”。"
  components:
  - type: Sprite
    sprite: CMU14/Objects/Misc/Books/cclaw.rsi
  - type: GuideHelp
    guides:
    - AU14CCLaw

