- type: entity
  parent: RMCBriefcase
  id: AU14BriefcaseLawBundle
  name: 顾问的法律文件包
  description: "一个结实的棕色公文包，里面装着殖民地全套法律藏书：殖民地民法典（蓝皮书）、统一军事司法法典（魔鬼红皮书）、标准作业程序，以及官僚法律武器。律师们称之为“顾问的重负”，其他人则直接叫它装满麻烦的公文包。一个初出茅庐的法律头脑所需的一切，用来靠技术性细节毁掉别人的一天。"
  components:
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,20,1
    whitelist:
      components:
        - UniversalPaperTool
      tags:
        - Book
        - Document
        - Write
        - Paper
        - Folder
        - Stamp
  - type: StorageFill
    contents:
      - id: AU14GuidebookLawMarine
      - id: AU14GuidebookLawColonial
      - id: AU14GuidebookSOP
      - id: CMPenFountain
      - id: AU14StampOrbitalCnsl
      - id: CMFolderBlue
      - id: CMStampApproved
      - id: CMStampDenied
      - id: CMClipboard
      - id: CMUUniversalPaperTool
