# Ported from cmss13-devs/cmss13#11776 (Lore Plaque + Galaxy Map)

- type: entity
  parent: BaseItem
  id: CMUGalaxyMap
  name: 银河地图
  description: 银河系示意图，按星区划分。
  components:
  - type: Sprite
    sprite: CMU14/HunterShip/obj/items/paper.rsi
    state: map
    color: "#005eab"
  - type: Item
    size: Small
  - type: GuideHelp
    openOnActivation: true
    guides:
    - CMUGuideLoreGalaxyMap

- type: entity
  parent: RMCSignRequisitions
  id: CMUSignUSCMDisposition
  name: USCM部署与战备状态
  description: 一块描述美国殖民地海军陆战队部署与编成的 plaque。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/decals.rsi
    state: roplaque
  - type: GuideHelp
    openOnActivation: true
    guides:
    - CMUGuideLoreUSCM

# Guidebook outfit preview for the Canadian Colonial Armed Forces, which have clothing but no starting gear of their own.
- type: startingGear
  id: CMUGearGuideCCAF
  equipment:
    jumpsuit: AU14CCAFUniform
    outerClothing: AU14CCAFArmor
    head: AU14CCAFHelmetISACV
    shoes: CMBootsBlack

# Guidebook outfit preview for a standard LACN Landing Forces trooper; the platoon itself is outfitted from vendors.
- type: startingGear
  id: CMUGearGuideLACN
  equipment:
    jumpsuit: AU14LACNUniform
    outerClothing: AU14LACNArmorStandard
    head: AU14LACNHelmetStandard
    gloves: AU14LACNGloves
    shoes: AU14LACNBoots
    back: AU14LACNBackpack
