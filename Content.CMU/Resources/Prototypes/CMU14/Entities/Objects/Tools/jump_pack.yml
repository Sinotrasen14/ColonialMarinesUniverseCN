# Placeholder sprites: swap Objects/Tanks/Jetpacks/blue.rsi for the CMU jump pack RSI once it exists.
- type: entity
  parent: CMGasTankBase
  id: CMUJumpPack
  name: 跳跃背包
  description: 一款背负式推进背包。可以让佩戴者沿设定朝向推进冲刺、跃升至上层区域，或在空中短时间悬停。佩戴时会自动喷气以减缓坠落速度。可以像普通气瓶一样使用储气罐为其充气。最大容量为 5 升气体。
  components:
  - type: Sprite
    sprite: Objects/Tanks/Jetpacks/blue.rsi
  - type: Item
    size: Huge
    sprite: Objects/Tanks/Jetpacks/blue.rsi
  - type: Clothing
    sprite: Objects/Tanks/Jetpacks/blue.rsi
    quickEquip: false
    slots:
    - Back
  - type: GasTank
    releasePressure: 21.3
    air:
      volume: 5
      temperature: 293.15
  - type: CMUJumpPack
    # Set false to run without a GasTank or while empty; no gas is burned.
    requiresFuel: true
    # Set true to only allow use while weightless (zero gravity).
    zeroGravityOnly: false
    # Directional boost: tiles travelled per boost, and the cooldown shared with the z-level jump.
    boostDistance: 6
    boostCooldown: 7
    # Hover: seconds held one level up, and its cooldown counted from when the hover started.
    hoverDuration: 20
    hoverCooldown: 35
    # Z-level jump: peak height in z-levels above the starting floor. Must be above 1 to reach the level above.
    jumpHeight: 1.8
    landingFuelPerSecond: 0.0068379
    # Crit explosion: chance the tank ruptures and detonates if the wearer goes critical while hovering, and the blast strength.
    critExplosionChance: 0.1
    critExplosionType: RMC
    critExplosionTotalIntensity: 100
    critExplosionIntensitySlope: 10
    critExplosionMaxIntensity: 15
  - type: StaticPrice
    price: 150

- type: entity
  parent: CMUJumpPack
  id: CMUJumpPackFilled
  suffix: 已充气
  components:
  - type: GasTank
    releasePressure: 21.3
    air:
      # 可供悬停五分钟，或在五分钟内每次冷却结束即推进冲刺。
      volume: 5
      moles:
      - 2.051379050 # oxygen
      temperature: 293.15
