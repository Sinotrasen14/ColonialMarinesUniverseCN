- type: entity
  parent: BaseItem
  id: MineDetector
  name: 探雷器
  description: 一种探测周围区域地雷的装置。它有一个用于两种模式（LONG/SHORT）的开关。
  components:
  - type: Sprite
    sprite: CMU14/Objects/Devices/minedetector.rsi
    layers:
    - state: minedetector
      map: [ "enum.MineDetectorVisualLayers.Base" ]
    - state: minedetector_folded
      map: [ "enum.MineDetectorVisualLayers.Folded" ]
    state: minedetector
  - type: Item
    size: Normal
  - type: Clothing
    slots:
    - suitstorage
    - belt
  - type: MineDetector
  - type: Appearance
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
