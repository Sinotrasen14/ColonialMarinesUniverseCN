- type: entity
  parent: RMCExtendedEmergencyOxygenTank
  id: CMUFieldOxygenTank
  name: 野外氧气瓶
  description: 一款为军事野战用途打造的加固型大容量氧气瓶。额定可在恶劣环境中长时间作业。可容纳4 L气体。
  components:
  - type: GasTank
    air:
      volume: 4
      temperature: 293.15

- type: entity
  parent: CMUFieldOxygenTank
  id: CMUFieldOxygenTankFilled
  suffix: Filled
  components:
  - type: GasTank
    releasePressure: 21.3
    air:
      volume: 4
      moles:
      - 2.293954648 # oxygen
      temperature: 293.15

- type: entity
  parent: RMCGasTankOxygen
  id: CMUFieldGasTankOxygen
  name: SCBA 氧气瓶
  description: 自给式呼吸器。一种背部佩戴的大型氧气罐，设计用于在烟雾和有害环境中长时间工作。它可以容纳7升气体。
  components:
  - type: Sprite
    sprite: CMU14/Items/scba_tank.rsi
  # Too bulky for satchels and other storage: it goes on the back or in suit storage.
  - type: Item
    size: Ginormous
    sprite: CMU14/Items/scba_tank.rsi
  - type: Clothing
    sprite: CMU14/Items/scba_tank.rsi
  - type: GasTank
    air:
      volume: 7
      temperature: 293.15

- type: entity
  parent: CMUFieldGasTankOxygen
  id: CMUFieldGasTankOxygenFilled
  suffix: Filled
  components:
  - type: GasTank
    releasePressure: 21.3
    air:
      volume: 7
      moles:
      - 3.932493683 # oxygen
      temperature: 293.15

