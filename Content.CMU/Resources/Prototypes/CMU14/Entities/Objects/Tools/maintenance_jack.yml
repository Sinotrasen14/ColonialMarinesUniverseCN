# ├──[ MAINT JACK ]──────────────────────────────────────────────────┤
- type: entity
  parent: [BaseItem, RMCBaseMeleeWeapon]
  id: AU14MaintenanceJack
  name: K92 维修道千斤顶
  description: 一个小型可携带的维修千斤顶，用于维修车辆，也可作为钝击装置，在紧急情况下派上用场。可用于松开门用千斤顶。
  suffix: CMU
  components:
  - type: Sprite
    sprite: CMU14/Objects/Tools/maintenance_jack.rsi
    state: icon
  - type: Item
    size: Small
  - type: Tag
    tags:
    - MaintenanceJack
  - type: Clothing
    quickEquip: false
    slots:
      - Belt
      - Suitstorage
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_RMC14/Handling/crowbar_pickup.ogg
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Items/crowbar_drop.ogg
      params:
        volume: -4
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg
      params:
        volume: -4
  - type: MeleeWeapon
    wideAnimationRotation: 90
    attackRate: 0.87
    damage:
      types:
        Blunt: 27
        Structural: 36
    soundHit:
      collection: GenericHit
  - type: DamageImpactProfile
    melee:
      contact: Crush
      penetration: None
      energy: Medium
  - type: ToolTileCompatible
    delay: 0.5
  - type: Tool
    qualities:
      - VehicleServicing
    useSound:
      path: /Audio/Items/jaws_pry.ogg
  - type: Prying
    speedModifier: 2
    useSound:
      path: /Audio/Items/jaws_pry.ogg

# ├──[ ADMIN JACK ]──────────────────────────────────────────────────┤
- type: entity
  parent: AU14MaintenanceJack
  id: AU14MaintenanceJackSpecialAdmin
  name: K92-S改装维修道千斤顶
  description: 一个集撬棍、扳手、螺丝刀于一体的工具，也是一把大体型钝击装置，在紧急情况下非常实用。可用于解除门控千斤顶。这是一把经过大幅减重的K92-S Special，任何人都能举起。
  suffix: Admin, DO NOT MAP, CMU
  components:
  - type: Tag
    tags:
    - Wrench
    - Crowbar
    - MaintenanceJack
    - Screwdriver
  - type: Tool
    qualities:
    - Prying
    useSound: !type:SoundPathSpecifier
      path: /Audio/Items/crowbar.ogg
      params:
        volume: 0
        variation: null
        rolloffFactor: 1
        referenceDistance: 1
        playOffsetSeconds: 0
        pitch: 1
        maxDistance: 15
        loop: False
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 4
    useSound:
      path: /Audio/Items/jaws_pry.ogg
  - type: MultipleTool
    statusShowBehavior: true
    entries:
      - behavior: [ Prying ]
        sprite:
          sprite: CMU14/Objects/Tools/maintenance_jack.rsi
          state: icon
        useSound: /Audio/Items/crowbar.ogg
      - behavior: [ Anchoring ]
        sprite:
          sprite: CMU14/Objects/Tools/maintenance_jack.rsi
          state: wrench
        useSound: /Audio/Items/ratchet.ogg
      - behavior: [ Screwing ]
        sprite:
          sprite: CMU14/Objects/Tools/maintenance_jack.rsi
          state: wrench
        useSound:
          collection: Screwdriver
      - behavior: [ VehicleServicing ]
        sprite:
          sprite: CMU14/Objects/Tools/maintenance_jack.rsi
          state: icon
        useSound: /Audio/Items/jaws_pry.ogg

# ├──[ SYNTH JACK ]──────────────────────────────────────────────────┤
- type: entity
  parent: AU14MaintenanceJackSpecialAdmin
  id: AU14MaintenanceJackSpecial
  name: K92-S 专用维修道千斤顶
  description: 一把非常沉重的多功能撬棍、扳手、螺丝刀，以及通常可用作大型钝击装置的工具，在紧急情况下非常实用。可用于分离门式千斤顶。不过极其笨重。
  suffix: CMU, Synth
  components:
  - type: RMCSynthItemRestriction
  - type: WhitelistPickupBy
    whitelist:
      components:
        - Synth
  - type: DamageImpactProfile
    melee:
      contact: Crush
      penetration: None
      energy: High
    heavyMelee:
      contact: Crush
      penetration: None
      energy: High
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 225
        mask:
        - MobMask
        layer:
        - MobLayer
