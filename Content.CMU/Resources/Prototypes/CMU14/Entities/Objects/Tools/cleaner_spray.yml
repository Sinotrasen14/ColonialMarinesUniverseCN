- type: entity
  parent: SprayBottleSpaceCleaner
  id: AU14SprayCleaner
  name: 清洁喷雾
  description: 一个装满清洁液的喷雾瓶。它用于清洁各种表面和物体。
  components:
  - type: Sprite
    sprite: CMU14/Objects/Tools/cleaner_spray.rsi
    layers:
    - state: cleaner
  - type: Item
    sprite: CMU14/Objects/Tools/cleaner_spray.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 0
    fillBaseName: null
    inHandsMaxFillLevels: 0
    inHandsFillBaseName: null

- type: entity
  parent: AU14SprayCleaner
  id: AU14SprayCleanerBig
  name: 大清洁喷雾
  description: 一个装满清洁液的大号喷雾瓶。它用于清洁各种表面和物体。
  components:
  - type: Sprite
    sprite: CMU14/Objects/Tools/cleaner_spray.rsi
    layers:
    - state: cleaner_large
  - type: Solution
    solution:
        maxVol: 300
        reagents:
        - ReagentId: SpaceCleaner
          Quantity: 300

- type: entity
  parent: AU14SprayCleaner
  id: AU14SprayCleanerExperimental
  name: 实验性清洁喷雾
  description: 一个实验性的喷雾瓶，里面装满了清洁液。它能够通过从周围大气中收集环境化合物来自我再生清洁液。它用于清洁各种表面和物体。
  components:
  - type: Sprite
    sprite: CMU14/Objects/Tools/cleaner_spray.rsi
    layers:
    - state: cleaner_special
  - type: Solution
    solution:
      maxVol: 300
      reagents:
      - ReagentId: SpaceCleaner
        Quantity: 300
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: SpaceCleaner
        Quantity: 1
