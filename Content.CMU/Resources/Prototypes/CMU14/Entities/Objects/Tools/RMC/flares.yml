- type: entity
  parent: RMCFlareL96
  id: AU14FlareRMC
  suffix: Alt
  description: 一种由RMC配发的照明弹，可在可见光谱和紫外光谱中燃烧。侧面印有说明，写着“拉绳，发光”。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/flares.rsi
    layers:
      - map: [ "enum.ExpendableLightVisualLayers.Base" ]
        state: flare
      - map: [ "enum.ExpendableLightVisualLayers.Glow" ]
        state: flare_flame
        color: "#d79be5"
        visible: false
      - map: [ "enum.ExpendableLightVisualLayers.Overlay" ]
        state: overlay
  - type: PointLight
    color: "#d79be5"
  - type: Tag
    tags:
    - AU14FlareRMC
    - RMCFlare

- type: entity
  abstract: true
  parent: BaseItem
  id: AU14PackFlareBaseRMC
  name: L96标记照明弹包
  suffix: Alt
  description: 一包八枚M94标记照明弹。由海军陆战队士兵携带，用于照亮普通TNR肩灯无法到达的黑暗区域。
  components:
  - type: Item
    size: Normal
  - type: Tag
    tags:
    - CMFlarePack
  - type: CMItemSlots
    count: 8
    slot:
      name: 耀斑
      whitelist:
        tags:
        - AU14FlareRMC
  - type: Sprite
    sprite: CMU14/Weapons/Throwable/RMC/packets.rsi
    layers:
    - state: l96_e
      map: [ "emptyLayer" ]
    - state: l96
      map: [ "fullLayer" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CMItemSlotsLayers.Fill:
        fullLayer:
          Empty: { visible: false }
          Low: { visible: true }
          Medium: { visible: true }
          High: { visible: true }
          Full: { visible: true }
        emptyLayer:
          Empty: { visible: true }
          Low: { visible: false }
          Medium: { visible: false }
          High: { visible: false }
          Full: { visible: false }

- type: entity
  parent: AU14PackFlareBaseRMC
  id: AU14PackFlareRMC
  suffix: Filled, Alt
  components:
  - type: CMItemSlots
    startingItem: AU14FlareRMC

- type: entity
  parent: RMCBoxMagazineSupplySmallBase
  id: AU14BoxPackFlareRMCEmpty
  name: 一箱L96照明弹包（x10）
  description: 一盒L96标记照明弹包，点亮你的一天。
  components:
  - type: Construction
    graph: RMCBoxMagazine
    node: RMCBoxPackFlareEmpty
  - type: Item
    size: Huge
  - type: CMItemSlots
    count: 10
    slot:
      name: 耀斑包
      whitelist:
        tags:
        - AU14FlarePackRMC
  - type: Sprite
    layers:
    - state: supply_box_small
      color: "#646a3c"
    - state: supply_ammo_small_full
      map: [ "enum.CMItemSlotsLayers.Fill" ]
      color: "#867872"
    - state: supply_box_small_flare
      color: "#646a3c"
    - state: supply_box_small_flare_colour
      color: "#f0c16f"
    - state: supply_lid_small_closed
      map: [ "lid" ]
      color: "#646a3c"
    - state: supply_lid_small_closed_marking
      map: [ "lid_marking" ]
      color: "#646a3c"

- type: entity
  parent: AU14BoxPackFlareRMCEmpty
  id: AU14BoxPackFlareRMC
  suffix: Filled, Alt
  components:
  - type: CMItemSlots
    startingItem: AU14PackFlareRMC

- type: Tag
  id: AU14FlareRMC

- type: Tag
  id: AU14FlarePackRMC
