    这套工程部套件适合部署到现场，以支持工程作业，例如建造前沿作战基地和维护基础设施。

    无论是负责前沿作战基地的资深技术员，还是第一个征用悍马车钥匙的人。内含一把重置钥匙，以备合成人开始思考哲学问题时使用。
