- type: entity
  parent: AU14KitPlatoonOfficer
  id: AU14KitJOStaffOfficerKit
  name: 参谋军官（SO）套装
  description: >-
    这套战斗规划装备适合在CIC中与指挥官并肩工作，协调作战行动并规划下一场奇迹。

    它通常被称为CO最得力的盟友，让行动和命令顺畅流转。如果说XO负责管理舰船，那么SO就负责指挥战斗。
  components:
  - type: StorageFill
    contents:
    - id: AU14HeadBeretSO
      amount: 1
    - id: AU14WebbingDropPouch
      amount: 1
    - id: RMCHeadUNMCHeadset
      amount: 1
    - id: RMCM5CameraGear
      amount: 1
    - id: RMCMegaphone
      amount: 1
    - id: RMCLaserDesignatorPVE
      amount: 1
    - id: AU14StampSO
      amount: 1

- type: entity
  parent: AU14KitPlatoonOfficer
  id: AU14KitJOIntelligenceOfficer
  name: 情报官（IO）套件
  description: >-
    CIC最宝贵的资产，前提是他们保持联络，让信息来完成射击。

    这套装备适合部署到前线，收集关键情报并传回指挥部。

    如果说XO是心脏，SO是嘴巴，EO是大脑，那么IO就是指挥部元素的眼和耳。
  components:
  - type: StorageFill
    contents:
    - id: AU14HeadBeretIO
      amount: 1
      #- id: AU14GOVFORIOHeadset # I dont see OPFOR kits so use AU14OPFORIOHeadset for OPFOR
        #amount: 1
    - id: CMHandsInsulated
      amount: 1
    - id: AU14WebbingDumpPouch
      amount: 1
    - id: RMCPouchDocument
      amount: 1
    - id: RMCIntelDetector
      amount: 1
    - id: AU14RadioJammer
      amount: 1
    - id: CMPamphletIntel
      amount: 1
    - id: RMCTacticalPrybar
      amount: 1
    - id: RMCExplosiveBreachingCharge
      amount: 1
    - id: RMCBinocularsPVE
      amount: 1
    - id: RMCFulton20
      amount: 1
    - id: RMCWeaponPistolM82FEmpty
      amount: 1
    - id: RMCPackFlareCAS
      amount: 1
    - id: AU14StampIO
      amount: 1
    - id: AU14InfiltratorApparelBundle
      amount: 1

