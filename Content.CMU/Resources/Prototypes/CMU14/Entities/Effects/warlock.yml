- type: entity
  parent: XenoBaseProjectile
  id: CMUXenoPsychicBlastProjectile
  categories: [HideSpawnMenu]
  name: 灵能冲击
  components:
    - type: Sprite
      sprite: _RMC14/Effects/beam.rsi
      state: laser_beam
      drawdepth: Effects
      color: "#970f0f"
    - type: ProjectileMaxRange
      max: 7
      delete: false
    - type: RMCProjectileAccuracy
      accuracy: 999
    - type: CMUXenoPsychicBlastProjectile
      radius: 1.25
      damage:
        types:
          Blunt: 65
      slow: 1.5
      impactSound:
        path: /Audio/CMU14/Xeno/Warlock/EMPulse.ogg
      impactEffectId: CMUXenoPsychicBlastShockwave
    - type: PointLight
      radius: 1.5
      energy: 1.2
      color: "#970f0f"

