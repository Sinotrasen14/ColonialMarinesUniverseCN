- type: entity
  id: CMUXenoPsychicShieldSegment
  categories: [HideSpawnMenu]
  name: 灵能护盾
  components:
    - type: Physics
      bodyType: Static
    - type: Fixtures
      fixtures:
        shield:
          shape: !type:PolygonShape
            vertices:
              - "-1.5,-0.5"
              - "1.5,-0.5"
              - "1.5,0.5"
              - "-1.5,0.5"
          hard: true
          layer:
            - BulletImpassable
    - type: CMUXenoPsychicShieldSegment
    - type: IgnorePredictionHit
    - type: Tag
      tags:
        - HideContextMenu

- type: entity
  parent: CMUXenoPsychicShieldSegment
  id: CMUXenoPsychicShield
  categories: [HideSpawnMenu]
  name: 灵能护盾
  components:
    - type: Sprite
      drawdepth: Effects
      sprite: CMU14/Effects/Xeno/warlock_shield.rsi
      state: shield
    - type: PointLight
      radius: 2
      energy: 1.5
      color: "#7fb7ff"

- type: entity
  id: CMUXenoPsychicCrushWarning
  categories: [HideSpawnMenu]
  name: 灵能碾压警告
  components:
    # Lifetime covers the full 5-pulse channel at 1 s/pulse plus a small buffer, so all rings
    # spawned during the channel remain visible until detonation. Ordinarily the warning is
    # deleted by ClearPsychicCrushEffects on end; TimedDespawn is only the orphan fallback.
    - type: TimedDespawn
      lifetime: 6
    - type: Sprite
      drawdepth: Effects
      sprite: CMU14/Effects/Xeno/warlock_crush_warning.rsi
      noRot: true
      state: crush_warning
    - type: EffectVisuals
    - type: CMUXenoWarlockParticleEmitter
      effect: CrushWarning
    - type: Tag
      tags:
        - HideContextMenu

