- type: localizedDataset
  id: AU14NamesK9
  values:
    prefix: names-k9-first-dataset-
    count: 13

# OG DOG
- type: entity
  parent:
  - BaseMob
  - MobDamageable
  id: AU14MobK9
  name: 合成K9
  description: "一只由互洛因生产的合成狗。标准型号，未配备特殊挽具装备。"
  components:
  - type: RandomMetadata
    nameSegments:
     - AU14NamesK9
  - type: Sprite
    drawdepth: Mobs
    sprite: CMU14/Mobs/MiscMob/synthk9.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: k9_closed
  - type: MobThresholds
    allowRevives: true
    thresholds:
      0: Alive
      290: Critical
      400: Dead
  - type: HealthExaminable
    examinableTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Shock
  - type: SlowOnDamage
    speedModifierThresholds:
      100: 0.85
      150: 0.7
  - type: Pullable
  # no Repairable here: it won the InteractUsing race and welded every damage type off in a second.
  # Synth below gives the proper repair: welder for brute, cable coil for burn, with a doafter
  - type: Physics
  - type: MovementSpeedModifier
    baseWalkSpeed : 4
    baseSprintSpeed : 6.4
  - type: RMCHandEmotes
  - type: RMCBuckleDrawDepth
  - type: RMCObstacleSlamming
  - type: Puller
    needsHands: false
  - type: FiremanCarriable
  - type: CanFiremanCarry
  - type: CombatMode
    canDisarm: false
  - type: MobState
  - type: StandingState
  - type: GhostTakeoverAvailable
  - type: CrashLandable
  - type: StunShakeable
  - type: StunShakeableUser
  - type: CanBeFirePatted
  - type: EmoteCooldown
  - type: Speech
    speechVerb: Canine
    allowedEmotes: [ 'Bark', 'Snarl', 'Whine', 'Growl', 'Yip' ]
    speechSounds: Dog
  - type: DamageStateVisuals
    states:
      Alive:
        Base: k9_closed
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: ReplacementAccent
    accent: dog
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.38
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Inventory
    speciesId: dog
    templateId: pet
  - type: InteractionPopup
    interactSuccessString: petting-success-dog
    interactFailureString: petting-failure-generic
    interactSuccessSound:
      path: /Audio/_RMC14/Voice/Vulpkanin/dog_bark2.ogg
  - type: Grammar
    attributes:
      gender: epicene
  - type: MeleeWeapon
    soundHit:
      collection: AU14DogAttack
      params:
        variation: 0
        volume: 0.9
    angle: 30
    animation: WeaponArcBite
    wideAnimation: WeaponArcBite
    attackRate: 1.4
    damage:
      types:
        Slash: 30
  - type: Synth
  - type: ComplexInteraction
  - type: Climbing
  - type: Language
    preset: AU14LanguagePresetSynth
  - type: Access
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: K9Dog
  - type: UserInterface
    interfaces:
      enum.DialogUiKey.Key:
        type: DialogBui

- type: soundCollection
  id: AU14DogAttack
  files:
  - /Audio/_RMC14/Voice/Vulpkanin/dog_growl2.ogg
  - /Audio/_RMC14/Voice/Vulpkanin/dog_growl3.ogg
  - /Audio/_RMC14/Voice/Vulpkanin/dog_snarl1.ogg
  - /Audio/_RMC14/Voice/Vulpkanin/dog_snarl2.ogg
  - /Audio/_RMC14/Voice/Vulpkanin/dog_snarl3.ogg

- type: entity
  parent: AU14MobK9
  id: AU14MobK9GhostRole
  suffix: "Ghost Role"
  components:
  - type: GhostRole
    name: 合成K9
    description: 一种由互洛因生产的合成狗。标准型号，没有特殊挽具装备。
    raffle:
      settings: short

# MEDIC DOG
- type: entity
  parent: AU14MobK9
  id: AU14MobK9BagMedic
  name: 搜救犬
  description: "一件由互洛因生产的合成犬，身着用于携带医疗用品的背带。"
  suffix: "S&R"
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: CMU14/Mobs/MiscMob/synthk9.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: k9_closed_medpack
  - type: DamageStateVisuals
    states:
      Alive:
        Base: k9_closed_medpack
      Critical:
        Base: dead_medpack
      Dead:
        Base: dead_medpack
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,13,5 # 21 slots
    whitelist:
      tags:
      - DiscreteHealthAnalyzer
      - Dropper
      - GlassBeaker
      - Bottle
      - PillPacket
      - PillCanister
      - Syringe
      - CMSurgicalLine
      - CMSynthGraft
      - Brutepack
      - CMBloodPack
      - Gauze
      - Ointment
      - CMOintment
      - CMTraumaKit
      - CMBurnKit
      - CMAutoInjector
      - CMRollerItem
      - BodyBag
      - RMCGlovesLatex
      - SterileMask
      - Hypospray
      - CigPack
      - RMCPenlight
      - Flare
      - CMUBoneGraft
      - CMUCastItem
      - CMUOrganClamp
      - CMUSplintItem
      components:
      - CMSurgeryTool
      - Hypospray
      - Defibrillator
      - Pill
      - RMCHandLabeler
      - RMCStethoscope
      - RMCLighter
  - type: FixedItemSizeStorage
  - type: IgnoreContentsSize
    items:
      tags:
      - PillCanister
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface

- type: entity
  parent: AU14MobK9BagMedic
  id: AU14MobK9BagMedicGhostRole
  suffix: "S&R, Ghost Role"
  components:
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: 搜救犬
    description: 一件由互洛因生产的合成犬，身着用于携带医疗用品的背带。
    raffle:
      settings: short
  - type: NpcFactionMember
    factions:
    - Civilian

