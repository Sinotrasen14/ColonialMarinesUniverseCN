- type: entity
  abstract: false
  parent:
  - CMXenoDeveloped
  - CMXenoFlammable
  - RMCXenoCommendationReceiver
  - RMCXenoMobCollision
  id: AU14Wendigo
  name: 温迪戈
  description: 一个高大、苍白、看起来诡异似人的生物。它的背上烙有“Weyland-Yutani”的印记。
  components:
  - type: GhostRole
    name: 温迪戈
  - type: Sprite
    sprite: CMU14/Mobs/MiscMob/wendigo.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: wendigo_glowmask
      shader: unshaded
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
        BaseUnshaded: wendigo_glowmask
      Dead:
        Base: dead
  - type: Speech
    speechVerb: AU14WendigoSpeech
    allowedEmotes: [ "Growl", "Hiss", "XenoRoar", "XenoHelp", "WendigoBreathing" ]
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      1500: Dead
  - type: Xeno
    unlockAt: 99999 #never unlock naturally
    role: CMXenoWendigo
    emoteSounds: Wendigo
    actionIds:
    - ActionXenoWatch
    - ActionXenoPunch
    - ActionXenoPounce
    - ActionXenoHeadbite
    - ActionWendigoDoom
    tier: 99
    hudOffset: -0.15,0.25
  - type: BurrowedLarvaSpawnBlocked
  - type: XenoRegen
    standHealingMultiplier: 0.3
  - type: XenoHeavy
  - type: XenoPunch
    damage:
      types:
        Blunt: 30
  - type: XenoLeap
    plasmaCost: 0
    delay: 0
    moveDelayTime: 1.5
    knockdownTime: 3
    knockdownRequiresInvisibility: false
    unrootOnMelee: true
    leapSound:
      collection: WendigoLeap
  - type: XenoPlasma
    plasma: 0
    maxPlasma: 0
    plasmaRegenOnWeeds: 0
  - type: CMArmor
    xenoArmor: 25
    explosionArmor: 40
  - type: XenoClaws
    clawType: Sharp
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 15
        Slash: 15
        Piercing: 15
  - type: XenoHeadbite
    damage:
      types:
        Blunt: 20
        Slash: 20
        Piercing: 20
    emoteCooldown: 99999
  - type: WendigoHeadbiteAudio
    closeSound:
      collection: WendigoHeadbiteClose
    globalSound:
      collection: WendigoHeadbiteGlobal
    globalCooldown: 60
  - type: XenoDoom
    sound:
      collection: WendigoDoom
    slowTime: 0
  - type: MovementSpeedModifier
    baseWalkSpeed: 6
    baseSprintSpeed: 7
  - type: Tackle
    max: 4
  - type: SlowOnPull
    slowdowns:
    - multiplier: 0.6
      whitelist:
        components:
        - Marine
    - multiplier: 0.6
      whitelist:
        components:
        - XenoLight
    - multiplier: 0.4
      whitelist:
        components:
        - XenoHeavy
  - type: XenoLifesteal
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: warrior
  - type: IntelRecoverCorpseObjectiveOnDeath
    value: 0.2
  - type: SoundOnDeath
    sound:
      collection: WendigoDeath
      params:
        volume: -4
  - type: RMCSize
    size: Big
  - type: WendigoVoice
  - type: UserInterface
    interfaces:
      enum.WendigoVoiceUiKey.Key:
        type: WendigoVoiceBui
  - type: Tag
    tags:
    - Wendigo

- type: entity
  parent: ActionXenoDoom
  id: ActionWendigoDoom
  name: 尖啸
  description: 一声恐怖的尖啸，关闭灯光，并使附近的敌人减速和眩晕。
  components:
  - type: XenoActionPlasma
    cost: 0

- type: speechVerb
  id: AU14WendigoSpeech
  name: chat-speech-verb-name-default
  speechVerbStrings:
  - Growl
- type: job
  parent: CMJobXenoBase
  id: CMXenoWendigo
  name: 温迪戈
  playTimeTracker: CMJobXenoWendigo
- type: playTimeTracker
  id: CMJobXenoWendigo
  isXeno: true

- type: entity
  id: ActionWendigoVoice
  name: 声音模仿
  parent: ActionXenoBase
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - texture: /Textures/Interface/Actions/scream.png
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:WendigoVoiceActionEvent {}

# Lab-made Wendigo: about 20% less health and damage, and no area screech.
- type: entity
  parent: AU14Wendigo
  id: CMUWendigoLesser
  name: 温迪戈
  description: 一个高大苍白、像人却又诡异得不像人的生物。它的背上烙着“Weyland-Yutani”的字样。
  components:
  - type: GhostRole
    name: 次级温迪戈
  - type: MobThresholds
    thresholds:
      0: Alive
      1200: Dead
  - type: Xeno
    unlockAt: 99999 #never unlock naturally
    role: CMXenoWendigo
    emoteSounds: Wendigo
    actionIds:
    - ActionXenoWatch
    - ActionXenoPunch
    - ActionXenoPounce
    - ActionXenoHeadbite
    tier: 99
    hudOffset: -0.15,0.25
  - type: XenoPunch
    damage:
      types:
        Blunt: 24
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
        Slash: 12
        Piercing: 12
  - type: XenoHeadbite
    damage:
      types:
        Blunt: 16
        Slash: 16
        Piercing: 16
    emoteCooldown: 99999
