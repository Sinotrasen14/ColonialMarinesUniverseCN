# One-directional waste dump: no pump, no power. Deletes inlet line gas into
# open sky, so it needs a roofless tile (the same exposure rule outdoor
# relaxation uses). Faster than venting through a passive vent because the tile
# and LINDA never sit in the path.
# Screwdriver toggles open/closed. Multitool opens the service panel; with the
# panel open, crowbar deconstructs.
- type: entity
  parent: ConstructibleMachine
  id: CMUExhaustVent
  name: EX-1排气口
  suffix: CMU
  description: "单向废气排放口。将管路气体排入露天；上方需有畅通的排放烟囱。螺丝刀可打开/关闭。多功能工具可打开面板；撬开可拆除。"
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Clickable
  - type: InteractionOutline
  - type: WiresPanel
    openingTool: Pulsing
    examineTextClosed: cmu-zlevel-panel-closed
    examineTextOpen: cmu-zlevel-panel-open
  - type: Construction
    graph: CMUExhaustVentGraph
    node: built
  - type: Machine
    board: CMUExhaustVentMachineCircuitboard
  - type: AtmosDevice
  - type: CMUExhaustVent
  - type: SubFloorHide
    visibleLayers:
    - enum.SubfloorLayers.FirstLayer
  - type: Sprite
    drawdepth: FloorObjects
    sprite: _RMC14/Structures/Piping/Atmospherics/vent_scrubber.rsi
    layers:
    - state: pipeFourway
      sprite: Structures/Piping/Atmospherics/pipe.rsi
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: in
      map: [ "enum.SubfloorLayers.FirstLayer" ]
  - type: Appearance
  - type: PipeColorVisuals
  - type: NodeContainer
    nodes:
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Fourway
  - type: AtmosPipeLayers
    spriteLayersRsiPaths:
      enum.PipeVisualLayers.Pipe:
        Primary: Structures/Piping/Atmospherics/pipe.rsi
        Secondary: Structures/Piping/Atmospherics/pipe_alt1.rsi
        Tertiary: Structures/Piping/Atmospherics/pipe_alt2.rsi

# Direct build instead of the generic machine-frame flow: the construction menu
# only lists isCM recipes, and the vent board has no crafting source anyway.
# The Machine component still auto-stocks board and parts on spawn.
- type: constructionGraph
  id: CMUExhaustVentGraph
  start: start
  graph:
  - node: start
    edges:
    - to: built
      completed:
      - !type:SnapToGrid
      steps:
      - material: CMSteel
        amount: 5
        doAfter: 2.5
  - node: built
    entity: CMUExhaustVent
    edges:
    - to: start
      conditions:
      - !type:WirePanel
      completed:
      - !type:SpawnPrototype
        prototype: CMSheetMetal1
        amount: 5
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 2

- type: construction
  id: CMUExhaustVentRecipe
  name: 排气口
  description: 一个单向废气排放口，将管道气体排入露天环境。上方需要畅通的排放口；用螺丝刀打开和关闭。
  graph: CMUExhaustVentGraph
  startNode: start
  targetNode: built
  category: construction-category-atmospherics
  objectType: Structure
  placementMode: AlignAtmosPipeLayers
  canRotate: false
  isCM: true
  conditions:
  - !type:TileNotBlocked
