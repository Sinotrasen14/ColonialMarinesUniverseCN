# ├──[ Unary devices (GasUnary graph) ]──────────────────────────────┤
- type: entity
  parent: GasVentPump
  id: !type:CreateVariants
    values: [ CMVentPump, CMVentPumpAlt1, CMVentPumpAlt2 ]
  name: AV-1通风口
  description: 一个接入管道网络的地板格栅。它往里面送风，也往外抽风，取决于大气技术员上一次的要求。
  categories: !type:CreateVariants
    sequences: [ [ ], [ HideSpawnMenu ], [ HideSpawnMenu ] ]
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: Sprite
    drawdepth: FloorObjects
    sprite: _RMC14/Structures/Piping/Atmospherics/vent_pump.rsi
    layers:
    - state: pipeFourway
      sprite: Structures/Piping/Atmospherics/pipe.rsi
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: off
      map: [ "enabled", "enum.SubfloorLayers.FirstLayer" ]
  - type: GenericVisualizer
    visuals:
      enum.VentPumpVisuals.State:
        enabled:
          Off: { state: off }
          In: { state: in }
          Out: { state: on }
          Welded: { state: welded }
          Lockout: { state: off }
  - type: VentCrawlable
    travelDirection: Fourway
  - type: VentExit
  - type: VentEntrance
  - type: RMCMesonsNonviewable
  - type: CollideOnAnchor
  - type: RMCContainerEmptyOnDestruction
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        showEnts: False
        occludes: True
        ents: []
      rmc_vent_container: !type:Container
        showEnts: False
        occludes: True
        ents: []
  - type: NodeContainer
    nodes:
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Fourway
  - type: AtmosPipeLayers
    pipeLayer: !type:CreateVariants
      values: [ 0, 1, 2 ]
    spriteLayersRsiPaths:
      enum.PipeVisualLayers.Pipe:
        Primary: Structures/Piping/Atmospherics/pipe.rsi
        Secondary: Structures/Piping/Atmospherics/pipe_alt1.rsi
        Tertiary: Structures/Piping/Atmospherics/pipe_alt2.rsi

- type: entity
  parent: GasVentScrubber
  id: !type:CreateVariants
    values: [ CMVentScrubber, CMVentScrubberAlt1, CMVentScrubberAlt2 ]
  name: AS-1空气洗涤器
  description: 壁挂式的女仆系列的一半。把坏的一半从空气中抽出来交给管道处理；会被等离子和phoron呛住。
  categories: !type:CreateVariants
    sequences: [ [ ], [ HideSpawnMenu ], [ HideSpawnMenu ] ]
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: Sprite
    drawdepth: FloorObjects
    sprite: _RMC14/Structures/Piping/Atmospherics/vent_scrubber.rsi
    layers:
    - state: pipeFourway
      sprite: Structures/Piping/Atmospherics/pipe.rsi
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: off
      map: [ "enabled", "enum.SubfloorLayers.FirstLayer" ]
  - type: GenericVisualizer
    visuals:
      enum.ScrubberVisuals.State:
        enabled:
          Off: { state: off }
          Scrub: { state: on }
          Siphon: { state: in }
          WideScrub: { state: on }
          Welded: { state: welded }
  - type: VentCrawlable
    travelDirection: Fourway
  - type: VentExit
  - type: VentEntrance
  - type: RMCMesonsNonviewable
  - type: CollideOnAnchor
  - type: RMCContainerEmptyOnDestruction
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        showEnts: False
        occludes: True
        ents: []
      rmc_vent_container: !type:Container
        showEnts: False
        occludes: True
        ents: []
  - type: NodeContainer
    nodes:
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Fourway
  - type: AtmosPipeLayers
    pipeLayer: !type:CreateVariants
      values: [ 0, 1, 2 ]
    spriteLayersRsiPaths:
      enum.PipeVisualLayers.Pipe:
        Primary: Structures/Piping/Atmospherics/pipe.rsi
        Secondary: Structures/Piping/Atmospherics/pipe_alt1.rsi
        Tertiary: Structures/Piping/Atmospherics/pipe_alt2.rsi

