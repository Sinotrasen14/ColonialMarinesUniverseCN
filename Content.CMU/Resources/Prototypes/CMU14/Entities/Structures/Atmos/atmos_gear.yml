# ├──[ SCRUBBERS ]───────────────────────────────────────────────────┤
- type: entity
  parent: PortableScrubber
  id: RMCAirScrubberPortable
  name: '“Maid”SC-3便携式空气净化器'
  description: 一个方方正正的净化器，能把房间里的问题吸进去并困在里面。现场工作人员叫它“女仆”；把它留在房间里，回来就能呼吸到清新的空气。检修面板只用一颗螺丝固定，而这颗螺丝往往撑不过第一个班次。
  components:
  - type: Transform
    noRot: false # maps rotate it, inherited noRot aborts map loads
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    noRot: true
    layers:
    - state: pscrubber_0
      map: [ "enum.PortableScrubberVisualLayers.IsRunning" ]
  - type: PortableScrubberVisuals
    idleState: pscrubber_0
    runningState: pscrubber_1
    readyState: pscrubber_0
    fullState: pscrubber_0
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: CMUAmbientMute

- type: entity
  parent: RMCAirScrubberPortable
  id: RMCAirScrubberStationary
  name: '“Maid” SC-3S 固定式空气净化器'
  description: Maid系列的螺栓固定型号。和便携款一样的胃口，但不会到处乱跑。检修面板同样靠那颗单螺丝固定，结局也一样。
  components:
  - type: Transform
    noRot: false
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    noRot: true
    layers:
    - state: scrubber_0
      map: [ "enum.PortableScrubberVisualLayers.IsRunning" ]
  - type: PortableScrubberVisuals
    idleState: scrubber_0
    runningState: scrubber_1
    readyState: scrubber_0
    fullState: scrubber_0

# ├──[ SIPHONS ]─────────────────────────────────────────────────────┤
- type: entity
  parent: RMCAirScrubberPortable
  id: RMCAirPumpPortable
  name: '“吸管” AP-4 便携式气泵'
  description: 把房间里的空气吸出并装进气瓶。外勤人员叫它吸管，通常就站在它正在抽气的房间里这么叫。比女仆更吵，而且对此更得意；面板一颗螺丝就能拆下，而大多数螺丝在板条箱拆开前就不见了。
  components:
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    noRot: true
    layers:
    - state: psiphon_0
      map: [ "enum.PortableScrubberVisualLayers.IsRunning" ]
  - type: PortableScrubberVisuals
    idleState: psiphon_0
    runningState: psiphon_1
    readyState: psiphon_0
    fullState: psiphon_0
  - type: AmbientSound
    enabled: false
    volume: -5
    range: 5
    sound:
      path: /Audio/Ambience/Objects/gas_pump.ogg

- type: entity
  parent: RMCAirPumpPortable
  id: RMCAirPumpStationary
  name: '“Straw” AP-4S 固定式气泵'
  description: 固定式型号。体积大，固定牢靠，和便携式一样耗水。面板依然只差一颗螺丝就能安静下来。
  components:
  - type: Transform
    noRot: false
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    noRot: true
    layers:
    - state: siphon_0
      map: [ "enum.PortableScrubberVisualLayers.IsRunning" ]
  - type: PortableScrubberVisuals
    idleState: siphon_0
    runningState: siphon_1
    readyState: siphon_0
    fullState: siphon_0

# ├──[ TEMPERATURE CONTROL ]─────────────────────────────────────────┤
- type: entity
  parent: SpaceHeater
  id: RMCSpaceHeater
  name: '“烤面包机”SH-6空间加热器'
  description: 一种通过辐射来温暖房间的电热器。两个档位，关和开；说明书用整整一页来讲述两者的区别。
  components:
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    noRot: true
    layers:
    - state: sheater0
      map: [ "enum.SpaceHeaterVisualLayers.Main" ]
  - type: GenericVisualizer
    visuals:
      enum.SpaceHeaterVisuals.State:
        enum.SpaceHeaterVisualLayers.Main:
          Off: { state: sheater0 }
          StandBy: { state: sheater1 }
          Heating: { state: sheater1 }
          Cooling: { state: sheater1 }
  - type: PointLight
    enabled: false
    castShadows: false
    radius: 1.5
    color: orange
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  parent: SpaceHeater
  id: RMCRadiator
  name: '“Kettle” RD-2 散热器'
  description: 一个热水散热器。通过对流为房间供暖，每轮循环都会发出三層甲板外都能听见的哐当声。
  components:
  - type: Transform
    noRot: false
  - type: Physics
    bodyType: static
    canCollide: false
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    noRot: true
    layers:
    - state: radiator
      map: [ "enum.SpaceHeaterVisualLayers.Main" ]
  - type: GenericVisualizer
    visuals:
      enum.SpaceHeaterVisuals.State:
        enum.SpaceHeaterVisualLayers.Main:
          Off: { state: radiator }
          StandBy: { state: radiator }
          Heating: { state: radiator }
          Cooling: { state: radiator }
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Corrodible
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  parent: RMCRadiator
  id: RMCRadiatorRed
  name: '“水壶”RD-2R散热器'
  description: 一个和别的没什么两样的热水散热器，只不过把手是红色的。仓库里没人记得那个红色把手是干什么用的。
  components:
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    noRot: true
    layers:
    - state: radiator-r
      map: [ "enum.SpaceHeaterVisualLayers.Main" ]
  - type: GenericVisualizer
    visuals:
      enum.SpaceHeaterVisuals.State:
        enum.SpaceHeaterVisualLayers.Main:
          Off: { state: radiator-r }
          StandBy: { state: radiator-r }
          Heating: { state: radiator-r }
          Cooling: { state: radiator-r }

# ├──[ FIRE SUPPRESSION ]────────────────────────────────────────────┤
# One burst reclaims what a pile of air grenades could not: kills tile fires,
# hotspots and burning mobs in range, while the cold flood chokes the reaction.
# Frezon *pending* is the coolant, which means the room comes out slightly N2O.
- type: entity
  parent: [ BaseEngineeringContraband, VolatileGrenadeBase, TimerGrenadeBase ]
  id: CMUFireSuppressantGrenade
  name: '“火蜥蜴”FS-4灭火手榴弹'
  description: 一种化学爆破手雷，用大量冷冻冷却剂灭火。清空房间，拔掉保险销，转身离开。大气技师之后会找到一氧化二氮的。
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/airboom.rsi
    color: '#4E7FBD'
  - type: EmitSoundOnTrigger
    keysIn:
    - timer
    sound: /Audio/Items/smoke_grenade_smoke.ogg
    positional: true
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Items/smoke_grenade_prime.ogg
  - type: TimerTrigger
    delay: 3
  - type: CMUFireSuppressantOnTrigger
    radius: 4.5
  - type: ReleaseGasOnTrigger
    keysIn:
    - timer
    removeFraction: 0.2
    air:
      volume: 1000
      moles:
        Nitrogen: 2800
        Frezon: 200
      temperature: 90
  - type: GenericVisualizer
    visuals:
      enum.ReleaseGasOnTriggerVisuals.Key:
        enabled:
          True: { state: active }
          False: { state: spent }
  - type: RemoveComponentsOnTrigger
    keysIn:
    - timer
    triggerOnce: true
    components:
    - type: TriggerOnUse
    - type: TimerTrigger
    - type: Destructible

