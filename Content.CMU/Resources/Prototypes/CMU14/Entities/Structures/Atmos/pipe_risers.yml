# Cross-deck pipe bridge. Crowbar flips direction.
# Screwdriver is reserved for construction, so layer cycling is locked.
# Multitool opens the service panel; with the panel open, crowbar deconstructs.
- type: entity
  parent: [CMUGasPipeFourway, ConstructibleMachine]
  id: CMUPipeRiserUp
  name: PR3-UG管道立管，向上
  suffix: CMU, MultiZ
  description: "静态方向：朝向上方甲板。撬棍可翻转方向。多功能工具可打开面板；撬开以拆除。"
  components:
  - type: Construction
    graph: CMUPipeRiserGraph
    node: built
  - type: AtmosPipeLayers
    pipeLayersLocked: true
  - type: WiresPanel
    openingTool: Pulsing
    examineTextClosed: cmu-zlevel-panel-closed
    examineTextOpen: cmu-zlevel-panel-open
  - type: Machine
    board: CMUPipeRiserMachineCircuitboard
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
      rmc_vent_container: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: CMUPipeRiser
  - type: CMUZPaired
    offset: 1
    pairKind: pipe

- type: entity
  parent: [CMUGasPipeFourway, ConstructibleMachine]
  id: CMUPipeRiserDown
  name: PR3-DG管道立管，下行
  suffix: CMU, MultiZ
  description: "静态方向：朝下看甲板。撬棍可翻转方向。多功能工具打开面板；撬开以拆解。"
  components:
  - type: Construction
    graph: CMUPipeRiserGraph
    node: built
  - type: AtmosPipeLayers
    pipeLayersLocked: true
  - type: WiresPanel
    openingTool: Pulsing
    examineTextClosed: cmu-zlevel-panel-closed
    examineTextOpen: cmu-zlevel-panel-open
  - type: Machine
    board: CMUPipeRiserMachineCircuitboard
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
      rmc_vent_container: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: CMUPipeRiser
  - type: CMUZPaired
    offset: -1
    pairKind: pipe

# Direct build instead of the generic machine-frame flow: the construction menu
# only lists isCM recipes, and the riser boards have no crafting source anyway.
# The Machine component still auto-stocks board and parts on spawn.
- type: constructionGraph
  id: CMUPipeRiserGraph
  start: start
  graph:
  - node: start
    edges:
    - to: built
      completed:
      - !type:SnapToGrid
      steps:
      - material: CMSteel
        amount: 5
        doAfter: 2.5
  - node: built
    entity: CMUPipeRiserUp
    edges:
    - to: start
      conditions:
      - !type:WirePanel
      completed:
      - !type:SpawnPrototype
        prototype: CMSheetMetal1
        amount: 5
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 2

- type: construction
  id: CMUPipeRiserRecipe
  name: 立管
  description: 连接本甲板与上方或下方甲板的四向管道桥。撬棍可翻转方向。
  graph: CMUPipeRiserGraph
  startNode: start
  targetNode: built
  category: construction-category-atmospherics
  objectType: Structure
  placementMode: AlignAtmosPipeLayers
  canRotate: false
  canBuildInImpassable: true
  isCM: true
