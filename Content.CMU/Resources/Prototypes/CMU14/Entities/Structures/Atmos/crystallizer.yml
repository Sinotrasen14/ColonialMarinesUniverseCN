# Gas-to-solid machine: consumes pipe gas per recipe (temperature window + mole amounts),
# mints the output stack on the machine tile. Recipes are added to GasCrystallizerComponent here.
- type: entity
  parent: [ BaseMachinePowered, SmallConstructibleMachine, BaseSmallConstructibleMachineDestructible ]
  id: CMUGasCrystallizer
  name: '“冰糖”C-7 气体结晶器'
  description: 维兰德-汤谷公司的气体结晶器。管道输入气体，输出固体薄片——前提是你得命中它偏好的温度窗口。现场人员管它叫“冰糖”，而安全卡的开头写着“这不是糖”。未经处理的等离子拒绝结晶；它只是待在那里，审视着你。
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    snapCardinals: true
    granularLayersRendering: true # the 4-dir pipe layer must not cardinal-snap; matches upstream condenser/thermomachine pattern
    layers:
    - state: sheater0
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    - sprite: Structures/Piping/Atmospherics/condenser.rsi
      state: pipe
      map: [ "enum.PipeVisualLayers.Pipe" ]
      renderingStrategy: Default
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { state: sheater1 }
          False: { state: sheater0 }
  - type: ApcPowerReceiver
    powerLoad: 1500
  - type: Physics
    bodyType: Dynamic
  - type: Transform
    anchored: false # Dynamic body, like the other portable gas machines
    noRot: false # baseMachine sets noRotate
  - type: Rotatable
  - type: Machine
    board: CMUCrystallizerMachineCircuitboard
  - type: AtmosDevice
  - type: PipeRestrictOverlap
  - type: NodeContainer
    nodes:
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
  - type: GuideHelp
    guides:
    - GasMiningAndStorage
  - type: GasCrystallizer
    recipes:
    - gases:
        Phoron: 40
      maxTemperature: 283.15
      output: CMSheetPhoron1
    - gases:
        Ammonia: 25
        CarbonDioxide: 15
      minTemperature: 293.15
      maxTemperature: 373.15
      output: RMCSheetPlastic1

- type: entity
  parent: CMBaseMachineCircuitboard
  id: CMUCrystallizerMachineCircuitboard
  name: '“冰糖”C-7结晶机电路板'
  description: 一台用于气体结晶器的机器印刷电路板。
  components:
  - type: Sprite
    state: power_mod
  - type: MachineBoard
    prototype: CMUGasCrystallizer
    stackRequirements:
      CMSteel: 2
      RMCCable: 2
      CMGlass: 1

- type: entity
  parent: GasThermoMachineHeater
  id: !type:CreateVariants
    values: [ CMUGasThermoMachineHeater, CMUGasThermoMachineHeaterAlt1, CMUGasThermoMachineHeaterAlt2 ]
  suffix: Portable
  categories: !type:CreateVariants
    sequences: [ [ ], [ HideSpawnMenu ], [ HideSpawnMenu ] ]
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: Machine
    board: CMUThermomachineHeaterMachineCircuitBoard
  - type: Transform
    anchored: false # portable
  - type: Physics
    bodyType: Dynamic
  - type: AtmosPipeLayers
    pipeLayer: !type:CreateVariants
      values: [ 0, 1, 2 ]
    spriteLayersRsiPaths:
      enum.PipeVisualLayers.Pipe:
        Primary: Structures/Piping/Atmospherics/thermomachine.rsi
        Secondary: Structures/Piping/Atmospherics/thermomachine_alt1.rsi
        Tertiary: Structures/Piping/Atmospherics/thermomachine_alt2.rsi

