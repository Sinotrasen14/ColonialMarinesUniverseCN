- type: entity
  parent: GasMinerOxygen
  id: CMUGasMinerOxygenPortable
  name: OM-2便携式氧气采矿机
  suffix: Portable, 150kPa
  description: 一个拖车大小的大气提取器。通电时会缓缓输出可供呼吸压力的氧气——殖民地靠它呼吸，所以它的电费从不拖欠。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
    flags: [Anchorable, Unanchorable]
  - type: GasMiner
    maxExternalPressure: 150
    spawnAmount: 40
  - type: ApcPowerReceiver
    powerLoad: 0
  - type: RMCPowerReceiver
    idleLoad: 1500
    activeLoad: 1500
    channel: Environment

- type: entity
  parent: CMUGasMinerOxygenPortable
  id: CMUGasMinerNitrogenPortable
  name: NM-2便携式氮气采矿机
  suffix: Portable, 150kPa
  description: '一个拖车大小的大气提取器。通电时会缓缓输出可呼吸压力的氮气，用于混合空气，而非充装气瓶。名字很诚实：氮气基本上就是这个。'
  components:
  - type: GasMiner
    spawnGas: Nitrogen

# These variants are deliberately absent from cargo, construction, vendors, and maps.
# They are available only through administrator spawning.
- type: entity
  parent: CMUGasMinerOxygenPortable
  id: CMUGasMinerPlasmaPortableAdmin
  name: PM-2便携式等离子矿机
  suffix: Admin Only, Portable, 150kPa
  description: 仅限管理员使用的大气提取器，通电时产生等离子。
  components:
  - type: GasMiner
    spawnGas: Plasma

- type: entity
  parent: CMUGasMinerOxygenPortable
  id: CMUGasMinerPhoronPortableAdmin
  name: PHM-2便携式佛龙采矿机
  suffix: Admin Only, Portable, 150kPa
  description: 仅限管理员使用的大气提取器，通电时可生产phoron。
  components:
  - type: GasMiner
    spawnGas: Phoron

- type: entity
  parent: CMUGasMinerOxygenPortable
  id: CMUGasMinerCarbonDioxidePortableAdmin
  name: CM-2便携式二氧化碳矿机
  suffix: Admin Only, Portable, 150kPa
  description: 一个仅限管理员使用的大气提取器，通电时会产生二氧化碳。
  components:
  - type: GasMiner
    spawnGas: CarbonDioxide

- type: entity
  parent: CMUGasMinerOxygenPortable
  id: CMUGasMinerAirPortableAdmin
  name: AM-2便携式空气矿机
  suffix: Admin Only, Portable, 150kPa
  description: 仅限管理员使用的大气提取器，通电时可产生可呼吸的氧气和氮气混合物。
  components:
  - type: CMUGasMinerMixture
    gases:
      Oxygen: 0.21
