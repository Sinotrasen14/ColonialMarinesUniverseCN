- type: entity
  id: CMUInflatableWall
  name: '“软木”IW-1充气墙'
  description: 一片可折叠的膜，在你需要一堵没有的墙时，它会变成一堵墙。激活以放气。请勿刺破。
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _RMC14/Objects/Misc/inflatable_wall.rsi
    state: wall
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 15
        layer:
        - WallLayer
  - type: Damageable
    damageModifierSet: Inflatable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: DisassembleOnAltVerb
    prototypeToSpawn: CMUInflatableWallFolded1
    disassembleTime: 3
  - type: Airtight
  - type: Transform
    anchored: true
  placement:
    mode: SnapgridCenter

- type: entity
  parent: BaseMaterialDoor
  id: CMUInflatableDoor
  name: '“软木”IW-2充气门'
  description: Cork系列的高级型号。同样的膜结构，现在配有拉链。激活以放气。请勿刺破。
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _RMC14/Objects/Misc/inflatable_door.rsi
    state: closed
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 15
        layer:
        - WallLayer
  - type: Door
    occludes: false
    openSound:
      path: /Audio/Misc/zip.ogg
    closeSound:
      path: /Audio/Misc/zip.ogg
  - type: Damageable
    damageModifierSet: Inflatable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: DisassembleOnAltVerb
    prototypeToSpawn: CMUInflatableDoorFolded1
    disassembleTime: 3
  - type: Occluder
    enabled: false

- type: entity
  parent: CMBaseStructure
  id: CMUInflatableWallBroken
  name: 爆裂的充气墙
  description: 软木墙的残骸。它曾经阻挡的空气和它曾经容纳的空气如今已是同一片空气。
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _RMC14/Objects/Misc/inflatable_wall.rsi
    state: wall_popped
  - type: Fixtures
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Damageable
    damageModifierSet: Inflatable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: CMUInflatableWallBroken
  id: CMUInflatableDoorBroken
  name: 爆裂的充气门
  description: 一个软木门的残骸。拉链还在，其余部分都不值得保留了。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/inflatable_door.rsi
    state: door_popped
