- type: entity
  parent: CMBarricadeBase
  id: AU14DirtMound
  name: 土堆
  description: 一堆匆忙堆起的泥土。它比正规的沙袋路障脆弱得多，也无法用铁丝网加固。
  components:
  - type: DirtMound
  - type: Climbable
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Effects/Footsteps/snowstep1.ogg"
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: snow
      color: "#4d3e36"
    - map: [ "acided" ]
    drawdepth: WallTops
  - type: GenericVisualizer
    visuals:
      enum.SprayAcidedVisuals.Acided:
        acided:
          True:
            sprite: _RMC14/Effects/xeno_spray_acid.rsi
            state: acid
            visible: true
          False:
            visible: false
  - type: Damageable
    damageModifierSet: CMSandbag
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 750
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Flamability
    chance: 0.3
    rate: 0.8
    range: 0.5
    spread: 0.3
