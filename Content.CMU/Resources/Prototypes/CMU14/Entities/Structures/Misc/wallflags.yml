- type: entity
  parent: BaseSign
  id: AU14WallFlagBase
  abstract: true
  components:
  - type: WallMount
    arc: 360
  - type: Sprite
    drawdepth: WallTops
    sprite: CMU14/Structures/wallflags.rsi
    snapCardinals: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          PosterBroken:
            min: 1
            max: 1
        offset: 0

- type: entity
  parent: AU14WallFlagBase
  id: AU14WallFlagUA
  name: "乌克兰国旗"
  description: "美利坚合众国的旗帜。"
  components:
  - type: Sprite
    state: uaflag

- type: entity
  parent: AU14WallFlagBase
  id: AU14WallFlagUAWorn
  name: "磨损的UA旗帜"
  description: "联合美洲的旗帜。这一面已经饱经风霜了。"
  components:
  - type: Sprite
    state: uaflag_worn

