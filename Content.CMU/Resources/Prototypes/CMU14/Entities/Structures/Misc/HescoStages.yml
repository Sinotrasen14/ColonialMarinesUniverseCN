- type: entity
  parent: BaseItem
  id: AU14HescoKit
  name: 赫斯科套件
  description: 一个可折叠的金属网篮。将其放置在地面上，朝向您希望它面对的方向，然后使用挖壕工具用泥土将其填满。
  components:
  - type: HescoKit
    builds: AU14HescoUnfilled1
  - type: Item
    size: Huge
    sprite: CMU14/Structures/hesco.rsi
  - type: Sprite
    sprite: CMU14/Structures/hesco.rsi
    state: item_icon

- type: entity
  id: AU14HescoUnfilled1
  name: 未填充的HESCO网箱
  description: 一个空铁丝网HESCO篮。需要装满泥土才能发挥作用。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Climbable
  - type: Tag
    tags:
    - Structure
  - type: Damageable
    damageModifierSet: CMSandbag
  - type: Injurable
    damageContainer: Inorganic
  - type: HescoFillable
    nextStage: AU14HescoUnfilled2
  - type: HescoDisassemblable
    instant: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Sprite
    sprite: CMU14/Structures/hesco.rsi
    layers:
    - state: sand_wall_1
    - map: [ "acided" ]
    drawdepth: WallTops
  - type: Physics
    bodyType: Static
    canCollide: False
  - type: Appearance
  - type: Flamability
    chance: 0.2
    rate: 18.8
    range: 0.4
    spread: 0.2

