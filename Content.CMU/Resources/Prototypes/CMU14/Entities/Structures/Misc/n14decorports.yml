- type: entity
  id: Rails
  name: 铁路
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: CMU14/N14content/rails64.rsi
    state: rails
    netsync: false
    drawdepth: FloorObjects
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Clickable

