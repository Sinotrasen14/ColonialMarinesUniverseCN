- type: entity
  parent: BaseStructureDynamic
  id: AU14BlackBoxRecorder
  name: 殖民地黑匣子记录仪
  description: 国际殖民公司强制要求所有UA、UPP和TWE注册殖民地安装的数据记录仪。其设计能够在灾难性事件中幸存，持续记录关键的环境、结构和运行数据。一旦发生灾难，调查人员可借此重建事件经过并确定故障根本原因。不过这一台不是红色的。
  components:
  - type: Anchorable
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic
  - type: InteractionOutline
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetMetal1:
            min: 1
            max: 1
  - type: Sprite
    sprite:  CMU14/Structures/blackbox.rsi
    state: blackbox
