- type: entity
  id: CMUPathogenSporeSac
  parent: BaseStructure
  name: 孢子囊
  description: 一个搏动的肉质囊袋，会释放出一团有毒孢子。别碰它。
  components:
  - type: NpcFactionMember
    factions:
    - CMU14PathogenWalker
  - type: Sprite
    sprite: CMU14/Structures/Xeno/Pathogen/spore_sac.rsi
    layers:
    - state: closed
      map: ["enum.SporeSacVisualLayers.Base"]
  - type: Appearance
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 100
        hard: false
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: CMUPathogenSporeSac
  - type: MycotoxinInjector
    mycotoxinPerSecond: 8
    timeBetweenInjects: 1
    affectsDead: false
    embryoSpawn: CMU14XenoBloodburster
  - type: TimedDespawn
    lifetime: 60
