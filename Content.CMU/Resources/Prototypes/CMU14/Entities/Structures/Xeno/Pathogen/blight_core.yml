- type: entity
  id: CMU14PathogenBlightCore
  name: 枯萎核心
  description: 一团脉动的有机体。你感到被它吸引。
  components:
  - type: NpcFactionMember
    factions:
    - CMU14PathogenWalker
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: CollisionWake
    enabled: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        layer:
        - BulletImpassable
        density: 200
      pathogen_core:
        shape:
          !type:PhysShapeCircle
          radius: 1
        hard: false
        mask:
        - SmallMobLayer
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
  - type: MeleeReceivedMultiplier
    xenoDamage:
      types:
        Slash: 300
  - type: RMCMesonsNonviewable
    xenoVisible: true
  - type: Sprite
    sprite: CMU14/Structures/Xeno/Pathogen/pathogen_structures64x64.rsi
    layers:
    - sprite: CMU14/Structures/Xeno/Pathogen/pathogen_weeds.rsi
      state: hive_weed0
    - state: pathogen_core
    drawdepth: FloorObjects
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: CMUBlightCore
  - type: HiveCore
  - type: HiveMember
  - type: HiveConstructionLimited # built cores count toward the hive cap, not just the nodes
    id: CMU14PathogenBlightCore
  - type: UserInterface
    interfaces:
      enum.BlightCoreUiKey.Accept:
        type: BlightCoreAcceptBui
      enum.BlightCoreUiKey.Vote:
        type: BlightCoreVoteBui
  - type: XenoWeeds
    range: 7
    spawns: CMU14XenoMyceliumHiveWeeds
    level: 3
    blockOtherWeeds: true
    spreadsOnSemiWeedable: true
  - type: XenoWeedsSpreading
  - type: XenoStructureMapTracked
  - type: TacticalMapTracked
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/CMU14/Interface/neo_blips.rsi
      state: patho_core
    background:
      sprite: /Textures/CMU14/Interface/neo_blips.rsi
      state: background_pathogen

- type: entity
  id: CMU14PathogenBlightCoreConstructionNode
  parent: BaseHiveStructureNode
  name: 枯萎核心
  description: 一团脉动的有机质。看起来像是某种东西的标记。
  suffix: Construction
  components:
  - type: Sprite
    color: '#FFFFFFAA'
    sprite: CMU14/Structures/Xeno/Pathogen/pathogen_structures64x64.rsi
    layers:
    - state: pathogen_core
    - sprite: _RMC14/Interface/xeno_hud.rsi
      state: xeno_structure_node_indicator
      scale: 0.8, 0.8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: HiveConstructionNode
    initialPlasmaCost: 500
    plasmaCost: 400
    spawn: CMU14PathogenBlightCore
  - type: HiveConstructionRequiresWeedableSurface
  - type: HiveConstructionLimited
    id: CMU14PathogenBlightCore
  - type: WarpPoint
    location: cmu-warp-location-blight-core
