- type: entity
  id: CMU14PathogenRecoveryNode
  parent: BaseHiveStructure
  name: 恢复节点
  description: 一团温暖而舒缓的物质，能迅速恢复周围休息的姐妹们的体力。
  components:
  - type: NpcFactionMember
    factions:
    - CMU14PathogenWalker
  - type: Sprite
    sprite: CMU14/Structures/Xeno/Pathogen/pathogen_structures64x64.rsi
    state: recovery
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: MeleeReceivedMultiplier
    xenoDamage:
      types:
        Slash: 100
  - type: RecoveryNode
  - type: HiveConstructionRequiresHiveCore
  - type: HiveConstructionLimited
    id: CMU14PathogenRecoveryNode
  - type: HiveConstructionRequiresHiveWeeds
  - type: HiveConstructionRequiresSpace
  - type: DoAfter
  - type: XenoStructureMapTracked
  - type: TacticalMapTracked
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/CMU14/Interface/neo_blips.rsi
      state: recovery_node
    background:
      sprite: /Textures/CMU14/Interface/neo_blips.rsi
      state: background_pathogen

- type: entity
  id: CMU14PathogenRecoveryNodeConstructionNode
  parent: BaseHiveStructureNode
  name: 恢复节点
  description: 一团温暖、舒缓的块状物。看起来像是某种东西的标记。
  suffix: Construction
  components:
  - type: Sprite
    color: '#FFFFFFAA'
    layers:
    - sprite: CMU14/Structures/Xeno/Pathogen/pathogen_structures64x64.rsi
      state: recovery
    - sprite: _RMC14/Interface/xeno_hud.rsi
      state: xeno_structure_node_indicator
      scale: 0.8, 0.8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: HiveConstructionNode
    initialPlasmaCost: 400
    plasmaCost: 450
    spawn: CMU14PathogenRecoveryNode
  - type: HiveConstructionRequiresHiveCore
  - type: HiveConstructionLimited
    id: CMU14PathogenRecoveryNode
  - type: HiveConstructionRequiresHiveWeeds
  - type: HiveConstructionRequiresSpace
  - type: WarpPoint
    location: cmu-warp-location-recovery-node
