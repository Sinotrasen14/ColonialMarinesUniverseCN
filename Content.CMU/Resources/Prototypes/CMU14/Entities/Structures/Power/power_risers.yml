# HV Grid risers (tile power).
# Screwdriver toggles Role (Source/Sink).
# Crowbar toggles Direction (Up/Down).
# Multitool opens the service panel; with the panel open, crowbar deconstructs.
- type: entity
  parent: [BaseMachinePowered, ConstructibleMachine]
  id: CMUPowerRiserDown
  name: PR2-DE 电源竖井，向下
  suffix: CMU, MultiZ
  description: "静态方向：看向下方甲板。撬棍翻转方向。螺丝刀切换角色。多功能工具打开面板；撬开以拆除。"
  placement:
    mode: SnapgridCenter
  components:
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: RMCPowerReceiver
    idleLoad: 0
    activeLoad: 50
    channel: Environment
  - type: CMUPowerRiser
    source: true
  - type: Construction
    graph: CMUPowerRiserGraph
    node: built
  - type: WiresPanel
    openingTool: Pulsing
    examineTextClosed: cmu-zlevel-panel-closed
    examineTextOpen: cmu-zlevel-panel-open
  - type: Machine
    board: CMUPowerRiserMachineCircuitboard
  - type: CMUZPaired
    offset: -1
    pairKind: power
  - type: NodeContainer
    examinable: true
    nodes:
      output:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PowerSupplier
    supplyRate: 30000
    enabled: false
  - type: Sprite
    sprite: Structures/Power/substation.rsi
    layers:
    - state: substation

- type: entity
  parent: [BaseMachinePowered, ConstructibleMachine]
  id: CMUPowerRiserUp
  name: PR2-UE 电源竖板，向上
  suffix: CMU, MultiZ
  description: "静态方向：朝向上方甲板。撬棍翻转方向。螺丝刀切换角色。多功能工具打开面板；撬开以拆除。"
  placement:
    mode: SnapgridCenter
  components:
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: RMCPowerReceiver
    idleLoad: 0
    activeLoad: 50
    channel: Environment
  - type: CMUPowerRiser
  - type: Construction
    graph: CMUPowerRiserGraph
    node: built
  - type: WiresPanel
    openingTool: Pulsing
    examineTextClosed: cmu-zlevel-panel-closed
    examineTextOpen: cmu-zlevel-panel-open
  - type: Machine
    board: CMUPowerRiserMachineCircuitboard
  - type: CMUZPaired
    offset: 1
    pairKind: power
  - type: NodeContainer
    examinable: true
    nodes:
      output:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PowerSupplier
    supplyRate: 30000
    enabled: false
  - type: Sprite
    sprite: Structures/Power/substation.rsi
    layers:
    - state: substation_static

# Direct build like the pipe riser: the menu only lists isCM recipes and the
# riser board has no crafting source. Machine still auto-stocks on spawn.
- type: constructionGraph
  id: CMUPowerRiserGraph
  start: start
  graph:
  - node: start
    edges:
    - to: built
      completed:
      - !type:SnapToGrid
      steps:
      - material: CMSteel
        amount: 5
        doAfter: 2.5
  - node: built
    entity: CMUPowerRiserUp
    edges:
    - to: start
      conditions:
      - !type:WirePanel
      completed:
      - !type:SpawnPrototype
        prototype: CMSheetMetal1
        amount: 5
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 2

- type: construction
  id: CMUPowerRiserRecipe
  name: 电源竖井
  description: 一个高压甲板，将本层甲板的电网与上方或下方的电网连接起来。撬棍可切换方向，螺丝刀可切换源或汇。
  graph: CMUPowerRiserGraph
  startNode: start
  targetNode: built
  category: construction-category-utilities
  objectType: Structure
  placementMode: SnapgridCenter
  canRotate: false
  canBuildInImpassable: true
  isCM: true
