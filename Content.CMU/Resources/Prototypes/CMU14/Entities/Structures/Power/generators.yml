# ├──[ Portable Generators ]─────────────────────────────────────────┤
- type: entity
  parent: PortableGeneratorPacman # RMCPortableGenerator redundant?
  id: CMUGeneratorPortableDragon
  name: '“龙”DR-30便携式发电机'
  suffix: Phoron, 30 kW
  description: 一台额定功率最高可达30千瓦的燃烧燃料发电机。它大口吞食固态磷光体片，并呼出二氧化碳——现场人员称它为“龙”是有原因的。
  components:
  - type: Machine
    board: CMUGeneratorPortableDragonMachineCircuitboard
  - type: SolidFuelGeneratorAdapter
    fuelMaterial: CMPhoron
    multiplier: 0.0005 # One fuel unit per 2,000-material CM phoron sheet.
  - type: CMUSolidFuelStorage
  - type: MaterialStorage
    materialWhiteList: [ CMPhoron ]
    storageLimit: 60000 # Thirty sheets, matching the inherited fuel-unit capacity.
    insertOnInteract: false # CMUSolidFuelStorage inserts only the sheets that fit.

- type: entity
  parent: CMBaseMachineCircuitboard
  id: CMUGeneratorPortableDragonMachineCircuitboard
  name: '“龙”DR-30 发电机机器板'
  description: 一台用于便携式发电机的机器印刷电路板。
  components:
  - type: Sprite
    state: power_mod
  - type: MachineBoard
    prototype: CMUGeneratorPortableDragon

# RMC portable generators only feed their own area, which makes them the area-power
# backup loop: drag to a dead area, anchor, fuel, start.
- type: entity
  parent: RMCPortableGenerator2
  id: CMUGeneratorPortableOrochi
  name: '“大蛇”OR-30便携式发电机'
  suffix: Phoron, 30 kW
  description: 一台额定功率为30千瓦的重型便携式发电机。大得让人爱不起来，实用得让人舍不得丢下。
  components:
  - type: RMCPortableGenerator
    watts: 30000
    timePerSheet: 240
    fuelStackType: CMPhoron
    fuelEntity: CMSheetPhoron1
    fuelName: phoron

# ├──[ Power Generators ]────────────────────────────────────────────┤
# Dual-mode: RMC area power by default, HV grid supply on CMUMapUsesTilePower maps.
# RMCPowerSystem gates the two channels at runtime, so one proto serves both map
# families. Both ship damaged (randomizeDamage) for the planet repair arc; a mapper
# wanting a roundstart-working generator uses the upstream RMCGeneratorFusion.
- type: entity
  parent: RMCGeneratorFusion
  id: CMUGeneratorFusion
  components:
  - type: RMCFusionReactor
    randomizeDamage: true
  - type: PowerSupplier
    supplyRate: 50000
    supplyRampRate: 5000
    supplyRampTolerance: 5000
    enabled: false
  - type: NodeContainer
    examinable: true
    nodes:
      output:
        !type:CableDeviceNode
        nodeGroupID: HVPower

# Anchor on an HV cable tile: the output node merges with the cable run there.
- type: entity
  parent: RMCGeneratorFusionColony
  id: CMUGeneratorThermo
  components:
  - type: PowerSupplier
    supplyRate: 100000
    supplyRampRate: 5000
    supplyRampTolerance: 5000
    enabled: false
  - type: NodeContainer
    examinable: true
    nodes:
      output:
        !type:CableDeviceNode
        nodeGroupID: HVPower

- type: entity
  parent: CMUGeneratorThermo
  id: CMUGeneratorThermoNoMapIcon
  suffix: No Map Icon
  components:
  - type: RemoveComponents
    components:
    - type: MarineMapTracked
    - type: XenoMapTracked
    - type: TacticalMapTracked
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: generator
