- type: entity
  parent: RMCShutterHybrisa
  id: CMUShutterHybrisaAdjutantLock
  name: 军械库百叶窗
  description: 一套厚重的百叶窗，用于确保军械库的安全。可以通过CIC中的按钮打开。如果指挥部没有醒来打开这些百叶窗，它们会在一段时间后自行打开。
  suffix: GOVFOR
  components:
  - type: RMCPodDoor
    id: cmu_adjutant_lock
  - type: CMUAdjutantLockDoor

- type: entity
  parent: RMCPodDoorButtonCommand
  id: CMUPodDoorButtonAdjutantLock
  name: 军械库百叶窗控制
  description: 一个按钮，如果指挥部没有出现来操作它，它就会自行锁定在打开状态。
  suffix: GOVFOR, Armory
  components:
  - type: RMCDoorButton
    id: cmu_adjutant_lock
  - type: AccessReader
    access: [ [ "AU14AccessGovforCommand" ], [ "AU14AccessOpforCommand" ] ]
