- type: entity
  abstract: true
  parent: RMCCommunicationsConsoleBase
  id: AU14AllianceConsoleBase
  name: 联盟控制台
  description: 用于管理与第三方派系外交关系的安全指挥部终端。友好派系不会遭到你的哨兵攻击。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: terminal
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false
  - type: ActivatableUI
    key: enum.AllianceConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.AllianceConsoleUiKey.Key:
        type: AllianceConsoleBui

- type: entity
  parent: AU14AllianceConsoleBase
  id: AU14AllianceConsoleGovfor
  name: 联盟控制台（GovFor）
  suffix: GovFor
  description: 一个GovFor指挥部终端，用于管理与第三方派系的外交关系。
  components:
  - type: AllianceConsole
    faction: govfor

- type: entity
  parent: AU14AllianceConsoleBase
  id: AU14AllianceConsoleOpfor
  name: 联盟控制台（OpFor）
  suffix: OpFor
  description: 一个用于管理第三方派系外交关系的指挥部终端。
  components:
  - type: AllianceConsole
    faction: opfor

- type: entity
  parent: AU14AllianceConsoleBase
  id: AU14AllianceConsoleWeYu
  name: 联盟控制台（维兰德-汤谷）
  suffix: WeYu
  description: 一个维兰德-汤谷公司的终端，用于管理与其他派系的企业外交关系。
  components:
  - type: AllianceConsole
    faction: AUWeYu

- type: entity
  parent: AU14AllianceConsoleBase
  id: AU14AllianceConsoleCLF
  name: 联盟控制台（INSFOR）
  suffix: INSFOR
  description: 一个用于管理同第三方派系外交关系的INSFOR指挥部终端。
  components:
  - type: AllianceConsole
    faction: clf
