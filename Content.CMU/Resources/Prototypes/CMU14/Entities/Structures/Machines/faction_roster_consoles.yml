- type: entity
  id: CMUFactionRosterConsoleBase
  abstract: true
  parent: RMCCommunicationsConsoleBase
  name: 人员名册控制台
  description: 一台用于调取某一特定派系相关人员档案的终端。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: terminal1_old
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false
  - type: ActivatableUI
    key: enum.FactionRosterConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FactionRosterConsoleUiKey.Key:
        type: FactionRosterConsoleBoundUserInterface

- type: entity
  id: CMUGovforRosterConsole
  parent: CMUFactionRosterConsoleBase
  name: 政府军人员控制台
  description: 列出GOVFOR人员档案。
  suffix: GOVFOR
  components:
  - type: FactionRosterConsole
    faction: GOVFOR

- type: entity
  id: CMUOpforRosterConsole
  parent: CMUFactionRosterConsoleBase
  name: 敌方人员控制台
  description: 列出敌方人员档案。
  suffix: OPFOR
  components:
  - type: FactionRosterConsole
    faction: OPFOR

- type: entity
  id: CMUColonyRosterConsole
  parent: CMUFactionRosterConsoleBase
  name: 殖民地居民控制台
  description: 列出殖民地居民档案。
  suffix: Colony
  components:
  - type: FactionRosterConsole
    faction: AUColonist
