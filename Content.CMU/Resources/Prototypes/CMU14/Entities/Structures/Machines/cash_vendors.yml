# Cash-operated vending machines — require cash inserted to dispense items.
# Sales tax (set via admin console) is applied on top of the base price.
# All tax revenue goes to the colony budget.

# Base entity for pay-to-use vendors
- type: entity
  id: AU14CashVendorBase
  abstract: true
  parent: CMBaseStructureCorrodible
  name: 自动售货机
  description: 投入现金并选择要购买的商品。
  components:
  - type: ItemSlots
    slots:
      ItemCabinet:
        whitelist:
          tags:
          - Currency
  - type: AU14CashVendor
  - type: ActivatableUI
    key: enum.AU14CashVendorUi.Key
  - type: UserInterface
    interfaces:
      enum.AU14CashVendorUi.Key:
        type: AU14CashVendorBui
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false
  - type: ContainerContainer
    containers:
      ItemCabinet: !type:ContainerSlot {}
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.35,0.25,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/corp_wardrobe.rsi
    layers:
    - state: "base"
  - type: InteractionOutline
  - type: Appearance
  - type: Damageable
    damageModifierSet: GlassReinforcedMod
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 175
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak

# Base for cash vendors that also have shopkeeper stock management
- type: entity
  id: AU14CashVendorShopkeepBase
  abstract: true
  parent: AU14CashVendorBase
  components:
  - type: AU14ShopkeeperVendor
  - type: AccessReader
    access:
    - - AU14AccessShopkeep
  - type: UserInterface
    interfaces:
      enum.AU14CashVendorUi.Key:
        type: AU14CashVendorBui
      enum.AU14ShopkeeperVendorUi.Shop:
        type: AU14ShopkeeperVendorBui
  - type: ContainerContainer
    containers:
      ItemCabinet: !type:ContainerSlot {}
      shopkeeper_cash: !type:ContainerSlot {}
      shopkeeper_stock: !type:Container {}

# Corporate drink machine — sells beverages for cash
- type: entity
  id: AU14CashDrinkMachine
  parent: AU14CashVendorShopkeepBase
