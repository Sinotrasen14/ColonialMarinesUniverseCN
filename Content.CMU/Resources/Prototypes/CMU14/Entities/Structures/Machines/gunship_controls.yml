- type: entity
  parent: CMComputerDropshipNavigation
  id: CMUComputerGunshipControls
  name: 炮艇控制
  description: 一种用于导航并为武装直升机指定战术着陆点的飞行计算机。
  components:
  - type: Sprite
    sprite: CMU14/Structures/Machines/gunship_controls.rsi
    state: gunship_console
  # Retained as a marker for gunship-console crash effects. Interaction and UI
  # behavior come entirely from CMComputerDropshipNavigation.
  - type: GunshipControls
  - type: CMUDropshipDoorsLockOpen
  - type: DropshipNavigationComputer
    canTacticalLand: true
    tacticalLandFootprintOverride: 9, 15
  - type: WhitelistedShuttle
    faction: govfor
    ShuttleType: Dropship
  - type: TacticalMapComputer
    faction: govfor
  - type: RequiresSkill
    skills:
      RMCSkillPilot: 1
