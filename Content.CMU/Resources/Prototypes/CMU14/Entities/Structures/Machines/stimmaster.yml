- type: entity
  parent: CMChemMaster
  id: CMUStimmaster
  name: Stimmaster 1000
  description: 一种化学操控器，可制造并填充定制的自动注射器。直接将金属板和玻璃板插入其中即可。
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/Science/industry_dispenser.rsi
    layers:
    - state: industry_mixer0_nopower
    - state: industry_mixer0_screen
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Icon
    sprite: _RMC14/Structures/Machines/Science/industry_dispenser.rsi
    state: industry_mixer0
  - type: SolutionContainerManager
    solutions:
      buffer:
        maxVol: 1000
        canReact: false
  - type: MaterialStorage
    whitelist:
      tags:
      - Metal
      - RMCGlass
  - type: Machine
    board: CMUCircuitboardStimmaster
  - type: CMUStimmaster
    injectorPrototypes:
    - RMCMedicAutoInjectorCS5
    - RMCMedicAutoInjectorCS15
    - RMCMedicAutoInjectorCS30
    - RMCMedicAutoInjectorCS60
    - RMCMedicAutoInjectorEZ1
    - RMCMedicAutoInjectorEZ5
    - RMCMedicAutoInjectorEZ10
    - RMCMedicAutoInjectorEZ15
    - RMCMedicAutoInjectorEZ30
    - RMCMedicAutoInjectorEZ45
    - RMCMedicAutoInjectorEZ60

- type: entity
  parent: CMBaseMachineCircuitboard
  id: CMUCircuitboardStimmaster
  name: stim master 机板
  description: 一台用于Stimmaster的机器印刷电路板。
  components:
  - type: Sprite
    state: blank_mod
  - type: MachineBoard
    prototype: CMUStimmaster
    # TODO CMU14 material requirements
