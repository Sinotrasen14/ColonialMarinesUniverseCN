- type: entity
  id: AU14AICoreCPU
  parent: RMCAICoreProcessor
  name: 阿波罗 CPU
  description: 这是APOLLO的中央处理器。其外壳设计可抵御核爆，CPU内部还装有APOLLO的黑匣子记录仪。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/aicoremachinery.rsi
    layers:
    - state: cpu_off
    - state: cpu
      map: ["enum.PowerDeviceVisualLayers.Powered"]

- type: entity
  id: AU14AICoreSubstrate
  parent: RMCAICoreProcessor
  name: 阿波罗基底
  description: APOLLO的记忆基底，包含复杂的协议和信息。在主APOLLO单元未运行时，有限的功能可仅依靠基底运行。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/aicoremachinery.rsi
    layers:
    - state: substrate_off
    - state: substrate
      map: ["enum.PowerDeviceVisualLayers.Powered"]

- type: entity
  id: APOLLOAICoreProcessor
  name: APOLLO处理器
  description: 一个用于APOLLO的外部处理器，用于处理海量信息。
  placement:
    mode: SnapgridCenter
  components: #has no collission in 13 they have invisible walls behind it
  - type: InteractionOutline
  - type: Clickable
  - type: Corrodible
    isCorrodible: false
  - type: ApcPowerReceiver
    powerLoad: 250
    needsPower: true
  - type: RMCPowerReceiver
    idleLoad: 5
    activeLoad: 10
    channel: Equipment
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/aicoremachinery.rsi
    layers:
    - state: processor_off
    - state: processor
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000 # Okey hear me out down there... Health is 1000 in 13 but you can go over 1000+ and it goes on...
#      behaviors:
#      - !type:DoActsBehavior
#        acts: [ "Destruction" ]

