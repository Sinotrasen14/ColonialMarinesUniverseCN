- type: entity
  abstract: true
  parent: RMCCommunicationsConsoleBase
  id: AU14WithdrawConsoleBase
  name: 提现控制台
  description: 一个安全的指挥部终端，用于正式发起派系退出行动。
  components:
  - type: Sprite
    sprite: CMU14/Bosenmori/Exact/f296dfb968b89c38f716.rsi
    state: source
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false
  - type: ActivatableUI
    key: enum.WithdrawConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.WithdrawConsoleUiKey.Key:
        type: WithdrawConsoleBui

- type: entity
  parent: AU14WithdrawConsoleBase
  id: AU14WithdrawConsoleGovFor
  name: 撤回控制台（GovFor）
  suffix: GovFor
  description: 一个安全的GovFor指挥部终端，用于发起正式撤离。需要两个授权ID才能解锁。
  components:
  - type: WithdrawConsole
    faction: govfor

- type: entity
  parent: AU14WithdrawConsoleBase
  id: AU14WithdrawConsoleOpFor
  name: 撤回控制台（OpFor）
  suffix: OpFor
  description: 一个安全的假想敌指挥部终端，用于发起正式撤离。需要两个授权ID才能解锁。
  components:
  - type: WithdrawConsole
    faction: opfor

- type: entity
  parent: AU14WithdrawConsoleBase
  id: AU14WithdrawConsoleColony
  name: 撤回控制台（殖民地）
  suffix: Colony
  description: 一个用于发起正式撤离的安全殖民地管理终端。需要一张授权的殖民地管理员钥匙卡才能解锁。
  components:
  - type: WithdrawConsole
    faction: colony
    requiredIdCount: 1
    useAccessCheck: true
  - type: AccessReader
    access: [ [ "AU14AccessColonyAdministrator" ] ]
