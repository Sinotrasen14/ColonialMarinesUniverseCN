# field-built antenna mast. a real job for engineering-trained personnel: lay a footing
# on open ground, raise and weld a lattice, guy it, fit an antenna head that has to come
# from requisitions (or be built at great expense), tune the feed, key it to a side with a
# COMSEC fill card and seal it. the finished mast only carries the nets it was keyed for.
# taking one over means opening the feed back up, loading your own card and sealing it again

- type: rmcConstruction
  id: AU14CommsMastFieldBuild
  name: 天线桅杆部件
  prototype: AU14CommsMastField
  noRotate: true
  skill: RMCSkillEngineer
  requiredSkillLevel: 2
  alternativeSkill: RMCSkillJtac
  alternativeSkillLevel: 4
  listed:
  - AU14CommsMastFootingBuild
  - AU14MastAntennaHeadFrameBuild

- type: rmcConstruction
  id: AU14CommsMastFootingBuild
  name: 桅杆底座
  prototype: AU14CommsMastFooting
  noRotate: true
  doAfterTime: 30
  doAfterTimeMin: 20
  materialCost: 40
  skill: RMCSkillEngineer
  requiredSkillLevel: 2
  alternativeSkill: RMCSkillJtac
  alternativeSkillLevel: 4

- type: rmcConstruction
  id: AU14MastAntennaHeadFrameBuild
  name: 天线头框架
  prototype: AU14MastAntennaHeadFrame
  noRotate: true
  doAfterTime: 20
  doAfterTimeMin: 10
  materialCost: 20
  skill: RMCSkillEngineer
  requiredSkillLevel: 2
  alternativeSkill: RMCSkillJtac
  alternativeSkillLevel: 4
  ignoreBuildRestrictions: true
  restrictedCollisionGroup:

# --- the antenna head ---------------------------------------------------------------------
- type: entity
  parent: BaseItem
  id: AU14MastAntennaHead
  name: 桅杆天线头
  description: >-
    一个高增益天线头，其馈源喇叭、巴伦和避雷器均已安装完毕，并已装箱以便搬运。它需要双手搬运，无法放入包中——必须有人把它搬到天线杆处。
  components:
  - type: Sprite
    sprite: CMU14/Objects/Radio/anprc117g.rsi
    state: antenna_m
  - type: Item
    size: Huge
  - type: Tag
    tags:
    - AU14MastAntennaHead
  - type: StaticPrice
    price: 2500
  # the last node of the field-built head's graph. construction swaps the frame for this
  # entity and needs it to sit on the same graph, or the swap throws halfway and the frame
  # is simply gone
  - type: Construction
    graph: AU14MastAntennaHeadGraph
    node: head

# built in the field instead of ordered. every board, sheet and metre of cable in it is
# something the platoon will not have for anything else - that is the point
- type: entity
  parent: BaseItem
  id: AU14MastAntennaHeadFrame
  name: 天线头框架
  description: >-
    一个桅杆天线头的裸露金属骨架。要把它变成真正能辐射信号的东西，需要大量塑钢、一叠电路板和大量精细的布线。
  components:
  - type: Sprite
    sprite: CMU14/Objects/Radio/anprc117g.rsi
    state: antenna_m
    color: "#8a8f96"
  - type: Item
    size: Huge
  - type: AU14MastAssembly
  - type: Construction
    graph: AU14MastAntennaHeadGraph
    node: frame
    defaultTarget: head

- type: constructionGraph
  id: AU14MastAntennaHeadGraph
  start: start
  graph:
  - node: start
    actions:
    - !type:DeleteEntity

  - node: frame
    entity: AU14MastAntennaHeadFrame
    edges:
    - to: plated
      steps:
      - material: CMPlasteel
        amount: 20
        doAfter: 20
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: CMSheetMetal1
        amount: 15
      - !type:DeleteEntity
      steps:
      - tool: Anchoring
        doAfter: 10

  - node: plated
    entity: AU14MastAntennaHeadFrame
    edges:
    - to: boardOne
      steps:
      - tag: RMCCircuitboard
        name: "电路板"
        icon:
          sprite: _RMC14/Objects/Misc/module.rsi
          state: door_electronics
        doAfter: 8

  - node: boardOne
    entity: AU14MastAntennaHeadFrame
    edges:
    - to: boardTwo
      steps:
      - tag: RMCCircuitboard
        name: "电路板"
        icon:
          sprite: _RMC14/Objects/Misc/module.rsi
          state: door_electronics
        doAfter: 8

  - node: boardTwo
    entity: AU14MastAntennaHeadFrame
    edges:
    - to: boardThree
      steps:
      - tag: RMCCircuitboard
        name: "电路板"
        icon:
          sprite: _RMC14/Objects/Misc/module.rsi
          state: door_electronics
        doAfter: 8

  - node: boardThree
    entity: AU14MastAntennaHeadFrame
    edges:
    - to: boards
      steps:
      - tag: RMCCircuitboard
        name: "电路板"
        icon:
          sprite: _RMC14/Objects/Misc/module.rsi
          state: door_electronics
        doAfter: 8

  - node: boards
    entity: AU14MastAntennaHeadFrame
    edges:
    - to: wired
      steps:
      - material: RMCCable
        amount: 30
        doAfter: 20

  - node: wired
    entity: AU14MastAntennaHeadFrame
    edges:
    - to: shelled
      steps:
      - material: CMPlasteel
        amount: 20
        doAfter: 20
      - tool: Welding
        doAfter: 20
        fuel: 20

  - node: shelled
    entity: AU14MastAntennaHeadFrame
    edges:
    - to: head
      steps:
      - tool: Pulsing
        doAfter: 30

  - node: head
    entity: AU14MastAntennaHead

# --- mast assembly graph ------------------------------------------------------------------
- type: constructionGraph
  id: AU14CommsMastGraph
  start: start
  graph:
  - node: start
    actions:
    - !type:DeleteEntity

  - node: footing
    entity: AU14CommsMastFooting
    edges:
    - to: braced
      steps:
      - tool: Anchoring
        doAfter: 15
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: CMSheetMetal1
        amount: 25
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 10

  - node: braced
    entity: AU14CommsMastFooting
    edges:
    - to: lattice
      steps:
      - material: CMRodMetal
        amount: 30
        doAfter: 35
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: CMSheetMetal1
        amount: 25
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 10

  - node: lattice
    entity: AU14CommsMastLattice
    edges:
    - to: welded
      steps:
      - tool: Welding
        doAfter: 25
        fuel: 15
    - to: braced
      completed:
      - !type:SpawnPrototype
        prototype: CMRodMetal1
        amount: 20
      steps:
      - tool: Prying
        doAfter: 15

  - node: welded
    entity: AU14CommsMastLattice
    edges:
    - to: guyed
      steps:
      - material: RMCCable
        amount: 15
        doAfter: 25

  - node: guyed
    entity: AU14CommsMastLattice
    edges:
    - to: head
      steps:
      - tag: AU14MastAntennaHead
        name: "桅杆天线头"
        icon:
          sprite: CMU14/Objects/Radio/anprc117g.rsi
          state: antenna_m
        doAfter: 20

  # head is fitted, feed not yet run. prying it back off returns the head intact
  - node: head
    entity: AU14CommsMastRigged
    edges:
    - to: feedOpen
      steps:
      - material: CMPlasteel
        amount: 10
        doAfter: 20
      - tool: Pulsing
        doAfter: 25
    - to: guyed
      completed:
      - !type:SpawnPrototype
        prototype: AU14MastAntennaHead
      steps:
      - tool: Prying
        doAfter: 20

  # feed run and tuned, panel open. keys go in (fill card) or get wiped (multitool) only
  # here, see AU14MastAssemblySystem. sealing needs at least one key loaded. tearing the
  # mast down from here salvages the head along with the metal
  - node: feedOpen
    entity: AU14CommsMastRigged
    edges:
    - to: mast
      conditions:
      - !type:AU14MastKeyed
      steps:
      - tool: Screwing
        doAfter: 10
      - tool: Welding
        doAfter: 15
        fuel: 5
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: CMSheetMetal1
        amount: 30
      - !type:SpawnPrototype
        prototype: CMRodMetal1
        amount: 15
      - !type:SpawnPrototype
        prototype: AU14MastAntennaHead
      - !type:DeleteEntity
      steps:
      - tool: Cutting
        doAfter: 15
      - tool: Anchoring
        doAfter: 25

  # sealed and relaying. opening the feed back up - to re-key it for another side, or to
  # tear it down - takes the mast off the air until it is sealed again
  - node: mast
    entity: AU14CommsMastField
    edges:
    - to: feedOpen
      steps:
      - tool: Screwing
        doAfter: 15
      - tool: Cutting
        doAfter: 15

# --- half-built stages --------------------------------------------------------------------
- type: entity
  abstract: true
  parent: BaseStructure
  id: AU14CommsMastStageBase
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 200
        mask:
        - MobLayer
  - type: Damageable
    damageModifierSet:
  - type: Injurable
    damageContainer: Inorganic
  - type: MaxDamage
    max: 150
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 140
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: AU14MastAssembly

# the COMSEC key set, shared by the untuned and the finished mast so the keys survive the
# construction swap between them. a card for a faction not listed here is refused
- type: entity
  abstract: true
  id: AU14MastKeyedBase
  components:
  - type: AU14MastKey
    factionChannels:
      govfor:
      - radioGovforAlpha
      - radioGovforBravo
      - radioGovforCharlie
      - radioGovforCommand
      - radioGovforIntel
      - radioGovforFoxtrot
      - radioGovforJTAC
      - radioGovforMILP
      opfor:
      - radioOpforAlpha
      - radioOpforBravo
      - radioOpforCharlie
      - radioOpforCommand
      - radioOpforIntel
      - radioOpforVictor
      - radioOpforJTAC
      - radioOpforMILP
      clf:
      - radioCLF
      - radioCLFCommand

- type: entity
  parent: AU14CommsMastStageBase
  id: AU14CommsMastFooting
  name: 桅杆底座
  description: >-
    一个用桩固定的底板，周围用桩钉出了接地网。上面还什么都没有——必须先架起各段，这东西才能派上用场。
  suffix: Field-Built, Stage 1
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/girder.rsi
    state: girder
  - type: AU14MastSite
  - type: Construction
    graph: AU14CommsMastGraph
    node: footing
    defaultTarget: mast

- type: entity
  parent: AU14CommsMastStageBase
  id: AU14CommsMastLattice
  name: 半升天线桅杆
  description: >-
    杆段用螺栓连接成格构，靠自重斜立。在节点焊接、缆风绳拉好之前，第一阵强风就能把它掀翻。
  suffix: Field-Built, Stage 2
  components:
  - type: Sprite
    sprite: _RMC14/Structures/communications_tower_alt.rsi
    offset: 0, 1
    state: comm_tower_destroyed
  - type: Construction
    graph: AU14CommsMastGraph
    node: lattice
    defaultTarget: mast

- type: entity
  parent: [AU14CommsMastStageBase, AU14MastKeyedBase]
  id: AU14CommsMastRigged
  name: 未调谐天线桅杆
  description: >-
    架设完毕，用拉线固定，顶部装有天线头，但馈电面板敞开，没有任何密封。这种状态下它完全不承载任何通信流量。
  suffix: Field-Built, Stage 3
  components:
  - type: Sprite
    sprite: _RMC14/Structures/communications_tower_alt.rsi
    offset: 0, 1
    state: comm_tower_off
    color: "#8d9096"
  - type: MaxDamage
    max: 300
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 280
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: AU14CommsMastGraph
    node: head
    defaultTarget: mast
