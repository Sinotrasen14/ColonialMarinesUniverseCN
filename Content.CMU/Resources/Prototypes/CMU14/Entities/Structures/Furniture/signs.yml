- type: entity
  parent: BaseStructure
  id: DecorSignMinesProp
  name: 地雷
  suffix: Prop
  description: 地雷与死亡的危险……
  components:
  - type: Sprite
    sprite: CMU14/N14content/world.rsi
    state: mine_sign
  - type: Construction
    graph: AU14SignGraph
    node: sign_mines

# ├──[ CONSTRUCTION MENU ]───────────────────────────────────────────┤
- type: construction
  parent: RMC
  name: 矿井标志
  id: AU14ConstructionSignMines
  graph: AU14SignGraph
  startNode: start
  targetNode: sign_mines
  category: construction-category-cm-furniture
  description: 一个警告有地雷的标志。
  objectType: Structure
  canBuildInImpassable: false
  conditions:
    - !type:TileNotBlocked

- type: construction
  parent: RMC
  name: 交通指挥员（空）
  id: AU14ConstructionSignEmpty
  graph: AU14SignGraph
  startNode: start
  targetNode: sign_empty
  category: construction-category-cm-furniture
  description: 一个空白的交通指挥标志牌。
  objectType: Structure
  canBuildInImpassable: false
  conditions:
    - !type:TileNotBlocked

- type: construction
  parent: AU14ConstructionSignEmpty
  name: 交通指挥员（疏散中心）
  id: AU14ConstructionSignEvacCenter
  targetNode: sign_evaccenter
  description: 指示前往疏散中心。

- type: construction
  parent: AU14ConstructionSignEmpty
  name: 交通指挥员（前方检查站）
  id: AU14ConstructionSignCheckpoint
  targetNode: sign_cpahead
  description: 警告前方有检查站。

- type: construction
  parent: AU14ConstructionSignEmpty
  name: 交通指挥员（服从军队命令）
  id: AU14ConstructionSignFollowOrders
  targetNode: sign_armyorders
  description: 提醒：请遵守军队命令。

- type: construction
  parent: AU14ConstructionSignEmpty
  name: 交通指挥员（调频）
  id: AU14ConstructionSignTuneFreq
  targetNode: sign_freqtune
  description: 告诉人们调到91.7 AM。

- type: construction
  parent: AU14ConstructionSignEmpty
  name: 交通指挥员（减速）
  id: AU14ConstructionSignSlowDown
  targetNode: sign_slowdown
  description: 指示减速。

# ├──[ CONSTRUCTION GRAPH ]──────────────────────────────────────────┤
- type: constructionGraph
  parent: RMC
  id: AU14SignGraph
  start: start
  graph:
  - node: start
    actions:
    - !type:DeleteEntity {}
    edges:
    - to: sign_mines
      steps:
      - material: RMCWood
        amount: 2
        doAfter: 2
    - to: sign_evaccenter
      steps:
      - material: CMSteel
        amount: 4
        doAfter: 5
    - to: sign_cpahead
      steps:
      - material: CMSteel
        amount: 4
        doAfter: 5
    - to: sign_armyorders
      steps:
      - material: CMSteel
        amount: 4
        doAfter: 5
    - to: sign_freqtune
      steps:
      - material: CMSteel
        amount: 4
        doAfter: 5
    - to: sign_slowdown
      steps:
      - material: CMSteel
        amount: 4
        doAfter: 5
    - to: sign_empty
      steps:
      - material: CMSteel
        amount: 4
        doAfter: 5
  - node: sign_mines
    entity: DecorSignMinesProp
    edges:
    - to: start
      steps:
      - tool: Screwing
        doAfter: 3
      completed:
        - !type:SpawnPrototype
          prototype: RMCPlankWood2
  - node: sign_evaccenter
    entity: AU14PropTrafficDirector1
    edges:
    - to: start
      steps:
      - tool: Anchoring
        doAfter: 3
      - tool: Prying
        doAfter: 4
      completed:
        - !type:SpawnPrototype
          prototype: CMSheetMetal1
  - node: sign_cpahead
    entity: AU14PropTrafficDirector2
    edges:
    - to: start
      steps:
      - tool: Anchoring
        doAfter: 3
      - tool: Prying
        doAfter: 4
      completed:
        - !type:SpawnPrototype
          prototype: CMSheetMetal1
  - node: sign_armyorders
    entity: AU14PropTrafficDirector3
    edges:
    - to: start
      steps:
      - tool: Anchoring
        doAfter: 3
      - tool: Prying
        doAfter: 4
      completed:
        - !type:SpawnPrototype
          prototype: CMSheetMetal1
  - node: sign_freqtune
    entity: AU14PropTrafficDirector4
    edges:
    - to: start
      steps:
      - tool: Anchoring
        doAfter: 3
      - tool: Prying
        doAfter: 4
      completed:
        - !type:SpawnPrototype
          prototype: CMSheetMetal1
  - node: sign_slowdown
    entity: AU14PropTrafficDirector5
    edges:
    - to: start
      steps:
      - tool: Anchoring
        doAfter: 3
      - tool: Prying
        doAfter: 4
      completed:
        - !type:SpawnPrototype
          prototype: CMSheetMetal1
  - node: sign_empty
    entity: AU14PropTrafficDirector6
    edges:
    - to: start
      steps:
      - tool: Anchoring
        doAfter: 3
      - tool: Prying
        doAfter: 4
      completed:
        - !type:SpawnPrototype
          prototype: CMSheetMetal1
