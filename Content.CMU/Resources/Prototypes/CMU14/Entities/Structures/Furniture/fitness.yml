  id: CMUFitnessWeightsBench
  name: 配重凳
  description: 一个用来举重锻炼的长椅。
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
  - type: Rotatable
  - type: Sprite
    sprite: CMU14/N14content/fitness.rsi
    state: fitnessweight

- type: entity
