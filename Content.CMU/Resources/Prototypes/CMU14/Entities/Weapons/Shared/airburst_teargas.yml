- type: entity
  parent: RMCBaseAirBurstGrenade
  id: CM14AirBurstTearGas
  name: M74 AGM-PDC催泪弹
  description: M74 - 空爆榴弹 - 人员拒止气罐。此榴弹必须用榴弹发射器发射，到达目的地后引爆。它会释放出一团具有暂时性神经肌肉效应的刺激性气体。
  components:
  - type: Sprite
    sprite:  CMU14/Objects/Weapons/Guns/Ammunition/teargascanister.rsi
    layers:
    - state: grenade_teargas
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCAirburstGrenade
    - RMCGrenadeAGMF
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: TriggerOnFixedDistanceStop
    delay: 1
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: CMU14AirBurstProjectileTearGas

- type: entity
  parent: RMCBaseAirBurstProjectile
  id: CMU14AirBurstProjectileTearGas
  name: M74 AGM-PDC 催泪瓦斯弹
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: CMU14/Objects/Weapons/Guns/Ammunition/teargascanister.rsi
    layers:
    - state: grenade_teargas_active
  - type: SpawnOnTerminate
    spawn: CMU14InstantTearGas
    projectileAdjust: false
  - type: EmitSoundOnTrigger
    sound: /Audio/Effects/smoke.ogg
    positional: true
  - type: DeleteOnTrigger
