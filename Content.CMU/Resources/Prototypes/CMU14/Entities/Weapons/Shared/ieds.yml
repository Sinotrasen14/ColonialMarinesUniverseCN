- type: entity
  abstract: true
  parent: BaseItem
  id: CMUIEDBase
  name: 手榴弹
  description: 卧倒掩护。
  components:
  - type: Explosive
    explosionType: RMC
  - type: ExplosionResistance
    damageCoefficient: 0
  - type: IgnorePredictionHide
  - type: Clothing
    slots:
    - suitStorage
  - type: Destructible
    thresholds: []
  - type: ChangeItemSizeOnTimerTrigger
  - type: CancelUseWithCloak
  - type: Appearance
  - type: AnimationPlayer
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        enum.ConstructionVisuals.Layer:
          Primed: { state: primed }
          Unprimed: { state: icon }

- type: entity
  parent: CMUIEDBase
  id: CMUPipeBomb
  name: 管状炸弹
  description: 一种廉价的伤人方式。由你们当地的叛乱分子设计。
  components:
  - type: Sprite
    sprite: CMU14/Items/pipebomb.rsi
    layers:
    - state: base
      map: ["enum.TriggerVisualLayers.Base"]
    - state: wires
  - type: ExplodeOnTrigger
  - type: Explosive
    maxIntensity: 20
    intensitySlope: 8
    totalIntensity: 100
    deleteAfterExplosion: false
  - type: TriggerOnIgniterUse
    keyOut: ignite
  - type: TimerTrigger
    keysIn:
    - ignite
    keyOut: trigger
    examinable: false
    initialBeepDelay: 0
    beepSound: /Audio/Effects/lightburn.ogg
  - type: RandomTimerTrigger
    min: 1
    max: 4
  - type: ProjectileGrenade
    fillPrototype: CMProjectileShrapnel
    capacity: 20
  - type: ClusterLimitHits
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: CMExplosionEffect
  - type: CMVocalizeTrigger
  - type: RMCScorchEffect

- type: entity
  parent: BaseItem
  id: CMUPipeBombFuse
  name: 管状炸弹
  description: 不完整。似乎需要线缆作为引信
  suffix: Fuse
  components:
  - type: Sprite
    sprite: CMU14/Items/pipebomb.rsi
    state: base
  - type: CraftIntoPipeBomb
    Spawn: CMUPipeBomb
    NeedWires: true
    DestroyReq: true
    Time: 2

- type: entity
  parent: BaseItem
  id: CMUPipeBombCasing
  name: 管状炸弹
  description: 空弹壳。似乎需要一个打火机。
  suffix: Casing
  components:
  - type: Sprite
    sprite: CMU14/Items/pipebomb.rsi
    state: base
  - type: CraftIntoPipeBomb
    Spawn: CMUPipeBombFuse
    NeedLighter: true
    DestroyReq: true
    Time: 2
