# Grenades ported from cmss13-pve: #517 (grenades expansion & overhaul) and #719 (explosives overhaul pt3).

# Launcher-only 30mm rounds. They have no pin, so they can't be primed by hand; the launcher sets them off.
- type: entity
  abstract: true
  parent: BaseItem
  id: CMULauncherGrenadeBase
  components:
  - type: Item
    size: Small
  - type: Clothing
    slots:
    - suitStorage
  - type: Appearance
  - type: TimerTriggerVisuals
  - type: Destructible
    thresholds: []
  - type: IgnorePredictionHide
  - type: Ammo
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCGrenadeM40 # 30mm M40 hull, so underbarrel launchers take it too

- type: entity
  parent: CMULauncherGrenadeBase
  id: CMUGrenadeHEAP
  name: M38高爆弹
  description: 高爆穿甲。一种小巧但威力惊人的爆炸榴弹，能够穿透相当厚度的装甲，使其成为可靠的反载具弹药，不过对步兵的杀伤力略低于标准M40。它不是手榴弹，弹体上的黄色色带即为此标识，仅可由发射器发射。由于底火存在缺陷，不建议直接射向墙壁等坚硬表面，建议落在其前方。
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Throwable/Grenades/heap.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: TriggerOnFixedDistanceStop
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: CMUHEAP # FLOW-09: own tank blast multiplier; otherwise RMC.
    maxIntensity: 30
    intensitySlope: 14
    totalIntensity: 220
    canCreateVacuum: false
  # Armour-piercing charge: much harder on vehicles than its blast suggests.
  - type: VehicleDamageMultiplier
    multiplier: 6
  - type: CMExplosionEffect
  - type: RMCScorchEffect

- type: entity
  parent: [ CMGrenadeBase, RMCM40DPTags ]
  id: CMUGrenadeBFAB
  name: M51A BFAB手榴弹
  description: 弹跳破片空爆弹。这种手榴弹不会在落点直接爆炸，而是弹跳到空中，炸开成致命的破片弹雨。对开阔地带或散兵坑中的部队十分有效。既可从榴弹发射器发射，在落点弹跳，也可在手中拉开引信后投掷，落地后弹跳。
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Throwable/Grenades/bfab.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: CMUBoundingGrenade
  - type: Tag
    tags:
    - Grenade
    - HandGrenade
    - LauncherCompatibleGrenade
    - RMCGrenadeM40
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: RMC
    maxIntensity: 6
    intensitySlope: 3
    totalIntensity: 40
    canCreateVacuum: false
  - type: ProjectileGrenade
    triggerKey: trigger
    fillPrototype: CMProjectileShrapnel
    capacity: 48
    directHit: false
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: ClusterLimitHits
  - type: CMExplosionEffect
    maxShrapnel: 0
  - type: RMCScorchEffect

- type: entity
  parent: CMULauncherGrenadeBase
  id: CMUGrenadeCanister
  name: M108气罐手榴弹
  description: 30mm气罐弹，实际上是低速霰弹。从榴弹发射器发射时具有可观的近战冲击力。不，你不能用锤子把它引爆，白痴。这不是手榴弹，弹体上的黄色色带就是标记，只能由发射器发射。
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Throwable/Grenades/canister.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: CMUPelletGrenadeCanister

- type: entity
  parent: CMPelletShotgunBuckshot
  id: CMUPelletGrenadeCanister
  categories: [ HideSpawnMenu ]
  components:
  # A little stronger than a buckshot shell (4 x 65): five heavier pellets that reach a tile further.
  - type: Projectile
    damage:
      types:
        Piercing: 70
  - type: CMArmorPiercing
    amount: 10
  - type: ProjectileSpread
    proto: CMUPelletGrenadeCanister
    count: 5
    spread: 15
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 5
      falloff: 9999
      ignoreModifiers: true
    - range: 0
      falloff: 1
  - type: CMUIgnoreFixedPoint

# Smoke grenade cloud. Lasts longer than the generic RMC smoke used by mortars and airburst rounds.
- type: entity
  parent: RMCSmoke
  id: CMUSmokeGrenade
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 35
  - type: EvenSmoke
    spawn: CMUSmokeGrenade
    range: 3

# Signal smoke
- type: entity
  parent: CMGrenadeSmoke
  id: CMUGrenadeSmokeGreen
  name: M47-G HSDP烟雾弹
  description: M47 HSDP是一种小巧但威力强大的烟雾弹。基于与M40 HEDP相同的平台。可从榴弹发射器发射以撞击引爆，或手持拉环投掷，在2.5秒后引爆。G子类型在引爆时会喷出一团绿色烟雾。
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Throwable/Grenades/smoke_green.rsi
  - type: SpawnOnTrigger
    proto: CMUSmokeGreen

- type: entity
  parent: CMGrenadeSmoke
  id: CMUGrenadeSmokeRed
  name: M47-R HSDP烟雾弹
  description: M47 HSDP是一种小巧但威力强大的烟雾弹。基于与M40 HEDP相同的平台。可从榴弹发射器发射以撞击引爆，或手持拔销投掷，在2.5秒后引爆。R子型号在引爆时会喷出一团红色烟雾。
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Throwable/Grenades/smoke_red.rsi
  - type: SpawnOnTrigger
    proto: CMUSmokeRed

- type: entity
  parent: RMCSmoke
  id: CMUSmokeGreen
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    color: "#288e76ea"
  - type: EvenSmoke
    spawn: CMUSmokeGreen
    range: 2
  - type: TimedDespawn
    lifetime: 35

- type: entity
  parent: RMCSmoke
  id: CMUSmokeRed
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    color: "#ca3d33e8"
  - type: EvenSmoke
    spawn: CMUSmokeRed
    range: 2
  - type: TimedDespawn
    lifetime: 35

