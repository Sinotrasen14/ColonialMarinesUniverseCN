# Deployable grenade boxes, ported from cmss13-pve#854.
# Set one down to open it and take grenades out; each box only takes its own grenade type.
# A box with enough grenades in it cooks off if it sits in a fire.

- type: entity
  abstract: true
  parent: BaseStorageItem
  id: CMUBoxGrenadeBase
  name: 手雷箱
  description: 一个装有手榴弹的安全箱。
  components:
  - type: Item
    size: Huge
  - type: Appearance
  - type: DeployableItem
  - type: FixedItemSizeStorage
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: CMUGrenadeBox
  - type: Tag
    tags:
    - RMCAmmoBox

- type: entity
  parent: CMUBoxGrenadeBase
  id: CMUBoxGrenadeHEDP
  name: M40高爆双用途手榴弹箱
  description: 一个安全箱，内含25枚M40高爆双用途手榴弹。极易爆炸，请远离火焰喷射器燃料。
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Throwable/Grenades/boxes.rsi
    layers:
    - state: base_uscm_nade
    - state: fill_hedp-4
      map: [ "enum.StorageFillLayers.Fill" ]
    - state: base_uscm_nade_lid
      map: [ "lid" ]
    - state: model_m40
      map: [ "model" ]
    - state: stripe_hedp
      map: [ "stripe" ]
    - state: on_fire
      map: [ "fire" ]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.DeployableItemVisuals.Deployed:
        lid:
          True: { visible: false }
          False: { visible: true }
        model:
          True: { visible: false }
          False: { visible: true }
        stripe:
          True: { visible: false }
          False: { visible: true }
      enum.CMUGrenadeBoxVisuals.CookingOff:
        fire:
          True: { visible: true }
          False: { visible: false }
  - type: StorageFillVisualizer
    fillBaseName: fill_hedp
    maxFillLevels: 5
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,9,9
  - type: StorageFill
    contents:
    - id: CMGrenadeHighExplosive
      amount: 25
  - type: CMUGrenadeBox
    grenade: CMGrenadeHighExplosive

