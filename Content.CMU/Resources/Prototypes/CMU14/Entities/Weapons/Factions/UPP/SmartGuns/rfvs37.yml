- type: entity
  parent: RMCSmartGunNoCamo
  id: AU14SmartGunUPP
  name: RVS-37自动机枪
  description: UPP内部主要国家生产的M56智能枪复制品，RVS-37“峡谷”。
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/UPP/rvs-37.rsi
    layers:
    - state: base
      sprite: CMU14/Weapons/Guns/UPP/rvs-37.rsi
    - state: mag-0
      sprite: CMU14/Weapons/Guns/UPP/rvs-37.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: CMU14/Weapons/Guns/UPP/rvs-37.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: AU14MagazineSmartGunUPP
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_sg_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_sg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - AU14MagazineSmartGunUPP
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: AU14PowerCellSmartgunUPP
        whitelist:
          components:
          - SmartGunBattery

- type: entity
  parent: RMCMagazineSmartGun
  id: AU14MagazineSmartGunUPP
  name: "RVS-37弹鼓（12.7x40mm）"
  components:
  - type: Tag
    tags:
    - AU14MagazineSmartGunUPP
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - AU14CartridgeSmartGun127x40mm
    proto: AU14CartridgeSmartGun127x40mm
    capacity: 250
    cycleable: false
  - type: Sprite
    sprite: CMU14/Weapons/Guns/Ammo/Magazines/rvs34_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: CMCartridgeSmartGun10x30mm
  id: AU14CartridgeSmartGun127x40mm
  name: 弹壳（12.7x40mm）
  components:
  - type: CartridgeAmmo
    proto: AU14BulletSmartGun127x40mm
  - type: Tag
    tags:
    - AU14CartridgeSmartGun127x40mm

- type: entity
  parent: CMBulletSmartGun10x30mm
  id: AU14BulletSmartGun127x40mm
  name: 子弹（12.7x40mm）
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 45

- type: entity
  parent: RMCPowerCell
  id: AU14PowerCellSmartgunUPP
  name: GB-12-U3电池
  description: "UPP标准配发的12伏铅酸电池，UPPAC用它为除装甲车辆以外的几乎任何东西供电。这个似乎是用来为自动机枪供电的变体。也可以当作钝器使用。"
  components:
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: smartguncell
  - type: Battery
    maxCharge: 10000
    startingCharge: 10000
  - type: SmartGunBattery
  - type: PhysicalComposition
    materialComposition: {}

- type: Tag
  id: AU14MagazineSmartGunUPP

- type: Tag
  id: AU14CartridgeSmartGun127x40mm
