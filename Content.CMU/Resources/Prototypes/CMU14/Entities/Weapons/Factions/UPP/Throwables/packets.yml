- type: entity
  parent: CMPacketBase
  id: AU14PacketGrenadeHighExplosiveUPP
  name: 6型破片手榴弹包
  suffix: UPP
  description: 它包含六枚6型破片手榴弹。小心轻放。
  components:
  - type: Sprite
    layers:
    - state: hedp_packet
      map: [ "closedLayer" ]
    - state: hedp_packet_e
      map: [ "openLayer", "emptyLayer" ]

- type: entity
  parent: AU14PacketGrenadeHighExplosiveUPP
  id: AU14PacketGrenadeHighExplosiveUPPFilled
  suffix: Filled, UPP
  components:
  - type: StorageFill
    contents:
    - id: AU14GrenadeHighExplosiveUPP
      amount: 6

- type: entity
  parent: RMCBoxBase
  id: AU14BoxHEDPUPP
  suffix: UPP
  name: 6型破片手榴弹箱
  description: 一个装有12枚6型破片手榴弹的安全箱。从箱中取出前，请确保保险销已插好。
  components:
  - type: Sprite
    layers:
    - state: d_nade_placeholder
      map: [ "closedLayer" ]
    - state: model_m40
    - state: hedp
    - state: d_nade_placeholder_e
      map: [ "openLayer", "emptyLayer" ]
  - type: Storage
    whitelist:
      tags:
      - RMCGrenadeHEDP
  - type: StorageFill
    contents:
    - id: AU14GrenadeHighExplosiveUPP
      amount: 12

