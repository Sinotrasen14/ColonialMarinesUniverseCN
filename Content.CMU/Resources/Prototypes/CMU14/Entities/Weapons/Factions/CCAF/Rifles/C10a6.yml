- type: entity
  parent: CMBaseWeaponRifle
  name: "C10A6-BR“幻日”"
  id: AUWeaponRifleC10A6BR
  description: 一把由阿玛特战场系统公司为CCAF设计的反射式点射步枪。扣动扳机后可快速射出三发点射，全部在操作员感受到后坐力之前完成。该武器目前仍在CCAF部分精选步兵单位中进行有限实战测试。
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/CCAF/C10A6BR.rsi
    state: base
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: CMU14/Weapons/Guns/CCAF/C10A6BR.rsi
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    selectedMode: Burst
    availableModes:
    - Burst
    soundGunshot:
      collection: CMM54CShoot
  - type: RMCSelectiveFire
    baseFireModes:
    - Burst
    recoilUnwielded: 4
    scatterWielded: 6
    scatterUnwielded: 20
    baseFireRate: 109
    burstScatterMult: 1
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.3
    accuracyMultiplierUnwielded: 0.65
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - AU14MagazineRifleC10A6BR

- type: entity
  parent: CMMagazineRifleBase
  id: AU14MagazineRifleC10A6BR
  name: "C10A6BR 弹匣（.25 ACP）"
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - AU14MagazineRifleC10A6BR
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - AU14CartridgeRifleC10A6BR
    proto: AU14CartridgeRifleC10A6BR
    capacity: 15
  - type: Sprite
    sprite: CMU14/Weapons/Guns/Ammo/Magazines/CCAF/m75amasmagazine.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance

- type: entity
  parent: CMBaseCartridgeRifle
  id: AU14CartridgeRifleC10A6BR
  name: 弹药（.25 ACP）
  description: 一支.25 ACP手枪弹
  components:
  - type: Tag
    tags:
    - Cartridge
    - AU14CartridgeRifleC10A6BR
  - type: CartridgeAmmo
    proto: BulletRifleAR10

- type: entity
  parent: RMCBaseBullet
  id: AU14BulletRifleC10A6BR
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 28
  - type: DamageImpactProfile
    projectile:
      contact: Generic
      penetration: Medium
      energy: Medium
  - type: CMArmorPiercing
    amount: 2
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 24
      falloff: 9999
      ignoreModifiers: true
    - range: 7
      falloff: 5
  - type: RMCProjectileAccuracy
    accuracy: 190
    thresholds:
    - range: 7
      falloff: 5

- type: Tag
  id: AU14MagazineRifleC10A6BR

- type: Tag
  id: AU14CartridgeRifleC10A6BR
