- type: entity
  parent: [ CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  name: MCS-X脉冲步枪
  id: AU14WeaponRifleprodigyrifleAR
  description: 模块化战斗系统Mark X脉冲步枪，简称MCS-X脉冲步枪，是Prodigy Corporation所雇用的Prodigy安保部队使用的标准武器。该武器采用无托设计，适用于狭窄的城市环境。MCS-X配备数字弹药计数器，可容纳九十五发子弹。
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/Prodigy/mcsmxpr32x64.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Item
    sprite: CMU14/Weapons/Guns/Prodigy/mcsmxpr32x32.rsi
    size: Large
  - type: Clothing
    sprite: CMU14/Weapons/Guns/Prodigy/mcsmxpr32x32.rsi
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    selectedMode: FullAuto
    shotsPerBurst: 2
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    soundGunshot:
      collection: AU14M41FireSound
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilUnwielded: 4.1
    scatterWielded: 5
    scatterUnwielded: 20
    baseFireRate: 3.8
    burstScatterMult: 1
    modifiers:
      FullAuto:
        maxScatterModifier: 13
      Burst:
        fireDelay: 0.0666
        maxScatterModifier: 10
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.3
    accuracyMultiplierUnwielded: 0.8
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - AU14WeaponRifleprodigyrifleMagazineStandard
          - AU14WeaponRifleprodigyrifleMagazineAP
        startingItem: AU14WeaponRifleprodigyrifleMagazineStandard
  - type: GunDamageModifier
    multiplier: 1.25
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentSuppressor
          - RMCM5Bayonet
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentVerticalGrip
          - RMCAttachmentFlashlightGrip
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS42xTelescopicMiniscope
          - RMCAttachmentS84xTelescopicScope
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.56, 0.063
      rmc-aslot-rail: -0.32, 0.22
      rmc-aslot-underbarrel: 0.10875, -0.30

- type: entity
  parent: CMMagazineRifleBase
  id: AU14WeaponRifleprodigyrifleMagazineStandard
  name: "MCS-X脉冲步枪弹匣（10x24毫米）"
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - AU14WeaponRifleprodigyrifleMagazineStandard
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - CMCartridgeRifle10x24mm
    proto: CMCartridgeRifle10x24mm
    capacity: 95
  - type: Sprite
    sprite: CMU14/Weapons/Guns/Ammo/Magazines/prodigyriflemag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance
  - type: RefillableByBulletBox
    bulletType: RMCBoxBulletsRifle

- type: entity
  parent: AU14WeaponRifleprodigyrifleMagazineStandard
  id: AU14WeaponRifleprodigyrifleMagazineAP
  name: "MCS-X脉冲步枪AP弹匣（10x24mm）"
  suffix: AP
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - AU14WeaponRifleprodigyrifleMagazineAP
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CMCartridgeRifle10x24mmAP
    proto: CMCartridgeRifle10x24mmAP
  - type: Sprite
    sprite: CMU14/Weapons/Guns/Ammo/Magazines/prodigyriflemag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: ammo_band
      color: "#1F951F"
  - type: RefillableByBulletBox
    bulletType: RMCBoxBulletsRifleAP

- type: Tag
  id: AU14WeaponRifleprodigyrifleAR

- type: Tag
  id: AU14WeaponRifleprodigyrifleMagazineStandard

