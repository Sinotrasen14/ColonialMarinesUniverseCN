- type: entity
  parent: [RMCBaseSlideMagazineVisuals, CMWeaponPistolBase]
  id: AU14WeaponPistolM50HAZOPS
  name: M50“白头鹰”手炮
  description: 由Armat公司为庆祝即将到来的美国建国400周年而生产，这款手枪发射喷气推进的.50 AE弹，具有高伤害并能穿透护甲。因其机动性与高伤害的结合而深受HAZOPS喜爱。每打完一弹匣后必须拉栓。
  suffix: Filled
  components:
  - type: RMCSelectiveFire
    scatterWielded: 10
    scatterUnwielded: 14
    baseFireRate: .95
  - type: GunDamageModifier
    multiplier: 1.4
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 2
    accuracyMultiplierUnwielded: 0.85
  - type: Gun
    soundGunshot:
      path: /Audio/CMU14/Weapons/m50/desert_eagle_fire.ogg
  - type: PumpAction
    sound:
      path: /Audio/_RMC14/Weapons/Guns/Cock/gun_pistol_cocked.ogg
    examine: rmc-gun-rack-examine
    popup: rmc-gun-rack-first
    popupKey: rmc-gun-rack-first-with
    once: true
  - type: Sprite
    sprite: CMU14/Weapons/Guns/HAZOPS/M50BaldEagle.rsi
  - type: Clothing
    sprite:  CMU14/Weapons/Guns/HAZOPS/M50BaldEagle.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: AU14MagazinePistolM50
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mk80_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_88m4_unload.ogg
        priority: 2
        whitelist:
          tags:
          - AU14MagazinePistolM50
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.71, 0.095
      rmc-aslot-rail: -0.065, 0.125
      rmc-aslot-underbarrel: 0.312, -0.25
  - type: Tag
    tags:
    - Sidearm
    - AU14WeaponPistolM50HAZOPS

- type: Tag
  id: AU14WeaponPistolM50HAZOPS

- type: entity
  parent: CMBaseMagazinePistol
  id: AU14MagazinePistolM50
  name: M50秃鹰手炮弹匣（.50 JP）
  description: 一把手枪弹匣。
  components:
  - type: Tag
    tags:
    - CMMagazinePistol
    - AU14MagazinePistolM50
  - type: Item
    size: Normal
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - AU14CartridgePistol50JP
    proto: AU14CartridgePistol50JP
    capacity: 13
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/mk45.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: RefillableByBulletBox
    bulletType: CMUBoxBulletsPistol50

- type: Tag
  id: AU14MagazinePistolM50

- type: entity
  parent: CMCartridgePistolBase
  id: AU14CartridgePistol50JP
  name: .50 JP
  components:
  - type: Tag
    tags:
    - Cartridge
    - AU14CartridgePistol50JP
  - type: CartridgeAmmo
    proto: CMBulletPistol50JP

- type: Tag
  id: AU14CartridgePistol50JP

- type: entity
  parent: CMBulletBase
  id: CMBulletPistol50JP
  name: 喷气推进.50 AE弹
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 50
  - type: DamageImpactProfile
    projectile:
      contact: Generic
      penetration: High
      energy: High
  - type: RMCProjectileAccuracy
    accuracy: 100
  - type: CMArmorPiercing
    amount: 65
