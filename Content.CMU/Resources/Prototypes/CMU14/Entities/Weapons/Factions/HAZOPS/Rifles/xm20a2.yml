- type: entity
  parent: [ CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  name: XM20A2脉冲步枪
  id: AUWeaponRifleXM20A2HAZOPS
  description: 作为M20A哈林顿步枪的可能后继型号而研发，XM20A2从未在美国殖民海军陆战队中全面服役，并被M41所取代。这种经过大幅改装的变体被配发给HAZOPS，以增强他们的中远距离作战能力。大容量弹鼓，高射速，但弹鼓只能装填标准10×24毫米弹药，且导轨仅支持紧凑型瞄准镜。
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/HAZOPS/XM20A246x32.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: CMU14/Weapons/Guns/HAZOPS/XM20A2.rsi
    size: Large
  - type: Clothing
    sprite: CMU14/Weapons/Guns/HAZOPS/XM20A2.rsi
  - type: Gun
    shotsPerBurst: 3
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    soundGunshot:
      collection: AU14M41FireSound
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilUnwielded: 4
    scatterWielded: 8
    scatterUnwielded: 20
    baseFireRate: 5
    burstScatterMult: 1
    modifiers:
      Burst:
        fireDelay: 0.1665
        maxScatterModifier: 10
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 6
  - type: MagazineAmmoProvider
    autoEject: false
    soundAutoEject: null
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: AU14MagazineRifleXM20A2
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - AU14MagazineRifleXM20A2
  - type: GunDamageModifier
    multiplier: 0.90
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 0.95
    accuracyMultiplierUnwielded: 0.65
  - type: AttachableHolder
    slots:
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentS42xTelescopicMiniscope
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: -0.21, 0.13

- type: entity
  parent: CMMagazineRifleBase
  id: AU14MagazineRifleXM20A2
  name: XM20A2 弹匣（10x24mm）
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - AU14MagazineRifleXM20A2
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - AU14CartridgeRifleM20A
      - CMCartridgeRifle10x24mm
    proto: AU14CartridgeRifleM20A
    capacity: 120
  - type: Sprite
    sprite: CMU14/Weapons/Guns/Ammo/Magazines/xm20a2.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance
  - type: RefillableByBulletBox
    bulletType: RMCBoxBulletsRifle

- type: Tag
  id: AU14MagazineRifleXM20A2
