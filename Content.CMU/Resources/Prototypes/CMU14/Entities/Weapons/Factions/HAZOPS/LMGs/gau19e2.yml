- type: entity # note to self; add camo inhands to fix sprite bug
  parent: RMCSmartGun
  id: AU14SmartGunMinigunHAZOPS
  name: GAU-19/H手持式迷你炮
  description: 一把野兽般的武器。这种迷你炮原本安装在飞机挂架上，如今已被改为手持式，不过敌我识别系统无法安全地集成到枪中。其射速和弹药容量无与伦比，但口径不得不降级，以使这把枪真正可用，导致其穿甲能力和停止作用不足。
  components:
  - type: RMCSelectiveFire
    baseFireRate: 11
  - type: Sprite
    sprite: CMU14/Weapons/Guns/HAZOPS/GAU19E2.rsi
    layers:
    - state: base
      sprite: CMU14/Weapons/Guns/HAZOPS/GAU19E2.rsi
    - state: mag-0
      sprite: CMU14/Weapons/Guns/HAZOPS/GAU19E2.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: CMU14/Weapons/Guns/HAZOPS/GAU19E2.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: AU14MagazineMinigunHAZOPS
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_sg_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_sg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - AU14MagazineMinigunHAZOPS
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: RMCPowerCellSmartgun
        whitelist:
          components:
          - SmartGunBattery
  - type: GunIFF
    enabled: false
    preventFriendlyFire: false
  - type: IFFToggle
    showToggleAction: false


- type: entity
  parent: CMMagazineRifleBase
  id: AU14MagazineMinigunHAZOPS
  name: GAU-19/H弹鼓（9mm）
  components:
  - type: Tag
    tags:
    - AU14MagazineMinigunHAZOPS
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - AU14CartridgeMinigunHAZOPS9mm
    proto: AU14CartridgeMinigunHAZOPS9mm
    capacity: 1500
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/SmartGuns/magazine_smart_gun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    slots:
    - suitStorage
  - type: Item
    size: Normal

- type: entity
  parent: CMCartridgePistol9mm
  id: AU14CartridgeMinigunHAZOPS9mm
  name: 9毫米弹药
  components:
  - type: CartridgeAmmo
    proto: AU14BulletMinigunHAZOPS9mm
  - type: Tag
    tags:
    - AU14CartridgeMinigunHAZOPS9mm

- type: entity
  parent: CMBulletPistol9mm
  id: AU14BulletMinigunHAZOPS9mm
  name: 子弹（9mm）
  components:
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 12
      falloff: 9999
      ignoreModifiers: true
    - range: 10
      falloff: 4

- type: Tag
  id: AU14MagazineMinigunHAZOPS

- type: Tag
  id: AU14CartridgeMinigunHAZOPS9mm
