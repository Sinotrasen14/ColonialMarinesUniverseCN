- type: entity
  abstract: true
  parent: CMPacketBase
  id: AU14PacketBaseRMC
  suffix: RM
  name: 数据包
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Throwable/RMC/packets.rsi
    state: general_packet

- type: entity
  parent: AU14PacketBaseRMC
  id: AU14PacketGrenadeHighExplosiveRMC
  name: R2175/A 高爆双用途榴弹包
  suffix: RM
  description: 它包含三枚R2175/A高爆双用途手榴弹。请小心处理。
  components:
  - type: Sprite
    layers:
    - state: hedp_packet
      map: [ "closedLayer" ]
    - state: hedp_packet_e
      map: [ "openLayer", "emptyLayer" ]

- type: entity
  parent: AU14PacketGrenadeHighExplosiveRMC
  id: AU14PacketGrenadeHighExplosiveRMCFilled
  suffix: Filled, RM
  components:
  - type: StorageFill
    contents:
    - id: AU14GrenadeHighExplosiveRMC
      amount: 3

- type: entity
  parent: RMCBoxBase
  id: AU14BoxHEDPRMC
  suffix: RM
  name: R2175/A HEDP手榴弹箱
  description: 一个安全箱，内装18枚30mm R2175/A高爆双用途榴弹。高爆物，请勿存放在火焰喷射器燃料附近。
  components:
  - type: Sprite
    layers:
    - state: d_nade_placeholder
      map: [ "closedLayer" ]
    - state: model_r2175
    - state: rmchedp
    - state: d_nade_placeholder_e
      map: [ "openLayer", "emptyLayer" ]
  - type: Storage
    whitelist:
      tags:
      - RMCGrenadeHEDP
  - type: StorageFill
    contents:
    - id: AU14GrenadeHighExplosiveRMC
      amount: 18

