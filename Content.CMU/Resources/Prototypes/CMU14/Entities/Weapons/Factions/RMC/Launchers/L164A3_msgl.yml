- type: entity
  name: L164A3多发型榴弹发射器
  parent: [ RMCBaseWeaponGrenadeLauncher ]
  id: AU14WeaponLauncherL164A3
  description: 皇家海军陆战队装备的一种轻型支援武器。使用20毫米小型榴弹，威力不如大口径榴弹发射器，但射速弥补了这一不足。
  components:
  - type: Item
    size: Huge
  - type: Sprite
    sprite: CMU14/Weapons/Guns/RMC/L164A3.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: CMU14/Weapons/Guns/RMC/L164A3.rsi
    slots:
    - Back
    - suitStorage
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: true
    zeroOnlyOnEmpty: true
  - type: RMCSelectiveFire
    baseFireRate: 0.5
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - AU14LauncherCompatibleGrenadeRMC
    capacity: 8
    proto: AU1420MMGrenadeL103A1
  - type: Corrodible
    isCorrodible: false
  - type: GunUserWhitelist
    whitelist:
      components:
      - GrenadeSpecWhitelist
  - type: ExplosionResistance
    damageCoefficient: 0
  - type: AttachableHolder
    slots:
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentMagneticHarness
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: 0.0, 0.185
  - type: Tag
    tags:
    - AU14WeaponLauncherL164A3
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
      - CMUPathogenWalker

- type: Tag
  id: AU14WeaponLauncherL164A3