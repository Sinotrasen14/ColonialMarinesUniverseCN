- type: entity
  parent: [ CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  id: AU14L64A3SniperRifle
  name: L64A3指定射手步枪
  description: "一种由Howatomo精密机械公司为皇家海军陆战队研制的轻型指定射手步枪。旨在为突击队员提供超出旧式L90所能企及的快速远程打击能力。连续装药HESH弹头免除了对传统穿甲钢芯弹药的需求，并提升了远距离上的伤害保持能力。更快的枪机循环速率和轻量化扳机使得即使在千米距离上也能实现快速精准的后续射击。"
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/RMC/L64A3.rsi
    layers:
    - state: bolt-open
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
    - sprite: CMU14/Weapons/Guns/Attachments/royal_stock.rsi
      state: rmc_dmr_stock
      offset: -0.56, 0.025
    - sprite: _RMC14/Objects/Weapons/Guns/Attachments/rail.rsi
      state: sniperscope_a
      offset: -0.1, 0.1
  - type: Item
    size: Large
  - type: Clothing
    sprite: CMU14/Weapons/Guns/RMC/L64A3.rsi
  - type: Tag
    tags:
    - AU14L64A3SniperRifle
  - type: GunUserWhitelist
    whitelist:
      components:
      - SniperWhitelist
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    shotsPerBurst: 1
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_type88.ogg
  - type: RMCSelectiveFire
    recoilWielded: 1
    scatterWielded: 0
    baseFireRate: 0.955
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 3
  - type: WieldableSpeedModifiers
    base: 0.5
    light: 0.69
    medium: 0.75
    heavy: 0.806
  - type: WieldDelay
    baseDelay: 1.2
  - type: GunDualWielding
    weaponGroup: Rifle
  - type: GunPointBlank
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/sniper_mouse.rsi
      state: all
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: AU14MagazineSniperL64A3
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mar40_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mar40_unload.ogg
        priority: 2
        whitelist:
          tags:
          - AU14MagazineSniperL64A3
  - type: GunRequiresWield
  - type: Corrodible
    isCorrodible: false
  - type: GunIFF
    enabled: false
  - type: RMCNameItemOnVend
    item: PrimaryGun
  - type: AttachableHolder
    slots:
      rmc-aslot-rail:
        locked: true
        startingAttachable: RMCM96SIntegratedScope
        whitelist:
          tags:
          - RMCM96SIntegratedScope
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentBipod
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-underbarrel: 0.21875, -0.343
      rmc-aslot-rail: 0.5, 0.5
  - type: ItemCamouflage
    camouflageVariations: {}
  - type: RMCGunChamber
    enabled: false
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
      - CMUPathogenWalker

