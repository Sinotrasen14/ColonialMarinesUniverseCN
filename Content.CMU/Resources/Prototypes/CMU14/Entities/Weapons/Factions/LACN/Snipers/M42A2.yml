- type: entity
  parent: RMCBaseWeaponSniperRifle
  id: AU14WeaponSniperRifleM42A2
  name: M42A2指定射手步枪
  description: M42A2指定射手步枪目前由LACN登陆部队使用，最初本应是为USCM大规模生产的，直到它因M4RA拥有更优越的弹匣容量、更长的枪管和更强的模块化程度而失去了位置。M42A2仍然是一个相当不错的选择，因为其生产成本更低，外形更紧凑，这使它被LACN登陆部队和海军突击队采用。突击队尤其大量使用它，因为它在深度渗透行动中可靠且易于维护。该步枪使用M42A弹匣。
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/LACN/M42A2-64x32.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-2
      map: ["enum.GunVisualLayers.Mag"]
      shader: unshaded
  - type: Item
    sprite: CMU14/Weapons/Guns/LACN/M42A2-32x32.rsi
    size: Large
  - type: Clothing
    sprite: CMU14/Weapons/Guns/LACN/M42A2-32x32.rsi
  - type: Tag
    tags:
    - CMM96SSniperRifle
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
  - type: Gun
    shotsPerBurst: 1
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_sniper.ogg
  - type: RMCSelectiveFire
    recoilWielded: 1
    scatterWielded: 0
    baseFireRate: 1
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 3
  - type: WieldDelay
    baseDelay: 1.2
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: CMMagazineSniperM96S
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mar40_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mar40_unload.ogg
        priority: 2
        whitelist:
          tags:
          - CMMagazineSniperM96S
  - type: GunRequiresWield
  - type: Corrodible
    isCorrodible: false
  - type: AttachableHolder
    slots:
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentBipod
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS84xTelescopicScope
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-underbarrel: 0.21875, -0.343
      rmc-aslot-rail: -0.37, 0.1
  - type: RMCGunChamber
    enabled: false
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
      - CMUPathogenWalker
