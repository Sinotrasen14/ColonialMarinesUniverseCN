- type: entity
  parent: RMCM2CMount
  id: CMUKramerAutocannonMount
  name: 克雷默自动炮
  description: 拆解后的克莱默30毫米自动加农炮，三脚架已折叠，无法开火。
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramerautocannon/kramericon.rsi
    state: autocannon
    layers:
    - sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramerautocannon/kramer32x32.rsi
      state: autocannon
      map: [ "enum.WeaponMountComponentVisualLayers.Mounted" ]
      visible: false
    - sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramerautocannon/kramer32x32.rsi
      state: autocannon-magazine-1
      map: [ "enum.WeaponMountComponentVisualLayers.MountedAmmo" ]
      visible: false
    - state: autocannon
      map: [ "enum.WeaponMountComponentVisualLayers.Folded" ]
      visible: false
    - state: autocannon-broken
      map: [ "enum.WeaponMountComponentVisualLayers.Broken" ]
      visible: false
    - state: mag-4
      map: [ "enum.WeaponMountComponentVisualLayers.FoldedAmmo" ]
      visible: false
    - sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramerautocannon/kramer32x32.rsi
      state: autocannon-overheat
      map: [ "enum.WeaponMountComponentVisualLayers.Overheated" ]
      visible: false
  - type: Item
    size: Huge
    sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramerautocannon/kramer32x32.rsi
  - type: Clothing
    slots: NONE
  - type: WeaponMount
    fixedWeaponPrototype: "CMUMachineGunKramerAutocannon"
    isWeaponSecured: true
    isWeaponLocked: true
    canRotateWithoutTool: true
    mountOnDeploy: false
    mountExclusionAreaSize: 0
    barricadeExclusionAreaSize: 2
    assembleDelay: 3
    undeploySound: null
    acidableWhileUndeployed: true
  - type: Tag
    tags:
    - CMUKramerAutocannonMount

- type: entity
  parent: RMCMachineGunM2C
  id: CMUMachineGunKramerAutocannon
  categories: [ HideSpawnMenu ]
  name: 克雷默自动炮
  description: Kramer 30毫米自动加农炮的上半部分。没有三脚架就没多大用处。
  components:
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Sprite
    sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramerautocannon/kramericon.rsi
    layers:
    - state: autocannon
    - state: mag-4
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Item
    sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramerautocannon/kramer32x32.rsi
  - type: Clothing
    slots: NONE
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/CMU14/Weapons/vehicle/autocannon.ogg
      params:
        variation: 0.06
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilUnwielded: 0
    scatterUnwielded: 0
    baseFireRate: 1.2
    modifiers: {}
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        priority: 2
        whitelist:
          tags:
          - CMUMagazineKramer30mmHE
          - CMUMagazineKramer30mmHEAP
  - type: Tag
    tags:
    - CMUMachineGunKramerAutocannon

- type: entity
  parent: RMCMagazineM2C
  id: CMUMagazineKramer30mmHE
  name: 克雷默自动机炮弹链（30毫米高爆弹）
  description: 一整套15发克拉默自动加农炮用的30毫米高爆弹。每发子弹在命中时都会炸成弹片。
  components:
  - type: Tag
    tags:
    - CMUMagazineKramer30mmHE
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CMUCartridgeKramer30mmHE
    proto: CMUCartridgeKramer30mmHE
    capacity: 15
    deleteWhenEmpty: false
  - type: Sprite
    sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramerautocannon/AMMO/30mmHE.rsi
    layers:
    - state: mag-4
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: Clothing
    slots: NONE

- type: entity
  parent: CMUMagazineKramer30mmHE
  id: CMUMagazineKramer30mmHEAP
  name: 克雷默自动机炮弹药链接（30毫米高爆穿甲弹）
  description: 一盒15发克拉默自动炮用30毫米高爆穿甲弹。专为穿透装甲而设计，而非散射破片。
  components:
  - type: Tag
    tags:
    - CMUMagazineKramer30mmHEAP
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CMUCartridgeKramer30mmHEAP
    proto: CMUCartridgeKramer30mmHEAP
    capacity: 15
    deleteWhenEmpty: false
  - type: Sprite
    sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramerautocannon/AMMO/30mmHEAP.rsi
    layers:
    - state: mag-4
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: VehicleCartridgeAceAutocannon
  id: CMUCartridgeKramer30mmHE
  name: 30毫米高爆弹
  components:
  - type: Tag
    tags:
    - Cartridge
    - CMUCartridgeKramer30mmHE
  - type: CartridgeAmmo
    proto: RMCProjectileAceAutocannonFlak
    muzzleFlash: MuzzleFlashEffectVehicleOver

- type: entity
  parent: VehicleCartridgeAceAutocannon
  id: CMUCartridgeKramer30mmHEAP
  name: 30毫米高爆穿甲弹
  components:
  - type: Tag
    tags:
    - Cartridge
    - CMUCartridgeKramer30mmHEAP
  - type: CartridgeAmmo
    proto: CMUProjectileKramer30mmHEAP
    muzzleFlash: MuzzleFlashEffectVehicleOver

- type: entity
  parent: RMCBaseBullet
  id: CMUProjectileKramer30mmHEAP
  name: 30毫米高爆穿甲弹
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/bullet_projectiles.rsi
    drawdepth: Effects
    layers:
    - state: bullet
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffect
    maxFixedRange: 32
    damage:
      types:
        Piercing: 75
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: DamageImpactProfile
    projectile:
      contact: Fragment
      penetration: Forced
      energy: Severe
  - type: RMCProjectileAccuracy
    accuracy: 130
    thresholds:
    - range: 32
      falloff: 5
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 32
      falloff: 9999
      ignoreModifiers: true
  - type: RMCAreaDamage
    damageArea: 1.5
    falloffDistance: 1
  - type: CMArmorPiercing
    amount: 60
  - type: IgnorePredictionHide

- type: entity
  parent: RMCGunCaseBase
  id: CMUKramerAutocannonCase
  name: 克莱默自动机炮箱
  description: 一个装有Kramer 30毫米自动加农炮的枪箱。附带两个高爆弹弹药箱和两个高爆穿甲弹弹药箱。
  components:
  - type: Storage
    maxItemSize: Ginormous
    grid:
    - 0,0,13,1
    whitelist:
      tags:
      - CMUKramerAutocannonMount
      - CMUMagazineKramer30mmHE
      - CMUMagazineKramer30mmHEAP
      - RMCSkillPamphlet
  - type: StorageFill
    contents:
    - id: RMCPamphletHeavyMachineGunner
    - id: CMUKramerAutocannonMount
    - id: CMUMagazineKramer30mmHE
      amount: 3
    - id: CMUMagazineKramer30mmHEAP
      amount: 2

