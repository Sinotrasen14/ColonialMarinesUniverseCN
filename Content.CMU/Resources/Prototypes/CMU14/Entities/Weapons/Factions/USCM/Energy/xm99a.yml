- type: entity
  id: AU14WeaponXM99A
  parent: [BaseWeaponBatterySmall, BaseGrandTheftContraband]
  name: XM99A相位等离子脉冲步枪
  suffix: USCM
  description: 由Armat设计的实验性定向能武器系统，XM99A是一种远程原型步枪，可发射超高温等离子冲击。XM99A会利用静电随时间缓慢为其锂电池鼓充电。
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/USCM/XM99A.rsi
    layers:
    - state: bolt-open
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: CMU14/Weapons/Guns/USCM/XM99A.rsi
    slots:
    - suitStorage
    - Back
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/CMU14/Weapons/xm99/gun_xm99_fire.ogg
  - type: BatteryAmmoProvider
    proto: AU14PlasmaShot
    fireCost: 1000
  - type: BatterySelfRecharger
    autoRechargeRate: 150
  - type: Appearance
  - type: Item
    size: Large
  - type: GunRequiresWield
  - type: WieldDelay
    baseDelay: 0.7
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilWielded: 6
    recoilUnwielded: 8
    scatterWielded: 1
    scatterUnwielded: 90
    baseFireRate: 5
    modifiers:
      FullAuto:
        fireDelay: 0
        maxScatterModifier: 13
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 4
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 4
  - type: Wieldable
  - type: AttachableHolder
    randomAttachmentChance: 0.42
    slots:
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS84xTelescopicScope
          - RMCAttachmentS42xTelescopicMiniscope
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: -0.14, 0.13
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/sniper_mouse.rsi
      state: all
  - type: Tag
    tags:
    - AU14WeaponXM99A
  - type: GunGroupPenalty
  - type: GunPointBlank
  - type: GunDualWielding
    weaponGroup: Rifle
  - type: GunUnskilledPenalty
  - type: GunIFF
    enabled: false
  - type: GunIDLock


- type: entity
  parent: BasicHitscan
  id: AU14PlasmaShot
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 162
        Blunt: 5
        Asphyxiation: 20
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_blue
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam_blue
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_blue

- type: entity
  parent: RMCBasePVEEquipmentCase
  id: AU14CaseXM99A
  name: XM99A 相位等离子脉冲步枪箱
  description: 一个用于存放相位等离子脉冲步枪的大型箱体，这是一种由Armat设计的实验性定向能武器系统
  components:
  - type: Sprite
    sprite: CMU14/Items/Cases/XM99ACase.rsi
  - type: Storage
    maxItemSize: Ginormous
    grid:
    - 0,0,1,1
    whitelist:
      tags:
      - AU14WeaponXM99A
  - type: StorageFill
    contents:
    - id: AU14WeaponXM99A
  - type: ItemMapper
    mapLayers:
      gun:
        whitelist:
          tags:
          - AU14WeaponXM99A

- type: Tag
  id: AU14WeaponXM99A
