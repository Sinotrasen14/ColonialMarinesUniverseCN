  components:
  - type: Gun
    shotsPerBurst: 3
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_m4spr.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilUnwielded: 2
    scatterWielded: 6
    baseFireRate: 2.86
    burstFireRateMultiplier: 2
    modifiers:
      Burst:
        fireDelay: 0.1
        maxScatterModifier: 2
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 1
  - type: ItemCamouflage
    camouflageVariations: { }
  - type: Tag
    tags:
    - AU14WeaponRifleXM4RA1

- type: entity
