- type: entity
  id: AU14WeaponPistolRXFM5
  parent: [BaseWeaponBatterySmall]
  name: RXF-M5 舱外活动设备储存镭射手枪
  suffix: WE-YU
  description: 一把高功率聚焦镭射手枪，内置核电池，专为舱外活动设备储存设计。不过实际上它在几乎任何地方都能用。采用与镭射焊接器相同的技术。由Weyland-Yutani公司配发，但也在民用市场上出售。
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/Civilian/rxfm5.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Clothing
    sprite: CMU14/Weapons/Guns/Civilian/rxfm5.rsi
    slots:
    - suitStorage
    - belt
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/CMU14/Weapons/rxfm5/gun_RXFM5_fire.ogg
  - type: BatteryAmmoProvider
    proto: AU14RXFM5LaserShot
    fireCost: 200
  - type: BatterySelfRecharger
    autoRechargeRate: 65
  - type: Appearance
  - type: Item
    size: Normal
  - type: WieldDelay
    baseDelay: 0.2
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilWielded: 2
    recoilUnwielded: 4
    scatterWielded: 1
    scatterUnwielded: 5
    baseFireRate: 2.3
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 4
  - type: Wieldable
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/sniper_mouse.rsi
      state: all
  - type: Tag
    tags:
    - AU14WeaponPistolRXFM5
    - Sidearm
  - type: GunIFF
    enabled: false

- type: entity
  parent: BasicHitscan
  id: AU14RXFM5LaserShot
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 25
        Blunt: 3
        Asphyxiation: 5
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_laser
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_laser
    
- type: Tag
  id: AU14WeaponPistolRXFM5
