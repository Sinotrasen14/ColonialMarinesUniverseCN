- type: entity
  parent: RMCWeaponRevolverBase
  id: AU14WeaponRevolverM2019
  name: "M2019“爆能”自动左轮手枪"
  description: "一把最初于21世纪初配发给执法部门的左轮手枪，最著名的使用者是如今已不复存在的银翼杀手，在21世纪初复制人危机最严重的时期。该枪口径为.357，早已过时，但在收藏家和“老古董”中仍然很受欢迎。几十年来出现了大量仿制品，有些忠实还原，有些则廉价得危险。虽然罕见，但在UA和TWE的边缘星球上，看到有人把它插在腰侧枪套里也并非闻所未闻。"
  components:
