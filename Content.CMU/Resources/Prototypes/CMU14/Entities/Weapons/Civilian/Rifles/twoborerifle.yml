- type: entity
  parent: [ RMCBaseBreechloader, RMCBaseAttachableHolder ]
  name: 双管二口径步枪
  id: AU14WeaponRifleTwoBore
  description: 一把定制的双管两号口径步枪。专为猎杀最大——或最危险——的猎物而造。她净重四十五磅，在三个星区均属非法，且扳机一触即发。好好待她，她就会护你周全——以及你枪口所指的一切。
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/Civilian/twobore_rifle.rsi
  - type: Gun
    shotsPerBurst: 2
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
  - type: ShootUseDelay
  - type: BreechLoaded
    openSound:
      path: /Audio/_RMC14/Weapons/Guns/Breech/pkd_open_chamber.ogg
    closeSound:
      path: /Audio/_RMC14/Weapons/Guns/Breech/pkd_close_chamber.ogg
    toggleDelay: 3
  - type: Clothing
    sprite: CMU14/Weapons/Guns/Civilian/twobore_rifle.rsi
  - type: BallisticAmmoProvider
    cycleable: true
    whitelist:
      tags:
      - AU14CartridgeRifleTwoBore
    proto: AU14CartridgeRifleTwoBore
    capacity: 2
  - type: GunRequiresWield
  - type: UseDelay
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilWielded: 5
    recoilUnwielded: 5
    scatterWielded: 5
    scatterUnwielded: 14
    baseFireRate: 0.1
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.5
    accuracyMultiplierUnwielded: 0.5
  - type: AttachableHolder
    slots:
      rmc-aslot-stock:
        startingAttachable: AU14AttachmentTwoBoreStock
        whitelist:
          tags:
          - AU14AttachmentTwoBoreStock
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-stock: -.78, 0
  - type: Item
    size: Ginormous
  - type: Tag
    tags:
    - AU14WeaponRifleTwoBore

- type: entity
  parent: CMBaseCartridgeRifle
  id: AU14CartridgeRifleTwoBore
  name: 步枪弹药（两膛径）
  description: 一发双管步枪弹药。这发子弹让.50口径看起来都像玩具枪。祈祷你永远不会被这东西击中。
  components:
  - type: Sprite
    sprite: CMU14/Items/cartridgetwobore.rsi
  - type: Tag
    tags:
    - Cartridge
    - AU14CartridgeRifleTwoBore
  - type: CartridgeAmmo
    proto: AU14BulletRifleTwoBore

- type: entity
  parent: BulletRifle10x24mm
  id: AU14BulletRifleTwoBore
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 250
  - type: CMArmorPiercing
    amount: 50
  - type: RMCStunOnHit
    stuns:
    - whitelist:
        components:
        - Marine
        - Xeno
      maxRange: 32
      stunTime: 3
      slowTime: 15
      knockBackPowerMin: 1
      knockBackPowerMax: 5
      knockBackSpeed: 5
      forceKnockBack: true
      slowsEffectBigXenos: true
      dazeTime: 5

- type: Tag
  id: AU14WeaponRifleTwoBore

- type: Tag
  id: AU14BulletRifleTwoBore

- type: Tag
  id: AU14CartridgeRifleTwoBore
