- type: entity
  parent: RMCWeaponFlamerColony
  id: CMUWeaponArsonistFlamer
  name: LC9-P焚烧装置
  description: 一把被拆掉强度限制器、又加装了加压福隆供给装置的LC9。它碰到什么，什么就会持续燃烧，而烧伤不会停留在你放火的地方。
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        startingItem: CMUTankFlamerPhoron

- type: entity
  parent: RMCTankFlamerColony
  id: CMUTankFlamerPhoron
  name: LC9-P 磷化氢气瓶
  description: 一桶加压的稳定phoron燃料，用于LC9-P。它助燃的火焰会持续蔓延，且不受灭火器影响。
  components:
  - type: Sprite
    color: "#b558d6"
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 200
        reagents:
        - ReagentId: CMUPhoronFuel
          Quantity: 200
  - type: RMCFlamerTank
    reagentWhitelist:
    - CMUPhoronFuel

- type: reagent
  parent: [ CMReagent, BasePyrotechnic ]
  id: CMUPhoronFuel
  name: reagent-name-cmu-phoron-fuel
  desc: reagent-desc-cmu-phoron-fuel
  physicalDesc: reagent-physical-desc-shiny
  flavor: bitter
  color: "#b558d6"
  intensity: 30
  duration: 20
  radius: 5
  fireEntity: CMUTileFirePhoronArsonist
  fireSpread: true

- type: entity
  parent: RMCTileFire
  id: CMUTileFirePhoronArsonist
  suffix: Phoron
  components:
  - type: Sprite
    layers:
    - map: [ "base" ]
      state: purple_4
  - type: PointLight
    color: "#b558d6"
  - type: RMCIgniteOnCollide
    intensity: 30
    duration: 20
    burnColor: "#b558d6"
  - type: TileFire
    id: CMUTileFirePhoronArsonist
    extinguishInstantly: false
    sprayExtinguishMultiplier: 1
    duration: 180
  - type: GenericVisualizer
    visuals:
      enum.TileFireLayers.Base:
        base:
          One: { state: purple_1 }
          Two: { state: purple_2 }
          Three: { state: purple_3 }
          Four: { state: purple_4 }
