# MP5 magazines
# These are intentionally not added to any vendor, loadout, map, kit, crate, or random-spawn pool.

- type: entity
  parent: CMMagazineSMGMP5
  id: CMUMagazineSMGMP5Drum
  name: MP5弹鼓（9毫米）
  description: 一把适用于MP5型冲锋枪的60发弹鼓。
  suffix: Drum
  components:
  - type: Tag
    tags:
    - CMMagazineSmg
    - CMMagazineSMGMP5
    - CMUMagazineSMGMP5Drum
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CMCartridge9mmSMG
    proto: CMCartridge9mmSMG
    capacity: 60
  - type: Sprite
    sprite: CMU14/Objects/Weapons/Guns/Ammunition/Magazines/mp5drum.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]

