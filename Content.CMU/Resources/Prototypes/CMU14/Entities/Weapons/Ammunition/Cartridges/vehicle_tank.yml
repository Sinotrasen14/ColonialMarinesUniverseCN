- type: entity
  parent: CMBaseCartridgeRifle
  id: CMUCartridgeLTBCannonAPFSDS
  name: 弹壳（轻型坦克炮，尾翼稳定脱壳穿甲弹）
  components:
  - type: Sprite
    sprite: CMU14/Structures/vehicles/ammo/vehicles.rsi
    layers:
    - state: lbtshell_apfsds
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Item
    size: Huge
  - type: SpentAmmoVisuals
    state: lbtshell_apfsds
    suffix: false
  - type: CartridgeAmmo
    deleteOnSpawn: false
    proto: CMUProjectileLTBCannonAPFSDS
    muzzleFlash: MuzzleFlashEffectVehicleOverLarge
    muzzleFlashOffset: 2.2, 0

