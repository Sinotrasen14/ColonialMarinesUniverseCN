- type: entity
  parent: CMWebbingBase
  id: AU14WebbingMagazine
  name: 弹匣织带
  description: 合成棉织带，带三个口袋，可放置弹匣。
  components:
    - type: Sprite
      sprite: CMU14/Clothing/UniversalWebbing/magazinewebbing.rsi
      state: webbing
    - type: Storage
      maxItemSize: Normal
      grid:
        - 0,0,5,1 # 3 slots
    - type: FixedItemSizeStorage
    - type: IgnoreContentsSize
      items:
        tags:
          - MRE
          - PillPacket
          - PillCanister
          - CMSurgicalCase
    - type: Webbing
      playerSprite:
        sprite: CMU14/Clothing/UniversalWebbing/magazinewebbing.rsi
        state: equipped
      components:
        - type: Storage
          maxItemSize: Small
          grid:
            - 0,0,5,1 # 3 slots
        - type: IgnoreContentsSize
          items:
            tags:
              - CMMagazineSmg
              - CMMagazinePistol
              - CMMagazineRifle
              - CMMagazineSniper
              - MRE
              - PillPacket
              - PillCanister
              - CMSurgicalCase
        - type: FixedItemSizeStorage
        - type: RMCStorageEjectHand
          state: Open
        - type: ExplosionResistance
          damageCoefficient: 0
          worn: false
        - type: StoreAfterFailedInteract

- type: entity
  parent: CMWebbingBase
  id: AU14WebbingDumpPouch
  name: 帆布杂物袋
  description: 一个用来装空弹匣的袋子。可容纳三个满弹匣，或者每个满弹匣的空间可装三个空弹匣。
  components:
    - type: Sprite
      sprite: CMU14/Clothing/UniversalWebbing/dumpouch.rsi
      state: webbing
    - type: Storage
      maxItemSize: Normal
      grid:
        - 0,0,8,0 # 3 slots, or 9 empty magazines
    - type: FixedItemSizeStorage
      size: 3,1
    - type: CMUEmptyMagazineStorage
    - type: IgnoreContentsSize
      items:
        tags:
          - MRE
          - PillPacket
          - PillCanister
          - CMSurgicalCase
    - type: Webbing
      playerSprite:
        sprite: CMU14/Clothing/UniversalWebbing/dumpouch.rsi
        state: equipped
      components:
        - type: Storage
          maxItemSize: Small
          grid:
            - 0,0,8,0 # 3 slots, or 9 empty magazines
        - type: IgnoreContentsSize
          items:
            tags:
              - CMMagazineSmg
              - CMMagazinePistol
              - CMMagazineRifle
              - CMMagazineSniper
              - MRE
              - PillPacket
              - PillCanister
              - CMSurgicalCase
        - type: FixedItemSizeStorage
          size: 3,1
        - type: CMUEmptyMagazineStorage
        - type: RMCStorageEjectHand
          state: Open
        - type: ExplosionResistance
          damageCoefficient: 0
          worn: false
        - type: StoreAfterFailedInteract

