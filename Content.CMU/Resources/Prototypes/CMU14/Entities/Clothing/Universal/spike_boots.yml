- type: entity
  parent: ClothingShoesMilitaryBase
  id: AU14SpikeBoots
  name: M-19“踏钉者”突击靴
  description: >-
    重型突击靴，鞋底压焊有硬化碳化钨钉板。最初为争议地形作战和近距离破门交战而设计原型。钉阵额定可在零距离穿透标准软质护甲，并以极端致命性处理脚下的有机障碍物。在满作战负载下，正常移动速度降低约20%。在友方倒地人员附近请小心处理。
  suffix: AU14
  components:
  - type: Sprite
    sprite: CMU14/Clothing/Shoes/spikedboots.rsi
    layers:
    - state: icon
    - state: filled
      map: ["enum.CMItemSlotsLayers.Fill"]
  - type: Clothing
    sprite: CMU14/Clothing/Shoes/spikedboots.rsi
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: SpikeBoots

# Keeps the spike boots' own slot, which also takes sidearms.
- type: entity
  parent: AU14SpikeBoots
  id: CMUSpikeBootsFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      item:
      - RMCM5Bayonet
