- type: entity
  parent: [AU14HeadCommandoBeanie, BaseFoldable]
  id: AU14HeadBeanieclava
  suffix: IdentityBlocker
  description: 一顶用来遮住光头的毛线帽。看起来和海军突击队用的毛线帽出奇地相似。你可以把它折下来隐藏身份。
  components:
  - type: Clothing
    sprite: CMU14/Clothing/Civilian/Hats/beanieclava.rsi
  - type: Appearance
  - type: Foldable
    foldVerbText: cmu-beanieclava-fold
    unfoldVerbText: cmu-beanieclava-unfold
    canFoldInsideContainer: true
  - type: IdentityBlocker
    enabled: false
  - type: FoldableIdentityBlocker
  - type: FoldableClothing
    foldedEquippedPrefix: folded
    foldedHideLayers:
    - Hair
    - HeadTop
    - HeadSide
    - Snout
    unfoldedHideLayers:
    - Hair
    - HeadTop
    - HeadSide
  - type: HideLayerClothing
    layers:
      Hair: HEAD
      HeadTop: HEAD
      HeadSide: HEAD
  - type: Sprite
    sprite: CMU14/Clothing/Civilian/Hats/beanieclava.rsi
    layers:
    - state: icon
      map: ["unfoldedLayer"]
    - state: icon
      map: ["foldedLayer"]
      visible: false
