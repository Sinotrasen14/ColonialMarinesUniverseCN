- type: entity
  parent: [RMCPouchOpenClosed, RMCPouchStorage]
  id: AU14PouchGasMaskBag
  name: 防毒面具包
  description: 一个小包，用于携带防毒面具和几个备用滤毒罐。可以放在口袋里、作为织带挂在制服上，或者塞进背包里。
  components:
  - type: Sprite
    sprite: CMU14/Items/gas_mask_bag.rsi
  - type: Item
    size: Small
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,7,1 #4 slots
    whitelist:
      tags:
      - GasMask
      - CMUGasMaskFilter
  - type: FixedItemSizeStorage
  - type: LimitedStorage
    limits:
    - popup: rmc-storage-limit-one-gasmask
      whitelist:
        tags:
        - GasMask
    - popup: rmc-storage-limit-max-gasmask-filters
      count: 3
      whitelist:
        tags:
        - CMUGasMaskFilter
  - type: Webbing
    playerSprite:
      sprite: CMU14/Items/gas_mask_bag.rsi
      state: equipped
    components:
    - type: Storage
      maxItemSize: Small
      grid:
      - 0,0,7,1 #4 slots
      whitelist:
        tags:
        - GasMask
        - CMUGasMaskFilter
    - type: FixedItemSizeStorage
    - type: LimitedStorage
      limits:
      - popup: rmc-storage-limit-one-gasmask
        whitelist:
          tags:
          - GasMask
      - popup: rmc-storage-limit-max-gasmask-filters
        count: 3
        whitelist:
          tags:
          - CMUGasMaskFilter
    - type: RMCStorageEjectHand
      state: Open
    - type: ExplosionResistance
      damageCoefficient: 0
      worn: false
    - type: StoreAfterFailedInteract

- type: entity
  parent: AU14PouchGasMaskBag
  id: AU14PouchGasMaskBagFill
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: CMMaskGas
    - id: CMUGasMaskFilter
    - id: CMUGasMaskFilter
    - id: CMUGasMaskFilter
