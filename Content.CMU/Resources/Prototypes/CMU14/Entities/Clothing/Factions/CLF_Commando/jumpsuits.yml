- type: entity
  parent: [RMCMarineUniformBase, RMCAlternateFoldableUniformBase]
  id: CMU14FatiguesCLFCommando
  suffix: CLF
  name: 殖民地解放阵线战斗服
  description: 一套时尚的棕绿混搭狩猎与运动服装——边境殖民者的标准配发装备。此版本似乎在特定区域印有殖民解放阵线的标志。
