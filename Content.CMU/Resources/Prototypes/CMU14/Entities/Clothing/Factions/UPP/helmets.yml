- type: entity
  parent: RMCMarineHelmetBase
  id: AU14UPPNavalInfantryHelmet
  name: UPP海军陆战队头盔
  description: UPP海军陆战队头盔。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/UPP/helmets/upphelmet.rsi
  - type: Clothing
    sprite: CMU14/Clothing/UPP/helmets/upphelmet.rsi

- type: entity
  parent: RMCMarineHelmetBase
  id: AU14ArmorHelmetArmyUPP
  name: 6B82战斗头盔
  suffix: AU14
  description: UPP陆军6B92战斗头盔的旧版本，仍被UPP认为不太重要的星球上的某些部队佩戴。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Head/SPP/army_helmet.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Head/SPP/army_helmet.rsi
  - type: ItemCamouflage
    camouflageVariations: { }

- type: entity
  parent: RMCMarineHelmetBase
  id: AU14Altyn
  name: 阿尔金-R2M
  description: 一种旧地球时代的设计，最初为特种部队和内部安保在近距离战斗中使用而创造。一个多世纪后，UPP部队仍在使用。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/UPP/helmets/altyn.rsi
  - type: Clothing
    sprite: CMU14/Clothing/UPP/helmets/altyn.rsi
  - type: ItemToggle
    activated: true
  - type: ToggleClothing
    action: AU14ActionToggleAltynVisor
  - type: ParasiteResistance
    maxCount: 3
  - type: RMCItemToggleClothingVisuals
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon-on}
          False: {state: icon}
  - type: Appearance
  - type: HelmetAccessory
    rsi:
      sprite: CMU14/Clothing/UPP/helmets/altyn.rsi
      state: equipped-HELMET
    toggledRsi:
      sprite: CMU14/Clothing/UPP/helmets/altyn.rsi
      state: helmet-down
  - type: CMArmor
    melee: 25
    bullet: 40
    bio: 10
    explosionArmor: 15

- type: entity
  parent: ActionMarineBase
  id: AU14ActionToggleAltynVisor
  name: 切换面罩
  description: 改变头盔面罩的位置。
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ToggleActionEvent
