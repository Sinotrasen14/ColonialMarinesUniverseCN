# coats

- type: entity
  parent: RMCCoatSPP
  id: AU14CoatUPP
  name: UL4军官夹克
  description: 一件轻便夹克，配发给UPP军队的军官。对来袭伤害有轻微防护作用，但最好还是搭配正规护甲。

- type: entity
  parent: RMCCoatSPPSenior
  id: AU14CoatUPPSenior
  name: UL4高级官员夹克
  description: 一件轻便夹克，配发给UPP军队的高级军官。采用高品质材料制成，甚至在肩部和夹克正面烫印有Kapitan及其连队的军衔和徽章。对来袭伤害有轻微防护作用，但最好还是搭配正规护甲。

- type: entity
  parent: RMCCoatSPPMP
  id: AU14CoatUPPMP
  name: UL4迷彩夹克
  description: 一件轻便夹克，配发给预计不会参与战斗的部队。不过仍密布着凯夫拉碎片，只是合成长丝结构降低了其防护效果。
