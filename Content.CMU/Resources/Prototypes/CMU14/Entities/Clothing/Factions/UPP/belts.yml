- type: entity
  parent: CMBeltMarine
  id: AU14BeltMarineUPP
  name: 41型制式弹药装具
  suffix: AU14
  description: 41型负载装备是UPP军队的标准配发负重装备。这条腰带的主要功能是在行动中方便取用71型的弹匣。尽管是为71型武器系统设计的，但这些弹药袋采用模块化设计，足以容纳其他类型的弹药和装备。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/UPP/belt/ammo.rsi
  - type: Clothing
    sprite: CMU14/Clothing/UPP/belt/ammo.rsi
  - type: ItemCamouflage
    camouflageVariations: {}

- type: entity
  parent: CMBeltMarine
  id: AU14BeltMarineArmyUPP
  suffix: AU14
  name: 6B80式弹药携行具
  description: 6B80是一种过时但可靠的弹药携行具，曾是UPP陆军的标准装备。其模块化腰带可携带多种弹药，因其坚固的设计，至今仍被UPP安保部队和预备役使用。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Belt/spp_brown.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Belt/spp_brown.rsi
  - type: ItemCamouflage
    camouflageVariations: {}

- type: entity
  parent: AU14BeltUtilityGeneralBlack
  id: AU14BeltUtilityGeneralUPP
  name: 48-M型通用工具袋
  description: 一个小巧轻便的腰包，可夹在U型UPP护甲上以提供额外储物空间。较新的48-M型号虽然不太舒适，也可以夹在腰间。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/UPP/belt/general.rsi
  - type: Clothing
    slots:
    - suitStorage
    - belt
    sprite: CMU14/Clothing/UPP/belt/general.rsi
  - type: ItemCamouflage
    camouflageVariations: {}

- type: entity
  parent: CMBeltMedical
  id: AU14BeltMedicalUPP
  name: 41型医疗储存挂具
  description: 41型是UPP军队的标准承重装备。它由一条带有各种扣具的模块化腰带组成。此版本是一种较少见的配置，专为运送医疗用品而设计。\n右键点击其贴图并点击“切换腰带模式”，即可通过直接点击药瓶来取出药片。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/UPP/belt/medical.rsi
  - type: Clothing
    sprite: CMU14/Clothing/UPP/belt/medical.rsi

- type: entity
  parent: RMCM276ShotgunShellLoadingRig
  id: AU14ShotgunShellLoadingRigUPP
  name: 42型霰弹枪弹壳装填架
  suffix: AU14
  description: 一条用于装填霰弹枪弹药的弹药带，主要适配23式霰弹枪。 # or individual bullets. TODO RMC14
  components:
  - type: Sprite
    sprite: CMU14/Clothing/RMC/belt/shotgun.rsi
    layers:
    - state: icon
    - state: sixth
      visible: false
    - state: third
      visible: false
    - state: half
      visible: false
    - state: twothirds
      visible: false
    - state: fivesixths
      visible: false
    - state: full
      visible: false
  - type: Clothing
    sprite: CMU14/Clothing/RMC/belt/shotgun.rsi
  - type: ItemCamouflage
    camouflageVariations: {}

- type: entity
  parent: CMBeltMedicBag
  id: AU14BeltMedicBagUPP
  name: 41型救生包
  suffix: AU14
  description: 41式负载装备是UPP军队的标准承载装备。此配置搭载了一个装有多种注射器和轻型医疗用品的行李袋，在医疗兵中很常见。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/RMC/belt/medicbag.rsi
  - type: Clothing
    sprite: CMU14/Clothing/RMC/belt/medicbag.rsi
  - type: ItemCamouflage
    camouflageVariations: {}

- type: entity
  parent: CMBeltMarine
  id: AU14BeltSmartGunOperatorUPP
  name: 90式机枪手弹链
  suffix: AU14
  description: 最近被UPP军队采用，这条弹链让机枪手能携带更多弹药箱投入战斗。它也被使用Type 23霰弹枪的SOF破门手所采用。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/UPP/belt/machinegun.rsi
  - type: Clothing
    sprite: CMU14/Clothing/UPP/belt/machinegun.rsi
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,13,1 # 7 slots
    whitelist:
      tags:
      - AU14MagazineSmartGunUPP
      - CMMagazinePistol
      - CMMagazineRifle
      - RMCMagazineShotgun
      - CMMagazineSmg
      - CMMagazineSniper
      - RMCMagazineLMGQYJ72
      - RMCShellShotgun
      - Flare
  - type: FixedItemSizeStorage
  - type: IgnoreContentsSize
    items:
      tags:
      - RMCMagazineLMGQYJ72
  - type: ItemCamouflage
    camouflageVariations: {}

- type: entity
  parent: CMBeltMarine
  id: AU14BeltSmartGunOperatorPistolUPP
  suffix: AU14
  name: 92式机枪手副武器挂具
  description: 92式是配发给UPP机枪手的实验性携弹装具，将侧臂枪套与用于有限储弹的箱形弹袋结合在一起。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/UPP/belt/machinegun_pistol.rsi
    layers:
    - state: icon
    - sprite: _RMC14/Objects/Weapons/Guns/gun_underlays.rsi
      state: m1984 # TODO RMC14 per-gun underlay
      offset: 0.15625, 0.0
      map: [ "enum.CMHolsterLayers.Fill" ]
      visible: false
    - sprite: CMU14/Clothing/UPP/belt/machinegun_pistol.rsi
      state: icon-front
    - state: half
      map: [ "openLayer" ]
    - state: full
      map: [ "closedLayer" ]
  - type: Clothing
    sprite: CMU14/Clothing/UPP/belt/machinegun_pistol.rsi
  - type: Storage   # Holds up to 4 drums/magazines and 1 sidearm
    maxItemSize: Normal
    grid:
    - 0,0,9,1 # 5 slots
    whitelist:
      tags:
      - AU14MagazineSmartGunUPP
      - Sidearm
      - CMMagazinePistol
      - RMCMagazineRevolver
      - RMCMagazineLMGQYJ72
      - Flare
  - type: FixedItemSizeStorage
  - type: IgnoreContentsSize
    items:
      tags:
      - RMCMagazineLMGQYJ72
  - type: LimitedStorage
    limits:
    - popup: rmc-storage-limit-one-gun
      whitelist:
        tags:
        - Sidearm
    - popup: rmc-storage-limit-max-ammo
      count: 4
      whitelist:
        tags:
        - CMMagazinePistol
        - RMCMagazineRevolver
        - RMCMagazineLMGQYJ72
  - type: CMHolster
    whitelist:
      tags:
      - Sidearm
  - type: Tag
    tags:
    - RMCSmartGunSidearmHolster
  - type: ItemCamouflage
    camouflageVariations: { }

