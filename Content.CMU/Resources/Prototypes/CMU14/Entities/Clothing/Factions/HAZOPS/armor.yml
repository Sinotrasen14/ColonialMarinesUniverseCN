- type: entity
  parent: AU14BaseArmor
  id: AU14ArmorHAZOPSPWA
  name: 动力作战装甲
  description: 一种专为危险行动设计的背心。据说内置电池可提供“额外功能”，但没人知道怎么充电。尽管装甲板提供了更高的生物抗性和略高的打击防护，但其防弹能力不如标准配发的USCM装甲。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/HAZOPS/poweredwarfightingarmor.rsi
  - type: CMArmor
    bio: 35
    bullet: 10
    explosionArmor: 10
    melee: 18
  - type: ClothingSpeedModifier
    walkModifier: .75
    sprintModifier: .75
  - type: Clothing
    sprite: CMU14/Clothing/HAZOPS/poweredwarfightingarmor.rsi
  # Only the wearer hears it power up.
  - type: CMUSelfEquipSound
    sound:
      path: /Audio/CMU14/Armor/pwa_equip.ogg

