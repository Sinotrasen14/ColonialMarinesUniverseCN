- type: entity
  parent: AU14WebbingMagazine
  id: CMULACNWebbingMagazine
  name: LACN 弹匣织带
  description: LACN 图案合成棉织带，带三个口袋用于放置弹匣。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/LACN/LACNRedux/Universal/Webbing/LACNmagazinewebbing.rsi
    state: webbing
  - type: Webbing
    playerSprite:
      sprite: CMU14/Clothing/LACN/LACNRedux/Universal/Webbing/LACNmagazinewebbing.rsi
      state: equipped

- type: entity
  parent: AU14WebbingUtility
  id: CMULACNWebbingUtility
  name: LACN 实用织带
  description: LACN 图案合成棉织带，带口袋，用于通用装备。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/LACN/LACNRedux/Universal/Webbing/LACNutilitywebbing.rsi
    state: webbing
  - type: Webbing
    playerSprite:
      sprite: CMU14/Clothing/LACN/LACNRedux/Universal/Webbing/LACNutilitywebbing.rsi
      state: equipped

- type: entity
  parent: RMCWebbingDropPouch
  id: CMULACNWebbingDropPouch
  name: LACN 降落包织带
  description: 一个LACN图案的杂物袋，用来随身携带零散物品。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/LACN/LACNRedux/Universal/Webbing/LACNdroppouchwebbing.rsi
    state: webbing

- type: entity
  parent: RMCWebbingGrenade
  id: CMULACNWebbingGrenade
  name: LACN 手榴弹织带
  description: LACN 式织带，用于存放几枚手榴弹。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/LACN/LACNRedux/Universal/Webbing/LACNgrenadewebbing.rsi
    state: webbing
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,15,1 # 8 grenades of size 2x2.
    whitelist:
      tags:
      - Grenade
  - type: Webbing
    components:
    - type: Storage
      maxItemSize: Normal
      grid:
      - 0,0,15,1 # 8 grenades of size 2x2.
      whitelist:
        tags:
        - Grenade
    - type: RMCStorageEjectHand
      state: Open
    - type: ExplosionResistance
      damageCoefficient: 0
      worn: false
    - type: StoreAfterFailedInteract

- type: entity
  parent: CMWebbingBase
  id: CMULACNWebbingShotgun
  name: LACN霰弹枪弹壳织带
  description: LACN 式织带，内衬有用于霰弹枪弹壳的环扣。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/LACN/LACNRedux/Universal/Webbing/LACNshotgunwebbing.rsi
    state: webbing
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,9,1
    whitelist:
      tags:
      - RMCShellShotgun
  - type: FixedItemSizeStorage
  - type: Webbing
    playerSprite:
      sprite: CMU14/Clothing/LACN/LACNRedux/Universal/Webbing/LACNshotgunwebbing.rsi
      state: equipped
    components:
    - type: Storage
      maxItemSize: Small
      grid:
      - 0,0,9,1
      whitelist:
        tags:
        - RMCShellShotgun
    - type: FixedItemSizeStorage
    - type: RMCStorageEjectHand
      state: Open
    - type: ExplosionResistance
      damageCoefficient: 0
      worn: false
    - type: StoreAfterFailedInteract
