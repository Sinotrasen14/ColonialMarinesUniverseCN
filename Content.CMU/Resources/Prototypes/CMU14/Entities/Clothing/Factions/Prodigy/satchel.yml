- type: entity
  parent: [RMCSatchelPMC, RMCSatchelWelder]
  id: RMCSatchelWelderRU
  name: 天才响应单位技术员焊接包
  description: 符合人体工学、带防护的高容量背包，专为Prodigy武装维修队设计。配备小型燃料箱，可快速为喷灯补充燃料。
  components:
  - type: Storage
    grid:
    - 0,0,20,1 # 21
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Back/Backpacks/PMC/welder.rsi

- type: entity
  parent: RMCSatchelWelderRU
  id: RMCSatchelWelderRUCloak
  name: 精英响应单位技术员焊工隐身包
  description: 符合人体工学、防护性强、容量高的背包，专为神童武装维修队设计。配有一个小型燃料箱，便于快速为喷灯补充燃料。还配备了一个供合成单位使用的隐形模块。
  components:
  - type: ClothingRequireEquipped
    autoUnequip: true
    whitelist:
      tags:
      - ProdigyUniformSynth
    denyReason: rmc-wear-scout-armor-required
  - type: ThermalCloak
    opacity: 0.03 # Put to 0.03 for testing
    restrictWeapons: true
    cloakedHideLayers:
    - Hair
    - HeadTop
    - HeadSide
    - Tail
    - Snout # I don't know if this is hugely problematic but better safe than sorry
    whitelist:
      components:
      - ScoutWhitelist
    cloakSound:
      path: /Audio/_RMC14/Effects/Cloak/cloak_scout_on.ogg
      params:
        variation: 0.09
    uncloakSound:
      path: /Audio/_RMC14/Effects/Cloak/cloak_scout_off.ogg
      params:
        variation: 0.09
  - type: Corrodible
    isCorrodible: false