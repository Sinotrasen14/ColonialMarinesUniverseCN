- type: entity
  parent: RMCVisorNightVision
  id: AU14VisorNightVisionProdigy
  name: 神童夜视光学仪
  description: 可插入标准Prodigy头盔的护目镜HUD。此型号提供一种夜视功能，是经费充足部队的标准装备。可放入充电器为内部电池充电。
  components:
  - type: Sprite
    state: nvg_sight
  - type: PowerCellDraw
    enabled: false
    drawRate: 10
  - type: Visor
    toggledSprite:
      sprite: _RMC14/Objects/Clothing/Head/Helmets/huds.rsi
      state: nvg_sight_right
    onIcon:
      sprite: _RMC14/Objects/Clothing/helmet_visors.rsi
      state: nvg_sight_down
  - type: NightVisionVisor
  - type: ToggleVisor
    ignoreRedundancy: true
  - type: ComponentToggler
    components:
    - type: PointLight
      enabled: true
      radius: 1.7
      softness: 1
      color: "#008000"