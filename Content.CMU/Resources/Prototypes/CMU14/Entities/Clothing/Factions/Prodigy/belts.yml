- type: entity
  parent: CMBeltUtilityCombat
  id: AU14BeltUtilityCombatProdigyRU
  name: L177 天才型战斗工具腰带挂具
  description: “天才”武装维修队响应单位在战区执行维修任务时配备的皇家海军陆战队突击队标准装备。它包括一条模块化腰带，配有各种夹子和工具袋，以及一个副武器枪套。由于副武器和一个弹匣体积较大。
  components:
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,19,1 # 11 slots
    whitelist:
      tags:
      - Crowbar
      - Screwdriver
      - Wirecutter
      - Wrench
      - CableCoil
      - Multitool
      - Flashlight
      - Sidearm
      - CMMagazinePistol
      - RMCMagazineRevolver
      - PowerCell
      - CMFireExtinguisherPortable
      - RMCShellShotgun
      - RMCNailgunCompact
      - RMCNailgunTactical
      - RMCSynthResetKey
      #      - # TODO analyzer
      components:
      - Welder
      - PowerCell
      - TrayScanner
      - GasAnalyzer
      - LightReplacer
      - EntrenchingTool
  - type: Sprite
    sprite: CMU14/Clothing/RMC/belt/combat_utility.rsi
    layers:
    - state: icon
    - sprite: _RMC14/Objects/Weapons/Guns/gun_underlays.rsi
      state: m1984 # TODO RMC14 per-gun underlay
      offset: -0.3125, -0.09375
      map: [ "enum.CMHolsterLayers.Fill" ]
      visible: false
    - sprite: CMU14/Clothing/RMC/belt/combat_utility.rsi
      state: icon-front
    - state: half
      map: [ "openLayer" ]
    - state: full
      map: [ "closedLayer" ]
  - type: Clothing
    sprite: CMU14/Clothing/RMC/belt/combat_utility.rsi

