- type: entity
  parent: CMArmorM4
  id: AU14ArmorProdigyXAS23
  name: PRU-XAS-23型战斗装甲
  description: 比钢铁更坚韧，比低语更安静，PRU-XAS-23型战斗装甲提供可靠的防护，并配备实验性集成运动追踪器。一个研究与开发团队花了一个周末就开发出来，造价比罗慕路斯空间站还高……大概吧。穿戴时，由于运动传感器占用了卡扣，织带等制服配件无法附着，不过物理装甲上扩展的储物空间弥补了这一点。由于其笨重性，需要Prodigy Response Unit制服上的卡扣才能穿戴。
  components:
  - type: RMCArmorSpeedTier
    speedTier: light
  - type: ClothingSpeedModifier
    walkModifier: .725
    sprintModifier: .725
  - type: Corrodible
    isCorrodible: false
  - type: Sprite
    sprite: CMU14/Clothing/ProdigySecurityForces/ArmedRepairTeam/PARTArmors/partarmor1.rsi
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,9,1 # 5 slots
  - type: ClothingRequireEquipped
    autoUnequip: true
    denyReason: au14-xas23-not-prodigy-ru-jumpsuit
    whitelist:
      tags:
      - ProdigyUniform
      - ProdigyUniformSynth
  - type: MotionDetector
    handToggleable: false
  - type: ToggleableMotionDetector
    slots:
    - OUTERCLOTHING
    batteryDrain: 0
  - type: ItemCamouflage
    camouflageVariations:
      Jungle: CMU14/Clothing/ProdigySecurityForces/ArmedRepairTeam/PARTArmors/partarmor1.rsi
      Desert: CMU14/Clothing/ProdigySecurityForces/ArmedRepairTeam/PARTArmors/partarmor1.rsi
      Snow: CMU14/Clothing/ProdigySecurityForces/ArmedRepairTeam/PARTArmors/partarmor1.rsi
      Classic: CMU14/Clothing/ProdigySecurityForces/ArmedRepairTeam/PARTArmors/partarmor1.rsi
      Urban: CMU14/Clothing/ProdigySecurityForces/ArmedRepairTeam/PARTArmors/partarmor1.rsi
  - type: RMCLoreExaminable
    content: au14-lore-examinable-armor-PRU-XAS-23-PBA-new

- type: entity
  parent: AU14ArmorProdigyXAS23
  id: AU14ArmorProdigyXAS23G
  name: PRU-XAS-23-G型战斗装甲
  description: 比钢铁更坚韧，比低语更安静，PRU-XAS-23-G型战斗装甲为聪明的枪手提供可靠的防护，舍弃了内置运动探测器以适配SG装备。穿戴时，由于枪手装备占用了卡扣，织带等制服配件无法附着，不过实体装甲上扩展的储物空间弥补了这一点。由于其笨重以及比普通型号更强的装甲，需要Prodigy Response Unit制服的卡扣才能穿戴。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/ProdigySecurityForces/ArmedRepairTeam/PARTArmors/partarmor3.rsi
  - type: MotionDetector
    handToggleable: false
  #- type: ClothingSpeedModifier
  #  walkModifier: .5
  #  sprintModifier: .5
  - type: SmartGunArmor
  #- type: CMArmor
  #  melee: 30 # CLOTHING_ARMOR_HIGH (melee)
  #  bullet: 40 # CLOTHING_ARMOR_ULTRAHIGH (bullets)
  - type: ItemCamouflage
    camouflageVariations:
      Jungle: CMU14/Clothing/ProdigySecurityForces/ArmedRepairTeam/PARTArmors/partarmor3.rsi
      Desert: CMU14/Clothing/ProdigySecurityForces/ArmedRepairTeam/PARTArmors/partarmor3.rsi
      Snow: CMU14/Clothing/ProdigySecurityForces/ArmedRepairTeam/PARTArmors/partarmor3.rsi
      Classic: CMU14/Clothing/ProdigySecurityForces/ArmedRepairTeam/PARTArmors/partarmor3.rsi
      Urban: CMU14/Clothing/ProdigySecurityForces/ArmedRepairTeam/PARTArmors/partarmor3.rsi

