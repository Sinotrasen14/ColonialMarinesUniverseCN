- type: entity
  parent: BaseItem
  id: AU14ProdigyLaptop
  name: Prodigy高级系统篡改系统（PASTS）
  description: Prodigy安保公司制造的一款加固型军用笔记本电脑，用于远程控制和编程。可放置在桌上以便于操作。也可作为哨戒笔记本电脑使用！
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/sentrycomp.rsi
    layers:
    - state: sentrycomp_cl
      map: ["enum.SentryLaptopVisualLayers.Base"]
  - type: Item
    size: Small
    sprite: _RMC14/Objects/Devices/sentrycomp.rsi
  - type: Clickable
  - type: InteractionOutline
  - type: CollisionWake
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.15,0.25,0.15"
        density: 50
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SentryLaptopVisuals.State:
        enum.SentryLaptopVisualLayers.Base:
          Closed: { state: sentrycomp_cl }
          Open: { state: sentrycomp_op }
          Active: { state: sentrycomp_on }
  - type: UseDelay
    delay: 0.5
  - type: RequiresSkill
    skills:
      RMCSkillEngineer: 2

- type: entity
  parent: BaseItem
  id: AU14ExtractionTeamBeacon
  name: 精英提取队信标
  description: 一次性链路，用于呼叫神童撤离小队。激活后即失效。你什么意思，它只是个昂贵的镭射笔？（角色之外备注：如果此物品无法生效，请寻求管理员帮助并要求他们生成ProdigyExtractionParty）
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/communication.rsi
    layers:
    - state: walkietalkie
    - state: walkietalkie-on
    state: walkietalkie
  - type: Item
    sprite: _RMC14/Objects/Devices/communication.rsi
    heldPrefix: walkietalkie
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.15,0.25,0.15"
        density: 50
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Appearance
  - type: SpawnThirdPartyTool
    party: ProdigyExtractionParty
    dropship: true
  - type: UseDelay
    delay: 0.5

- type: entity
  parent: AU14ExtractionTeamBeacon
  id: CMU14ProdigyLawyerBeacon
  name: 神童律师信标
  description: 一次性上行链路，用于呼叫神童律师。激活后就没用了。你什么意思，它只是个昂贵的镭射笔？（角色之外备注，如果这不好使，请寻求管理员帮助并要求他们生成ProdigyLawyer）
  components:
  - type: SpawnThirdPartyTool
    party: ProdigyLawyer
    dropship: true
