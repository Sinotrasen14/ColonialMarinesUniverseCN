- type: entity
  parent: RMCPouchMagazineLargePMC
  id: AU14PouchMagazineLargePARTDual
  name: 大型双联弹匣包
  description: 一个大型弹药袋，设计用于容纳四个大弹匣和四把霰弹枪弹壳。该弹药袋专为神童武装维修队设计，其工程师和医疗兵常用它来携带额外弹匣和霰弹枪弹壳。
  suffix: PART
  components:
  - type: Storage
    grid:
    - 0,0,11,1 #8 slots
  - type: LimitedStorage
    limits:
    - popup: au14-storage-limit-max-mags-prodigy
      count: 4
      whitelist:
        tags:
        - CMMagazineRifle
        - AU14MagazineRifleM20A
        - CMMagazinePistol
        - CMMagazinePistolMK80
    - popup: au14-storage-limit-max-shells-prodigy
      count: 4
      whitelist:
        tags:
        - RMCHandful
        - Cartridge
        - CMMagazinePistol
        - RMCShellShotgun

