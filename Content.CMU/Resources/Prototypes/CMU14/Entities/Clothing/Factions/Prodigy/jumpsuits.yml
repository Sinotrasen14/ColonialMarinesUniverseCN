  description: “天才”武装维修队合成人标准配发制服。PART-SF是专为“天才”安保公司武装维修队设计的特种制服，该队伍负责在高风险环境中维护和修理设备。该制服在膝部和肘部配有加固衬垫，并设有多个口袋用于携带工具和补给。它还包含内置挂具系统，可附加额外装备和器材。
