- type: entity
  parent: [RMCMarineUniformBase, RMCAlternateFoldableUniformBase]
  id: AU14ProdigyFatigues
  name: 神童迷彩服
  description: 制式“神童”安保部队制服。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/ProdigySecurityForces/fatigues.rsi

- type: entity
  parent: [RMCMarineUniformBase, RMCAlternateFoldableUniformBase]
  id: AU14ProdigyFatiguesRU
  name: 神童武装维修队专用作战服
  description: Prodigy武装维修队标准配发制服。PART-SF是专为Prodigy安保公司的武装维修队设计的特种制服，该队伍负责在高风险环境中维护和修理设备。制服在膝部和肘部配有加固衬垫，并设有多个口袋用于携带工具和补给。它还包含内置挂具系统，可附加额外装备和器材。
  components:
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
        showEnts: False
        occludes: True
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,7,1   # up to 4 small or 8 tiny items
  - type: Sprite
    sprite: CMU14/Clothing/ProdigySecurityForces/ArmedRepairTeam/partfatigues.rsi
  - type: Tag
    tags:
    - ProdigyUniform

