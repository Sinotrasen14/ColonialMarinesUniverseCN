- type: entity
  parent: RMCMarineUniformBase
  id: AU14CBRNSuit
  suffix: AU14
  name: M3防毒服
  description: M3 MOPP防护服经过专门设计与制造，用于保护穿着者在战场上免受任何未受屏蔽的化学、生物、放射或核（CBRN）威胁的暴露。该防护服在接触有毒环境后建议使用寿命为二十四小时，但根据严重程度，这一时间可缩短至八小时或更短。
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Uniforms/Marine/cbrnsuit.rsi
  - type: CMArmor
    bullet: 10
    melee: 10
    bio: 100
    explosionArmor: 10


