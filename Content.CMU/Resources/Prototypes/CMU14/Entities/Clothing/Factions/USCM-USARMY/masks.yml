- type: entity
  parent: [ClothingMaskBase, BaseFoldable]
  id: AU14MaskUSASFPilotOxygen
  name: USASF LAH-99氧气面罩
  description: 连接在USASF LAH-99头盔上的面罩，为机组人员提供可呼吸的氧气。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/USASFSecurityForces/USASFPilot/mask.rsi
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon
      map: ["foldedLayer"]
      visible: false
  - type: HideLayerClothing
    slots:
    - HeadTop
    - HeadSide
    - Snout
    layers:
      HeadTop: MASK
      HeadSide: MASK
      Snout: MASK
  - type: Clothing
    sprite: CMU14/Clothing/USASFSecurityForces/USASFPilot/mask.rsi
  - type: IdentityBlocker
    coverage: MOUTH
  - type: Item
    storedRotation: -90
  - type: BreathMask
  - type: Appearance
  - type: Foldable
    canFoldInsideContainer: true
  - type: FoldableClothing
    foldedEquippedPrefix: up
    foldedHeldPrefix: up
    foldedHideLayers:
    - HeadTop
    - HeadSide
    unfoldedHideLayers:
    - HeadTop
    - HeadSide
    - Snout
  - type: MycotoxinProtection
    fullProtection: false

- type: entity
  parent: [CMBaseMask, CMUBaseGasMaskFilterSlot]
  id: AU14MOPPMask
  suffix: AU14
  name: CBRN M3 防毒面具
  description: M3 MOPP面具包含一个全罩式头罩，可牢固地连接到MOPP防护服上。该面具可过滤空气中的有害颗粒，使佩戴者能够在战场上安全呼吸。根据污染区域的危险程度，面具滤芯平均可使用12小时或更短。
  components:
  - type: IdentityBlocker
  - type: Sprite
    sprite: CMU14/Clothing/USCMC/Mask/cbrn.rsi
  - type: Clothing
    sprite: CMU14/Clothing/USCMC/Mask/cbrn.rsi
  - type: Item
    storedRotation: -90
  - type: HideLayerClothing
    slots:
    - HeadTop
    - HeadSide
    - Hair
    - Snout
  - type: MycotoxinProtection
    fullProtection: true
