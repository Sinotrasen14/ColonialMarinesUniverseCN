- type: entity
  parent: RMCGogglesBallistic
  id: AU14GogglesM1A1PolarizedBallistic
  name: ventrax 偏光护目镜
  description: 市面上作为民用护目镜出售，品牌相当模糊，但似乎是由Ventrax制造的，而Ventrax又是某个Wey-Yu子公司的子公司。不出所料。它们原本大概是用来滑雪的，你不太记得也不在乎。令人意外的是，它们作为战斗护目镜还挺不错的……至少比M1A1强，或者更别提那些M60了。中尉说彩色镜片会让你被狙击手干掉……但至少你死的时候看起来很酷。
  components:
  - type: Sprite
    sprite: CMU14/Clothing/Goggles/m1a1polarized.rsi
  - type: Clothing
    sprite: CMU14/Clothing/Goggles/m1a1polarized.rsi
  - type: HelmetAccessory
    rsi:
      sprite: CMU14/Clothing/Goggles/m1a1polarized.rsi
      state: helmet
    toggledRsi:
      sprite: CMU14/Clothing/Goggles/m1a1polarized.rsi
      state: helmet-down

