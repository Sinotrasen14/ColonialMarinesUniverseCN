- type: entity
  parent: CMSatchel
  id: AU14BackpackRTOPackBlack
  name: "黑色 AN/PRC-55 便携式收发机"
  description: "AN/PRC-55便携式收发信机，也称为AN/PRC 55无线电套装，是一种由Armat Battlefield Systems制造的背负式便携VHF FM战斗网无线电收发信机，用于提供短距离双向无线电话语音通信。"
  components:
    - type: Sprite
      sprite: CMU14/Clothing/RTOPack/blackrtopack.rsi
      layers:
        - state: icon
          map: ["base"]
    - type: Storage
      maxItemSize: Large
      grid:
        - 0,0,4,1
    - type: CMStorageVisualizer
      storageClosed: null
      storageOpen: null
    - type: RotaryPhone
      category: Marine
    - type: RotaryPhoneBackpack
    - type: UserInterface
      interfaces:
        enum.RMCTelephoneUiKey.Key:
          type: CMUTelephoneBui
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface
    - type: ActivatableUIBlacklist
      blacklist:
        components:
          - Xeno
    - type: GenericVisualizer
      visuals:
        enum.RotaryPhoneLayers.Layer:
          base:
            Base: { state: icon }
            Ring: { state: ring }
            Ear: { state: ear }
    - type: Undisposable

- type: entity
  parent: AU14BackpackRTOPackBlack
  id: AU14BackpackRTOPackJungle
