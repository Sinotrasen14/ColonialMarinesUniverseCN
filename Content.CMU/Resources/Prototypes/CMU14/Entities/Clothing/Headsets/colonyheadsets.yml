# ├──[ ENCRYPTIONKEYS ]──────────────────────────────────────────────┤
- type: entity
  abstract: true
  parent: CMEncryptionKey
  id: AU14EncryptionKey
  components:
  - type: Sprite
    state: we_ya_key

- type: entity
  parent: AU14EncryptionKey
  id: AU14EncryptionKeyAdmin
  name: 殖民地管理员加密密钥
  description: 一种用于在殖民地、CMB和殖民地医疗无线电频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - Colony
    - radioCMB
    - ColonyMedical
    defaultChannel: Colony

- type: entity
  parent: AU14EncryptionKey
  id: AU14EncryptionKeyWEYU
  name: 维兰德殖民地加密密钥
  description: 用于在殖民地和维兰德无线电频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - Colony
    - radioWEYU
    defaultChannel: Colony

- type: entity
  parent: AU14EncryptionKey
  id: AU14EncryptionKeyProdigy
  name: 神童殖民加密密钥
  description: 一种用于在殖民地和神童无线电频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - Colony
    - PART
    defaultChannel: Colony

- type: entity
  parent: AU14EncryptionKey
  id: AU14EncryptionKeyCMB
  name: CMB 加密密钥
  suffix: Colony, CMB
  description: 用于在殖民地和CMB无线电频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - Colony
    - radioCMB
    defaultChannel: Colony

- type: entity
  parent: AU14EncryptionKey
  id: AU14EncryptionKeyCMBOnly
  name: CMB 加密密钥
  description: 用于在CMB无线电频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - radioCMB
    defaultChannel: Colony

- type: entity
  parent: AU14EncryptionKey
  id: AU14EncryptionKeyOrbital
  name: 轨道加密密钥
  description: 用于在殖民地和轨道无线电频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - Colony
#   - radioOrbital
    defaultChannel: Colony

# ├─[ HEADSETS ]────────────────────────────────────────────────────┤
- type: entity
  parent: CMHeadset
