  name: 生物家族加密密钥
  description: 用于在家族频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - radioMobFamily
    defaultChannel: radioMobFamily

- type: entity
  parent: AU14HeadsetColonist
  id: AU14HeadsetMob
  name: 生物家族耳机
  description: 一种常见的殖民地耳机，经过改装以在自定义频率上工作。
  components:
  - type: Sprite
    state: generic_headset
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyMob
