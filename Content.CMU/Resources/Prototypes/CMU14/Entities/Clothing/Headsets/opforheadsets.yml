# ├──[ ENCRYPTIONKEYS ]──────────────────────────────────────────────┤
- type: entity
  parent: AU14EncryptionKey
  id: AU14EncryptionKeyOpfor
  name: 敌方加密密钥
  description: 一个用于在假想敌频道上通信的加密密钥，会自动分配正确的频道。

- type: entity
  parent: AU14EncryptionKeyOpfor
  id: AU14EncryptionKeyOpforBravo
  name: 敌方布拉沃加密密钥
  description: 一个用于在假想敌布拉沃频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - radioOpforBravo
    defaultChannel: radioOpforBravo

- type: entity
  parent: AU14EncryptionKeyOpfor
  id: AU14EncryptionKeyOpforCharlie
  name: 敌军查理加密密钥
  description: 一个用于在假想敌查理频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - radioOpforCharlie
    defaultChannel: radioOpforCharlie

- type: entity
  parent: AU14EncryptionKeyOpfor
  id: AU14EncryptionKeyOpforCommand
  name: 敌方指挥部加密密钥
  description: 一条用于在所有可用敌军频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - radioOpforAlpha
    - radioOpforCharlie
    - radioOpforBravo
    - radioOpforCommand
    - radioOpforIntel
    - radioOpforVictor
    - radioOpforJTAC
    - radioOpforMILP
    defaultChannel: radioOpforCommand

- type: entity
  parent: AU14EncryptionKeyOpfor
  id: AU14EncryptionKeyOpforCommandOnly
  name: 敌方指挥部专用加密密钥
  description: 一个用于在敌方指挥部频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - radioOpforCommand
    defaultChannel: radioOpforCommand

- type: entity
  parent: AU14EncryptionKeyOpfor
  id: AU14EncryptionKeyOpforIntel
  name: 敌方情报加密密钥
  description: 一个用于在假想敌情报频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - radioOpforIntel
    defaultChannel: radioOpforIntel

- type: entity
  parent: AU14EncryptionKeyOpfor
  id: AU14EncryptionKeyOpforVictor
  name: OPFOR Victor encryption key
  description: An encryption key used to communicate on the OPFOR Victor channel.
  components:
  - type: EncryptionKey
    channels:
    - radioOpforVictor
    defaultChannel: radioOpforVictor

- type: entity
  parent: AU14EncryptionKeyOpfor
  id: AU14EncryptionKeyOpforJTAC
  name: 敌方JTAC加密密钥
  description: 一个用于在假想敌ATC频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - radioOpforJTAC

- type: entity
  parent: AU14EncryptionKeyOpfor
  id: AU14EncryptionKeyOpforMILP
  name: 敌方 MP 加密密钥
  components:
  - type: EncryptionKey
    channels:
    - radioOpforMILP

# ├──[ HEADSETS ]────────────────────────────────────────────────────┤
- type: entity
  parent: AU14HeadsetMilitaryBase
  id: AU14HeadsetOpforMarine
  name: 敌方小队无线电耳机
  description: 这是供OPFOR人员通过无线电进行通信使用的。
  components:
  - type: Sprite
    state: generic_headset
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyOpfor
  - type: GrantSquadLeaderTracker
    defaultMode: SquadLeader
    trackerModes:
    - SquadLeader
    - FireteamLeader
    - BattleBuddy
    - PrimaryLandingZone
    - OpforSeniorEnlistedAdvisor

- type: entity
  parent: AU14HeadsetOpforMarine
  id: AU14HeadsetOpforCommand
  name: 敌军指挥部无线电耳机
  description: 这是供敌方指挥部成员通过无线电进行通信使用的。
  components:
  - type: Sprite
    state: mco_headset
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyOpfor
      - AU14EncryptionKeyOpforCommand
      - AU14EncryptionKeyOpforBravo
      - AU14EncryptionKeyOpforCharlie
      - AU14EncryptionKeyOpforIntel
      - AU14EncryptionKeyOpforJTAC
      - AU14EncryptionKeyOpforMILP
  - type: RMCStaticDefaultChannel
  - type: EncryptionKeyHolder
    defaultChannel: radioOpforCommand

- type: entity
  parent: AU14HeadsetOpforMarine
  id: AU14HeadsetOpforMarineSL
  name: 敌方队长无线电耳机
  description: 这是供OPFOR班长在无线电上通信用途的。
  components:
  - type: ContainerFill
    containers:
      key_slots: # no command key, SLs talk to command through the RTO's manpack
      - AU14EncryptionKeyOpfor
      - AU14EncryptionKeyOpforJTAC

- type: entity
  parent: AU14HeadsetOpforMarine
  id: AU14HeadsetOpforMarineFTL
  name: 敌方前线指挥官无线电耳机
  description: 这是供敌方火力小组组长通过无线电进行通信使用的。
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyOpfor
      - AU14EncryptionKeyOpforJTAC
      - AU14EncryptionKeyOpforIntel

- type: entity
  parent: AU14HeadsetOpforMarine
  id: CMU14HeadsetOpforJTAC
  name: 敌军联合终端攻击控制员无线电耳机
  description: 这是敌方人员用于通过无线电进行通信的设备，包括JTAC频道。
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyOpfor
      - AU14EncryptionKeyOpforJTAC

- type: entity
  parent: AU14HeadsetOpforMarine
  id: CMUHeadsetOpforMarineAuxiliary
  name: 敌方小队辅助无线电耳机
  description: 这是供敌军小队医务兵和工程师在无线电上通信使用的，包括辅助频道。
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyOpfor
      - AU14EncryptionKeyOpforIntel

- type: entity
  parent: AU14HeadsetOpforMarine
  id: CMUHeadsetOpforDroneOperator
  name: 敌方无人机操作员无线电耳机
  description: 这是敌方无人机操作员用来通过无线电进行通信的设备，包括JTAC和辅助频道。
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyOpfor
      - AU14EncryptionKeyOpforJTAC
      - AU14EncryptionKeyOpforIntel

- type: entity
  parent: AU14HeadsetOpforMarine
  id: AU14HeadsetOpforAuxiliary
  name: 敌方辅助支援无线电耳机
  description: 这是敌方辅助支援人员用来通过无线电进行通信的。
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyOpfor
      - AU14EncryptionKeyOpforCommandOnly
      - AU14EncryptionKeyOpforIntel
  - type: RMCStaticDefaultChannel
  - type: EncryptionKeyHolder
    defaultChannel: radioOpforCommand

- type: entity
  parent: AU14HeadsetOpforMarine
  id: AU14HeadsetOpforMarineMP
  name: 敌方宪兵无线电耳机
  description: 这是敌方宪兵用来通过无线电通信的。
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyOpfor
      - AU14EncryptionKeyOpforCommand
#     - AU14EncryptionKeyOpforCommandOnly
      - AU14EncryptionKeyOpforMILP
  - type: RMCStaticDefaultChannel
  - type: EncryptionKeyHolder
    defaultChannel: radioOpforCommand

- type: entity
  parent: RMCBaseUniformAccessory
  id: AU14OPFORIOHeadset
  name: 假想敌情报耳机
  description: 情报人员使用的小型隐蔽式耳机。佩戴时几乎不可见，可 discreetly 夹在制服上，这款内置摄像头，可用于远程观察。
  suffix: OPFOR, IO
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/headsets.rsi
    state: cmb_headset
  - type: UniformAccessory
    hidden: true
    #viewerWhitelist:
    #  components:
    #  - CLFMember
    category: Utility
    limit: 1
    playerSprite:
      sprite: _RMC14/Objects/Medals/bronze.rsi
      state: equipped
  - type: GrantMarineIcons # same rank/role icons as the command headset it replaced
    factions:
    - UNMC
  - type: OverwatchCamera
  - type: AccessoryHeadset
    channels:
    - Colony
    - radioOpforAlpha
    - radioOpforCharlie
    - radioOpforBravo
    - radioOpforCommand
    - radioOpforIntel
    - radioOpforVictor
    - radioOpforJTAC
    - radioOpforMILP
    defaultChannel: radioOpforIntel
