# ├──[ ENCRYPTIONKEYS ]──────────────────────────────────────────────┤
- type: entity
  parent: AU14EncryptionKey
  id: AU14EncryptionKeyGovfor # blank key, channel set by SquadSystem.cs
  name: 政府专用加密密钥
  description: 一种用于在GOVFOR频道上通信的加密密钥，会自动分配正确的频道。

- type: entity
  parent: AU14EncryptionKeyGovfor
  id: AU14EncryptionKeyGovforBravo
  name: GOVFOR Bravo 加密密钥
  description: 一个用于在GOVFOR Bravo频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - radioGovforBravo
    defaultChannel: radioGovforBravo

- type: entity
  parent: AU14EncryptionKeyGovfor
  id: AU14EncryptionKeyGovforCharlie
  name: GOVFOR Charlie 加密密钥
  description: 用于在GOVFOR Charlie频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - radioGovforCharlie
    defaultChannel: radioGovforCharlie

- type: entity
  parent: AU14EncryptionKeyGovfor
  id: AU14EncryptionKeyGovforCommand
  name: 政府军指挥部加密密钥
  description: 用于在所有可用GOVFOR频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - radioGovforAlpha
    - radioGovforBravo
    - radioGovforCharlie
    - radioGovforCommand
    - radioGovforIntel
    - radioGovforFoxtrot
    - radioGovforJTAC
    - radioGovforMILP
    defaultChannel: radioGovforCommand

- type: entity
  parent: AU14EncryptionKeyGovfor
  id: AU14EncryptionKeyGovforCommandOnly
  name: 政府专用指挥部加密密钥
  description: 用于在GOVFOR指挥部频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - radioGovforCommand
    defaultChannel: radioGovforCommand

- type: entity
  parent: AU14EncryptionKeyGovfor
  id: AU14EncryptionKeyGovforIntel
  name: 政府专用情报加密密钥
  description: 一条用于在GOVFOR情报频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - radioGovforIntel
    defaultChannel: radioGovforIntel

- type: entity
  parent: AU14EncryptionKeyGovfor
  id: AU14EncryptionKeyGovforFoxtrot
  name: GOVFOR Foxtrot encryption key
  description: An encryption key used to communicate on the GOVFOR Foxtrot channel.
  components:
  - type: EncryptionKey
    channels:
    - radioGovforFoxtrot
    defaultChannel: radioGovforFoxtrot

- type: entity
  parent: AU14EncryptionKeyGovfor
  id: AU14EncryptionKeyGovforJTAC
  name: 政府军联合终端攻击控制员加密密钥
  description: 用于在GOVFOR ATC频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - radioGovforJTAC

- type: entity
  parent: AU14EncryptionKeyGovfor
  id: AU14EncryptionKeyGovforMILP
  name: 政府专用MP加密密钥
  description: 一种用于在GOVFOR MP信道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - radioGovforMILP

# ├──[ HEADSETS ]────────────────────────────────────────────────────┤
- type: entity
  parent: AU14HeadsetMilitaryBase
  id: AU14HeadsetGovforMarine
  name: 政府军分队无线电耳机
  description: 这是GOVFOR人员用来通过无线电进行通信的。
  components:
  - type: Sprite
    state: generic_headset
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyGovfor
  - type: GrantSquadLeaderTracker
    defaultMode: SquadLeader
    trackerModes:
    - SquadLeader
    - FireteamLeader
    - BattleBuddy
    - SeniorEnlistedAdvisor
    - PrimaryLandingZone

- type: entity
  parent: AU14HeadsetGovforMarine
  id: AU14HeadsetGovforCommand
  name: 政府军指挥部无线电耳机
  description: 这是指挥部政府军成员用来通过无线电进行通信的。
  components:
  - type: Sprite
    state: mco_headset
  - type: ContainerFill
    containers:
      key_slots: # give all usable keys for emergencies/promotions
      - AU14EncryptionKeyGovfor # empty key when taken out
      - AU14EncryptionKeyGovforCommand
      - AU14EncryptionKeyGovforBravo
      - AU14EncryptionKeyGovforCharlie
      - AU14EncryptionKeyGovforIntel
      - AU14EncryptionKeyGovforJTAC
      - AU14EncryptionKeyGovforMILP
  - type: RMCStaticDefaultChannel
  - type: EncryptionKeyHolder
    defaultChannel: radioGovforCommand

- type: entity
  parent: AU14HeadsetGovforMarine
  id: AU14HeadsetGovforMarineSL
  name: 政府军SL无线电耳机
  description: 这是GOVFOR小队队长用来通过无线电进行通信的。
  components:
  - type: ContainerFill
    containers:
      key_slots: # no command key, SLs talk to command through the RTO's manpack
      - AU14EncryptionKeyGovfor
      - AU14EncryptionKeyGovforJTAC

- type: entity
  parent: AU14HeadsetGovforMarine
  id: AU14HeadsetGovforMarineFTL
  name: 政府军前线指挥官无线电耳机
  description: 这是GOVFOR火力小组组长用来通过无线电进行通信的。
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyGovfor
      - AU14EncryptionKeyGovforJTAC
      - AU14EncryptionKeyGovforIntel

- type: entity
  parent: AU14HeadsetGovforMarine
  id: CMU14HeadsetGovforJTAC
  name: 政府军联合终端攻击控制员无线电耳机
  description: 这是GOVFOR人员用来通过无线电进行通信的设备，包括JTAC频道。
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyGovfor
      - AU14EncryptionKeyGovforJTAC

- type: entity
  parent: AU14HeadsetGovforMarine
  id: CMUHeadsetGovforMarineAuxiliary
  name: 政府军辅助无线电耳机
  description: 这是GOVFOR小队卫生员和工程师用来通过无线电进行通信的，包括辅助频道。
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyGovfor
      - AU14EncryptionKeyGovforIntel

- type: entity
  parent: AU14HeadsetGovforMarine
  id: CMUHeadsetGovforDroneOperator
  name: 政府无人机操作员无线电耳机
  description: 这是GOVFOR无人机操作员用来通过无线电进行通信的，包括JTAC和辅助频道。
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyGovfor
      - AU14EncryptionKeyGovforJTAC
      - AU14EncryptionKeyGovforIntel

- type: entity
  parent: RMCHeadsetShip
  id: AU14HeadsetGovforAuxiliary
  name: 政府/部队辅助支援耳机
  description: 这是GOVFOR辅助支援成员用来通过无线电进行通信的。
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyGovfor
      - AU14EncryptionKeyGovforCommandOnly
      - AU14EncryptionKeyGovforIntel
  - type: RMCStaticDefaultChannel
  - type: EncryptionKeyHolder
    defaultChannel: radioGovforCommand

- type: entity
  parent: AU14HeadsetGovforMarine
  id: AU14HeadsetGovforMarineMP
  name: 政府军宪兵无线电耳机
  description: 这是政府军宪兵用来通过无线电通讯的。
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyGovfor
      - AU14EncryptionKeyGovforCommand
#     - AU14EncryptionKeyGovforCommandOnly
      - AU14EncryptionKeyGovforMILP
  - type: RMCStaticDefaultChannel
  - type: EncryptionKeyHolder
    defaultChannel: radioGovforCommand

- type: entity
  parent: RMCBaseUniformAccessory
  id: AU14GOVFORIOHeadset
  name: GOVFOR 英特尔耳机
  description: 情报人员使用的小型隐蔽式耳机。佩戴时几乎不可见，可 discreetly 夹在制服上，这款内置摄像头，可用于远程观察。
  suffix: GOVFOR, IO
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/headsets.rsi
    state: cmb_headset
  - type: UniformAccessory
    hidden: true
    #viewerWhitelist:
    #  components:
    #  - CLFMember
    category: Utility
    limit: 1
    playerSprite:
      sprite: _RMC14/Objects/Medals/bronze.rsi
      state: equipped
  - type: GrantMarineIcons # same rank/role icons as the command headset it replaced
    factions:
    - UNMC
  - type: OverwatchCamera
  - type: AccessoryHeadset
    channels:
    - Colony
    - radioGovforAlpha
    - radioGovforBravo
    - radioGovforCharlie
    - radioGovforCommand
    - radioGovforIntel
    - radioGovforFoxtrot
    - radioGovforJTAC
    - radioGovforMILP
    defaultChannel: radioGovforIntel
