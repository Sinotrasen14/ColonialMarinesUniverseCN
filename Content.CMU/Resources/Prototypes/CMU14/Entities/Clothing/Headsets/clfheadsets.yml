- type: entity
  parent: AU14EncryptionKey
  id: AU14EncryptionKeyCLF
  name: 修改后的殖民地加密密钥
  description: 一种用于在殖民地与INSFOR无线电频道上通信的加密密钥。
  components:
  - type: EncryptionKey
    channels:
    - Colony
    - radioCLF
    defaultChannel: radioCLF

- type: entity
  parent: RMCBaseUniformAccessory
  id: AU14CLFHeadset
  name: INSFOR 耳塞
  description: INSFOR特工使用的小型隐蔽耳塞。佩戴时几乎隐形，可隐蔽地夹在制服上。
  suffix: INSFOR, Colony
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/headsets.rsi
    state: cmb_headset
  - type: UniformAccessory
    hidden: true
    viewerWhitelist:
      components:
      - CLFMember
    category: Utility
    limit: 1
    playerSprite:
      sprite: _RMC14/Objects/Medals/bronze.rsi
      state: equipped
  - type: AccessoryHeadset
    channels:
    - Colony
    - radioCLF
    defaultChannel: radioCLF

# the upstream CLF headset only inherits the colony key, so off-map cells never heard radioCLF
- type: entity
  parent: RMCHeadsetDistressCLF
  id: AU14HeadsetCLF
  suffix: CLF, Colony
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyCLF
