  id: RuMCBoxFlare
  name: 信号传单箱
  description: 用于储存和运输信号飞行器的运输封盖箱。内含8个密封包，每包有8个装有烟火药的圆柱体。箱盖上的标记便于在不打开箱子的情况下快速识别飞行器类型。用于为突击小组和前沿检查点提供补给。请注意，箱子应存放在干燥处，远离明火。如果湿气进入箱内，内容物应予以处置，因为飞行器可能失控。
  components:
