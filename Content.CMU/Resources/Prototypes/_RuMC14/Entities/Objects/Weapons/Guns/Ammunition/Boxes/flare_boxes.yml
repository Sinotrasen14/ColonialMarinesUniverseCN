#CAS
- type: entity
  parent: RuMCBoxFlare
  id: RuMCBoxFlareCAS
  name: 信号传单盒“GRACH”
  description: 用于储存和运输信号飞行物的运输封盖箱。内含8个密封包，每包有8个装有烟火药的圆柱体。箱盖上的标记便于在不打开箱子的情况下快速识别飞行物类型。用于为突击小组和前沿检查点提供补给。请注意，箱子应存放在干燥处，远离明火。如果湿气进入箱内，内容物应予以处置，因为飞行物可能失控。
  components:
  - type: Construction
    graph: RMCBoxMagazine
    node: RMCBoxMagazinePowerCellsHigh
  - type: Sprite
    layers:
    - state: supply_box_small
      color: "#4a545c"
    - state: supply_ammo_full
      map: [ "enum.CMItemSlotsLayers.Fill" ]
      color: "#b2bdc4"
    - state: supply_box_small_flare
      color: "#606e78"
    - state: supply_box_small_flare_colour
      color: "#FFA7A7"
    - state: supply_lid_small_closed
      map: [ "lid" ]
      color: "#4a545c"
    - state: supply_lid_small_closed_marking # "size"_lid - Base Colour
      map: [ "lid_marking" ]
      color: "#4a545c"
    - state: star_supply #star
      sprite: _RuMC14/Objects/Weapons/Guns/Ammunition/Boxes/UPP_Boxes.rsi
      color: "#c62828"
  - type: CMItemSlots
    count: 8
    slot:
      whitelist:
        tags:
        - RuMCPackFlareRed

- type: entity
  parent: RuMCBoxFlareCAS
  id: RuMCBoxFlareCASFilled
  suffix: Filled
  components:
  - type: CMItemSlots
    startingItem: RuMCPackFlareRed

#Standart
- type: entity
