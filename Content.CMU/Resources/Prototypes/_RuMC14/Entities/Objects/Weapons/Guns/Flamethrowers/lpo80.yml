- type: entity
  parent: RMCTankFlamer
  id: RuMCTankFlamerRLargeUPP
  name: LPO80-T 焚烧炉气瓶（R189）
  description: 一个用于为LPO80焚烧炉单元储存燃料的燃料气瓶。小心轻放。这个似乎比标准的LPO80气瓶更大，可能用于延长作业。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/lpo80.rsi
    state: flametank
    layers:
    - state: flametank
    - state: flametank_strip1
    - state: flametank_strip2
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 250
        reagents:
        - ReagentId: RMCR189
          Quantity: 250
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: flametank_strip
  - type: Tag
    tags:
    - RuMCTankFlamerRLargeUPP
    - RMCTankFlamerXLargeUPP

- type: entity
  parent: RMCTankFlamer
