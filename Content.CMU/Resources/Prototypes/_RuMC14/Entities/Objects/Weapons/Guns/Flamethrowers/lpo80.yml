  name: LPO80焚烧炉气瓶（R189）
  description: 一个用于储存燃料以供LPO80焚烧装置使用的燃料气瓶。请小心搬运。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/lpo80.rsi
    state: flametank
    layers:
    - state: flametank
    - state: flametank_strip1
    - state: flametank_strip2
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 100
        reagents:
        - ReagentId: RMCR189
          Quantity: 100
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: flametank_strip
  - type: Tag
    tags:
    - RMCTankFlamerSPP

- type: Tag
  id: RuMCTankFlamerRLargeUPP
