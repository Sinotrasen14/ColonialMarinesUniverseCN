- type: entity
  parent: [ CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  name: DP-72“机枪哥”
  id: RuMCMachineGunTachanka
  description: 苏联时期的7.62x54R重机枪。配有弹盘和重型枪管。可靠，但很重。
  components:
  - type: Item
    size: Huge
#  - type: Appearance
#  - type: Corrodible
#    isCorrodible: false
  - type: Sprite
    sprite: _RuMC14/Objects/Weapons/Guns/LMGs/Tachanka/tachanka_inhands.rsi
    layers:
    - state: base
      sprite: _RuMC14/Objects/Weapons/Guns/LMGs/Tachanka/tachanka.rsi
    - state: bolt-open
      sprite: _RuMC14/Objects/Weapons/Guns/LMGs/Tachanka/tachanka.rsi
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      sprite: _RuMC14/Objects/Weapons/Guns/LMGs/Tachanka/tachanka.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RuMC14/Objects/Weapons/Guns/LMGs/Tachanka/tachanka_inhands.rsi
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_m60.ogg
      params:
        volume: -4
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - FullAuto
    recoilWielded: 0
    recoilUnwielded: 0
    scatterWielded: 1
    scatterUnwielded: 1
    baseFireRate: 8
    modifiers:
      FullAuto:
        fireDelay: 0.02
        maxScatterModifier: 80
        shotsToMaxScatter: 2
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 0.9
    accuracyMultiplierUnwielded: 0.65
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: RuMCMagazineTachankaLarge
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RuMCMagazineTachanka
          - RuMCMagazineTachankaLarge
          - RuMCMagazineTachankaLargeTracer
  - type: GunDamageModifier
    multiplier: 1
  - type: AttachableHolder
    slots:
      rmc-aslot-rail:
        startingAttachable: AU14AttachmentTwoPointSling
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: 0, 0.1
      rmc-aslot-underbarrel: 0.35, -0.3
  - type: ItemCamouflage
    camouflageVariations: { }
  - type: Tag
    tags:
    - RuMCMachineGunTachanka
  - type: Wieldable
  - type: WieldableSpeedModifiers
    base: 0.70
    light: 0.75
    medium: 0.8
    heavy: 0.75
  - type: WieldDelay
    baseDelay: 0.9
  - type: GunRequiresWield

# Magazines

- type: entity
  parent: CMMagazineRifleBase
  id: RuMCMagazineTachanka
  name: DP-72盘式弹匣（7.62x54R）
  description: 一把用于DP-72轻机枪的47发弹盘。
  components:
  - type: Tag
    tags:
    - RuMCMagazineTachanka
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - RMCCartridgeLMGQYJ72
      - RuMCCartridge762x54R
    proto: RMCCartridgeLMGQYJ72
    capacity: 47
    deleteWhenEmpty: false
  - type: Sprite
    sprite: _RuMC14/Objects/Weapons/Guns/Ammunition/Magazines/LMGs/tachanka.rsi
    layers:
    - state: base_mini
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-3Mini
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    slots:
    - suitStorage
  - type: Item
    size: Large

- type: entity
