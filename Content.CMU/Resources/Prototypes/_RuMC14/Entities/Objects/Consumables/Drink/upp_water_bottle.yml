- type: entity
  parent: DrinkBottlePlasticBaseFull
  id: RuMCDrinkUPPwaterBottle
  name: UPP瓶装泉水
  description: 臭氧水完全可以安全饮用。
  components:
  - type: Solution
    id: drink
    solution:
      maxVol: 50
      reagents:
      - ReagentId: Water
        Quantity: 45
  - type: Edible
    edible: Drink
    solution: drink
    destroyOnEmpty: false
    utensil: None
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Drink/upp_water_bottle.rsi
    layers:
    - state: icon
      map: ["enum.OpenableVisuals.Layer"]
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "icon_open"}
          False: {state: "icon"}
  - type: Item
    size: Small
  - type: DamageOnLand
    damage: {}
  - type: DamageOtherOnHit
    damage: {}
  - type: Appearance
  - type: Sealable
  - type: MREItem
  - type: Destructible
    thresholds: [] # TODO RMC14 destroy on explosion unless inside a container
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: PhysicalComposition
    materialComposition:
      RMCPlastic: 5

- type: entity
  parent: RuMCDrinkUPPwaterBottle
  id: RuMCDrinkUPPBugJuice
  name: UPP包装的菠萝汁
  description:
  components:
  - type: Solution
    id: drink
    solution:
      maxVol: 50
      reagents:
      - ReagentId: RMCJuiceBug
        Quantity: 45
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Drink/upp_juice.rsi
    layers:
    - state: icon
      map: ["enum.OpenableVisuals.Layer"]
