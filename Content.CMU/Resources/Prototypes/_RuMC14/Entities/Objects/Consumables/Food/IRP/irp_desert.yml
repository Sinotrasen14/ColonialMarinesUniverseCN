- type: entity
  abstract: true
  parent: RuMCIRPComponentBase
  id: RuMCIRPDesertComponentBase
  description: 甜食的包装。
  components:
  - type: Sprite
    state: pack_desert

- type: entity
  parent: RuMCIRPDesertComponentBase
  id: RuMCIRPComponentCandies
  name: 水果糖果袋
  description: 一个密封袋，里面装着色彩鲜艳的水果糖。战场上一小片家的味道。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: RuMCFoodCandies

- type: entity
  parent: RuMCIRPDesertComponentBase
  id: RuMCIRPComponentCandiesToffees
  name: 太妃糖袋
  description: 一袋密封的耐嚼、黏牙的太妃糖。在野外，这可是对你补牙材料的真正考验。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: RuMCFoodCandiesToffees

- type: entity
  parent: RuMCIRPDesertComponentBase
  id: RuMCIRPComponentChocolateCurd
  name: 巧克力凝乳袋
  description: 一个密封袋，里面装着巧克力包裹的甜味凝乳甜点。只融在口，不融在口粮包里。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: RuMCFoodChocolateCurd

- type: entity
  parent: RuMCIRPDesertComponentBase
  id: RuMCIRPComponentChocolate
  name: 巧克力棒袋
  description: 一个密封袋，里面装着标准配给的野战巧克力。在混乱的战斗中带来一丝慰藉。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: RuMCFoodChocolate

- type: entity
  parent: RuMCIRPDesertComponentBase
  id: RuMCIRPComponentHematogen
  name: 血源糕条包装袋
  description: 一个密封袋，内装以牛血为基底的营养棒。味道需要慢慢适应，但在野外恢复体力效果极佳。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: RuMCFoodHematogen
