- type: entity
  name: 硬饼干
  parent: CMFoodBase
  id: RuMCFoodGallet
  description: 一种紧实干燥的饼干，比任何战争都更持久。食用前最好用茶或水浸泡。
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/irp_contents.rsi
    state: gallet
  - type: Edible
    transferAmount: 3
  - type: Solution
    id: food
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Nutriment
        Quantity: 7
  - type: FlavorProfile
    flavors:
    - bread

- type: entity
  name: 咸鱼
  parent: CMFoodBase
  id: RuMCFoodFish
  description: 摸起来像石头一样。使用前要揉一揉，否则可能会崩掉牙齿。
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/irp_contents.rsi
    state: fish
  - type: Edible
    transferAmount: 1
  - type: Solution
    id: food
    solution:
      maxVol: 30
      reagents:
      - ReagentId: Nutriment
        Quantity: 15
      - ReagentId: Protein
        Quantity: 10
  - type: FlavorProfile
    flavors:
    - garlic
    - fishy
    - salty

- type: entity
  name: 肉馅饼
  parent: CMFoodBase
  id: RuMCFoodPie
  description: 一种简单的无产阶级馅饼，里面塞满了肉和蔬菜。没什么花哨的，但能填饱肚子。
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/irp_contents.rsi
    state: pie
  - type: Edible
    transferAmount: 5
  - type: Solution
    id: food
    solution:
      maxVol: 15
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Protein
        Quantity: 5
  - type: FlavorProfile
    flavors:
    - bread
    - vegetables
    - meaty
    - garlic
    - salty

- type: entity
  name: 罐装鸡肉
  parent: CMFoodBase
  id: RuMCFoodChicken
  description: 嫩滑的罐装鸡肉，浸泡在原汁中。作为野战口粮还算不错，只是口感还有待改进。
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/irp_contents.rsi
    state: chicken
  - type: Edible
    transferAmount: 5
  - type: Solution
    id: food
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Protein
        Quantity: 10
  - type: FlavorProfile
    flavors:
    - garlic
    - chicken
    - salty

- type: entity
  name: 土豆泥
  parent: CMFoodBase
  id: RuMCFoodMashedPotatoes
  description: 速食土豆泥。加水搅拌，尽享前线风味。
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/irp_contents.rsi
    state: mashed_potatoes
  - type: Edible
    transferAmount: 5
  - type: Solution
    id: food
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Nutriment
        Quantity: 19
      - ReagentId: Protein
        Quantity: 1
  - type: FlavorProfile
    flavors:
    - potatoes
    - salty

#desert --------------------------------------------------------------------------------------------

- type: entity
  name: 水果糖
  parent: CMFoodBase
  id: RuMCFoodCandies
  description: 色彩鲜艳的水果糖。战场上一小片家的味道。
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/irp_contents.rsi
    state: candies
  - type: Edible
    transferAmount: 2
  - type: Solution
    id: food
    solution:
      maxVol: 15
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
      - ReagentId: Sugar
        Quantity: 7
  - type: FlavorProfile
    flavors:
    - sweet

- type: entity
  name: 太妃糖
  parent: CMFoodBase
  id: RuMCFoodCandiesToffees
  description: 耐嚼、黏牙的太妃糖。在野外，这可是对你补牙材料的真正考验。
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/irp_contents.rsi
    state: toffees
  - type: Edible
    transferAmount: 2
  - type: Solution
    id: food
    solution:
      maxVol: 15
      reagents:
      - ReagentId: Nutriment
        Quantity: 4
      - ReagentId: Sugar
        Quantity: 11
  - type: FlavorProfile
    flavors:
    - sweet

- type: entity
  name: 巧克力凝乳
  parent: CMFoodBase
  id: RuMCFoodChocolateCurd
  description: 一块甜美的巧克力涂层凝乳甜点。在你口中融化，而不是在口粮包里。
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/irp_contents.rsi
    state: curd
  - type: Edible
    transferAmount: 9
  - type: Solution
    id: food
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Protein
        Quantity: 3
      - ReagentId: Sugar
        Quantity: 5
  - type: FlavorProfile
    flavors:
    - sweet
    - chocolate
    - creamy

- type: entity
  name: 巧克力棒
  parent: CMFoodBase
  id: RuMCFoodChocolate
  description: 标准配给野战巧克力。战斗混乱中的一点小小慰藉。
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/irp_contents.rsi
    state: chocolate
  - type: Edible
    transferAmount: 4
  - type: Solution
    id: food
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Sugar
        Quantity: 10
  - type: FlavorProfile
    flavors:
    - sweet
    - chocolate

- type: entity
  name: 血肠棒
  parent: CMFoodBase
  id: RuMCFoodHematogen
  description: 一种基于牛血的营养丰富的棒状食品。味道需要慢慢适应，但在野外恢复体力效果极佳。
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/irp_contents.rsi
    state: hematogen
  - type: Edible
    transferAmount: 6
  - type: Solution
    id: food
    solution:
      maxVol: 30
      reagents:
      - ReagentId: Nutriment
        Quantity: 12
      - ReagentId: RMCPeanutButter
        Quantity: 1
      - ReagentId: Protein
        Quantity: 10
      - ReagentId: Sugar
        Quantity: 7
  - type: FlavorProfile
    flavors:
    - nutty
    - sweet
    - chocolate
