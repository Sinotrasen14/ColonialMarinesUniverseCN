- type: entity
  abstract: true
  parent: RuMCIRPComponentBase
  id: RuMCIRPSnackComponentBase
  description: 一包混合零食。
  components:
  - type: Sprite
    state: pack

- type: entity
  parent: RuMCIRPSnackComponentBase
  id: RuMCIRPComponentFish
  name: 咸鱼袋
  description: 一个密封袋，里面装着咸鱼。摸起来像石头。使用前先揉一揉，否则可能硌坏牙齿。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: RuMCFoodFish

- type: entity
  parent: RuMCIRPSnackComponentBase
  id: RuMCIRPComponentPie
  name: 肉馅饼袋
  description: 一个密封袋，里面装着一个简单的无产阶级馅饼，馅料是肉和蔬菜。没什么特别的，但能填饱肚子。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: RuMCFoodPie

- type: entity
  parent: RuMCIRPSnackComponentBase
  id: RuMCIRPComponentChicken
  name: 罐装鸡肉袋
  description: 一个密封袋，里面装着浸在自身汤汁中的嫩滑罐装鸡肉。作为野战口粮还算不错，只是口感还有待改进。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: RuMCFoodChicken

- type: entity
  parent: RuMCIRPSnackComponentBase
  id: RuMCIRPComponentMashedPotatoes
  name: 土豆泥袋
  description: 一个密封袋，里面装着速食土豆泥。加水、搅拌，享受前线的味道。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: RuMCFoodMashedPotatoes

# ГАЛЕТЫ

- type: entity
  abstract: true
  parent: RuMCIRPComponentBase
  id: RuMCIRPGalletComponentBase
  description: 一袋硬饼干。
  components:
  - type: Sprite
    state: gallet_pack

- type: entity
  parent: RuMCIRPGalletComponentBase
  id: RuMCIRPComponentGallet
  name: 硬饼干袋
  description: 一个密封袋，里面装着密实干燥的饼干，保质期足以熬过任何战争。食用前最好用茶水或水浸泡。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: RuMCFoodGallet
