- type: entity
  parent:  RMCMarineHelmetBase
  id: RuMCUPPNavalInfantryHeavyHelmet
  name: Maska-S
  description: UPP的头盔。虽然叫重型头盔，但唯一的区别是面罩感觉像是纸板做的，所以和普通版没多大差别。[Head, eyes]
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/helmet/Maska_s.rsi
  - type: Clothing
    sprite: _RuMC14/Clothing/UPP/helmet/Maska_s.rsi
  - type: ItemToggle
    activated: true
  - type: ToggleClothing
    action: RMCActionToggleWeldingGoggles
  - type: ComponentToggler
    components:
    - type: EyeProtection
    - type: WeldingVision
  - type: RMCItemToggleClothingVisuals
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon-on}
          False: {state: icon}
  - type: Appearance
  - type: Tag
    tags:
    - RMCHelmetWelding
  - type: Item
    storedRotation: 0
  - type: HelmetAccessory
    rsi:
      sprite: _RuMC14/Clothing/UPP/helmet/Maska_s.rsi
      state: helmet
    toggledRsi:
      sprite: _RuMC14/Clothing/UPP/helmet/Maska_s.rsi
      state: helmet-down
  - type: CMArmor
    melee: 35
    bullet: 40
    bio: 20
    explosionArmor: 15
    # armor_laser = 15
    # armor_energy = 10
    # armor_rad = 10
    # armor_internaldamage = 20

- type: entity
  parent: RMCMarineHelmetBase
  id: RuMCUPPNavalInfantryHeavyHelmet2
  name: 阿尔金-S
  description: 一种重型突击头盔，配有宽大的弧形聚碳酸酯防弹面罩。与Maska不同，它提供了完整无阻的视野，非常适合近距离环境中的指挥官和操作员。面罩能抵御大多数手枪弹和弹片，但持续的重火力或钝器冲击可能使其破裂。它是精英地位与现代防护的象征。
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/helmet/Altyn_s.rsi
  - type: Clothing
    sprite: _RuMC14/Clothing/UPP/helmet/Altyn_s.rsi
  - type: ItemToggle
    activated: true
  - type: ToggleClothing
    action: RMCActionToggleWeldingGoggles
  - type: ComponentToggler
    components:
    - type: EyeProtection
  - type: RMCItemToggleClothingVisuals
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon-on}
          False: {state: icon}
  - type: Appearance
  - type: Tag
    tags:
    - RMCHelmetWelding
  - type: Item
    storedRotation: 0
  - type: HelmetAccessory
    rsi:
      sprite: _RuMC14/Clothing/UPP/helmet/Altyn_s.rsi
      state: helmet
    toggledRsi:
      sprite: _RuMC14/Clothing/UPP/helmet/Altyn_s.rsi
      state: helmet-down
  - type: CMArmor
    melee: 30
    bullet: 35
    bio: 25
    explosionArmor: 20
    # armor_laser = 15
    # armor_energy = 10
    # armor_rad = 10
    # armor_internaldamage = 20

- type: entity
  parent: RMCArmorHelmetMercenary
  id: RuMCUPPHeavyHelmet
  name: 6B83重型头盔
  description: 可进行舱外活动的封闭式头盔，属于UPP海军步兵。尽管提供了更高的护甲等级，这款头盔笨重的设计使其未能在海军步兵的装备中占据更重要的位置，而主要保留给重型武器操作员和其他专业角色。通常与6B99-2重型突击装甲一同携带。
