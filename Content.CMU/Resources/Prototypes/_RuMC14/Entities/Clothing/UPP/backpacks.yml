- type: entity
  parent: [RuMCUPPNavalInfantryBackpack]
  id: RuMCUPPNavalInfantryBackpackMedical
  name: UPP轻型背包
  description: 紧凑轻便的背包，带有外部绑带。非常适合快速突袭。配有急救包绑带。
  components:
    - type: Sprite
      sprite: _RuMC14/Clothing/UPP/backpack/standard_2.rsi
      state: icon
    - type: Clothing
      sprite: _RuMC14/Clothing/UPP/backpack/standard_2.rsi
      slots:
        - back
    - type: ItemSlots
      slots:
        # Слот для аптечки
        med_slot:
          name: medical-pouch-slot
          whitelist:
            tags:
              - CMFirstAidKit
          priority: 3
    - type: ItemMapper
      sprite: _RuMC14/Clothing/UPP/backpack/standard_2.rsi
      mapLayers:
        med:
          whitelist:
            tags:
              - CMFirstAidKit
    - type: ContainerContainer
      containers:
        med_slot: !type:ContainerSlot {}
        storagebase: !type:Container {}
    - type: Storage
      maxItemSize: Normal
      grid:
      - 0,0,10,1

- type: entity
  parent: CMSatchel
  id: RuMCUPPNavalInfantryBackpack
  name: UPP轻型背包
  description: 我的背很痛，我的腿很累，但至少我不用爬到死去的敌人那里去获取更多弹药。我需要的一切都带在身上。
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/backpack/standard_1.rsi
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,17,1

- type: entity
  parent: CMBackpack
  id: RuMCUPPNavalInfantryBackpackBig
  name: UPP突击背包
  description: 突击版。它的容量恰好够你撑过这个夜晚。没有一丝多余的英雄主义。祖国会记住你。
  components:
  - type: ExplosionResistance
    damageCoefficient: 0
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/backpack/standard_big.rsi
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,24,1

