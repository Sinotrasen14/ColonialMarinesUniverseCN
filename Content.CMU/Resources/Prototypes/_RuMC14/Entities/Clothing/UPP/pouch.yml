- type: entity
  parent: RMCPouchMagazine
  id: RuMCUPPPouchMagazine
  name: PM-74-弹匣
  description: 一个紧凑、加固的弹匣袋，用于标准突击步枪弹匣。专为高机动行动中的快速取用和可靠固定而设计。所有UPP步枪手的标准装备。
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/medium_ammo_mag.rsi

- type: entity
  parent: RuMCUPPPouchMagazine
  id: RuMCUPPPouchMagazineLarge
  name: PM-74-弹匣 改装版
  description: PM-74的加长型变体。可携带大量步枪弹匣。供自动步枪手和预期将进行长时间交战的部队使用。
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/large_ammo_mag.rsi
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,7,1

- type: entity
  parent: RMCPouchConstruction
  id: RuMCUPPPouchConstruction
  name: PM-18-施工
  description: 工程师的通用包。它配有用于玻璃片、金属杆、带刺铁丝、电缆卷和空沙袋的环扣和口袋。它还有两个外部挂钩，用于放置战壕工具或可互换的照明装置。
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/construction.rsi

- type: entity
  parent: RMCPouchBayonet
  id: RuMCUPPPouchBayonet
  name: PM-6-刺刀
  description: 一个用于固定刺刀或大型格斗刀的保险刀座。在牢牢固定刀身的同时，仍可随时取用，确保移动过程中不会丢失。指挥部仍然不明白部队为什么需要这些刀套。
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/bayonet.rsi

- type: entity
  parent: RMCPouchFuelTank
  id: RuMCUPPPouchFuelTank
  name: PM-12-燃料
  description: 一种专用背带，配有两个环形绑带，用于安全携带凝固汽油气瓶。小心轻放。哪怕只漏一点，也能把士兵变成火把。
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/fueltank.rsi

- type: entity
  parent: RMCPouchGeneralLarge
  id: RuMCUPPPouchGeneralLarge
  name: PM-47-通用
  description: 一个大型通用袋。用于携带各种不同尺寸的物品，从医疗用品到额外口粮。并非为特定用途而设计，但几乎对任何用途都很有用。
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/large_drop.rsi

- type: entity
  parent: RMCPouchExplosive
  id: RuMCUPPPouchExplosive
  name: PM-54-炸药
  description: 一个带有加固缝线和安全翻盖的强韧袋。专为安全携带手榴弹、塑性炸药和地雷部件而设计。工兵和爆破专家的通用选择。
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/large_explosive.rsi

- type: entity
  parent: RMCPouchMagazinePistolLarge
  id: RuMCUPPPouchMagazinePistolLarge
  name: PM-18-手枪改装型
  description: 一个超大号手枪弹匣袋，常被特种部队用于高容量副武器，或为重左轮手枪携带额外的快速装弹器。笨重但有效。
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/large_pistol_mag.rsi

- type: entity
  parent: RMCPouchMagazinePistol
  id: RuMCUPPPouchMagazinePistol
  name: PM-18-手枪
  description: 一个轻便的腰包，用于携带手枪弹匣和左轮手枪快速装弹器。深受军官、车组人员以及任何重视备用武器满载待命的人青睐。在确保内容物安全的同时，避免了不必要的臃肿。
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/medium_pistol_mag.rsi

- type: entity
  parent: RMCPouchShotgunLarge
  id: RuMCUPPPouchShotgunLarge
  name: PM-23-霰弹枪改装型
  description: 一个扩容的霰弹枪弹袋。可携带大量弹药，适合持续近距战斗。对于清理房间或守住狭窄角落的人来说必不可少。
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/large_shotshells.rsi

- type: entity
  parent: RMCPouchShotgun
  id: RuMCUPPPouchShotgun
  name: PM-23-霰弹枪
  description: 为12号口径和23毫米霰弹枪弹壳设计。可容纳足够在近距离进行几次激烈交火的弹药。破门手和尖兵的必备之物。
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/medium_shotshells.rsi
    layers:
    - state: icon
    - state: half
      visible: false
    - state: full
      visible: false

- type: entity
  parent: RMCPouchTools
  id: RuMCUPPPouchTools
  name: PM-66-工具
  description: 一个专用于维修工具的收纳袋。设计用于放置螺丝刀、扳手、线缆卷，以及一个用于灯管替换器的可拆卸挂钩。现场工程师的标志。
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/tools.rsi

- type: entity
