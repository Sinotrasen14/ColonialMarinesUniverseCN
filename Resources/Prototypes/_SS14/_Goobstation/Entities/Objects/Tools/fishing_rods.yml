# Basic rod
- type: entity
  id: FishingRod
  parent: BaseItem
  name: 钓鱼竿 | fishing rod
  description: 是时候去钓鱼了！ | It's time to go fishing!
  components:
  - type: Sprite
    sprite: _SS14/_Goobstation/Objects/Specific/Fishing/fishing_rod.rsi
    state: icon
  - type: Item
    sprite: _SS14/_Goobstation/Objects/Specific/Fishing/fishing_rod.rsi
    size: Normal
  - type: UseDelay # Just for visuals and to prevent autoclickers
    delay: 0.08 # 12,5 CPS at max
  - type: MeleeWeapon
    wideAnimationRotation: 45
    attackRate: 1.0
    damage:
      types:
        Piercing: 4
  - type: FishingRod

# Variation of a normal rod
- type: entity
  id: FishingRodGoon
  suffix: Goon
  parent: FishingRod
  name: 钓鱼竿 | fishing rod
  description: 是时候去钓鱼了！ | It's time to go fishing!
  components:
  - type: Sprite
    sprite: _SS14/_Goobstation/Objects/Specific/Fishing/goon_rod.rsi
    state: icon
  - type: Item
    sprite: _SS14/_Goobstation/Objects/Specific/Fishing/goon_rod.rsi
    size: Normal

# Makeshift rod
- type: entity
  id: FishingRodMakeshift
  parent: FishingRod
  name: 简易钓鱼竿 | makeshift fishing rod
  description: 用那个大概很难钓到鱼吧。 | Probably would be hard to catch a fish using that.
  components:
  - type: Sprite
    sprite: _SS14/_Goobstation/Objects/Specific/Fishing/makeshift_rod.rsi
    state: icon
  - type: Item
    sprite: _SS14/_Goobstation/Objects/Specific/Fishing/makeshift_rod.rsi
    size: Normal
  - type: FishingRod
    floatPrototype: FishingLureMakeshift
    efficiency: 0.8
  - type: Construction
    graph: FishingRodMakeshift
    node: makeshiftRod

# Golden rod
- type: entity
  id: FishingRodGolden
  parent: FishingRod
  name: 黄金钓鱼竿 | golden fishing rod
  description: 终于，你钓到了250条鱼。这是你的奖杯。 | Finally, you caught 250 fishes. Here's your trophey.
  components:
  - type: Sprite
    sprite: _SS14/_Goobstation/Objects/Specific/Fishing/golden_rod.rsi
    state: icon
  - type: Item
    sprite: _SS14/_Goobstation/Objects/Specific/Fishing/golden_rod.rsi
    size: Normal
  - type: FishingRod
    efficiency: 1.3
  - type: MeleeWeapon
    wideAnimationRotation: 45
    attackRate: 1.0
    damage:
      types:
        Piercing: 10

# Normal fishing lure
- type: entity
  id: FishingLure
  parent: BaseItem
  name: 钓鱼诱饵 | fishing lure
  description: 鱼儿来这里 | fish come here
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    noRot: true
    sprite: _SS14/_Goobstation/Objects/Specific/Fishing/fishing_lure.rsi
    state: icon
  - type: Item
    sprite: _SS14/_Goobstation/Objects/Specific/Fishing/fishing_lure.rsi
    size: Normal
  - type: FishingLure

- type: entity
  id: FishingLureMakeshift
  parent: FishingLure
  name: 钓鱼拟饵 | fishing lure
  description: 鱼儿来这里 | fish come here
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    noRot: true
    sprite: _SS14/_Goobstation/Objects/Specific/Fishing/makeshift_lure.rsi
    state: icon
  - type: Item
    sprite: _SS14/_Goobstation/Objects/Specific/Fishing/makeshift_lure.rsi
    size: Normal
