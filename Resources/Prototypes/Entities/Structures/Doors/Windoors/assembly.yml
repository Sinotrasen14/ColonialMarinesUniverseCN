- type: entity
  parent: [BaseStructure, StructureHealthDoorWeak]
  id: WindoorAssembly
  name: 风门组件 | windoor assembly
  description: 它会打开，会关闭，而且你还能透过它看东西！ | It opens, it closes, and you can see through it!
  placement:
    mode: SnapgridCenter
  components:
  - type: InteractionOutline
  - type: Sprite
    sprite: Structures/Doors/Windoors/windoor.rsi
    layers:
    - state: assembly
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.2"
        density: 40
        mask:
        - Impassable
        - HighImpassable
  - type: Anchorable
  - type: Pullable
  - type: Rotatable
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger: &DamageDoorWeak !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1: &BaseWindoorDrop
            min: 1
            max: 2
  - type: Construction
    graph: Windoor
    node: assembly

#plasma windoor assemblies
- type: entity
  parent: WindoorAssembly
  id: WindoorAssemblyPlasma
  name: 等离子风门组件 | plasma windoor assembly
  description: 它会打开，它会关闭，而且你能透过它看过去！这个看起来是紫色——不，粉色。等等…… | It opens, it closes, and you can see through it! This one looks purp-, no, pink. Wait...
  components:
  - type: Sprite
    sprite: Structures/Doors/Windoors/plasma.rsi
    layers:
    - state: assembly
  - type: Destructible
    thresholds:
    - trigger: *DamageDoorWeak
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPGlass1: *BaseWindoorDrop
  - type: Construction
    graph: Windoor
    node: pglass

#uranium windoor assemblies
- type: entity
  parent: WindoorAssembly
  id: WindoorAssemblyUranium
  name: 铀风门组件 | uranium windoor assembly
  description: 它会打开，会关闭，还能看穿它！这个看起来是病态的绿色…… | It opens, it closes, and you can see through it! This one looks sickly green...
  components:
  - type: Sprite
    sprite: Structures/Doors/Windoors/uranium.rsi
    layers:
    - state: assembly
  - type: Destructible
    thresholds:
    - trigger: *DamageDoorWeak
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetUGlass1: *BaseWindoorDrop
  - type: Construction
    graph: Windoor
    node: uglass
