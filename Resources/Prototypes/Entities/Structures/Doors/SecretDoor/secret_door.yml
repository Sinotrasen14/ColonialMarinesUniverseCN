- type: entity
  abstract: true
  parent: [BaseStructure, StructureHealthDoorWeak]
  id: BaseSecretDoor
  name: 实体墙 | solid wall # No meta
  suffix: secret door
  description: 把空气留在里面，把灰潮挡在外面。 | Keeps the air in and the greytide out.
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: Sprite
    sprite: Structures/Doors/Misc/secret-door.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: AnimationPlayer
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: Door
    bumpOpen: false
    clickOpen: true
    canCrush: false
    closeTimeOne: 0.2
    closeTimeTwo: 0.2
    openTimeOne: 0.2
    openTimeTwo: 0.2
    openingAnimationTime: 1.2
    closingAnimationTime: 1.2
    openDrawDepth: Walls
    closedDrawDepth: Walls
  - type: Appearance
  - type: Weldable
    time: 2
    weldedExamineMessage:
  - type: Airtight
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: Occluder
  - type: ContainerFill
    containers:
      battery-container: [PowerCellMedium]
  - type: Tag
    tags:
    - Structure
    - ForceNoFixRotations # Don't want the fixrotations command to target these
  - type: Wall
  - type: ContainerContainer
    containers:
      battery-container: !type:Container
  - type: BlockWeather
  - type: PlacementReplacement
    key: walls
  - type: StructureAligner
  - type: StructureAlignerPylon

- type: entity
  parent: StructureHealthDoorWeak
  id: BaseSecretDoorAssembly
  name: 秘密门组件 | secret door assembly
  description: 它会打开，会关闭，还可能把你压扁。 | It opens, it closes, and maybe crushes you.
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Structures/Doors/Misc/secret-door.rsi
    state: assembly
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 110
        mask:
        - FullTileMask
        layer:
        - HumanoidBlockLayer
  - type: Anchorable
    delay: 2
  - type: Pullable
  - type: Transform
    anchored: true
    noRot: false
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Construction
    graph: SecretDoor
    node: assembly
  placement:
    mode: SnapgridCenter

- type: entity
  id: SolidSecretDoor
  name: 实体墙 | solid wall
  parent: BaseSecretDoor
  components:
  - type: Construction
    graph: SecretDoor
    node: solidSecretDoor
    containers:
    - battery-container
