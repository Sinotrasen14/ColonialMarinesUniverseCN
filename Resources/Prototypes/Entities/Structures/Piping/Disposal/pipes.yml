  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.25"
        mask:
        - SubfloorMask
  - type: Construction
    graph: DisposalPipe
    node: yJunction

- type: entity
  id: DisposalXJunction
  parent: DisposalPipeBase
  name: 处置交叉路口 | disposal x-junction
  description: 一个四向交叉路口。箭头指示物品出口的位置。 | A four-way junction. The arrow indicates where items exit.
  components:
  - type: Sprite
    layers:
    - map: ["pipe"]
      state: conpipe-x
    visible: true
  - type: DisposalTube
    exits:
    - South
    - East
    - North
    - West
  - type: GenericVisualizer
    visuals:
      enum.AnchorVisuals.Anchored:
        pipe:
          false: {state: conpipe-x}
          true: {state: pipe-x}
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - SubfloorMask
  - type: Construction
    graph: DisposalPipe
    node: xJunction

- type: entity
  id: DisposalBend
  parent: DisposalPipeBase
  name: 处理弯管 | disposal bend
  description: 一根弯曲成90度角的管子。 | A tube bent at a 90 degree angle.
  components:
  - type: Sprite
    layers:
    - map: ["pipe"]
      state: conpipe-c
  - type: DisposalTube
    exits:
    - South
    - West
  - type: GenericVisualizer
    visuals:
      enum.AnchorVisuals.Anchored:
        pipe:
          false: {state: conpipe-c}
          true: {state: pipe-c}
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.25,0.25"
        mask:
        - SubfloorMask
  - type: Construction
    graph: DisposalPipe
