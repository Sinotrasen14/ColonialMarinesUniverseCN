# Base

- type: entity
  abstract: true
  parent: StructureHealthContainerWeak
  id: DisposalPipeBase
  placement:
    mode: SnapgridCenter
    snap:
    - Disposal
  components:
  - type: Sprite
    drawdepth: ThickPipe
    sprite: Structures/Piping/disposal.rsi
    visible: false
  - type: Appearance
  - type: Visibility
    layer: 1
  - type: SubFloorHide
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.5,0.25,0.5"
        mask:
        - SubfloorMask
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: broken
  - type: Rotatable
  - type: Pullable
  - type: CollideOnAnchor
  - type: DisposalTube
  - type: StaticPrice
    price: 30
  - type: RMCMesonsNonviewable

- type: entity
  id: DisposalHolder
  categories: [HideSpawnMenu]
  name: 废弃物容器 | disposal holder
  components:
  - type: DisposalHolder
    traversalSpeed: 10
    exitDistanceMultiplier: 1.5
    exitSpeedMultiplier: 1
    container:
      occludes: true
      showEnts: false
      ents: []
  - type: ContainerContainer
    containers:
      DisposalHolderComponent: !type:Container
  - type: Physics
    bodyType: Kinematic
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.25

# Pipes

- type: entity
  id: DisposalPipeBroken
  parent: DisposalPipeBase
  name: 破损的处置管 | broken disposal pipe
  description: 一根BBP（大型破损管道）。 | A BBP (big broken pipe).
  components:
  - type: Sprite
    layers:
    - map: ["pipe"]
      state: pipe-b
  - type: Construction
    graph: DisposalPipe
    node: broken

- type: entity
  id: DisposalPipe
  parent: DisposalPipeBase
  name: 废弃管道段 | disposal pipe segment
  description: 用于建造废弃处理系统的巨大管道段。 | A huge pipe segment used for constructing disposal systems.
  components:
  - type: Sprite
    layers:
    - map: ["pipe"]
      state: conpipe-s
  - type: DisposalTube
    exits:
    - South
    - North
  - type: GenericVisualizer
    visuals:
      enum.AnchorVisuals.Anchored:
        pipe:
          false: {state: conpipe-s}
          true: {state: pipe-s}
  - type: Construction
    graph: DisposalPipe
    node: pipe

- type: entity
  id: DisposalTagger
  parent: DisposalPipeBase
  name: 处置管道标记器 | disposal pipe tagger
  description: 一种用于标记实体以便进行路由的管道。 | A pipe that tags entities for routing.
  components:
  - type: Sprite
    layers:
    - map: ["pipe"]
      state: conpipe-tagger
  - type: DisposalTube
    exits:
    - South
    - North
  - type: DisposalTagger
  - type: GenericVisualizer
    visuals:
      enum.AnchorVisuals.Anchored:
        pipe:
          false: {state: conpipe-tagger}
          true: {state: pipe-tagger}
  - type: ActivatableUI
    key: enum.DisposalTaggerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DisposalTaggerUiKey.Key:
        type: DisposalTaggerBoundUserInterface
  - type: Construction
    graph: DisposalPipe
    node: tagger

- type: entity
  id: DisposalSignaller
  parent: DisposalPipeBase
  name: 处置信号器 | disposal signaller
  description: 一个管道，当物品通过时会发出信号。 | A pipe that emits a signal when in item goes through it.
  components:
  - type: Sprite
    layers:
    - map: ["pipe"]
      state: conpipe-signaller
  - type: DisposalTube
    exits:
    - South
    - North
  - type: DisposalSignaller
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: DeviceLinkSource
    ports:
    - ItemDetected
  - type: WirelessNetworkConnection
    range: 200
  - type: GenericVisualizer
    visuals:
      enum.AnchorVisuals.Anchored:
        pipe:
          false: {state: conpipe-signaller}
          true: {state: pipe-signaller}
  - type: Construction
    graph: DisposalPipe
    node: pipe

- type: entity
  id: DisposalTrunk
  parent: DisposalPipeBase
  name: 排污干管 | disposal trunk
  description: 用作排污系统入口的干管。 | A pipe trunk used as an entry point for disposal systems.
  components:
  - type: Sprite
    layers:
    - map: ["pipe"]
      state: conpipe-t
  - type: DisposalTube
  - type: DisposalEntry
  - type: GenericVisualizer
    visuals:
      enum.AnchorVisuals.Anchored:
        pipe:
          false: {state: conpipe-t}
          true: {state: pipe-t}
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.5,0.25,0.4"
        mask:
        - SubfloorMask
  - type: Construction
    graph: DisposalPipe
    node: trunk

- type: entity
  id: DisposalRouter
  parent: DisposalPipeBase
  name: 处置路由器 | disposal router
  description: 一个三路路由器。具有匹配标签的实体会通过可配置的过滤器被路由到对应的一侧。 | A three-way router. Entities with matching tags get routed to the side via configurable filters.
  components:
  - type: Sprite
    layers:
    - map: ["pipe"]
      state: conpipe-j1s
  - type: DisposalTube
    exits:
    - West
    - South
    - North
  - type: DisposalRouter
  - type: GenericVisualizer
    visuals:
      enum.AnchorVisuals.Anchored:
        pipe:
          false: {state: conpipe-j1s}
          true: {state: pipe-j1s}
  - type: Flippable
    mirrorEntity: DisposalRouterFlipped
  - type: ActivatableUI
    key: enum.DisposalRouterUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DisposalRouterUiKey.Key:
        type: DisposalRouterBoundUserInterface
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.25,0.5"
        mask:
        - SubfloorMask
  - type: Construction
    graph: DisposalPipe
    node: router

- type: entity
  id: DisposalRouterFlipped
  description: 一个三向路由器。具有匹配标签的实体会被路由到对应的一侧。 | A three-way router. Entities with matching tags get routed to the side.
  parent: DisposalRouter
  suffix: flipped
  components:
  - type: Sprite
    layers:
    - map: ["pipe"]
      state: conpipe-j2s
  - type: DisposalTube
    exits:
    - East
    - South
    - North
  - type: GenericVisualizer
    visuals:
      enum.AnchorVisuals.Anchored:
        pipe:
          false: {state: conpipe-j2s}
          true: {state: pipe-j2s}
  - type: Flippable
    mirrorEntity: DisposalRouter
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.5,0.5,0.5"
        mask:
        - SubfloorMask
  - type: Construction
    node: routerflipped

- type: entity
  id: DisposalJunction
  parent: DisposalPipeBase
  name: 处置交汇处 | disposal junction
  description: 一个三向交汇处。箭头指示物品的出口位置。 | A three-way junction. The arrow indicates where items exit.
  components:
  - type: Sprite
    layers:
    - map: ["pipe"]
      state: conpipe-j1
    visible: true
  - type: DisposalTube
    exits:
    - South
    - West
    - North
  - type: GenericVisualizer
    visuals:
      enum.AnchorVisuals.Anchored:
        pipe:
          false: {state: conpipe-j1}
          true: {state: pipe-j1}
  - type: Flippable
    mirrorEntity: DisposalJunctionFlipped
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.25,0.5"
        mask:
        - SubfloorMask
  - type: Construction
    graph: DisposalPipe
    node: junction

- type: entity
  id: DisposalJunctionFlipped
  description: 三岔路口。箭头指示物品出口位置。 | A three-way junction. The arrow indicates where items exit.
  parent: DisposalJunction
  suffix: flipped
  components:
  - type: Sprite
    layers:
    - map: ["pipe"]
      state: conpipe-j2
  - type: DisposalTube
    exits:
    - South
    - East
    - North
  - type: GenericVisualizer
    visuals:
      enum.AnchorVisuals.Anchored:
        pipe:
          false: {state: conpipe-j2}
          true: {state: pipe-j2}
  - type: Flippable
    mirrorEntity: DisposalJunction
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.5,0.5,0.5"
        mask:
        - SubfloorMask
  - type: Construction
    graph: DisposalPipe
    node: junctionflipped

- type: entity
  id: DisposalYJunction
  parent: DisposalPipeBase
  name: 处置Y形交叉口 | disposal y-junction
  description: 带有另一个出口点的三向交叉口。 | A three-way junction with another exit point.
  components:
  - type: Sprite
    layers:
    - map: ["pipe"]
      state: conpipe-y
  - type: DisposalTube
    exits:
    - South
    - West
    - East
  - type: GenericVisualizer
    visuals:
      enum.AnchorVisuals.Anchored:
