- type: entity
  parent: GasPipeBase
  abstract: true
  id: GasTrinaryBase
  placement:
    mode: SnapgridCenter
  components:
  - type: AtmosDevice
  - type: Tag
    tags:
    - Unstackable
  - type: SubFloorHide
    blockInteractions: false
    blockAmbience: false
  - type: NodeContainer
    nodes:
      inlet: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: North
      filter: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: West
      outlet: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South

- type: entity
  parent: GasTrinaryBase
  id: !type:CreateVariants
    values: [GasFilter, GasFilterAlt1, GasFilterAlt2]
  name: 气体过滤器 | gas filter
  description: 对过滤气体非常有用。 | Very useful for filtering gases.
  categories: !type:CreateVariants
    sequences: [[], [HideSpawnMenu], [HideSpawnMenu]]
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: SubFloorHide
    visibleLayers:
    - enum.SubfloorLayers.FirstLayer
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/gasfilter.rsi
    layers:
    - sprite: !type:CreateVariants
        values: [Structures/Piping/Atmospherics/pipe.rsi, Structures/Piping/Atmospherics/pipe_alt1.rsi, Structures/Piping/Atmospherics/pipe_alt2.rsi]
      state: pipeTrinaryConnectors
      map: ["enum.PipeVisualLayers.Pipe"]
    - state: gasFilter
      map: ["enum.SubfloorLayers.FirstLayer", "enabled"]
  - type: AtmosPipeLayers
    pipeLayer: !type:CreateVariants
      values: [0, 1, 2]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FilterVisuals.Enabled:
        enabled:
          true: {state: gasFilterOn}
          false: {state: gasFilter}
  - type: PipeColorVisuals
  - type: ActivatableUI
    key: enum.GasFilterUiKey.Key
  - type: ActivatableUIRequiresAnchor
  - type: UserInterface
    interfaces:
      enum.GasFilterUiKey.Key:
        type: GasFilterBoundUserInterface
  - type: GasFilter
    enabled: false
    transferRate: 1000
    maxTransferRate: 1000
  - type: Flippable
    mirrorEntity: GasFilterFlipped
  - type: Construction
    graph: !type:CreateVariants
      values: [GasTrinary, GasTrinaryAlt1, GasTrinaryAlt2]
    node: filter
  - type: AmbientSound
    enabled: false
    volume: -9
    range: 5
    sound:
      path: /Audio/Ambience/Objects/gas_hiss.ogg
  - type: AtmosMonitoringConsoleDevice
    navMapBlip: GasFlowRegulator
  - type: GuideHelp
    guides:
    - MixingAndFiltering

- type: entity
  parent: GasFilter
  id: !type:CreateVariants
    values: [GasFilterFlipped, GasFilterFlippedAlt1, GasFilterFlippedAlt2]
  name: 气体过滤器 | gas filter
  suffix: Flipped
  categories: !type:CreateVariants
    sequences: [[], [HideSpawnMenu], [HideSpawnMenu]]
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: SubFloorHide
    visibleLayers:
    - enum.SubfloorLayers.FirstLayer
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/gasfilter.rsi
    layers:
    - sprite: !type:CreateVariants
        values: [Structures/Piping/Atmospherics/pipe.rsi, Structures/Piping/Atmospherics/pipe_alt1.rsi, Structures/Piping/Atmospherics/pipe_alt2.rsi]
      state: pipeTrinaryConnectors
      map: ["enum.PipeVisualLayers.Pipe"]
    - state: gasFilterF
      map: ["enum.SubfloorLayers.FirstLayer", "enabled"]
  - type: AtmosPipeLayers
    pipeLayer: !type:CreateVariants
      values: [0, 1, 2]
  - type: Flippable
    mirrorEntity: GasFilter
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FilterVisuals.Enabled:
        enabled:
          true: {state: gasFilterFOn}
          false: {state: gasFilterF}
  - type: Construction
    node: filterflipped
  - type: PipeColorVisuals
  - type: NodeContainer
    nodes:
      inlet: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
      filter: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: West
      outlet: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: North

