- type: entity
  parent: GasPipeBase
  id: !type:CreateVariants
    values: [PressureControlledValve, PressureControlledValveAlt1, PressureControlledValveAlt2]
  name: 气动阀 | pneumatic valve
  description: 由压力控制的双向阀。当输出管压力比控制管压力低101.325 kPa时开启。 | A bidirectional valve controlled by pressure. Opens if the output pipe is lower than the pressure of the control pipe by 101.325 kPa.
  categories: !type:CreateVariants
    sequences: [[], [HideSpawnMenu], [HideSpawnMenu]]
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: AtmosDevice
  - type: Tag
    tags:
    - Unstackable
  - type: SubFloorHide
    blockInteractions: false
    blockAmbience: false
    visibleLayers:
    - enum.SubfloorLayers.FirstLayer
  - type: NodeContainer
    nodes:
      inlet: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: North
      control: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: West
      outlet: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/pneumaticvalve.rsi
    layers:
    - sprite: !type:CreateVariants
        values: [Structures/Piping/Atmospherics/pipe.rsi, Structures/Piping/Atmospherics/pipe_alt1.rsi, Structures/Piping/Atmospherics/pipe_alt2.rsi]
      state: pipeTrinaryConnectors
      map: ["enum.PipeVisualLayers.Pipe"]
    - state: off
      map: ["enum.SubfloorLayers.FirstLayer", "enabled"]
  - type: AtmosPipeLayers
    pipeLayer: !type:CreateVariants
      values: [0, 1, 2]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FilterVisuals.Enabled:
        enabled:
          true: {state: on}
          false: {state: off}
  - type: PipeColorVisuals
  - type: PressureControlledValve
  - type: AmbientSound
    enabled: false
    volume: -9
    range: 5
    sound:
      path: /Audio/Ambience/Objects/gas_hiss.ogg
  - type: Construction
    graph: !type:CreateVariants
      values: [GasTrinary, GasTrinaryAlt1, GasTrinaryAlt2]
    node: pneumaticvalve
  - type: AtmosMonitoringConsoleDevice
    navMapBlip: GasFlowRegulator
  - type: GuideHelp
    guides:
    - PneumaticValve
    - Pumps
    - Valves
