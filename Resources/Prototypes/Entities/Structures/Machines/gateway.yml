- type: entity
  parent: BaseStructure
  id: Gateway
  name: 星门 | gateway
  description: 一座由未知之手建造的神秘星门，它允许超光速旅行至遥远的地点。 | A mysterious gateway built by unknown hands, it allows for faster than light travel to far-flung locations.
  components:
  - type: Sprite
    sprite: Structures/Machines/gateway.rsi
    noRot: true
    layers:
    - state: frame
    - state: on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
    - state: portal
      shader: unshaded
      map: ["portal"]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          true: {visible: true}
          false: {visible: false}
      enum.LinkedEntityVisuals.HasAnyLinks:
        portal:
          true: {visible: true}
          false: {visible: false}
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      portalFixture:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        hard: false
  - type: Appearance
  - type: StationTeleporter
    portalLayerMap: "portal"
    autoLinkKey: Nanotrasen
  - type: Portal
    randomTeleport: false
    canTeleportToOtherMaps: true
  - type: PointLight
    enabled: true
    radius: 3
    energy: 1
  - type: AmbientSound
    enabled: true
    sound:
      path: /Audio/Ambience/ambi_gateway.ogg
    range: 5
    volume: 8
