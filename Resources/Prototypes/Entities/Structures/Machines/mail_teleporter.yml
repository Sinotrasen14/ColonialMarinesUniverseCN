- type: entity
  id: CargoMailTeleporter
  parent: [BaseMachinePowered, ConstructibleMachine, StructureHealthMachineStrong]
  name: 邮件传送器 | mail teleporter
  description: 定期传送邮件到空间站各处进行投递。 | Periodically teleports in mail to deliver across the station.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Structures/mailbox.rsi
    snapCardinals: true
    layers:
    - state: icon
    - state: contents
      map: ["enum.DeliverySpawnerVisualLayers.Contents"]
      visible: false
    - state: unlit
      shader: unshaded
      visible: false
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Damageable
    damageModifierSet: PlasteelMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 275
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DeliverySpawnerVisuals.Contents:
        enum.DeliverySpawnerVisualLayers.Contents:
          true: {visible: true}
          false: {visible: false}
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          true: {visible: true}
          false: {visible: false}
  - type: Machine
    board: MailTeleporterMachineCircuitboard
  - type: PowerSwitch
  - type: InteractionPopup
    interactSuccessString: petting-success-mail-teleporter
    interactFailureString: petting-failure-mail-teleporter
  - type: DeliverySpawner
    table: !type:NestedSelector
      tableId: RandomDeliveryBasic
