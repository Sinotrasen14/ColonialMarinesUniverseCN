- type: entity
  id: StasisBed
  name: 停滞床 | stasis bed
  parent: [BaseMachinePowered, ConstructibleMachine, BaseConstructibleMachineDestructible]
  description: 一张能大幅减缓病人新陈代谢并防止身体腐烂的床，从而为实施适当的稳定治疗争取更多时间。 | A bed that massively slows down the patient's metabolism and prevents bodily decay, allowing more time to administer a proper treatment for stabilization.
  components:
  - type: StasisBed
  - type: AntiRotOnBuckle
  - type: HealOnBuckle
    damage:
      types:
        Poison: -0.001
        Blunt: -0.001
  - type: Sprite
    sprite: Structures/Machines/stasis_bed.rsi
    noRot: true
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
      map: ["unlit"]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        unlit:
          true: {visible: true}
          false: {visible: false}
  - type: Appearance
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: ExtensionCableReceiver
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 175
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Strap
    position: Down
    rotation: -90
  - type: Machine
    board: StasisBedMachineCircuitboard
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.05"
        density: 190
        mask:
        - LowImpassable
  - type: GuideHelp
    guides:
    - MedicalDoctor
  - type: PowerSwitch
  - type: AmbientMusicMarkerMedical
