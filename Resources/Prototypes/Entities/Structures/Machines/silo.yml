- type: entity
  id: MachineMaterialSilo
  parent: [BaseMachinePowered, ConstructibleMachine, StructureHealthMachineStrong]
  name: 材料仓 | material silo
  description: 一种先进的机器，能够利用蓝空间技术将材料传输到附近的机器。 | An advanced machine, capable of using bluespace technology to transmit materials to nearby machines.
  components:
  - type: Sprite
    sprite: Structures/Machines/silo.rsi
    snapCardinals: true
    layers:
    - state: silo
      map: ["base"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        base:
          true: {state: silo_active}
          false: {state: silo}
  - type: OreSilo
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: ActivatableUI
    key: enum.OreSiloUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.OreSiloUiKey.Key:
        type: OreSiloBoundUserInterface
  - type: Machine
    board: MaterialSiloMachineCircuitboard
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 275
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
  - type: WiresVisuals
  - type: WiresPanel
  - type: StaticPrice
    price: 1500
