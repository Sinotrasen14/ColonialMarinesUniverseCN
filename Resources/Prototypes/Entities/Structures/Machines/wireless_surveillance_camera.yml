- type: entity
  abstract: true
  parent: [BaseStructureDynamic, SmallConstructibleMachine, BaseSmallConstructibleMachineDestructible]
  id: SurveillanceWirelessCameraBase
  name: 无线摄像头 | wireless camera
  description: 一个摄像头。它在看着你。算是吧。 | A camera. It's watching you. Kinda.
  placement:
    mode: SnapgridCenter
  components:
  - type: InteractionOutline
  - type: Eye
  - type: WirelessNetworkConnection
    range: 200
  - type: Damageable
    damageModifierSet: GlassMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.45
        density: 80
        mask:
        - MachineMask
        layer:
        - BulletImpassable
  - type: SurveillanceCameraMicrophone
    blacklist:
      components:
      - SurveillanceCamera
      - SurveillanceCameraMonitor
      - RadioSpeaker
  - type: ActiveListener
    range: 10
  - type: UserInterface
    interfaces:
      enum.SurveillanceCameraSetupUiKey.Camera:
        type: SurveillanceCameraSetupBoundUi

- type: entity
  abstract: true
  id: SurveillanceWirelessCameraAnchoredBase
  parent: SurveillanceWirelessCameraBase
  suffix: Anchored
  components:
  - type: Machine
    board: SurveillanceWirelessCameraAnchoredCircuitboard
  - type: Anchorable
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    noRot: true
    sprite: Structures/monitors.rsi
    layers:
    - map: ["enum.SurveillanceCameraVisualsKey.Key"]
      state: television

- type: entity
  abstract: true
  id: SurveillanceWirelessCameraMovableBase
  parent: SurveillanceWirelessCameraBase
  suffix: Movable
  components:
  - type: Machine
    board: SurveillanceWirelessCameraMovableCircuitboard
  - type: Transform
  - type: Sprite
    noRot: true
    sprite: Structures/monitors.rsi
    layers:
    - map: ["enum.SurveillanceCameraVisualsKey.Key"]
      state: mobilevision

- type: entity
  parent: SurveillanceWirelessCameraAnchoredBase
  suffix: Constructed, Anchored
  id: SurveillanceWirelessCameraAnchoredConstructed
  components:
  - type: CameraNetworkMember
    networks: []
    sourceKinds: Standard
  - type: SurveillanceCamera
    setupAvailableNetworks:
    - SurveillanceCameraEntertainment

- type: entity
  parent: SurveillanceWirelessCameraMovableBase
  suffix: Constructed, Movable
  id: SurveillanceWirelessCameraMovableConstructed
  components:
  - type: CameraNetworkMember
    networks: []
    sourceKinds: Standard
  - type: SurveillanceCamera
    setupAvailableNetworks:
    - SurveillanceCameraEntertainment

- type: entity
  parent: SurveillanceWirelessCameraAnchoredBase
  suffix: Entertainment, Anchored
  id: SurveillanceWirelessCameraAnchoredEntertainment
  components:
  - type: CameraNetworkMember
    networks: [SurveillanceCameraEntertainment]
    sourceKinds: Standard
  - type: SurveillanceCamera
    networkSet: true

- type: entity
  parent: SurveillanceWirelessCameraMovableBase
  suffix: Entertainment, Movable
  id: SurveillanceWirelessCameraMovableEntertainment
  components:
  - type: CameraNetworkMember
    networks: [SurveillanceCameraEntertainment]
    sourceKinds: Standard
  - type: SurveillanceCamera
    networkSet: true
