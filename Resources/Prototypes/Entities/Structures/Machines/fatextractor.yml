- type: entity
  id: FatExtractor
  parent: [BaseMachinePowered, ConstructibleMachine, BaseConstructibleMachineDestructible]
  name: 脂质提取器 | lipid extractor
  description: 安全有效地从对象中提取多余脂肪。 | Safely and efficiently extracts excess fat from a subject.
  components:
  - type: FatExtractor
    minHungerThreshold: Peckish
    processSound:
      path: /Audio/Machines/microwave_loop.ogg
      params:
        loop: true
        maxDistance: 5
  - type: Sprite
    sprite: Structures/Machines/fat_sucker.rsi
    snapCardinals: true
    layers:
    - state: fat
      map: ["enum.StorageVisualLayers.Base"]
    - state: fat_door_off
      map: ["enum.StorageVisualLayers.Door"]
    - state: fat_red
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: fat_green
      shader: unshaded
      visible: false
      map: ["enum.FatExtractorVisualLayers.Light"]
    - state: fat_panel
      visible: false
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: fat_stack #cash cash cash
      visible: false
      map: ["enum.FatExtractorVisualLayers.Stack"]
    - state: fat_smoke
      visible: false
      map: ["enum.FatExtractorVisualLayers.Smoke"]
  - type: Lock
    breakOnAccessBreaker: false
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        enum.StorageVisualLayers.Door:
          true: {visible: false}
          false: {visible: true}
      enum.FatExtractorVisuals.Processing:
        enum.StorageVisualLayers.Door:
          true: {state: fat_door_on}
          false: {state: fat_door_off}
        enum.FatExtractorVisualLayers.Smoke:
          true: {visible: true}
          false: {visible: false}
        enum.FatExtractorVisualLayers.Stack:
          true: {visible: true}
          false: {visible: false}
        enum.FatExtractorVisualLayers.Light:
          true: {visible: true}
          false: {visible: false}
      enum.PowerDeviceVisuals.Powered:
        enum.FatExtractorVisualLayers.Light:
          false: {visible: false}
        enum.PowerDeviceVisualLayers.Powered:
          true: {visible: true}
          false: {visible: false}
      enum.StorageVisuals.HasContents:
        enum.PowerDeviceVisualLayers.Powered:
          true: {state: fat_yellow}
          false: {state: fat_red}
  - type: Construction
    containers:
    - machine_board
    - machine_parts
    - entity_storage
  - type: EmptyOnMachineDeconstruct
    containers:
    - entity_storage
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 175
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Machine
    board: FatExtractorMachineCircuitboard
  - type: WiresPanel
  - type: WiresVisuals
  - type: Speech
    speechVerb: Robotic
  - type: Appearance
  - type: Vocalizer
    hideChat: true
  - type: VocalizerRequiresPower
  - type: DatasetVocalizer
    dataset: FatExtractorFacts
  - type: StaticPrice
    price: 1000
  - type: ResistLocker
  - type: EntityStorage
    capacity: 1
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      entity_storage: !type:Container
