- type: entity
  parent: [BaseStructure, StructureHealthFurniture]
  id: KitchenSpike
  name: 肉叉 | meat spike
  description: 用来从动物身上收集肉的尖刺。 | A spike for collecting meat from animals.
  components:
  - type: InteractionOutline
  - type: Sprite
    # temp to make clickmask work
    sprite: Structures/meat_spike.rsi
    state: spike
    layers:
    - state: spike
      map: ["base"]
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 3
            max: 6
  - type: Transform
    noRot: true
  - type: KitchenSpike
  - type: Anchorable
  - type: Pullable
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.KitchenSpikeVisuals.Status:
        base:
          Empty: {state: spike}
          Bloody: {state: spikebloody}   # TODO: Add sprites for different species.
  - type: Construction
    graph: MeatSpike
    node: MeatSpike
  - type: GuideHelp
    guides:
    - Chef
    - FoodRecipes
  - type: ContainerContainer
    containers:
      body: !type:ContainerSlot
