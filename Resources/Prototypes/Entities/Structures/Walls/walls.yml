- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseStructureWall
  name: 基础墙 | basewall
  description: 把空气留在里面，把灰潮挡在外面。 | Keeps the air in and the greytide out.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection: MetalBulletImpact
    soundTypes:
      Heat:
        collection: MetalLaserImpact
  - type: Wall
  - type: ZLevelWallSupport
  - type: IsRoof
  - type: Sprite
    drawdepth: Walls
  - type: Icon
    state: full
  - type: PlacementReplacement
    key: walls
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: Airtight
  - type: StaticPrice
    price: 75
  - type: RadiationBlocker
    resistance: 2
  - type: BlockWeather
  - type: SunShadowCast

- type: entity
  abstract: true
  parent: BaseStructureWall
  id: BaseWall
  components:
  - type: Occluder # Breaks on diagonal walls
  - type: PlacementReplacement
    key: walls
  - type: StructureAlignerPylon
    pylons:
    - Door
    - Firelock

- type: entity
  abstract: true
  parent: BaseStructureWall
  id: WallDiagonalBase
  suffix: Diagonal
  components:
  - type: Tag
    tags:
    - Diagonal
  - type: IconSmooth
    mode: Diagonal
    key: walls
    base: state
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: Occluder
    polygon:
    - "-0.5,-0.5"
    - "0.5,0.5"
    - "0.5,-0.5"
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - "-0.5,-0.5"
          - "0.5,0.5"
          - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer

- type: entity
  parent: [BaseWall, StructureHealthWallWeak]
  id: WallBrick
  name: 砖墙 | brick wall
  components:
  - type: Sprite
    sprite: Structures/Walls/brick.rsi
  - type: Icon
    sprite: Structures/Walls/brick.rsi
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Damageable
    damageModifierSet: RockMod
  - type: Destructible
    thresholds:
    - trigger: &DamageWallWeak !type:DamageTrigger
        damage: 150
      behaviors:
      - &SoundBreakStone !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
      - &SpawnGirder !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          Girder:
            min: 1
            max: 1
  - type: IconSmooth
    key: walls
    base: brick

- type: entity
  parent: [BaseWall, StructureHealthWallWeak]
  id: WallBrass
  name: 黄铜墙 | brass wall
  components:
  - type: Sprite
    sprite: Structures/Walls/brass.rsi
  - type: Icon
    sprite: Structures/Walls/brass.rsi
  - type: Construction
    graph: Girder
    node: brassWall
  - type: Damageable
    damageModifierSet: BrassMod
  - type: Destructible
    thresholds:
    - trigger: *DamageWallWeak
      behaviors:
      - &SoundMetalSlam !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
          params:
            volume: -4
      - &ChangeNodeGirder !type:ChangeConstructionNodeBehavior
        node: girder
  - type: IconSmooth
    key: walls
    base: brass

- type: entity
  parent: [BaseWall, StructureHealthWallWeak]
  id: WallMeat
  name: 肉墙 | meat wall
  description: 黏糊糊的。 | Sticky.
  components:
  - type: Tag
    tags:
    - Structure
  - type: Sprite
    sprite: Structures/Walls/meat.rsi
  - type: Icon
    sprite: Structures/Walls/meat.rsi
  - type: Construction
    graph: Girder
    node: meatWall
  - type: Injurable
    damageContainer: StructuralBiological
  - type: Destructible
    thresholds:
    - trigger: *DamageWallWeak
      behaviors:
      - *ChangeNodeGirder
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialSheetMeat1: &BaseWallSpawn
            min: 0
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: gib
  - type: IconSmooth
    key: meatwalls
    base: meat

