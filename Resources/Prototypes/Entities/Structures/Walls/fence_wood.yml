- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseFenceWood
  name: 木栅栏 | wooden fence
  description: 木制栅栏。我希望它后面是祖母的花园。 | Wooden piece of fencing. I hope there is babushka's garden behind it.
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        path: "/Audio/Weapons/boxingpunch1.ogg"
  - type: Tag
    tags:
    - Wooden
  - type: Sprite
    sprite: Structures/Walls/wooden_fence.rsi
    drawdepth: WallTops
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: RCDDeconstructable
    cost: 2
    delay: 2
    fx: EffectRCDDeconstruct2
  - type: Climbable
    delay: 5.0
  - type: Appearance

- type: entity
  abstract: true
  parent: [BaseFenceWood, StructureHealthBarrier]
  id: BaseFenceWoodHigh
  components:
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 1
            max: 2

- type: entity
  abstract: true
  parent: [BaseFenceWood, StructureHealthBarrierWeak]
  id: BaseFenceWoodSmall
  name: 小木栅栏 | small wooden fence
  description: 小木栅栏的木制部件。私人领地围栏的最佳防护！ | Wooden piece of small fence. The best protection for the fencing of a private territory!
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 0
            max: 1
  - type: Climbable
    delay: 2.5
  - type: RequireProjectileTarget

#region High
- type: entity
  parent: BaseFenceWoodHigh
  id: FenceWoodHighStraight
  suffix: Straight
  components:
  - type: Icon
    sprite: Structures/Walls/wooden_fence.rsi
    state: straight
  - type: Sprite
    layers:
    - state: straight
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.10,-0.5,0.10,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - Opaque
        - MidImpassable
        - LowImpassable
        - BulletImpassable
  - type: Construction
    graph: FenceWood
    node: straight

