- type: entity
  abstract: true
  parent: [BaseMachinePowered, ConstructibleMachine]
  id: BaseRecharger
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    snapCardinals: true
  - type: Appearance
  - type: Charger
    slotId: charger_slot
  - type: ApcPowerReceiver
    powerLoad: 1 # same as draw given in ChargerComponent.PassiveDraw; increased when it is actually charging something
  - type: Anchorable
    delay: 1
  - type: StaticPrice
    price: 75

- type: entity
  abstract: true
  parent: [BaseRecharger, BaseSmallConstructibleMachineDestructible]
  id: BaseItemRecharger
  components:
  - type: Sprite
    drawdepth: SmallObjects
    layers:
    - map: ["enum.PowerChargerVisualLayers.Base"]
      state: "empty"
    - map: ["enum.PowerChargerVisualLayers.Light"]
      state: "light-off"
      shader: "unshaded"
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.10,-0.10,0.10,0.10"
        density: 500
        mask:
        - TabletopMachineMask
        layer:
        - BulletImpassable
  - type: PowerChargerVisuals
  - type: ContainerContainer
    containers:
      charger_slot: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: RequireProjectileTarget
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:EmptyContainersBehaviour
        containers:
        - charger_slot
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: entity
  parent: BaseItemRecharger
  id: PowerCellRecharger
  name: 电池充电器 | cell recharger
  description: 一个较旧型号的充电器，可以为能量电池充电。 | An older model recharger that can recharge power cells.
  components:
  - type: Sprite
    sprite: Structures/Power/cell_recharger.rsi
    layers:
    - map: ["enum.PowerChargerVisualLayers.Base"]
      state: "empty"
    - map: ["enum.PowerChargerVisualLayers.Light"]
      state: "light-off"
      shader: "unshaded"
    - state: open
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
  - type: Machine
    board: CellRechargerCircuitboard
  - type: WiresPanel
  - type: WiresVisuals
  - type: PowerCellSlot
    cellSlotId: charger_slot
    # fitsInCharger is true i dont think this will ever affect anything negatively but it lets it function
  - type: ItemSlots
    slots:
      charger_slot:
        ejectOnInteract: true
        name: power-cell-slot-component-slot-name-default
        whitelist:
          tags:
          - PowerCell
          - PowerCellSmall
        blacklist:
          tags:
          - PotatoBattery
  - type: ApcPowerReceiver
    needsPower: false # TODO RMC14
    powerLoad: 1
  - type: Item
    size: Ginormous
  - type: MultiHandedItem

- type: entity
  parent: [BaseItemRecharger, ConstructibleMachine]
  id: PowerCageRecharger
  name: 笼式充电器 | cage recharger
  description: 一种专用机器，用于为舰载武器所使用的重型笼式电池充电。 | A specialized machine made for recharging the heavy cage batteries used by ship-mounted weapons.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.35,0.25,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: PlasteelMod
  - type: LitOnPowered
  - type: PointLight
    radius: 1.5
    color: "#03fc4e"
    energy: 0.7
  - type: Charger
    chargeRate: 50
  - type: Sprite
    sprite: Structures/Power/cage_recharger.rsi
  - type: PowerCellSlot
    cellSlotId: charger_slot
  - type: ItemSlots
    slots:
      charger_slot:
        ejectOnInteract: true
        name: 力量笼 | Power cage
        whitelist:
          tags:
          - PowerCage
  - type: Machine
    board: PowerCageRechargerCircuitboard
  - type: StaticPrice
    price: 500

- type: entity
  parent: BaseItemRecharger
  id: WeaponCapacitorRecharger
  name: 充电器 | recharger
  description: 一个现代充电站，可容纳动力电池和小型电子设备。 | A modern recharging station that can fit both power cells and small electronic devices.
  components:
  - type: Sprite
    sprite: Structures/Power/recharger.rsi
  - type: Machine
    board: WeaponCapacitorRechargerCircuitboard
  - type: ItemSlots
    slots:
      charger_slot:
        ejectOnInteract: true
        whitelist:
          tags:
          - Stunbaton
          components:
          - BatteryAmmoProvider
          - PowerCell
        blacklist:
          tags:
          - PotatoBattery
  - type: Item
    size: Ginormous
  - type: MultiHandedItem

- type: entity
  parent: BaseItemRecharger
  id: TurboItemRecharger
  name: 涡轮充电器 | turbo recharger
  description: 超频充电器。不建议在哮喘患者周围使用。 | An overclocked recharger. Not recommended for use around asthmatics.
  components:
  - type: Sprite
    sprite: Structures/Power/turbo_recharger.rsi
  - type: Machine
    board: TurboItemRechargerCircuitboard
  - type: Charger
    chargeRate: 100
  - type: ItemSlots
    slots:
      charger_slot:
        ejectOnInteract: true
        whitelist:
          tags:
          - Stunbaton
          components:
          - BatteryAmmoProvider
          - PowerCell
        blacklist:
          tags:
          - PotatoBattery
  - type: Item
    size: Ginormous
  - type: MultiHandedItem

- type: entity
  parent: [BaseItemRecharger, BaseWallmount]
  id: WallWeaponCapacitorRecharger
  name: 墙壁充电器 | wall recharger
  description: 一个紧凑的壁挂式充电器。它只能为电子设备充电，没有空间放置能量电池。 | A compact wall-mounted recharger. It can only recharge electronic devices and has no space for power cells.
  components:
  - type: Sprite
    sprite: Structures/Power/wall_recharger.rsi
    layers:
    - map: ["enum.PowerChargerVisualLayers.Base"]
      state: "empty"
    - map: ["enum.PowerChargerVisualLayers.Light"]
      state: "light-off"
      shader: "unshaded"
  - type: Charger
    chargeRate: 25
  - type: ItemSlots
    slots:
      charger_slot:
        ejectOnInteract: true
        whitelist:
          tags:
          - Stunbaton
          components:
          - BatteryAmmoProvider
        blacklist:
          tags:
          - PotatoBattery

- type: entity
  parent: [BaseRecharger, BaseConstructibleMachineDestructible]
  id: BorgCharger
  name: 赛博格充电站 | cyborg recharging station
  description: 为各种机器人和赛博格实体提供的固定式充电器。空间出乎意料地宽敞。 | A stationary charger for various robotic and cyborg entities. Surprisingly spacious.
  components:
  - type: Sprite
    sprite: Structures/Power/borg_charger.rsi
    noRot: true
    layers:
    - state: borgcharger-u1
      map: ["base"]
    - state: borgcharger0
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      shader: "unshaded"
    - state: borgcharger1
      map: ["charged"]
      shader: "unshaded"
      visible: false
    - state: borgdecon1
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
  - type: Charger
    chargeRate: 30
    slotId: entity_storage
    whitelist:
      components:
      - BorgChassis
  - type: Construction
    containers:
    - machine_parts
    - machine_board
    - entity_storage
  - type: WiresPanel
  - type: WiresVisuals
  - type: Machine
    board: BorgChargerCircuitboard
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          true: {state: borgcharger-u0}
          false: {state: borgcharger-u1}
        enum.PowerDeviceVisualLayers.Powered:
          true: {state: borgcharger0}
          false: {state: borgcharger2}
        charged:
          true: {visible: false}
          false: {visible: true}
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          true: {visible: true}
          false: {visible: false}
        charged:
          true: {visible: true}
          false: {visible: false}
      enum.CellVisual.Light:
        charged:
          Off: {visible: false}
          Empty: {visible: false}
          Charging:
            visible: true
            state: borgcharger3
          Charged:
            visible: true
            state: borgcharger1
  - type: EntityStorage
    capacity: 1
    whitelist:
      components:
      - BorgChassis
  - type: ContainerContainer
    containers:
      entity_storage: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.48
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 175
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: entity
  parent: BorgCharger
  id: BorgChargerXenoborg
  name: 异星机械体充电站 | xenoborg recharging station
  description: 一座为异星机械体准备的固定式充电站。让人感到幽闭恐惧。 | A stationary charger for xenoborgs. Feels claustrophobic.
  components:
  - type: Sprite
    sprite: Structures/Power/xenoborg_charger.rsi
