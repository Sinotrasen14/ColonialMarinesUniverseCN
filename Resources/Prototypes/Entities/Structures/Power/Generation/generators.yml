# Base Generator

- type: entity
  abstract: true
  parent: [BaseMachine, StructureHealthMachineWeak]
  id: BaseGenerator
  description: 一种高效的热电发电机。 | A high efficiency thermoelectric generator.
  name: 发电机 | generator
  components:
  - type: AmbientSound
    range: 5
    sound:
      path: /Audio/Ambience/Objects/engine_hum.ogg
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.5,0.4,0.3"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Structures/Power/power.rsi
    state: generator
    snapCardinals: true
  - type: NodeContainer
    examinable: true
    nodes:
      output: !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output
    sprite: Structures/Power/power.rsi
    state: generator
  - type: PowerSupplier
    supplyRate: 3000
    supplyRampRate: 500
    supplyRampTolerance: 500
  - type: Anchorable # Reduces anchor time to 1 second
  - type: Damageable
    damageModifierSet: SteelMod
  - type: PacifismDangerousAttack
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ExplodeBehavior
  - type: Explosive
    explosionType: Default
    # Same as AME, but numbers still picked from a hat.
    maxIntensity: 100
    intensitySlope: 2
    totalIntensity: 200
  - type: StaticPrice
    price: 500
  - type: Electrified
    onHandInteract: false
    onInteractUsing: false
    onBump: false
    requirePower: true
    highVoltageNode: output
  - type: GuideHelp
    guides:
    - ShuttleCraft

# Base Wallmount Generator

- type: entity
  abstract: true
  id: BaseGeneratorWallmount
  parent: [BaseGenerator, BaseWallmount]
  name: 壁挂式发电机 | wallmount generator
  description: 一个塞在壁柜里的高效热电发电机。 | A high efficiency thermoelectric generator stuffed in a wall cabinet.
  components:
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -15
    range: 2
    sound:
      path: /Audio/Ambience/Objects/hdd_buzz.ogg
  - type: PointLight
    radius: 1.5
    energy: 3.0
    color: "#3db83b"
    castShadows: false
    netsync: false
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Power/Generation/wallmount_generator.rsi
    layers:
    - state: panel
    - state: on
      shader: unshaded
  - type: NodeContainer
    examinable: true
    nodes:
      output: !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output
    sprite: Structures/Power/Generation/wallmount_generator.rsi
    state: static
  - type: PowerSupplier
    supplyRate: 3000
    supplyRampRate: 500
    supplyRampTolerance: 500
  - type: GuideHelp
    guides:
    - ShuttleCraft

# Construction Frames

- type: entity
  parent: [BaseWallmountMetallic, StructureHealthMachineFlimsy]
  categories: [HideSpawnMenu]
  id: BaseGeneratorWallmountFrame
  name: 壁挂式发电机框架 | wallmount generator frame
  description: 壁挂式发电机的建造框架。 | A construction frame for a wallmount generator.
  components:
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Power/Generation/wallmount_generator.rsi
    layers:
    - state: panel
  - type: Construction
    graph: WallmountGenerator
    node: frame
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

# Generators in use

- type: entity
  parent: BaseGenerator
  id: GeneratorBasic
  suffix: Basic, 3kW
  components:
  - type: PowerSupplier
    supplyRate: 3000

- type: entity
  parent: BaseGenerator
  id: GeneratorBasic15kW
  suffix: Basic, 15kW
  components:
  - type: PowerSupplier
    supplyRate: 15000

- type: entity
  parent: BaseGeneratorWallmount
  id: GeneratorWallmountBasic
  suffix: Basic, 3kW
  components:
  - type: PowerSupplier
    supplyRate: 3000
  - type: Construction
    graph: WallmountGenerator
    node: generator
  - type: StaticPrice
    price: 14
  - type: ContainerFill
    containers:
      board: [WallmountGeneratorElectronics]
  - type: ContainerContainer
    containers:
      board: !type:Container

- type: entity
  parent: BaseGeneratorWallmount
  id: GeneratorWallmountAPU
  name: 航天飞机辅助动力装置 | shuttle APU
  description: 航天飞机辅助动力装置——6千瓦。 | An auxiliary power unit for a shuttle - 6kW.
  suffix: APU, 6kW
  components:
  - type: PowerSupplier
    supplyRate: 6000
  - type: Construction
    graph: WallmountGenerator
    node: APU
  - type: StaticPrice
    price: 38
  - type: ContainerFill
    containers:
      board: [WallmountGeneratorAPUElectronics]
  - type: ContainerContainer
    containers:
      board: !type:Container
  - type: GuideHelp
    guides:
    - ShuttleCraft

- type: entity
  parent: BaseGeneratorWallmount
  id: GeneratorWallmountAPULV
  name: 航天飞机低压辅助动力装置 | shuttle LV APU
  description: 航天飞机先进辅助动力装置。 | An advanced auxiliary power unit for a shuttle.
  components:
  - type: NodeContainer
    examinable: true
    nodes:
      output: !type:CableDeviceNode
        nodeGroupID: Apc
  - type: PowerSupplier
    voltage: Apc
    supplyRate: 20000
    supplyRampRate: 500
    supplyRampTolerance: 500

# RTG - no fuel requirement

- type: entity
  abstract: true
  parent: BaseMachine
  id: BaseRTG
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.5,0.4,0.3"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: PowerSupplier
    supplyRate: 10000 # supposed to be low power at no fuel cost to power derelicts
    supplyRampRate: 500
    supplyRampTolerance: 500
  - type: AmbientSound
    range: 5
    sound:
      path: /Audio/Ambience/Objects/buzzing.ogg
  - type: Sprite
    sprite: Structures/Power/Generation/rtg.rsi
    snapCardinals: true
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output
    sprite: Structures/Power/Generation/rtg.rsi
  - type: NodeContainer
    examinable: true
    nodes:
      output: !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PacifismDangerousAttack
  - type: StaticPrice
    price: 500
  - type: Electrified
    onHandInteract: false
    onInteractUsing: false
    onBump: false
    requirePower: true
    highVoltageNode: output
  - type: GuideHelp
    guides:
    - RTG
    - Power

- type: entity
  parent: [BaseRTG, StructureHealthMachineStrong]
  id: GeneratorRTG
  name: 放射性同位素热电发生器 | RTG
  description: 放射性同位素热电发生器，用于长期供电。 | A Radioisotope Thermoelectric Generator for long term power.
  suffix: 10kW
  components:
  - type: Sprite
    state: rtg
  - type: PowerMonitoringDevice
    state: rtg
  - type: Damageable
    damageModifierSet: GlassReinforcedMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 275
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          GeneratorRTGDamaged:
            min: 1
            max: 1

# TODO: need radioactive fallout when destroyed

- type: entity
  parent: [BaseRTG, StructureHealthMachineFlimsy]
  id: GeneratorRTGDamaged
  name: 受损的放射性同位素温差发电机 | damaged RTG
  description: 一种用于长期供电的放射性同位素温差发电机。这一台的屏蔽层已受损。 | A Radioisotope Thermoelectric Generator for long term power. This one has damaged shielding.
  suffix: 10kW
  components:
  - type: Sprite
    layers:
    - state: rtg_damaged
    - state: rtg_glow
  - type: PowerMonitoringDevice
    state: rtg_damaged
  - type: RadiationSource # ideally only when opened.
    intensity: 2
  - type: Damageable
    damageModifierSet: PreciousMetalMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 5
          SheetUranium1:
            min: 1
            max: 5
