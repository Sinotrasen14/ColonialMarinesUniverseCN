- type: entity
  id: TeslaGenerator
  name: 特斯拉发电机 | tesla generator
  parent: BaseStructureDynamic
  description: 一个奇怪的装置，设置好后能产生强大的特斯拉球。附带临时停机收容失效保护。 | An Odd Device which produces a powerful Tesla ball when set up. Comes with a temporary shutdown containment failsafe.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Power/Generation/Tesla/generator.rsi
    state: icon
  - type: SingularityGenerator # TODO: rename the generator
    spawnId: TeslaEnergyBall
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          # Using a circle here makes it a lot easier to pull it all the way from Cargo
          radius: 0.45
        density: 190
        # Keep an eye on ParticlesProjectile when adjusting these
        mask:
        - MachineMask
        layer:
        - Opaque
  - type: Anchorable
  - type: GuideHelp
    guides:
    - TeslaEngine
    - Power

