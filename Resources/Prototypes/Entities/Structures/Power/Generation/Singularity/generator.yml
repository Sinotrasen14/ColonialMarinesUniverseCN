- type: entity
  id: SingularityGenerator
  name: 引力奇点发生器 | gravitational singularity generator
  description: 一个奇特的装置，设置后能产生引力奇点。附带临时停机收容失效保护装置。 | An Odd Device which produces a Gravitational Singularity when set up. Comes with a temporary shutdown containment failsafe.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Structures/Power/Generation/Singularity/generator.rsi
    state: icon
  - type: SingularityGenerator
  - type: InteractionOutline
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          # Using a circle here makes it a lot easier to pull it all the way from Cargo
          radius: 0.45
        density: 190
        # Keep an eye on ParticlesProjectile when adjusting these
        mask:
        - MachineMask
        layer:
        - Opaque
  - type: Transform
    anchored: true
    noRot: true
  - type: Anchorable
  - type: Pullable
  - type: GuideHelp
    guides:
    - SingularityEngine
    - Power

