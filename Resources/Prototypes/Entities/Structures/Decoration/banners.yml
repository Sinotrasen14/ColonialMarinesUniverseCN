- type: entity
  parent: [BaseStructureDynamic, StructureHealthFurnitureStrong]
  id: BannerBase
  name: 基础横幅 | base banner
  description: 这是横幅的概念，你不应该看到这个。 | It's the concept of a banner, you shouldn't be seeing this.
  abstract: true
  components:
  - type: Sprite
    sprite: Structures/Decoration/banner.rsi
    state: banner
    noRot: true
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 190
        mask:
        - MachineMask
        layer:
        - Opaque
        - MidImpassable
        - HighImpassable
        - BulletImpassable
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: DurathreadMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg

- type: entity
  id: BannerNanotrasen
  parent: BannerBase
  name: 纳米特雷森横幅 | nanotrasen banner
  description: 一面展示纳米特雷森标志的横幅。它看起来相当廉价。 | A banner displaying the Nanotrasen logo. It looks rather cheap.
  components:
  - type: Sprite
    sprite: Structures/Decoration/banner.rsi
    state: banner

