- type: entity
  parent: BaseTree
  id: DecoratedFirTree
  name: 装饰过的冷杉树 | decorated fir tree
  description: 一棵非常喜庆的树，适合非常喜庆的节日。 | A very festive tree for a very festive holiday.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/decorated_fir_tree.rsi
    layers:
    - state: base
    - state: balls
    - state: lights
      shader: unshaded
  - type: PointLight
    radius: 1.6
    energy: 2.0
    enabled: false
    lightMask: ConeSingle
    autoRot: true
    offset: "0, 0.6"
