- type: entity
  id: Mannequin
  parent: [BaseStructureDynamic, StripableInventoryBase, StructureHealthFurniture]
  name: 人体模型 | mannequin
  description: 它可以穿任何风格的服装。 | It can wear any clothing with style.
  components:
  - type: Appearance
  - type: Sprite
    sprite: Structures/Decoration/mannequin.rsi
    state: mannequin
    noRot: true
    layers:
    - map: ["mannequin"]
      sprite: Structures/Decoration/mannequin.rsi
      state: mannequin
    - map: ["jumpsuit"]
    - map: ["outerClothing"]
    - map: ["eyes"]
    - map: ["neck"]
    - map: ["back"]
    - map: ["mask"]
    - map: ["head"]
  - type: Rotatable
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 200
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - BulletImpassable
  - type: InteractionOutline
  - type: Construction
    graph: Mannequin
    node: mannequin
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:EmptyAllContainersBehaviour
  - type: ContainerContainer
    containers:
      jumpsuit: !type:ContainerSlot
        showEnts: false
        occludes: false
        ent:
      outerClothing: !type:ContainerSlot
        showEnts: false
        occludes: false
        ent:
      neck: !type:ContainerSlot
        showEnts: false
        occludes: false
        ent:
      mask: !type:ContainerSlot
        showEnts: false
        occludes: false
        ent:
      eyes: !type:ContainerSlot
        showEnts: false
        occludes: false
        ent:
      head: !type:ContainerSlot
        showEnts: false
        occludes: false
        ent:
      suitstorage: !type:ContainerSlot
        showEnts: false
        occludes: false
        ent:
      back: !type:ContainerSlot
        showEnts: false
        occludes: false
        ent:
  - type: Inventory
    templateId: mannequin
