- type: entity
  abstract: true
  parent: BaseStatue
  id: BaseShowcaseRobot
  name: 安保机器人展示 | security robot showcase
  description: 一个旧式安保机器人的非功能性复制品。 | A non-functional replica of an old security robot.
  components:
  - type: Sprite
    noRot: true
  - type: Anchorable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 5
            max: 10

- type: entity
  id: ShowcaseRobot
  parent: BaseShowcaseRobot
  name: 安保机器人展示 | security robot showcase
  description: 一个旧式安保机器人的非功能性复制品。 | A non-functional replica of an old security robot.
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_1

- type: entity
  id: ShowcaseRobotWhite
  parent: BaseShowcaseRobot
  name: 白色机器人展示 | white robot showcase
  description: 一个旧机器人的非功能性复制品。 | A non-functional replica of an old robot.
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_2

- type: entity
