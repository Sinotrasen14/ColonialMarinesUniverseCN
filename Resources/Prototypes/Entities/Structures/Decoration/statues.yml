- type: entity
  abstract: true
  parent: [BaseStructure, StructureHealthFurnitureStrong]
  id: BaseStatue
  components:
  - type: Sprite
    drawdepth: Mobs
  - type: Damageable
    damageModifierSet: RockMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg

- type: entity
  parent: BaseStatue
  id: StatueVenusRed
  name: 纯洁少女雕像 | statue of a pure maiden
  suffix: Red
  description: 一座古老的大理石雕像。雕像主体被刻画为留着及地长辫，手持一个红色工具箱。 | An ancient marble statue. The subject is depicted with a floor-length braid and is wielding a red toolbox.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/statues.rsi
    state: venus_red
    drawdepth: Mobs
    offset: "0.0,0.5"

- type: entity
  parent: BaseStatue
  id: StatueVenusBlue
  name: 纯洁少女的雕像 | statue of a pure maiden
  suffix: Blue
  description: 一座古老的大理石雕像。雕像主体被描绘成梳着及地长辫，手持蓝色工具箱的形象。 | An ancient marble statue. The subject is depicted with a floor-length braid and is wielding a blue toolbox.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/statues.rsi
    state: venus_blue
    drawdepth: Mobs
    offset: "0.0,0.5"

- type: entity
  parent: BaseStatue
  id: StatueOrnateClown
  name: 华丽救世主雕像 | ornate savior statue
  description: 一座镀金雕像。它描绘了救世主的归来，他将崛起并带领小丑们走向伟大的鸣笛。 | A gilded statue. It portrays the return of the savior who will rise up and lead the clowns to the great honk.
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: Structures/Decoration/statue-ornate-clown.rsi
    state: icon
    drawdepth: Mobs
    offset: "0.0,0.3125"
  - type: Construction
    graph: OrnateStatueClown
    node: ornateStatueClown
  - type: Damageable
    damageModifierSet: PreciousMetalMod
  - type: SpriteFade
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.25,0.4,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

# Ironsand Statues

- type: entity
  abstract: true
  parent: BaseStatue
  id: BaseIronsandStatue
  description: 在铁砂沙漠中发现的神秘雕像。 | A mysterious statue found in a desert of iron sand.
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SteelOre1:
            min: 1
            max: 2

- type: entity
  parent: BaseIronsandStatue
  id: StatueIronsandSmall
  name: 铁砂小雕像 | ironsand small statue
