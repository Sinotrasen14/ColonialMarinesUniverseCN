- type: entity
  abstract: true
  parent: BaseStructure
  id: TableBase
  name: 桌子 | table
  description: 一块方形的金属板，由四条金属腿支撑。 | A square piece of metal standing on four metal legs.
  components:
  - type: Animateable
  - type: PlaceableSurface
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask: # tables should collide with other tables
        - TableMask
        layer:
        - TableLayer
  - type: SpriteFade
  - type: Sprite
  - type: Icon
    state: full
  - type: IconSmooth
    key: state
    base: state_
  - type: Climbable
  - type: Bonkable
    bonkDamage:
      types:
        Blunt: 4
  - type: Clickable
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepHull
  - type: Tag
    tags:
    - ForceFixRotations

- type: entity
  abstract: true
  parent: TableBase
  id: CounterBase
  name: 计数器 | counter
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask:
        - TableMask
        layer:
        - TableLayer
        - LowImpassable
