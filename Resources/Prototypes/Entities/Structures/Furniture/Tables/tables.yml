#region Tables

- type: entity
  parent: [TableBase, StructureHealthFurniture]
  id: Table
  name: 桌子 | table
  description: 一块方形的金属板，由四条金属腿支撑。 | A square piece of metal standing on four metal legs.
  components:
  - type: Sprite
    sprite: Structures/Furniture/Tables/generic.rsi
  - type: Icon
    sprite: Structures/Furniture/Tables/generic.rsi
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger: &DamageFurnitureNormal !type:DamageTrigger
        damage: 40
      behaviors:
      - *SoundMetalBreak
      - &ChangeNodeFrame !type:ChangeConstructionNodeBehavior
        node: TableFrame
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
  - type: IconSmooth
    key: metaltable
    base: state_
  - type: Construction
    graph: Table
    node: Table

