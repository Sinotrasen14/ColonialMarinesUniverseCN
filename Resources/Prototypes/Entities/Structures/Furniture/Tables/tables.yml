#region Frames

- type: entity
  parent: [BaseStructure, StructureHealthFurnitureWeak]
  id: TableFrame
  # BaseStructure and not BaseTable, since these shouldn't be climbable/placeable.
  name: 桌架 | table frame
  description: 构成桌架的金属件。 | Pieces of metal that make the frame of a table.
  components:
  - type: Sprite
    sprite: Structures/Furniture/Tables/frame.rsi
  - type: Icon
    sprite: Structures/Furniture/Tables/frame.rsi
    state: full
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.40,-0.30,0.40,0.45"
        density: 80
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: IconSmooth
    key: state
    base: state_
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger: &DamageFurnitureWeak !type:DamageTrigger
        damage: 5
      behaviors:
      - &SoundMetalBreak !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 1
            max: 1
  - type: Construction
    graph: Table
    node: TableFrame

- type: entity
  parent: [BaseStructure, StructureHealthFurnitureWeak]
  id: CounterWoodFrame
  name: 木制柜台框架 | wooden counter frame
  description: 构成桌子框架的木块。 | Pieces of wood that make the frame of a table.
  components:
  - type: SpriteFade
  - type: Sprite
    sprite: Structures/Furniture/Tables/frame.rsi
  - type: Icon
    sprite: Structures/Furniture/Tables/frame.rsi
    state: full
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Damageable
    damageModifierSet: WoodMod
  - type: IconSmooth
    key: state
    base: state_
  - type: Destructible
    thresholds:
    - trigger: *DamageFurnitureWeak
      behaviors:
      - &SoundWoodDestroy !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 0
            max: 1
  - type: Construction
    graph: Table
    node: CounterWoodFrame

- type: entity
  parent: [BaseStructure, StructureHealthFurnitureWeak]
  id: CounterMetalFrame
  name: 金属柜台框架 | metal counter frame
  description: 构成桌子框架的金属件。 | Pieces of metal that make the frame of a table.
