- type: entity
  parent: [SolutionTank, SolutionHuge, StructureHealthFurnitureStrong]
  id: SinkEmpty
  name: 水槽 | sink
  description: 水龙头已被拧到最大可能扭矩，但仍已知会滴水。 | The faucets have been tightened to the maximum possible torque but are still known to drip.
  suffix: Empty
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Structures/Furniture/sink.rsi
    layers:
    - state: sink_stem
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: sink-fill-1
      visible: false
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: sink-fill-
    solutionName: drainBuffer
  - type: SolutionManager
    solutions:
    - SolutionDrainNormal
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 1
  - type: DrainableSolution
    solution: tank
  - type: ReagentTank
  - type: Drain
    autoDrain: false
  - type: DumpableSolution
    solution: drainBuffer
  - type: Edible
    edible: Drink
    solution: tank
    destroyOnEmpty: false
    utensil: Spoon
  - type: Damageable
    damageModifierSet: RockMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -3
  - type: AmbientSound
    enabled: false
    volume: -8
    range: 8
    sound:
      path: /Audio/Ambience/Objects/drain.ogg

- type: entity
  parent: SinkEmpty
  id: Sink
  suffix: Water
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 480

- type: entity
  parent: Sink
  id: SinkWide
  name: 宽水槽 | wide sink
  components:
  - type: Sprite
    sprite: Structures/Furniture/sink.rsi
    layers:
    - state: sink_wide
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: sink_wide-fill-1
      visible: false
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: sink_wide-fill-
    solutionName: drainBuffer

#Stemless Sink

- type: entity
  name: 水槽 | sink
  id: SinkStemless
  parent: SinkEmpty
  components:
  - type: Sprite
    sprite: Structures/Furniture/sink.rsi
    layers:
    - state: sink
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: sink-fill-1
      visible: false

- type: entity
  name: 水槽 | sink
  id: SinkStemlessWater
  parent: SinkStemless
  suffix: Water
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 480
