- type: entity
  parent: [BaseStructureDynamic, StructureHealthFurniture]
  id: PottedPlantBase
  name: 盆栽 | potted plant
  description: 一盆小小的自然。 | A little bit of nature contained in a pot.
  abstract: true
  components:
  - type: SpriteFade
  - type: Transform
    noRot: true
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.1
        density: 190
        mask:
        - HighImpassable
  - type: Sprite
    drawdepth: Overdoors
    offset: "0.0,0.3"
    sprite: Structures/Furniture/potted_plants.rsi
    noRot: true
  - type: Speech
    speechVerb: Plant # for pais (In the secret stash)
  - type: SecretStash
    tryInsertItemSound:
      collection: CMUPottedPlantRustle
    tryRemoveItemSound:
      collection: CMUPottedPlantRustle
    secretStashName: secret-stash-plant
  - type: ContainerContainer
    containers:
      stash: !type:ContainerSlot {}
  - type: Pullable
  - type: MultiHandedItem
  - type: Item
    sprite: Structures/Furniture/potted_plants.rsi
    size: Huge
  - type: Damageable
    damageModifierSet: RockMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: CMUPottedPlantRustle
      - !type:PlaySoundBehavior
        sound:
          collection: CMUPottedPlantBreak
          params:
            volume: -6
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

