# Parents
- type: entity
  abstract: true
  parent: BaseWallmount
  id: ShelfBase
  name: 架子 | shelf
  description: 一个奇怪的地方，嗯，放任何东西都是。你觉得自己不该看到这个。 | A strange place to place, well, anything really. You feel like you shouldn't be seeing this.
  components:
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Storage/Shelfs/wood.rsi
    state: base
  - type: Storage
    grid:
    - 0,0,3,1
    - 0,3,3,4
    maxItemSize: Normal
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container

- type: entity
  abstract: true
  parent: [ShelfBase, StructureHealthContainerWeak]
  id: ShelfBaseWeak
  components:
  - type: Destructible
    thresholds:
    - trigger: &DamageContainerWeak !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:EmptyContainersBehaviour
        containers:
        - storagebase

- type: entity
  abstract: true
  parent: [ShelfBase, StructureHealthContainer]
  id: ShelfBaseReinforced
  name: 加固货架 | reinforced shelf
  description: 它看起来和现实本身一样坚固。 | It looks as strong as reality itself.
  components:
  - type: Lock
  - type: LockedStorage
  - type: LockVisuals
  - type: Sprite
    sprite: Structures/Storage/Shelfs/wood.rsi
    state: base
    layers:
    - state: rbase
      map: ["enum.StorageVisualLayers.Base"]
    - state: unlocked
      shader: unshaded
      # used to keep the unlocked light visible while open.
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
  - type: Appearance
  - type: EntityStorageVisuals
    stateDoorOpen: open
    stateDoorClosed: closed
  - type: AccessReader
  - type: Destructible
    thresholds:
    - trigger: &DamageContainerNormal !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:EmptyContainersBehaviour
        containers:
        - storagebase

# Normal
- type: entity
  parent: ShelfBaseWeak
  id: ShelfWood
  name: 木架 | wooden shelf
  description: 一个方便放置任何东西的地方。 | A convenient place to place, well, anything really.
  components:
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds:
    - trigger: *DamageContainerWeak
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 1
            max: 3
  - type: Construction
    graph: Shelf
    node: ShelfWood

- type: entity
  parent: ShelfBaseWeak
  id: ShelfMetal
  name: 金属架子 | metal shelf
  description: 一个坚固的地方，可以放，嗯，任何东西。 | A sturdy place to place, well, anything really.
  components:
  - type: Sprite
    sprite: Structures/Storage/Shelfs/metal.rsi
    state: base
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger: *DamageContainerWeak
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
  - type: Construction
    graph: Shelf
    node: ShelfMetal

- type: entity
  parent: ShelfBaseWeak
  id: ShelfGlass
  name: 玻璃架子 | glass shelf
  description: 一个脆弱的地方，用来放置，嗯，任何东西都行。 | A fragile place to place, well, anything really.
  components:
  - type: Sprite
    sprite: Structures/Storage/Shelfs/glass.rsi
    state: base
  - type: Damageable
    damageModifierSet: GlassMod
  - type: Destructible
    thresholds:
    - trigger: *DamageContainerWeak
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 0
            max: 2
  - type: Construction
    graph: Shelf
    node: ShelfGlass

# Reinforced
- type: entity
  parent: ShelfBaseReinforced
  id: ShelfRWood
  name: 坚固的木架 | sturdy wood shelf
  description: 一个安全的地方，用来放置你最喜爱的那瓶威士忌。 | A safe place to put your favorite bottle of whiskey.
  components:
  - type: Sprite
    sprite: Structures/Storage/Shelfs/wood.rsi
    state: base
    layers:
    - state: rbase
      map: ["enum.StorageVisualLayers.Base"]
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds:
    - trigger: *DamageContainerNormal
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 2
            max: 5
  - type: Construction
    graph: Shelf
    node: ShelfRWood

- type: entity
  parent: ShelfBaseReinforced
  id: ShelfRMetal
  name: 坚固的金属架子 | sturdy metal shelf
  description: 一个坚固又闪亮的地方，用来安全存放你所有的药瓶。 | A strong & shiny place to keep all your vials safe.
  components:
  - type: Sprite
    sprite: Structures/Storage/Shelfs/metal.rsi
  - type: Damageable
    damageModifierSet: PlasteelMod
  - type: Destructible
    thresholds:
    - trigger: *DamageContainerNormal
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel1:
            min: 2
            max: 3
          ShardGlass:
            min: 1
            max: 2
          PartRodMetal1:
            min: 1
            max: 2
  - type: Construction
    graph: Shelf
    node: ShelfRMetal

- type: entity
  parent: ShelfBaseReinforced
  id: ShelfRGlass
  name: 坚固的玻璃搁板 | sturdy glass shelf
  description: 晶莹剔透的强化玻璃门，用来炫耀你那些花哨瓶子——你绝对没有为了它们卖掉同事最爱的蛾蠊。 | Crystal clear reinforced glass doors to show off all your fancy bottles you definitely didn't sell a co-worker's favorite mothroach for.
  components:
  - type: Sprite
    sprite: Structures/Storage/Shelfs/glass.rsi
  - type: Damageable
    damageModifierSet: GlassReinforcedMod
  - type: Destructible
    thresholds:
    - trigger: *DamageContainerNormal
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlastic1:
            min: 1
            max: 3
          ShardGlass:
            min: 1
            max: 2
          PartRodMetal1:
            min: 0
            max: 1
  - type: Construction
    graph: Shelf
    node: ShelfRGlass

# Departmental
- type: entity
  parent: ShelfBaseWeak
  id: ShelfBar
  name: 吧台架 | bar shelf
  description: 由最优质的合成木材制成，满足所有酒类存放需求。 | Made out of the finest synthetic wood for all alcohol holding needs.
  components:
  - type: Sprite
    sprite: Structures/Storage/Shelfs/Departments/Service/bar.rsi
    state: base
    layers:
    - state: base
    - state: bar-0
    - map: ["enum.StorageFillLayers.Fill"]
  - type: Appearance
  - type: StorageFillVisualizer
    maxFillLevels: 13
    fillBaseName: bar
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds:
    - trigger: *DamageContainerWeak
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 1
            max: 4
  - type: Storage
    grid:
    - 0,0,5,1
    - 0,3,5,4
  - type: Construction
    graph: Shelf
    node: ShelfBar

