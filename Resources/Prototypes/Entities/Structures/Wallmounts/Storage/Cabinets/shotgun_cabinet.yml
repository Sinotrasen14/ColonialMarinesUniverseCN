- type: entity
  parent: FireAxeCabinet
  id: ShotGunCabinet
  name: 霰弹枪柜 | shotgun cabinet
  description: 有一个小标签，上面写着“仅供紧急使用”，还附有霰弹枪安全使用的详细说明。说得好像真的一样。 | There is a small label that reads "For Emergency use only" along with details for safe use of the shotgun. As if.
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/shotgun_cabinet.rsi
    layers:
    - state: cabinet
    - state: shotgun
      map: ["enum.ItemCabinetVisuals.Layer"]
      visible: true
    - state: glass
      map: ["enum.OpenableVisuals.Layer"]
    - state: locked
      shader: unshaded
      map: ["enum.LockVisualLayers.Lock"]
  - type: ItemSlots
    slots:
      ItemCabinet:
        ejectOnInteract: true
        whitelist:
          tags:
          - WeaponShotgunKammerer
  - type: AccessReader
    access: [["Security"], ["Command"]]

- type: entity
  parent: ShotGunCabinet
  id: ShotGunCabinetOpen
  suffix: Open
  components:
  - type: Openable
    opened: true
  - type: Lock
    locked: false

- type: entity
  parent: ShotGunCabinet
  id: ShotGunCabinetFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      ItemCabinet:
      - WeaponShotgunKammerer

- type: entity
  parent: [ShotGunCabinetFilled, ShotGunCabinetOpen]
  id: ShotGunCabinetFilledOpen
  suffix: Filled, Open
