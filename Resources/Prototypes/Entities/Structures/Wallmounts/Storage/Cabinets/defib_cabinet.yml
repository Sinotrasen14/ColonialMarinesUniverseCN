# TODO: same as other wallmount cabinets they should use a base structure prototype
- type: entity
  parent: [BaseWallmountCabinet, StructureHealthContainerWeak]
  id: DefibrillatorCabinet
  name: 除颤器柜 | defibrillator cabinet
  description: 一种设计用于放置除颤器的壁挂式小柜子。 | A small wall mounted cabinet designed to hold a defibrillator.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/defib-cabinet.rsi
    offset: 0, -0.25
    layers:
    - state: frame
    - state: fill
      map: ["enum.ItemCabinetVisuals.Layer"]
      visible: true
    - state: closed
      map: ["enum.OpenableVisuals.Layer"]
  - type: ItemSlots
    slots:
      ItemCabinet:
        ejectOnInteract: true
        whitelist:
          components:
          - Defibrillator
  - type: Construction
    graph: DefibrillatorCabinet
    node: done
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak

- type: entity
  parent: DefibrillatorCabinet
  id: DefibrillatorCabinetOpen
  suffix: Open
  components:
  - type: Openable
    opened: true

- type: entity
  parent: DefibrillatorCabinet
  id: DefibrillatorCabinetFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      ItemCabinet:
      - Defibrillator

- type: entity
  parent: [DefibrillatorCabinetFilled, DefibrillatorCabinetOpen]
  id: DefibrillatorCabinetFilledOpen
  suffix: Filled, Open
