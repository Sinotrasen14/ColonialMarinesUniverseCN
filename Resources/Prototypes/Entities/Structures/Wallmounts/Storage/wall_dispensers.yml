- type: entity
  abstract: true
  parent: [SolutionTank, SolutionGinormous, BaseWallmountMetallic, StructureHealthContainerFlimsy]
  id: BaseDispenser
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/walldispenser.rsi
  - type: Appearance
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTypeTrigger
        damageType: Heat
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: tank
    - trigger: !type:DamageTypeTrigger
        damageType: Piercing
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: tank
    - trigger: !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:SpillBehavior
        solution: tank
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: DrainableSolution
    solution: tank
  - type: ReagentTank
  - type: ExaminableSolution
    solution: tank

- type: entity
  parent: BaseDispenser
  id: CleanerDispenser
  name: 太空清洁剂分配器 | space cleaner dispenser
  description: 壁挂式太空清洁剂分配器。 | Wallmount Space Cleaner dispenser.
  components:
  - type: Sprite
    layers:
    - state: cleanerdispenser
    - state: fill-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: fill-
  - type: Solution
    solution:
      reagents:
      - ReagentId: SpaceCleaner
        Quantity: 960

- type: entity
  parent: BaseDispenser
  id: FuelDispenser
  name: 燃油加油机 | fuel dispenser
  description: 壁挂式燃油加油机。 | Wallmount Fuel dispenser.
  components:
  - type: Sprite
    layers:
    - state: fueldispenser
    - state: fill-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: fill-
  - type: Solution
    solution:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 960
  - type: ReagentTank
    tankType: Fuel
  - type: DamageOnToolInteract
    tools: Welding
    weldingDamage:
      types:
        Heat: 20
  - type: PacifismDangerousAttack
  - type: Explosive
    explosionType: Default
    totalIntensity: 50
