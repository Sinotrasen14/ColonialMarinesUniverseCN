- type: entity
  abstract: true
  parent: BaseSignWeak
  id: PosterBase
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/posters.rsi
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          PosterBroken:
            min: 1
            max: 1
        offset: 0
  - type: Construction
    graph: PosterGraph
    node: start

- type: entity
  parent: BaseSignWeak
  id: PosterBroken
  name: 破海报 | broken poster
  description: "你无法从海报原本的印刷内容中辨认出任何东西。它已经毁掉了。 | You can't make out anything from the poster's original print. It's ruined."
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: Structures/Wallmounts/posters.rsi
    state: poster_broken
  - type: Construction
    graph: PosterGraph
    node: tornPoster

