- type: entity
  abstract: true
  parent: BaseSignWeak
  id: BaseFlag
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/flags.rsi
  - type: Damageable
    damageModifierSet: ThreadMod

- type: entity
  parent: BaseFlag
  id: BlankFlag
  name: 空白旗帜 | blank flag
  description: 一块白布。绝对不是法国国旗。 | Some piece of white cloth. Definitely not the flag of France.
  components:
  - type: Sprite
    state: blank_flag

- type: entity
  parent: BaseFlag
  id: NTFlag
  name: 纳米特雷森旗帜 | Nanotrasen flag
  description: 纳米特雷森万岁！等等，他们真的为一家公司做了一面旗帜？ | Glory to NT! Wait, they really made a flag for a corporation?
  components:
  - type: Sprite
    state: NT_flag

- type: entity
  parent: BaseFlag
  id: SyndieFlag
  name: 辛迪加旗帜 | syndicate flag
  description: 血腥味。消灭NT！ | Smells bloody. Death to NT!
  components:
  - type: Sprite
    state: syndie_flag

- type: entity
  parent: BaseFlag
  id: LGBTQFlag
  name: LGBTQ旗帜 | LGBTQ flag
  description: "“做同性恋，去犯罪”旗帜。 | \"Be gay do crime\" flag."
  components:
  - type: Sprite
    state: lgbtq_flag

- type: entity
  parent: BaseFlag
  id: PirateFlag
  name: 海盗旗 | pirate flag
  description: 升起海盗旗，你们这些无赖！ | Raise the jolly roger, scallywags!
