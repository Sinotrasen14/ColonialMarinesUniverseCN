- type: entity
  parent: [BaseWallmountMachine, StructureHealthMachineFlimsy]
  id: SignalTimer
  name: 信号定时器 | signal timer
  description: 这是一个用于向物体发送定时信号的定时器。 | It's a timer for sending timed signals to things.
  components:
  - type: StationAiWhitelist
  - type: WallMount
    arc: 360
  - type: Sprite
    drawdepth: SmallObjects
    sprite: Structures/Wallmounts/switch.rsi
    state: on
  - type: Appearance
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Rotatable
  - type: SignalTimer
    canEditLabel: false
  - type: DeviceLinkSource
    ports:
    - Start
    - Timer
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: ActivatableUI
    key: enum.SignalTimerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SignalTimerUiKey.Key:
        type: SignalTimerBoundUserInterface
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: ActivatableUIRequiresPower
  - type: Construction
    graph: Timer
    node: signal
    containers:
    - board
  - type: ContainerContainer
    containers:
      board: !type:Container
  - type: ContainerFill
    containers:
      board: [SignalTimerElectronics]

- type: entity
  id: ScreenTimer
  parent: SignalTimer
  name: 屏幕定时器 | screen timer
  description: 这是一个用于向物体发送定时信号的定时器，内置屏幕。 | It's a timer for sending timed signals to things, with a built-in screen.
  components:
  - type: SignalTimer
    canEditLabel: true
  - type: TextScreenVisuals
    color: FloralWhite
    textOffset: 0,6
    timerOffset: 0,6
    # textLength: 5 This field does not exist. Bug?
    rows: 1
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Wallmounts/signalscreen.rsi
    offset: 0, -0.5
    state: signalscreen
  - type: Construction
    graph: Timer
    node: screen
    containers:
    - board
  - type: ContainerFill
    containers:
      board: [ScreenTimerElectronics]

- type: entity
  id: BrigTimer
  parent: ScreenTimer
  name: 禁闭室计时器 | brig timer
  description: 这是一个用于禁闭室的计时器。 | It's a timer for brig cells.
  components:
  - type: AccessReader
    access: [["CMAccessBrig"], ["CMAccessColonyBrig"], ["AU14AccessGovforSecurity"], ["AU14AccessOpforSecurity"]]
  - type: Construction
    graph: Timer
    node: brig
    containers:
    - board
  - type: ContainerFill
    containers:
      board: [BrigTimerElectronics]
  - type: ApcPowerReceiver
    needsPower: false # TODO RMC14 power

# Construction Frame

- type: entity
  id: TimerFrame
  name: 定时器框架 | timer frame
  description: 一个定时器的构造框架。 | A construction frame for a timer.
  components:
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Wallmounts/signalscreen.rsi
    state: signalscreen
  - type: Construction
    graph: Timer
    node: frame
  - type: WallMount
    arc: 360
