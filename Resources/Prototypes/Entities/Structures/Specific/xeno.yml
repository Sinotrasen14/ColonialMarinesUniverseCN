- type: entity
  parent: BaseStatue
  id: XenoWardingTower
  name: 异界守护塔 | xeno warding tower
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection: MeatBulletImpact
    soundTypes:
      Heat:
        collection: MeatLaserImpact
  - type: InteractionOutline
  - type: Sprite
    sprite: Structures/Specific/xeno_building.rsi
    layers:
    - state: wardingtower
    - state: wardingtower-unshaded
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000

- type: entity
  parent: XenoWardingTower
  id: CarpStatue
  name: 鲤鱼雕像 | carp statue
  description: 一座勇敢鲤鱼雕像，正是它成就了我们的今天。用真牙制成！ | A statue of one of the brave carp that got us where we are today. Made with real teeth!
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Specific/carp_statue.rsi
    layers:
    - state: statue
    - state: eyes
    - state: eyes_unshaded
      shader: unshaded
    - state: teeth_unshaded
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Construction
    graph: CarpStatue
    node: statue

- type: entity
  parent: CarpStatue
  id: CarpStatueEmpty
  suffix: Empty
  description: 一块贵金属，即将成为一尊璀璨的鲤鱼雕像。 | A lump of precious metals, soon to be a brilliant carp statue.
  components:
  - type: Sprite
    layers:
    - state: statue
  - type: Construction
    node: empty

- type: entity
  parent: CarpStatue
  id: CarpStatueEyes
  suffix: Eyes
  description: 一尊勇敢鲤鱼雕像，正是它们成就了我们的今天。这一条需要看牙医…… | A statue of one of the brave carp that got us where we are today. This one needs a dentist...
  components:
  - type: Sprite
    layers:
    - state: statue
    - state: eyes
    - state: eyes_unshaded
      shader: unshaded
  - type: Construction
    node: eyes
