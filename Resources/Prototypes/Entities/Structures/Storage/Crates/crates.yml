- type: entity
  id: CrateBaseLockBox
  parent: CrateBaseSecure
  name: 锁箱 | lock box
  description: "一个安全的锁箱。其出售所得资金将分配回部门。只需记住：货物运输总是要抽成的。 | A secure lock box. Funds from its sale will be distributed back to the department. Just remember: Cargo always takes a cut."
  abstract: true
  components:
  - type: Sprite
    sprite: Structures/Storage/Crates/lockbox.rsi
  - type: GenericVisualizer
    visuals:
      enum.PaperLabelVisuals.HasLabel:
        enum.PaperLabelVisuals.Layer:
          true: {visible: true}
          false: {visible: false}
      enum.PaperLabelVisuals.LabelType:
        enum.PaperLabelVisuals.Layer:
          Paper: {state: paper}
          Bounty: {state: bounty}
          CaptainsPaper: {state: captains_paper}
          Invoice: {state: invoice}
      enum.StorageVisuals.Open:
        lid_overlay:
          true: {visible: false}
          false: {visible: true}
  - type: OverrideSell
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.3,-0.4,0.3,0.19"
        density: 50
        mask:
        - CrateMask #this is so they can go under plastic flaps
        layer:
        - MachineLayer
  - type: Paintable
    group:

