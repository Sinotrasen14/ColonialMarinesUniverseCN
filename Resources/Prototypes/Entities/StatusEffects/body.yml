- type: entity
  parent: MobStatusEffectBase
  id: BloodstreamStatusEffectBase
  abstract: true
  components:
  - type: StatusEffect
    whitelist:
      components:
      - Bloodstream

- type: entity
  parent: BloodstreamStatusEffectBase
  id: BloodstreamStatusEffectDebuff
  abstract: true
  components:
  - type: RejuvenateRemovedStatusEffect

- type: entity
  parent: BloodstreamStatusEffectDebuff
  id: StatusEffectBloodloss
  name: 失血 | bloodloss
  components:
  - type: StutteringAccent
  - type: DrunkStatusEffect

- type: entity
  abstract: true
  parent: MobStatusEffectBase
  id: PainNumbnessStatusEffectBase
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
      - MobThresholds
  - type: PainNumbnessStatusEffect

- type: entity
  parent: BloodstreamStatusEffectDebuff
  id: StatusEffectAnticoagulant # Decreases the amount of blood coagulation when bleeding.
  name: 薄血 | thin blood
  components:
  - type: HemophiliaStatusEffect
    bleedReductionMultiplier: 0.33
    bleedAmountMultiplier: 1

- type: entity
  parent: BloodstreamStatusEffectDebuff
  id: StatusEffectHemorrhage # Increases the amount of blood lost when bleeding.
  name: 出血 | hemorrhage
  components:
  - type: HemophiliaStatusEffect
    bleedReductionMultiplier: 1 # We don't want it to also reduce coagulation, it would stack with Anticoagulant.
    bleedAmountMultiplier: 1.33

- type: entity
  parent: [PainNumbnessStatusEffectBase, MobStatusEffectDebuff]
  id: StatusEffectPainNumbness
  name: 疼痛麻木 | pain numbness

# Ignore movement slowdown from damage thresholds.
- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectAdrenaline
  name: 肾上腺素 | adrenaline
  components:
  - type: IgnoreSlowOnDamage
  - type: StatusEffectAlert
    alert: Adrenaline
  - type: ExaminableStatusEffect
    messageId: status-effect-examine-adrenaline

- type: entity
  parent: MobStatusEffectBase
  id: StaminaModifierStatusEffect
  components:
  - type: StatusEffect
    whitelist:
      components:
      - Stamina
  - type: StaminaModifierStatusEffect

- type: entity
  parent: StaminaModifierStatusEffect
  name: 最大体力2倍 | 2x max stamina
  id: StatusEffectDesoxyStamina

- type: entity
  parent: StaminaModifierStatusEffect
  id: StatusEffectStimulantsStamina
  name: 1.5倍最大耐力 | 1.5x max stamina
  components:
  - type: StaminaModifierStatusEffect
    modifier: 1.5
