- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectSlowdown
  abstract: true
  name: 放缓 | slowdown
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
      - MovementSpeedModifier
      requireAll: true
    blacklist:
      tags:
      - SlowImmune
  - type: MovementModStatusEffect

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectSpeed
  abstract: true
  name: 速度 | speed
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
      - MovementSpeedModifier
      requireAll: true
  - type: MovementModStatusEffect

- type: entity
  parent: StatusEffectSpeed
  id: ReagentSpeedStatusEffect
  name: 试剂速度 | reagent speed

- type: entity
  parent: StatusEffectSlowdown
  id: VomitingSlowdownStatusEffect
  name: 呕吐减缓 | vomiting slowdown

- type: entity
  parent: StatusEffectSlowdown
  id: TaserSlowdownStatusEffect
  name: 被电击枪击中减速 | shot by taser slowdown

- type: entity
  parent: StatusEffectSlowdown
  id: FlashSlowdownStatusEffect
  name: 受闪光减速影响 | affected by flash slowdown

- type: entity
  parent: StatusEffectSlowdown
  id: StatusEffectStaminaLow
  name: 耐力低 | stamina low

# Makes you more slippery, or perhaps less slippery.
- type: entity
  parent: MobStatusEffectDebuff # Debatable if this should be MobStatusEffectBase or not
  id: StatusEffectFriction
  name: 摩擦 | friction
  components:
  - type: FrictionStatusEffect

# Stunnable Status Effect

- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectStunned
  name: 惊呆的 | stunned
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
    blacklist:
      tags:
      - StunImmune
  - type: StatusEffectAlert
    alert: Stun
  - type: StunnedStatusEffect
  - type: ExaminableStatusEffect
    messageId: status-effect-examine-stunned

- type: entity
  parent: StatusEffectStunned
  id: StatusEffectParalyzed
  name: 瘫痪 | paralyzed
  components:
  - type: KnockdownStatusEffect

# Mirrors the legacy RMC Unconscious timer without merging it into direct stun/paralysis ownership.
- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectRMCUnconscious
  name: 无意识 | unconscious
  components:
  - type: StunnedStatusEffect
  - type: KnockdownStatusEffect
    silent: true
    drop: false
  - type: BlindnessStatusEffect
