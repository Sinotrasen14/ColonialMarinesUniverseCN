- type: entity
  id: Acidifier
  name: 酸液 | acid
  description: 把你融化成一滩恶心的黏液！ | Melts you into a puddle of yuck!
  components:
  - type: Transform
    anchored: true
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: /Textures/Effects/acidifier.rsi
    state: acid
  - type: Fixtures
    fixtures:
      portalFixture:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        hard: false
  - type: TimedDespawn
    lifetime: 2.4
