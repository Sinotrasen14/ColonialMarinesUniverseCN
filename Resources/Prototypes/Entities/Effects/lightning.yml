- type: entity
  name: 闪电 | lightning
  id: BaseLightning
  abstract: true
  components:
  - type: Sprite
    sprite: /Textures/Effects/lightning.rsi
    drawdepth: Effects
    layers:
    - state: "lightning_1"
      shader: unshaded
  - type: Physics
  - type: Electrified
    requirePower: false
  - type: Lightning
  - type: PointLight
    enabled: true
    color: "#4080FF"
    radius: 3.5
    softness: 1
    autoRot: true
    castShadows: false
  - type: Beam
    sound: /Audio/Effects/Lightning/lightningshock.ogg
  - type: TimedDespawn
    lifetime: 3
  - type: Tag
    tags:
    - HideContextMenu
  # At least one fixture is needed for the CanCollide field of the PhysicsComponent to not always be false.
  - type: Fixtures
    fixtures:
      fix1: {}

- type: entity
  name: 闪电 | lightning
  id: Lightning
  parent: BaseLightning
  categories: [HideSpawnMenu]
  components:
  - type: Lightning
    canArc: true

- type: entity
  name: 诡异闪电 | spooky lightning
  id: LightningRevenant
  parent: BaseLightning
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: /Textures/Effects/lightning.rsi
    drawdepth: Effects
    layers:
    - state: "lightning_3"
      color: plum
      shader: unshaded
  - type: PointLight
    enabled: true
    color: plum
    radius: 3.5
    softness: 1
    autoRot: true
    castShadows: false
  - type: Lightning
    canArc: false
    shockDamage: 30

- type: entity
  name: 充能闪电 | charged lightning
  id: ChargedLightning
  parent: BaseLightning
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: /Textures/Effects/lightning.rsi
    drawdepth: Effects
    layers:
    - state: "blue_lightning"
      shader: unshaded
  - type: Electrified
    requirePower: false
    shockDamage: 40
  - type: Lightning
    canArc: true
    lightningPrototype: ChargedLightning

- type: entity
  name: 闪电 | lightning
  id: Spark
  parent: BaseLightning
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: /Textures/Effects/lightning.rsi
    drawdepth: Effects
    layers:
    - state: "lightning_1"
      shader: unshaded
  - type: Electrified
    shockDamage: 0
  - type: Lightning
    lightningPrototype: Spark
  - type: PointLight
    radius: 0.2
    softness: .4
  - type: Beam
    sound: /Audio/Effects/sparks4.ogg
  - type: TimedDespawn
    lifetime: .3
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  name: 超充能闪电 | supercharged lightning
  id: SuperchargedLightning
  parent: ChargedLightning
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: /Textures/Effects/lightning.rsi
    drawdepth: Effects
    layers:
    - state: "yellow_lightning"
      shader: unshaded
  - type: Electrified
    requirePower: false
    shockDamage: 50
  - type: Lightning
    canArc: true
    lightningPrototype: SuperchargedLightning
  - type: PointLight
    enabled: true
    color: "#FFFF00"
    radius: 3.5
    softness: 1
    autoRot: true
    castShadows: false

- type: entity
  name: 超充能闪电 | hypercharged lightning
  id: HyperchargedLightning
  parent: ChargedLightning
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: /Textures/Effects/lightning.rsi
    drawdepth: Effects
    layers:
    - state: "red_lightning"
      shader: unshaded
  - type: Electrified
    requirePower: false
    shockDamage: 60
  - type: Lightning
    canArc: true
    lightningPrototype: HyperchargedLightning
  - type: PointLight
    enabled: true
    color: "#ff0000"
    radius: 3.5
    softness: 1
    autoRot: true
    castShadows: false
