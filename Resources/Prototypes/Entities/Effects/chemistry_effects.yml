- type: entity
  id: BaseFoam
  abstract: true
  components:
  - type: Sprite
    drawdepth: Effects
  - type: Appearance
  - type: AnimationPlayer
  - type: SmokeVisuals
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        mask:
        - ItemMask
        layer:
        - SlipLayer
  - type: Smoke
  - type: ActiveEdgeSpreader
  - type: EdgeSpreader
    id: Smoke
  - type: Solution
    id: solutionArea
    solution:
      maxVol: 600 # Required for it to spawn correctly, but should be removed in the future:tm: Arguably could move the solution to SmokeComponent as well considering it's nonreactive
      canReact: false

- type: entity
  parent: BaseFoam
  id: Smoke
  name: 烟雾 | smoke
  categories: [HideSpawnMenu]
  components:
  - type: Occluder
  - type: Sprite
    sprite: Effects/chemsmoke.rsi
    state: chemsmoke
  - type: TimedDespawn
    lifetime: 10
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: BaseFoam
  id: TearGasSmoke
  name: 催泪瓦斯 | tear gas
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: Effects/chemsmoke.rsi
    state: chemsmoke
  - type: TimedDespawn
    lifetime: 10
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: TearGasSmoke
  id: TearGasSmokeWhite
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    state: chemsmoke_white

- type: entity
  parent: Smoke
  id: WizardSmoke
  name: 烟雾 | smoke
  categories: [HideSpawnMenu]
  components:
  - type: Smoke
    spreadAmount: 5

- type: entity
  parent: BaseFoam
  id: Foam
  name: 泡沫 | foam
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    color: "#ffffffcc"
    sprite: Effects/foam.rsi
    layers:
    - state: foam
      map: ["enum.FoamVisualLayers.Base"]
    - map: ["enum.EdgeLayer.South"]
      state: foam-south
    - map: ["enum.EdgeLayer.East"]
      state: foam-east
    - map: ["enum.EdgeLayer.North"]
      state: foam-north
    - map: ["enum.EdgeLayer.West"]
      state: foam-west
  - type: SmoothEdge
  - type: IconSmooth
    mode: NoSprite
    key: foam
  - type: FoamVisuals
    animationTime: 0.6
    animationState: foam-dissolve
  - type: Slippery
  - type: StepTrigger
  # disabled until foam reagent duplication is fixed
  #- type: ScoopableSolution
  #  solution: solutionArea

- type: entity
  id: MetalFoam
  name: 泡沫金属 | metal foam
  categories: [HideSpawnMenu]
  parent: Foam
  components:
  - type: Sprite
    color: "#ffffffcc"
    sprite: Effects/foam.rsi
    layers:
    - state: m_foam
      map: ["enum.FoamVisualLayers.Base"]
    - map: ["enum.EdgeLayer.South"]
      state: m_foam-south
    - map: ["enum.EdgeLayer.East"]
      state: m_foam-east
    - map: ["enum.EdgeLayer.North"]
      state: m_foam-north
    - map: ["enum.EdgeLayer.West"]
      state: m_foam-west
  - type: EdgeSpreader
    id: MetalFoam
  - type: FoamVisuals
    animationTime: 0.6
    animationState: m_foam-dissolve

- type: entity
  id: IronMetalFoam
  name: 铁金属泡沫 | iron metal foam
  categories: [HideSpawnMenu]
  parent: MetalFoam
  components:
  - type: SpawnOnDespawn
    prototype: FoamedIronMetal

- type: entity
  id: AluminiumMetalFoam
  name: 铝金属泡沫 | aluminium metal foam
  categories: [HideSpawnMenu]
  parent: MetalFoam
  components:
  - type: SpawnOnDespawn
    prototype: FoamedAluminiumMetal

- type: entity
  abstract: true
  parent: StructureHealthBarrierWeak
  id: BaseFoamedMetal
  name: 基体泡沫金属 | base foamed metal
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: RCDDeconstructable
    cost: 2
    delay: 2
    fx: EffectRCDDeconstruct2
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: Walls
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb {}
        layer:
        - WallLayer
        mask:
        - WallLayer
  - type: Occluder
  - type: Appearance
  - type: SmoothEdge
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: Transform
    anchored: true
  - type: Airtight
  - type: ReplaceFloorOnSpawn
    replaceableTiles:
    - Plating
    - Lattice
    replacementTiles:
    - FloorMetalFoam

- type: entity
  id: FoamedIronMetal
  name: 泡沫铁金属 | foamed iron metal
  description: "用于密封船体破口。 | For sealing hull breaches."
  parent: BaseFoamedMetal
  components:
  - type: Sprite
    drawdepth: Effects
    color: "#ffffffcc"
    sprite: Effects/foam.rsi
    layers:
    - state: iron_foam
      map: ["enum.FoamVisualLayers.Base"]
    - map: ["enum.EdgeLayer.South"]
      state: iron_foam-south
    - map: ["enum.EdgeLayer.East"]
      state: iron_foam-east
    - map: ["enum.EdgeLayer.North"]
      state: iron_foam-north
    - map: ["enum.EdgeLayer.West"]
      state: iron_foam-west

- type: entity
  parent: BaseFoamedMetal
  id: FoamedAluminiumMetal
  name: 泡沫铝金属 | foamed aluminium metal
  description: "泡沫铝手榴弹残留的稀疏泡沫。易被摧毁。 | Leftover sparse foam from an aluminum foam grenade. Easily destroyed."
  components:
  - type: Sprite
    drawdepth: Effects
    color: "#ffffffcc"
    sprite: Effects/foam.rsi
    layers:
    - state: metal_foam
      map: ["enum.FoamVisualLayers.Base"]
    - map: ["enum.EdgeLayer.South"]
      state: metal_foam-south
    - map: ["enum.EdgeLayer.East"]
      state: metal_foam-east
    - map: ["enum.EdgeLayer.North"]
      state: metal_foam-north
    - map: ["enum.EdgeLayer.West"]
      state: metal_foam-west
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 1 # Intentionally very weak to encourage speedy repair, think of it as thin webbing
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: ReactionFlash
  categories: [HideSpawnMenu]
  components:
  - type: PointLight
    enabled: true
    radius: 2
    energy: 8
  - type: LightFade
    duration: 0.5
  - type: TimedDespawn
    lifetime: 0.5
