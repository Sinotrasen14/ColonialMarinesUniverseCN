#While you were busy charging your batong... I studied the blade.

#BaseSword
- type: entity
  parent: BaseItem
  id: BaseSword
  abstract: true
  components:
  - type: Execution
    doAfterDuration: 4.0
  - type: MeleeWeapon
    wideAnimationRotation: -135
  - type: Sprite
    state: icon
  - type: Item
    size: Normal
  - type: Utensil
    types:
    - Knife
  - type: Tool
    qualities:
    - Slicing

#Shortswords
- type: entity
  name: 弯刀 | cutlass
  parent: [BaseSword, BaseMajorContraband]
  id: Cutlass
  description: 一把邪恶的弯刀，常出现在太空海盗手中。 | A wickedly curved blade, often seen in the hands of space pirates.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/cutlass.rsi
  - type: MeleeWeapon
    damage:
      types:
        Slash: 16
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/cutlass.rsi
    shape:
    - 0,0,0,2
  - type: DisarmMalus

- type: entity
  name: 砍刀 | machete
  parent: [BaseSword, BaseMajorContraband]
  id: Machete
  description: 一把巨大、凶恶的砍刀。 | A large, vicious looking blade.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/machete.rsi
  - type: MeleeWeapon
    damage:
      types:
        Slash: 15
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/machete.rsi
    shape:
    - 0,0,0,2
  - type: DisarmMalus
  - type: CMSurgeryTool
  - type: CMBoneSaw
  - type: CMUImprovisedSurgeryTool
    delayMultiplier: 2.1
    mishapChance: 0.18
    mishapDamageType: Slash
    mishapDamageAmount: 5
    failurePenalty: 1

#Longswords
- type: entity
  name: 船长佩剑 | captain's sabre
  parent: [BaseSword, BaseCommandContraband]
  id: CaptainSabre
  description: 属于空间站船长的一件礼仪武器。 | A ceremonial weapon belonging to the captain of the station.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/captain_sabre.rsi
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Slash: 17 #cmon, it has to be at least BETTER than the rest.
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Reflect
    reflectProb: .1
    spread: 90
  - type: Item
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/captain_sabre_storage_64x.rsi #Done in 64x64 because it looks way too puny in 32x32
    shape:
    - 0,0,0,3
  - type: Tag
    tags:
    - CaptainSabre
  - type: DisarmMalus
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-inanimate
    weight: 0.0002 # 5,000 times less likely than 1 regular animal
  - type: PirateAccent
    # not putting a BlockMovement component here cause that's funny.
  - type: StealTarget
    stealGroup: CaptainSword

- type: entity
  name: 武士刀 | katana
  parent: [BaseSword, BaseMajorContraband]
  id: Katana
  description: 用不那么古老的塑钢制成的古老工艺品。 | Ancient craftwork made with not so ancient plasteel.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/katana.rsi
  - type: MeleeWeapon
    damage:
      types:
        Slash: 15
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/katana_storage_64x.rsi #Done in 64x64 because it looks way too puny in 32x32
    shape:
    - 0,0,0,3
  - type: Clothing
    sprite: Objects/Weapons/Melee/katana.rsi
    slots:
    - Back
    - Belt
  - type: DisarmMalus

- type: entity
  name: 能量武士刀 | energy katana
  parent: Katana
  id: EnergyKatana
  description: 一把注入了强大能量的武士刀。 | A katana infused with strong energy.
  components:
  - type: Contraband
    severity: HighlyIllegal
  - type: Sprite
    sprite: Objects/Weapons/Melee/energykatana.rsi
  - type: MeleeWeapon
    wideAnimationRotation: -60
    damage:
      types:
        Slash: 30
  - type: Item
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/energykatana_storage_64x.rsi #Done in 64x64 because it looks way too puny in 32x32
    shape:
    - 0,0,0,3
  - type: BindItemOnEquip
  - type: ActionGrant
    actions:
    - ActionEnergyKatanaDash
  - type: ItemActionGrant
  - type: Clothing
    sprite: Objects/Weapons/Melee/energykatana.rsi
    slots:
    - Back
    - Belt
  - type: Reflect
    slotFlags:
    - NONE

#Greatswords
- type: entity
  name: 双手大剑 | claymore
  parent: [BaseSword, BaseMajorContraband]
  id: Claymore
  description: 一把古老的战刃。 | An ancient war blade.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/claymore.rsi
  - type: MeleeWeapon
    attackRate: 0.75
    damage:
      types:
        Slash: 20
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/claymore_storage_64x.rsi #Done in 64x64 because it looks way too puny in 32x32
    shape:
    - 0,0,1,3
  - type: Clothing
    sprite: Objects/Weapons/Melee/claymore.rsi
    slots:
    - Back
    - SuitStorage #Bigger than the other swords, easier to strap to your suit.
  - type: DisarmMalus

#Other/Weird
- type: entity
  name: 人群 | throngler
  parent: [BaseSword, BaseMajorContraband]
  id: Throngler
  description: 如果安保人员胆敢从你手中夺走它，只需提醒他们，他们确实终有一死。 | If Security dares take it from you, just remind them that they are indeed mortal.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/Throngler2.rsi
  - type: MeleeWeapon
    attackRate: 10
    damage:
      types:
        Structural: 60
        Slash: 20   #Horror
        Blunt: 20
        Heat: 20
        Piercing: 20
        Radiation: 10
    soundHit:
      path: /Audio/Effects/explosion_small1.ogg
  - type: Reflect
    reflectProb: .25
    spread: 90
  - type: Item
    size: Ginormous
    sprite: Objects/Weapons/Melee/Throngler-in-hand.rsi
    shape:
    - 0,0,3,3
    - 1,4,2,6
    storedRotation: -45
  - type: DisarmMalus
  - type: Grammar
    attributes:
      proper: true
