- type: entity
  parent: [CombatKnife, BaseXenoborgContraband]
  id: XenoborgBioKnife
  name: 生化刀 | bio knife
  description: 会与特定的代谢者融合，并对那些目标造成额外伤害！ | Melds itself to specific metabolizers and will deal extra damage to those targets!
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/bioknife.rsi
    state: icon
  - type: MeleeWeapon
    attackRate: 1.0
    damage:
      types:
        Slash: 10
  - type: Item
    sprite: Objects/Weapons/Melee/bioknife.rsi
  - type: BonusDamageOnMetabolism
    selectedMetabolizer: Human
    excludedMetabolizers:
    - Vox # Their biology is resistant to this!
    # The rest of these are just so we don't clog up the menu with useless items.
    - Bloodsucker
    - Dragon
    - Changeling
    damage:
      types:
        Poison: 10

