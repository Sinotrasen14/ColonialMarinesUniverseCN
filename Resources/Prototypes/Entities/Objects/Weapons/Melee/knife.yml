- type: entity
  parent: BaseItem
  id: BaseKnife
  abstract: true
  components:
  - type: Tag
    tags:
    - Knife
  - type: Execution
    doAfterDuration: 4.0
  - type: Utensil
    types:
    - Knife
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 10
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DamageImpactProfile
    melee:
      contact: Stab
      penetration: Low
    thrown:
      contact: Stab
      penetration: Medium
  - type: Sprite
  - type: Item
    size: Small
  - type: Tool
    qualities:
    - Slicing
    useSound:
      path: /Audio/Items/Culinary/chop.ogg
  - type: CMSurgeryTool
  - type: CMScalpel
  - type: CMUShrapnelExtractor
    removeCount: 2
    delay: 2.25
    painPenalty: 7
    damageOnExtract: 3
  - type: CMRetractor
  - type: CMUImprovisedSurgeryTool
    delayMultiplier: 1.8
    mishapChance: 0.12
    mishapDamageType: Slash
    mishapDamageAmount: 3
    failurePenalties:
      retractor: 2
      bone_saw: 1
  - type: DeleteOnExplosion

- type: entity
  parent: BaseKnife
  id: KitchenKnife
  name: 厨刀 | kitchen knife
  description: 由阿斯特商人公会制造的多用途厨师刀。保证在未来数年内保持锋利。 | A general purpose Chef's Knife made by Asters Merchant Guild. Guaranteed to stay sharp for years to come..
  components:
  - type: Tag
    tags:
    - Knife
    - KitchenKnife
  - type: Sprite
    sprite: Objects/Weapons/Melee/kitchen_knife.rsi
    state: icon
  - type: Item
    sprite: Objects/Weapons/Melee/kitchen_knife.rsi
    storedOffset: -1,1
    storedRotation: -45
  - type: GuideHelp
    guides:
    - Chef
    - FoodRecipes
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.35,-0.2
          - -0.2,-0.35
          - 0.4,0.25
          - 0.25,0.4
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2

