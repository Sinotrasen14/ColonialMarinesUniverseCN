- type: entity
  name: 大锤 | sledgehammer
  parent: BaseItem
  id: Sledgehammer
  description: 完美的肆意破坏工具。 | The perfect tool for wanton carnage.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/sledgehammer.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 10
        Structural: 6
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 10
        Structural: 6
  - type: Item
    size: Large

- type: entity
  id: Mjollnir
  parent: [BaseItem, BaseMagicalContraband]
  name: 雷神之锤 | Mjollnir
  description: 一把配得上神明的武器，能以闪电之力击打。它噼啪作响，能量几乎难以遏制。 | A weapon worthy of a god, able to strike with the force of a lightning bolt. It crackles with barely contained energy.
  components:
  - type: Wieldable
    useDelayOnWield: false
  - type: MeleeRequiresWield
  - type: LandAtCursor
  - type: Sprite
    sprite: Objects/Weapons/Melee/mjollnir.rsi
    layers:
    - state: icon
  - type: UseDelay
    delay: 10
  - type: UseDelayOnMeleeHit
  - type: MeleeThrowOnHit
    stunTime: 3
    activateOnThrown: true
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 5
        Structural: 5
    soundHit:
      path: /Audio/Effects/tesla_consume.ogg
      params:
        variation: 0.10
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 20
        Structural: 55 # The mighty muscle wizard shatters windows in a single blow
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 15
        Structural: 40
  - type: Item
    size: Ginormous
    shape:
    - 0,0,3,1
    - 1,2,2,5
    storedRotation: -45

- type: entity
  id: SingularityHammer
  parent: [BaseItem, BaseMagicalContraband]
  name: 奇点锤 | Singularity Hammer
  description: 近战技术的巅峰之作，这把锤子利用微型奇点的力量造成毁灭性打击。 | The pinnacle of close combat technology, the hammer harnesses the power of a miniaturized singularity to deal crushing blows.
  components:
  - type: Wieldable
    useDelayOnWield: false
  - type: MeleeRequiresWield
  - type: Sprite
    sprite: Objects/Weapons/Melee/singularityhammer.rsi
    layers:
    - state: icon
  - type: RepulseAttract
    speed: -15 #Anything above this pushes things too far away from the Wizard
    range: 5
    whitelist:
      components:
      - MobMover
      - Item
  - type: UseDelay
    delay: 10
  - type: UseDelayOnMeleeHit
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 5
    soundHit:
      path: /Audio/Effects/radpulse5.ogg
      params:
        variation: 0.10
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 15
  - type: Item
    size: Ginormous
    shape:
    - 0,0,3,1
    - 1,2,2,5
    storedRotation: -45
