  suffix: For Borgs
  description: 一把极其响亮且危险的剑，其剑刃由纯粹浓缩的等离子体构成。专为辛迪加赛博格设计。 | A very loud & dangerous sword with a beam made of pure, concentrated plasma. Specially designed for syndicate cyborgs.

- type: entity
  parent: EnergySwordDouble
  id: CyborgEnergySwordDouble # why is this invalid if ID is BorgEnergySwordDouble
  suffix: One-Handed, For Borgs
  description: 辛迪加指挥实习生认为能量剑上只有一片刀刃还不够。专为辛迪加赛博格设计。 | Syndicate Command Interns thought that having one blade on the energy sword was not enough. Specially designed for syndicate cyborgs.
  components: # could add energy-draining like the L6C
  - type: Wieldable
    freeHandsRequired: 0 # because borg has no off-hand to wield with.  Without this, it will be unable to activate the esword

