- type: entity
  parent: BaseItem
  id: OffsetCane
  name: 标准偏置手杖 | standard offset cane
  description: 标准偏置手杖，当你的腿脚不便时，它是出行必备之物。它或许能、也或许不能赋予你长者的智慧。 | A standard offset cane, essential for getting around when your legs aren't up to the task. May or may not grant you the wisdom of the elderly.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/offset_canes/standard.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: Objects/Weapons/Melee/offset_canes/standard.rsi
  - type: MobilityAid
#  - type: RandomSprite # Ideally I'd rather these be their own selectable item instead of randomly picked.
#    available:
#    - color: "#91949C"  # standard gray
#    - color: "#000000"  # black
#    - color: "#406BDE"  # blue
#    - color: "#00FFFF"  # cyan
#    - color: "#00FF00"  # green
#    - color: "#FF69B4"  # pink
#    - color: "#800080"  # purple
#    - color: "#FF0000"  # red
#    - color: "#FFFF00"  # yellow
  - type: MeleeWeapon
    wideAnimationRotation: 45
    damage:
      types:
        Blunt: 5
  - type: StaminaDamageOnHit
    damage: 5
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 3
  - type: UseDelay
    delay: 1

- type: entity
  parent: OffsetCane
  id: OffsetCaneClown
  name: 彩虹偏移手杖 | rainbow offset cane
  description: 一根彩虹偏移手杖，非常适合小丑以及那些喜欢在生活中增添一抹色彩的人。 | A rainbow offset cane, perfect for clowns and those who enjoy a splash of color in their lives.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/offset_canes/clown.rsi
    state: icon
  - type: Item
    sprite: Objects/Weapons/Melee/offset_canes/clown.rsi

- type: entity
