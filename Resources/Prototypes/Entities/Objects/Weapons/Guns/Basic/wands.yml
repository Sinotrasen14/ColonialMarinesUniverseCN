- type: entity
  parent: WeaponWandBase
  id: WeaponWandPolymorphBase
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: poly
    - state: poly-effect
      map: ["effect"]
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/Magic/staff_animation.ogg
    projectileSpeed: 25
  - type: BasicEntityAmmoProvider
    proto: ProjectilePolyboltCarp
    capacity: 5

- type: entity
  name: 鲤鱼变形魔杖 | wand of carp polymorph
  parent: WeaponWandPolymorphBase
  id: WeaponWandPolymorphCarp
  description: 当你需要快速得到一块鲤鱼片，而小丑看起来又多汁的时候。 | For when you need a carp filet quick and the clown is looking juicy.
  components:
  - type: BasicEntityAmmoProvider
    proto: ProjectilePolyboltCarp
    capacity: 5
    count: 5

- type: entity
  name: 猴子变形魔杖 | wand of monkey polymorph
  parent: WeaponWandPolymorphBase
  id: WeaponWandPolymorphMonkey
  description: 当你需要一个猴子朋友时。 | For when you need a monkey friend.
  components:
  - type: BasicEntityAmmoProvider
    proto: ProjectilePolyboltMonkey
    capacity: 5
    count: 5

- type: entity
  name: 火球魔杖 | wand of fireball
  parent: WeaponWandBase
  id: WeaponWandFireball
  description: 巨大的火球！ | Great big balls of fire!
  components:
  - type: Sprite
    layers:
    - state: fire
    - state: fire-effect
      map: ["effect"]
  - type: Gun
    fireRate: 0.25
    soundGunshot:
      path: /Audio/Magic/fireball.ogg
    projectileSpeed: 25
  - type: BasicEntityAmmoProvider
    proto: ProjectileFireball
    capacity: 5
    count: 5

- type: entity
  name: 储物柜魔杖 | wand of the locker
  description: 把书呆子们远远地塞进去！ | Stuff nerds at a distance!
  parent: WeaponWandBase
  id: WeaponWandLocker
  components:
  - type: Sprite
    layers:
    - state: locker
      map: ["base"]
    - state: locker-effect
      map: ["effect"]
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/Magic/staff_animation.ogg
    projectileSpeed: 25
  - type: BasicEntityAmmoProvider
    proto: ProjectileLocker
    capacity: 5
    count: 5
  - type: Item
    size: Normal
    inhandVisuals:
      left:
      - state: locker-inhand-left
      right:
      - state: locker-inhand-right
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        effect:
          true: {visible: false}
          false: {visible: true}
        base:
          true: {visible: true}
          false: {visible: false}

- type: entity
  name: 瞬间死亡魔法棒 | magical wand of instant death
  parent: WeaponWandBase
  id: WeaponWandDeath
  description: 只有太空巫师研发团队中最优秀、最聪明的人齐心协力才创造出了这件杰作。 | Only the best and brightest of the Space Wizards R&D team worked together to create this beauty.
  components:
  - type: Sprite
    layers:
    - state: death
    - state: death-effect
      map: ["effect"]
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg # PUNCH
    projectileSpeed: 25
  - type: BasicEntityAmmoProvider
    proto: BulletInstakillMagic
    capacity: 3
    count: 3

- type: entity
  name: 入口魔杖 | wand of entrance
  parent: WeaponWandBase
  id: WeaponWandPolymorphDoor
  description: 当你需要一条逃生路线时。 | For when you need a get-away route.
  components:
  - type: Sprite
    layers:
    - state: door
    - state: door-effect
      map: ["effect"]
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/Magic/staff_door.ogg
    projectileSpeed: 25
  - type: BasicEntityAmmoProvider
    proto: ProjectilePolyboltDoor
    capacity: 10
    count: 10

- type: entity
  name: cluwne化法杖 | wand of cluwning
  parent: WeaponWandPolymorphBase
  id: WeaponWandCluwne
  description: 让他们的处境更糟，把他们变成小丑。 | Make their situation worse by turning them into a cluwne.
  components:
  - type: BasicEntityAmmoProvider
    proto: ProjectilePolyboltCluwne
    capacity: 3
    count: 3

- type: entity
  parent: WeaponWandPolymorphBase
  id: WeaponWandPolymorphBread
  name: 魔法面包棒 | magic bread wand
  description: 把你所有的朋友都变成面包！你的老板！你的敌人！你的狗！让一切都变成面包！ | Turn all your friends into bread! Your boss! Your enemies! Your dog! Make everything bread!
  components:
  - type: BasicEntityAmmoProvider
    proto: ProjectilePolyboltBread
    capacity: 10
    count: 10
