- type: entity
  abstract: true
  parent: [BaseItem, BaseSecurityContraband]
  id: BaseMagazineGrenade
  name: 枪榴弹 | grenade cartridge
  components:
  - type: Tag
    tags:
    - MagazineGrenade
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - Grenade
    capacity: 5
    soundRack:
      path: /Audio/Weapons/Guns/Bolt/lmg_bolt_closed.ogg
      params:
        variation: 0.05
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/rifle_load.ogg
      params:
        variation: 0.05
  - type: Item
    size: Large
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Grenade/grenade_cartridge.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-4
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: BaseMagazineGrenade
  id: MagazineGrenadeEmpty
  name: 枪榴弹 | grenade cartridge
  components:
  - type: BallisticAmmoProvider

- type: entity
  parent: BaseMagazineGrenade
  id: MagazineGrenadeFrag
  name: 破片手榴弹弹壳 | frag grenade cartridge
  components:
  - type: BallisticAmmoProvider
    proto: GrenadeFrag

- type: entity
  parent: BaseMagazineGrenade
  id: MagazineGrenadeEMP
  name: 电磁脉冲手榴弹弹匣 | EMP grenade cartridge
  components:
  - type: BallisticAmmoProvider
    proto: GrenadeEMP

- type: entity
  parent: BaseMagazineGrenade
  id: MagazineGrenadeFlash
  name: 闪光弹弹匣 | flash grenade cartridge
  components:
  - type: BallisticAmmoProvider
    proto: GrenadeFlash

- type: entity
  parent: BaseMagazineGrenade
  id: MagazineGrenadeBlast
  name: 爆裂榴弹弹筒 | blast grenade cartridge
  components:
  - type: BallisticAmmoProvider
    proto: GrenadeBlast

- type: entity
  parent: BaseMagazineGrenade
  id: MagazineGrenadeBaton
  name: 警棍榴弹弹药 | baton grenade cartridge
  components:
  - type: BallisticAmmoProvider
    proto: GrenadeBaton
