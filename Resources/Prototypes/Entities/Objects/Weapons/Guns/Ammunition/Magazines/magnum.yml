- type: entity
  abstract: true
  parent: [BaseMagazinePistol, BaseSecurityContraband]
  id: BaseMagazineMagnum
  name: 手枪弹匣（.45马格南） | pistol magazine (.45 magnum)
  components:
  - type: Tag
    tags:
    - MagazineMagnum
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CartridgeMagnum
    capacity: 7

- type: entity
  parent: BaseMagazineMagnum
  id: MagazineMagnumEmpty
  name: 手枪弹匣（.45马格南任意） | pistol magazine (.45 magnum any)
  suffix: empty
  description: 7发单排弹匣，适用于大口径手枪。 | 7-round single stack magazine for large-caliber pistols.
  components:
  - type: BallisticAmmoProvider
    proto:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  parent: BaseMagazineMagnum
  id: MagazineMagnum
  name: 手枪弹匣（.45马格南） | pistol magazine (.45 magnum)
  description: 7发单排弹匣，适用于大口径手枪。用于容纳通用动能弹药。 | 7-round single stack magazine for large-caliber pistols. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnum
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  parent: BaseMagazineMagnum
  id: MagazineMagnumPractice
  name: 手枪弹匣（.45马格南练习弹） | pistol magazine (.45 magnum practice)
  description: 7发单排弹匣，适用于大口径手枪。用于装填无害练习弹药。 | 7-round single stack magazine for large-caliber pistols. Intended to hold harmless practice ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnumPractice
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: stripe
      color: "#dbdbdb"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#dbdbdb"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#dbdbdb"

