- type: entity
  abstract: true
  parent: [BaseItem, BaseSecurityContraband]
  id: BaseMagazineShotgun
  name: 弹药鼓（.50口径弹药） | ammo drum (.50 shells)
  components:
  - type: Tag
    tags:
    - MagazineShotgun
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - ShellShotgun
    capacity: 8
    soundRack:
      path: /Audio/Weapons/Guns/Cock/smg_cock.ogg
  - type: Item
    size: Small
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#d73307"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#d73307"
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Shotgun/m12.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  id: MagazineShotgunEmpty
  name: 弹药鼓（.50口径弹壳任意） | ammo drum (.50 shells any)
  suffix: empty
  description: 一些军用级自动霰弹枪使用的大型弹鼓。 | A large drum magazine used by some military-grade automatic shotguns.
  parent: BaseMagazineShotgun
  components:
  - type: BallisticAmmoProvider
    proto:

- type: entity
  parent: BaseMagazineShotgun
  id: MagazineShotgun
  name: 弹药鼓（.50弹丸） | ammo drum (.50 pellet)
  description: 一些军用级自动霰弹枪使用的大型弹鼓。用于装填通用动能弹药。 | A large drum magazine used by some military-grade automatic shotguns. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: ShellShotgun
  - type: Sprite
    layers:
    - state: pellets
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#ba7710"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#ba7710"

