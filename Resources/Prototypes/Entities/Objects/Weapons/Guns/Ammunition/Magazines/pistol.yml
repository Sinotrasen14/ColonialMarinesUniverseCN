- type: entity
  parent: BaseMagazinePistol
  id: MagazinePistol
  name: 手枪弹匣（.35自动） | pistol magazine (.35 auto)
  description: 10发单排手枪弹匣。用于容纳通用动能弹药。 | 10-round single-stack magazine for pistols. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistol
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
