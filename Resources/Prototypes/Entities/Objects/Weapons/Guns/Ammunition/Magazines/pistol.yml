- type: entity
  parent: [BaseItem, BaseSecurityContraband]
  id: MagazinePistolSubMachineGunTopMounted
  name: WT550弹匣（.35自动上置式） | WT550 magazine (.35 auto top-mounted)
  description: WT550冲锋枪的非传统30发上置式弹匣。用于容纳通用动能弹药。 | Unconventional 30-round top feeding magazine for the WT550 SMG. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: Item
    storedRotation: 90
  - type: Tag
    tags:
    - MagazinePistolSubMachineGunTopMounted
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: CartridgePistol
    whitelist:
      tags:
      - CartridgePistol
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Pistol/smg_mag_top_mounted.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-1
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container

