# Empty mags
- type: entity
  abstract: true
  parent: [BaseItem, BaseSecurityContraband]
  id: BaseMagazineLightRifle
  name: "弹匣（.30步枪） | magazine (.30 rifle)"
  components:
  - type: Tag
    tags:
    - MagazineLightRifle
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CartridgeLightRifle
    proto: CartridgeLightRifle
    capacity: 30
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

# Magazines
- type: entity
  parent: BaseMagazineLightRifle
  id: MagazineLightRifleBox
  name: "L6轻机枪弹链盒（.30步枪弹） | L6 SAW magazine box (.30 rifle)"
  description: 装有100发.30步枪弹链的弹盒，供L6等轻机枪使用。用于存放通用动能弹药。 | Box containing a 100-round belt of linked .30 rifle rounds, used by light machine guns such as the L6. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: Tag
    tags:
    - MagazineLightRifleBox
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifle
    capacity: 100
  - type: Item
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_box.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: BaseMagazineLightRifle
  id: MagazineLightRifle
  name: "弹匣（.30步枪） | magazine (.30 rifle)"
  description: 战斗步枪用30发弧形双排弹匣。用于装填通用动能弹药。 | Curved 30-round double stack magazine for combat rifles. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifle
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  parent: MagazineLightRifle
  id: MagazineLightRifleEmpty
  name: "弹匣（.30步枪通用） | magazine (.30 rifle any)"
  suffix: empty
  description: 弧形30发双排弹匣，用于战斗步枪。 | Curved 30-round double stack magazine for combat rifles.
  components:
  - type: BallisticAmmoProvider
    proto:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  parent: BaseMagazineLightRifle
  id: MagazineLightRiflePractice
  name: "弹匣（.30步枪练习用） | magazine (.30 rifle practice)"
  description: 弧形30发双排弹匣，用于战斗步枪。旨在装填无害练习弹药。 | Curved 30-round double stack magazine for combat rifles. Intended to hold harmless practice ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeLightRiflePractice
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: stripe
      color: "#dbdbdb"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#dbdbdb"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#dbdbdb"

