- type: entity
  abstract: true
  parent: [BaseCartridge, BaseSecurityContraband]
  id: BaseCartridgeMagnum
  name: 弹匣（.45马格南） | cartridge (.45 magnum)
  components:
  - type: Tag
    tags:
    - CartridgeMagnum
  - type: CartridgeAmmo
    proto: BulletMagnum
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: BaseCartridgeMagnum
  id: CartridgeMagnum
  name: 弹药（.45马格南） | cartridge (.45 magnum)
  description: 重型马格南弹药，主要由左轮手枪使用。标准动能弹药在大多数情况下常见且实用。 | Heavy magnum cartridge mostly used by revolvers. Standard kinetic ammunition is common and useful in most situations.
  components:
  - type: CartridgeAmmo
    proto: BulletMagnum

- type: entity
  parent: BaseCartridgeMagnum
  id: CartridgeMagnumPractice
  name: 弹药（.45马格南练习弹） | cartridge (.45 magnum practice)
  description: 重型马格南弹药，主要由左轮手枪使用。练习弹发射粉笔弹丸，只会造成轻微刺痛，除此之外不会造成持久伤害。 | Heavy magnum cartridge mostly used by revolvers. Practice ammunition fires a chalk projectile that stings a little, but otherwise causes no lasting damage.
  components:
  - type: CartridgeAmmo
    proto: BulletMagnumPractice
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#dbdbdb"

- type: entity
  parent: BaseCartridgeMagnum
  id: CartridgeMagnumIncendiary
  name: 弹药（.45马格南燃烧弹） | cartridge (.45 magnum incendiary)
  description: 重型马格南弹药，主要由左轮手枪使用。燃烧弹含有自燃化合物，可使目标着火。 | Heavy magnum cartridge mostly used by revolvers. Incendiary ammunition contains a self-igniting compound that sets targets ablaze.
  components:
  - type: CartridgeAmmo
    proto: BulletMagnumIncendiary
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#ff6e52"

- type: entity
  parent: BaseCartridgeMagnum
  id: CartridgeMagnumAP
  name: .45马格南穿甲弹 | cartridge (.45 magnum armor-piercing)
  description: 重型马格南弹药，主要由左轮手枪使用。穿甲弹以其能够直接穿透防弹衣的能力而闻名。 | Heavy magnum cartridge mostly used by revolvers. Armor-piercing ammunition is renowned for its ability to cut straight through body armor.
  components:
  - type: CartridgeAmmo
    proto: BulletMagnumAP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#0a0a0a"

- type: entity
  parent: BaseCartridgeMagnum
  id: CartridgeMagnumUranium
  name: 弹药（.45马格南铀弹） | cartridge (.45 magnum uranium)
  description: 重型马格南弹药，主要由左轮手枪使用。铀弹将子弹的铅芯替换为裂变材料，从内部辐照目标。 | Heavy magnum cartridge mostly used by revolvers. Uranium ammunition replaces the lead core of the bullet with fissile material, irradiating targets from the inside.
  components:
  - type: CartridgeAmmo
    proto: BulletMagnumUranium
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#65fe08"
