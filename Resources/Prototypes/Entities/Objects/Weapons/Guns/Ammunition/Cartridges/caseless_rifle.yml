- type: entity
  abstract: true
  parent: [BaseCartridge, BaseSecurityContraband]
  id: BaseCartridgeCaselessRifle
  name: 弹匣（.25无壳弹） | cartridge (.25 caseless)
  components:
  - type: Tag
    tags:
    - CartridgeCaselessRifle
  - type: CartridgeAmmo
    deleteOnSpawn: true
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 10

- type: entity
  parent: BaseCartridgeCaselessRifle
  id: CartridgeCaselessRifle
  name: 弹药（.25无壳弹） | cartridge (.25 caseless)
  description: 一种使用无壳技术的小口径弹药，摒弃了传统的黄铜弹壳，转而采用硬化发射药。标准动能弹药在大多数情况下都很常见且实用。 | A small caliber utilizing caseless technology, omitting conventional brass casing in favor of hardened propellant. Standard kinetic ammunition is common and useful in most situations.
  components:
  - type: CartridgeAmmo
    proto: BulletCaselessRifle

- type: entity
  parent: BaseCartridgeCaselessRifle
  id: CartridgeCaselessRiflePractice
  name: 弹药（.25无壳练习弹） | cartridge (.25 caseless practice)
  description: 一种采用无壳技术的小口径弹药，去除了传统的黄铜弹壳，改用硬化推进剂。练习弹发射的粉笔弹丸只会造成轻微刺痛，除此之外不会造成持久伤害。 | A small caliber utilizing caseless technology, omitting conventional brass casing in favor of hardened propellant. Practice ammunition fires a chalk projectile that stings a little, but otherwise causes no lasting damage.
  components:
  - type: CartridgeAmmo
    proto: BulletCaselessRiflePractice
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#dbdbdb"
