- type: entity
  abstract: true
  parent: BaseCartridge
  id: BaseShellShotgun
  name: 外壳（.50） | shell (.50)
  components:
  - type: Tag
    tags:
    - ShellShotgun
  - type: CartridgeAmmo
    soundEject:
      collection: ShellEject
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/shotgun_shell.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: [BaseShellShotgun, BaseSecurityBartenderContraband]
  id: ShellShotgunBeanbag
  name: 霰弹（.50豆袋弹） | shell (.50 beanbag)
  description: 大多数现代霰弹枪使用的标准弹药。豆袋弹包含一枚非致命弹丸，可使目标眩晕。 | The standard cartridge used by most modern shotguns. Beanbag ammunition contains a single less-than-lethal projectile that can stun targets.
  components:
  - type: Tag
    tags:
    - ShellShotgun
    - ShellShotgunLight
  - type: Sprite
    layers:
    - state: beanbag
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: PelletShotgunBeanbag
  - type: SpentAmmoVisuals
    state: "beanbag"

- type: entity
  parent: [BaseShellShotgun, BaseSecurityContraband]
