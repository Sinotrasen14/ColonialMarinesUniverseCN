- type: entity
  parent: [SolutionAmmo, SolutionToolVeryTiny, BaseShellShotgun, BaseSecurityContraband]
  id: ShellTranquilizer
  name: 霰弹（.50麻醉弹） | shell (.50 tranquilizer)
  description: 大多数现代霰弹枪使用的标准弹药。麻醉弹包含一枚弹道注射器，装有强效镇静剂，能无害地让目标入睡。 | The standard cartridge used by most modern shotguns. Tranquilizer ammunition contains a single ballistic syringe loaded with a strong sedative that harmlessly puts targets to sleep.
  components:
  - type: Tag
    tags:
    - ShellShotgun
    - ShellShotgunLight
  - type: Sprite
    layers:
    - state: tranquilizer
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: PelletShotgunTranquilizer
  - type: ChemicalAmmo
  - type: Solution
    solution:
      reagents:
      - ReagentId: ChloralHydrate
        Quantity: 7.5
  - type: SolutionTransfer
    maxTransferAmount: 7
  - type: SpentAmmoVisuals
    state: "tranquilizer"

- type: entity
  parent: [BaseShellShotgun, BaseSecurityContraband]
  id: ShellShotgunImprovised
  name: 自制霰弹 | improvised shotgun shell
  description: 一种自制的霰弹，装填有玻璃碎片。效果出奇地好，但散布范围太广，你连谷仓的宽面都打不中。 | A homemade shotgun shell loaded with chunks of glass shrapnel. Surprisingly effective, but the spread is so wide that you couldn't hit the broad side of a barn.
  components:
  - type: Tag
    tags:
    - ShellShotgun
    - ShellShotgunLight
  - type: Sprite
    layers:
    - state: improvised
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Construction
    graph: ImprovisedShotgunShellGraph
    node: shell
  - type: CartridgeAmmo
    proto: PelletShotgunImprovisedSpread
  - type: SpentAmmoVisuals
    state: "improvised"

- type: entity
  parent: [BaseShellShotgun, BaseSecurityContraband]
  id: ShellShotgunUranium
  name: 铀制霰弹 | uranium shotgun shell
  description: 大多数现代霰弹枪使用的标准弹药。铀制弹药将弹丸的铅芯替换为裂变材料，从内部对目标进行辐射。 | The standard cartridge used by most modern shotguns. Uranium ammunition replaces the lead core of the pellets with fissile material, irradiating targets from the inside.
  components:
  - type: Sprite
    layers:
    - state: depleted-uranium
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: PelletShotgunUraniumSpread
  - type: SpentAmmoVisuals
    state: "depleted-uranium"
