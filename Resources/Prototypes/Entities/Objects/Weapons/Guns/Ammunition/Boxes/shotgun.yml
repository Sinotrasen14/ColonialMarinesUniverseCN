- type: entity
  abstract: true
  parent: BaseItem
  id: BaseAmmoProvider
  components:
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Item
    size: Normal
  - type: Sprite
    sprite: Objects/Storage/boxes.rsi

- type: entity
  abstract: true
  parent: BaseAmmoProvider
  id: AmmoProviderShotgunShell
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/shotgun.rsi
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - ShellShotgun
    capacity: 16
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance

# Shotgun Shells
- type: entity
  parent: AmmoProviderShotgunShell
  id: BoxBeanbag
  name: 弹药盒（.50豆袋弹） | ammunition box (.50 beanbag)
  description: 一个装有.50霰弹的纸板盒。用于盛放非致命性豆袋弹药。 | A cardboard box of .50 shotgun shells. Intended to hold less-than-lethal beanbag ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: ShellShotgunBeanbag
  - type: MagazineVisuals
    magState: mag-beanbag
    steps: 5
    zeroVisible: false
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-beanbag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: beanbag

