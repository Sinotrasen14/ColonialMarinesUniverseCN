- type: entity
  name: 基础武器左轮手枪 | BaseWeaponRevolver
  parent: BaseItem
  id: BaseWeaponRevolver
  description: 一把砰砰作响的左轮手枪。 | A rooty tooty point and shooty.
  abstract: true
  components:
  - type: Sprite
    state: icon
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
    storedOffset: 0,-6
  - type: Tag
    tags:
    - Sidearm
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/deckard.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: AmmoCounter
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 1.5
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
  - type: UseDelay
    delay: 0.66
  - type: ContainerContainer
    containers:
      revolver-ammo: !type:Container
  - type: RevolverAmmoProvider
    whitelist:
      tags:
      - CartridgeMagnum
      - SpeedLoaderMagnum
    proto: CartridgeMagnum
    capacity: 6
    chambers: [true, true, true, true, true, true]
    ammoSlots: [null, null, null, null, null, null]
    soundEject:
      path: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg
  - type: StaticPrice
    price: 500

- type: entity
  name: 戴克 | Deckard
  parent: [BaseWeaponRevolver, BaseSecurityCommandContraband]
  id: WeaponRevolverDeckard
  description: 一把精美加工的定制左轮手枪。当没有时间进行沃伊特-坎普夫测试时使用。装填5发.45马格南子弹。 | A beautifully machined, custom-built revolver. Used when there is no time for the Voight-Kampff test. Loads 5 rounds of .45 magnum.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/deckard.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-3
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Gun
    fireRate: 2
  - type: RevolverAmmoProvider
    capacity: 5
    chambers: [true, true, true, true, true]
    ammoSlots: [null, null, null, null, null]
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 1500

- type: entity
  name: 督察 | Inspector
  parent: [BaseWeaponRevolver, BaseSecurityContraband]
  id: WeaponRevolverInspector
  description: 由多家公司制造的双动左轮手枪。在民用市场上很容易买到，因此成为私家侦探的热门选择。光是握着它就让你觉得自己很幸运。可装填6发.45马格南子弹。 | A double-action revolver manufactured by various companies. It is readily available on the civilian market, making it a popular choice among private investigators. You feel lucky just holding it. Loads 6 rounds of .45 magnum.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/inspector.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/inspector.rsi
  - type: Item
    storedOffset: 0,-2
  - type: RevolverAmmoProvider
    capacity: 6
    chambers: [true, true, true, true, true, true]
    ammoSlots: [null, null, null, null, null, null]
  - type: StealTarget
    stealGroup: OfficerHandgun

- type: entity
  name: 马特巴 | Mateba
  parent: [BaseWeaponRevolver, BaseMajorContraband]
  id: WeaponRevolverMateba
  description: 一把由纳米传思精英、近乎神话般的“死亡小队”特遣队使用的现代左轮手枪。其独特的扳机结构和枪管位置使其能够以极高的射速开火，同时将枪口上跳降至最低。许多人曾直视过这根枪管，但鲜有人能活着讲述此事。装填6发.45马格南子弹。 | A modern revolver used by Nanotrasen’s elite, near mythical ‘Death Squad’ task force. Its unique trigger action and barrel placement enable a high fire rate with minimal muzzle flip. Many have looked down this barrel, but few have lived to tell of it. Loads 6 rounds of .45 magnum.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/mateba.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/mateba.rsi
  - type: Item
    storedOffset: 0,-3
  - type: Gun
    fireRate: 3
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg

- type: entity
  parent: WeaponRevolverMateba
  id: WeaponRevolverMatebaAP # For deathsquad
  suffix: armor-piercing
  components:
  - type: RevolverAmmoProvider
    proto: CartridgeMagnumAP

- type: entity
  name: Python
  parent: [BaseWeaponRevolver, BaseSyndicateContraband]
  id: WeaponRevolverPython
  description: 辛迪加制造的一把威力强大的双动左轮手枪。声音响亮、外观张扬，非常适合任何想要彰显存在感的特工。装填6发.45马格南子弹。 | A powerful double-action revolver manufactured by the Syndicate. Loud and flashy, perfect for any agent looking to make a statement. Loads 6 rounds of .45 magnum.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/python.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/python.rsi
  - type: Item
    storedOffset: 0,-2
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 2
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
      params:
        volume: 2.25
  - type: StaticPrice
    price: 1500 # Botany can shit these out like candy, but let's see how it goes

- type: entity
  parent: WeaponRevolverPython
  id: WeaponRevolverPythonAP # For the uplink.
  suffix: armor-piercing
  components:
  - type: RevolverAmmoProvider
    proto: CartridgeMagnumAP


- type: entity
  name: 海盗左轮手枪 | pirate revolver
  parent: [BaseWeaponRevolver, BaseMajorContraband]
  id: WeaponRevolverPirate
  description: 一把由太空海盗手工制作的粗糙单动左轮手枪。老旧且布满锈迹，却不知怎地仍能使用。装填5发.45马格南子弹。 | A crude single-action revolver handmade by a space pirate. Old and covered in rust, it somehow still works. Loads 5 rounds of .45 magnum.
