- type: entity
  name: 弓 | bow
  parent: [BaseItem, BaseMinorContraband]
  id: BaseBow
  description: 最初的弓弦嘣嘣、瞄准发射的玩意儿。 | The original rooty tooty point and shooty.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Bow/bow.rsi
  - type: Item
    size: Normal
  - type: Clothing
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Wieldable
    wieldSound:
      path: /Audio/Items/bow_pull.ogg
  - type: UseDelay
    delay: 1
  - type: GunRequiresWield
  - type: Gun
    minAngle: 0
    maxAngle: 5
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: BulletMiss
    soundEmpty:
  - type: ItemSlots
    slots:
      projectiles:
        name: 弹射物 | Projectiles
        startingItem:
        insertSound: /Audio/Weapons/Guns/Misc/arrow_nock.ogg
        whitelist:
          tags:
          - Arrow
          - Plunger
  - type: ContainerContainer
    containers:
      projectiles: !type:ContainerSlot
  - type: ContainerAmmoProvider
    container: projectiles

- type: entity
  id: BowImprovised
  parent: BaseBow
  name: 临时短弓 | improvised shortbow
  components:
  - type: Sprite
    layers:
    - state: unwielded
      map: [base]
    - state: unwielded-arrow
      map: [arrow]
      visible: false
    - state: unwielded-plunger
      map: [plunger]
      visible: false
  # to elucidate whats intended here:
  # arrow is inserted -> ItemMapper sets layer with map `arrow` to visible
  # bow is wielded -> generic vis sets states of layers with map `arrow` and `base`
  # arrow is removed -> itemmapper sets layer with map `arrow` to invisible
  - type: Appearance
  - type: ItemMapper
    spriteLayers:
    - arrow
    - plunger
    mapLayers:
      arrow:
        whitelist:
          tags:
          - Arrow
      plunger:
        whitelist:
          tags:
          - Plunger
  - type: GenericVisualizer
    visuals:
      enum.WieldableVisuals.Wielded:
        arrow:
          true: {state: wielded-arrow}
          false: {state: unwielded-arrow}
        plunger:
          true: {state: wielded-plunger}
          false: {state: unwielded-plunger}
        base:
          true: {state: wielded}
          false: {state: unwielded}
  - type: Construction
    graph: ImprovisedBow
    node: ImprovisedBow
