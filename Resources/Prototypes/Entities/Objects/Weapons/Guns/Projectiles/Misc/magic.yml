- type: entity
  parent: BulletRocket
  id: ProjectileFireball
  categories: [HideSpawnMenu]
  name: 火球 | fireball
  description: 你最好赶紧滚开。 | You better GITTAH WEIGH.
  components:
  - type: PointLight
    color: "#E25822"
    radius: 2.0
    energy: 5.0
  - type: Projectile
    damage:
      types:
        Heat: 10
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: fireball
      shader: unshaded
  - type: Explosive
    explosionType: Default
    maxIntensity: 40
    intensitySlope: 6
    totalIntensity: 200
    maxTileBreak: 0
  - type: IgnitionSource
    temperature: 400
    ignited: true
  - type: IgniteOnCollide
    fireStacks: 0.35

- type: entity
  parent: BaseBulletTrigger
  id: ProjectileDragonsBreath
  categories: [HideSpawnMenu]
  name: 龙息 | dragon's breath
  description: 尽量不要被烤焦。 | Try not to get toasted.
  components:
  - type: PointLight
    color: "#E25822"
    radius: 3.0
    energy: 5.0
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: fireball
      shader: unshaded
  - type: IgnitionSource
    temperature: 1000
    ignited: true
  - type: RepeatingTrigger
    delay: 0.5 # line of fire as well as if it hits something
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: FireBomb
    totalIntensity: 5 # low intensity, the point is to burn attackers not to break open walls, dragons can just eat them
    intensitySlope: 1
    maxIntensity: 3
    canCreateVacuum: false
    deleteAfterExplosion: false
    repeatable: true
  - type: TimedDespawn
    lifetime: 5

- type: entity
  parent: ProjectileFireball
  id: ProjectileAnomalyFireball
  categories: [HideSpawnMenu]
  name: 火球 | fireball
  description: 悬浮的火球。 | Hovering blob of flame.
  components:
  - type: TimedDespawn
    lifetime: 30
  - type: Explosive
    explosionType: Default
    maxIntensity: 100
    intensitySlope: 0.1
    totalIntensity: 0.3
    maxTileBreak: 0

- type: entity
  parent: ClosetSteelBase
  id: ProjectileLocker
  categories: [HideSpawnMenu]
  name: 被诅咒的储物柜 | cursed locker
  description: 一个被诅咒的魔法储物柜！你能抵挡住诱惑吗？ | A cursed magical locker! Can you resist?
  components:
  - type: ResistLocker
    resistTime: 30
  - type: StoreOnCollide
    lockOnCollide: true
    disableWhenFirstOpened: true
    whitelist:
      components:
      - MobState
  - type: LockVisuals
    stateLocked: cursed_door
    stateUnlocked: decursed_door
  - type: Lock
    breakOnAccessBreaker: false
  - type: AccessReader
    access: [["Wizard"]]
    breakOnAccessBreaker: false
  - type: Projectile
    deleteOnCollide: false
    onlyCollideWhenShot: true
    damage:
      types: {}
  - type: Sprite
    noRot: true
    sprite: Structures/Storage/closet.rsi
    layers:
    - state: cursed
      map: ["enum.StorageVisualLayers.Base"]
    - state: decursed_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      map: ["enum.PaperLabelVisuals.Layer"]
    - state: cursed_door
      map: ["enum.LockVisualLayers.Lock"]
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
  #TODO: Will have to eventually make a custom visualizer for cursed lockers
  - type: EntityStorageVisuals
    stateBaseClosed: decursed
    stateDoorOpen: decursed_open
    stateDoorClosed: decursed_door
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        density: 75
        mask:
        - MachineMask
        layer:
        - MachineLayer
      projectile:
        shape: !type:PhysShapeAabb
          bounds: "-0.15,-0.45,0.15,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 0.6
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: false

- type: entity
  abstract: true
  parent: BaseBullet
  id: ProjectilePolyboltBase
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: spell
      color: '#00FF00'
  - type: Projectile
    damage:
      types:
        Poison: 5
  - type: TriggerOnCollide
    fixtureID: projectile
    # Projectile.DeleteOnCollide is true, but allow this to hit multiple entities if they're
    # stacked up (they will all trigger a collide), so this isn't frustrating to use
    maxTriggers:
  - type: PolymorphOnTrigger
    targetUser: true

