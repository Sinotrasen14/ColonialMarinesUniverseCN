  id: WeaponLauncherAdmemeMeteorLarge
  name: 流星发射器 | meteor launcher
  suffix: Admeme
  description: 它发射大型流星。 | It fires large meteors.
  components:
  - type: BallisticAmmoProvider
    proto: MeteorMedium

- type: entity
  parent: WeaponLauncherAdmemeMeteorLarge
  id: WeaponLauncherAdmemeImmovableRodSlow
  name: 固定杆发射器 | immovable rod launcher
  suffix: Admeme
  description: 它发射缓慢的固定杆。 | It fires slow immovable rods.
  components:
  - type: BallisticAmmoProvider
    proto: ImmovableRodSlow
