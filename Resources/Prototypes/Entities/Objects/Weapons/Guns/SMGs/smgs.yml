- type: entity
  name: WT550
  parent: [BaseWeaponSubMachineGun, BaseSecurityContraband]
  id: WeaponSubMachineGunWt550
  description: 一款真正独特的枪械，WT550由纳米传思轻武器部门设计，是一款可完全单手控制的紧凑型冲锋枪。它内置异乎寻常的后坐缓冲器，并使用特殊的顶部安装式.35弹匣供弹。 | A truly unique firearm, the WT550 was designed by Nanotrasen's Small Arms Division as a compact submachine gun fully controllable with one hand. It contains an exotic internal recoil buffer and feeds from special top-mounted .35 magazines.
  components:
  - type: Sprite
