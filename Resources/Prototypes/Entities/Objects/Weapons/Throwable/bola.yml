- type: entity
  abstract: true
  parent: [BaseItem, BaseSecurityContraband]
  id: BaseBola
  name: 球 | bola
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: Objects/Weapons/Throwable/bola.rsi
    state: icon
  - type: EmitSoundOnThrow
    sound: /Audio/Weapons/bolathrow.ogg
  - type: EmitSoundOnLand
    sound: /Audio/Effects/snap.ogg
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: DamageOnLand
    damage:
      types:
        Blunt: 5
  - type: Ensnaring
    freeTime: 2.0
    breakoutTime: 3.5 #all bola should generally be fast to remove
    walkSpeed: 0.5 #makeshift bola shouldn't slow too much
    sprintSpeed: 0.5
    staminaDamage: 0 # anything but this is gamebreaking
    canThrowTrigger: true
    canMoveBreakout: true
    maxEnsnares: 1
  - type: LandAtCursor
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.4
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2

- type: entity
  parent: BaseBola
  id: Bola
  name: 简易套索 | makeshift bola
  description: 一个简易套索，用一些备用镣铐和金属拼凑而成。看起来撑不了多久。 | A makeshift bola, cobbled together with some spare cuffs and metal. It doesn't look like it's going to stay together for very long.
  components:
  - type: Construction
    graph: Bola
    node: bola

- type: entity
  parent: BaseBola
  id: SecurityBola
  name: 战术流星锤 | tactical bola
  description: 一种流星锤，由钢制锚钩通过钢丝绳连接而成。可靠且可重复使用。 | A bola, comprised of steel anchors linked together with a wire cable. Reliable and reusable.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Throwable/securitybola.rsi
    state: icon
  - type: DamageOnLand
    damage:
      types:
        Blunt: 0 #reusable, in contrast to makeshift
  - type: Ensnaring
    freeTime: 2.5 #slightly slower free time than makeshift
    breakoutTime: 4.0 #slightly slower breakout time than makeshift
    walkSpeed: 0.5
    sprintSpeed: 0.5
    staminaDamage: 0 # anything but this is gamebreaking
    canThrowTrigger: true
    canMoveBreakout: true
    maxEnsnares: 1
