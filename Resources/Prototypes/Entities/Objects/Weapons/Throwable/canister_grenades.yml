- type: entity
  parent: [VolatileGrenadeBase, TimerGrenadeBase, BaseSecurityContraband]
  id: SmokeGrenade
  name: 烟雾弹 | smoke grenade
  description: 一种战术手雷，使用时会释放出大量持久不散的烟雾。 | A tactical grenade that releases a large, long-lasting cloud of smoke when used.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/smoke.rsi
  - type: SmokeOnTrigger
    keysIn:
    - timer
    duration: 30
    spreadAmount: 50
  - type: EmitSoundOnTrigger
    keysIn:
    - timer
    sound: /Audio/Items/smoke_grenade_smoke.ogg
    positional: true
  - type: DeleteOnTrigger
    keysIn:
    - timer
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Items/smoke_grenade_prime.ogg

- type: entity
  parent: [BaseCivilianContraband, SmokeGrenade]
  id: CleanerGrenade
  name: 清洁手雷 | cleanade
  description: 清洁工专用手雷，释放一大片太空清洁剂泡沫。 | Special grenade for janitors, releasing large cloud of space cleaner foam.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/janitor.rsi
  - type: SmokeOnTrigger
    keysIn:
    - timer
    duration: 15
    spreadAmount: 50
    smokePrototype: Foam
    solution:
      reagents:
      - ReagentId: SpaceCleaner
        Quantity: 30
  - type: Tag
    tags:
    - CleanerGrenade

- type: entity
  parent: SmokeGrenade
  id: TearGasGrenade
  name: 催泪瓦斯手榴弹 | tear gas grenade
  description: 一种防暴催泪瓦斯手榴弹。会引起刺激、疼痛，并让你哭得死去活来。 | A riot control tear gas grenade. Causes irritation, pain and makes you cry your eyes out.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/tear_gas.rsi
  - type: SmokeOnTrigger
    keysIn:
    - timer
    duration: 10
    spreadAmount: 30
    smokePrototype: TearGasSmokeWhite
    solution:
      reagents:
      - ReagentId: TearGas
        Quantity: 20

- type: entity
  parent: [BaseEngineeringContraband, SmokeGrenade]
  id: MetalFoamGrenade
  name: 金属泡沫手榴弹 | metal foam grenade
  description: 一种应急工具，用于通过特殊快干金属泡沫修补船体破损。几乎和真正的地板一样好！ | An emergency tool used for patching hull breaches with special quick-set metal foam. Almost as good as real floors!
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/metalfoam.rsi
  - type: TimerTrigger
    delay: 5
  - type: SmokeOnTrigger
    keysIn:
    - timer
    duration: 10
    spreadAmount: 20
    smokePrototype: AluminiumMetalFoam
  - type: StaticPrice
    price: 350

- type: entity
  parent: [BaseEngineeringContraband, VolatileGrenadeBase, TimerGrenadeBase]   # Prevent inheriting DeleteOnTrigger from SmokeGrenade
  id: AirGrenade
  name: 空气手雷 | air grenade
  description: 一种特殊的固态化学手雷，用于向封闭区域快速释放标准空气。最多可填充30格！ | A special solid state chemical grenade used for quickly releasing standard air into a spaced area. Fills up to 30 tiles!
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/airboom.rsi
  - type: EmitSoundOnTrigger
    keysIn:
    - timer
    sound: /Audio/Items/smoke_grenade_smoke.ogg
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Items/smoke_grenade_prime.ogg
  - type: TimerTrigger
    delay: 3
  - type: ReleaseGasOnTrigger
    keysIn:
    - timer
    removeFraction: 0.25
    air:
      volume: 1000
      moles: # Target is 3117.84 mols total for filling 30 tiles (goal is 101.325 kPa @ 20C)
        Oxygen: 654.7464 # oxygen
        Nitrogen: 2463.0936 # nitrogen
      temperature: 293.15
  - type: StaticPrice
    price: 350
  - type: GenericVisualizer
    visuals:
      enum.ReleaseGasOnTriggerVisuals.Key:
        enabled:
          true: {state: active}
          false: {state: spent}
  - type: RemoveComponentsOnTrigger # should prevent it from being re-triggered
    keysIn:
    - timer
    triggerOnce: true
    components:
    - type: TriggerOnUse
    - type: TimerTrigger
