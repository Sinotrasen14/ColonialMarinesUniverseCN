- type: entity
  id: HandTeleporter
  parent: [BaseItem, BaseGrandTheftContraband]
  name: 手提传送器 | hand teleporter
  description: "纳米传斯标志性物品——最顶尖的蓝空间科技。使用说明：使用一次创建一个随机传送的传送门。再次使用将其链接到你当前位置的传送门。再次使用清除所有传送门。 | A Nanotrasen signature item--only the finest bluespace tech. Instructions: Use once to create a portal which teleports at random. Use again to link it to a portal at your current location. Use again to clear all portals."
  components:
  - type: Sprite
    sprite: /Textures/Objects/Devices/hand_teleporter.rsi
    layers:
    - state: icon
  - type: HandTeleporter
  - type: Tag
    tags:
    - HighRiskItem
    - FitInTeleporterConsole
  - type: StealTarget
    stealGroup: HandTeleporter

- type: entity
  id: HandTeleporterAdmeme
  suffix: Admeme
  parent: BaseItem
  name: 跨维度传送器 | interdimensional teleporter
  description: 允许你打开不受距离限制的稳定传送门。 | Allows you to open stable portal gates that are not limited by distance.
  components:
  - type: Sprite
    sprite: /Textures/Objects/Devices/hand_teleporter.rsi
    layers:
    - state: icon
      color: green
  - type: Tag
    tags:
    - FitInTeleporterConsole
  - type: HandTeleporter
    allowPortalsOnDifferentGrids: true
    allowPortalsOnDifferentMaps: true
    firstPortalPrototype: PortalGatewayBlue
    secondPortalPrototype: PortalGatewayOrange
