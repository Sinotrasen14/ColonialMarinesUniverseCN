- type: entity
  parent: [DoorRemoteCanEletrifyDoors, BaseCommandContraband]
  id: DoorRemoteAll
  name: 超级门遥控器 | super door remote
  description: 一种可以远程开关门闩的小装置。这个甚至对木门也有效！ | A gadget which can open and bolt doors remotely. This one works even on wooden doors!
  suffix: Admeme
  components:
  - type: Sprite
    layers:
    - state: door_remotebase
    - state: door_remotelightscolour
      color: "#2eba22"
    - state: door_remotescreencolour
      color: "#22871a"
  - type: DoorRemote
    includeUserAccess: true
    requireInRangeUnoccluded: false
    requireTagWhitelist: false
  - type: Access
    groups:
    - AllAccess
    tags:
    - CentralCommand
    - NuclearOperative
    - SyndicateAgent
    - Wizard
    - Xenoborg

