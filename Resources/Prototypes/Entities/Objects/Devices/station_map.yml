- type: entity
  parent: [BaseItem, BaseItemDestructible]
  id: BaseHandheldStationMap
  name: 车站地图 | station map
  description: 显示当前车站的读数。 | Displays a readout of the current station.
  abstract: true
  components:
  - type: StationMap
  - type: Sprite
    sprite: Objects/Devices/tablets.rsi
    layers:
    - state: tablet
    - state: generic
      shader: unshaded
  - type: ActivatableUI
    inHandsOnly: true
    singleUser: true
    key: enum.StationMapUiKey.Key
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: UserInterface
    interfaces:
      enum.StationMapUiKey.Key:
        type: StationMapBoundUserInterface

- type: entity
  id: HandheldStationMap
  parent:
  - BaseHandheldStationMap
  - BaseHandheldComputer
  suffix: Handheld

- type: entity
  id: HandheldStationMapEmpty
  parent: HandheldStationMap
  suffix: Handheld, Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

- type: entity
  id: HandheldStationMapUnpowered
  parent: BaseHandheldStationMap
  suffix: Handheld, Always Powered

- type: entity
  parent: HandheldStationMap
  id: HandheldStationMapStatic
  suffix: Handheld, Works Off-Station
  components:
  - type: StationMap
    initializeWithStation: true

- type: entity
  parent: HandheldStationMap
  id: HandheldStationMapNukeops
  name: 目标站点地图 | target station map
  suffix: Handheld, NukeOps
  description: 显示目标站点的读数。 | Displays a readout of the target station.
  components:
  - type: Sprite
    sprite: Objects/Devices/tablets.rsi
    layers:
    - state: tablet
    - state: syndie
      shader: unshaded
  - type: Item
    sprite: Objects/Devices/tablets.rsi
    inhandVisuals:
      left:
      - state: inhand-left-syndie
      right:
      - state: inhand-right-syndie
  - type: StationMap
    showLocation: false
    initializeWithStation: true
  - type: NukeopsStationMap
