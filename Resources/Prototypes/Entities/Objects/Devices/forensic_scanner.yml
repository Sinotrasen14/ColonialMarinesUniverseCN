- type: entity
  name: 法医扫描仪 | forensic scanner
  parent: [BaseItem, BaseSecurityContraband]
  id: ForensicScanner
  description: 一种手持设备，可以扫描物体以获取指纹和纤维。 | A handheld device that can scan objects for fingerprints and fibers.
  components:
  - type: Sprite
    sprite: Objects/Devices/forensic_scanner.rsi
    state: icon
  - type: Item
    size: Small
    storedRotation: 90
  - type: Clothing
    sprite: Objects/Devices/forensic_scanner.rsi
    quickEquip: false
    slots:
    - Belt
  - type: ActivatableUI
    key: enum.ForensicScannerUiKey.Key
    inHandsOnly: true
    requireActiveHand: false
  - type: UserInterface
    interfaces:
      enum.ForensicScannerUiKey.Key:
        type: ForensicScannerBoundUserInterface
  - type: ForensicScanner
  - type: GuideHelp
    guides:
    - Forensics
  - type: StealTarget
    stealGroup: ForensicScanner

- type: entity
  name: 法医扫描报告 | forensic scanner report
  parent: Paper
  id: ForensicReportPaper
  description: 间接证据，充其量而已。 | Circumstantial evidence, at best.
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper_receipt_horizontal
    - state: paper_receipt_horizontal_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_perforated.svg.96dpi.png"
    headerImagePath: "/Textures/Interface/Paper/paper_heading_forensic_scanner.svg.96dpi.png"
    headerMargin: 0.0, 4.0, 0.0, 0.0
    backgroundImageTile: true
    backgroundPatchMargin: 6.0, 0.0, 6.0, 0.0
    contentMargin: 12.0, 0.0, 6.0, 0.0
    maxWritableArea: 368.0, 256.0
  - type: GuideHelp
    guides:
    - Forensics

- type: entity
  parent: ForensicReportPaper
  id: PaperAccessLogs
  name: 访问日志 | access logs
  description: 侦探那台可靠LogProbe打印出来的记录。 | A printout from the detective's trusty LogProbe.
  components:
  - type: PaperVisuals
    headerImagePath:
    headerMargin: 0.0, 0.0, 0.0, 0.0
