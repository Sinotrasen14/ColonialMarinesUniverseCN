- type: entity
  id: MachineParticleAcceleratorEndCapCircuitboard
  parent: BaseMachineCircuitboard
  name: PA端盖板 | PA end cap board
  description: 用于粒子加速器端盖的机器板。 | A machine board for a particle accelerator end cap.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: ParticleAcceleratorEndCapUnfinished
    stackRequirements:
      Glass: 15
      Steel: 15

- type: entity
  id: MachineParticleAcceleratorFuelChamberCircuitboard
  parent: BaseMachineCircuitboard
  name: 粒子加速器燃料室板 | PA fuel chamber board
  description: 粒子加速器燃料室的机器板。 | A machine board for a particle accelerator fuel chamber.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: ParticleAcceleratorFuelChamberUnfinished
    componentRequirements:
      AmeFuelContainer:
        amount: 1
        defaultPrototype: AmeJar
    stackRequirements:
      Glass: 10
      Steel: 10

- type: entity
  id: MachineParticleAcceleratorPowerBoxCircuitboard
  parent: BaseMachineCircuitboard
  name: 粒子加速器电源箱板 | PA power box board
  description: 粒子加速器电源箱的机器板。 | A machine board for a particle accelerator power box.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: ParticleAcceleratorPowerBoxUnfinished
    stackRequirements:
      Glass: 5
      Steel: 5

