- type: entity
  abstract: true
  parent: BaseItem
  id: EncryptionKey
  name: 加密密钥 | encryption key
  description: 用于头戴设备的小型密码芯片。 | A small cypher chip for headsets.
  components:
  - type: EncryptionKey
  - type: Item
    sprite: Objects/Devices/encryption_keys.rsi
  - type: Sprite
    sprite: Objects/Devices/encryption_keys.rsi

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyCommon
  name: 通用加密密钥 | common encryption key
  description: 任何人都可以使用的加密密钥。 | An encryption key used by anyone.
  components:
  - type: EncryptionKey
    channels:
    - Common
    defaultChannel: Common
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: common_label
  - type: Tag
    tags:
    - EncryptionCommon

