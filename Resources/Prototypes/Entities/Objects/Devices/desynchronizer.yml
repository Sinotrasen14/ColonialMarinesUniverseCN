- type: entity
  id: DeviceDesynchronizer
  parent: BaseItem
  name: 去同步器 | desynchronizer
  description: 一种实验性装置，可在激活期间暂时使用户与时空去同步，从而使其实际上消失。 | An experimental device that can temporarily desynchronize the user from spacetime, effectively making them disappear while it's active.
  components:
  - type: Sprite
    sprite: Objects/Devices/desynchronizer.rsi
    state: icon
  - type: TriggerOnUse
  - type: PolymorphOnTrigger
    targetUser: true
    polymorph: VoidPocket
  - type: UseDelay
    delay: 220 # long delay to ensure it can't be spammed, use it wisely
