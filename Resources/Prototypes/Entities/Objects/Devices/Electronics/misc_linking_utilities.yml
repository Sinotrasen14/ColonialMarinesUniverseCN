- type: entity
  parent: BaseItem
  id: voicesensor
  name: 语音传感器 | voice sensor
  description: 这款麦克风由Micheal Phone在Michealsoft工作期间发明，当有人说出一段预先录制的代码短语时，它就会发送信号！ | This microphone, invented by Micheal Phone during his time working at Michealsoft, sends signals when a prerecorded code phrase is uttered!
  components:
  - type: Sprite
    sprite: Objects/Devices/voicesensor.rsi
    state: icon
  - type: StaticPrice
    price: 40
  - type: DeviceLinkSource
    ports:
    - Trigger
  - type: SignalOnTrigger
    port: Trigger
  - type: TriggerOnVoice
  - type: UseDelayOnTrigger
  - type: UseDelayTriggerCondition
  - type: UseDelay
  - type: EmitSoundOnTrigger
    sound:
      collection: TriggerActivate
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 15
