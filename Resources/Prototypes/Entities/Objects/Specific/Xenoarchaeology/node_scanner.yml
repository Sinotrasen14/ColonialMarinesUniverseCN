- type: entity
  parent: BaseItem
  id: NodeScanner
  name: 节点扫描仪 | node scanner
  description: 考古学家的朋友，只需一次扫描就能识别出神器的节点。 | The archeologist's friend, able to identify the node of an artifact with only a single scan.
  components:
  - type: Sprite
    sprite: Objects/Specific/Xenoarchaeology/node_scanner.rsi
    state: icon
  - type: Item
    sprite: Objects/Specific/Xenoarchaeology/node_scanner.rsi
  - type: NodeScanner
  - type: UseDelay
    delay: 1
  - type: GuideHelp
    guides:
    - Xenoarchaeology
  - type: ActivatableUI
    key: enum.NodeScannerUiKey.Key
    singleUser: true
  - type: UserInterface   #needs to be here for certain effects
    interfaces:
      enum.NodeScannerUiKey.Key:
        type: NodeScannerBoundUserInterface
