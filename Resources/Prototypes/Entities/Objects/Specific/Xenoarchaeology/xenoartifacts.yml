- type: entity
  id: BaseXenoArtifact
  parent: BaseMob # we use this since it can technically get inhabited
  name: 神器 | artifact
  description: 一件来自未知时代的奇怪神器。看起来能带来一段美好时光。 | A strange artifact from time unknown. Looks like a good time.
  abstract: true
  components:
  # Visual
  - type: Appearance
  - type: InteractionOutline
  - type: UserInterface #needs to be here for certain effects
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
      enum.IntercomUiKey.Key:
        type: IntercomBoundUserInterface
  - type: GuideHelp
    guides:
    - Xenoarchaeology
  # gameplay interactions
  - type: XenoArtifact
    effectsTable: !type:NestedSelector
      tableId: XenoArtifactEffectsDefaultTable
  - type: Damageable
  - type: Injurable
  - type: Actions
  - type: Physics
    bodyType: KinematicController
  - type: MovementSpeedModifier
    baseWalkSpeed: 0.25
    baseSprintSpeed: 0.5
  - type: UseDelay
  - type: StealTarget
    stealGroup: XenoArtifact
  - type: ContainerContainer
    containers:
      node-container: !type:Container
        showEnts: false
        occludes: true
        ents: []
  # These components are needed for certain triggers to work.
  - type: RadiationReceiver
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
      Acidic: [Touch]
  - type: LightningTarget
    priority: 2
    lightningExplode: false
  - type: Stamina
    baseCritThreshold: 1000
    decay: 1000
    cooldown: 0.1

- type: entity
  parent: BaseAction
  id: ActionArtifactActivate
  name: 激活神器 | Activate Artifact
  description: 激活自身，使周围陷入混乱。 | Activate yourself, causing chaos to those near you.
  components:
  - type: Action
    useDelay: 300
  - type: Sprite
    sprite: Objects/Specific/Xenoarchaeology/xeno_artifacts.rsi
    layers:
    - state: ano29
  - type: InstantAction
    event: !type:ArtifactSelfActivateEvent
