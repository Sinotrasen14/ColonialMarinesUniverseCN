- type: entity
  parent: BaseItem
  id: ResearchDisk
  name: 研发点数磁盘（1000） | research point disk (1000)
  description: 一个用于研发服务器的磁盘，内含1000点。 | A disk for the R&D server containing 1000 points.
  components:
  - type: Sprite
    sprite: Objects/Specific/Research/researchdisk.rsi
    state: icon
  - type: ResearchDisk
  - type: GuideHelp
    guides:
    - Science

- type: entity
  parent: ResearchDisk
  id: ResearchDisk5000
  name: 研发点数磁盘（5000） | research point disk (5000)
  description: 一个用于研发服务器的磁盘，内含5000点数。 | A disk for the R&D server containing 5000 points.
  components:
  - type: ResearchDisk
    points: 5000

- type: entity
  parent: ResearchDisk
  id: ResearchDisk10000
  name: 研发积分盘（10000） | research point disk (10000)
  description: 一个研发服务器用的积分盘，内含10000积分。 | A disk for the R&D server containing 10000 points.
  components:
  - type: ResearchDisk
    points: 10000

- type: entity
  parent: ResearchDisk
  id: ResearchDiskDebug
  name: 研究点磁盘 | research point disk
  suffix: DEBUG, DO NOT MAP
  categories: [DoNotMap]
  description: 一个用于研发服务器的磁盘，包含你所需的所有点数。 | A disk for the R&D server containing all the points you could ever need.
  components:
  - type: ResearchDisk
    unlockAllTech: true

- type: entity
  parent: BaseItem
  id: TechnologyDisk
  name: 技术磁盘 | technology disk
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: datadisk_base
      map: ["base"]
    - state: datadisk_label
    - state: datadisk_t2_marks
      shader: unshaded
      map: ["t2_marks"]
      visible: false
    - state: datadisk_t2_border
      map: ["t2_border"]
      visible: false
    - state: datadisk_t3_marks
      map: ["t3_marks"]
      shader: unshaded
      visible: false
    - state: datadisk_t3_border
      map: ["t3_border"]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TechDiskVisuals.Discipline:
        base:
          Industrial: {color: "#eeac34"}
          Arsenal: {color: "#dc373b"}
          Experimental: {color: "#9a6ef0"}
          CivilianServices: {color: "#7ecd48"}

      enum.TechDiskVisuals.Tier:
        t2_marks:
          2: {visible: true}
        t2_border:
          2: {visible: true}
        t3_marks:
          3: {visible: true}
        t3_border:
          3: {visible: true}
  - type: StealTarget
    stealGroup: TechnologyDisk
  - type: TechnologyDisk

# random tech disks by tier
