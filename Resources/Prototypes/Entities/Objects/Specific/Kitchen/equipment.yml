- type: entity
  abstract: true
  parent: [SolutionToolSmall, BaseItem]
  id: BaseHandheldGrinder
  components:
  - type: SolutionTransfer
  - type: DrawableSolution
    solution: solution
  - type: RefillableSolution
    solution: solution
  - type: DrainableSolution
    solution: solution
  - type: Edible
    edible: Drink
    solution: solution
    destroyOnEmpty: false
    utensil: Spoon
  - type: MixableSolution
    solution: solution
  - type: ExaminableSolution
    solution: solution
    exactVolume: true
  - type: SolutionItemStatus
    solution: solution
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: fill-
  - type: DnaSubstanceTrace
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Spillable
    solution: solution
  - type: Appearance
  - type: HandheldGrinder

# Mortars
- type: entity
  parent: BaseHandheldGrinder
  id: MortarAndPestle
  name: 研钵和研杵 | mortar and pestle
  description: 用于研磨少量物体。 | Used for grinding small amounts of objects.
  components:
  - type: Sprite
    sprite: Objects/Specific/Kitchen/mortar_and_pestle.rsi
    layers:
    - state: icon
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: fill-1
      visible: false
  - type: HandheldGrinder
    finishedPopup: handheld-grinder-grinded

- type: entity
  parent: MortarAndPestle
  id: MortarAndPestleMakeshift
  name: 简易研钵和研杵 | makeshift mortar and pestle
  description: 用于研磨少量物品。木制的劣质版本。 | Used for grinding small amounts of objects. Inferior version made out of wood.
  components:
  - type: Sprite
    sprite: Objects/Specific/Kitchen/mortar_and_pestle.rsi
    layers:
    - state: makeshift_icon
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: fill-1
      visible: false
  - type: Item
    inhandVisuals:
      left:
      - state: makeshift-inhand-left
      right:
      - state: makeshift-inhand-right
  - type: HandheldGrinder
    doAfterDuration: 6
  - type: Construction
    graph: MakeshiftMortarAndPestle
    node: mortarAndPestle

# Juicers
- type: entity
  parent: BaseHandheldGrinder
  id: HandheldJuicer
  name: 手持榨汁机 | handheld juicer
  description: 用于榨取少量物体。 | Used for juicing small amounts of objects.
  components:
  - type: Sprite
    sprite: Objects/Specific/Kitchen/handheld_juicer.rsi
    layers:
    - state: juicer_base
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: fill-1
      visible: false
    - state: cap
  - type: HandheldGrinder
    finishedPopup: handheld-grinder-juiced
    sound: !type:SoundPathSpecifier
      path: /Audio/Items/Culinary/juicer_juicing.ogg # Pasta mixing sound. Close enough.
      params:
        loop: true
    program: Juice

- type: entity
  parent: HandheldJuicer
  id: HandheldJuicerMakeshift
  name: 简易榨汁器 | makeshift juicer
  description: 用于榨取少量物品的汁液。用木头制成的劣质版本。 | Used for juicing small amounts of objects. Inferior version made out of wood.
  components:
  - type: Sprite
    sprite: Objects/Specific/Kitchen/handheld_juicer.rsi
    layers:
    - state: makeshift_base
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: fill-1
      visible: false
    - state: cap
  - type: Item
    inhandVisuals:
      left:
      - state: makeshift-inhand-left
      right:
      - state: makeshift-inhand-right
  - type: HandheldGrinder
    doAfterDuration: 6
  - type: Construction
    graph: MakeshiftJuicer
    node: juicer

# Construction
- type: entity
  name: 不完整的研钵和研杵 | incomplete mortar and pestle
  parent: BaseItem
  id: IncompleteMortarAndPestle
  description: 几块粘在一起的木板。 | A few planks of wood stuck together.
  components:
  - type: Sprite
    sprite: Objects/Specific/Kitchen/mortar_and_pestle.rsi
    state: makeshift_base
  - type: Item
    size: Normal
    inhandVisuals:
      left:
      - state: makeshift-inhand-left
      right:
      - state: makeshift-inhand-right
  - type: Construction
    graph: MakeshiftMortarAndPestle
    node: incompleteMortarAndPestle

- type: entity
  name: 不完整的手持榨汁机 | incomplete handheld juicer
  parent: BaseItem
  id: IncompleteHandheldJuicer
  description: 一些木头和塑料粘在一起。 | A some wood and plastic stuck together.
  components:
  - type: Sprite
    sprite: Objects/Specific/Kitchen/handheld_juicer.rsi
    state: makeshift_base
  - type: Item
    size: Normal
    inhandVisuals:
      left:
      - state: makeshift-inhand-left
      right:
      - state: makeshift-inhand-right
  - type: Construction
    graph: MakeshiftJuicer
    node: incompleteJuicer
