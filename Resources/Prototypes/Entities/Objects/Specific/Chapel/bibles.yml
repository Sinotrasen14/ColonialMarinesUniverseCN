- type: entity
  name: 太空圣经 | space bible
  description: 新星际版本2340。 | New Interstellar Version 2340.
  parent: BaseStorageItem
  id: Bible
  components:
  - type: UseDelay
    delay: 10.0
  - type: Bible
    damage:
      types:
        Blunt: -5
        Piercing: -5
        Slash: -5
        Heat: -5
        Cold: -5
        Shock: -5
    damageOnFail:
      types:
        Blunt: 5
        Piercing: 5
        Slash: 5
        Asphyxiation: 15
    damageOnUntrainedUse: ## What a non-chaplain takes when attempting to heal someone
      types:
        Heat: 10
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    damage:
      types:
        Holy: 25
        Blunt: 1
  - type: Prayable
    bibleUserOnly: true
  - type: Summonable
    summonEntity: SpawnPointGhostRemilia
  - type: ReactionMixer
    mixMessage: "bible-mixing-success"
    reactionTypes:
    - Holy
  - type: Sprite
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Objects/Specific/Chapel/bible.rsi
  - type: Clothing
    slots:
    - Belt
  - type: Storage
    grid:
    - 0,0,0,1
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Tag
    tags:
    - Book
  - type: StealTarget
    stealGroup: Bible

- type: entity
  parent: [Bible, BaseSyndicateContraband]
  name: 死灵之书 | necronomicon
  description: "有一张纸条：克拉图，维拉塔，尼克托——别再忘了！ | There's a note: Klatuu, Verata, Nikto -- Don't forget it again!"
  id: BibleNecronomicon
  components:
  - type: Bible
    damage:
      types:
        Caustic: 20 ## ~15 dps
    damageOnFail:
      types:
        Blunt: 5
        Piercing: 5
        Slash: 5
        Asphyxiation: 25
    damageOnUntrainedUse:
      types:
        Caustic: 50
    failChance: 0
    healFailOthersText: necro-heal-fail-others
    healFailSelfText: necro-heal-fail-self
    healSuccessOthersText: necro-heal-success-others
    healSuccessSelfText: necro-heal-success-self
    healSound: "/Audio/Effects/lightburn.ogg"
    healingLightEffect: EvilLightEffect
  - type: Summonable
    summonEntity: SpawnPointGhostCerberus
    respawnTime: 300
  - type: Sprite
    sprite: Objects/Specific/Chapel/necronomicon.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/necronomicon.rsi

- type: entity
  parent: BaseAction
  id: ActionBibleSummon
  name: 召唤魔宠 | Summon familiar
  description: 召唤一个魔宠来协助你，一旦有灵魂入驻，它便会获得类人的智慧。 | Summon a familiar that will aid you and gain humanlike intelligence once inhabited by a soul.
  components:
  - type: Action
    useDelay: 1
  - type: Sprite
    sprite: Clothing/Head/Hats/witch.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:SummonActionEvent

- type: entity
  id: BibleDruid
  name: 德鲁伊石板 | druidic tablet
  parent: Bible
  description: "这是德鲁伊的谜团！ | It's the mystery of the druids!"
  components:
  - type: Sprite
    sprite: Objects/Specific/Chapel/mysteryofthedruids.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/mysteryofthedruids.rsi

- type: entity
  id: BibleCommunistManifesto
  name: 共产党宣言 | communist manifesto
  parent: Bible
  description: "从资本身上撕下人性的面具。 | Remove the mask of humanity from Capital."
  components:
  - type: Sprite
    sprite: Objects/Specific/Chapel/communistmanifesto.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/communistmanifesto.rsi

- type: entity
  id: BibleNarsie
  name: 纳尔西之书 | tome of nar'sie
  parent: Bible
  description: "一本沾满鲜血的书能出什么岔子呢？ | What could possibly go wrong with a book covered in blood?"
  components:
  - type: Sprite
    sprite: Objects/Specific/Chapel/tomeofnarsie.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/tomeofnarsie.rsi

- type: entity
  id: BibleNanoTrasen
  name: 法典纳米特拉西姆斯 | codex nanotrasimus
  parent: Bible
  description: "一本熟悉的书，内含神圣操作程序。 | A familiar book containing the Sacred Operating Procedures."
  components:
  - type: Sprite
    sprite: Objects/Specific/Chapel/codexnanotrasimus.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/codexnanotrasimus.rsi

- type: entity
  id: BibleHonk
  name: 欢愉之母的喜悦 | mirth of the honkmother
  parent: Bible
  description: "哦，伟大而光荣的母亲，欢愉的女主人，面具与欢乐的守护者，她在我们这些弄臣之中是有福的。 | Oh great and glorious Mother, Mistress of Mirth, Matron of Mask and Merriments, Blessed is she amongst us jesters."
  components:
  - type: Sprite
    sprite: Objects/Specific/Chapel/honk.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/honk.rsi

- type: entity
  id: BibleRatvar
  name: 拉特瓦尔的石板 | tablet of ratvar
  parent: Bible
  description: "发条邪教的圣物，由发条正义者拉特瓦尔赐福。 | A holy relic of the Clockwork Cult, blessed by the Clockwork Justice, Ratvar."
  components:
  - type: Sprite
    sprite: Objects/Specific/Chapel/ratvartablet.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/ratvartablet.rsi

- type: entity
  id: HolyLightEffect
  categories: [HideSpawnMenu]
  components:
  - type: PointLight
    enabled: true
    radius: 1.5
    energy: 20
    color: lightgoldenrodyellow
    netsync: false
  - type: LightFade
    duration: 0.7
  - type: TimedDespawn
    lifetime: 0.7

- type: entity
  id: EvilLightEffect
  categories: [HideSpawnMenu]
  parent: HolyLightEffect
  components:
  - type: PointLight
    color: red
