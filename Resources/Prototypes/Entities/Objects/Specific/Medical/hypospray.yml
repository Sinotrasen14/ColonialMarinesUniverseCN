  name: 戈雷克斯皮下注射器 | gorlex hypospray
  description: 一种用于快速给药的无菌注射器。逆向工程自纳米特雷森的设计，赛博森为戈雷克斯掠夺者的医护兵限量生产这些产品。
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/syndihypo.rsi
    layers:
    - state: hypo
      map: ["enum.SolutionContainerLayers.Base"]
    - state: hypo_fill1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: Objects/Specific/Medical/syndihypo.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: hypo_fill
    solutionName: hypospray

- type: entity
