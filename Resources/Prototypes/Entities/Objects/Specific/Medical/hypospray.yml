- type: entity
  abstract: true
  parent: [SolutionHypospraySmall, BaseItem]
  id: BaseHypoInjector
  components:
  - type: Injector
    solutionName: hypospray
    ignoreClosed: false
    activeModeProtoId: HyposprayDynamicMode
    allowedModes:
    - HyposprayDynamicMode
    - HyposprayInjectMode
  - type: ExaminableSolution
    solution: hypospray
    exactVolume: true
  - type: UseDelay
    delay: 0.5
  - type: Appearance

- type: entity
  abstract: true
  parent: BaseHypoInjector
  id: BaseHypospray
  components:
  - type: Spillable
    solution: hypospray
    spillWhenThrown: false

- type: entity
  abstract: true
  parent: [SolutionHypospray, SolutionToolSmall]
  id: SolutionHypospraySmall
  components:
  - type: Solution
    solution:
      maxVol: 20

- type: entity
  abstract: true
  parent: [SolutionHypospray, SolutionToolTiny]
  id: SolutionHyposprayTiny
  components:
  - type: Solution
    solution:
      maxVol: 10

- type: entity
  parent: [SolutionToolSmall, BaseHypospray, BaseGrandTheftContraband]
  id: Hypospray
  name: 无针注射器 | hypospray
  description: 一种用于向患者快速给药的无菌注射器。
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/hypospray.rsi
    layers:
    - state: hypo
      map: ["enum.SolutionContainerLayers.Base"]
    - state: hypo_fill1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: Objects/Specific/Medical/hypospray.rsi
  - type: RefillableSolution
    solution: hypospray
  - type: StaticPrice
    price: 750
  - type: Tag
    tags:
    - HighRiskItem
  - type: StealTarget
    stealGroup: Hypospray
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: hypo_fill
    solutionName: hypospray
  - type: MedicallyUnskilledDoAfter
    min: 2
    doAfter: 3

- type: entity
  parent: [BaseHypospray, BaseSyndicateContraband]
