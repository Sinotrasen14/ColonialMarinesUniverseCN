  name: 喷射注射器 | jet injector
  description: 一种用于方便患者给药的灭菌注射器。
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/jetinjector.rsi
    layers:
    - state: jetinjector_base
      map: ["enum.SolutionContainerLayers.Base"]
    - state: jetinjector_filled1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: Objects/Specific/Medical/jetinjector.rsi
  - type: UseDelay
    delay: 1.5
  - type: Solution
    solution:
      maxVol: 15 # Same as a syringe
