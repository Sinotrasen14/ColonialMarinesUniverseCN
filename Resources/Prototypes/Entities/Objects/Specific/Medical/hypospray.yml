  name: 无针注射器 | hypospray
  description: 一种用于向患者快速给药的无菌注射器。 | A sterile injector for rapid administration of drugs to patients.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/hypospray.rsi
    layers:
    - state: hypo
      map: ["enum.SolutionContainerLayers.Base"]
    - state: hypo_fill1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: Objects/Specific/Medical/hypospray.rsi
  - type: RefillableSolution
    solution: hypospray
  - type: StaticPrice
    price: 750
  - type: Tag
