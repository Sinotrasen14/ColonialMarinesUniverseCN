- type: entity
  abstract: true
  parent: [SolutionHypospraySmall, BaseItem]
  id: BaseHypoInjector
  components:
  - type: Injector
    solutionName: hypospray
    ignoreClosed: false
    activeModeProtoId: HyposprayDynamicMode
    allowedModes:
    - HyposprayDynamicMode
    - HyposprayInjectMode
  - type: ExaminableSolution
    solution: hypospray
    exactVolume: true
  - type: UseDelay
    delay: 0.5
  - type: Appearance

- type: entity
  abstract: true
  parent: BaseHypoInjector
  id: BaseHypospray
  components:
