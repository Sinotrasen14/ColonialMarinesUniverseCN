- type: entity
  id: BaseCargoPallet
  parent: BaseStructure
  name: 货物托盘 | cargo pallet
  description: 物流与货物的常见固定装置。微妙地提醒运输途中板条箱该放哪里，以免撞伤小腿。 | Common fixture of logistics and cargo. Subtle reminder where crates go during transport to avoid bruised shins.
  abstract: true
  components:
  - type: InteractionOutline
  - type: Anchorable
    flags:
    - Anchorable
  - type: CollideOnAnchor
  - type: Physics
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 15
        mask:
        - MachineMask
  - type: StaticPrice
    price: 100
  - type: Sprite
    drawdepth: FloorTiles
    layers:
    - sprite: Structures/catwalk.rsi
      state: catwalk_preview
  - type: GuideHelp
    guides:
    - Cargo

- type: entity
  parent: [BaseCargoPallet, StructureHealthMachineWeak]
  id: CargoPallet
  components:
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal: # takes two to construct, so drop less than that
            min: 0
            max: 1

- type: entity
  id: CargoPalletSell
  name: 货物销售托盘 | cargo selling pallet
  description: 指定可出售的有效物品。由塑钛制成，以防讨厌的破坏者。 | Designates valid items to sell. Made of plastitanium to discourage pesky vandals.
  parent: BaseCargoPallet
  components:
  - type: CargoPallet
    palletType: sell
  - type: Sprite
    sprite: Structures/cargo_pallets.rsi
  - type: Icon
    sprite: Structures/cargo_pallets.rsi
    state: cargo_pallet_sell
  - type: IconSmooth
    key: cargo_pallet_sell
    base: cargo_pallet_sell_

- type: entity
  id: CargoPalletBuy
  name: 货物购买托盘 | cargo buying pallet
  description: 指定购买后订单出现的位置。由塑钛制成，以防讨厌的破坏者。 | Designates where orders will appear when purchased. Made of plastitanium to discourage pesky vandals.
  parent: BaseCargoPallet
  components:
  - type: CargoPallet
    palletType: buy
  - type: Sprite
    sprite: Structures/cargo_pallets.rsi
  - type: Icon
    sprite: Structures/cargo_pallets.rsi
    state: cargo_pallet_buy
  - type: IconSmooth
    key: cargo_pallet_buy
    base: cargo_pallet_buy_
