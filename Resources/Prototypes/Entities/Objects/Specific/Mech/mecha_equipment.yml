- type: entity
  parent: BaseItem
  id: BaseMechEquipment
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Specific/Mech/mecha_equipment.rsi
  - type: Item
    sprite: Objects/Specific/Mech/mecha_equipment.rsi
    size: Ginormous
  - type: MechEquipment
  - type: GuideHelp
    guides:
    - Robotics

- type: entity
  id: MechEquipmentGrabber
  parent: BaseMechEquipment
  name: 液压钳 | hydraulic clamp
  description: 使机甲能够抓取物体并拖拽它们。 | Gives the mech the ability to grab things and drag them around.
  components:
  - type: Sprite
    state: mecha_clamp
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-big
      right:
      - state: inhand-right-big
    size: Ginormous
    shape:
    - 0,0,4,3
  - type: MultiHandedItem
  - type: MechGrabber
  - type: UIFragment
    ui: !type:MechGrabberUi
  - type: ContainerContainer
    containers:
      item-container: !type:Container

- type: entity
  id: MechEquipmentGrabberSmall
  parent: BaseMechEquipment
  name: 小型液压夹钳 | small hydraulic clamp
  description: 赋予机甲抓取物体并拖拽移动的能力。 | Gives the mech the ability to grab things and drag them around.
  components:
  - type: Sprite
    state: mecha_clamp_small
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-small
      right:
      - state: inhand-right-small
    size: Large
    shape:
    - 0,0,3,2
  - type: MultiHandedItem
  - type: MechGrabber
    maxContents: 4
    grabDelay: 3
    grabEnergyDelta: -20
  - type: Tag
    tags:
    - SmallMech
  - type: UIFragment
    ui: !type:MechGrabberUi
  - type: ContainerContainer
    containers:
      item-container: !type:Container

- type: entity
  id: MechEquipmentHorn
  parent: BaseMechEquipment
  name: 机械喇叭 | mech horn
  description: 一个增强型自行车喇叭，能播放一系列滑稽的声音，供船员们娱乐。嘟嘟！ | An enhanced bike horn that plays a hilarious array of sounds for the enjoyment of the crew. HONK!
  components:
  - type: Sprite
    # TODO: use own sprite
    state: mecha_honker
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-honk
      right:
      - state: inhand-right-honk
    size: Ginormous
    shape:
    - 0,0,4,3
  - type: MultiHandedItem
  - type: MechSoundboard
    sounds:
    - collection: BikeHorn
    - collection: CluwneHorn
    - collection: TrollAnimals
    - collection: TrollBeeping
    - collection: TrollEsword
  - type: UIFragment
    ui: !type:MechSoundboardUi
  - type: UseDelay
    delay: 0.5
  # TODO: tag as being for H.O.N.K. only!!!
