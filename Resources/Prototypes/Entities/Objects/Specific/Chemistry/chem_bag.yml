- type: entity
  name: 化学袋 | chemistry bag
  id: ChemBag
  parent: BaseStorageItem
  description: 用于存放化学产品的袋子，例如药丸、药丸罐、瓶子和注射器。 | A bag for storing chemistry products, such as pills, pill canisters, bottles, and syringes.
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/chem_bag.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Specific/Chemistry/chem_bag.rsi
    quickEquip: false
    slots:
    - belt
  - type: Item
    size: Ginormous
  - type: Storage
    maxItemSize: Normal # allow up to 5 large beakers / 10 beakers / 10 pill canisters
    grid:
    - 0,0,4,3
    quickInsert: true
    areaInsert: true
    whitelist:
      components:
      - FitsInDispenser
      - Pill
      tags:
      - Document
      - PillCanister
      - Bottle
      - Syringe
      - Dropper
  - type: Dumpable
