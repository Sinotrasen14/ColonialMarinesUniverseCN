- type: entity
  name: 滴管 | dropper
  parent: [SolutionInjector, SolutionToolTiny, BaseItem]
  description: 用于在容器之间转移少量化学溶液。 | Used to transfer small amounts of chemical solution between containers.
  id: Dropper
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/dropper.rsi
    layers:
    - state: dropper
    - state: dropper1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Injector
    ignoreMobs: true
    ignoreClosed: false
    activeModeProtoId: DropperDrawMode
    allowedModes:
    - DropperDrawMode
    - DropperInjectMode
  - type: ExaminableSolution
    solution: dropper
    exactVolume: true
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: Spillable
    solution: injector
  - type: Item
    sprite: Objects/Specific/Chemistry/dropper.rsi
    size: Tiny
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: dropper
    inHandsMaxFillLevels: 1
    inHandsFillBaseName: -fill-
  - type: StaticPrice
    price: 40
  - type: DnaSubstanceTrace
  - type: Tag
    tags:
    - Dropper
  - type: PhysicalComposition

- type: entity
  parent: Dropper
  id: BorgDropper
  name: 液压移液管 | hydraulic pipette
  description: 为赛博格打造的最先进液压滴管。 | State-of-the-art hydraulic dropper built for cyborgs.
