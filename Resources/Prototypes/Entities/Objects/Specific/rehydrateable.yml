- type: entity
  parent: BaseItem
  id: RehydratableItem
  abstract: true
  components:
  - type: Item
    size: Tiny
  - type: SolutionManager
    solutions:
    - SolutionCube
  - type: RefillableSolution
    solution: cube
  - type: Reactive
    reactions:
    - reagents: [Water]
      methods: [Touch, Ingestion, Injection]
      effects:
      - !type:AddReagentToSolution
        reagent: Water
        solution: cube
  - type: Rehydratable
  - type: CollisionWake
    enabled: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        density: 5
        mask:
        - ItemMask
      rehydrate: # needed to react to fire extinguishers
        shape: !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        hard: false
        layer:
        - LowImpassable

- type: entity
  parent: Solution
  id: SolutionCube # This will be deleted at a later date. Using solutions for this is really dumb.
  name: 立方体 | cube
  description: 如果你正在读这段话，呃呃！提交一个错误报告吧。 | if you're reading this, nuh uh! file a bug report.
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    id: cube
    solution:
      maxVol: 1

- type: entity
  abstract: true
  parent: [SolutionTiny, SolutionFood, RehydratableItem]
  id: RehydratableAnimalCube
  description: 只需加水！ | Just add water!
  components:
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: cube
  - type: Solution
    solution:
      reagents: # Same as raw meat.
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: UncookedAnimalProteins
        Quantity: 20
      - ReagentId: Fat
        Quantity: 5
  - type: Edible
  - type: FlavorProfile
    flavors:
    - chewy
    - horrible
    - compressed-meat
  - type: Tag
    tags:
    - Meat

