- type: entity
  parent: [BaseItem, BaseXenoborgContraband]
  id: CloakingDevice
  name: 隐形装置 | cloaking device
  description: 一种能让异形生化人隐形的装置。 | A device that allows Xenoborgs to go invisible.
  components:
  - type: Sprite
    sprite: Objects/Specific/Research/anomalyscanner.rsi
    state: icon
  - type: ItemToggle
  - type: ComponentToggler
    parent: true
    components:
    - type: Stealth
      minVisibility: 0.1
      lastVisibility: 0.1
  - type: PowerCellDraw
    drawRate: 3.6 # 100 seconds
  - type: ToggleCellDraw
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmallNuclear
        disableEject: true
        swap: false

- type: entity
  parent: CloakingDevice
  id: SuperCloakingDevice
  name: 超级隐形装置 | super cloaking device
  description: 一种能让异形机械体真正隐形的装置。 | A device that allows Xenoborgs to go truly invisible.
  components:
  - type: ComponentToggler
    parent: true
    components:
    - type: Stealth
      minVisibility: -1
      lastVisibility: -1
  - type: PowerCellDraw
    drawRate: 12 # 30 seconds
