- type: entity
  name: 矿石袋 | ore bag
  id: OreBag
  parent: BaseStorageItem
  description: 一个结实的袋子，适合打捞专家和矿工携带大量矿石。挂在腰带上时能磁化附近的矿石。 | A robust bag for salvage specialists and miners alike to carry large amounts of ore. Magnetises any nearby ores when attached to a belt.
  components:
  - type: MagnetPickup
  - type: Sprite
    sprite: Objects/Specific/Mining/ore_bag.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Specific/Mining/ore_bag.rsi
    quickEquip: false
    slots:
    - belt
  - type: Item
    size: Ginormous
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,9,3
    quickInsert: true
    areaInsert: true
    whitelist:
      tags:
      - ArtifactFragment
      - Ore
  - type: Dumpable

- type: entity
  parent: OreBag
  id: BorgOreBag
  name: 集成矿石袋 | integrated ore bag
  description: 一种大型矿石袋，集成在采矿赛博格的框架中。持有时会磁化附近的矿石。 | A large ore bag built into the frame of a mining cyborg. Magnetises any nearby ores when held.
  components:
  - type: MagnetPickup
    slotFlags:
    requireActiveHand: true
  - type: Storage
    grid:
    - 0,0,9,5
