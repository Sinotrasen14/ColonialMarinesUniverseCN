# Leaves
# TODO We have mortar and pestle, all these ground items are very stupid and should just be made by grinding leaves instead of through construction.

- type: entity
  name: 大麻叶 | cannabis leaves
  parent: ProduceBaseRuminant
  id: LeavesCannabis
  description: "最近在大多数星系中合法化了。 | Recently legalized in most galaxies."
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/cannabis.rsi
  - type: Produce
    plantId: CannabisPlants
  - type: Edible # Precursor to the one true edible
  - type: Solution
    solution:
      reagents:
      - ReagentId: THC
        Quantity: 15

- type: entity
  name: 干燥的大麻叶 | dried cannabis leaves
  parent: ProduceBaseRuminant
  id: LeavesCannabisDried
  description: "干燥的大麻叶，准备研磨。 | Dried cannabis leaves, ready to be ground."
  components:
  - type: Stack
    stackType: LeavesCannabisDried
    count: 1
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/tobacco.rsi
    state: dried

- type: entity
  name: 研磨大麻 | ground cannabis
  parent: [SolutionFood, SolutionTiny, BaseItem]
  id: GroundCannabis
  description: "研磨大麻，准备带你踏上旅程。 | Ground cannabis, ready to take you on a trip."
  components:
  - type: Stack
    stackType: GroundCannabis
    count: 1
  - type: Solution
    solution:
      reagents:
      - ReagentId: THC
        Quantity: 30 # Takes 2 dried leaves to make one ground cannabis.
  - type: Sprite
    sprite: Objects/Misc/reagent_fillings.rsi
    state: powderpile
    color: darkgreen
  - type: Construction
    graph: smokeableGroundCannabis
    node: ground
  - type: Tag
    tags:
    - Smokable
  - type: Item
    size: Tiny

- type: entity
  name: 彩虹大麻叶 | rainbow cannabis leaves
  parent: LeavesCannabis
  id: LeavesCannabisRainbow
  description: "它应该是那样发光的吗……？ | Is it supposed to be glowing like that...?"
  components:
  - type: Sprite
    layers:
    - sprite: Objects/Specific/Hydroponics/rainbow_cannabis.rsi
      state: produce
      shader: unshaded
  - type: Produce
    plantId: RainbowCannabisPlants
  # disabled because 50 morbillion point lights still break the lighting engine
  #- type: PointLight
  #  radius: 1.5
  #  energy: 2
  #- type: RgbLightController
  #  cycleRate: 0.6
  - type: Solution
    solution:
      reagents:
      - ReagentId: SpaceDrugs
        Quantity: 6
      - ReagentId: Lipolicide
        Quantity: 3
      - ReagentId: MindbreakerToxin
        Quantity: 2
      - ReagentId: Happiness
        Quantity: 2
#       - ReagentId: ColorfulReagent
#         Quantity: 1
      - ReagentId: Psicodine
        Quantity: 1

- type: entity
  name: 干燥的彩虹大麻叶 | dried rainbow cannabis leaves
  parent: LeavesCannabisRainbow
  id: LeavesCannabisRainbowDried
  description: "干燥的彩虹大麻叶，准备研磨。 | Dried rainbow cannabis leaves, ready to be ground."
  components:
  - type: Stack
    stackType: LeavesCannabisRainbowDried
    count: 1
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/rainbow_cannabis.rsi
    state: dried

- type: entity
  name: 研磨彩虹大麻 | ground rainbow cannabis
  parent: GroundCannabis
  id: GroundCannabisRainbow
  description: "研磨彩虹大麻，准备带你踏上旅程。 | Ground rainbow cannabis, ready to take you on a trip."
  components:
  - type: Stack
    stackType: GroundCannabisRainbow
    count: 1
  - type: Solution
    solution:
      reagents:
      - ReagentId: SpaceDrugs
        Quantity: 12
      - ReagentId: Lipolicide
        Quantity: 6
      - ReagentId: MindbreakerToxin
        Quantity: 4
      - ReagentId: Happiness
        Quantity: 4
#       - ReagentId: ColorfulReagent
#         Quantity: 2
      - ReagentId: Psicodine
        Quantity: 2
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/rainbow_cannabis.rsi
    state: powderpile_rainbow
    color: white
  - type: Construction
    graph: smokeableGroundCannabisRainbow
    node: groundRainbow

- type: entity
  name: 茶叶 | tea leaves
  parent: ProduceBaseRuminant
  id: LeavesTea
  description: "可以晒干制成茶叶。 | Can be dried out to make tea."
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/tea_plant.rsi
  - type: Produce
    plantId: TeaPlantPlants
  - type: Solution
    solution:
      reagents:
      - ReagentId: Vitamin
        Quantity: 15

- type: entity
  name: 干茶叶 | dried tea leaves
  parent: ProduceBaseRuminant
  id: LeavesTeaDried
  description: "干茶叶，准备研磨。 | Dried tea leaves, ready to be ground."
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Vitamin
        Quantity: 10
      - ReagentId: TeaPowder # Convert some of the Vitamin to Tea
        Quantity: 5
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/tea_plant.rsi
    state: dried

- type: entity
  name: 烟叶 | tobacco leaves
  parent: ProduceBaseRuminant
  id: LeavesTobacco
  description: "把它们晒干来制作一些烟。 | Dry them out to make some smokes."
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/tobacco.rsi
  - type: Produce
    plantId: TobaccoPlants
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nicotine
        Quantity: 2.5

- type: entity
  name: 干燥的烟叶 | dried tobacco leaves
  parent: LeavesTobacco
  id: LeavesTobaccoDried
  description: "干燥的烟叶，准备研磨。 | Dried tobacco leaves, ready to be ground."
  components:
  - type: Stack
    stackType: LeavesTobaccoDried
    count: 1
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/tobacco.rsi
    state: dried

- type: entity
  name: 烟丝 | ground tobacco
  parent: [SolutionFood, SolutionTiny, BaseItem]
  id: GroundTobacco
  description: "烟丝，非常适合手卷烟。 | Ground tobacco, perfect for hand-rolled cigarettes."
  components:
  - type: Stack
    stackType: GroundTobacco
    count: 1
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nicotine
        Quantity: 10
  - type: Sprite
    sprite: Objects/Misc/reagent_fillings.rsi
    state: powderpile
    color: brown
  - type: Construction
    graph: smokeableGroundTobacco
    node: ground
  - type: Tag
    tags:
    - Smokable
  - type: Item
    size: Tiny
