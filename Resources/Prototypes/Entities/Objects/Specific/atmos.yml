- type: entity
  name: 气体分析仪 | gas analyzer
  parent: BaseItem
  id: GasAnalyzer
  description: 手持式环境扫描仪，可报告当前气体水平。 | A hand-held environmental scanner which reports current gas levels.
  suffix: Use CMUAtmosScanner # CMU14
  components:
  - type: Sprite
    sprite: Objects/Specific/Atmos/gasanalyzer.rsi
    layers:
    - state: icon
      map: ["analyzer"]
  - type: GasAnalyzer
  - type: ActivatableUI
    inHandsOnly: true
    singleUser: true
    requireActiveHand: false
    key: enum.GasAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.GasAnalyzerUiKey.Key:
        type: GasAnalyzerBoundUserInterface
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.GasAnalyzerVisuals.Enabled:
        enabled:
          true: {state: working}
          false: {state: icon}
  - type: StaticPrice
    price: 80
  - type: PhysicalComposition
    materialComposition:
      Steel: 400
      Glass: 100
  - type: GuideHelp
    guides:
    - AtmosTools
    - PipeNetworks
    - Pipes
    - GasCanisters
