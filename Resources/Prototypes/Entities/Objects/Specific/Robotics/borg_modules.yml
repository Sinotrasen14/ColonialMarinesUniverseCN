- type: entity
  id: BaseBorgModule
  parent: BaseItem
  name: 赛博格模块 | borg module
  description: 一种赋予赛博格新能力的技术装置。 | A piece of tech that gives cyborgs new abilities.
  abstract: true
  components:
  - type: Item
    storedRotation: -90
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#8FCBCB"
      - state: base-module-inhand-left
        color: "#A1A1A1"
      - state: base-part-inhand-left
      - state: base-stripes-inhand-left
        color: "#7D7D7D"
      right:
      - state: base-icon-inhand-right
        color: "#8FCBCB"
      - state: base-module-inhand-right
        color: "#A1A1A1"
      - state: base-part-inhand-right
      - state: base-stripes-inhand-right
        color: "#7D7D7D"
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
  - type: BorgModule
    borgFitTypes:
    - borg-type-all
  - type: BorgModuleIcon
    icon: {sprite: Interface/Actions/actions_borg.rsi, state: no-action}
  - type: StaticPrice
    price: 100
  - type: Tag
    tags:
    - BorgModuleGeneric
  - type: GuideHelp
    guides:
    - Cyborgs
    - Robotics

- type: entity
  id: BaseProviderBorgModule
  abstract: true
  components:
  - type: SelectableBorgModule
  - type: ContainerContainer
    containers:
      holding_container: !type:Container {}

- type: entity
  parent: BaseAction
  id: ActionBorgSwapModule
  # Name and description will normally be changed by BorgSystem
  name: 交换模块 | Swap Module
  description: 选择此模块，使您能够使用其提供的工具。 | Select this module, enabling you to use the tools it provides.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 0.5
