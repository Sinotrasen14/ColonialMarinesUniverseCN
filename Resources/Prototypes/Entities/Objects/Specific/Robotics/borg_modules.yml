# generic modules
- type: entity
  id: BorgModulePrying
  parent: [BaseBorgModule]
  name: 撬门模块 | prying module
  description: 一个通用义体模块，允许单位撬开门。 | A universal cyborg module which allows the unit to pry open doors.
  components:
  - type: Sprite
    layers:
    - state: generic
    - state: icon-tools
  - type: ComponentBorgModule
    components:
    - type: Prying
      speedModifier: 1.5
      useSound:
        path: /Audio/Items/jaws_pry.ogg

- type: entity
  id: BorgModuleCable
  parent: [BaseBorgModule, BaseProviderBorgModule]
  name: 电缆赛博格模块 | cable cyborg module
  description: 一个通用赛博格模块，允许单位安装和操作电气系统。 | A universal cyborg module which allows the unit to install and manipulate electrical systems.
  components:
  - type: Sprite
    layers:
    - state: generic
    - state: icon-cables
  - type: ItemBorgModule
    hands:
    - item: CableApcStack10
      hand:
        emptyRepresentative: CableApcStack10
        emptyLabel: borg-slot-cables-empty
        whitelist:
          tags:
          - CableCoil
    - item: CableMVStack10
      hand:
        emptyRepresentative: CableMVStack10
        emptyLabel: borg-slot-cables-empty
        whitelist:
          tags:
          - CableCoil
    - item: CableHVStack10
      hand:
        emptyRepresentative: CableHVStack10
        emptyLabel: borg-slot-cables-empty
        whitelist:
          tags:
          - CableCoil
    - item: Wirecutter
    - item: Crowbar
    - item: trayScanner
  - type: BorgModuleIcon
    icon: {sprite: Interface/Actions/actions_borg.rsi, state: wire-module}

- type: entity
  id: BorgModuleArtistry
  parent: [BaseBorgModule, BaseProviderBorgModule]
  name: 艺术义体模块 | artistry cyborg module
  description: 当空间站在燃烧时，用于艺术和手工艺的模块！ | A module for arts & crafts whilst the station burns!
  components:
  - type: Sprite
    layers:
    - state: generic
    - state: icon-artistry
  - type: ItemBorgModule
    hands:
    - item: SprayPainterBorg
    - item: CrayonBorg
  - type: BorgModuleIcon
    icon: {sprite: Interface/Actions/actions_borg.rsi, state: artistry-module}

- type: entity
  id: BorgModuleFireExtinguisher
  parent: [BaseBorgModule, BaseProviderBorgModule]
  name: 推进器赛博格模块 | thruster cyborg module
  description: NT指派了一个团队为赛博格单位设计喷气背包，但资金耗尽，只造出了一个更大的灭火器。不过它配备了集成GPS和质量扫描仪！ | NT assigned a team to design a jetpack for cyborg units, but they ran out of funding and just made a bigger fire extinguisher. It comes with a integrated GPS and mass scanner though!
  components:
  - type: Sprite
    layers:
    - state: generic
    - state: icon-fire-extinguisher
  - type: ItemBorgModule
    hands:
    - item: BorgFireExtinguisher
    - item: BorgHandheldGPSBasic
    - item: HandheldStationMapUnpowered
    - item: HandHeldMassScannerBorg
  - type: BorgModuleIcon
    icon: {sprite: Interface/Actions/actions_borg.rsi, state: extinguisher-module}

- type: entity
  id: BorgModuleTool
  parent: [BaseBorgModule, BaseProviderBorgModule]
  name: 工具赛博格模块 | tool cyborg module
  components:
  - type: Sprite
    layers:
    - state: generic
    - state: icon-tools
  - type: ItemBorgModule
    hands:
    - item: Crowbar
    - item: Wrench
    - item: Screwdriver
    - item: Wirecutter
    - item: WelderIndustrial
    - item: Multitool
  - type: BorgModuleIcon
    icon: {sprite: Interface/Actions/actions_borg.rsi, state: tool-module}

- type: entity
  id: BorgModuleInflatable
  parent: [BaseBorgModule, BaseProviderBorgModule]
  name: 充气赛博格模块 | inflatable cyborg module
  components:
  - type: Sprite
    layers:
    - state: generic
