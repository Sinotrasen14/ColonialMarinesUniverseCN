- type: entity
  parent: [DrinkVisualsAllFilled, DrinkBottleGlassSmallBaseFull]
  id: DrinkMopwataBottleRandom
  name: 美味拖把水 | delicious mopwata
  description: 一个雾蒙蒙的棕色瓶子，标签已经褪色，上面画着一把拖把。里面装满了浑浊的……陈年旧货。 | A foggy brown bottle with a faded label depicting a mop. It comes full of murky... vintage.
