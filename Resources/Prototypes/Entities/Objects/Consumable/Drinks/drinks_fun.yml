- type: entity
  abstract: true
  parent: [DrinkBaseMaterialPlastic, SolutionSmall, DrinkBase, DrinkBaseOpenable, DrinkVisualsAllFilled]
  id: BaseSqueezeBottle
  components:
  - type: Openable
    sound:
      collection: packetOpenSounds
  - type: Sprite
    layers:
    - state: icon_empty
      map: ["enum.OpenableVisuals.Layer"]
    - state: fill-6
      map: ["enum.SolutionContainerLayers.Fill"]   # already has liquid, so no visible: false
    - state: icon-front
      map: ["enum.SolutionContainerLayers.Overlay"]
  - type: SolutionContainerVisuals
    maxFillLevels: 6
  - type: TrashOnSolutionEmpty
    solution: drink

- type: entity
  parent: BaseSqueezeBottle
  id: DrinkSpaceGlue
  name: 太空胶水管 | space glue tube
  description: 高性能胶水，用于维护极其复杂的机械设备。请勿饮用！ | High performance glue intended for maintenance of extremely complex mechanical equipment. DON'T DRINK!
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/glue-tube.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: SpaceGlue
        Quantity: 60
  - type: Glue

- type: entity
  parent: BaseSqueezeBottle
  id: DrinkSpaceLube
  name: 太空润滑管 | space lube tube
  description: 用于维护极其复杂机械设备的髙性能润滑剂。 | High performance lubricant intended for maintenance of extremely complex mechanical equipment.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/lube-tube.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: SpaceLube
        Quantity: 60
  - type: Lube

# Find your nearest clown and give them a gift :o)
- type: entity
  parent: BluespaceBeaker
  id: BottomlessLube
  name: 无尽润滑烧杯 | bottomless lube beaker
  suffix: DEBUG
  description: 这个异常烧杯会无限产生太空润滑剂，因此必须严加看管，以免落入不法之徒手中。 | This anomalous beaker infinitely produces space lube and as such is to be closely guarded such that it doesn't fall in the wrong hands.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: SpaceLube
        Quantity: 960
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: SpaceLube
        Quantity: 240

- type: entity
  parent: [DrinkBaseMaterialGlass, DrinkBase]
  id: DrinkJarWhat
  name: 一罐东西 | jar of something
  description: 你根本看不出这是什么。 | You can't really tell what this is.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/jar_what.rsi
  - type: FitsInDispenser
    solution: drink
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
        transferForensics: true

