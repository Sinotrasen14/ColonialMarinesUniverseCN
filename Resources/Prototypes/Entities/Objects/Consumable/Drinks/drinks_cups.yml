## Filled

- type: entity
  parent: DrinkBaseMug
  id: DrinkHotCoco
  name: 热巧克力 | hot chocolate
  suffix: Full
  description: 一种由融化的巧克力和加热的牛奶组成的热饮。 | A heated drink consisting melted chocolate and heated milk.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: HotCocoa
        Quantity: 30
  - type: Icon
    sprite: Objects/Consumable/Drinks/mug.rsi
    state: icon-vend-brown
  - type: Sprite
    layers:
    - state: icon
    - state: fill-3
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: TrashOnSolutionEmpty
    solution: drink

- type: entity
  parent: DrinkBaseMug
  id: DrinkHotCoffee
  name: 咖啡 | coffee
  suffix: Full
  description: 咖啡是一种由咖啡树烘焙种子（通常称为咖啡豆）制成的冲泡饮品。 | Coffee is a brewed drink prepared from roasted seeds, commonly called coffee beans, of the coffee plant.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Coffee
        Quantity: 30
  - type: Icon
    sprite: Objects/Consumable/Drinks/mug.rsi
    state: icon-vend-brown
  - type: Sprite
    layers:
    - state: icon
    - state: fill-3
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: TrashOnSolutionEmpty
    solution: drink

- type: entity
  parent: DrinkBaseMug
  id: DrinkCafeLatte
  name: 咖啡拿铁 | cafe latte
  suffix: Full
  description: 一杯香浓可口的饮品，适合阅读时享用。 | A nice, strong and tasty beverage while you are reading.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: CafeLatte
