  name: 惩戒蔓越莓罐头 | Smite Cranberry can
  description: 你们想要一罐惩戒蔓越莓吗？深受各地管理员喜爱。请适量饮用。节日限定供应！ | Y'all want a Smite Cranberry? Beloved by administrators everywhere. Drink in moderation. A limited run for the holidays!
