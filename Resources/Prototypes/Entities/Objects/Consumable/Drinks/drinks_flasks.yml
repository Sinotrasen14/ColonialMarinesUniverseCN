    sprite: Objects/Consumable/Drinks/shinyflask.rsi

- type: entity
  parent: FlaskBase
  id: DrinkMREFlask
  suffix: Full
  name: MRE军用水壶 | MRE flask
  description: 一个旧军用水壶，装满了给士兵们最好的东西。 | An old military flask, filled with the finest contents for soldiers.
