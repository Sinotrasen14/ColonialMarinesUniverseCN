  description: 一个破旧的旧瓶子，它的盖子似乎不见了。 | A decrepit old flask, its lid seems to be missing.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/flask_old.rsi
  - type: FitsInDispenser
    solution: drink

- type: entity
