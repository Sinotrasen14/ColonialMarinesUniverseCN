# Trash

- type: entity
  parent: BaseItem
  id: FoodFrozenSnowconeTrash
  name: 纸锥 | paper cone
  description: 一个皱巴巴的纸锥，用来装冰品。一文不值。 | A crumpled paper cone used for an icy treat. Worthless.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Consumable/Food/frozen.rsi
    state: cone-trash
  - type: Tag
    tags:
    - Trash

- type: entity
  name: 冰棍棒 | popsicle stick
  parent: BaseItem
  id: FoodFrozenPopsicleTrash
  description: 曾经承载过美味。如今，只剩空寂。 | Once held a delicious treat. Now, 'tis barren.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/frozen.rsi
    layers:
    - state: stick
      map: ["enum.DamageStateVisualLayers.Base"]
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        stick: ""
        stick2: ""
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage
