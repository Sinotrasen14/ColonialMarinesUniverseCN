# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_snack.yml
# Base

- type: entity
  parent: [SolutionVeryTiny, FoodInjectableBase]
  id: FoodFrozenBase
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/frozen.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10

# Ice-cream

- type: entity
  parent: FoodFrozenBase
  id: FoodFrozenSandwich
  name: 冰淇淋三明治 | ice-cream sandwich
  description: 便携式独立包装冰淇淋。 | Portable ice-cream in its own packaging.
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    state: sandwich

- type: entity
  parent: FoodFrozenBase
  id: FoodFrozenSandwichStrawberry
  name: 草莓冰淇淋三明治 | strawberry ice-cream sandwich
  description: 便携式草莓味冰淇淋，自带包装。 | Portable ice-cream in its own packaging of the strawberry variety.
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    state: sandwich-strawberry

- type: entity
  name: 太空冰爽 | space freezy
  parent: FoodFrozenBase
  id: FoodFrozenFreezy
  description: 太空中最美味的冰淇淋。 | The best ice-cream in space.
  components:
  - type: Sprite
    state: spacefreezy

- type: entity
  name: 冰淇淋圣代 | ice-cream sundae
  parent: FoodFrozenBase
  id: FoodFrozenSundae
  description: 经典甜点。 | A classic dessert.
  components:
  - type: Sprite
    state: spacefreezy

- type: entity
  parent: FoodFrozenBase
  id: FoodFrozenCornuto
  name: 玉米卷 | cornuto
  description: 一种那不勒斯香草和巧克力冰淇淋蛋筒。它用一层焦糖坚果碎威胁着你。 | A Neapolitan vanilla and chocolate ice-cream cone. It menaces with a sprinkling of caramelized nuts.
  components:
  - type: Item
    storedRotation: -45
  - type: Sprite
    state: cornuto
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Theobromine
        Quantity: 1

# Popsicle

- type: entity
  name: 橙子奶油冰棒 | orange creamsicle
  parent: FoodFrozenBase
  id: FoodFrozenPopsicleOrange
  description: 经典的橙子奶油冰棒。阳光般明媚的冰冻甜品。 | A classic orange creamsicle. A sunny frozen treat.
  components:
  - type: Sprite
    layers:
    - state: stick
    - state: popsicle-base
    - state: popsicle
      color: orange
  - type: Edible
    trash:
    - FoodFrozenPopsicleTrash
  - type: Tag
    tags:
    - Fruit
    - Creamsicle

- type: entity
  name: 莓果奶油冰棒 | berry creamsicle
  parent: FoodFrozenBase
  id: FoodFrozenPopsicleBerry
  description: 一支色彩鲜艳的莓果奶油冰棒。一份莓果味十足的美味冰品。 | A vibrant berry creamsicle. A berry good frozen treat.
  components:
  - type: Sprite
    layers:
    - state: stick
    - state: popsicle-base
    - state: popsicle
      color: red
  - type: Edible
    trash:
    - FoodFrozenPopsicleTrash
  - type: Tag
    tags:
    - Fruit
    - Creamsicle

- type: entity
  name: 巨型冰淇淋 | jumbo ice-cream
  parent: FoodFrozenBase
  id: FoodFrozenPopsicleJumbo
  description: 一款奢华的冰淇淋，外层裹着浓郁的巧克力。它比你记忆中的要小。 | A luxurious ice-cream covered in rich chocolate. It's smaller than you remember.
  components:
  - type: Sprite
    layers:
    - state: stick
    - state: jumbo
  - type: Edible
    trash:
    - FoodFrozenPopsicleTrash
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Theobromine
        Quantity: 1

# Snowcone

# Use this one as a base for other colored snowcones. Apply a color to the alpha
# layer depending on soda/syrup/waterever. Name and description will also have
# to be modified.
- type: entity
  name: 甜雪锥 | sweet snowcone
  #  name: [Flavor] snowcone
  parent: FoodFrozenBase
  id: FoodFrozenSnowconeBase
  description: 只是刨冰和简单糖浆，毫不费力。 | It's just shaved ice and simple syrup, minimum effort.
  #  description: [Liquid] drizzled over a snowball in a paper cup.
  components:
  - type: Sprite
    layers:
    - state: cone
    - state: alpha-filling
    #      color: foo
  - type: Edible
    trash:
    - FoodFrozenSnowconeTrash
  - type: Solution
    solution:
      reagents:
      - ReagentId: Ice
        Quantity: 8
      - ReagentId: Water
        Quantity: 2
      - ReagentId: Sugar
        Quantity: 2

- type: entity
  name: 无味雪糕 | flavorless snowcone
  parent: FoodFrozenSnowconeBase
