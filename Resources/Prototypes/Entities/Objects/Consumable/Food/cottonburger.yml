# Cotton Bun

- type: entity
  parent: [FoodBreadSliceBase, BaseSlicingRefinable]
  id: FoodCottonBun
  name: 棉质汉堡胚 | cotton bun
  description: 一个棉质汉堡胚。柔软、圆润，方便拿握。 | A cotton hamburger bun. Soft, round and convenient to hold.
  components:
  - type: Edible
    # requiresSpecialDigestion remains false for RMC; see 8c44d4fdfe.
  - type: Sprite
    sprite: Objects/Consumable/Food/cottonburger.rsi
    layers:
    - state: cottonbun
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Fiber
        Quantity: 5
  - type: ToolRefinable
    refineTime: 1
    refineResult:
    - id: FoodCottonBunTop
      amount: 1
    - id: FoodCottonBunBottom
      amount: 1
  - type: Tag
    tags:
    - ClothMade
    - Bread
    - Slice


- type: entity
  parent: FoodBreadSliceBase
  id: FoodCottonBunBottom
  name: 棉质底堡 | cotton bottom bun
  description: 是时候让飞蛾们体验汉堡塔了。 | It's time for moths to experience the burger tower.
  components:
  - type: Item
    size: Normal #patch until there is an adequate resizing system in place
  - type: Edible
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: Objects/Consumable/Food/cottonburger.rsi
    layers:
    - state: cottonbun_bottom
    - map: ["foodSequenceLayers"]
  - type: FoodSequenceStartPoint
    key: CottonBurger
    maxLayers: 10
    startPosition: 0, 0
    offset: 0, 0.07
    minLayerOffset: -0.05, 0
    maxLayerOffset: 0.05, 0
    nameGeneration: food-sequence-cotton-burger-gen
  - type: Appearance
  - type: FoodMetamorphableByAdding
  - type: Solution
    solution:
      maxVol: 7.5
      reagents:
      - ReagentId: Nutriment
        Quantity: 2.5
      - ReagentId: Fiber
        Quantity: 2.5
  - type: Tag
    tags:
    - ClothMade
    - Bread
    - Slice

- type: entity
  parent: FoodBreadSliceBase
  id: FoodCottonBunTop
  name: 棉顶面包 | cotton top bun
  description: 为你的纤维汉堡塔画上完美句号。 | The perfect finish for your fibrous burger tower.
  components:
  - type: Edible
  - type: Sprite
    sprite: Objects/Consumable/Food/cottonburger.rsi
    layers:
    - state: cottonbun_top
  - type: Solution
    solution:
      maxVol: 7.5
      reagents:
      - ReagentId: Nutriment
        Quantity: 2.5
      - ReagentId: Fiber
        Quantity: 2.5
  - type: FoodSequenceElement
    entries:
      CottonBurger: CottonBunTopBurger
  - type: Tag
    tags:
    - ClothMade
    - Bread
    - Slice
