# Shakers

- type: entity
  parent: [SolutionVeryTiny, BaseFoodCondiment] # TODO: This should not inherit TrashOnSolutionEmpty, SpaceGarbage and the price of 0
  id: BaseFoodShaker
  abstract: true
  name: 空调料瓶
  description: 用于储存和分发香料的摇瓶。
  components:
  - type: Item
    size: Tiny
  - type: Edible
    edible: Drink
    solution: food
    destroyOnEmpty: false
    utensil: None # don't conflict with stirring
  - type: SolutionTransfer
    transferAmount: 1
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpillBehavior { }
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
        transferForensics: true
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Sprite
    state: shaker-empty
  - type: RefillableSolution
    solution: food


- type: entity
  parent: BaseFoodShaker
  id: FoodShakerSalt
  name: 盐瓶 | salt shaker
  description: 盐。大概来自太空海洋。 | Salt. From space oceans, presumably.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: TableSalt
        Quantity: 15
  - type: Sprite
    state: shaker-salt
  - type: Icon
    state: shaker-salt
  - type: Tag
    tags:
    - SaltShaker

- type: entity
  parent: BaseFoodShaker
  id: FoodShakerPepper
  name: 胡椒瓶 | pepper shaker
  description: 常用于给食物调味或让人打喷嚏。 | Often used to flavor food or make people sneeze.
  components:
