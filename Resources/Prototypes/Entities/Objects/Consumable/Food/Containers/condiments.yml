# TODO: Removes the icon components from all these when that gets fixed.

- type: entity
  parent: [SolutionFood, BaseItem]
  id: BaseFoodCondiment
  abstract: true
  components:
  - type: DrawableSolution
    solution: food
  - type: DrainableSolution
    solution: food
  - type: ExaminableSolution
    solution: food
  - type: Sprite
    sprite: Objects/Consumable/Food/condiments.rsi
  - type: Icon
    sprite: Objects/Consumable/Food/condiments.rsi
  - type: TrashOnSolutionEmpty
    solution: food
  - type: SpaceGarbage
  - type: StaticPrice
    price: 0

# Packets

- type: entity
  parent: BaseFoodCondiment
  id: BaseFoodCondimentPacket
  name: 调料包 | condiment packet
  abstract: true
  description: 一小包塑料包装的调料，用来撒在食物上。 | A small plastic pack with condiments to put on your food.
  components:
  - type: Item
    size: Tiny
  - type: Edible
    edible: Food # usually contains powders like flour or condiments like ketchup
    solution: food
    destroyOnEmpty: false
    utensil: Spoon
  - type: Openable
    sound:
      collection: packetOpenSounds
  # Since this one is closed, the only way to insert liquid is with a syringe.
  - type: InjectableSolution
    solution: food
  # Note NOT refillable.
  # It be a shame if it turned out ALL drinks were ALWAYS refillable.... ffs.
  # Well its fixed now, but I want to share my pain.
  - type: Solution
    solution:
      maxVol: 1 # Cheap
  - type: SolutionTransfer
    maxTransferAmount: 1
  - type: Sprite
    layers:
    - state: packet-trans-2
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: true
    - state: packet-layer
      map: ["enum.OpenableVisuals.Layer"]
    - state: packet-label
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          true: {state: "packet-layer-open"}
          false: {state: "packet-layer"}
  - type: Icon
    state: packet-empty
  - type: PhysicalComposition
    materialComposition:
      Plastic: 50
  - type: Tag
    tags:
    - Packet
  - type: ExaminableSolution
    exactVolume: true

- type: entity
  parent: BaseFoodCondimentPacket
  id: BaseFoodCondimentPacketDrink
