  name: 香蕉皮 | banana peel
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/banana.rsi
    state: peel
  - type: Item
    sprite: Objects/Specific/Hydroponics/banana.rsi
    heldPrefix: peel
  - type: Slippery
  - type: StepTrigger
    intersectRatio: 0.2
  - type: CollisionWake
    enabled: false
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      slips:
        shape: !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        layer:
        - SlipLayer
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 30
        mask:
        - ItemMask
  - type: Tag
    tags:
    - Recyclable
    - Trash
    - BananaPeel
    - Ruminant
    - WhitelistChameleon
    - HamsterWearable
  - type: Solution
    solution:
      maxVol: 7.5
      reagents:
      - ReagentId: PulpedBananaPeel
        Quantity: 4
  - type: Extractable
    grindableSolutionName: food
  - type: SpaceGarbage
  - type: Edible
    requiresSpecialDigestion: true
  - type: Clothing
    sprite: Objects/Specific/Hydroponics/banana.rsi
    equippedPrefix: peel
    slots:
    - HEAD
    quickEquip: false

