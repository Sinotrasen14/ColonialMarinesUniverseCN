- type: entity
  name: 香蕉奶油派 | banana cream pie
  parent: [FoodPieBase, BaseSlicingRefinableFood]
  id: FoodPieBananaCream
  description: 就像回到家乡，在小丑星球上一样！叭叭！ | Just like back home, on clown planet! HONK!
  components:
  - type: FlavorProfile
    flavors:
    - sweet
    - banana
    - creamy
  - type: Sprite
    layers:
    - state: tin
    - state: plain
  - type: CreamPie
  - type: ThrowingAngle
    angle: 180
  - type: LandAtCursor
  - type: ContainerContainer
    containers:
      payloadSlot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      payloadSlot:
        whitelist:
          components:
          - TimerTrigger
        insertSound:
          path: /Audio/Weapons/Guns/Empty/empty.ogg
        ejectSound:
          path: /Audio/Weapons/Guns/Empty/empty.ogg
        swap: false
        disableEject: true
  - type: Tag
    tags:
    - Fruit
    - Pie
  - type: ToolRefinable
    refineResult:
    - id: FoodPieBananaCreamSlice
      amount: 8

- type: entity
  name: 一块香蕉奶油派 | slice of banana cream pie
