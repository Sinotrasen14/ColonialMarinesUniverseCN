# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_baked_whole.yml & food_baked_single.yml
# Base

- type: entity
  abstract: true
  parent: [SolutionNormal, FoodInjectableBase]
  id: FoodPieBase
  components:
  - type: Item
    size: Normal
  - type: FlavorProfile
    flavors:
    - sweet
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/pie.rsi
  - type: Solution
    solution:
      reagents: #Most of these are this with slight variations, not worth changing until we have the rest of the reagents
      - ReagentId: Nutriment
        Quantity: 64
      - ReagentId: Vitamin
        Quantity: 8
      - ReagentId: Sugar
        Quantity: 8
  - type: Edible #It's actually possible now to have a pie stored in a tin rather than spawning trash when you finish eating it. But right now I'm just cleaning up.
    trash:
    - FoodPlateTin
  - type: Tag
    tags:
    - Pie

- type: entity
  parent: FoodInjectableBase # Not sliceable
  id: FoodPieSliceBase
  abstract: true
  description: 一块派。美味！ | A slice of pie. Tasty!
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
    - sweet
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/pie.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 8
      - ReagentId: Vitamin
        Quantity: 1
      - ReagentId: Sugar
        Quantity: 1
  - type: Tag
    tags:
    - Pie
    - Slice

# Pie

- type: entity
  name: 苹果派 | apple pie
  parent: [FoodPieBase, BaseSlicingRefinableFood]
  id: FoodPieApple
  description: 一个包含甜蜜、甜蜜的爱……或者苹果的派。 | A pie containing sweet, sweet love... or apple.
  components:
  - type: FlavorProfile
    flavors:
    - sweet
    - apple
  - type: Sprite
    layers:
    - state: tin
    - state: apple
  - type: ToolRefinable
    refineResult:
    - id: FoodPieAppleSlice
      amount: 8
  - type: Tag
    tags:
    - Fruit
    - Pie

- type: entity
  name: 一块苹果派 | slice of apple pie
