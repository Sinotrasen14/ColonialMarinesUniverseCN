# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_baked_whole.yml & food_baked_single.yml
# Base

- type: entity
  abstract: true
  parent: [SolutionVeryTiny, FoodInjectableBase]
  id: FoodBagelBase
  description: 一个美味的百吉饼。 | A delicious bagel.
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
    - bread
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/bagel.rsi
    state: bagel
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10

- type: entity
  parent: FoodBagelBase
  id: FoodBagel
  name: 百吉饼 | bagel

- type: entity
  parent: FoodBagelBase
  id: FoodBagelPoppy
  name: 罂粟籽百吉饼 | poppy seed bagel
  description: 一个美味的百吉饼，上面撒有注入比卡立定的罂粟籽。 | A delicious bagel topped with bicaridine-infused poppy seeds.
  components:
  - type: FlavorProfile
    flavors:
    - bread
    - medicine
  - type: Sprite
    state: bagel-poppy
  - type: Solution
    solution:
      reagents:
      - ReagentId: CMBicaridine
        Quantity: 5
      - ReagentId: Nutriment
        Quantity: 10

- type: entity
  parent: FoodBagelBase
  id: FoodBagelCotton
  name: 棉花贝果 | cotton bagel
  description: 一种用棉花面团制成的美味贝果。 | A delicious bagel made with cotton dough.
  components:
  - type: FlavorProfile
    flavors:
    - bread
    - cotton
  - type: Sprite
    state: bagel-cottondough
  - type: Edible
    # requiresSpecialDigestion remains false for RMC; see 33708ba653.
  - type: Tag
    tags:
    - ClothMade
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Fiber
        Quantity: 5
