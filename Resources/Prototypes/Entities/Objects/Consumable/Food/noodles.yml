# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_meal.yml
# Base

- type: entity
  abstract: true
  parent: [SolutionSmall, FoodInjectableBase]
  id: FoodNoodlesBase
  description: 这真是一道美味的意面！ | Now that's a nice pasta!
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    sprite: Objects/Consumable/Food/noodles.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 30

# Noodles

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodlesBoiled
  name: 煮意大利面 | boiled spaghetti
  description: 一盘普通的面条，还需要更多配料。 | A plain dish of noodles, this needs more ingredients.
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
    - pasta
  - type: Sprite
    state: boiled
# Tastes like pasta.

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodles
  name: 意大利面 | spaghetti
  description: 意大利面配碎番茄。就像你那个虐待狂父亲以前做的一样！ | Spaghetti and crushed tomatoes. Just like your abusive father used to make!
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
    - pasta
    - tomato
  - type: Sprite
    state: tomato
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 45
      - ReagentId: Vitamin
        Quantity: 5
  - type: Tag
    tags:
    - Fruit # ???
# Tastes like pasta, tomato.

- type: entity
  parent: [SolutionNormal, FoodNoodlesBase]
  id: FoodNoodlesCopy
  name: 复制粘贴文 | copypasta
  description: 你可能不该尝试这个，你总是听人说它有多糟糕…… | You probably shouldn't try this, you always hear people talking about how bad it is...
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Edible
    trash:
    - FoodPlateSmall
    - FoodPlateSmall
  - type: FlavorProfile
    flavors:
    - copypasta
  - type: Sprite
    state: copypasta
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 90
      - ReagentId: Vitamin
        Quantity: 10
# Tastes like pasta, bad humor.

