- type: entity
  id: Cigar
  parent: BaseCigar
  name: 雪茄 | cigar
  description: "一卷棕色的烟草，还有……嗯，你不太确定。 | A brown roll of tobacco and... well, you're not quite sure."
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigars/cigar.rsi
    state: unlit-icon
  - type: Tag
    tags:
    - Cigar
    - Trash
  - type: Clothing
    sprite: Objects/Consumable/Smokeables/Cigars/cigar.rsi
    slots: [mask]
    equippedPrefix: unlit
  - type: Item
    size: Tiny
    sprite: Objects/Consumable/Smokeables/Cigars/cigar.rsi
    heldPrefix: unlit

- type: entity
  id: CigarSpent
  parent: Cigar
  suffix: spent
  components:
  - type: Sprite
    state: burnt-icon
  - type: Smokable
    state: Burnt
  - type: Tag
    tags:
    - Cigar
    - Trash
    - Burnt

- type: entity
  id: CigarGold
  parent: Cigar
  name: 上等哈瓦那雪茄 | premium Havanian cigar
  description: 一支只配最顶尖中的顶尖享用的雪茄。 | A cigar fit for only the best of the best.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigars/cigar-gold.rsi
    state: unlit-icon
  - type: Clothing
    sprite: Objects/Consumable/Smokeables/Cigars/cigar-gold.rsi
    slots: [mask]
    equippedPrefix: unlit
  - type: Item
    size: Tiny

- type: entity
  id: CigarGoldSpent
  parent: CigarGold
  suffix: spent
  components:
  - type: Sprite
    state: burnt-icon
  - type: Smokable
    state: Burnt
