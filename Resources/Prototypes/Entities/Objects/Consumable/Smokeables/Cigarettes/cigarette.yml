- type: entity
  id: Cigarette
  parent: BaseCigar
  name: 香烟 | cigarette
  description: 一卷烟草和尼古丁。 | A roll of tobacco and nicotine.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/cigarette.rsi
    state: unlit-icon
  - type: Tag
    tags:
    - Cigarette
    - Trash
  - type: SpaceGarbage
  - type: Clothing
    sprite: Objects/Consumable/Smokeables/Cigarettes/cigarette.rsi
    slots:
    - mask
    - ears
    equippedPrefix: unlit
  - type: Item
    size: Tiny
    sprite: Objects/Consumable/Smokeables/Cigarettes/cigarette.rsi
    heldPrefix: unlit
  - type: Construction
    graph: smokeableCigarette
    node: cigarette
  - type: CMSurgeryTool
  - type: CMCautery
  - type: CMUImprovisedSurgeryTool
    delayMultiplier: 2.8
    mishapChance: 0.20
    mishapDamageType: Heat
    mishapDamageAmount: 3
    failurePenalty: 2

- type: entity
  id: SoakedCigarette
  parent: BaseCigar
  name: 香烟 | cigarette
  suffix: Soaked
  description: 一卷浸泡过化学物质的烟草和尼古丁。 | A roll of tobacco and nicotine soaked in some chemical.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/cigarette.rsi
    state: unlit-icon
  - type: Tag
    tags:
    - Cigarette
    - Trash
  - type: SpaceGarbage
  - type: Clothing
    sprite: Objects/Consumable/Smokeables/Cigarettes/cigarette.rsi
    slots: [mask]
    equippedPrefix: unlit
  - type: Item
    size: Tiny
  - type: Construction
    graph: smokeableCigarette
    node: cigarette

