- type: entity
  id: CigPackMixed
  parent: CigPackMixedBase
  name: 丹的湿烟 | Dan's soaked smokes
  suffix: Mixed
  description: 丹与NT化学部门合作处理了多余的化学品，尽情享受吧。 | Dan worked with NT chemistry to dispose of excess chemicals, ENJOY.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/Packs/mixed.rsi
  - type: Item
    sprite: Objects/Consumable/Smokeables/Cigarettes/Packs/mixed.rsi
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 2, 9
        tableId: RandomSoakedSmokeTable

