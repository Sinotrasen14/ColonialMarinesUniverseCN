- type: entity
  parent: BaseStorageItem
  name: 一包卷烟纸 | pack of rolling paper
  id: PackPaperRolling
  description: 一包薄纸，用于制作精细的烟制品。 | A pack of thin pieces of paper used to make fine smokeables.
  components:
  - type: Storage
    grid:
    - 0,0,3,1
    whitelist:
      tags:
      - RollingPaper
      - CigFilter
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: PaperRolling
        amount: 4
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/paper.rsi
    state: cigpapers
  - type: Item
    sprite: Objects/Consumable/Smokeables/Cigarettes/paper.rsi

- type: entity
  parent: PackPaperRolling
  name: 带滤嘴的卷烟纸包 | pack of rolling paper with filters
  id: PackPaperRollingFilters
  description: 一包滤嘴和薄纸，用于制作精细的烟制品。 | A pack of filters and thin pieces of paper used to make fine smokeables.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: PaperRolling
          amount: 2
        - id: CigaretteFilter
          amount: 2

- type: entity
  id: PaperRolling
  name: 卷烟纸 | rolling paper
  description: 用来制作精细烟卷的薄纸。 | A thin piece of paper used to make fine smokeables.
  suffix: Full
  parent: BaseItem
  components:
  - type: Stack
    stackType: PaperRolling
    count: 5
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/paper.rsi
    state: cigpaper
  - type: Item
    sprite: Objects/Consumable/Smokeables/Cigarettes/paper.rsi
    size: Tiny
  - type: Tag
    tags:
    - RollingPaper
    - Trash
  - type: SpaceGarbage

- type: entity
  id: PaperRolling1
  suffix: Single
  parent: PaperRolling
  components:
  - type: Stack
    count: 1

- type: entity
  id: CigaretteFilter
  name: 香烟过滤嘴 | cigarette filter
  description: 一条坚硬的纸条，用作手工卷烟的过滤嘴。 | A strip of firm paper used as a filter for handmade cigarettes.
  suffix: Full
  parent: BaseItem
  components:
  - type: Stack
    stackType: CigaretteFilter
    count: 5
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/paper.rsi
    state: cigfilter
  - type: Item
    sprite: Objects/Consumable/Smokeables/Cigarettes/paper.rsi
    size: Tiny
  - type: Tag
    tags:
    - CigFilter
    - Trash

- type: entity
  id: CigaretteFilter1
  suffix: Single
  parent: CigaretteFilter
  components:
  - type: Stack
    count: 1
