- type: entity
  abstract: true
  parent: [SolutionSpray, BaseItem]
  id: BaseFireExtinguisher
  components:
  - type: RefillableSolution
    solution: spray
  - type: DrainableSolution
    solution: spray
  - type: SolutionTransfer
    maxTransferAmount: 100
    transferAmount: 100
  - type: UseDelay
  - type: Spray
    transferAmount: 10
    pushbackAmount: 60
    spraySound:
      path: /Audio/Effects/extinguish.ogg
    sprayedPrototype: ExtinguisherSpray
    vaporAmount: 3
    vaporSpread: 90
    sprayVelocity: 2.0
  - type: ItemToggleExaminableStatus
    onText: item-toggle-examined-active
    offText: item-toggle-examined-not-active
  - type: ItemToggle
    soundActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.125
        volume: -4
    soundDeactivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.125
        volume: -4
    verbToggleOn: fire-extinguisher-component-verb-remove
    verbToggleOff: fire-extinguisher-component-verb-engage
  - type: SpraySafety
  - type: Tool
    qualities:
    - Rolling
    speedModifier: 0.5 # its very big, awkward to use
  - type: Appearance
  - type: Tag
    tags:
    - FireExtinguisher
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          true: {state: fire_extinguisher_open}
          false: {state: fire_extinguisher_closed}

- type: entity
  parent: [SolutionFireExtinguisher, BaseFireExtinguisher]
  id: FireExtinguisher
  name: 灭火器 | fire extinguisher
  description: 它能灭火。 | It extinguishes fires.
  components:
  - type: Sprite
    sprite: Objects/Misc/fire_extinguisher.rsi
    layers:
    - state: fire_extinguisher_closed
      map: ["enum.ToggleableVisuals.Layer"]
  - type: Item
    sprite: Objects/Misc/fire_extinguisher.rsi
    size: Normal
  - type: MeleeWeapon
    wideAnimationRotation: 180
    damage:
      types:
        Blunt: 10
    soundHit:
      path: /Audio/Weapons/smash.ogg
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  parent: [SolutionSpray, SolutionNormal]
  id: SolutionFireExtinguisher
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 120

- type: entity
  parent: [SolutionFireExtinguisherLarge, FireExtinguisher]
  id: BorgFireExtinguisher
  name: 机动喷气器 | maneuvering jet
  description: 基于灭火器技术，机动喷气器……嗯，没错，它就是个更大的灭火器。 | Based on fire extinguisher technology, the maneuvering jet is... well yes, its just a bigger fire extinguisher.

- type: entity
  parent: [SolutionSpray, SolutionLarge]
  id: SolutionFireExtinguisherLarge
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 240

- type: entity
  name: 灭火器喷雾 | extinguisher spray
  id: ExtinguisherSpray
  parent: Vapor
  categories: [HideSpawnMenu]
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        hard: false
        mask:
        - FullTileMask
        - Opaque
        - ItemMask
        - VaporMask
        layer:
        - ItemMask
  - type: Sprite
    sprite: Effects/extinguisherSpray.rsi
    layers:
    - state: extinguish
      map: ["enum.VaporVisualLayers.Base"]
  - type: Physics
    bodyType: Dynamic
  - type: Appearance
  - type: VaporVisuals
    animationTime: 0.8
    animationState: extinguish

- type: entity
  name: 袖珍灭火器 | pocket fire extinguisher
  parent: [SolutionFireExtinguisherMini, BaseFireExtinguisher]
  id: FireExtinguisherMini
  description: 一个轻便紧凑的玻璃纤维框架模型灭火器。它比它的大兄弟装的水少。 | A light and compact fibreglass-framed model fire extinguisher. It holds less water than its bigger brother.
  components:
  - type: Sprite
    sprite: Objects/Misc/fire_extinguisher_mini.rsi
    layers:
    - state: fire_extinguisher_closed
      map: ["enabled"]
  - type: Item
    sprite: Objects/Misc/fire_extinguisher_mini.rsi
    size: Small
  - type: MeleeWeapon
    wideAnimationRotation: 180
    damage:
      types:
        Blunt: 3 #completely ineffective; your fists are better
    soundHit:
      path: /Audio/Effects/weak_hit1.ogg
  - type: PhysicalComposition
    materialComposition:
      Steel: 50
      Glass: 40

- type: entity
  parent: [SolutionSpray, SolutionSmall]
  id: SolutionFireExtinguisherMini
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 60

# used for a engi xenoborg module
- type: entity
  parent: [FireExtinguisher, BaseXenoborgContraband]
  id: SelfRechargingFireExtinguisher
  name: 自动补充灭火器 | self-recharging fire extinguisher
  description: 它能灭火。它会缓慢地重新注满水。 | It extinguishes fires. it slowly refills with water.
  components:
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 1
