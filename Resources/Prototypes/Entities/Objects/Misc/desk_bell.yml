- type: entity
  abstract: true
  parent: [BaseItem, BaseItemDestructible]
  id: BaseDeskBell
  components:
  - type: Sprite
    sprite: Objects/Misc/desk_bell.rsi
    state: icon-empty
  - type: Construction
    graph: &BellGraph BellGraph
    node: start
  - type: Destructible
    thresholds:
    - trigger: &DamageTrigger50 !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: MeleeWeapon
    wideAnimationRotation: 180
    soundHit: &BellSound
      collection: DeskBell
      params: &SoundParams
        variation: 0.03
        volume: 3
    damage:
      types:
        Blunt: 4
  # Sound
  - type: MeleeSound
    soundGroups:
      Brute: *BellSound
  - type: EmitSoundOnLand
    sound: *BellSound
  - type: EmitSoundOnCollide
    sound: *BellSound

- type: entity
  parent: BaseDeskBell
  id: EmptyDeskBell
  name: 未完成的桌面铃 | unfinished desk bell
  description: 一个空铃铛，缺少了发声装置。 | An empty bell missing its noise maker.
  components:
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 0
            max: 1

- type: entity
  parent: BaseDeskBell
  id: DeskBell
  name: 桌面铃 | desk bell
  description: 任何客户服务工作的基石。你会有一种按响它的无尽冲动。 | The cornerstone of any customer service job. You feel an unending urge to ring it.
  components:
  - type: Sprite
    state: icon-bell
  - type: Tag
    tags: &PayloadTag
    - Payload
  - type: Construction
    graph: *BellGraph
    node: deskBellNode
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 0
            max: 1
      - !type:ChangeConstructionNodeBehavior
        node: start
  - type: InteractionPopup
    successChance: 1
    onActivate: true
    interactSuccessSound: *BellSound
  - type: UseDelay
    delay: 0.5
  # Sound
  - type: EmitSoundOnUse
    sound: *BellSound
  - type: EmitSoundOnTrigger
    sound: *BellSound

- type: entity
  parent: BaseDeskBell
  id: DeskBuzzer
  name: 桌面蜂鸣器 | desk buzzer
  description: 一个高级客服工具。你感到一种无尽的冲动想要按响它。 | An advanced customer service tool. You feel an unending urge to buzz it.
  components:
  - type: Sprite
    state: icon-buzzer
  - type: Tag
    tags: *PayloadTag
  - type: Construction
    graph: *BellGraph
    node: deskBuzzerNode
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CableApcStack1:
            min: 0
            max: 2
      - !type:ChangeConstructionNodeBehavior
        node: start
  - type: StationAiWhitelist
  - type: InteractionPopup
    successChance: 1
    onActivate: true
    interactSuccessSound: &BuzzerSound
      collection: DeskBuzzer
      params: *SoundParams
  - type: UseDelay
    delay: 0.5
  # Sound
  - type: EmitSoundOnUse
    sound: *BuzzerSound
  - type: EmitSoundOnTrigger
    sound: *BuzzerSound
  - type: MeleeSound
    soundGroups:
      Brute: *BuzzerSound
  - type: MeleeWeapon
    soundHit: *BuzzerSound
  - type: EmitSoundOnLand
    sound: *BuzzerSound
  - type: EmitSoundOnCollide
    sound: *BuzzerSound

- type: entity
  parent: BaseDeskBell
  id: DeskHorn
  name: 桌面喇叭 | desk horn
  description: 任何小丑生意的基石。你感到一股无尽的冲动想要按响它。 | The cornerstone of any clown business. You feel an unending urge to honk it.
  components:
  - type: Sprite
    state: icon-buzzer
  - type: Tag
    tags: *PayloadTag
  - type: Construction
    graph: *BellGraph
    node: deskHornNode
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          BikeHorn:
            min: 1
            max: 1
      - !type:ChangeConstructionNodeBehavior
        node: start
  - type: InteractionPopup
    successChance: 1
    onActivate: true
    interactSuccessSound: &HornSound
      collection: BikeHorn
      params: *SoundParams
  - type: UseDelay
    delay: 0.5
  # Sound
  - type: EmitSoundOnUse
    sound: *HornSound
  - type: EmitSoundOnTrigger
    sound: *HornSound
  - type: MeleeSound
    soundGroups:
      Brute: *HornSound
  - type: MeleeWeapon
    soundHit: *HornSound
  - type: EmitSoundOnLand
    sound: *HornSound
  - type: EmitSoundOnCollide
    sound: *HornSound
