- type: entity
  parent: BoxCardboard
  name: 猴子方块盒 | monkey cube box
  id: MonkeyCubeBox
  description: Drymate品牌的猴子方块。只需加水！ | Drymate brand monkey cubes. Just add water!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: MonkeyCubeWrapped
        amount: 8
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box

- type: entity
  parent: BaseItem
  abstract: true
  suffix: Wrapped
  id: BaseWrappedCube
  components:
  - type: Item
    size: Tiny
  - type: SpawnItemsOnUse
    sound:
      path: /Audio/Effects/unwrap.ogg
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi

- type: entity
  parent: BaseWrappedCube
  name: 猴子方块 | monkey cube
  id: MonkeyCubeWrapped
  description: 展开这个以获得猴子方块。 | Unwrap this to get a monkey cube.
  components:
  - type: SpawnItemsOnUse
    items:
    - id: MonkeyCube
  - type: Sprite
    state: wrapper
  - type: Tag
    tags:
    - MonkeyCube

- type: entity
  parent: MonkeyCubeBox
  name: 狗头人方块盒 | kobold cube box
  id: KoboldCubeBox
  description: 浓缩在方块里的狗头人。只需加水！ | Condensed kobolds in a cube. Just add water!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: KoboldCubeWrapped
        amount: 8
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box_kobold

- type: entity
  parent: MonkeyCubeBox
  name: 变体方块盒 | variant cube box
  id: VariantCubeBox
  description: 狗头人方块和猴子方块。只需加水！ | Both kobold cubes and monkey cubes. Just add water!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: KoboldCubeWrapped
          amount: 4
        - id: MonkeyCubeWrapped
          amount: 4
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box_variant

- type: entity
  parent: BaseWrappedCube
  name: 狗头人方块 | kobold cube
  id: KoboldCubeWrapped
  description: 打开这个就能得到一个狗头人方块。 | Unwrap this to get a kobold cube.
  components:
  - type: SpawnItemsOnUse
    items:
    - id: KoboldCube
  - type: Sprite
    state: wrapper_kobold

- type: entity
  parent: MonkeyCubeBox
  name: 猴立方盒 | monkey cube box
  suffix: Syndicate
  id: SyndicateSpongeBox
  description: Drymate品牌的猴立方。只需加水！ | Drymate brand monkey cubes. Just add water!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: SyndicateSpongeWrapped
        amount: 6
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box

- type: entity
  parent: MonkeyCubeWrapped
  name: 猴子方块 | monkey cube
  suffix: Wrapped, Syndicate
  id: SyndicateSpongeWrapped
  components:
  - type: SpawnItemsOnUse
    items:
    - id: SyndicateSponge
