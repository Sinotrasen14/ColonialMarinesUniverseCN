- type: entity
  id: BaseSubdermalImplant
  name: 植入物 | implant
  description: 一种植入皮下的微型芯片。 | A microscopic chip that's injected under the skin.
  abstract: true
  components:
  - type: SubdermalImplant
  - type: Tag
    tags:
    - SubdermalImplant
    - HideContextMenu

#Fun implants

- type: entity
  parent: BaseSubdermalImplant
  id: SadTromboneImplant
  name: 悲伤长号植入体 | sad trombone implant
  description: 该植入体在使用者死亡时播放悲伤的曲调。 | This implant plays a sad tune when the user dies.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
    whitelist:
      components:
      - MobState # admeme implanting a chair with trombone implant needs to give the chair mobstate so it can die first
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: EmitSoundOnTrigger
    sound:
      collection: SadTrombone
      params:
        variation: 0.125

- type: entity
  parent: BaseSubdermalImplant
  id: LightImplant
  name: 发光植入体 | light implant
  description: 该植入体激活时会从使用者的皮肤发光。 | This implant emits light from the user's skin on activation.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
    implantAction: ActionToggleLight
  - type: PointLight
    enabled: false
    radius: 2.5
    softness: 5
    lightMask: ConeSingle
    autoRot: true
  - type: UnpoweredFlashlight

- type: entity
  parent: BaseSubdermalImplant
  id: BikeHornImplant
  name: 自行车喇叭植入物 | bike horn implant
  description: 这个植入物让使用者随时随地都能按喇叭。 | This implant lets the user honk anywhere at any time.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateHonkImplant
  - type: TriggerOnActivateImplant
  - type: EmitSoundOnTrigger
    predicted: true
    sound:
      collection: BikeHorn
      params:
        variation: 0.125

#Security implants

- type: entity
  parent: BaseSubdermalImplant
  id: TrackingImplant
  name: 追踪植入物 | tracking implant
  description: 该植入物附带了一个连接到服装传感器网络的追踪装置。 | This implant has a tracking device attached to the suit sensor network.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
    whitelist:
      components:
      - MobState   # admeme implanting a chair with tracking implant needs to give the chair mobstate so it can die first
  - type: SuitSensor
    randomMode: false
    controlsLocked: true
    mode: SensorCords
    activationContainer: "implant"
  - type: DeviceNetwork
    deviceNetId: Wireless
    transmitFrequencyId: SuitSensor
  - type: StationLimitedNetwork
  - type: WirelessNetworkConnection
    range: 500

#Traitor implants

- type: entity
  parent: BaseSubdermalImplant
  id: StorageImplant
  name: 储物植入体 | storage implant
  description: 这种植入体利用蓝空间技术，在人体内提供隐藏储物空间。 | This implant grants hidden storage within a person's body using bluespace technology.
  categories: [HideSpawnMenu]
  components:
  - type: StorageImplant
  - type: SubdermalImplant
    implantAction: ActionOpenStorageImplant
    whitelist:
      components:
      - Hands   # no use giving a mouse a storage implant, but a monkey is another story...
  - type: Storage
    grid:
    - 0,0,0,1
    - 1,0,1,0
    - 1,2,1,2
    - 2,1,2,2
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface

- type: entity
  parent: BaseSubdermalImplant
  id: FreedomImplant
  name: 自由植入物 | freedom implant
  description: 该植入物允许使用者挣脱手部束缚，最多可使用三次，之后便不再起作用。 | This implant lets the user break out of hand restraints up to three times before ceasing to function anymore.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateFreedomImplant
    whitelist:
      components:
      - Cuffable # useless if you cant be cuffed
  - type: TriggerOnActivateImplant
  - type: UncuffOnTrigger
    targetUser: true

- type: entity
  parent: BaseSubdermalImplant
  id: RadioImplant
  name: 无线电植入体 | radio implant
  description: 这个植入体无需耳机即可接入辛迪加频道。 | This implant grants access to the Syndicate channel without a headset.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
  - type: RadioImplant
    radioChannels:
    - Syndicate

- type: entity
  parent: BaseSubdermalImplant
  id: UplinkImplant
  name: 上行链路植入体 | uplink implant
  description: 该植入体允许使用者随意访问一个隐藏的辛迪加上行链路。 | This implant lets the user access a hidden Syndicate uplink at will.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
    implantAction: ActionOpenUplinkImplant
    whitelist:
      components:
      - Hands # prevent mouse buying grenade penguin since its not telepathic
  - type: RemoteStore
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface

- type: entity
  parent: BaseSubdermalImplant
  id: EmpImplant
  name: EMP植入体 | EMP implant
  description: 该植入体激活时会产生电磁脉冲。 | This implant creates an electromagnetic pulse when activated.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateEmpImplant
  - type: TriggerOnActivateImplant
  - type: EmpOnTrigger
    range: 2.75
    energyConsumption: 50000
    disableDuration: 10

- type: entity
  parent: BaseSubdermalImplant
  id: ScramImplant
  name: 扰乱植入体 | scram implant
  description: 该植入体激活后会将使用者随机传送到大范围内的某处。 | This implant randomly teleports the user within a large radius when activated.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateScramImplant
  - type: TriggerOnActivateImplant
  - type: ScramOnTrigger
    targetUser: true

- type: entity
  parent: BaseSubdermalImplant
  id: DnaScramblerImplant
  name: DNA扰乱植入物 | DNA scrambler implant
  description: 该植入物允许使用者随机更改一次外貌和名字。 | This implant lets the user randomly change their appearance and name once.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateDnaScramblerImplant
    whitelist:
      components:
      - HumanoidProfile # syndies cant turn hamlet into a human
  - type: TriggerOnActivateImplant
  - type: DnaScrambleOnTrigger
    targetUser: true
  - type: DeleteOnTrigger

- type: entity
  categories: [HideSpawnMenu, Spawner]
  parent: BaseSubdermalImplant
  id: ChameleonControllerImplant
  name: 变色龙控制植入体 | chameleon controller implant
  description: 该植入体允许你立即改变所有穿着的变色龙服装的外观。 | This implant allows you to instantly change the appearance of all worn chameleon clothing.
  components:
  - type: ChameleonControllerImplant
  - type: SubdermalImplant
    implantAction: ActionChameleonController
  - type: UseDelay
    delay: 1
  - type: UserInterface
    interfaces:
      enum.ChameleonControllerKey.Key:
        type: ChameleonControllerBoundUserInterface

- type: entity
  parent: BaseSubdermalImplant
  id: VoiceMaskImplant
  name: 身份面具植入物 | identity mask implant
  description: 该植入物允许你随意改变身份。 | This implant allows you to change your identity at will.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
    implantAction: ActionChangeVoiceMaskImplant
  - type: VoiceMask
    overrideIdentity: true
    changeIDName: true
  - type: UserInterface
    interfaces:
      enum.VoiceMaskUIKey.Key:
        type: VoiceMaskBoundUserInterface

#Nuclear Operative/Special Exclusive implants

- type: entity
  parent: BaseSubdermalImplant
  id: MicroBombImplant
  name: 微型炸弹植入体 | micro-bomb implant
  description: 该植入体在激活或死亡时引爆使用者。 | This implant detonates the user upon activation or upon death.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
    permanent: true
    implantAction: ActionActivateMicroBomb
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: TriggerOnActivateImplant
  - type: ExplodeOnTrigger
  - type: GibOnTrigger
    targetUser: true
    deleteItems: true
  - type: Explosive
    explosionType: MicroBomb
    totalIntensity: 120
    intensitySlope: 5
    maxIntensity: 30
    canCreateVacuum: false
  - type: Tag
    tags:
    - SubdermalImplant
    - HideContextMenu
    - MicroBomb


- type: entity
  parent: BaseSubdermalImplant
  id: MacroBombImplant
  name: 宏炸弹植入体 | macro-bomb implant
  description: 该植入体在死亡时经过预编程倒计时后产生大爆炸。 | This implant creates a large explosion on death after a preprogrammed countdown.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
    permanent: true
  - type: ReplacementImplant
    whitelist:
      tags:
      - MicroBomb   # replace microbomb implant with macrobomb
  - type: TriggerOnMobstateChange   #activates the timer
    mobState:
    - Dead
    preventSuicide: true
  - type: TimerTrigger
    delay: 7
    beepSound:
      path: /Audio/Machines/Nuke/general_beep.ogg
      params:
        volume: -2
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: GibOnTrigger
    targetUser: true
    deleteItems: true
    keysIn:
    - timer
  - type: Explosive
    explosionType: Default
    totalIntensity: 3500
    intensitySlope: 15
    maxIntensity: 70
    canCreateVacuum: true

- type: entity
  parent: BaseSubdermalImplant
  id: DeathAcidifierImplant
  name: 死亡酸化植入体 | death-acidifier implant
  description: 该植入体在使用者死亡时将其与装备一同熔化。 | This implant melts the user and their equipment upon death.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
    permanent: true
    implantAction: ActionActivateDeathAcidifier
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: TriggerOnActivateImplant
  - type: GibOnTrigger
    targetUser: true
    deleteItems: true
  - type: SpawnOnTrigger
    proto: Acidifier
    predicted: true

- type: entity
  parent: BaseSubdermalImplant
  id: DeathRattleImplant
  name: 死亡警报植入体 | death rattle implant
  description: 该植入体会在用户陷入危急状态或死亡时通知辛迪加无线电频道。 | This implant will inform the Syndicate radio channel should the user fall into critical condition or die.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
    permanent: true
    whitelist:
      components:
      - MobState   # admeme implanting a chair with rattle implant needs to give the chair mobstate so it can die first
  - type: TriggerOnMobstateChange
    mobState:
    - Critical
    - Dead
  - type: RattleOnTrigger
    targetUser: true

- type: entity
  parent: BaseSubdermalImplant
  id: FakeMindShieldImplant
  name: 假心智护盾植入体 | fake mindshield implant
  description: 该植入体允许植入者产生一个虚假信号，NT安保HUD会利用该信号识别已植入心智护盾的个体。 | This implant allows the implanter to produce a fake signal that NT security huds use to identify individuals implanted with a mindshield.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
    implantAction: FakeMindShieldToggleAction
  - type: FakeMindShield

# Sec and Command implants

- type: entity
  parent: BaseSubdermalImplant
  id: MindShieldImplant
  name: 思维护盾植入体 | mindshield implant
  description: 这种植入体会确保对纳米传讯的忠诚，并防止精神控制装置。 | This implant will ensure loyalty to Nanotrasen and prevent mind control devices.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
  - type: MindShieldImplant
  - type: MindShield

# Centcomm implants

- type: entity
  parent: BaseSubdermalImplant
  id: RadioImplantCentcomm
  name: 无线电植入体 | radio implant
  description: 该植入体无需耳机即可接入中央指挥部频道。仅限中央指挥部员工授权使用。 | This implant grants access to the Centcomm channel without a headset. Only authorized for Centcomm employees.
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
  - type: RadioImplant
    radioChannels:
    - CentCom

- type: entity
  parent: DeathRattleImplant
  id: DeathRattleImplantCentcomm
  name: 中央指挥部死亡警报植入体 | centcomm death rattle implant
  description: 该植入体会在用户陷入濒危状态或死亡时通知中央指挥部无线电频道。 | This implant will inform the Centcomm radio channel should the user fall into critical condition or die.
  categories: [HideSpawnMenu]
  components:
  - type: RattleOnTrigger
    radioChannel: CentCom
