- type: entity
  parent: BaseItem
  id: ChopSticks
  name: 筷子 | chopsticks
  description: 一种非常传统的餐具。 | A very traditional utensil.
  components:
  - type: Sprite
    sprite: Objects/Misc/chopstick.rsi
    state: icon
  - type: Item
    sprite: Objects/Misc/chopstick.rsi
    size: Small
  - type: Utensil
    types:
    - Fork
  - type: Tag
    tags:
    - Trash

- type: entity
  parent: BaseItem
  name: 配对筷子 | paired chopsticks
  id: PairedChopsticks
  description: 你或许应该把它们分开。 | You should probably separate them.
  components:
  - type: SpawnItemsOnUse
    items:
    - id: ChopSticks
    sound:
      path: /Audio/Effects/chopstickbreak.ogg
  - type: Sprite
    sprite: Objects/Misc/chopstick.rsi
    state: paired
  - type: Tag
    tags:
    - Trash
