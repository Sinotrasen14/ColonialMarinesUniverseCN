- type: entity
  parent: BaseItem
  id: TreasureDatadiskEncrypted
  name: 加密数据盘 | encrypted datadisk
  description: 一个旧数据盘。比你更懂行的人可以解密它，从中获取一些有价值的信息。你能做的只有把它卖掉。 | An old data disk. Someone savvier than you could unencrypt it and learn something juicy. All you can do is sell it.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: datadisk_base
      color: "#868686"
    - state: datadisk_label
    - state: datadisk_encrypted
  - type: PointLight
    radius: 1.5
    energy: 0.5
    castShadows: false
    color: "#0000ff"
  - type: Tag
    tags:
    - SalvageTier3
  - type: StaticPrice
    price: 500

- type: entity
  parent: BaseItem
  id: TreasureHardDiskDrive
  name: 硬盘驱动器 | hard disk drive
  description: 一种为旧地球技术设计的磁盘驱动器，大约1980年。可能有某种收藏家想把它弄到手。 | A disk drive designed for old Earth technology, circa 1980. There's probably some kind of collector who might want to get their paws on this.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: harddisk
      map: ["base"]
  - type: Item
    storedRotation: -90
  - type: RandomSprite
    available:
    - base:
        harddisk: ""
        harddisk_mini: ""
        harddisk_micro: ""
  - type: Tag
    tags:
    - SalvageTier2
  - type: StaticPrice
    price: 275

- type: entity
  parent: BaseItem
  id: TreasureFlopDiskDrive
  name: 软盘驱动器 | floppy disk drive
  description: 用于读取软盘信息的驱动器。可惜如今它们上面只存着核弹操作程序了。 | A drive for reading off info off of floppy disks. Shame that the only things stored on them nowadays are nuclear bomb operations.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: flopdrive
  - type: Item
    storedRotation: -90
  - type: Tag
    tags:
    - SalvageTier2
  - type: StaticPrice
    price: 350

- type: entity
  parent: BaseItem
  id: TreasureCDDrive
  name: 光盘驱动器 | CD drive
  description: 一种从光盘读取数据的技术设备。如今这已不是最有用的东西，除非你打算坐飞机去某个地方。 | A piece of tech for reading data off of CDs. Nowadays that's not the most useful thing, unless you plan on flying somewhere.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: cddrive
  - type: Item
    storedRotation: -90
  - type: Tag
    tags:
    - SalvageTier2
  - type: StaticPrice
    price: 300

- type: entity
  parent: BaseItem
  id: TreasureCPUSupercharged
  name: 超强CPU | supercharged CPU
  description: 某种超强的外星太空科技。可惜如今所有电脑都已经自带CPU了。 | Some kind of super alien space tech. Shame all the computers already come with CPUs nowadays.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: cpu_super
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - SalvageTier5
  - type: StaticPrice
    price: 750

- type: entity
  parent: BaseItem
  id: TreasureSampleTube
  name: 样品管 | sample tube
  description: 一根玻璃管，里面装着某种黏稠物。看起来很容易破碎。 | A glass tube with some sort of goop in it. Looks prone to breaking.
  components:
  - type: Sprite
    sprite: Objects/Misc/sample_tubes.rsi
    layers:
    - state: blank
      map: ["base"]
  - type: RandomSprite
    available:
    - base:
        blank: ""
        power: ""
        reinforcer: ""
        energy: ""
        synchronizer: ""
        stabilizer: ""
  - type: Tag
    tags:
    - SalvageTier1
  - type: StaticPrice
    price: 120

