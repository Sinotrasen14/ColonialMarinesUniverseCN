- type: entity
  abstract: true
  parent: BaseItem
  id: BaseCoin
  name: 硬币 | coin
  description: 一块扁平的金属片。如果它还在流通，通货膨胀早就让它一文不值了。既然它已不流通，反倒有了足够的身价，值得夹在书里收藏。 | A flat bit of metal. If it was still in circulation, inflation would've made it worthless. Since it isn't, it's worth enough to keep in a book.
  components:
  - type: Dice
    sides: 2
    currentValue: 1
    sound: !type:SoundCollectionSpecifier
      collection: Coin
    values: CoinFaces
    examineLandedOnText: dice-component-roll-specific
    examineObjectText:      # no need to show how many sides it has, it's a coin
  - type: Tag
    tags:
    - Dice
  - type: UseDelay
  - type: Sprite
    sprite: Objects/Misc/coins.rsi
  - type: Item
    size: Tiny

