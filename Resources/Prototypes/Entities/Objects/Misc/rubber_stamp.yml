- type: entity
  name: 普通橡皮图章 | generic rubber stamp
  parent: BaseItem
  id: RubberStampBase
  description: 用于在重要文件上盖章的橡皮图章。 | A rubber stamp for stamping important documents.
  abstract: true
  components:
  - type: Stamp
    stampedName: stamp-component-stamped-name-default
    stampState: "paper_stamp-generic"
    stampedColor: "#a23e3e"
    sound:
      path: /Audio/Items/Stamp/thick_stamp_sub.ogg
      params:
        volume: -2
        maxDistance: 5
  - type: Sprite
    sprite: Objects/Misc/stamps.rsi
    state: stamp-mime
  - type: Item
    size: Tiny
    inhandVisuals:
      left:
      - state: stamp-inhand-left
        sprite: Objects/Misc/stamps.rsi
      - state: handle-inhand-left
        sprite: Objects/Misc/stamps.rsi
        color: "#f8f8f8"
      right:
      - state: stamp-inhand-right
        sprite: Objects/Misc/stamps.rsi
      - state: handle-inhand-right
        sprite: Objects/Misc/stamps.rsi
        color: "#f8f8f8"
  - type: StealTarget
    stealGroup: Stamp
  - type: Tag
    tags:
    - Stamp

- type: entity
  name: 备用橡皮图章 | alternate rubber stamp
