- type: entity
  parent: [IDCardStandard, BaseChameleon]
  id: AgentIDCard
  name: 乘客身份证 | passenger ID card
  suffix: Agent
  components:
  - type: Sprite
    layers:
    - state: default
    - sprite: *icon-rsi
      offset: *icon-offset
      state: Passenger
  - type: Access
    tags:
    - Maintenance
    - SyndicateAgent
  - type: AgentIDCard
    iconGroups:
    - CommandIconGroup
    - SecurityIconGroup
    - ResearchIconGroup
    - CargoIconGroup
    - EngineeringIconGroup
    - MedicalIconGroup
    - ServiceIconGroup
    - CivilianIconGroup
    - EntertainerIconGroup
    - SiliconIconGroup
    - BlankIconGroup
    - ThreatIconGroup
    - CentCommIconGroup
  - type: UIRequiresLock
  - type: ActivatableUI
    key: enum.AgentIDCardUiKey.Key
    verbText: agent-id-open-ui-verb
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: ChameleonClothing
    slot: [idcard]
    default: PassengerIDCard
    requireTag: WhitelistChameleonIdCard
  - type: UserInterface
    interfaces:
      enum.AgentIDCardUiKey.Key:
        type: AgentIDCardBoundUserInterface
      enum.ChameleonUiKey.Key:
        type: ChameleonBoundUserInterface

