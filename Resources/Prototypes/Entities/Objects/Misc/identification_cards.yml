- type: entity
  parent: IDCardStandard
  id: UniversalIDCard
  name: 通用身份证 | universal ID card
  suffix: Admin
  description: 一张能让你获得超乎想象权限的身份证。 | An ID card that gives you access beyond your wildest dreams.
  components:
  - type: Sprite
    sprite: Objects/Misc/id_cards.rsi
    layers:
    - state: admin
    - sprite: *icon-rsi
      offset: *icon-offset
      state: Admin
  - type: Clothing
    sprite: Objects/Misc/id_cards.rsi
  - type: Item
    heldPrefix: green
  - type: IdCard
    jobTitle: job-title-universal
    jobIcon: JobIconAdmin
  - type: Access
    groups:
    - AllAccess
    - Silicon
    tags:
    - CentralCommand
    - NuclearOperative
    - SyndicateAgent
    - Wizard
    - Xenoborg
  - type: Tag #  Ignore Chameleon tags
    tags:
    - DoorBumpOpener
  - type: AgentIDCard
    iconGroups:
    - CommandIconGroup
    - SecurityIconGroup
    - ResearchIconGroup
    - CargoIconGroup
    - EngineeringIconGroup
    - MedicalIconGroup
    - ServiceIconGroup
    - CivilianIconGroup
    - EntertainerIconGroup
    - SiliconIconGroup
    - BlankIconGroup
    - ThreatIconGroup
    - CentCommIconGroup
    - AdminIconGroup
  - type: ActivatableUI
    key: enum.AgentIDCardUiKey.Key
    verbText: agent-id-open-ui-verb
  - type: UserInterface
    interfaces:
      enum.AgentIDCardUiKey.Key:
        type: AgentIDCardBoundUserInterface
