- type: entity
  parent: BaseItem
  id: BedsheetBase
  name: 床单基础 | BedsheetBase
  abstract: true
  description: 一条出奇柔软的亚麻床单。 | A surprisingly soft linen bedsheet.
  placement:
    mode: SnapgridCenter
    snap:
    - Bed
  components:
  - type: Sprite
    sprite: Objects/Misc/bedsheets.rsi
    noRot: true
  - type: Item
    size: Small
  - type: Clothing
    quickEquip: true
    slots:
    - neck
  - type: StaticPrice
    price: 12
  - type: Tag
    tags:
    - Bedsheet

