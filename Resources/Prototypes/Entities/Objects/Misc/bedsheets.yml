- type: entity
  id: BedsheetCaptain
  parent: BedsheetBase
  name: 船长的床单 | captain's bedsheet
  description: 上面有纳米传思的标志，用一种革命性的新型线织成，保证对大多数非化学物质有0.01%的渗透率，在现代船长中很受欢迎。 | It has a Nanotrasen symbol on it, and was woven with a revolutionary new kind of thread guaranteed to have 0.01% permeability for most non-chemical substances, popular among most modern captains.
  components:
  - type: Sprite
    state: sheetcaptain
  - type: Clothing
    sprite: Clothing/Neck/Bedsheets/captain.rsi
  - type: StealTarget
    stealGroup: HeadBedsheet

- type: entity
  id: BedsheetCE
  parent: BedsheetBase
  name: CE的床单 | CE's bedsheet
  description: 上面装饰着一个扳手徽章。它反光性很强，而且防污，所以你不必担心被油弄坏。 | It's decorated with a wrench emblem. It's highly reflective and stain resistant, so you don't need to worry about ruining it with oil.
  components:
  - type: Sprite
    state: sheetce
  - type: Clothing
    sprite: Clothing/Neck/Bedsheets/ce.rsi
  - type: StealTarget
    stealGroup: HeadBedsheet

- type: entity
  id: BedsheetCentcom
  parent: BedsheetBase
