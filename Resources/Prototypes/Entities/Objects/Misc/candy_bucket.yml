- type: entity
  parent: BaseItem
  id: CandyBucket
  name: 糖果桶 | candy bucket
  description: 一个装满你所有糖果的节日桶。 | A festive bucket for all your treats.
  components:
  - type: Sprite
    sprite: Objects/Fun/candy_bucket.rsi
    layers:
    - state: empty_icon
      map: ["enum.ToggleableVisuals.Layer"]
  - type: ContainerHeld
    threshold: 1
  - type: Item
    heldPrefix: empty
    size: Normal
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          true: {state: full_icon}
          false: {state: empty_icon}
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,2
    whitelist:
      components:
      - Pill
      tags:
      - FoodSnack
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  # to prevent bag open/honk spam
  - type: UseDelay
    delay: 0.5
