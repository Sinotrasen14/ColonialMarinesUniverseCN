- type: entity
  parent: PhoneInstrument
  id: BananaPhoneInstrument
  name: 香蕉电话 | banana phone
  description: 直通小丑圣母的专线。似乎总是转到语音信箱。 | A direct line to the Honkmother. Seems to always go to voicemail.
  components:
  - type: Sprite
    state: banana_phone
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/bikehorn.ogg
  - type: Slippery
  - type: StepTrigger
  - type: CollisionWake
    enabled: false
  - type: Fixtures
    fixtures:
      slips:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.3,0.4,0.3"
        hard: false
        layer:
        - SlipLayer
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.3,0.4,0.3"
        density: 5
        mask:
        - ItemMask
  - type: Prayable
    sentMessage: prayer-popup-notify-honkmother-sent
    notificationPrefix: prayer-chat-notify-honkmother
    verb: prayer-verbs-call
    verbImage:
