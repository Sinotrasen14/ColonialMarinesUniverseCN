- type: entity
  parent: BaseHandheldInstrument
  id: BasePercussionInstrument
  abstract: true
  components:
  - type: Tag
    tags:
    - PercussionInstrument

- type: entity
  parent: BasePercussionInstrument
  id: GlockenspielInstrument
  name: 钟琴 | glockenspiel
  components:
  - type: Instrument
    program: 9
  - type: Sprite
    sprite: Objects/Fun/Instruments/glockenspiel.rsi

- type: entity
  parent: BasePercussionInstrument
  id: MusicBoxInstrument
  name: 音乐盒 | music box
  description: 播放这个会让你感到安全，免受可怕的电子玩偶的伤害。 | Playing this makes you feel safe from scary animatronics.
  components:
  - type: Instrument
    program: 10
  - type: Sprite
    sprite: Objects/Fun/Instruments/musicbox.rsi
  - type: Item
    size: Small

- type: entity
  parent: BasePercussionInstrument
  id: XylophoneInstrument
  name: 木琴 | xylophone
  description: 彩虹色钟琴。 | Rainbow colored glockenspiel.
  components:
  - type: Instrument
    program: 13
  - type: Sprite
    sprite: Objects/Fun/Instruments/structureinstruments.rsi
    state: xylophone

- type: entity
  parent: BaseHandheldInstrument
  id: MicrophoneInstrument
  name: 麦克风 | microphone
  description: 非常适合尽情歌唱。 | Perfect for singing your heart out.
  components:
  - type: Instrument
    program: 52
  - type: SwappableInstrument
    instrumentList:
      "Aah": {52: 0}
      "Ooh": {53: 0}
      "Kweh": {4: 100} # Defined in space-station-14.sf2
      "Waa": {5: 100} # Defined in space-station-14.sf2
      "Wah": {6: 100} # Defined in space-station-14.sf2
  - type: Sprite
    sprite: Objects/Fun/Instruments/microphone.rsi
  - type: Item
    size: Small
    storedSprite:
      state: storage
      sprite: Objects/Fun/Instruments/microphone.rsi


- type: entity
  parent: BasePercussionInstrument
  id: WoodblockInstrument
  name: 木版画 | woodblock
  description: 如果你听得够多，它就会开始钻进你的脑子里。 | If you listen to this enough it'll start driving itself into your mind.
  components:
  - type: Instrument
    program: 115
  - type: Sprite
    sprite: Objects/Fun/Instruments/woodblock.rsi

- type: entity
  parent: BasePercussionInstrument
  id: ReverseCymbalsInstrument
  name: 反向钹 | reverse cymbals
  description: 我想你把它弄反了？ | I think you have it the wrong way around?
  components:
  - type: Instrument
    program: 119
  - type: Sprite
    sprite: Objects/Fun/Instruments/reversecymbal.rsi
