- type: entity
  id: ContrabassInstrument
  parent: BasePlaceableInstrument
  name: 低音提琴 | contrabass
  description: 非常适合铺陈一段优美的爵士节奏。 | Perfect for laying down a nice jazzy beat.
  components:
  - type: Instrument
    program: 43
  - type: Sprite
    state: contrabass
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds: *ThresholdsFurnitureStrongWood
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.30
        density: 180
        mask:
        - Impassable
        - HighImpassable
        - MidImpassable
        layer:
        - Opaque
        - HighImpassable
        - MidImpassable
        - BulletImpassable

