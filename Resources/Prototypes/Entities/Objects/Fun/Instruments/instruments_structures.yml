- type: entity
  parent: [BasePlaceableInstrumentRotatable, ConstructibleMachine]
  id: DawInstrument
  name: 数字音频工作站 | digital audio workstation
  description: 前沿音乐技术，直接来自90年代。 | Cutting edge music technology, straight from the 90s.
  components:
  - type: Sprite
    layers:
    - state: daw-base
    - state: daw-display
      shader: unshaded
    - state: daw-panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Appearance
  - type: WiresVisuals
  - type: WiresPanel
  - type: Machine
    board: DawInstrumentMachineCircuitboard
  - type: Instrument
    allowPercussion: true
    allowProgramChange: true
  - type: Destructible
    thresholds:
    - trigger: *DamageFurnitureStrong
      behaviors:
      - *SoundMetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame

- type: entity
  parent: BasePlaceableInstrumentRotatable
  id: BigDrumsInstrument
  name: 架子鼓 | drum kit
  description: 咚次哒次！ | Ba dum tss!
  components:
  - type: Instrument
    program: 7
    bank: 100 # Defined in space-station-14.sf2
    allowPercussion: true
  - type: Sprite
    state: drum
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds: *ThresholdsFurnitureStrongRods
