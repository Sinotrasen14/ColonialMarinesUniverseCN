- type: entity
  name: 钢琴 | piano
  parent: BasePlaceableInstrumentRotatable
  id: PianoInstrument
  description: 立即弹奏针琴。 | Play Needles Piano Now.
  components:
  - type: Instrument
    program: 1
  - type: Sprite
    state: piano
  - type: Climbable
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds: &ThresholdsFurnitureStrongWood
    - trigger: &DamageFurnitureStrong !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
          params:
            volume: -3
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 2
            max: 4

- type: entity
  name: 立式钢琴 | upright piano
  parent: BasePlaceableInstrumentRotatable
  id: UprightPianoInstrument
  description: 我说过皮安妮！ | I said Piannie!
  components:
  - type: Instrument
    program: 3
  - type: Sprite
    state: piano-upright
  - type: Climbable
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds: *ThresholdsFurnitureStrongWood

- type: entity
  name: 颤音琴 | vibraphone
  id: VibraphoneInstrument
  parent: BasePlaceableInstrumentRotatable
  description: 四周洋溢着美好的氛围。 | Good vibes all around.
  components:
  - type: Instrument
    program: 11
  - type: Sprite
    state: vibraphone
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds: &ThresholdsFurnitureStrongRods
    - trigger: *DamageFurnitureStrong
      behaviors:
      - &SoundMetalBreak !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 2
            max: 4

