- type: entity
  parent: BaseBoardEntity
  id: BackgammonBoard
  name: 双陆棋棋盘 | backgammon board
  description: 老式骰子和棋子游戏。 | Old fashioned game of dice and pieces.
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/backgammon.rsi
    state: board
  - type: TabletopGame
    boardName: tabletop-backgammon-board-name
    size: 550, 410
    setup: !type:TabletopBackgammonSetup
      boardPrototype: &BackgammonBoard BackgammonBoardTabletop

- type: entity
  parent: BaseBoardTabletop
  id: *BackgammonBoard
  name: 双陆棋 | backgammon
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/backgammon_tabletop.rsi
    state: backgammonBoard
