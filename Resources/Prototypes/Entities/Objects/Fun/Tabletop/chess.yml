- type: entity
  parent: BaseBoardEntity
  id: ChessBoard
  name: 棋盘 | chessboard
  description: 一个棋盘。包含棋子！ | A chessboard. Pieces included!
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/chessboard.rsi
    state: chessboard
  - type: TabletopGame
    boardName: tabletop-chess-board-name
    size: 338, 274
    setup: !type:TabletopChessSetup
      boardPrototype: &ChessBoard ChessBoardTabletop

- type: entity
  parent: BaseBoardTabletop
  id: *ChessBoard
  name: 棋盘 | chessboard
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/chessboard_tabletop.rsi
    state: chessboard_tabletop

