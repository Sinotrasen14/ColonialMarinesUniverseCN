# When adding new "weapons", also add it to id: AllToyWeaponsTable
# File for fun weapons that aren't very dangerous

## Toy guns

- type: entity
  abstract: true
  id: BaseToyGun
  components:
  - type: PacifismAllowedGun # They don't hurt!
  - type: Gun
    clumsyProof: true # Clown proficiency

- type: entity
  parent: [BaseItem, BaseToyGun]
  id: FoamCrossbow
  name: 泡沫弩 | foam crossbow
  description: 把这家伙瞄准保安，可能会让你吃满子弹。 | Aiming this at Security may get you filled with lead.
  components:
  - type: Sprite
    sprite: Objects/Fun/Foam/foam_crossbow.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: Objects/Fun/Foam/foam_crossbow.rsi
  - type: Gun
    fireRate: 0.5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/energycrossbow_shoot.ogg
  - type: BallisticAmmoProvider
    whitelist: &WhitelistFoam
      tags:
      - BulletFoam
    capacity: 1
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/energycrossbow_reload.ogg
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

- type: entity
  name: 泡沫力量星际王牌 | Foam Force Astro Ace
  parent: [BaseToyGun, BaseWeaponShotgun, BaseGunWieldable]
  id: WeaponRifleFoam
  description: 一把最高品质的高级泡沫步枪。它的塑料手感坚固，机械结构也很结实。 | A premium foam rifle of the highest quality. Its plastic feels rugged, and its mechanisms sturdy.
  components:
  - type: Sprite
    sprite: Objects/Fun/Foam/foam_rifle.rsi
  - type: Clothing
    sprite: Objects/Fun/Foam/foam_rifle.rsi
  - type: Item
    sprite: Objects/Fun/Foam/foam_rifle_inhand_64x.rsi
    size: Normal
    shape:
    - 0,0,3,0
  - type: BallisticAmmoProvider
    whitelist: *WhitelistFoam
    capacity: 10
    proto: BulletFoam
  - type: GunRequiresWield #remove when inaccuracy on spreads is fixed
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Effects/thunk.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: StaticPrice
    price: 100

- type: entity
  parent: [BaseItem, BaseToyGun]
  id: RevolverCapGun
  name: 玩具枪 | cap gun
  description: 看起来几乎和真的一样！适合8岁及以上。 | Looks almost like the real thing! Ages 8 and up.
  components:
  - type: Sprite
    sprite: Objects/Fun/capgun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Item
    shape:
    - 0,0,1,0
    - 0,1,0,1
    storedOffset: -2,-7
    sprite: Objects/Fun/capgun.rsi
  - type: Tag
    tags:
    - Sidearm
    - ToySidearm
  - type: AmmoCounter
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    fireRate: 2
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
      params:
        volume: 2.25
  - type: RevolverAmmoProvider
    whitelist:
      tags:
      - CartridgeCap
      - SpeedLoaderCap
    proto: CartridgeCap
    capacity: 6
    chambers: [true, true, true, true, true, true]
    ammoSlots: [null, null, null, null, null, null]
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg
  - type: ContainerContainer
    containers:
      revolver-ammo: !type:Container

- type: entity
  parent: RevolverCapGun
  id: RevolverCapGunFake
  suffix: Fake
  components:
  - type: RevolverAmmoProvider
    whitelist:
      tags:
      - CartridgeCap
      - SpeedLoaderCap
      - CartridgeMagnum
      - SpeedLoaderMagnum
    proto: CartridgeMagnumAP

- type: entity
  parent: [BaseItem, BaseToyGun]
  id: WeaponStickyHand
  name: 黏手 | sticky hand
  description: 他们说你在牵强附会。他们说这太勉强了。你会向他们所有人证明，你会让他们自食其果。 | They're saying you're reaching. They're saying it's a stretch. You'll show them all, and you'll stick it to them.
  components:
  - type: GrapplingGun
    cycleSound: /Audio/Misc/woosh.ogg
    ropeSprite:
      sprite: Objects/Weapons/Guns/Launchers/sticky_hand.rsi
      state: rope
  - type: Gun
    soundGunshot: /Audio/Misc/stickystretch.ogg
    fireRate: 0.5
    soundEmpty: /Audio/Misc/boing.ogg
  - type: BasicEntityAmmoProvider
    proto: StickyHandPalm
    capacity: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/sticky_hand.rsi
    state: base
  - type: UseDelay
    delay: 1.5

## Toy swords

- type: entity
  abstract: true
  id: BaseToySword
  components:
  - type: DisarmMalus
    malus: -0.3 # Easy to disarm for epic reversals
  - type: StaminaDamageOnHit
    damage: 8 # Too small for real combat, but allows for foam fights to have a conclusion
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 0.0 # Remove damage to avoid pacifism metagaming
    undamagedAlertThreshold: 0

- type: entity
  parent: [BaseItem, BaseToySword]
  id: FoamBlade
  name: 泡沫刃 | foamblade
  description: 上面写着“斯特恩赛德·张的头号粉丝”。 | It says "Sternside Changs number 1 fan" on it.
  components:
  - type: Sprite
    sprite: Objects/Fun/Foam/foam_blade.rsi
    state: icon
  - type: MeleeWeapon
    attackRate: 1.5
    angle: 0
    animation: WeaponArcThrust
    wideAnimationRotation: 90
  - type: Item
    size: Small
    sprite: Objects/Fun/Foam/foam_blade.rsi

- type: entity
  parent: [BaseItem, BaseToySword]
  id: FoamCutlass
  name: 泡沫弯刀 | foam cutlass
  description: 扮演海盗，强迫你的朋友走跳板。 | Cosplay as a pirate and force your friends to walk the plank.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/cutlass.rsi
    state: foam_icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    range: 2.0
  - type: Item
    size: Normal
    storedSprite:
      state: foam_storage
      sprite: Objects/Weapons/Melee/cutlass.rsi
    shape:
    - 0,0,0,2

- type: entity
  parent: [BaseItem, BaseToySword]
  id: ToySword
  name: 玩具剑 | toy sword
  description: 全新桑迪猫塑料剑！配有逼真音效和全彩外观！看起来几乎和真的一模一样！ | New Sandy-Cat plastic sword! Comes with realistic sound and full color! Looks almost like the real thing!
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/e_sword.rsi
    layers:
    - state: e_sword
    - state: e_sword_blade
      color: "#FFFFFF"
      visible: false
      shader: unshaded
      map: ["blade"]
  - type: EnergySword
  - type: ItemToggleExaminableStatus
  - type: ItemToggle
    soundActivate:
      path: /Audio/Weapons/ebladeon.ogg
    soundDeactivate:
      path: /Audio/Weapons/ebladeoff.ogg
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/Weapons/ebladehum.ogg
  - type: Item
    size: Small
    sprite: Objects/Weapons/Melee/e_sword-inhands.rsi
  - type: UseDelay
    delay: 1.0
  - type: PointLight
    enabled: false
    radius: 2
    energy: 2
    color: white
    netsync: false
  - type: Appearance
  - type: ToggleableVisuals
    spriteLayer: blade
    inhandVisuals:
      left:
      - state: inhand-left-blade
        shader: unshaded
      right:
      - state: inhand-right-blade
        shader: unshaded
  - type: ItemTogglePointLight
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 0
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/eblade1.ogg
      params:
        variation: 0.250
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/eblade1.ogg
      params:
        variation: 0.250
    activatedSoundOnSwing:
      path: /Audio/Weapons/eblademiss.ogg
      params:
        variation: 0.125
    activatedDamage:
      types:
        Heat: 0.3

- type: entity
  parent: [BaseItem, BaseToySword]
  id: CardSword
  name: 纸板剑 | cardboard sword
  description: 一个用纸板管做成的剑形物品。 | A cardboard tube fashioned into the shape of a sword.
  components:
  - type: Sprite
    sprite: Objects/Fun/card_sword.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Fun/card_sword.rsi
    slots:
    - Back
    - SuitStorage
  - type: Appearance
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.25
    soundHit:
      path: /Audio/Items/Toys/card_tube_bonk.ogg
  - type: Construction
    graph: CardSword
    node: cardSword
  - type: Item
    size: Normal
    storedSprite:
      state: icon
      sprite: Objects/Fun/card_sword.rsi
    shape:
    - 0,0,1,3

- type: entity
  parent: [BaseItem, BaseToySword]
  id: ToyHammer
  name: 橡胶锤 | rubber hammer
  description: 一把色彩鲜艳的橡胶锤。 | A brightly colored hammer made of rubber.
  components:
  - type: Sprite
    sprite: Objects/Fun/rubber_hammer.rsi
    state: icon
  - type: WeaponRandom # 1 in 100,000 to "win" the "fight"
    damageBonus:
      types:
        Blunt: 1000
  - type: Item
    size: Small
    sprite: Objects/Fun/rubber_hammer.rsi
  - type: MeleeWeapon
    wideAnimationRotation: -135
    soundHit: &SoundRubberHammer
      collection: RubberHammer
      params:
        variation: 0.03
        volume: 3
    soundNoDamage: *SoundRubberHammer
