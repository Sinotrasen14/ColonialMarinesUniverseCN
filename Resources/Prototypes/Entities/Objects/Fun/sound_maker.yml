# When adding new sound makers, also add it to id: AllToySoundMakerTable
# These entities exist to make a (funny) sound and not much else

## Bike horns

- type: entity
  parent: BaseItem
  id: BikeHorn
  name: 自行车喇叭 | bike horn
  description: 从自行车上拆下来的喇叭。 | A horn off of a bicycle.
  components:
  - type: Sprite
    sprite: Objects/Fun/bikehorn.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/bikehorn.rsi
    size: Tiny
  - type: Clothing
    sprite: Objects/Fun/bikehorn.rsi
    slots: [Belt]
    quickEquip: false
  - type: UseDelay
    delay: 0.5
  - type: EmitSoundOnUse
    sound: &SoundBikeHorn
      collection: BikeHorn
      params:
        variation: 0.125
  - type: EmitSoundOnLand
    sound: *SoundBikeHorn
  - type: EmitSoundOnTrigger
    sound: *SoundBikeHorn
  - type: EmitSoundOnActivate
    sound: *SoundBikeHorn
  - type: EmitSoundOnCollide
    sound: *SoundBikeHorn
  - type: Tag
    tags:
    - Payload # yes, you can make re-usable prank grenades
    - BikeHorn
  - type: MeleeWeapon
    wideAnimationRotation: 135
    soundHit: *SoundBikeHorn
    damage:
      types:
        Blunt: 0
  - type: Tool
    qualities:
    - Honking
    useSound: *SoundBikeHorn

- type: entity
  parent: BaseItem
  id: CluwneHorn
  name: 自行车坏了的喇叭 | broken bike horn
  description: 一个从自行车上掉下来的坏喇叭。 | A broken horn off of a bicycle.
  components:
  - type: UseDelay
  - type: Sprite
    sprite: Objects/Fun/cluwnehorn.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/cluwnehorn.rsi
    size: Tiny
  - type: Clothing
    sprite: Objects/Fun/cluwnehorn.rsi
    slots: [Belt]
    quickEquip: false
  - type: Tag
    tags:
    - Payload # yes, you can make re-usable prank grenades
    - CluwneHorn
  - type: EmitSoundOnTrigger
    sound: &SoundCluwneHorn
      collection: CluwneHorn
      params:
        variation: 0.125
  - type: EmitSoundOnUse
    sound: *SoundCluwneHorn
  - type: EmitSoundOnActivate
    sound: *SoundCluwneHorn
  - type: EmitSoundOnCollide
    sound: *SoundCluwneHorn
  - type: EmitSoundOnLand
    sound: *SoundCluwneHorn
  - type: MeleeWeapon
    wideAnimationRotation: 135
    soundHit: *SoundCluwneHorn
    damage:
      types:
        Blunt: 5

- type: entity
  parent: BikeHorn
  id: GoldenBikeHorn
  name: 金色鸣笛者 | golden honker
  description: 一个快乐的鸣笛奖品，向众神祈求你的奖赏吧。 | A happy honk prize, pray to the gods for your reward.
  categories: [DoNotMap]
  components:
  - type: Sprite
    sprite: Objects/Fun/goldbikehorn.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/goldbikehorn.rsi
    size: Tiny
  - type: Clothing
    sprite: Objects/Fun/goldbikehorn.rsi
    slots: [Belt]
  - type: Prayable
  - type: StaticPrice
    price: 100 # reduced price due to heisentests
  - type: PointLight
    radius: 1.2
    energy: 2.2
    castShadows: false
    color: "#ffca1b"

- type: entity
  parent: BikeHorn
  id: BananiumHorn
  name: 香蕉合金喇叭 | bananium horn
  description: 一个由香蕉合金制成的气喇叭。 | An air horn made from bananium.
  components:
  - type: Sprite
    sprite: Objects/Fun/bananiumhorn.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/bananiumhorn.rsi
    size: Small
  - type: Clothing
    sprite: Objects/Fun/bananiumhorn.rsi
    slots: [Belt]
    quickEquip: false
  - type: UseDelay
    delay: 3
  - type: EmitSoundOnUse
    sound: &SoundBananiumHorn
      collection: BananiumHorn
      params:
        variation: 0.246
  - type: EmitSoundOnLand
    sound: *SoundBananiumHorn
  - type: EmitSoundOnTrigger
    sound: *SoundBananiumHorn
  - type: EmitSoundOnActivate
    sound: *SoundBananiumHorn
  - type: EmitSoundOnCollide
    sound: *SoundBananiumHorn
  - type: MeleeWeapon
    wideAnimationRotation: 135
    soundHit: *SoundBananiumHorn
    damage:
      types:
        Blunt: 0
    hidden: true
  - type: Construction
    graph: BananiumHorn
    node: bananiumHorn
  - type: Tool
    useSound: *SoundBananiumHorn

- type: entity
  parent: BaseItem
  id: PushHorn
  name: 按喇叭 | push horn
  description: 这个强力自行车喇叭一定能驱散所有愁容。 | This powerful bikehorn is sure to blast frowns away.
  components:
  - type: Sprite
    sprite: Objects/Fun/push_horn.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/push_horn.rsi
    size: Tiny
  - type: Clothing
    sprite: Objects/Fun/push_horn.rsi
    slots: [Belt]
    quickEquip: false
  - type: EmitSoundOnUse
    handle: false
    sound: "/Audio/Items/Toys/pushHornHonk.ogg"
  - type: EmitSoundOnLand
    sound: "/Audio/Items/Toys/pushHornFloor.ogg"
  - type: UseDelay
    delay: 10
  - type: TriggerOnUse
  - type: RepulseAttractOnTrigger
    speed: 50
    range: 3.5
    whitelist:
      components:
      - MobMover
  - type: SpawnOnTrigger
    proto: EffectGravityPulse
    predicted: true

## Whistles

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseWhistle
  name: 哨声 | whistle
  description: 有人忘了关水壶吗？ | Someone forgot to turn off a kettle?
  components:
  - type: Item
    sprite: Objects/Fun/whistles.rsi
    size: Tiny
  - type: Sprite
    sprite: Objects/Fun/whistles.rsi
  - type: Clothing
    sprite: Objects/Fun/whistles.rsi
    quickEquip: false
    slots: neck
  - type: UseDelay
    delay: 3
  - type: EmitSoundOnUse
    sound:
      collection: BaseWhistle
  - type: Whistle
    distance: 3
  - type: Tag
    tags:
    - MonkeyWearable

- type: entity
  parent: BaseWhistle
  id: Whistle
  components:
  - type: Sprite
    state: whistle

- type: entity
  parent: BaseWhistle
  id: SecurityWhistle
  description: 它的声音带来恐惧。 | The sound of it brings fear.
  components:
  - type: Sprite
    state: sec
  - type: Clothing
    equippedPrefix: sec
  - type: Whistle
    distance: 5

- type: entity
  parent: [BaseWhistle, BaseMinorContraband]
  id: SyndicateWhistle
  name: 战壕哨 | trench whistle
  description: 辛迪加指挥官用来吸引注意力的哨子。前进！ | A whistle used by Syndicate commanders to draw attention. Avanti!
  components:
  - type: Sprite
    state: trench
  - type: Clothing
    equippedPrefix: trench
  - type: EmitSoundOnUse
    sound:
      collection: TrenchWhistle
  - type: Whistle
    distance: 15 # Let your enemies hear the sound of death approaching

## Other

- type: entity
