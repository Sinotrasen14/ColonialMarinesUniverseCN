- type: entity
  parent: BaseItem
  id: WhoopieCushion
  name: 放屁垫 | whoopie cushion
  description: 一种涉及放屁幽默的恶作剧道具。 | A practical joke device involving flatulence humour.
  components:
  - type: Sprite
    sprite: Objects/Fun/whoopie.rsi
    state: icon
  - type: Tag
    tags:
    - Payload
  - type: EmitSoundOnUse
    sound: &SoundParp
      collection: Parp
      params:
        variation: 0.125
  - type: EmitSoundOnLand
    sound: *SoundParp
  - type: EmitSoundOnActivate
    sound: *SoundParp
  - type: EmitSoundOnCollide
    sound: *SoundParp
  - type: UseDelay
    delay: 0.8
  - type: Slippery
    staminaDamage: 0
    frictionStatusTime: 0
    slipData:
      stunTime: 0
      knockdownTime: 0
      launchForwardsMultiplier: 0
    slipSound: *SoundParp
  - type: MeleeWeapon
    soundHit: *SoundParp
    damage:
      types:
        Blunt: 0
  - type: StepTrigger
    intersectRatio: 0.2
    requiredTriggeredSpeed: 2
  - type: TriggerOnStepTrigger # for payloads, that don't work because of trouble with sound prediction
  - type: CollisionWake
    enabled: false
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      slips:
        shape: !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        layer:
        - SlipLayer
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 30
        mask:
        - ItemMask

