  id: ClownRecorder
  name: 小丑录音机 | clown recorder
  description: 当你就是没法自然地逗人发笑时！ | When you just can't get those laughs coming the natural way!
  components:
  - type: Sprite
    sprite: Objects/Fun/clownrecorder.rsi
