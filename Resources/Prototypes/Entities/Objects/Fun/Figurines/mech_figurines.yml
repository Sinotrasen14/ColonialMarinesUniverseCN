    pack: FigurinesMechGeneric

#Ripley APLU
- type: entity
  parent: BaseFigurineMech
  id: ToyRipley
  name: 里普利玩具 | ripley toy
  description: 迷你机甲可动人偶！背面写着“机甲1/12号”。 | Mini-Mecha action figure! 'Mecha No. 1/12' is written on the back.
  components:
  - type: Sprite
    state: ripley
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-base
      - state: inhand-left-body
        color: "#d5c644"
      - state: inhand-left-trim
        color: "#524c14"
      - state: inhand-left-visor
        color: "#7aef83"
      right:
      - state: inhand-right-base
      - state: inhand-right-body
        color: "#d5c644"
      - state: inhand-right-trim
        color: "#524c14"
      - state: inhand-right-visor
        color: "#7aef83"

