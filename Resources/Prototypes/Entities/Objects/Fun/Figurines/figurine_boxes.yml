- type: entity
  id: MysteryFigureBoxTrash
  parent: BaseItem
  name: 未折叠的纸板箱 | unfolded cardboard box
  description: 一个小巧的、未折叠的纸板玩具箱。 | A small, unfolded cardboard toy box.
  components:
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 50
  - type: Sprite
    sprite: Objects/Fun/figurines.rsi
    state: fig_box_unfolded
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage

- type: entity
  parent: BaseItem
  id: MysteryFigureBox
  name: 神秘太空人迷你人仔盒 | mystery spacemen minifigure box
  description: 一个装有神秘迷你人仔的盒子。盒子侧面描绘了几个被涂黑的“稀有”人仔，其中一个有着巨大的、非人形的轮廓。 | A box containing a mystery minifigure. The side of the box depicts a few blacked-out 'rare' figures, including one with a large, non-humanoid shilouette.
  components:
  - type: Sprite
    sprite: Objects/Fun/figurines.rsi
    layers:
    - state: fig_box
  - type: TriggerOnActivate
  - type: DeleteOnTrigger
  - type: EmitSoundOnTrigger
    positional: true
    predicted: true
    sound:
      path: /Audio/Effects/unwrap.ogg
  - type: SpawnEntityTableOnTrigger
    useMapCoords: true
    table: !type:AllSelector
      children:
      - id: MysteryFigureBoxTrash
      - !type:NestedSelector
        tableId: AllFigurinesTable

- type: entity
  parent: BaseItem
