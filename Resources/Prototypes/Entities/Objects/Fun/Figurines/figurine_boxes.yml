  description: 一盒已停产的促销打火机，其中许多后来被宣布为“违禁品”。 | A box of discontinued promotional lighters, many of which have since been declared "contraband".
  components:
  - type: Sprite
    sprite: Objects/Fun/figurines.rsi
    layers:
    - state: fig_box
