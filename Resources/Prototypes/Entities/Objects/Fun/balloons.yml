# When adding new balloons, also add it to id: AllMiscToysTable

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseBalloon
  components:
  - type: Sprite
    noRot: true
  - type: Item
    size: Small
  - type: EmitSoundOnCollide
    sound: &SoundBalloonHit
      path: /Audio/Effects/balloon_hits.ogg
  - type: EmitSoundOnLand
    sound: *SoundBalloonHit
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: TileFrictionModifier
    modifier: 0.3
  - type: Tag
    tags:
    - Balloon

- type: entity
  parent: BaseBalloon
  id: BalloonSyn
  name: 辛迪气球 | syndie balloon
  description: 发给在辛迪乐园“原子旋风”游乐设施中幸存下来的最勇敢的人。 | Handed out to the bravest souls who survived the "atomic twister" ride at Syndieland.
  components:
  - type: Sprite
    sprite: Objects/Fun/Balloons/syndicate.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/Balloons/syndicate.rsi
  - type: StaticPrice
    price: 100 # Entertainment.

- type: entity
  parent: BaseBalloon
  id: BalloonNT
  name: 纳米传讯气球 | nanotrasen balloon
  description: 专为对辛迪加特工造成最大心理伤害而设计。 | Specially designed to inflict maximum psychological damage to Syndicate operatives.
  components:
  - type: Sprite
    sprite: Objects/Fun/Balloons/nanotrasen.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/Balloons/nanotrasen.rsi

- type: entity
  parent: BaseBalloon
  id: BalloonCorgi
  name: 柯基气球 | corgi balloon
  description: 就像养了一只真狗——但更飘一些。 | Just like owning a real dog - but a lot floatier.
  components:
  - type: Sprite
    sprite: Objects/Fun/Balloons/corgi.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/Balloons/corgi.rsi
