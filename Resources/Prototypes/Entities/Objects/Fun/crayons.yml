# When adding new crayons, also add it to id: AllCrayonsTable

- type: entity
  abstract: true
  parent: [SolutionFood, SolutionVeryTiny, BaseItem] # Crayons are less pourous than most foods, so we just assume they have less capacity.
  id: CrayonInedible
  name: 蜡笔 | crayon
  description: 一支彩色蜡笔。一种被禁止的味道。 | A colourful crayon. A forbidden flavor.
  components:
  - type: Sprite
    sprite: Objects/Fun/crayons.rsi
  - type: Item
    sprite: Objects/Fun/crayons.rsi
    size: Tiny
  - type: Tag
    tags:
    - Write
    - Crayon
    - Trash
    - Recyclable
  - type: SpaceGarbage
  - type: UserInterface
    interfaces:
      enum.CrayonUiKey.Key:
        type: CrayonBoundUserInterface
  - type: Crayon
    selectedState: like
  - type: LimitedCharges
    maxCharges: 25
  - type: StaticPrice
    price: 5

- type: entity
  abstract: true
  parent: CrayonInedible
  id: Crayon
  description: 一支五颜六色的蜡笔。看起来很好吃。嗯…… | A colourful crayon. Looks tasty. Mmmm...
  components:
  - type: Edible
  - type: FlavorProfile
    flavors:
    - chewy
    - bitter
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: MindbreakerToxin
        Quantity: 10

# special crayons

- type: entity
  parent: Crayon
  id: CrayonMime
  name: 哑剧蜡笔 | mime crayon
  components:
  - type: Sprite
    state: mime
  - type: Item
    heldPrefix: mime
  - type: Crayon
    color: white
  - type: Tag
    tags:
    - Write
    - Crayon
    - CrayonWhite
    - Recyclable
    - Trash

- type: entity
  parent: Crayon
  id: CrayonRainbow
  name: 彩虹蜡笔 | rainbow crayon
  components:
  - type: Sprite
    state: rainbow
  - type: Item
    heldPrefix: rainbow
  - type: Crayon
    color: Red
    selectableColor: true
  - type: LimitedCharges
    maxCharges: 30

- type: entity
  parent: CrayonRainbow
  id: CrayonInfinite # should not be player available to prevent decal spam
  categories: [DoNotMap]
  name: 无限蜡笔 | infinite crayon
  components:
  - type: Crayon
    deleteEmpty: false
  - type: AutoRecharge
    rechargeDuration: 5

- type: entity
  parent: CrayonInedible
  id: CrayonBorg
  name: 电蜡笔 | electric crayon
  description: 据说这是所有宇宙中最美味的蜡笔类型；可惜你不能吃。 | Supposedly the most delicious crayon type in all the universes; unfortunately, you cannot eat.
  components:
  - type: Sprite
    state: electric
  - type: Item
    heldPrefix: electric
  - type: Crayon
    deleteEmpty: false
    color: Red
    selectableColor: true
  - type: AutoRecharge
    rechargeDuration: 5

