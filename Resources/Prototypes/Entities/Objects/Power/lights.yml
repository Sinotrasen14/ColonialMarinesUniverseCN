- type: entity
  abstract: true
  parent: BaseItem
  id: BaseReplacementLight
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: Sprite
    sprite: Objects/Power/light_bulb.rsi
    layers:
    - map: [enum.LightBulbVisualLayers.Base]
      state: normal
  - type: LightBulb
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: DamageOnLand
    damage:
      types:
        Blunt: 5
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:DoActsBehavior
        acts: ["Breakage"]
    - trigger: &DamageTrigger10 !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Appearance
  - type: Tag
    tags:
    - Trash
  - type: PhysicalComposition
    materialComposition:
      Glass: 25
  - type: SpaceGarbage
  - type: ToolRefinable
    refineResult:
    - id: SheetGlass1

- type: entity
  abstract: true
  parent: BaseReplacementLight
  id: BaseLightbulb
  components:
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger10
      behaviors: &BehaviorsSpawnShardGlass
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1

- type: entity
  abstract: true
  parent: BaseReplacementLight
  id: BaseLightTube
  components:
  - type: Sprite
    sprite: Objects/Power/light_tube.rsi
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger10
      behaviors: *BehaviorsSpawnShardGlass

#region Bulbs

# Lighting color values gathered from
# https://andi-siess.de/rgb-to-color-temperature/
# https://academo.org/demos/colour-temperature-relationship/
- type: entity
  parent: BaseLightbulb
  name: 白炽灯泡 | incandescent light bulb
  id: LightBulb
  description: 一个灯泡。 | A light bulb.
  components:
  - type: LightBulb
    bulb: Bulb
    color: "#FFD1A3" # 4000K color temp
    lightEnergy: 1.0
    lightRadius: 6
    lightSoftness: 1.1
    shortName: comp-light-bulb-incandescent
  - type: Tag
    tags:
    - LightBulb
    - Trash

- type: entity
  parent: BaseLightbulb
  name: LED灯泡 | led light bulb
  id: LedLightBulb
  description: 一种节能灯泡。 | A power efficient light bulb.
  components:
  - type: LightBulb
    bulb: Bulb
    color: "#EEEEFF"
    lightEnergy: 1
    lightRadius: 8
    lightSoftness: 1
    BurningTemperature: 350 #LEDs are colder than incandescent bulbs
    PowerUse: 6 #LEDs are more power efficient than incandescent bulbs
    shortName: comp-light-bulb-led
  - type: Tag
    tags:
    - LightBulb
    - Trash

- type: entity
  parent: BaseLightbulb
  name: 昏暗的灯泡 | dim light bulb
  id: DimLightBulb
  description: 一个昏暗的灯泡，用于填充维护的黑暗。 | A dim light bulb for populating the darkness of maintenance.
