    color: "#ff9833" # 2200k color temp
    lightEnergy: 1
    lightRadius: 6
    lightSoftness: 3
    shortName: comp-light-bulb-warm
  - type: Tag
    tags:
    - LightBulb
    - Trash

- type: entity
  parent: LightBulb
  name: 旧白炽灯泡 | old incandescent light bulb
  id: LightBulbOld
  description: 一个老化的灯泡。 | An aging light bulb.
  components:
  - type: LightBulb
    bulb: Bulb
    color: "#FFD1A3" # 4000K color temp
    lightEnergy: 0.3 # old incandescents just arent as bright
    lightRadius: 6
    lightSoftness: 1.1
    shortName: comp-light-bulb-old

- type: entity
  parent: BaseLightbulb
  name: 白炽灯泡 | incandescent light bulb
  id: LightBulbBroken
  suffix: Broken
  description: 一个破碎的灯泡。 | A broken light bulb.
