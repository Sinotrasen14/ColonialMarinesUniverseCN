- type: entity
  id: BasePowerCell
  abstract: true
  parent: BaseItem
  components:
  - type: Item
    storedRotation: -90
  - type: Battery
    pricePerJoule: 0.15
  - type: PowerCell
  - type: Explosive
    explosionType: Default
    maxIntensity: 200
    intensitySlope: 1.5
  - type: Sprite
    sprite: Objects/Power/power_cells.rsi
  - type: SolutionManager
    solutions:
    - SolutionRiggable
  - type: InjectableSolution
    solution: battery
  - type: DrawableSolution
    solution: battery
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Zinc
        Quantity: 5
  - type: Tag
    tags:
    - PowerCell
  - type: Riggable
  - type: Appearance
  - type: BatteryVisuals
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerCellVisualLayers.Unshaded:
          Full: {visible: true, state: o2}
          Neither: {visible: true, state: o1}
          Empty: {visible: false}

- type: entity
  parent: Solution
  id: SolutionRiggable
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    id: battery
    solution:
      maxVol: 5

- type: entity
  name: 土豆电池 | potato battery
  description: 有人把两根钉子和一些电线插进了一个大土豆里。不知怎么的，它竟然能提供一点电荷。 | Someone's stuck two nails and some wire in a large potato. Somehow it provides a little charge.
  id: PowerCellPotato
  parent: BasePowerCell
  components:
  - type: Sprite
    layers:
    - state: potato
  - type: Battery
    maxCharge: 70
    startingCharge: 70
  - type: Tag
    tags:
    - PotatoBattery
  - type: Construction
    graph: PowerCellPotato
    node: potatobattery

