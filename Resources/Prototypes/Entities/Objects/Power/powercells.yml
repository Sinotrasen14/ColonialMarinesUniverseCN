# Power cage (big heavy power cell for big devices)

- type: entity
  id: BasePowerCage
  abstract: true
  parent: BasePowerCell
  components:
  - type: Item
    size: Ginormous
    shape:
    - 0,0,3,5
  - type: MultiHandedItem
  - type: SolutionManager
    solutions:
    - SolutionRiggableLarge
  - type: Riggable
    reagent:
      ReagentId: Plasma
      Quantity: 15
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Zinc
        Quantity: 15
  - type: Tag
    tags:
    - PowerCage
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: HeldSpeedModifier

- type: entity
  parent: SolutionRiggable
