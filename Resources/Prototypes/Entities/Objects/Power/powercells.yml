- type: entity
  parent: PowerCellSmall
  id: PowerCellSmallNuclear
  name: 小容量核能电池 | small-capacity nuclear power cell
  description: 一种自充电电池，以牺牲容量为代价实现快速充电速率。 | A self rechargeable power cell, designed for fast recharge rate at the expense of capacity.
  components:
  - type: BatterySelfRecharger
    autoRechargeRate: 36 # 10 seconds to recharge
    autoRechargePauseTime: 30
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Uranium
        Quantity: 5

