- type: entity
  parent: BaseItem
  id: BaseScrap
  abstract: true
  name: 废料 | scrap
  description: 一文不值的废料。不过你或许能从中回收一些材料。 | Worthless junk. You could probably get some materials out of it though.
  suffix: Scrap
  components:
  - type: Sprite
    sprite: Objects/Materials/Scrap/generic.rsi
  - type: Item
    sprite: Objects/Materials/Scrap/generic.rsi
    size: Normal
  - type: Damageable
    damageModifierSet: FlimsyMetallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Tag
    tags:
    - Recyclable
    - SalvageScrap

- type: entity
  parent: BaseStructure
  id: BaseScrapLarge
  abstract: true
  name: 废料 | scrap
  description: 一文不值的垃圾。不过你也许能从中回收一些材料。 | Worthless junk. You could probably get some materials out of it though.
