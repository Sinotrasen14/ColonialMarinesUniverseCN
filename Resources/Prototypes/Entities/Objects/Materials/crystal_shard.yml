- type: entity
  abstract: true
  parent: MaterialBase
  id: ShardCrystalBase
  name: 水晶碎片 | crystal shard
  description: 一小块水晶。 | A small piece of crystal.
  components:
  - type: Tool
    qualities:
    - Slicing
  - type: Execution
    doAfterDuration: 4.0
  - type: Sprite
    layers:
    - sprite: Objects/Materials/Shards/crystal-shard.rsi
      state: shard1
      map: ["enum.DamageStateVisualLayers.Base"]
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        shard1: ""
        shard2: ""
        shard3: ""
  - type: SpaceGarbage
  - type: MeleeWeapon
    wideAnimationRotation: -22.5
    attackRate: 1.5
    damage:
      types:
        Slash: 3.5
  - type: Damageable
    damageModifierSet: Glass
  - type: StaticPrice
    price: 50

- type: entity
  parent: ShardCrystalBase
  id: ShardCrystalCyan
  name: 青色水晶碎片 | cyan crystal shard
