# Faux science tiles
- type: entity
  id: FloorTileItemAstroGrass
  parent: FloorTileItemBase
  name: 天文草 | astro-grass
  description: 覆盖电线的假草，甚至配有逼真的纳米修剪！ | Fake grass that covers up wires and even comes with realistic NanoTrimmings!
  components:
  - type: Sprite
    state: astrograss
  - type: Item
    heldPrefix: grass
  - type: FloorTile
    outputs:
    - Plating
    - FloorAstroGrass
  - type: Stack
    stackType: FloorTileAstroGrass

