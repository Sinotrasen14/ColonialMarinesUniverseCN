- type: entity
  id: ImmovableRod
  name: 不动的杆 | immovable rod
  description: 你能感觉到它饿了。这通常是个坏兆头。 | You can sense that it's hungry. That's usually a bad sign.
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: MovementIgnoreGravity
    weightless: true
  - type: Sprite
    sprite: Objects/Fun/immovable_rod.rsi
    state: icon
    noRot: false
  - type: ImmovableRod
    damage:
      types:
        Blunt: 190
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
  - type: TileFrictionModifier
    modifier: 0
  - type: PointLight
    radius: 3
    color: red
    energy: 2.0
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.5
        density: 1
        hard: false
        layer:
        - Impassable
        - Opaque
  - type: WarpPoint
    follow: true
    location: location-immovable-rod

- type: entity
  parent: ImmovableRod
  id: ImmovableRodDespawn
  suffix: Despawn
  components:
  - type: TimedDespawn
    lifetime: 30.0

- type: entity
  parent: ImmovableRodDespawn
  id: ImmovableRodSlow
  suffix: Slow
  components:
  - type: ImmovableRod
    minSpeed: 1
    maxSpeed: 5

- type: entity
  parent: ImmovableRodDespawn
  id: ImmovableRodKeepTiles
  suffix: Keep Tiles
  components:
  - type: ImmovableRod
    destroyTiles: false
    hitSoundProbability: 1.0

# For Wizard Polymorph
- type: entity
  parent: ImmovableRod
  id: ImmovableRodWizard
  suffix: Wizard
  components:
  - type: ImmovableRod
    maxSpeed: 25
    destroyTiles: false
    randomizeVelocity: false
    shouldGib: false
  - type: Physics
    bodyType: KinematicController
  - type: InputMover
  - type: MovementSpeedModifier
    baseWeightlessAcceleration: 5
    baseWeightlessModifier: 2
    baseWeightlessFriction: 0
    baseFriction: 0
    offGridFriction: 0
  - type: CanMoveInAir
  - type: MovementAlwaysTouching
  - type: NoSlip

- type: entity
  parent: ImmovableRodKeepTiles
  id: ImmovableRodKeepTilesStill
  suffix: Keep Tiles, Still
  components:
  - type: ImmovableRod
    randomizeVelocity: false
    maxSpeed: 0

- type: entity
  parent: ImmovableRodKeepTilesStill
  id: ImmovableRodMop
  name: 不可移动的拖把 | immovable mop
  description: 像标枪一样被投掷出去，带着一千个愤怒清洁工的威力。 | Hurled like a javelin, with the power of a thousand furious janitors.
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/mop.rsi
    state: mop
    rotation: 225
    noRot: false

- type: entity
  parent: ImmovableRodKeepTilesStill
  id: ImmovableRodShark
  name: 不动的鲨鱼 | immovable shark
  description: 鲨鱼龙卷风！ | SHARK TORNADO!
  components:
  - type: Sprite
    sprite: Objects/Fun/Plushies/shark.rsi
    state: blue
    rotation: 90
    noRot: false

- type: entity
  parent: ImmovableRodKeepTilesStill
  id: ImmovableRodClown
  name: 不可移动的小丑 | immovable clown
  description: 被从邻近的太阳系空间站驱逐出来。HONK！ | Ejected from the neighbouring station one solar system over. HONK!
  components:
  - type: Sprite
    sprite: Markers/jobs.rsi
    state: clown
    rotation: 180
    noRot: false

- type: entity
  parent: ImmovableRodKeepTilesStill
  id: ImmovableRodBanana
  name: 不动的香蕉 | immovable banana
  description: 至少你不会被它滑倒。 | At least you won't slip on it.
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/banana.rsi
    state: produce
    noRot: false

- type: entity
  parent: ImmovableRodKeepTilesStill
  id: ImmovableRodHammer
  name: 不动的锤子 | immovable hammer
  description: 不动的锤子。 | Bwoink.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/sledgehammer.rsi
    state: icon
    rotation: 225
    noRot: false

- type: entity
  parent: ImmovableRodKeepTilesStill
  id: ImmovableRodThrongler
  name: 不可移动的群集器 | immovable throngler
  description: 如果你抓住了它，就可以留着它。 | If you catch it, you can keep it.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/Throngler2.rsi
    state: icon
    rotation: 225
    noRot: false

- type: entity
  parent: ImmovableRodKeepTilesStill
  id: ImmovableRodGibstick
  name: 不可移动的吉布斯棒 | immovable gibstick
  description: 你期待什么呢？ | What did you expect?
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/debug.rsi
    state: icon
    rotation: 225
    noRot: false

- type: entity
  parent: ImmovableRodKeepTilesStill
  id: ImmovableRodWeh
  name: 不可移动的WEH | immovable weh
  description: WEH！ | WEH!
  components:
  - type: Sprite
    sprite: Objects/Fun/Plushies/lizard.rsi
    state: icon
    noRot: false
