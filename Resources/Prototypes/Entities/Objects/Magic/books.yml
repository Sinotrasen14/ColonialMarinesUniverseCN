- type: entity
  abstract: true
  parent: [BaseItem, BaseMagicalContraband]
  id: BaseSpellbook
  name: 魔法书 | spellbook
  components:
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    layers:
    - state: paper_blood
    - state: cover_strong
      color: "#645a5a"
    - state: decor_wingette_flat
      color: "#4d0303"
    - state: icon_pentagramm
      color: "#f7e19f"
  - type: Spellbook
  - type: Tag
    tags:
    - Spellbook

# For the Wizard antagonist
# Do not add discounts or price inflation
- type: entity
  parent: [BaseItem, StorePresetSpellbook, BaseMagicalContraband]
  id: WizardsGrimoire
  name: 巫师的法术书 | wizard's grimoire
  suffix: Wizard
  description: 一本厚重的典籍，记载着复杂的奥术公式，用于准备法术和召唤超自然装备。数十年的研究才成就了这卷神秘秘密的合集；现在去用它们毁掉某人的一天吧。 | A heavy tome containing complicated arcane formulae for preparing magic spells and conjuring supernatural equipment. Decades of study went into researching this collection of mystical secrets; now go use them to ruin someone's day.
  components:
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    layers:
    - state: paper_blood
    - state: cover_strong
      color: "#645a5a"
    - state: decor_wingette_flat
      color: "#4d0303"
    - state: icon_pentagramm
      color: "#f7e19f"
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Store
    refundAllowed: true
    ownerOnly: true   # Lesser minds cannot comprehend the arcane secrets within
    balance:
      WizCoin: 10   # prices are balanced around this 10 point maximum and how strong the spells are

# No-refund version meant for manual spawning, so people can't abuse refund if they were given a tome. Not meant for wizard antag proper!
- type: entity
  parent: WizardsGrimoire
  id: WizardsGrimoireNoRefund
  suffix: Wizard, no refunding
  components:
  - type: Store
    refundAllowed: false

# For debugging purposes only! Or spawn this for an admeme so a wizard can have every spell at once, I can't stop you.
- type: entity
  parent: WizardsGrimoire
  id: WizardsGrimoireDebug
  suffix: Wizard, DEBUG
  description: 一本厚重的典籍，记载着用于准备法术和召唤超自然装备的复杂奥术公式。有人在封内写下了“仅供实验使用”。 | A heavy tome containing complicated arcane formulae for preparing magic spells and conjuring supernatural equipment. Someone wrote "FOR EXPERIMENTAL USE ONLY" on the inside cover.
  components:
  - type: Store
    ownerOnly: false   # For ease of debugging.
    balance:
      WizCoin: 99999
    expectedFaction:   #nulls out the expected faction

- type: entity
  parent: BaseSpellbook
  id: SpawnSpellbook
  name: 生成法术书 | spawn spellbook
  components:
  - type: Spellbook
    spellActions:
      ActionSpawnMagicarpSpell:

- type: entity
