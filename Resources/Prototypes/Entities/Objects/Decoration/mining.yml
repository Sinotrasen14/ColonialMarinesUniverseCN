- type: entity
  parent: StructureHealthFurnitureWeak
  id: WoodenSign
  name: 木制标牌 | wooden sign
  description: 他正指向某个地方。 | He's pointing somewhere.
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Objects/Decoration/mines.rsi
    state: sign_left
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.35,-0.4,0.35,0.4"
        density: 100
  - type: Damageable
    damageModifierSet: WoodMod
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Effects/chop.ogg
        params:
          variation: 0.05
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 5
      behaviors:
      - &SoundWoodDestroy !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          Log:
            min: 1
            max: 1

- type: entity
  parent: WoodenSign
  id: WoodenSignRight
  components:
  - type: Sprite
    sprite: Objects/Decoration/mines.rsi
    state: sign_right

- type: entity
  abstract: true
  parent: [BaseStructure, StructureHealthFurniture]
  id: BaseWoodenSupport
  placement:
    mode: SnapgridCenter
  components:
  - type: PlacementReplacement
    key: walls
  - type: Tag
    tags:
    - Wooden
  - type: Sprite
    noRot: true
    sprite: Objects/Decoration/mines.rsi
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 40
      behaviors:
      - *SoundWoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          Log:
            min: 1
            max: 3
  - type: Physics
    bodyType: Static
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Effects/chop.ogg
        params:
          variation: 0.05

- type: entity
  parent: BaseWoodenSupport
  id: WoodenSupport
  name: 木质支架 | wooden support
  description: 增加你对石头不会砸到头的信心。 | Increases your confidence that a rock won't fall on your head.
  components:
  - type: StructuralSupport
    isVerticalSupport: true
    cantileverSpan: 2
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.1,-0.5,0.1,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000

- type: entity
  parent: BaseWoodenSupport
  id: WoodenSupportBeam
  name: 木质支撑梁 | wooden support beam
  components:
  - type: StructuralSupport
    isVerticalSupport: true
    cantileverSpan: 2
  - type: Sprite
    state: support_beams
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000

- type: entity
  parent: BaseWoodenSupport
  id: WoodenSupportWall
  name: 木质支撑墙 | wooden support wall
  description: 一堵老旧、腐烂的墙。 | An old, rotten wall.
  components:
  - type: Tag
    tags:
    - Wall
    - Wooden
  - type: Wall
  - type: Sprite
    state: support_wall
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000

- type: entity
  parent: BaseWoodenSupport
  id: WoodenSupportWallBroken
  components:
  - type: Tag
    tags:
    - Wall
    - Wooden
  - type: Wall
  - type: Sprite
    state: support_wall_broken
