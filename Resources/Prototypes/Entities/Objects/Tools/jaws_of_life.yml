  id: SyndicateJawsOfLife
  description: 用于闯入安全区域和其他非法活动。 | Useful for breaking into secure areas and other nefarious activities.
  components:
  - type: Sprite
    sprite: Objects/Tools/jaws_of_life.rsi
    state: syn_jaws_pry
  - type: Item
    inhandVisuals:
      left:
      - state: syn_inhand-left
      right:
      - state: syn_inhand-right
    size: Normal
  - type: Prying
    force: true
    speedModifier: 3.0
  - type: MultipleTool
    entries:
    - behavior: [Prying]
      sprite:
        sprite: Objects/Tools/jaws_of_life.rsi
        state: syn_jaws_pry
      useSound: !type:SoundPathSpecifier
        path: /Audio/Items/jaws_pry.ogg
        params:
          volume: -2
      changeSound: !type:SoundPathSpecifier
        path: /Audio/Items/change_jaws.ogg
        params:
          volume: -5
    - behavior: [Cutting]
      sprite:
        sprite: Objects/Tools/jaws_of_life.rsi
        state: syn_jaws_cutter
      useSound: !type:SoundPathSpecifier
        path: /Audio/Items/jaws_cut.ogg
        params:
          volume: -4
      changeSound: !type:SoundPathSpecifier
        path: /Audio/Items/change_jaws.ogg
        params:
          volume: -5
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 14
  - type: StaticPrice
    price: 1000

