- type: entity
  abstract: true
  parent: BaseItem
  id: BaseJammer
  name: 无线电干扰器 | radio jammer
  description: 该设备激活后，会干扰附近所有外发的无线电通信以及宇航服传感器。 | This device will disrupt any nearby outgoing radio communication as well as suit sensors when activated.
  components:
  - type: Sprite
    sprite: Objects/Devices/jammer.rsi
    layers:
    - state: jammer
    - state: jammer_high_charge
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      shader: unshaded
      visible: false
  - type: RadioJammer
    settings:
    - wattage: 2
      range: 6
      message: radio-jammer-component-set-message-low
      name: radio-jammer-component-setting-low
    - wattage: 12
      range: 12
      message: radio-jammer-component-set-message-high
      name: radio-jammer-component-setting-high
  - type: Appearance
  - type: ItemToggle
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.PowerDeviceVisualLayers.Powered:
          true: {visible: true}
          false: {visible: false}
  - type: BatteryVisuals
  - type: StaticPrice
    price: 1500

- type: entity
  name: 无线电干扰器 | radio jammer
  parent: [BaseJammer, PowerCellSlotMediumItem, BaseSyndicateContraband]
  id: RadioJammer
  description: 该设备激活后，会干扰附近所有进出无线电通信以及宇航服传感器。 | This device will disrupt any nearby outgoing and incoming radio communication as well as suit sensors when activated.
  components:
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerDeviceVisualLayers.Powered:
          Full: {state: jammer_high_charge}
          Neither: {state: jammer_medium_charge}
          Empty: {state: jammer_low_charge}
      enum.ToggleableVisuals.Enabled:
        enum.PowerDeviceVisualLayers.Powered:
          true: {visible: true}
          false: {visible: false}
  - type: ToggleCellDraw
  - type: BatteryVisuals
  - type: StaticPrice
    price: 1500

- type: entity
  parent: [BaseJammer, BaseXenoborgContraband]
  id: XenoborgRadioJammer
  name: 异星机械无线电阻断器 | xenoborg radio jammer
  components:
  - type: RadioJammer
    frequenciesExcluded:
    - 200.2 # xenoborg radio
    - 200.3 # mothership radio
    deviceFrequenciesExcluded:
    - 2002 # xenoborg radio network
    - 2003 # mothership radio network
    - 2004 # xenoborg network
    - 2005 # mothership network
