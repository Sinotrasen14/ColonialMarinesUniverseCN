  - type: Clothing
    sprite: Objects/Tanks/Jetpacks/blue.rsi
    slots:
    - Back

# Filled blue
- type: entity
  id: JetpackBlueFilled
  parent: JetpackBlue
  name: 喷气背包 | jetpack
  suffix: Filled
  components:
  - type: GasTank
    releasePressure: 42.6
    air:
