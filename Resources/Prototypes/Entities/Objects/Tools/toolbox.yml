- type: entity
  id: ToolboxBase
  parent: BaseStorageItem
  abstract: true
  components:
  - type: Sprite
    layers:
    - map: [base]
      state: icon
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/toolbox_drop.ogg
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,6,3
    storageOpenSound: /Audio/Items/toolbox_open.ogg
    storageCloseSound: /Audio/Items/toolbox_close.ogg
    storageInsertSound: /Audio/Items/toolbox_insert.ogg
    storageRemoveSound: /Audio/Items/toolbox_remove.ogg
  - type: Item
    size: Ginormous
    shape:
    - 0,0,7,4
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
  - type: Tag
    tags:
    - Toolbox
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          true: {state: icon-open}
          false: {state: icon}
  - type: Appearance

- type: entity
  name: 应急工具箱 | emergency toolbox
  parent: ToolboxBase
  id: ToolboxEmergency
  description: 一个鲜红色的工具箱，里面装着急救工具。 | A bright red toolbox, stocked with emergency tools.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_red.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_red.rsi

- type: entity
  name: 机械工具箱 | mechanical toolbox
  parent: ToolboxBase
  id: ToolboxMechanical
  description: 一个蓝色的箱子，里面装满了机械工具。 | A blue box, stocked with mechanical tools.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_blue.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_blue.rsi

- type: entity
  name: 电工工具箱 | electrical toolbox
  parent: ToolboxBase
  id: ToolboxElectrical
  description: 通常装有电气设备的工具箱。 | A toolbox typically stocked with electrical gear.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_yellow.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_yellow.rsi

- type: entity
  name: 电工工具箱 | electrical toolbox
  suffix: Syndicate, Turret
  parent: ToolboxElectrical
  id: ToolboxElectricalTurret
  description: 一个通常装有电工装备的工具箱。 | A toolbox typically stocked with electrical gear.
  components:
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
                                    # todo this is not a good way to be doing this. Should probably use a construction graph
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          WeaponTurretSyndicateDisposable:
            min: 1
            max: 1
  - type: StaticPrice
    price: 1350

- type: entity
  name: 艺术工具箱 | artistic toolbox
  parent: ToolboxBase
  id: ToolboxArtistic
  description: 一个通常装有美术用品的工具箱。 | A toolbox typically stocked with artistic supplies.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_green.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_green.rsi

- type: entity
  name: 可疑工具箱 | suspicious toolbox
  parent: [ToolboxBase, BaseSyndicateContraband]
  id: ToolboxSyndicate
  description: 一个装满精英辛迪加工具、外观阴森的工具箱。 | A sinister looking toolbox filled with elite syndicate tools.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_syn.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_syn.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,7,3
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 20

- type: entity
  name: 金色工具箱 | golden toolbox
  parent: ToolboxBase
  id: ToolboxGolden
  description: 一个纯金工具箱。说唱歌手会为它拼命。 | A solid gold toolbox. A rapper would kill for this.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_gold.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_gold.rsi

- type: entity
  name: 傻瓜工具箱 | foolbox
  parent: ToolboxBase
  id: Foolbox
  description: 一个给傻瓜用的工具箱，里面装满了小丑道具。 | A toolbox for fools, stocked with clowning equipment.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/foolbox.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/foolbox.rsi
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 2
    soundHit: &SoundRubberHammer
      collection: RubberHammer
      params:
        variation: 0.03
        volume: 3
  - type: EmitSoundOnLand
    sound: *SoundRubberHammer
  - type: Storage
    storageOpenSound: &SoundHorn
      collection: BikeHorn
      params:
        variation: 0.125
    storageCloseSound: *SoundHorn
    storageInsertSound: &SoundSqueak
      collection: FootstepClown
      params:
        variation: 0.125
    storageRemoveSound: *SoundSqueak
