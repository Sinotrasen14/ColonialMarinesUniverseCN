- type: entity
  abstract: true
  parent: [SolutionWelder, BaseItem]
  id: BaseLighter
  name: 基本打火机 | basic lighter
  components:
  - type: IgnitionSource
    ignited: false
  - type: ItemToggleExaminableStatus
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: lighterOnSounds
    soundDeactivate:
      collection: lighterOffSounds
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Heat: 1
  - type: ItemToggleSize
    activatedSize: Small
  - type: ItemToggleHot
  - type: Appearance
  - type: Item
    size: Tiny
  - type: UseDelay
  - type: RefillableSolution
    solution: Welder
  - type: MeleeWeapon
    wideAnimationRotation: 180
    damage:
      types:
        Blunt: 0
  - type: Welder
    fuelConsumption: 0.01
    fuelLitCost: 0.1
    tankSafe: true
  - type: PointLight
    enabled: false
    netsync: false
    radius: 1.1 #smallest possible
    color: orange
  - type: ItemTogglePointLight
  - type: PhysicalComposition
  - type: RMCLighter
  - type: CMSurgeryTool
  - type: CMCautery
  - type: CMUImprovisedSurgeryTool
    delayMultiplier: 2.3
    mishapChance: 0.16
    mishapDamageType: Heat
    mishapDamageAmount: 4

- type: entity
  abstract: true
  parent: [SolutionWelder, SolutionToolVeryTiny]
  id: SolutionLighter
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 7.5

## Basic

- type: entity
  parent: [SolutionLighter, BaseLighter]
  id: Lighter
  name: 基本打火机 | basic lighter
  description: 一个简单的塑料打火机。 | A simple plastic cigarette lighter.
  components:
  - type: Sprite
    sprite: Objects/Tools/Lighters/lighters.rsi
    layers:
    - state: icon_map
    - state: cheap_icon_base
      map: ["skin"]
    - state: basic_icon_top
    - state: lighter_flame
      visible: false
      shader: unshaded
      map: ["flame"]
  - type: RandomSprite
    available:
    - skin:
        basic_icon_base-1: ""
        basic_icon_base-2: ""
        basic_icon_base-3: ""
        basic_icon_base-4: ""
        basic_icon_base-5: ""
        basic_icon_base-6: ""
        basic_icon_base-7: ""
        basic_icon_base-8: ""
        basic_icon_base-9: ""
        basic_icon_base-10: ""
        basic_icon_base-11: ""
  - type: ToggleableVisuals
    spriteLayer: flame
    inhandVisuals:
      left:
      - state: inhand-left-flame
        shader: unshaded
      right:
      - state: inhand-right-flame
        shader: unshaded
  - type: Item
    sprite: Objects/Tools/Lighters/lighters.rsi

- type: entity
  parent: Lighter
  id: CheapLighter
  name: 廉价打火机 | cheap lighter
  description: "一个危险廉价的塑料打火机。别烧到你的拇指！ | A dangerously inexpensive plastic lighter. Don't burn your thumb!"
  components:
  - type: Sprite
    sprite: Objects/Tools/Lighters/lighters.rsi
    layers:
    - state: icon_map
    - state: cheap_icon_base
      map: ["skin"]
    - state: cheap_icon_top
    - state: lighter_flame
      visible: false
      shader: unshaded
      map: ["flame"]
  - type: RandomSprite
    available:
    - skin:
        cheap_icon_base: Rainbow
  - type: Welder
    fuelConsumption: 0.02
    fuelLitCost: 0.2

- type: entity
  parent: [SolutionLighter, BaseLighter]
  id: DiscountDanLighter
  name: 折扣丹的打火机 | Discount Dan's lighter
  description: 史上最差的打火机。打火机烧起来是不可避免的，点燃时请勿加油。 | The worst lighter ever produced. Lighter burn is inevitable, do not refuel while lit.
  components:
  - type: Sprite
    sprite: Objects/Tools/Lighters/lighters.rsi
    layers:
    - state: icon_map
    - state: discount_icon_base
    - state: basic_icon_top
    - state: lighter_flame
      visible: false
      shader: unshaded
      map: ["flame"]
  - type: Welder # the single worst lighter invented by mankind
    fuelConsumption: 0.4
    fuelLitCost: 0.2
    tankSafe: false
  - type: Item
    sprite: Objects/Tools/Lighters/lighters.rsi
  - type: ToggleableVisuals
    spriteLayer: flame
    inhandVisuals:
      left:
      - state: inhand-left-flame
        shader: unshaded
      right:
      - state: inhand-right-flame
        shader: unshaded
  - type: PointLight
    radius: 1.5
    color: yellow
  - type: ComponentToggler
    components:
    - type: DamageOnHolding # todo this needs to make a sound or something to tell people it's burning them
      damage:
        types:
          Heat: 2

## Flippos

- type: entity
  abstract: true
  parent: [SolutionToolWelderMini, BaseLighter]
  id: BaseBrandedLighter
  components:
  - type: ItemToggle
    predictable: false
    soundActivate:
      path: /Audio/Items/Lighters/zippo_open.ogg
      params:
        volume: -5
    soundDeactivate:
      path: /Audio/Items/Lighters/zippo_close.ogg
      params:
        volume: -5
  - type: Sprite
    layers:
    - state: icon
      map: ["base"]
    - state: top
      map: ["top"]
      visible: false
    - state: open
      map: ["open"]
      visible: false
    - state: flame
      map: ["flame"]
      visible: false
      shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        open:
          true: {visible: true}
          false: {visible: false}
        top:
          true: {visible: true}
          false: {visible: false}
        base:
          true: {visible: false}
          false: {visible: true}
  - type: ToggleableVisuals
    spriteLayer: flame
    inhandVisuals:
      left:
      - state: inhand-left-lit
        shader: unshaded
      right:
      - state: inhand-right-lit
        shader: unshaded
  - type: PointLight
    radius: 1.5 #slightly stronger than the other lighters

- type: entity
  parent: BaseBrandedLighter
  id: FlippoLighter
  name: 翻盖打火机 | flippo lighter
  description: 一个坚固的金属打火机，能用上很久。 | A rugged metal lighter that lasts quite a while.
  components:
  - type: Sprite
    sprite: Objects/Tools/Lighters/lighters.rsi
    layers:
    - state: zippo_icon_base
      map: ["base"]
    - state: zippo_top
      map: ["top"]
      visible: false
    - state: zippo_open
      map: ["open"]
      visible: false
    - state: lighter_flame
      map: ["flame"]
      visible: false
      shader: unshaded
  - type: Item
    sprite: Objects/Tools/Lighters/lighters.rsi
    heldPrefix: zippo
  - type: ToggleableVisuals
    inhandVisuals:
      left:
      - state: zippo-inhand-left-flame
        shader: unshaded
      right:
      - state: zippo-inhand-right-flame
        shader: unshaded

- type: entity
  parent: FlippoLighter
  id: FlippoEngravedLighter
  name: flippo雕刻打火机 | flippo engraved lighter
  description: 一个坚固的金色打火机，能用上很久。雕刻没有任何战术优势。 | A rugged golden lighter that lasts quite a while. Engravings serve no tactical advantage whatsoever.
  components:
  - type: Sprite
    sprite: Objects/Tools/Lighters/lighters.rsi
    layers:
    - state: zippo_engraved_icon_base
