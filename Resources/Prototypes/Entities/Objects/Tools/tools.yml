- type: entity
  name: 断线钳 | wirecutter
  parent: BaseItem
  id: Wirecutter
  description: 这会把电线剪断。 | This kills the wire.
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/wirecutter_drop.ogg
  - type: Tag
    tags:
    - Wirecutter
  - type: Sprite
    sprite: Objects/Tools/wirecutters.rsi
    layers:
    - state: cutters
      map: ["enum.DamageStateVisualLayers.Base"]
    - state: cutters-cutty-thingy
  - type: MeleeWeapon
    wideAnimationRotation: -90
    damage:
      types:
        Piercing: 2
    attackRate: 2 #open and close that shit on their arm like hell! because you sure aren't doing any damage with this
    soundHit:
      path: "/Audio/Items/wirecutter.ogg"
  - type: DamageImpactProfile
    melee:
      contact: Stab
      penetration: Low
  - type: Tool
    qualities:
    - Cutting
    - Shearing
    useSound:
      path: /Audio/Items/wirecutter.ogg
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        cutters: Rainbow
  - type: Item
    sprite: Objects/Tools/wirecutters.rsi
    storedRotation: -90
  - type: ToolTileCompatible
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: StaticPrice
    price: 30
  - type: CMSurgeryTool
  - type: CMHemostat
  - type: CMUImprovisedSurgeryTool
    delayMultiplier: 1.7
    mishapChance: 0.10
    mishapDamageType: Piercing
    mishapDamageAmount: 2
  - type: BotanySampleTaker

