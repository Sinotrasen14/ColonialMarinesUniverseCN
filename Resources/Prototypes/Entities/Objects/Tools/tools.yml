- type: entity
  name: 多功能工具 | multitool
  parent: BaseItem
  id: Multitool
  description: 一种高级工具，用于通过电线和机器复制、存储和发送电脉冲与信号。 | An advanced tool to copy, store, and send electrical pulses and signals through wires and machines.
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/multitool_drop.ogg
  - type: Sprite
    sprite: Objects/Tools/multitool.rsi
    layers:
    - state: icon
    - state: green-unlit
      shader: unshaded
  - type: Item
    size: Small
  - type: Clothing
    sprite: Objects/Tools/multitool.rsi
    quickEquip: false
    slots:
    - Belt
  - type: Tool
    qualities:
    - Pulsing
  - type: NetworkConfigurator
  - type: ActivatableUI
    key: enum.NetworkConfiguratorUiKey.List
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.NetworkConfiguratorUiKey.List:
        type: NetworkConfiguratorBoundUserInterface
      enum.NetworkConfiguratorUiKey.Configure:
        type: NetworkConfiguratorBoundUserInterface
      enum.NetworkConfiguratorUiKey.Link:
        type: NetworkConfiguratorBoundUserInterface
  - type: Tag
    tags:
    - Multitool
    - DoorElectronicsConfigurator
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Plastic: 100
  - type: StaticPrice
    price: 56
  - type: GuideHelp
    guides:
    - Networking
    - WirePanels
    - Airlocks
    - InspectingPower

- type: entity
  name: 网络配置器 | network configurator
  parent: BaseItem
  id: NetworkConfigurator
  description: 用于将设备连接在一起的工具。有两种模式：列表模式用于批量连接设备，连接模式用于高级设备连接。 | A tool for linking devices together. Has two modes, a list mode for mass linking devices and a linking mode for advanced device linking.
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/multitool_drop.ogg
  - type: Sprite
    sprite: Objects/Tools/network_configurator.rsi
    layers:
    - state: icon
    - state: mode-link
      map: ["enum.NetworkConfiguratorLayers.ModeLight"]
      shader: unshaded
  - type: Item
    size: Small
  - type: Clothing
    sprite: Objects/Tools/network_configurator.rsi
    quickEquip: false
    slots:
    - Belt
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.NetworkConfiguratorVisuals.Mode:
        enum.NetworkConfiguratorLayers.ModeLight:
          true: {state: mode-link}
          false: {state: mode-list}
  - type: NetworkConfigurator
  - type: ActivatableUI
    key: enum.NetworkConfiguratorUiKey.List
    inHandsOnly: true
  - type: Tag
    tags:
    - DoorElectronicsConfigurator
  - type: UserInterface
    interfaces:
      enum.NetworkConfiguratorUiKey.List:
        type: NetworkConfiguratorBoundUserInterface
      enum.NetworkConfiguratorUiKey.Configure:
        type: NetworkConfiguratorBoundUserInterface
      enum.NetworkConfiguratorUiKey.Link:
        type: NetworkConfiguratorBoundUserInterface
  - type: StaticPrice
    price: 56
  - type: GuideHelp
    guides:
    - Networking

#Power tools
#Later on these should switch probably switch damage when changing the tool behavior.
- type: entity
  name: 电钻 | power drill
  parent: BaseItem
  id: PowerDrill
  description: 一个简单的手持电钻。 | A simple powered hand drill.
  components:
  - type: Tag
    tags:
    - Powerdrill
  - type: Sprite
    sprite: Objects/Tools/drill.rsi
    state: drill_screw
  - type: Item
    sprite: Objects/Tools/drill.rsi
    size: Small
  - type: Tool
    qualities:
    - Screwing
    speedModifier: 1.5
    useSound: !type:SoundPathSpecifier
      path: /Audio/Items/drill_use.ogg
      params:
        volume: -2.5
  - type: MultipleTool
    statusShowBehavior: true
    entries:
    - behavior: [Screwing]
      sprite:
        sprite: Objects/Tools/drill.rsi
        state: drill_screw
      useSound: !type:SoundPathSpecifier
        path: /Audio/Items/drill_use.ogg
        params:
          volume: -2.5
      changeSound: !type:SoundPathSpecifier
        path: /Audio/Items/change_drill.ogg
        params:
          volume: -5
    - behavior: [Anchoring]
      sprite:
        sprite: Objects/Tools/drill.rsi
        state: drill_bolt
      useSound: !type:SoundPathSpecifier
        path: /Audio/Items/drill_use.ogg
        params:
          volume: -2.5
      changeSound: !type:SoundPathSpecifier
        path: /Audio/Items/change_drill.ogg
        params:
          volume: -5
  - type: PhysicalComposition
    materialComposition:
      Steel: 300
      Plastic: 100
  - type: StaticPrice
    price: 100
  - type: MeleeWeapon
    wideAnimationRotation: -90
    attackRate: 1.5
    damage:
      types:
        Piercing: 10
    soundHit:
      path: "/Audio/Items/drill_hit.ogg"

- type: entity
  id: RCD
  parent: [BaseItem, BaseEngineeringContraband]
  name: 快速建造设备 | RCD
  description: 快速建造设备可用于快速放置和移除各种空间站结构和设施。需要压缩物质才能运作。 | The rapid construction device can be used to quickly place and remove various station structures and fixtures. Requires compressed matter to function.
  components:
  - type: RCD
    availablePrototypes:
    - WallSolid
    - FloorSteel
    - Plating
    - Catwalk
    - Grille
    - Window
    - WindowDirectional
    - WindowReinforcedDirectional
    - ReinforcedWindow
    - Airlock
    - AirlockGlass
    - Firelock
    - TubeLight
    - BulbLight
    - LVCable
    - MVCable
    - HVCable
    - CableTerminal
    - Deconstruct
  - type: LimitedCharges
    maxCharges: 30
  - type: Sprite
    sprite: Objects/Tools/rcd.rsi
    state: icon
  - type: Item
    size: Normal
  - type: Clothing
    sprite: Objects/Tools/rcd.rsi
    quickEquip: false
    slots:
    - Belt
  - type: PhysicalComposition
    materialComposition:
      Steel: 600
      Plastic: 100
  - type: StaticPrice
    price: 110
  - type: UserInterface
    interfaces:
      enum.RcdUiKey.Key:
        type: RCDMenuBoundUserInterface
  - type: ActivatableUI
    inHandsOnly: true
    key: enum.RcdUiKey.Key

- type: entity
  id: RCDEmpty
  parent: RCD
  suffix: Empty
  components:
  - type: LimitedCharges
    lastCharges: -1

- type: entity
  id: RCDRecharging
  parent: RCD
  name: 实验型RCD | experimental RCD
  description: 半机械体搭载的快速建造装置，利用内部制造机即时生成压缩物质。 | Cyborg-mounted Rapid Construction Device which creates compressed matter on the fly using an internal fabricator.
  suffix: AutoRecharge
  components:
  - type: LimitedCharges
    maxCharges: 20
  - type: AutoRecharge
    rechargeDuration: 10

- type: entity
  id: RCDExperimental
  parent: RCD
  suffix: Admeme
  name: 实验型快速建造装置 | experimental RCD
  description: 一种蓝空间增强型快速建造装置，可被动生成自身的压缩物质。 | A bluespace-enhanced rapid construction device that passively generates its own compressed matter.
  components:
  - type: AutoRecharge
    rechargeDuration: 1

