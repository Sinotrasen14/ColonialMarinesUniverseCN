- type: entity
  parent: BaseItem
  name: 灯泡替换器 | light replacer
  id: LightReplacer
  description: 一个使用磁铁轻松替换损坏灯泡的物品。通过向替换器中添加更多灯泡来补充。 | An item which uses magnets to easily replace broken lights. Refill by adding more lights into the replacer.
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/light_replacer.rsi
    state: icon
  - type: Item
    sprite: Objects/Specific/Janitorial/light_replacer.rsi
  - type: LightReplacer
  - type: EntityProvider
    whitelist:
      components:
      - LightBulb
  - type: ContainerContainer
    containers:
      entity-provider: !type:Container
  - type: StaticPrice
    price: 100
  - type: UserInterface
    interfaces:
      enum.LightReplacerUiKey.Key:
        type: LightReplacerMenuBoundUserInterface
  - type: Tag
    tags:
    - LightReplacer

- type: entity
  parent: LightReplacer
  id: LightReplacerFilled
  suffix: Filled
  components:
  - type: EntityProvider
    entityCounter:
      LightTube: 8
      LightBulb: 5

# The following entities are solely used for sprites in the radial menu.
- type: entity
  id: EjectTubes
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/light_replacer.rsi
    state: eject-tubes

- type: entity
  id: EjectBulbs
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/light_replacer.rsi
    state: eject-bulbs
