- type: entity
  id: ActionTogglePropCalling
  parent: BaseToggleAction
  name: 切换Prop调用
  description: 加入或退出Prop呼叫名单。
  components:
  - type: Action
    checkCanInteract: false
    autoPopulate: false # CMU14
  - type: Sprite
    layers:
    - sprite: _RMC14/Interface/prop_calling.rsi
      state: RMC_observeraction_not_joining
      map: ["enum.ActionVisuals.Icon"]
    - sprite: _RMC14/Interface/prop_calling.rsi
      state: RMC_observeraction_joining
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false

- type: entity
  id: ActionCallProps
  parent: BaseMentalAction
  name: 呼叫Prop
  description: 召集所有报名参加Prop的人。
  components:
  - type: Action
    autoPopulate: false # CMU14
  - type: Sprite
    layers:
    - sprite: _RMC14/Interface/prop_calling.rsi
      state: RMC_observeraction_call_props
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:CallOverPropsEvent
