- type: entity
  id: ActionToggleMarineHud
  name: 切换陆战队HUD
  description: Toggle marine icons.
  components:
  - type: Action
    checkCanInteract: false
    autoPopulate: false # CMU14
  - type: Sprite
    layers:
    - sprite: _RMC14/Interface/cm_job_icons.rsi
      state: hudsquad_co
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ToggleMarineHudActionEvent

- type: entity
  id: ActionToggleXenoHud
  name: 切换异形HUD
  description: Toggle xeno health and plasma bars.
  components:
  - type: Action
    checkCanInteract: false
    autoPopulate: false # CMU14
  - type: Sprite
    layers:
    - sprite: _RMC14/Interface/Alerts/xeno_health.rsi
      state: health_full
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ToggleXenoHudActionEvent

- type: entity
  id: ActionFindParasite
  name: 寻找寄生虫
  description: 找可操控的幽灵寄生虫
  components:
  - type: Action
    checkCanInteract: false
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/observer_actions.rsi
      state: find_parasite
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:FindParasiteActionEvent

- type: entity
  id: ActionJoinXeno
  name: 加入异形
  description: 找埋在土里的幼虫来加入。
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 0.5
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/observer_actions.rsi
      state: join_xeno
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:JoinXenoActionEvent

- type: entity
  id: ActionToggleVisibility
  name: 切换可见性
  description: 切换你的可见性，在你隐身的时候，你的朋友仍然可以听到你说的话。
  components:
  - type: Action
    checkCanInteract: false
  - type: Sprite
    layers:
    - sprite: Mobs/Ghosts/ghost_human.rsi #TODO Find a better icon
      state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ImaginaryFriendToggleVisibilityActionEvent

- type: entity
  id: ActionStopBeingFriends
  name: 离开好友
  description: 别再当虚拟朋友了。
  components:
  - type: Action
    checkCanInteract: false
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/marine_emplacement_actions.rsi #TODO Find a better icon
      state: cancel_view
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ImaginaryFriendStopBeingFriendsActionEvent
