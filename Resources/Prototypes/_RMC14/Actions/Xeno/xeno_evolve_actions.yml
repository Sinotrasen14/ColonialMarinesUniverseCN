- type: entity
  parent: ActionXenoBase
  id: ActionXenoEvolve
  name: 进化
  description: 进化到异形的下一阶层，或在有可用变种时选择一个变种。
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: evolve
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoOpenEvolutionsActionEvent

- type: entity
  parent: ActionXenoBase
  id: ActionXenoDevolve
  name: 退化
  description: 退化为异形的前一个阶层。[color=red]你的进化点不会退还！[/color]
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: xeno_deevolve
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoOpenDevolveActionEvent

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoEvolve
  name: 进化
  description: 进化为异形的下一品级，或若有可用品系则选择一个品系。
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    state: evolve
