  parent: ActionXenoBase
  id: ActionXenoTantrum
  name: 暴怒（100 等离子，75 狂怒）
  description: 使一名盟友和你自己获得持续几秒的临时护甲，该护甲在你身上持续更久。碾压者和劫掠者则改为获得速度提升。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 7
  - type: Sprite
