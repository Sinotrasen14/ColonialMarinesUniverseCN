  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 10
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: prae_tail_fountain
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
