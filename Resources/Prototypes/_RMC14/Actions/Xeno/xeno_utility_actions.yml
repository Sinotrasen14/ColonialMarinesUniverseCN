    state: screech

- type: entity
  parent: ActionXenoBase
  id: ActionXenoQueenEye
  name: 进入眼形态
  description: 远程查看任何长有杂草的区域。在此形态下，你可以使用无限距离的技能，并能从远处建造树脂。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.25
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: queen_eye
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:QueenEyeActionEvent

- type: entity
  parent: ActionXenoBase
  id: ActionXenoSpikeShield
  name: 尖刺护盾（150碎片）
  description: 消耗碎片获得一个持续短时间的临时护盾。每当护盾受到伤害时，以自身为中心在5x5范围内迸射骨片。护盾持续2秒。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 11.5
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: rav_shard_shield
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ActionXenoSpikeShieldEvent
  - type: ActionBlockIfResting
  - type: RMCDazeableAction

- type: entity
  parent: ActionXenoBase
  id: ActionXenoBulwarkOfTheHive
  name: 蜂巢壁垒
  description: 为你周围的所有蜂巢成员提供一个临时护盾，可在10秒内抵挡200点伤害。当他们的护盾存在时，蜂巢成员每次受到的伤害最多为其生命值的10%。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 60
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: soak
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoBulwarkOfTheHiveActionEvent

- type: entity
  parent: ActionXenoBase
  id: ActionXenoDoom
  name: Doom (50)
  description: 关闭你周围的灯光，持续10秒，并使敌对目标减速、眩晕，同时吸取其生命。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 45
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: screech
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoDoomActionEvent
  - type: XenoActionPlasma
    cost: 50

- type: entity
  id: ActionXenoVomitBile
  parent: ActionXenoBase
  name: 呕吐胆汁（40）
  # CMU14: Extinguishes a nearby hivemate or sprays volatile bile over enemies in the three tiles in front of you.
  description: 熄灭一个同伴或向敌人喷洒挥发性胆汁，并覆盖你前方的三排敌人。当你在燃烧时，会点燃敌人。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 8
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: xeno_spit
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    # range: 1.8 # CMU14
    range: 5.4 # CMU14: triple bile targeting range.
    checkCanAccess: false
  - type: EntityTargetAction
    targetCheckCanInteract: false
  - type: WorldTargetAction
    event: !type:Content.Shared._RMC14.Xenonids.Heatshield.XenoVomitBileActionEvent
  - type: XenoActionPlasma
    cost: 40
  - type: ActionBlockIfResting

