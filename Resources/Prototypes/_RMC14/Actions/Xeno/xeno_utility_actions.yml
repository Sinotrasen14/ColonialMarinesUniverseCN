- type: entity
  parent: ActionXenoBase
  id: ActionXenoApplySalve
  name: 使用药膏（200）
  description: 使用药膏，消耗你的一部分生命值，在5秒内为友方异形恢复最多100点生命值。你可以叠加多个药膏。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.5
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: apply_salve
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 2
  - type: EntityTargetAction
    event: !type:XenoApplySalveActionEvent
  - type: RMCDazeableAction
  - type: ActionBlockIfResting

- type: entity
  parent: ActionXenoBase
  id: ActionXenoSacrifice
  name: 牺牲
  description: 牺牲你的生命来治疗一位姐妹。[color=red]只有当你通过治疗姐妹将你转移的生命值补满后，你才会重生。[/color]
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: screech
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 1.5
  - type: EntityTargetAction
    event: !type:XenoSacrificeHealActionEvent
      componentsRemove:
      - type: RMCSlowdown
      - type: RMCSuperSlowdown
      - type: RMCRooted

