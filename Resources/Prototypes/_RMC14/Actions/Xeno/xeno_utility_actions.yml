- type: entity
  parent: ActionXenoBase
  id: ActionXenoLeader
  name: 选择/跟随异形领袖
  description: 晋升或降职异形领袖，或观察它们。将异形晋升为领袖会使其在自身周围释放你的信息素。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 3
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: xeno_lead
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:HiveLeaderActionEvent

