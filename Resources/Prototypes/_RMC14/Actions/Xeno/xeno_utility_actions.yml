- type: entity
  id: ActionXenoResinSurge
  parent: ActionXenoBase
  name: 树脂涌动（75）
  description: 使用时立即长出一颗果实（冷却时间与生长时间成正比），对杂草使用时生成临时墙，或对现有墙使用以6000点生命值强化它们15秒。瞄准其他任何目标时，会在短暂延迟后生成一片3x3的弱粘性树脂。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 10
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: gardener_resin_surge
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 7
    checkCanAccess: false
  - type: EntityTargetAction
    whitelist:
      components:
      - XenoConstruct
      - XenoFruit
      - XenoWeeds
  - type: WorldTargetAction
    event: !type:XenoResinSurgeActionEvent
  - type: XenoResinSurgeAction

- type: entity
  parent: ActionXenoBase
  id: ActionXenoRetrieve
  name: 拉回（180 等离子，100 狂怒）
  description: 若异形保持静止，则会在 0.6 秒的动作延迟后将其拉到你身边。除非巨型异形已被击倒，否则你无法将其拉回。
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: retrieve
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 7
  - type: EntityTargetAction
    event: !type:XenoRetrieveActionEvent
  - type: XenoActionPlasma
    cost: 180
  - type: XenoActionEnergy
    cost: 100
  - type: ActionCooldown
    cooldown: 10
  - type: ActionBlockIfResting

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoRetrieve
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    state: retrieve

- type: entity
  parent: ActionXenoBase
  id: ActionXenoAidHeal
  name: 协助异形治疗（100 等离子，100+ 生命储备）
  description: 治疗附近的一只友方异形。治疗另一只异形也会治疗你，并且你剩余生命储备的一半将被消耗，以提供额外治疗。[color=red]这无法治疗已着火的异形！[/color]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 10
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: warden_heal
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 1.5
  - type: EntityTargetAction
    event: !type:XenoAidActionEvent
  - type: XenoActionPlasma
    cost: 100
  - type: ActionBlockIfResting
  - type: ActionSharedCooldown
    id: ActionXenoAidHeal
    ids:
    - ActionXenoAidRejuvenate
    cooldown: 10
  - type: RMCDazeableAction

- type: entity
  parent: ActionXenoBase
  id: ActionXenoAidRejuvenate
  name: 援助异形复苏（100 等离子，100 生命储备）
  description: 移除远处友方异形身上的异常状态和眩晕。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 10
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: warden_rejuvenate
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 8
  - type: EntityTargetAction
    event: !type:XenoAidActionEvent
      aidType: Ailments
  - type: XenoActionPlasma
    cost: 100
  - type: ActionBlockIfResting
  - type: ActionSharedCooldown
    id: ActionXenoAidRejuvenate
    ids:
    - ActionXenoAidHeal
    cooldown: 10

