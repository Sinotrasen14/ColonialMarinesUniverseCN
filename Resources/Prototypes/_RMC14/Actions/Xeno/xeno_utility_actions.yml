- type: entity
  parent: ActionXenoBase
  id: ActionXenoFightOrFlight
  name: 战斗或逃跑（300 等离子，75 怒气）
  description: 移除你周围所有友方身上的异常状态和眩晕。若你在支付费用后拥有 75 点或以上怒气，则作用半径更大。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 45
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: screech
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoFightOrFlightActionEvent
  - type: XenoActionEnergy
    cost: 75
  - type: XenoActionPlasma
    cost: 300

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoFightOrFlight
  categories: [HideSpawnMenu]
  components:
