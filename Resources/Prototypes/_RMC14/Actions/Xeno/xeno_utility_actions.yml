  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoLeader
  name: 选择首领
  description: 提升或降级异形首领，或观察他们。将异形提升为首领会使他们在自身周围释放你的信息素。
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    state: xeno_lead

