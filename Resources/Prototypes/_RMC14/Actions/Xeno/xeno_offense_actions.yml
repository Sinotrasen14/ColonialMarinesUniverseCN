- type: entity
  parent: ActionXenoBase
  id: ActionXenoForTheHive
  name: 为了蜂巢！
  description: 激活自身，在20秒后引爆一场巨大的酸液爆炸。至少需要200点酸液。你的酸液储备越多，爆炸范围越大，伤害越高。它还会用酸液覆盖路障和怪物，范围等于伤害范围的一半。怪物离爆炸越远，受到的伤害越低。蓄力期间，你会被减速、外观发生变化，并发出响亮的哀嚎声。死亡会阻止爆炸触发，但如果成功，你将以幼虫形态在你所属蜂巢的蜂巢核心处重生；若没有蜂巢核心，则在你尸体处重生。在准备引爆期间使用此能力将取消爆炸，代价是消耗你四分之一酸液储备。
