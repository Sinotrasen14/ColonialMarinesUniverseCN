- type: entity
  id: CMGuidebookActionXenoBase
  abstract: true
  components:
  - type: Sprite
    sprite: _RMC14/Actions/xeno_actions.rsi

- type: entity
  id: ActionXenoPlantWeeds
  parent: ActionXenoBase
  name: 种植杂草（75）         # TODO RMC14 proper plasma costs
  description: 种下一个会蔓延更多杂草的杂草节点。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 1
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: plant_weeds
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoPlantWeedsActionEvent
  - type: SwappableAction
    swappedEventTemplate: !type:XenoExpandWeedsActionEvent
    originalEventTemplate: !type:XenoPlantWeedsActionEvent

- type: entity
  id: ActionXenoChooseStructure
  parent: ActionXenoBase
  name: 选择树脂结构
  description: "选择要用“分泌树脂”动作来分泌的结构。"
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: place_resin
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoChooseStructureActionEvent
  - type: XenoChooseConstructionAction
  - type: RMCDazeableAction

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoChooseResinStructure
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    state: place_resin

- type: entity
  id: ActionXenoSecreteStructure
  parent: ActionXenoBase
  name: 分泌树脂
  description: "建造通过“选择树脂结构”操作选择的结构。"
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: secrete_resin
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    deselectOnMiss: false
    range: 0
    repeat: true
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:XenoSecreteStructureActionEvent
  - type: XenoConstructionAction
    checkStructureSelected: true
    checkWeeds: true
    canUpgrade: true
  - type: XenoHiveInstantBuildAction
  - type: RMCDazeableAction

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoSecreteResin
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    state: secrete_resin

- type: entity
  id: ActionXenoCoerceResin
  parent: ActionXenoBase
  name: 强制树脂
  description: "建造通过“选择树脂结构”动作选定的结构。如果你位于杂草上，也可以在视野范围内建造。"
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: secrete_resin
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    deselectOnMiss: false
    range: 0
    repeat: true
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:XenoSecreteStructureActionEvent
  - type: XenoConstructionAction
    checkStructureSelected: true
    checkWeeds: true
    canUpgrade: false
  - type: XenoHiveInstantBuildAction
  - type: RMCDazeableAction

- type: entity
  id: ActionXenoOrderConstruction
  parent: ActionXenoBase
  name: 下令建造
  description: 开始建造一个重要的蜂巢结构。
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: morph_resin
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoOrderConstructionActionEvent
  - type: RMCDazeableAction

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoOrderConstruction
  name: 下令建造
  description: 开始建造重要的蜂巢结构。
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    state: morph_resin

- type: entity
  id: ActionXenoResinHole
  parent: ActionXenoBase
  name: 植物树脂孔（200）
  description: 在杂草上放置一个树脂孔。它可以用锅炉气体、酸或寄生虫填充。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 1
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: place_trap
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoPlaceResinHoleActionEvent
  - type: RMCDazeableAction

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoPlantResinHole
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    state: place_trap

# For gardener drone
- type: entity
  id: ActionXenoFruitChoose
  parent: ActionXenoBase
  name: 更换水果
  description: 选择一种要使用“种植树脂水果”动作种植的水果。
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: gardener_plant_pick
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoFruitChooseActionEvent
  - type: XenoFruitChooseAction

- type: entity
  id: ActionXenoFruitPlant
  parent: ActionXenoBase
  name: 种植树脂果实（100）
  description: 将选定的树脂果实种植在杂草上，代价是生命值和血浆。异形可以在这些果实成熟后采摘，你也可以提前采摘一株植物以将其清除。异形可以将其拿在手中使用，或放在地上吃掉以获得其效果。也可以将它们用在其他异形身上来喂食。你一次最多只能种植和采摘6个果实。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 5
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: gardener_plant
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoFruitPlantActionEvent

- type: entity
  id: ActionXenoPlantWeedsHardy
  parent: ActionXenoBase
  name: 种植坚韧杂草（125）             # TODO RMC14 proper plasma costs
  description: 种植一个杂草节点，它会传播更坚韧的杂草，这些杂草结果实速度提高25%，生命值略高，并且可以蔓延到一些普通杂草无法生长的表面上。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 120
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: plant_gardener_weeds
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoPlantWeedsActionEvent
      plasmaCost: 125
      prototype: XenoHardyWeedsSource

# For healer drone
- type: entity
  id: ActionXenoFruitPlantLesser
  parent: ActionXenoFruitPlant
  name: 种植树脂果实（50）
  description: 以生命值和血浆为代价，在杂草上种植树脂果实。
  components:
  - type: InstantAction
    event: !type:XenoFruitPlantActionEvent
      plasmaCost: 50

- type: entity
  id: ActionXenoDigTunnel
  parent: ActionXenoBase
  name: 挖掘隧道（200）
  description: 挖掘一条隧道，用于在蜂巢中快速运输。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 300
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: build_tunnel
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:XenoDigTunnelActionEvent

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoDigTunnel
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    state: build_tunnel

# For lesser drone
- type: entity
  parent: ActionXenoPlantWeeds
  id: ActionLesserDronePlantWeeds
  components:
  - type: InstantAction
    event: !type:XenoPlantWeedsActionEvent
      limitDistance: true

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoPlantWeeds
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    state: plant_weeds

- type: entity
  parent: ActionXenoBase
  id: ActionXenoExpandWeeds
  name: 扩展杂草（50）          # TODO RMC14 proper plasma costs
  description: 扩展现有杂草，或将杂草地块变为节点。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.5
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: plant_weeds
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    checkCanAccess: false
    range: -1
    deselectOnMiss: false
  - type: WorldTargetAction
    event: !type:XenoExpandWeedsActionEvent

- type: entity
  id: ActionXenoDesignerSelectedDesign
  parent: ActionXenoBase
  name: 所选设计
  description: 切换新放置的设计节点是墙节点还是门节点。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.2
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/designer_actions.rsi
      state: design_mark_wall
      map: ["enum.ActionVisuals.Icon"]
    - sprite: _RMC14/Actions/designer_actions.rsi
      state: design_mark_door
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:Content.Shared._RMC14.Xenonids.Designer.DesignerSelectedDesignToggleActionEvent
  - type: RMCDazeableAction

- type: entity
  id: ActionXenoDesignerGreaterResinSurge
  parent: ActionXenoBase
  name: 强效树脂涌动（250）
  description: 消耗附近的设计节点，以制造临时的反射树脂墙。
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 30
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/designer_actions.rsi
      state: greater_resin_surge
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:Content.Shared._RMC14.Xenonids.Designer.DesignerGreaterResinSurgeActionEvent
  - type: RMCDazeableAction
