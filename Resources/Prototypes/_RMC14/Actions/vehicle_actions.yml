- type: entity
  id: ActionVehicleToggleView
  parent: BaseAction
  name: 切换视图
  description: 在室内和室外视角之间切换。
  components:
  - type: InstantAction
    event: !type:VehicleToggleViewActionEvent
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    layers:
    - texture: Interface/Actions/eyeopen.png
      map: ["enum.ActionVisuals.Icon"]
    - texture: Interface/Actions/eyeclose.png
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false

- type: entity
  id: ActionVehicleDeploy
  name: 部署车辆
  description: 展开或收回车辆。
  components:
  - type: InstantAction
    event: !type:VehicleDeployActionEvent
  - type: Action
    itemIconStyle: BigItem

- type: entity
  id: ActionVehicleLock
  parent: BaseAction
  name: 切换车辆锁
  description: 锁上或解锁车辆进门门。
  components:
  - type: InstantAction
    event: !type:VehicleLockActionEvent
  - type: Action
    itemIconStyle: BigItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/id_lock_actions.rsi
      state: id_lock_unlocked
      map: ["enum.ActionVisuals.Icon"]
    - sprite: _RMC14/Actions/id_lock_actions.rsi
      state: id_lock_locked
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false

- type: entity
  id: ActionVehicleSelectHardpoint
  name: 选择挂点
  description: 选择这个挂载来开火。
  components:
  - type: InstantAction
    event: !type:VehicleHardpointSelectActionEvent
  - type: Action
    autoPopulate: false
    temporary: false
    raiseOnUser: true
    itemIconStyle: BigItem
- type: entity
  id: ActionVehicleMaintenance
  parent: BaseAction
  name: 切换维护模式
  description: 关闭引擎并锁定武器以打开维修面板，或者关闭面板返回战斗。打开的面板会让坦克变得脆弱。
  components:
  - type: Action
    itemIconStyle: BigItem
    raiseOnUser: true
  - type: InstantAction
    event: !type:VehicleMaintenanceActionEvent
  - type: Sprite
    sprite: Objects/Tools/wrench.rsi
    state: icon
