- type: entity
  parent: ActionMarineBase
  id: ActionMarineFocus
  name: 下达命令：专注
  description: 提高附近陆战队员的枪械精准度。
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/marine_actions.rsi
      state: focus
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:FocusActionEvent

- type: entity
  parent: ActionMarineBase
  id: ActionMarineHold
  name: 下达命令 - 坚守
  description: 增加附近陆战队员的伤害抗性。
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/marine_actions.rsi
      state: hold
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:HoldActionEvent

- type: entity
  id: ActionMarineMove
  parent: ActionMarineBase
  name: 下达命令 - 移动
  description: 提高附近陆战队员的移动速度。[color=red]这对任何没有护甲的单位都无效！[/color]
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/marine_actions.rsi
      state: move
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:MoveActionEvent
