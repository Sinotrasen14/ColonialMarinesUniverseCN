- type: entity
  abstract: true
  parent: ActionMarineBase
  id: RMCActionCassetteBase
  components:
  - type: Action
    useDelay: 0.5

- type: entity
  parent: RMCActionCassetteBase
  id: RMCActionCassettePlayPause
  name: 播放/暂停
  description: 开始或停止播放音乐。
  components:
  - type: Action
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/cassette_player.rsi
      state: walkman_playpause
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:CassettePlayPauseActionEvent

- type: entity
  parent: RMCActionCassetteBase
  id: RMCActionCassetteNext
  name: 下一首歌曲
  description: 移动到下一首歌曲。
  components:
  - type: Action
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/cassette_player.rsi
      state: walkman_next
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:CassetteNextActionEvent

- type: entity
  parent: RMCActionCassetteBase
  id: RMCActionCassetteRestart
  name: 重新播放歌曲
  description: 重新开始播放当前曲目。
  components:
  - type: Action
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/cassette_player.rsi
      state: walkman_restart
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:CassetteRestartActionEvent
