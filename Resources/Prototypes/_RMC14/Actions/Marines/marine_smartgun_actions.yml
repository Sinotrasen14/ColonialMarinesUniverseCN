- type: entity
  abstract: true
  parent: ActionMarineBase
  id: ActionMarineToggleable
  components:
  - type: Action
    backgroundOn:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: template_on_big
    itemIconStyle: NoItem

- type: entity
  id: RMCGuidebookActionSmartGunBase
  abstract: true
  components:
  - type: Sprite
    sprite: _RMC14/Actions/marine_smart_gun_actions.rsi

- type: entity
  parent: ActionMarineBase
  id: RMCActionToggleAmmo
  name: 切换弹药类型
  description: 切换这把枪发射的弹药类型。[color=red]你可以按下枪械专属动作键位来激活，默认是空格键！[/color]
  components:
  - type: Action
    useDelay: 0.25
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/marine_smart_gun_actions.rsi
      state: ammo_swap_normal
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:GunToggleAmmoActionEvent

- type: entity
  parent: ActionMarineToggleable
  id: RMCActionToggleRecoil
  name: 切换后坐力补偿
  description: 使用此枪射击时消除所有后坐力。
  components:
  - type: Action
    useDelay: 0.25
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/marine_smart_gun_actions.rsi
      state: recoil_compensation
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:GunToggleRecoilActionEvent

- type: entity
  parent: ActionMarineToggleable
  id: RMCActionToggleAutoFire
  name: 切换自动射击
  description: 每隔几秒自动朝目标射击一次。
  components:
  - type: Action
    useDelay: 0.25
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/marine_smart_gun_actions.rsi
      state: autofire
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:GunToggleableAutoFireActionEvent

- type: entity
  parent: ActionMarineToggleable
  id: RMCActionToggleFarSight
  name: 切换远视
  description: 让你能看得稍微远一些。
  components:
  - type: Action
    useDelay: 0.25
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/marine_smart_gun_actions.rsi
      state: far_sight
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:FarSightActionEvent

- type: entity
  parent: ActionMarineToggleable
  id: RMCActionToggleMotionDetector
  name: 切换运动探测器
  description: 定期探测你附近的任何未知移动。
  components:
  - type: Action
    useDelay: 0.25
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/marine_smart_gun_actions.rsi
      state: motion_detector
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ToggleableMotionDetectorActionEvent

# Guidebook
- type: entity
  parent: RMCGuidebookActionSmartGunBase
  id: RMCGuidebookActionIFF
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    state: iff_toggle_on

- type: entity
  parent: RMCGuidebookActionSmartGunBase
  id: RMCGuidebookActionMotionDetector
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    state: motion_detector
