- type: entity
  abstract: true
  id: VehicleSPPTankInteriorBase
  name: UPP坦克内部装饰件
  description: UPP坦克的内部装饰件。
  placement:
    mode: PlaceFree
  components:
  - type: Tag
    tags:
    - HideContextMenu
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/spptank.rsi
    drawdepth: Walls
  - type: InteractionTransparency

- type: entity
  abstract: true
  id: VehicleSPPTankChassisBase
  name: UPP坦克内部底盘
  description: UPP坦克内部底盘的一个底盘段。
  placement:
    mode: PlaceFree
  components:
  - type: Tag
    tags:
    - HideContextMenu
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/spptank_chassis.rsi
    drawdepth: FloorTiles
  - type: InteractionTransparency

- type: entity
  parent: VehicleSPPTankChassisBase
  id: VehicleSPPTankChassis
  components:
  - type: Sprite
    state: spptank_chassis

- type: entity
  parent: VehicleSPPTankChassisBase
  id: VehicleSPPTankChassisAlt
  components:
  - type: Sprite
    state: spptank_chassis1

- type: entity
  abstract: true
  parent: VehicleSPPTankInteriorBase
  id: VehicleSPPTankWallBase
  placement:
    mode: PlaceFree
  components:
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Occluder
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 20000
        hard: true
        mask:
        - FullTileMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - Opaque
        - InteractImpassable

- type: entity
  abstract: true
  parent: VehicleSPPTankWallBase
  id: VehicleSPPTankDoorBase
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: RemoveComponents
    components:
    - type: InteractionTransparency

- type: entity
  parent: VehicleSPPTankDoorBase
  id: VehicleSPPTankHatch
  components:
  - type: Sprite
    state: hatch

- type: entity
  parent: VehicleSPPTankHatch
  id: VehicleSPPTankExitHatch
  components:
  - type: RemoveComponents
    components:
    - type: Fixtures
    - type: Occluder
    - type: Tag
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: VehicleExit
  - type: RMCIgnoreGhostInteractionLimits

- type: entity
  parent: VehicleSPPTankInteriorBase
  id: VehicleSPPTankProp0
  components:
  - type: Sprite
    state: prop0

- type: entity
  abstract: true
  parent: CMClosetBase
  id: VehicleSPPTankLockerBase
  name: UPP坦克储物柜
  description: 用于UPP坦克内部的储物柜。
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/spptank.rsi
    drawdepth: Walls
    layers:
    - state: locker
      map: ["enum.StorageVisualLayers.Base"]
    - state: locker
      map: ["enum.StorageVisualLayers.Door"]
  - type: EntityStorageVisuals
    stateBaseClosed: locker
    stateBaseOpen: locker_open
    stateDoorClosed:
    stateDoorOpen:

- type: entity
  parent: VehicleSPPTankLockerBase
  id: VehicleSPPTankLocker
  name: UPP 储罐柜

- type: entity
  abstract: true
  parent: CMClosetBase
  id: VehicleSPPTankSmallLockerBase
  name: UPP坦克小型储物柜
  description: 用于UPP坦克内部的小型储物柜。
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/spptank.rsi
    drawdepth: Walls
    layers:
    - state: small_locker
      map: ["enum.StorageVisualLayers.Base"]
    - state: small_locker
      map: ["enum.StorageVisualLayers.Door"]
  - type: EntityStorageVisuals
    stateBaseClosed: small_locker
    stateBaseOpen: small_locker_open
    stateDoorClosed:
    stateDoorOpen:

- type: entity
  parent: VehicleSPPTankSmallLockerBase
  id: VehicleSPPTankSmallLocker
  name: UPP储罐小型储物柜

- type: entity
  abstract: true
  parent: CMClosetBase
  id: VehicleSPPTankSmallLockerAltBase
  name: UPP坦克小型储物柜（备选）
  description: UPP坦克内部备选的小型储物柜。
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/spptank.rsi
    drawdepth: Walls
    layers:
    - state: small_locker1
      map: ["enum.StorageVisualLayers.Base"]
    - state: small_locker1
      map: ["enum.StorageVisualLayers.Door"]
  - type: EntityStorageVisuals
    stateBaseClosed: small_locker1
    stateBaseOpen: small_locker1_open
    stateDoorClosed:
    stateDoorOpen:

- type: entity
  parent: VehicleSPPTankSmallLockerAltBase
  id: VehicleSPPTankSmallLockerAlt
  name: UPP 坦克小型储物柜（备用）

- type: entity
  abstract: true
  parent: CMClosetBase
  id: VehicleSPPTankAmmoStorageBase
  name: UPP坦克弹药储存
  description: UPP坦克内部的弹药储存。
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/spptank.rsi
    drawdepth: Walls
    layers:
    - state: storage_ammo
      map: ["enum.StorageVisualLayers.Base"]
    - state: storage_ammo
      map: ["enum.StorageVisualLayers.Door"]
  - type: EntityStorageVisuals
    stateBaseClosed: storage_ammo
    stateBaseOpen: storage_ammo_open
    stateDoorClosed:
    stateDoorOpen:

- type: entity
  parent: VehicleSPPTankAmmoStorageBase
  id: VehicleSPPTankAmmoStorage
  name: UPP坦克弹药储存

- type: entity
  parent: VehicleInteriorWallMountedBase
  id: VehicleSPPTankAmmoLoader
  name: UPP坦克弹药装填器
  description: 用于UPP坦克挂载点弹药的装填器。
  components:
  - type: Sprite
    drawdepth: BelowMobs
    sprite: _RMC14/Structures/Vehicles/Interiors/spptank.rsi
    state: weapons_loader
  - type: VehicleAmmoLoader
  - type: UserInterface
    interfaces:
      enum.VehicleAmmoLoaderUiKey.Key:
        type: VehicleAmmoLoaderBoundUserInterface
  - type: RemoveComponents
    components:
    - type: Tag
