- type: entity
  parent: VehicleTankHardpointBase
  id: VehicleTankFlamer # CMU14
  name: 坦克喷火器
  description: 坦克上安装的喷火器挂载点。
  components:
  - type: Sprite
    state: flamer
  - type: HardpointItem
    hardpointType: Launcher
    vehicleFamily: Tank
    slotType: Launcher
    damageMultiplier: 0.0
    repairRate: 0.0125
  - type: HardpointIntegrity
    maxIntegrity: 300
    integrity: 300
  - type: VehicleTurretAttachment
  - type: VehicleTurret
    useBarrelDirectionForShots: true
    fireWhileRotatingGraceDegrees: 180
    offsetRotatesWithTurret: true
    useDirectionalOffsets: true
    pixelOffsetNorth: "0,-10"
    pixelOffsetEast: "-10,0"
    pixelOffsetSouth: "0,10"
    pixelOffsetWest: "10,0"
    showOverlay: true
    overlayRsi: _RMC14/Structures/Vehicles/tank.rsi
    overlayState: flamer_0
  - type: GunUseGunOrigin
  - type: GunIgnoreContainerOwnerCollision
  - type: GunIgnorePrediction
  - type: Gun
    fireRate: 1.0
    projectileSpeed: 20
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/_RMC14/Weapons/Guns/Flamer/gun_flamethrower2.ogg
    cameraRecoilScalar: 0
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 4
    accuracyMultiplierUnwielded: 4
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 100
        reagents:
        - ReagentId: RMCNapalmUTTank
          Quantity: 100
  - type: RMCFlamerAmmoProvider
  - type: RMCFlamerTank
    maxIntensity: 30
    maxDuration: 20
    maxRange: 9
    reagentWhitelist:
    - RMCNapalmUTTank
  - type: RMCFlushableSolution
    solution: rmc_flamer_tank
    flushTime: 1.5
  - type: NoMixingReagents
  - type: GunFireArc
    arc: 120
  - type: GunMuzzleOffset
    offset: "0,0"
    useDirectionalOffsets: true
    offsetEast: "0,0.2"
    offsetSouth: "-0.45,0.3"
    offsetWest: "0.1,0.9"
    offsetNorth: "0.45,0.2"
    muzzleOffset: "0,-0.5"
    useAimDirection: true
    useContainerOwner: false
  - type: HardpointVisual
    vehicleState: flamer_0
    damagedVehicleState: flamer_1

