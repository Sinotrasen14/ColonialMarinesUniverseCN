- type: entity
  parent: BaseItem
  id: VehicleTankHardpointBase
  abstract: true
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/hardpoints/tank.rsi
  - type: Item
    size: Large
  - type: PowerLoaderGrabbable
  - type: RemoveComponents
    components:
    - type: Pullable

- type: entity
  parent: VehicleTankHardpointBase
  id: VehicleTankTurret
  name: 坦克炮塔
  description: 坦克炮塔挂载点。
  components:
  - type: HardpointState
  - type: ContainerContainer
    containers:
      turret-cannon: !type:ContainerSlot
        ent:
        showEnts: false
        occludes: true
      turret-launcher: !type:ContainerSlot
        ent:
        showEnts: false
        occludes: true
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/tank.rsi
    state: tank_turret_0
  - type: HardpointItem
    hardpointType: Turret
    vehicleFamily: Tank
    slotType: Turret
    damageMultiplier: 0.05
    repairRate: 0.008
  - type: HardpointIntegrity
    maxIntegrity: 450
    integrity: 450
  - type: VehicleTurret
    rotateToCursor: true
    stabilizedRotation: false
    rotationSpeed: 80
    showOverlay: true
    overlayRsi: _RMC14/Structures/Vehicles/tank.rsi
    overlayState: tank_turret_0
    overlayDamagedState: tank_turret_1
    useDirectionalOffsets: false
    pixelOffsetNorth: "0,-10"
    pixelOffsetEast: "-10,0"
    pixelOffsetSouth: "0,10"
    pixelOffsetWest: "10,0"
  - type: ItemSlots
    slots:
      turret-cannon:
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      turret-launcher:
        disableEject: true
        whitelist:
          components:
          - HardpointItem
  - type: HardpointSlots
    vehicleFamily: Tank
    slots:
    - id: turret-cannon
      hardpointType: Cannon
      slotType: Cannon
      required: false
      insertDelay: 2.0
    - id: turret-launcher
      hardpointType: Launcher
      slotType: Launcher
      required: false
      insertDelay: 2.0

- type: entity
  parent: VehicleTankHardpointBase
  id: VehicleTankTurretTWE
  name: 不当的 TBA3“Vandeleur”炮塔
  description: TBA3“Vandeleur”炮塔由维兰德-汤谷开发，作为FV150“Hobelar”轻型骑兵坦克“B”升级包的一部分。Vandeleur是原始FV150-A炮塔的直接演进，改进了内部系统和模块化设计。它可快速、轻松地安装多种武器系统，并配备内置干扰弹发射系统。
  components:
  - type: HardpointState
  - type: ContainerContainer
    containers:
      turret-cannon: !type:ContainerSlot
        ent:
        showEnts: false
        occludes: true
      turret-launcher: !type:ContainerSlot
        ent:
        showEnts: false
        occludes: true
  - type: Sprite
    sprite: CMU14/Structures/vehicles/fv150/exterior.rsi
    state: tank_turret_0
  - type: HardpointItem
    hardpointType: Turret
    vehicleFamily: Tank
    slotType: Turret
    damageMultiplier: 0.05
    repairRate: 0.008
  - type: HardpointIntegrity
    maxIntegrity: 450
    integrity: 450
  - type: VehicleTurret
    rotateToCursor: true
    stabilizedRotation: false
    rotationSpeed: 95
    showOverlay: true
    overlayRsi: CMU14/Structures/vehicles/fv150/exterior.rsi
    overlayState: tank_turret_0
    overlayDamagedState: tank_turret_1
    useDirectionalOffsets: false
    pixelOffsetNorth: "0,-10"
    pixelOffsetEast: "-10,0"
    pixelOffsetSouth: "0,10"
    pixelOffsetWest: "10,0"
  - type: ItemSlots
    slots:
      turret-cannon:
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      turret-launcher:
        disableEject: true
        whitelist:
          components:
          - HardpointItem
  - type: HardpointSlots
    vehicleFamily: Tank
    slots:
    - id: turret-cannon
      hardpointType: Cannon
      slotType: Cannon
      required: false
      insertDelay: 2.0
    - id: turret-launcher
      hardpointType: Launcher
      slotType: Launcher
      required: false
      insertDelay: 2.0

