  - type: RemoveComponents
    components:
    - type: PowerLoaderGrabbable
- type: entity
  parent: VehicleTankHardpointBase
  id: VehicleTankReinforcedTreads # CMU14
  name: 强化坦克履带
  description: 更重的坦克履带拥有更好的耐久性和耐酸性，但会牺牲加速度。
  components:
  - type: Sprite
    state: treads
  - type: HardpointItem
    damageRegion: Sides
    hardpointType: Wheel
    vehicleFamily: Tank
    slotType: Treads
    damageMultiplier: 0.15
    repairRate: 0.0165
  - type: VehicleWheelItem
  - type: HardpointIntegrity
    maxIntegrity: 500
    integrity: 500
  - type: HardpointDamageModifier
    modifierSets:
    - VehicleArmorCaustic
  - type: VehicleAccelerationModifierAttachment
    accelerationMultiplier: 0.6
  - type: RemoveComponents
    components:
    - type: PowerLoaderGrabbable
