- type: entity
  parent: VehicleTankHardpointBase
  id: VehicleTankTreads # CMU14
  name: 坦克履带
  description: 重型坦克履带。
  components:
  - type: Sprite
    state: treads
  - type: HardpointItem
    damageRegion: Sides
    hardpointType: Wheel
    vehicleFamily: Tank
    slotType: Treads
    damageMultiplier: 0.15
    repairRate: 0.0165
  - type: HardpointIntegrity
    maxIntegrity: 300
    integrity: 300
  - type: VehicleWheelItem
  - type: RemoveComponents
    components:
    - type: PowerLoaderGrabbable
- type: entity
  parent: VehicleTankHardpointBase
  id: VehicleTankTreadsTWE # CMU14
  name: 坦克履带
  description: 重型坦克履带。
  components:
  - type: Sprite
    sprite: CMU14/Structures/vehicles/fv150/icons.rsi
    state: treads
  - type: HardpointItem
    damageRegion: Sides
    hardpointType: Wheel
    vehicleFamily: Tank
    slotType: Treads
    damageMultiplier: 0.15
    repairRate: 0.0165
  - type: HardpointIntegrity
    maxIntegrity: 300
    integrity: 300
