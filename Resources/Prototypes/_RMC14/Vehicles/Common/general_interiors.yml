- type: entity
  abstract: true
  parent: RMCExtinguisherCabinet
  id: VehicleInteriorExtinguisherCabinetBase
  name: 车内灭火器柜
  description: 壁挂式车内灭火器柜
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/general.rsi
    drawdepth: Overdoors
    layers:
    - state: extinguisher
    - state: extinguisher_full
      map: ["enum.ItemCabinetVisuals.Layer"]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.ItemCabinetVisuals.ContainsItem:
        enum.ItemCabinetVisuals.Layer:
          true: {state: extinguisher_full}
          false: {state: extinguisher_empty}
      enum.OpenableVisuals.Opened:
        enum.ItemCabinetVisuals.Layer:
          true: {visible: true}
          false: {visible: false}

- type: entity
  parent: VehicleInteriorExtinguisherCabinetBase
  id: VehicleInteriorExtinguisher
  name: 室内灭火器
  components:
  - type: ContainerFill
    containers:
      ItemCabinet:
      - CMFireExtinguisher

- type: entity
  parent: VehicleInteriorExtinguisherCabinetBase
  id: VehicleInteriorExtinguisherClosed
  name: 内部灭火器（关闭）
  components:
  - type: ContainerFill
    containers:
      ItemCabinet:
      - CMFireExtinguisher

- type: entity
  parent: VehicleInteriorExtinguisherCabinetBase
  id: VehicleInteriorExtinguisherFull
  name: 内部灭火器（满）
  components:
  - type: Openable
    opened: true
  - type: ContainerFill
    containers:
      ItemCabinet:
      - CMFireExtinguisher

- type: entity
  parent: VehicleInteriorExtinguisherCabinetBase
  id: VehicleInteriorExtinguisherMini
  name: 内部灭火器（迷你）
  components:
  - type: Openable
    opened: true
  - type: ContainerFill
    containers:
      ItemCabinet:
      - CMFireExtinguisherPortable
  - type: Sprite
    layers:
    - state: extinguisher
    - state: extinguisher_mini
      map: ["enum.ItemCabinetVisuals.Layer"]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.ItemCabinetVisuals.ContainsItem:
        enum.ItemCabinetVisuals.Layer:
          true: {state: extinguisher_mini}
          false: {state: extinguisher_empty}
      enum.OpenableVisuals.Opened:
        enum.ItemCabinetVisuals.Layer:
          true: {visible: true}
          false: {visible: false}

- type: entity
  parent: VehicleInteriorExtinguisherCabinetBase
  id: VehicleInteriorExtinguisherEmpty
  name: 内置灭火器（空）
  components:
  - type: Openable
    opened: true

