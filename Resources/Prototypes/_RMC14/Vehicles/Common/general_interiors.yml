- type: entity
  parent: VehicleInteriorGeneralBase
  id: VehicleInvisibleWall
  name: 隐形墙（阻挡视线）
  description: 用于车辆内部的隐形阻挡墙。
  placement:
    mode: PlaceFree
  components:
  - type: Marker
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Occluder
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 20000
        hard: true
        mask:
        - FullTileMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - Opaque
  - type: Sprite
    sprite: _RMC14/Markers/landmarks.rsi
    state: invisible_wall
    drawdepth: Overdoors

- type: entity
  parent: VehicleInteriorGeneralBase
  id: VehicleInvisibleWallNoVision
  name: 隐形墙（不阻挡视野）
  description: 用于车辆内部的隐形阻挡墙，不会阻挡视野或光线。
  placement:
    mode: PlaceFree
  components:
  - type: Marker
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 20000
        hard: true
        mask:
        - FullTileMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
  - type: Sprite
    sprite: _RMC14/Markers/landmarks.rsi
    state: invisible_wall
    drawdepth: Overdoors

