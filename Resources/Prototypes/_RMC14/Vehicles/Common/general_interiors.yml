- type: entity
  abstract: true
  id: VehicleInteriorGeneralBase
  name: 车辆内饰件
  description: 一种装饰性车辆内饰固定装置。
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/general.rsi
    drawdepth: Overdoors
  - type: InteractionOutline
  - type: Clickable
  - type: InteractionTransparency

- type: entity
  abstract: true
  parent: VehicleInteriorGeneralBase
  id: VehicleInteriorWallMountedBase
  name: 车辆内饰壁挂件
  description: 一种壁挂式车辆内饰固定装置。
  placement:
    mode: PlaceFree
  components:
  - type: WallMount
    arc: 360

- type: entity
  abstract: true
  parent: CMClosetBase
  id: VehicleInteriorLockerBase
  name: 车内储物柜
  description: 用于车辆内部的储物柜。
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/general.rsi
    drawdepth: Overdoors
    layers:
    - state: locker
      map: ["enum.StorageVisualLayers.Base"]
    - state: locker
      map: ["enum.StorageVisualLayers.Door"]
  - type: EntityStorageVisuals
    stateBaseClosed: locker
    stateBaseOpen: locker_open
    stateDoorClosed:
    stateDoorOpen:

- type: entity
  parent: VehicleInteriorWallMountedBase
  id: VehicleAmmoLoader
  name: 载具弹药装填器
