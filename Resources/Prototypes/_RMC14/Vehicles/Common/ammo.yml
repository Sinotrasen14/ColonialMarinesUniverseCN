- type: entity
  parent: VehicleAmmoBoxBase
  id: VehicleAmmoBoxLTBCannon
  name: LTB碎甲炮弹
  description: 轻型坦克炮的弹药。一种碎甲弹，会在起爆前将塑性炸药拍贴在目标上，使强烈的冲击波传入装甲。对结构造成出色伤害，爆炸威力适中，且能摧毁墙壁，但无需穿透即可发挥作用。
  components:
  - type: Sprite
    sprite: CMU14/Structures/vehicles/ammo/vehicles.rsi
    layers:
    - state: lbtshell_hesh
      map: ["enum.BulletBoxLayers.Fill"]
  - type: GenericVisualizer
    visuals:
      enum.BulletBoxLayers.Fill:
        enum.BulletBoxLayers.Fill:
          Empty: {state: lbtshell_casing, visible: true}
          Full: {state: lbtshell_hesh, visible: true}
  - type: BulletBox
    amount: 1
    max: 1
    bulletType: VehicleAmmoBoxLTBCannon
    ammoProto: VehicleCartridgeLTBCannon
    usedIn: Tank LTB cannon

