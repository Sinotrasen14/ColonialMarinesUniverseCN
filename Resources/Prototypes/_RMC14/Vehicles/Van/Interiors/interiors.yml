- type: entity
  abstract: true
  id: VehicleVanRoofBase
  name: 厢式车内部车顶
  description: 厢式车内部的可拆卸车顶部分。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/van.rsi
    drawdepth: Overdoors
    layers:
    - state: roof_1
      map: ["roof"]
  - type: InteractionTransparency
  - type: RMCSpriteFade
    targetAlpha: 0.35
    changeRate: 4.0
    reactToMouse: false
    fadeOnSharedGrid: true
    fadeLayers:
    - "roof"

  - type: Tag
    tags:
    - HideContextMenu
- type: entity
  parent: VehicleVanRoofBase
  id: VehicleVanRoof1
  name: 厢式车车顶 1
  components:
