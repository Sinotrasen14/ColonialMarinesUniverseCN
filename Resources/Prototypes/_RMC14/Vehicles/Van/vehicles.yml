      state: damaged_frame
      visible: false
    - map: [secondary]
      state: SECONDARY
      visible: false
    - map: [rmc-wheels]
      state: wheels_1
  - type: VehicleHardpointVisuals
    layers:
    - state: ""
      layer: secondary
  - type: ItemSlots
    slots:
      secondary:
        startingItem: VehicleSPPVanTurret
        disableEject: true
        whitelist:
          components:
          - HardpointItem
  - type: HardpointSlots
    vehicleFamily: Van
    slots:
    - id: secondary
      disableEject: true
      hardpointType: Secondary
      slotType: Launcher
      compatibilityId: SPPVan
      visualLayer: secondary
      insertDelay: 2.0
      required: false
    - id: wheel-1
      disableEject: true
      hardpointType: Wheel
      slotType: Wheel
      compatibilityId: SPPVan
      insertDelay: 1.5
  - type: VehicleEnter
    interiorPath: /Maps/_RMC14/Vehicles/spp_van_armed_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 8
    maxXenos: 2
    entryPoints:
    - offset: 0,1.5
      radius: 0.8
      interiorCoords: 0.35,0.25
    - offset: 1.2,-0.3
      radius: 0.7
      interiorCoords: 2.5,0.9
    - offset: -1.2,-0.3
      radius: 0.7
      interiorCoords: 2.5,-0.2

