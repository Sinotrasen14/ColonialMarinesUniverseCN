- type: entity
  abstract: true
  id: VehicleHumveeInteriorBase
  name: 悍马车内饰件
  description: 用于悍马车的装饰性内饰件。
  placement:
    mode: PlaceFree
  components:
  - type: Tag
    tags:
    - HideContextMenu
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/general_humvee.rsi
    drawdepth: Overdoors
  - type: InteractionTransparency

- type: entity
  abstract: true
  id: VehicleHumveeChassisBase
  name: 悍马内部底盘
  description: 悍马内部底盘的一段。
  placement:
    mode: PlaceFree
  components:
  - type: Tag
    tags:
    - HideContextMenu
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/humvee_chassis.rsi
    drawdepth: FloorTiles
  - type: InteractionTransparency

- type: entity
  parent: VehicleHumveeChassisBase
  id: VehicleHumveeChassis
  components:
  - type: Sprite
    state: humvee_chassis

- type: entity
  parent: VehicleHumveeChassisBase
  id: VehicleHumveeChassisMedical
  components:
  - type: Sprite
    state: humvee_chassis_medical

- type: entity
  parent: VehicleHumveeChassisBase
  id: VehicleHumveeChassisTransport
  components:
  - type: Sprite
    state: humvee_chassis_transport

- type: entity
  abstract: true
  parent: VehicleHumveeInteriorBase
  id: VehicleHumveeWallBase
  placement:
    mode: PlaceFree
  components:
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Occluder
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 20000
        hard: true
        mask:
        - FullTileMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - Opaque
        - InteractImpassable

- type: entity
  abstract: true
  parent: VehicleHumveeInteriorBase
  id: VehicleHumveeRoofBase
  name: 悍马车内顶棚
  description: 用于悍马车内顶棚的可拆卸顶板。
  placement:
    mode: PlaceFree
  components:
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/general_humvee.rsi
    drawdepth: Overdoors
  - type: InteractionTransparency
  - type: RMCSpriteFade
    targetAlpha: 0.35
    changeRate: 4.0
    reactToMouse: false
    fadeOnSharedGrid: true
    fadeLayers:
    - "roof"

- type: entity
  abstract: true
  parent: VehicleHumveeInteriorBase
  id: VehicleHumveeDoorBase
  placement:
    mode: PlaceFree
  components:
  - type: Sprite
    drawdepth: Items
  - type: Clickable
  - type: InteractionOutline
  - type: RemoveComponents
    components:
    - type: InteractionTransparency

- type: entity
  parent: VehicleHumveeInteriorBase
  id: VehicleHumveeSeatDestroyed
  name: 悍马座椅（损坏）
  components:
  - type: Sprite
    state: car_seat_destroyed

- type: entity
  parent: VehicleHumveeWallMountedBase
  id: VehicleHumveeAmmoLoader
  name: 悍马弹药装填器
  description: 用于悍马挂载点弹药的装填器。
  components:
  - type: Sprite
    state: weapons_loader
    drawdepth: BelowMobs
  - type: Clickable
  - type: InteractionOutline
  - type: RemoveComponents
    components:
    - type: InteractionTransparency
    - type: Tag
  - type: VehicleAmmoLoader
  - type: UserInterface
    interfaces:
      enum.VehicleAmmoLoaderUiKey.Key:
        type: VehicleAmmoLoaderBoundUserInterface

- type: entity
  parent: VehicleHumveeRoofBase
  id: VehicleHumveeExitDoor
  components:
  - type: Sprite
    layers:
    - state: exit_door
      map: ["roof"]
  - type: Clickable
  - type: InteractionOutline
  - type: RemoveComponents
    components:
    - type: InteractionTransparency
    - type: Tag
  - type: VehicleExit
  - type: RMCIgnoreGhostInteractionLimits

- type: entity
  parent: VehicleHumveeDoorBase
  id: VehicleHumveeExitDoorDirectional
  components:
  - type: Sprite
    state: exit_door1
  - type: VehicleExit
  - type: RMCIgnoreGhostInteractionLimits
  - type: RemoveComponents
    components:
    - type: Tag

- type: entity
  parent: VehicleHumveeDoorBase
  id: VehicleHumveeMedicalBackDoor1
  components:
  - type: Sprite
    state: medical_backdoor1

- type: entity
  parent: VehicleHumveeDoorBase
  id: VehicleHumveeMedicalBackDoor2
  components:
  - type: Sprite
    state: medical_backdoor2

- type: entity
  parent: VehicleHumveeDoorBase
  id: VehicleHumveeCarrierBackDoor1
  components:
