- type: entity
  abstract: true
  id: RMCHiveBoonBase
  name: 蜂巢恩赐
  components:
  - type: HiveBoonDefinition
    cost: 1

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonFireResistance
  name: 火焰抗性恩赐
  description: 使所有异形在5分钟内免疫火焰。
  components:
  - type: HiveBoonDefinition
    duration: 5m
    duplicateId: RMCHiveBoonFireResistance
    event: !type:HiveBoonActivateFireResistanceEvent

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonEvolution
  name: 次级进化恩赐
  description: 使异形进化速度翻倍，持续5分钟。
  components:
  - type: HiveBoonDefinition
    duration: 5m
    duplicateId: RMCHiveBoonEvolution
    event: !type:HiveBoonActivateEvolutionEvent
  - type: EvolutionBonus
    amount: 0.5

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonAggression
  name: 次级攻击恩赐
  description: 使所有异形造成的伤害提高5点，持续5分钟。
  components:
  - type: HiveBoonDefinition
    duration: 5m
    duplicateId: RMCHiveBoonAggression
    event: !type:HiveBoonActivateAggressionEvent
  - type: HiveBoonMeleeDamage
    amount: 5

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonEvolutionMajor
  name: 强效进化恩赐
  description: 使异形进化速度翻倍，持续10分钟，且无需产卵器即可推进进化进度。
  components:
  - type: HiveBoonDefinition
    cost: 2
    pylons: 2
    duration: 10m
    unlockAt: 60m
    duplicateId: RMCHiveBoonEvolutionMajor
    event: !type:HiveBoonActivateEvolutionEvent
  - type: EvolutionBonus
    amount: 0.5
  - type: EvolutionIgnoreGranter

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonAggressionMajor
  name: 强效攻击恩赐
  description: 使所有异形造成的伤害提高10点，持续10分钟。
  components:
  - type: HiveBoonDefinition
    cost: 2
    pylons: 2
    duration: 10m
    unlockAt: 60m
    duplicateId: RMCHiveBoonAggressionMajor
    event: !type:HiveBoonActivateAggressionEvent
  - type: HiveBoonMeleeDamage
    amount: 10

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonAdaptability
  name: 适应性恩赐
  description: 允许每只异形转变为同阶级的其他种姓形态。
  components:
  - type: HiveBoonDefinition
    cost: 2
    pylons: 2
    unlockAt: 60m
    duplicateId: RMCHiveBoonAdaptability
    event: !type:HiveBoonActivateAdaptabilityEvent

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonLarvaSurge
  name: 幼虫狂潮
  description: 立即为蜂巢提供5只幼虫。
  components:
  - type: HiveBoonDefinition
    cost: 5
    reusable: false
    duplicateId: RMCHiveBoonLarvaSurge
    event: !type:HiveBoonActivateLarvaSurgeEvent

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonKing
  name: 唤醒异形国王
  description: 唤醒一头庞大的异形巨兽，能一路撕裂防御工事与血肉之躯。需要蜂巢核心周围拥有开阔空间方可生成。
  components:
  - type: HiveBoonDefinition
    cost: 0
    pylons: 2
    cooldown: 15m
    unlockAt: 90m
    unlockAtRandomAdd: 25m
    duplicateId: RMCHiveBoonKing
    noLivingKing: true
    requiresCore: true
    event: !type:HiveBoonActivateKingEvent

- type: entity
  parent: BaseHiveStructure
  id: RMCHiveCocoonKing
  name: 异形茧
  description: 一个巨大且正在搏动着的异形茧。
  components:
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        layer:
        - BulletImpassable
        density: 200
      xeno_hive_core:
        shape: !type:PhysShapeCircle
          radius: 1
        hard: false
        mask:
        - SmallMobLayer
  - type: CollisionWake
    enabled: false
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/king_cocoon.rsi
    state: growing
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 4000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: WarpPoint
    location: cmu-warp-location-alien-cocoon
  - type: RMCTrackable
  - type: HiveKingCocoon
  - type: MeleeReceivedMultiplier
    xenoDamage: {}
