- type: entity
  abstract: true
  id: RMCHiveBoonBase
  name: 蜂巢恩惠 | hive boon
  components:
  - type: HiveBoonDefinition
    cost: 1

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonFireResistance
  name: 火焰抗性恩赐 | Boon of Fire Resistance
  description: 使所有异形在5分钟内免疫火焰。 | Makes all xenomorphs immune to fire for 5 minutes.
  components:
  - type: HiveBoonDefinition
    duration: 5m
    duplicateId: RMCHiveBoonFireResistance
    event: !type:HiveBoonActivateFireResistanceEvent

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonEvolution
  name: 进化次级恩惠 | Minor Boon of Evolution
  description: 使进化速度翻倍，持续5分钟。 | Doubles evolution speed for 5 minutes.
  components:
  - type: HiveBoonDefinition
    duration: 5m
    duplicateId: RMCHiveBoonEvolution
    event: !type:HiveBoonActivateEvolutionEvent
  - type: EvolutionBonus
    amount: 0.5

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonAggression
  name: 次级攻击恩赐 | Minor Boon of Aggression
  description: 使所有异形造成的伤害提高5，持续5分钟。 | Increases all xenomorph damage by 5 for 5 minutes.
  components:
  - type: HiveBoonDefinition
    duration: 5m
    duplicateId: RMCHiveBoonAggression
    event: !type:HiveBoonActivateAggressionEvent
  - type: HiveBoonMeleeDamage
    amount: 5

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonEvolutionMajor
  name: 进化大恩赐 | Major Boon of Evolution
  description: 使进化速度加倍，持续10分钟，并允许无需产卵器即可推进进化进度。 | Doubles evolution speed for 10 minutes, and allows evolution progress without an ovipositor.
  components:
  - type: HiveBoonDefinition
    cost: 2
    pylons: 2
    duration: 10m
    unlockAt: 60m
    duplicateId: RMCHiveBoonEvolutionMajor
    event: !type:HiveBoonActivateEvolutionEvent
  - type: EvolutionBonus
    amount: 0.5
  - type: EvolutionIgnoreGranter

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonAggressionMajor
  name: 攻击大恩惠 | Major Boon of Aggression
  description: 使所有异形造成的伤害提高10点，持续10分钟。 | Increases all xenomorph damage by 10 for 10 minutes.
  components:
  - type: HiveBoonDefinition
    cost: 2
    pylons: 2
    duration: 10m
    unlockAt: 60m
    duplicateId: RMCHiveBoonAggressionMajor
    event: !type:HiveBoonActivateAggressionEvent
  - type: HiveBoonMeleeDamage
    amount: 10

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonAdaptability
  name: 适应性恩赐 | Boon of Adaptability
  description: 允许每个异形变更为同一阶级的不同种姓。 | Allows each xenomorph to change to a different caste of the same tier.
  components:
  - type: HiveBoonDefinition
    cost: 2
    pylons: 2
    unlockAt: 60m
    duplicateId: RMCHiveBoonAdaptability
    event: !type:HiveBoonActivateAdaptabilityEvent

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonLarvaSurge
  name: 爆虫涌现 | Surge of Larva
  description: 立即为蜂巢提供5只幼虫。 | Provides 5 larva instantly to the hive.
  components:
  - type: HiveBoonDefinition
    cost: 5
    reusable: false
    duplicateId: RMCHiveBoonLarvaSurge
    event: !type:HiveBoonActivateLarvaSurgeEvent

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonKing
  name: 阁下 | His Grace
  description: 一种巨大的异形巨兽，能一路撕裂防御设施与血肉。需要巢穴核心周围有开阔空间才能生成。 | A huge behemoth of a xenomorph which can tear its way through defenses and flesh alike. Requires open space around the hive core to spawn.
  components:
  - type: HiveBoonDefinition
    cost: 0
    pylons: 2
    cooldown: 15m
    unlockAt: 90m
    unlockAtRandomAdd: 25m
    duplicateId: RMCHiveBoonKing
    noLivingKing: true
    requiresCore: true
    event: !type:HiveBoonActivateKingEvent

- type: entity
  parent: BaseHiveStructure
  id: RMCHiveCocoonKing
  name: 外星茧 | alien cocoon
  description: 一个巨大的搏动着的外星茧。 | A large pulsating cocoon.
  components:
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        layer:
        - BulletImpassable
        density: 200
      xeno_hive_core:
        shape: !type:PhysShapeCircle
          radius: 1
        hard: false
        mask:
        - SmallMobLayer
  - type: CollisionWake
    enabled: false
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/king_cocoon.rsi
    state: growing
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 4000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: WarpPoint
    location: cmu-warp-location-alien-cocoon
  - type: RMCTrackable
  - type: HiveKingCocoon
  - type: MeleeReceivedMultiplier
    xenoDamage: {}
