- type: entity
  id: RMCKeycardDevice
  name: 钥匙卡认证设备
  description: 该设备用于触发站点功能，这些功能需要多次刷身份卡才能认证。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/monitors.rsi
    state: auth_off # TODO RMC14 auth_on when on
    drawdepth: WallMountedItems
  - type: Clickable
  - type: InteractionOutline
  - type: Appearance
  - type: KeycardDevice
  - type: AccessReader
    access: [["RMCAccessCommand"]]
  - type: UserInterface
    interfaces:
      enum.DialogUiKey.Key:
        type: DialogBui
