- type: entity
  id: RMCOrbitalCannonDerelict
  name: 轨道加农炮
  suffix: RMC
  description: "USCMC轨道加农炮系统。用于打击其环绕行星上的大型目标。它使用固体燃料加速载荷，撞击时造成毁灭性效果。"
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,0.49,3.49,2.49"
        density: 155
        mask:
        - MachineMask
        layer:
        - WallLayer
  - type: Sprite
    sprite: _RMC14/Structures/orbital_cannon.rsi
    offset: 1.5, 0.5
    layers:
    - state: obc_unloaded
      map: ["CannonLayerKey"]
  - type: Clickable
  - type: InteractionOutline
  - type: RMCAnimation
  - type: RMCLoreExaminable
    content: rmc-lore-examniable-orbital-cannon
  - type: RMCMesonsNonviewable

- type: entity
  parent: RMCOrbitalCannonDerelict
  id: RMCOrbitalCannon
  name: 轨道加农炮
  suffix: Derelict
  description: "UNMC轨道加农炮系统。用于射击其环绕行星上的大型目标。它使用固体燃料加速载荷，在撞击时造成毁灭性效果。"
  components:
  - type: OrbitalCannon
    warheadTypes:
    - RMCOrbitalCannonWarheadExplosive
    - RMCOrbitalCannonWarheadCluster
    - RMCOrbitalCannonWarheadIncendiary
    - RMCOrbitalCannonWarheadAegis
    - CMUOrbitalCannonWarheadAegis

- type: entity
  parent: RMCOrbitalCannon
  id: AU14OrbitalCannonGovfor
  suffix: Govfor
  components:
  - type: OrbitalCannon
    faction: GOVFOR

- type: entity
  parent: RMCOrbitalCannon
  id: AU14OrbitalCannonOpfor
  suffix: Opfor
  components:
  - type: OrbitalCannon
    faction: OPFOR

- type: entity
  id: RMCOrbitalCannonFuel
  name: 固体燃料
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite: _RMC14/Structures/almayer_props.rsi
    state: ob_fuel
    drawdepth: SmallObjects
  - type: Clickable
  - type: InteractionOutline
  - type: PowerLoaderGrabbable
    virtualRight: RMCVirtualFuelRight
    virtualLeft: RMCVirtualFuelLeft
  - type: Item
  - type: OrbitalCannonFuel

- type: entity
  abstract: true
  id: RMCOrbitalCannonWarheadBase
  name: 轨道弹头
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite: _RMC14/Structures/almayer_props.rsi
    state: ob_warhead1
    drawdepth: SmallObjects
  - type: OrbitalCannonWarhead
    transitExplosionType: RMCOB
  - type: Clickable
  - type: InteractionOutline
  - type: PowerLoaderGrabbable
    virtualRight: RMCVirtualWarheadRight
    virtualLeft: RMCVirtualWarheadLeft
  - type: Item

- type: entity
  parent: RMCOrbitalCannonWarheadBase
  id: RMCOrbitalCannonWarheadExplosive
  description: "一种轨道弹头，设计为在装入足够的固体燃料后由UNMC轨道炮系统发射。此型号专用于重兵设防区域，若能成功抵达地面，将造成大范围圆形爆炸。"
  name: 高爆轨道弹头
  components:
  - type: Sprite
    state: ob_warhead_1
  - type: OrbitalCannonWarhead
    explosion: RMCOrbitalCannonExplosionExplosive

- type: entity
  parent: RMCOrbitalCannonWarheadBase
  id: RMCOrbitalCannonWarheadIncendiary
  description: "一种轨道弹头，设计为在装入足量固体燃料后由UNMC轨道加农炮系统发射。此型号专用于切断敌军，并会形成一大片菱形超高温蓝色火焰。"
  name: 燃烧轨道弹头
  components:
  - type: Sprite
    state: ob_warhead_2
  - type: OrbitalCannonWarhead
    explosion: RMCOrbitalCannonExplosionIncendiary

- type: entity
  parent: RMCOrbitalCannonWarheadBase
  id: RMCOrbitalCannonWarheadCluster
  description: "一种轨道弹头，设计为在装入足量固体燃料后从UNMC轨道炮系统发射。该特定型号专为在狭窄且防御严密的区域使用而设计，会造成多次爆炸，爆炸范围大致呈矩形。"
  name: 集束轨道弹头
  components:
  - type: Sprite
    state: ob_warhead_3
  - type: OrbitalCannonWarhead
    explosion: RMCOrbitalCannonExplosionCluster

- type: entity
  parent: RMCOrbitalCannonWarheadBase
  id: RMCOrbitalCannonWarheadAegis
  description: "AEG-328-KRA，又称“KRAKEN”，是一种实验性phoron基轨道弹头，直接出自AEGIS研发部。其设计用于对付单枚轨道弹头根本不够的目标。"
  name: AEG-328-KRA
  suffix: RMC
  components:
  - type: WarpPoint
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: aegisob
  - type: TacticalMapTracked
  - type: XenoMapTracked
  - type: MarineMapTracked
  - type: Sprite
    sprite: _RMC14/Structures/ob_warhead_aegis.rsi
    state: ob_warhead_aegis
  - type: OrbitalCannonWarhead
    explosion: RMCOrbitalCannonExplosionAegis
    isAegis: true
    firstWarningRange: 60
    secondWarningRange: 55
    thirdWarningRange: 45
    intelPointsAwarded: 5
  - type: PowerLoaderGrabbable
    virtualRight: RMCVirtualWarheadRightAegis
    virtualLeft: RMCVirtualWarheadLeftAegis

- type: entity
  id: RMCOrbitalCannonWarheadSpawner
  name: 随机轨道弹头
  description: "这是一个随机轨道弹头。"
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _RMC14/Structures/almayer_props.rsi
    state: ob_warhead_1
  - type: UniqueRandomSpawner
    spawnerGroup: RMCOrbitalCannonWarheadSpawner
    prototypes:
    - RMCOrbitalCannonWarheadExplosive
    - RMCOrbitalCannonWarheadCluster
    - RMCOrbitalCannonWarheadIncendiary

- type: entity
  parent: MarkerBase
  id: RMCOrbitalCannonExplosionExplosive
  name: 爆炸性OB爆炸
  suffix: FIRES AN OB!!!
  placement:
    mode: SnapgridCenter
  components:
  - type: OrbitalCannonExplosion
    multiZ: true
    steps:
    - type: RMCOBXenoTunnel
      total: 5000
      slope: 1500
      max: 200
      delay: 1
    - type: RMCOBXenoTunnel
      total: 50000
      slope: 10
      max: 90
      delay: 0.3
    - type: RMCOBXenoTunnel
      total: 50000
      slope: 10
      max: 90
      delay: 0.6
      explosionEffect: RMCExplosionEffectClusterOB
  - type: WarpPoint
    location: cmu-warp-location-orbital-bombardment-one

- type: entity
  parent: MarkerBase
  id: RMCOrbitalCannonExplosionAegis
  name: 爆裂神盾OB爆炸
  suffix: RMC, FIRES AN OB!!!
  placement:
    mode: SnapgridCenter
  components:
  - type: OrbitalCannonExplosion
    multiZ: true
    steps:
    - type: RMCOBXenoTunnel
      total: 5000
      slope: 1500
      max: 200
      delay: 1
    - type: RMCOBXenoTunnel
      total: 150000
      slope: 10
      max: 90
      delay: 0.3
    - type: RMCOBXenoTunnel
      total: 150000
      slope: 10
      max: 90
      delay: 0.3
    - fire: RMCTileFireOBAegis
      fireRange: 35
  - type: WarpPoint
    location: cmu-warp-location-orbital-bombardment-one

- type: entity
  parent: MarkerBase
  id: RMCOrbitalCannonExplosionIncendiary
  name: 燃烧性轨道轰炸爆炸
  suffix: FIRES AN OB!!!
  placement:
    mode: SnapgridCenter
  components:
  - type: OrbitalCannonExplosion
    multiZ: true
    steps:
    - type: RMCOB
      total: 5000
      slope: 1500
      max: 200
      delay: 1
    - fire: RMCTileFireOB
      fireRange: 18
  - type: WarpPoint
    location: cmu-warp-location-orbital-bombardment-one

- type: entity
  parent: MarkerBase
  id: RMCOrbitalCannonExplosionCluster
  name: OB 集群爆炸
  suffix: FIRES AN OB!!!
  placement:
    mode: SnapgridCenter
  components:
  - type: OrbitalCannonExplosion
    multiZ: true
    steps:
    - type: RMCOBXenoTunnel
      total: 6500
      slope: 100
      max: 350
      delay: 1
      times: 75
      timesPer: 3
      delayPer: 0.4
      spread: 12
      checkProtectionPer: true
      explosionEffect: RMCExplosionEffectClusterOB
  - type: WarpPoint
    location: cmu-warp-location-orbital-bombardment-one

- type: entity
  id: RMCOrbitalCannonComputer
  name: 轨道炮控制台
  description: "控制轨道炮装载系统的控制台。"
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: ob_console # TODO RMC14 powered off, broken
    drawdepth: HighFloorObjects
  - type: Clickable
  - type: InteractionOutline
  - type: UserInterface
    interfaces:
      enum.OrbitalCannonComputerUI.Key:
        type: OrbitalCannonComputerBui
  - type: ActivatableUI
    key: enum.OrbitalCannonComputerUI.Key
  - type: OrbitalCannonComputer
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  parent: CMSeatBase
  id: RMCOrbitalCannonChair
  name: 座椅
  description: "舒适的座椅。"
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    rot: 90
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/objects.rsi
    state: ob_chair
  - type: Strap

- type: entity
  id: RMCOrbitalCannonCableConnector
  name: 大炮电缆连接器
  description: "用于大炮电缆的连接器。"
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 155
        mask:
        - MachineMask
        layer:
        - WallLayer
  - type: Sprite
    sprite: _RMC14/Structures/almayer_props.rsi
    state: cannon_cable_connector

- type: entity
  id: RMCOrbitalCannonCable
  name: 加农炮电缆
  description: "一些大型电缆。"
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/almayer_props.rsi
    state: cannon_cables
  - type: Tag
    tags:
    - HideContextMenu

# Effects
- type: entity
  id: RMCExplosionEffectClusterOB
  categories: [HideSpawnMenu]
  components:
  - type: TimedDespawn
    lifetime: 2.5
  - type: CMExplosionEffect
    explosion:
    shockWave: RMCExplosionEffectClusterOBShockWave

- type: entity
  id: RMCExplosionEffectClusterOBShockWave
  categories: [HideSpawnMenu]
  components:
  - type: TimedDespawn
    lifetime: 1
  - type: RMCExplosionShockWave
    falloffPower: 50
    sharpness: 25
    width: 0.7

# Tray
- type: entity
  id: RMCOrbitalCannonTray
  name: 装填托盘
  description: "轨道炮的装填托盘。"
  suffix: Cannon spawns with one that's linked to it.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,1.04,0.24"
        density: 155
        mask:
        - MachineMask
        layer:
        - WallLayer
        hard: false
  - type: Sprite
    sprite: _RMC14/Structures/orbital_cannon_tray.rsi
    drawdepth: SmallObjects
    offset: 0.5, 0.5
    layers:
    - state: cannon_tray
      map: ["base"]
    - state: cannon_tray_explosive
      map: ["warhead"]
      visible: false
    - state: cannon_tray_1
      map: ["fuel"]
      visible: false
  - type: Clickable
  - type: InteractionOutline
  - type: Climbable
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.OrbitalCannonTrayVisuals.Warhead:
        warhead:
          None: {visible: false}
          RMCOrbitalCannonWarheadExplosive: {visible: true, state: cannon_tray_explosive}
          RMCOrbitalCannonWarheadIncendiary: {visible: true, state: cannon_tray_incendiary}
          RMCOrbitalCannonWarheadCluster: {visible: true, state: cannon_tray_cluster}
          RMCOrbitalCannonWarheadAegis: {visible: true, state: cannon_tray_explosive}   # We don't have aegis tray sprite
          CMUOrbitalCannonWarheadAegis: {visible: true, state: cannon_tray_explosive}
      enum.OrbitalCannonTrayVisuals.Fuel:
        fuel:
          0: {visible: false}
          1: {visible: true, state: cannon_tray_1}
          2: {visible: true, state: cannon_tray_2}
          3: {visible: true, state: cannon_tray_3}
          4: {visible: true, state: cannon_tray_4}
          5: {visible: true, state: cannon_tray_5}
          6: {visible: true, state: cannon_tray_6}
  - type: RMCMesonsNonviewable
  - type: OrbitalCannonTray
