  description: 一大块坚实的荒岩与冰。看起来你得费点劲才能爬上去。它已被摧毁。
  components:
  - type: Sprite
    state: strata_platform_broken
  - type: Construction
    graph: RMCPlatformShivaRockDestructible
    node: platformBroken

- type: entity
  parent: RMCPlatformCornerSmall
  id: RMCPlatformShivaRockCornerSmall
  name: 冰岩角
  description: 一块由荒凉岩石和冰组成的坚固块状物。
  components:
  - type: Sprite
    state: strata_platform_deco
