  name: 冰岩边缘
  description: 一大块荒凉的岩石和冰。看起来你可以费点劲爬上去。
  components:
  - type: Sprite
    state: strata_platform
  - type: Construction
    graph: RMCPlatformShivaRockDestructible
    node: start

- type: entity
