# Sorokyne Rock
- type: entity
  parent: CMPlatform
  id: RMCPlatformStrataRock
  name: 岩石边缘
  description: 一大块荒凉的坚实岩石。看起来你能费些力气爬上去。
  components:
  - type: Sprite
    state: strata_rock_platform
  - type: Construction
    graph: RMCPlatformStrataRockDestructible
    node: start

- type: entity
  parent: CMPlatformBroken
  id: RMCPlatformStrataRockBroken
  name: 被摧毁的岩石边缘
  description: 一块坚固的荒芜岩石。看起来你可以有些费力地爬上去。它已被摧毁。
  components:
  - type: Sprite
    state: strata_rock_platform_broken
  - type: Construction
    graph: RMCPlatformStrataRockDestructible
    node: platformBroken

- type: entity
  parent: RMCPlatformCornerSmall
  id: RMCPlatformStrataRockCornerSmall
  name: 岩石角落
  description: 一块坚固的荒凉岩石。
  components:
  - type: Sprite
    state: strata_rock_platform_deco
