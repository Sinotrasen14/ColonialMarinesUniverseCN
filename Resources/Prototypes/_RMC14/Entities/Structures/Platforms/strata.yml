# Sorokyne Strata

- type: entity
  parent: CMPlatform
  id: RMCPlatformStrata
  name: 凸起的金属边缘
  description: 凸起的金属层，通常用于将某些区域抬高到其他区域之上。你大概可以爬上去。
  components:
  - type: Sprite
    state: strata_metalplatform
  - type: Construction
    graph: RMCPlatformStrataDestructible
    node: start

- type: entity
  parent: CMPlatformBroken
  id: RMCPlatformStrataBroken
  components:
  - type: Sprite
    state: strata_metalplatform_broken
  - type: Construction
    graph: RMCPlatformStrataDestructible
    node: platformBroken

