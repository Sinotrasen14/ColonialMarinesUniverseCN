  description: "1. 你无权享受服务或获得装备。附加物资是一种特权，而非权利。\n2. 你必须穿着全套制服才能获得服务。不允许只穿内衣。\n3. 后勤军官有最终决定权，并有权拒绝提供服务。只有代理指挥官可以推翻其决定。\n4. 请尊重物资申领处工作人员。他们工作很努力。"
