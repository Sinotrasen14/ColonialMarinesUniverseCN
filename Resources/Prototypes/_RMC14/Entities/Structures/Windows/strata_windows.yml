- type: entity
  parent: RMCBaseWindowFrame
  id: RMCWindowFrameStrata
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/Frames/strata_frame.rsi
    state: strata_frame0
  - type: Icon
    sprite: _RMC14/Structures/Windows/Frames/strata_frame.rsi
    state: strata_frame0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: strata_frame
    mode: CardinalFlags
  - type: Construction
    graph: RMCWindowStrata
    node: windowFrameStrata

- type: entity
