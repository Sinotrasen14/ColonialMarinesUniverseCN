- type: entity
  parent: CMBaseWindow
  id: RMCWindowStrata
  name: 窗户
  description: 墙框内的一扇玻璃窗。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/strata_window.rsi
    state: strata_window0
  - type: Icon
    sprite: _RMC14/Structures/Windows/strata_window.rsi
    state: strata_window0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: strata_window
    mode: CardinalFlags
  - type: Repairable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 600   # excessive damage destroys window and frame
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger: !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CMShardGlass:
            min: 1
            max: 1
      - !type:ChangeConstructionNodeBehavior
        node: windowFrameStrata
  - type: RMCWallExplosionDeletable
  - type: DestroyedByExplosionType
  - type: Construction
    graph: RMCWindowStrata
    node: windowStrata
  - type: DestroyOnXenoPierceScissor
    spawnPrototype: RMCWindowFrameStrata
    sound:
      collection: WindowShatter

- type: entity
  parent: CMBaseWindow
  id: RMCWindowStrataReinforced
  name: 加固窗
  description: 一扇玻璃窗。透过它看时，光线折射异常。它看起来相当坚固。可能需要重重敲几下才能将其打碎。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/strata_window.rsi
    state: strata_window0
  - type: Icon
    sprite: _RMC14/Structures/Windows/strata_window.rsi
    state: strata_window0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: strata_window
    mode: CardinalFlags
  - type: Repairable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 600   # excessive damage destroys window and frame
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CMShardGlass:
            min: 1
            max: 1
          CMRodMetal:
            min: 1
            max: 1
      - !type:ChangeConstructionNodeBehavior
        node: windowFrameStrata
  - type: RMCWallExplosionDeletable
  - type: DestroyedByExplosionType
  - type: Construction
    graph: RMCWindowStrata
    node: windowStrata
  - type: DestroyOnXenoPierceScissor
    spawnPrototype: RMCWindowFrameStrataReinforced
    sound:
      collection: WindowShatter

