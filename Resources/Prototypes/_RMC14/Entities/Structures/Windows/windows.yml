- type: entity
  parent: CMBaseWindow
  id: CMWindowReinforcedAlmayer
  name: 加固窗
  description: 一扇玻璃窗，墙框内部嵌有特殊的杆状矩阵。它看起来相当坚固。可能需要用力敲几下才能打碎。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/almayer_window.rsi
    state: alm_rwindow0
  - type: Icon
    sprite: _RMC14/Structures/Windows/almayer_window.rsi
    state: alm_rwindow0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: alm_rwindow
    mode: CardinalFlags
  - type: Repairable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 600   # excessive damage destroys window and frame
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CMShardGlass:
            min: 1
            max: 1
          CMRodMetal:
            min: 1
            max: 1
      - !type:ChangeConstructionNodeBehavior
        node: windowFrameAlmayer
  - type: RMCWallExplosionDeletable
  - type: DestroyedByExplosionType
  - type: Construction
    graph: RMCWindowAlmayer
    node: windowAlmayerReinforced
  - type: DestroyOnXenoPierceScissor
    spawnPrototype: RMCWindowFrameAlmayer
    sound:
      collection: WindowShatter
  - type: ImmuneToUnarmed
  - type: RMCHijackRandomDamageTarget
    category: Window
    damage:
      types:
        Structural: 60
    breakDamage:
      types:
        Structural: 100

