- type: entity
  abstract: true
  parent: CMBaseStructureCorrodible
  id: CMBaseWindowIndestructible
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: Walls
  - type: PlacementReplacement
    key: walls
  - type: Airtight
  - type: RadiationBlocker
    resistance: 2
  - type: StaticPrice
    price: 75
  - type: Physics
    bodyType: Static
  - type: InteractionPopup
    interactDelay: 10
    interactSuccessString: comp-window-knock
    messagePerceivedByOthers: rmc-window-knock-others
    interactSuccessSound:
      path: /Audio/Effects/glass_knock.ogg
      params:
        variation: 0.125
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: DamageMultiplierFlags
    flags: Breaching
  - type: RMCMesonsNonviewable

- type: entity
  abstract: true
  parent: CMBaseWindowIndestructible
  id: CMBaseWindow # TODO RMC14 this needs to be 2 separate entities eventually
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: VehicleSmashable
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmack
  - type: Damageable
    damageModifierSet: StructuralMarine
  - type: Injurable
    damageContainer: StructuralMarine
  - type: XenoToggleChargingDamage
    stageLoss: 2
    damage:
      types:
        Blunt: 40 # TODO RMC14 reduce window health to 100, check per window
  - type: XenoCrusherChargable
    instantDestroy: true
  - type: RMCBruteStructureDamageMultiplier
    multiplier: 10

- type: entity
  parent: CMBaseWindowIndestructible
  id: CMWindowReinforcedAlmayerHull
  name: 船体窗
  description: 一扇墙框内带有特殊杆状矩阵的玻璃窗。这一扇由异域材料制成，用以防止船体破损。无法从这里穿过。
  components:
  - type: Corrodible
    isCorrodible: false
  - type: Sprite
    sprite: _RMC14/Structures/Windows/almayer_window.rsi
    state: alm_rwindow0
  - type: Icon
    sprite: _RMC14/Structures/Windows/almayer_window.rsi
    state: alm_rwindow0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: alm_rwindow
    mode: CardinalFlags

