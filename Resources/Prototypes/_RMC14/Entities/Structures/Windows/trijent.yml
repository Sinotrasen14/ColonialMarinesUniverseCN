# Chigusa

- type: entity
  parent: RMCBaseWindowFrame
  id: RMCWindowFrameChigusa
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/Frames/chigusa_frame.rsi
    state: chig_frame0
  - type: Icon
    sprite: _RMC14/Structures/Windows/Frames/chigusa_frame.rsi
    state: chig_frame0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: chig_frame
    mode: CardinalFlags
  - type: Construction
    graph: RMCWindowChigusa
    node: windowFrameChigusa

- type: entity
  parent: CMBaseWindow
  id: RMCWindowChigusa
  name: 强化窗
  description: 一扇玻璃窗，墙框内嵌有特殊的杆状矩阵。它看起来相当坚固。可能需要几次重击才能将其打碎。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/chigusa.rsi
    state: chig_rwindow0
  - type: Icon
    sprite: _RMC14/Structures/Windows/chigusa.rsi
    state: chig_rwindow0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: chig_rwindow
    mode: CardinalFlags
  - type: Repairable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 600   # excessive damage destroys window and frame
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CMShardGlass:
            min: 1
            max: 1
          CMRodMetal:
            min: 1
            max: 1
      - !type:ChangeConstructionNodeBehavior
        node: windowFrameChigusa
  - type: RMCWallExplosionDeletable
  - type: DestroyedByExplosionType
  - type: Construction
    graph: RMCWindowChigusa
    node: windowChigusa
  - type: DestroyOnXenoPierceScissor
    spawnPrototype: RMCWindowFrameChigusa
    sound:
      collection: WindowShatter

