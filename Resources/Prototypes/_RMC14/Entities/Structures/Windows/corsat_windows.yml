- type: entity
  parent: RMCWindowFrameColonyReinforced
  id: RMCWindowFrameCorsatReinforced
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/Frames/corsat_rframe.rsi
    state: padded_rframe0
  - type: Icon
    sprite: _RMC14/Structures/Windows/Frames/corsat_rframe.rsi
    state: padded_rframe0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: padded_rframe
    mode: CardinalFlags
  - type: Construction
    graph: RMCWindowCorsatReinforced
    node: windowFrameCorsatReinforced

- type: entity
  parent: CMBaseWindow
  id: RMCWindowCorsatReinforced
  name: 加固窗户
  description: 一扇玻璃窗，墙框内嵌有特殊的杆状矩阵。它看起来相当坚固。可能需要重重击打几下才能将其打碎。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/corsat_rwindow.rsi
    state: padded_rwindow0
  - type: Icon
    sprite: _RMC14/Structures/Windows/corsat_rwindow.rsi
    state: padded_rwindow0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: padded_rwindow
    mode: CardinalFlags
  - type: Repairable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 600   # excessive damage destroys window and frame
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CMShardGlass:
            min: 1
            max: 1
          CMRodMetal:
            min: 1
            max: 1
      - !type:ChangeConstructionNodeBehavior
        node: windowFrameCorsatReinforced
  - type: RMCWallExplosionDeletable
  - type: DestroyedByExplosionType
  - type: Construction
    graph: RMCWindowCorsatReinforced
    node: windowCorsatReinforced
  - type: DestroyOnXenoPierceScissor
    spawnPrototype: RMCWindowFrameColonyReinforced
    sound:
      collection: WindowShatter

