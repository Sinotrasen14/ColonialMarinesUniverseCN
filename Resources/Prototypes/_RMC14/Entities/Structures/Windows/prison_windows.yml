- type: entity
  parent: RMCBaseWindowFrame
  id: RMCWindowFramePrison
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/Frames/prison_frame.rsi
    state: prison_frame0
  - type: Icon
    sprite: _RMC14/Structures/Windows/Frames/prison_frame.rsi
    state: prison_frame0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: prison_frame
    mode: CardinalFlags
  - type: Construction
    graph: RMCWindowPrison
    node: windowFramePrison

- type: entity
  parent: CMBaseWindow
  id: RMCWindowPrison
  name: 窗户
  description: 一扇玻璃窗。它看起来又薄又脆弱。用任何东西敲几下就能把它打碎。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/prison_window.rsi
    state: prison_window0
  - type: Icon
    sprite: _RMC14/Structures/Windows/prison_window.rsi
    state: prison_window0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: prison_window
    mode: CardinalFlags
  - type: Repairable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 600   # excessive damage destroys window and frame
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger: !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CMShardGlass:
            min: 1
            max: 1
      - !type:ChangeConstructionNodeBehavior
        node: windowFramePrison
  - type: RMCWallExplosionDeletable
  - type: DestroyedByExplosionType
  - type: Construction
    graph: RMCWindowPrison
    node: windowPrison
  - type: DestroyOnXenoPierceScissor
    spawnPrototype: RMCWindowFramePrison
    sound:
      collection: WindowShatter


- type: entity
  parent: RMCWindowPrison
  id: RMCWindowPrisonCell
  name: 牢房窗
  description: 一扇玻璃窗，墙框内带有特殊的杆状矩阵。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/prison_cellwindow.rsi
    state: prison_cellwindow0
  - type: Icon
    sprite: _RMC14/Structures/Windows/prison_cellwindow.rsi
    state: prison_cellwindow0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: prison_cellwindow
    mode: CardinalFlags

- type: entity
  parent: CMBaseWindow
  id: RMCWindowPrisonReinforced
  name: 加固窗
  description: 一扇墙框内带有特殊杆状矩阵的玻璃窗。它看起来相当坚固。可能需要重重击打几下才能打碎它。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/prison_rwindow.rsi
    state: prison_rwindow0
  - type: Icon
    sprite: _RMC14/Structures/Windows/prison_rwindow.rsi
    state: prison_rwindow0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: prison_rwindow
    mode: CardinalFlags
  - type: Repairable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 600   # excessive damage destroys window and frame
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CMShardGlass:
            min: 1
            max: 1
          CMRodMetal:
            min: 1
            max: 1
      - !type:ChangeConstructionNodeBehavior
        node: windowFramePrison
  - type: RMCWallExplosionDeletable
  - type: DestroyedByExplosionType
  - type: Construction
    graph: RMCWindowPrison
    node: windowPrisonReinforced
  - type: DestroyOnXenoPierceScissor
    spawnPrototype: RMCWindowFramePrison
    sound:
      collection: WindowShatter

- type: entity
  parent: CMBaseWindowIndestructible
  id: RMCWindowPrisonHull
  name: 船体窗
  description: 一扇在壁框内带有特殊杆矩阵的玻璃窗。这一扇配有自动遮板系统，以防止任何大气泄漏。
  components:
  - type: Corrodible
    isCorrodible: false
  - type: Sprite
    sprite: _RMC14/Structures/Windows/prison_rwindow.rsi
    state: prison_rwindow0
  - type: Icon
    sprite: _RMC14/Structures/Windows/prison_rwindow.rsi
    state: prison_rwindow0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: prison_rwindow
    mode: CardinalFlags
