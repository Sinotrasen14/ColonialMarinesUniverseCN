- type: entity
  id: CMWindowDirectionalBase
  parent: BaseWindowStructureDirectional
  abstract: true
  name: 窗户
  description: 一扇玻璃窗。它看起来又薄又脆弱。用任何东西敲几下应该就能把它打碎。
  components:
  - type: Transform
    anchored: true
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.38"
        density: 1500
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: RotationDrawDepth
    defaultDrawDepth: SmallObjects
    southDrawDepth: OverMobs
  - type: Sprite
    sprite: _RMC14/Structures/Windows/directional.rsi
    state: window
  - type: Icon
    sprite: _RMC14/Structures/Windows/directional.rsi
    state: window
  - type: DamageMultiplierFlags
    flags: Breaching
  - type: RMCBruteStructureDamageMultiplier
    multiplier: 10
  - type: Damageable
    damageModifierSet: GlassMod
  - type: Injurable
    damageContainer: StructuralInorganic

- type: entity
  id: CMWindowDirectional
  parent: CMWindowDirectionalBase
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 150 #Excess damage check.
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
    - trigger: !type:DamageTrigger
        damage: 25 #TODO RMC14: Proper damage values.
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CMShardGlass:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: RMCWindowDirectional
    node: windowDirectional

- type: entity
  parent: CMWindowDirectional
  id: RMCWindowDirectionalAltDrawDepth
  suffix: Alt Drawdepth
  components:
  - type: Sprite
    drawdepth: WallTops

- type: entity
  id: CMWindowReinforcedDirectional
  parent: CMWindowDirectionalBase
  name: 加固窗户
  description: 一扇用支撑杆加固的玻璃窗。看起来相当坚固。可能需要猛击几下才能将其打碎。
  components:
  - type: Sprite
    state: rwindow
  - type: Icon
    sprite: _RMC14/Structures/Windows/directional.rsi
    state: rwindow
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 150 #Excess damage check.
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
    - trigger: !type:DamageTrigger
        damage: 25 #TODO RMC14: Proper damage values.
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CMShardGlass:
            min: 1
            max: 1
          CMRodMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: RMCWindowDirectional
    node: windowReinforcedDirectional

- type: entity
  id: CMWindowStrongReinforcedDirectional
  parent: CMWindowDirectionalBase
  name: 坚固的加固窗
  description: 一扇用支撑杆加固的玻璃窗。它看起来非常坚固。你用拳头打不破它。
  components:
  - type: Sprite
    state: rwindow
  - type: Icon
    sprite: _RMC14/Structures/Windows/directional.rsi
    state: rwindow
  - type: ImmuneToUnarmed
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CMShardGlass:
            min: 1
            max: 1
          CMRodMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: RMCWindowDirectional
    node: windowDirectional

- type: entity
  id: CMWindowTintedDirectional
  parent: CMWindowDirectional
  name: 有色玻璃窗
  description: 一扇有色玻璃窗。它看起来相当坚固且不透明。可能需要几下重击才能将其打碎。
  components:
  - type: Sprite
    state: twindow
  - type: Icon
    sprite: _RMC14/Structures/Windows/directional.rsi
    state: twindow

- type: entity
  id: RMCWindowTintedDirectionalBlue
  parent: CMWindowTintedDirectional
  suffix: Blue
  components:
  - type: Sprite
    color: "#969696"

- type: entity
  id: RMCWindowDirectionalBlue
  parent: CMWindowDirectional
  suffix: Blue
  components:
  - type: Sprite
    color: "#969696"

- type: entity
  id: CMWindowUltraDirectional
  parent: CMWindowDirectional
  name: 超强化窗户
  description: 一扇旨在使简报讲台保持为安全区域的超强化窗户。
  components:
  - type: Sprite
    state: fwindow
  - type: Icon
    sprite: _RMC14/Structures/Windows/directional.rsi
    state: fwindow
  - type: Destructible
    thresholds: []
