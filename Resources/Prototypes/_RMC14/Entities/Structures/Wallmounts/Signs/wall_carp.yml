- type: entity
  parent: [BaseWallmountMetallic, BaseSignIndestructible]
  id: AUWallCarpBase
  abstract: true
  name: 适应墙壁的鲤鱼
  description: 在向上游迁徙时被捕获。
  components:
  - type: WallMount
    arc: 360
  - type: Sprite
    drawdepth: WallTops
    sprite: _RMC14/Structures/Wallmounts/wall_carp.rsi
    state: wall_carp
    snapCardinals: true
  - type: Injurable
    damageContainer: StructuralInorganic

- type: entity
  parent: AUWallCarpBase
  id: AUWallCarp
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          AUWallCarpDamaged:
            min: 1
            max: 1
        offset: 0

- type: entity
  parent: AUWallCarpBase
  id: AUWallCarpDamaged
  name: 空牌匾
  description: 那条鲤鱼现在去哪儿了？
  components:
  - type: Sprite
    drawdepth: WallTops
    state: wall_carp_damaged
    snapCardinals: true
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          AUWallCarpBroken:
            min: 1
            max: 1
        offset: 0

- type: entity
  parent: AUWallCarpBase
  id: AUWallCarpBroken
  name: 破损的牌匾
  description: ""
  components:
  - type: Sprite
    drawdepth: WallTops
    state: wall_carp_broken
    snapCardinals: true
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
      - !type:DoActsBehavior
        acts: ["Destruction"]
