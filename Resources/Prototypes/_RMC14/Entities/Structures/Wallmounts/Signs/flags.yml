- type: entity
  parent: BaseFlag
  id: RMCBannerBase
  abstract: true
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Wallmounts/banners.rsi

- type: entity
  parent: RMCBannerBase
  id: RMCBannerCLF
  name: 殖民地解放阵线旗帜
  description: 一面殖民地解放阵线的旗帜。根据观看者的政治倾向，会激发爱国心、恐惧或厌恶。
  components:
  - type: Sprite
    state: clfflag

- type: entity
  parent: RMCBannerCLF
  id: RMCBannerCLFAltDraw
  suffix: Over Podlocks
  components:
  - type: Sprite
    state: clfflag
    drawdepth: BlastDoors

- type: entity
  parent: RMCBannerBase
  id: RMCBannerCLFWorn
  name: 破旧的殖民地解放阵线旗帜
  description: 一面非常破旧的殖民地解放阵线旗帜。它会根据观看者的政治倾向激发爱国心、恐惧或厌恶。
  components:
  - type: Sprite
    state: clfflag_worn

