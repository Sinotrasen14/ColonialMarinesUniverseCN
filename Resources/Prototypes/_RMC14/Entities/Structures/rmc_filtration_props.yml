- type: entity
  id: RMCFiltration
  name: 水过滤系统
  description: 一种水过滤器，可将有机和无机物质、危险废物以及腐蚀性酸从水中分离，以便进一步处理。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-1.49,-1.49,1.49,1.49"
        density: 60
        layer:
        - MobMask
  - type: Sprite
    sprite: _RMC14/Structures/Filtration/96x96.rsi
    state: filtration
  - type: Clickable
  - type: RMCMesonsNonviewable

- type: entity
  parent: RMCFiltration
  id: RMCFiltrationDisinfection
  name: 消毒过滤器
  description: 一种专门设计用于从水中分离病毒和细菌等微生物的水过滤器。
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-1.49,-1.49,1.49,0.49"
        density: 60
        layer:
        - MobMask
  - type: Sprite
    sprite: _RMC14/Structures/Filtration/96x96.rsi
    state: disinfection

- type: entity
  parent: RMCFiltration
  id: RMCFiltrationDistribution
  name: 废物分配系统
  description: 这台机器将净化过程中剩余的废物分离出来，以便丢弃到太空、回收为补给品或用于研究。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Filtration/96x96.rsi
    state: distribution

- type: entity
  parent: RMCFiltrationDistribution
  id: RMCFiltrationDistributionDamaged
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Filtration/96x96.rsi
    state: distribution-damaged

- type: entity
  parent: RMCFiltration
  id: RMCFiltrationSedimentation
  name: 沉淀过滤器
  description: 一款专为拦截并去除水中沉淀物（如沙子、淤泥、污垢和铁锈）而设计的水过滤器，同时不会去除水中有益的矿物质，让您每次都能享受到清爽纯净的口感。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Filtration/96x96.rsi
    state: sedimentation

- type: entity
  parent: RMCFiltrationSedimentation
  id: RMCFiltrationSedimentationAlt
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-1.49,-1.49,1.49,0.49"
        density: 60
        layer:
        - MobMask
  - type: Sprite
    sprite: _RMC14/Structures/Filtration/96x96.rsi
    state: sedimentation_A_1

- type: entity
  parent: RMCFiltration
  id: RMCCoagulationArm
  name: 混凝臂
  description: 一个带有四个面的轴，用于旋转以帮助过滤水。
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 60
        layer:
        - MobMask
  - type: Sprite
    sprite: _RMC14/Structures/Filtration/96x96.rsi
    state: coagulation_arm
