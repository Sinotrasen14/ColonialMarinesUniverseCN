  - type: VehicleSmashable
    minContinueWeightClass: Heavy
    smashSound:
      path: /Audio/_RMC14/Effects/metal_crash.ogg
  - type: Door
    canPry: true
  - type: XenoCrusherChargable
    setDamage:
      types:
        Structural: 750

