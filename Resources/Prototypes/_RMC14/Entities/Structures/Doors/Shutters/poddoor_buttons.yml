- type: entity
  id: RMCPodDoorButton
  name: 按钮
  description: 用于门的遥控开关。
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
  components:
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _RMC14/Objects/door_button.rsi
    layers:
    - state: doorctrl
      map: ["enum.RMCPodDoorButtonLayers.Animation"]
    - state: doorctrl-p
      visible: false
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Clickable
  - type: InteractionOutline
  - type: WallMount
    arc: 360
  - type: RMCDoorButton
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          true: {visible: false}
          false: {visible: true}
  - type: ApcPowerReceiver
    powerLoad: 4 # CMU14
  - type: RMCPowerReceiver
    idleLoad: 2
    activeLoad: 4
    channel: Environment
  - type: RMCMesonsNonviewable

