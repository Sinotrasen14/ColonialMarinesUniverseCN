- type: entity
  id: RMCPropIlluminator
  name: UE-92/B区域照明灯
  description: UE-92的变体，一种大型可部署泛光灯。此版本功率较低，但内置电源，使其无需连接发电机即可运行数小时。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    noRot: true
  - type: Physics
    bodyType: Static
    fixedRotation: true
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 190
        layer:
        - MobMask
  - type: Sprite
    sprite: _RMC14/Structures/illuminator.rsi
    state: illuminator
    offset: 0, 1
  - type: DeleteOnExplosion
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Clickable
  - type: InteractionOutline
  - type: Corrodible
    isCorrodible: false

- type: entity
  parent: RMCPropIlluminator
  id: RMCPropIlluminatorOn
  suffix: On
  components:
  - type: PointLight
    enabled: true
    radius: 6
    netsync: false
    energy: 2
    offset: "0, 1"
    color: "#ECFFFF"
    lightMask: ConeQuad
  - type: Sprite
    state: illuminator_on
