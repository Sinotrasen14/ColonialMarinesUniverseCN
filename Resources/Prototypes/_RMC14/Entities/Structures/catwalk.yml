# Monorail

- type: entity
  id: RMCMonorailStraight
  name: 单轨轨道
  description: CORSAT 单轨的轨道系统。
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: Sprite
    sprite: _RMC14/Structures/catwalk.rsi
    drawdepth: FloorTiles
    state: monorailStraight
    noRot: false
  - type: Icon
    sprite: _RMC14/Structures/catwalk.rsi
    state: monorailStraight
  - type: Transform
    anchored: true
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCatwalk
      params:
        volume: 8
  - type: Tag
    tags:
    - Catwalk

- type: entity
  parent: RMCMonorailStraight
  id: RMCMonorailBend
  components:
