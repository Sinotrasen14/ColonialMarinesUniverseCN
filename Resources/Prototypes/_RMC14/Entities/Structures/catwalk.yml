    sprite: _RMC14/Structures/catwalk.rsi
    drawdepth: FloorTiles
    state: monorailBend
  - type: Icon
    sprite: _RMC14/Structures/catwalk.rsi
    state: monorailBend

# Minecart Track

- type: entity
  parent: RMCMonorailStraight
  id: RMCRailroadStraight
  name: 铁轨
  description: 矿车和轨道车辆在上面行驶。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/catwalk.rsi
    drawdepth: FloorTiles
    state: railroadStraight
  - type: Icon
    sprite: _RMC14/Structures/catwalk.rsi
    state: railroadStraight

- type: entity
  parent: RMCRailroadStraight
  id: RMCRailroadBend
