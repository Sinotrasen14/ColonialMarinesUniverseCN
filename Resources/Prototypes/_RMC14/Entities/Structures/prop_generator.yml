- type: entity # from what i can tell this is supposed to be indestructible
  id: RMCPropGenerator
  name: 已消耗的 UE-11 发电机单元
  description: 一种特殊电源模块，设计用于在变压器故障时作为备用发电机。该发电机已消耗。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    noRot: true
  - type: Physics
    bodyType: Static
    fixedRotation: true
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.45"
        density: 190
        layer:
        - MobMask
  - type: Sprite
    sprite: _RMC14/Structures/prop_generator.rsi
    state: tyrargo_gen
  - type: Clickable
  - type: InteractionOutline
  - type: Corrodible
    isCorrodible: false
  - type: RequireProjectileTarget
