- type: entity
  id: RMCLadder
  name: 梯子
  description: 一个坚固的金属梯子。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _RMC14/Structures/ladder.rsi
    drawdepth: WallTops
    state: ladderdown
  - type: PlacementReplacement
    key: ladders
  - type: Ladder
  - type: BlockXenoConstruction
  - type: RMCMesonsNonviewable
  - type: RMCIgnoreGhostInteractionLimits

- type: entity
  parent: RMCLadder
  id: RMCLadderUp
  suffix: Up
  components:
  - type: Sprite
    state: ladderup

- type: entity
  parent: RMCLadder
  id: RMCLadderThrough
  suffix: Through
  components:
  - type: Sprite
    state: ladder11

- type: entity
  parent: RMCLadder
  id: RMCLadderHatch
  suffix: Hatch
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_tunnel.rsi
    state: maintenancehatch_alt
    offset: 0, 0.2

- type: entity
  parent: RMCLadder
  id: RMCLadderRope
  name: 绳索
  description: 一根结实的绳索。
  components:
  - type: Sprite
    state: rope

- type: entity
  parent: RMCLadderRope
  id: RMCLadderRopeAltDrawdepth
  suffix: Layers over Platforms
  components:
  - type: Sprite
    drawdepth: SmallObjects

- type: entity
  id: CMUZLevelLadderBase
  abstract: true
  name: Z层梯子
  description: 一架坚固的金属梯子，可在Z层之间通行。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    gridTraversal: false # CMU14: fixed ladders must not transfer to passing dropship grids
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _RMC14/Structures/ladder.rsi
    drawdepth: WallTops
    state: ladder11
  - type: PlacementReplacement
    key: ladders
  - type: BlockXenoConstruction
  - type: RMCMesonsNonviewable
  - type: RMCIgnoreGhostInteractionLimits

- type: entity
  parent: CMUZLevelLadderBase
  id: CMUZLevelLadderThrough
  suffix: Z-Level, Up
  components:
  - type: CMUZLevelLadder
    canMoveUp: true
    canMoveDown: false
    offset: 1
    landingLocalPosition: 0.05
  - type: CMUZLevelHighGround
    heightCurve:
    - 1.05
    - 1.05
    stick: true
    supportOnlyFromAbove: true

- type: entity
  parent: CMUZLevelLadderBase
  id: CMUZLevelLadderThroughDown
  suffix: Z-Level, Down
  components:
  - type: CMUZLevelLadder
    canMoveUp: false
    canMoveDown: true
    offset: -1
    landingLocalPosition: 0


- type: entity
  parent: CMUZLevelLadderThrough
  id: CMUZLevelLadderThroughUp1
  components:
  - type: Sprite
    sprite: _RMC14/Structures/ladder.rsi
    drawdepth: WallTops
    state: ladder10

- type: entity
  parent: CMUZLevelLadderThroughDown
  id: CMUZLevelLadderThroughDown1
  components:
  - type: Sprite
    sprite: _RMC14/Structures/ladder.rsi
    drawdepth: WallTops
    state: ladder10


- type: entity
  parent: CMUZLevelLadderThrough
  id: CMUZLevelLadderThroughUp2
  components:
  - type: Sprite
    sprite: _RMC14/Structures/ladder.rsi
    drawdepth: WallTops
    state: ladder00

- type: entity
  parent: CMUZLevelLadderThroughDown
  id: CMUZLevelLadderThroughDown2
  components:
  - type: Sprite
    sprite: _RMC14/Structures/ladder.rsi
    drawdepth: WallTops
    state: ladder00

- type: entity
  parent: CMUZLevelLadderThrough
  id: CMUZLevelLadderThroughUp3
  components:
  - type: Sprite
    sprite: _RMC14/Structures/ladder.rsi
    drawdepth: WallTops
    state: ladderup

- type: entity
  parent: CMUZLevelLadderThroughDown
  id: CMUZLevelLadderThroughDown3
  components:
  - type: Sprite
    sprite: _RMC14/Structures/ladder.rsi
    drawdepth: WallTops
    state: ladderdown

- type: entity
  parent: CMUZLevelLadderThrough
  id: CMUZLevelRopeThroughUp
  name: 跨Z层绳索
  description: 一条可攀爬的绳索，可在Z层之间穿行。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/ladder.rsi
    drawdepth: WallTops
    state: rope

- type: entity
  parent: CMUZLevelLadderThroughDown
  id: CMUZLevelRopeThroughDown2
  name: Z层绳索
  description: 一条可在Z层之间穿行的可攀爬绳索。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/ladder.rsi
    drawdepth: WallTops
    state: rope

- type: entity
  parent: CMUZLevelLadderThroughDown
  id: CMUZLevelHatchThroughDown
  name: Z层舱口
  description: 一个在Z层之间穿行的舱口入口。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_tunnel.rsi
    drawdepth: WallTops
    state: maintenancehatch_alt
    offset: 0, 0.2

- type: entity
  parent: CMUZLevelLadderThroughDown
  id: CMUZLevelManholeThroughDown
  name: Z层井盖入口
  description: 一个在Z层之间穿过的井盖入口。
  components:
  - type: Sprite
    sprite: CMU14/Structures/ladders.rsi
    drawdepth: WallTops
    state: wymanhole_open3

- type: entity
  parent: CMUZLevelLadderThroughDown
  id: CMUZLevelManholeCoveredThroughDown
  name: Z轴层级检修井入口
  description: 一个穿行于Z轴层级之间的检修井入口。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_tunnel.rsi
    drawdepth: WallTops
    state: wymanhole
