# Couch
- type: entity
  parent: SeatBase
  id: RMCBenchLeft
  name: 长椅
  description: 金属框架，座椅包有人造革，它们已随时间褪色。
  suffix: Left
  placement:
    mode: SnapgridCenter
  components:
  - type: CMUReconFurniture
    material: BenchLeft
  - type: Strap
    enabled: false
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/bench.rsi
    state: bench_left
  - type: Damageable
    damageModifierSet: StructuralMarine
  - type: Injurable
    damageContainer: StructuralMarine
  - type: MeleeReceivedMultiplier
    xenoDamage:
      types:
        Slash: 51
    otherMultiplier: 1
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: RMCBenchLeft
  id: RMCBenchRight
  suffix: Right
  components:
  - type: CMUReconFurniture
    material: BenchRight
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/bench.rsi
    state: bench_right
