- type: entity
  parent: Bookshelf
  id: RMCBookcase
  name: 书柜
  components:
  - type: CMUReconFurniture
    material: Bookcase
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/bookshelf.rsi
    snapCardinals: true
    layers:
    - state: book-0
    - map: ["enum.StorageFillLayers.Fill"]
  - type: Appearance
  - type: StorageFillVisualizer
    maxFillLevels: 5
    fillBaseName: book
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Storage
    grid:
    - 0,0,15,1
  - type: Occluder
    enabled: false
  - type: RMCMesonsNonviewable
  - type: Flamability
    chance: 0.9
    rate: 4.0
    spread: 1.5
    burnDurationMin: 70
    burnDurationMax: 620

- type: entity
  parent: RMCBookcase
