- type: entity
  id: CMShower
  name: 淋浴器
  suffix: Empty
  description: HS-451。由 WeYa 卫生部门于 2050 年代安装。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/shower.rsi
    layers:
    - state: shower
  - type: Clickable
  - type: InteractionOutline
  - type: Appearance
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger: !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: InteractionPopup
    interactDelay: 3
    successChance: 1
    interactSuccessSound:
      path: /Audio/Ambience/Objects/drain.ogg
      params:
        variation: 0.250
        volume: -5
  - type: RMCMesonsNonviewable
