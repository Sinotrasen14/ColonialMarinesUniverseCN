- type: Tag
  id: CMRollerItem

- type: Tag
  id: CMRollerBed

- type: entity
  id: RMCRollerBedDestruction
  abstract: true
  components:
  - type: Damageable
    damageModifierSet: StructuralMarine
  - type: Injurable
    damageContainer: StructuralMarine
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: ReceiverXenoClaws
    minimumClawStrength: Normal
    hitsToDestroy: 1
  - type: Construction
    graph: RMCRollerBed
    node: Metal

- type: entity
  parent: [RMCRollerBedDestruction, RollerBed]
  id: CMRollerBed
  name: 轮床
  description: 可折叠且便于随身携带的轮床。
  components:
  - type: Tag
    tags:
    - CMRollerItem
    - CMRollerBed
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/rollerbeds.rsi
    noRot: true
    layers:
    - state: roller_down
      map: ["unfoldedLayer"]
    - state: folded
      map: ["foldedLayer"]
      visible: false
    - state: roller_up
      map: ["buckledLayer"]
      visible: false
  - type: Item
    size: Small
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: GenericVisualizer
    visuals:
      enum.StrapVisuals.State:
        buckledLayer:
          true: {visible: true}
          false: {visible: false}
      enum.FoldedVisuals.State:
        foldedLayer:
          true: {visible: true}
          false: {visible: false}
        unfoldedLayer:
          true: {visible: false}
          false: {visible: true}
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: Clothing
    quickEquip: false
    slots:
    - suitstorage
  - type: Foldable
    fitIntoEntityStorage: true
  - type: RMCStrapNoDrawDepthChange
  - type: RMCRetargetBucklePull
  - type: PhysicalComposition
    materialComposition:
      RMCPlastic: 5000

- type: entity
  parent: CMRollerBed
  id: CMRollerBedSpawnFolded
  suffix: folded
  components:
  - type: Foldable
    folded: true
  - type: Strap
    enabled: false

- type: entity
  parent: CMRollerBed
  id: CMPortableSurgicalBed
  name: 便携式手术床
  description: 一张可折叠的手术床。它并不完美，但除非有真正的手术台，否则这已经是你所能得到的最好的了。
  components:
  - type: Item
    heldPrefix: surgical
  - type: Sprite
    layers:
    - state: surgical_down
      map: ["unfoldedLayer"]
    - state: surgical_folded
      map: ["foldedLayer"]
      visible: false
    - state: surgical_up
      map: ["buckledLayer"]
      visible: false
  - type: Appearance
  - type: ReceiverXenoClaws
    minimumClawStrength: ImpossiblySharp
  - type: PhysicalComposition
    materialComposition:
      RMCPlastic: 6000

- type: entity
  parent: CMPortableSurgicalBed
  id: CMPortableSurgicalBedSpawnFolded
  suffix: folded
  components:
  - type: Foldable
    folded: true
  - type: Strap
    enabled: false

# Copied most of RollerBed prototype except for pullable
- type: entity
  parent: [RMCRollerBedDestruction, BaseDeployFoldable]
  id: RMCMedevacStretcher
  name: 医疗后送担架
  description: 一种可折叠担架，激活后可将患者送往头顶的运输机。
  components:
  - type: Item
    size: Small
    heldPrefix: stretcher
  - type: Clickable
  - type: InteractionOutline
  - type: CollisionWake
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/rollerbeds.rsi
    noRot: true
    drawdepth: OverMobs
    layers:
    - state: stretcher_down
      map: ["unfoldedLayer"]
    - state: stretcher_folded
      map: ["foldedLayer"]
      visible: false
    - state: stretcher_box
      map: ["buckledLayer"]
      visible: false
    - state: beacon_active_up
      map: ["buckledBeaconLayer"]
      visible: false
    - state: winched_stretcher
      map: ["stretcherAnimatedLayer"]
      visible: false
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 80
        mask:
        - MobMask
  - type: Strap
    position: Down
    rotation: -90
    buckleOffset: "0,0.15"
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StrapVisuals.State:
        buckledLayer:
          true: {visible: true}
          false: {visible: false}
      enum.FoldedVisuals.State: # Copypasta from BaseFoldable b/c collections don't merge when overriding component prototypes.
        foldedLayer:
          true: {visible: true}
          false: {visible: false}
        unfoldedLayer:
          true: {visible: false}
          false: {visible: true}
      enum.MedevacStretcherVisuals.BeaconState:
        buckledBeaconLayer:
          On: {visible: true}
          Off: {visible: false}
      enum.MedevacStretcherVisuals.MedevacingState:
        buckledLayer:
          true: {state: winched_stretcher}
          false: {state: stretcher_box}
  - type: Corrodible
  - type: MedevacStretcher
  - type: Tag
    tags:
    - CMRollerItem
  - type: ReceiverXenoClaws
    minimumClawStrength: ImpossiblySharp
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 5000
      RMCPlastic: 5000

- type: entity
  parent: RMCMedevacStretcher
  id: RMCMedevacStretcherFolded
  suffix: folded
  components:
  - type: Foldable
    folded: true
  - type: Strap
    enabled: false

# Hospital Bed

- type: entity
  parent: CMRollerBed
  id: RMCRollerBedHospital
  name: 医院滚轮床
  description: 一块搁在小框架上的简易软垫皮革板。一点也不舒服，但能让病人在被迅速转移到别处时躺下休息。不太适合做手术，但聊胜于无。
  components:
  - type: Sprite
    layers:
    - state: bigroller_down
      map: ["unfoldedLayer"]
    - state: surgical_folded
      map: ["foldedLayer"]
      visible: false
    - state: bigroller_up
