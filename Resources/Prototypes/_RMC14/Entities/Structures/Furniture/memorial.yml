# TODO RMC14 make dogtag names be show at the endscreen + memorial ghosts
- type: entity
  parent: Memorial
  id: CMMemorialBase
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/memorial.rsi
    state: ship_memorial
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-1.50,-0.10,0.50,0.50"
        density: 85
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: Corrodible
    isCorrodible: false
  - type: RMCMesonsNonviewable

- type: entity
  parent: CMMemorialBase
  id: CMMemorial
  name: 胜利石板
  description: 一座舰船纪念碑，献给海军陆战队的胜利以及这艘舰船上阵亡的陆战队员。左侧的胜利石板上镌刻着辉煌的胜利故事。右侧列有在服役于海军陆战队期间阵亡的著名陆战队员名单。
  components:
  - type: RMCMemorial

- type: entity
  parent: CMMemorialBase
  id: CMMemorialMaintainers
  name: 纪念石板
  description: 一块纪念所有已从Colonial Marines Universe工作中退休的维护团队成员的纪念石板。

- type: entity
  parent: CMMemorialMaintainers
  id: CMMemorialAdmins
  description: 纪念所有已从 Colonial Marines Universe 退休的管理员和版主。

- type: entity
  parent: CMMemorial
  id: RMCMemorialWall
  components:
  - type: Sprite
    state: ship_memorial_wall
    offset: 0.5,0
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb {}
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: WallMount
    arc: 360
  - type: Physics
    bodyType: Static
    canCollide: false
