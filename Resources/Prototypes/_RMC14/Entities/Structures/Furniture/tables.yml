# Basic
- type: entity
  parent: TableBase
  id: CMTable
  name: 桌子
  description: 一个由四条腿支撑的方形金属表面。可用来放置物品。
  components:
  - type: ResinClearable # CMU14
  - type: CMUReconFurniture
    material: Table
  - type: VehicleSmashable
  - type: Corrodible
    timeToApply: 4
    structure: true
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/Tables/standard.rsi
  - type: Icon
    sprite: _RMC14/Structures/Furniture/Tables/standard.rsi
    state: full
  - type: Damageable
    damageModifierSet:
  - type: Injurable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -4
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: RMCTable
    node: Tan
  - type: DamageMultiplierFlags
    flags: Breaching
  - type: XenoLeapDestroyOnPass
  - type: XenoToggleChargingDamage
    destroy: true
  - type: XenoCrusherChargable
    instantDestroy: true
    passOnDestroy: true
  - type: RMCMesonsNonviewable
  - type: Flamability
    chance: 0.04
    rate: 0.15
    spread: 0.1
    range: 0.5
    burnDurationMin: 70
    burnDurationMax: 620

- type: entity
  parent: CMTable
  id: RMCTableBrown
  suffix: Brown
  components:
  - type: Sprite
    color: "#8B7B5B"

- type: entity
  parent: BaseStructure
  id: RMCLargeTable
  name: 桌子
  description: 一个由四条腿支撑的方形金属台面。可以用来放置物品。
  abstract: true
  components:
  - type: Corrodible
    timeToApply: 4
    structure: true
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/Tables/standard.rsi
    state: full
    offset: 0.5, 0.5
  - type: Icon
    sprite: _RMC14/Structures/Furniture/Tables/standard.rsi
    state: full
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -4
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: DamageMultiplierFlags
    flags: Breaching
  - type: XenoLeapDestroyOnPass
  - type: XenoToggleChargingDamage
    destroy: true
  - type: Animateable
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: PlaceableSurface
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,1.45,0.45"
        density: 55
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: SpriteFade
  - type: Climbable
  - type: Bonkable
    bonkDamage:
      types:
        Blunt: 4
  - type: Clickable
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepHull
  - type: Tag
    tags:
    - ForceFixRotations

# Reinforced
- type: entity
  parent: CMTable
  id: CMTableReinforced
  name: 加固桌
  description: 一个由四条腿支撑的方形金属台面。它带有侧板，因此可用作书桌。
  components:
  - type: CMUReconFurniture
    material: Desk
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/Tables/reinforced.rsi
  - type: Icon
    sprite: _RMC14/Structures/Furniture/Tables/reinforced.rsi
  - type: Construction
    graph: RMCTable
    node: Reinforced
  - type: RMCWeldEffectSource
    startingOffset: -0.35, -0.35
    pathOffsets:
    - -0.35, -0.35
    - 0.35, -0.35
    - 0.35, 0.35
    - -0.35, 0.35
    - -0.35, -0.35
  - type: XenoLeapDestroyOnPass
    spawnPrototype: CMRodMetal1 # TODO 50% to spawn 2, 50% to spawn 0

