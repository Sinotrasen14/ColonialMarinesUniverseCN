# Couch
- type: entity
  parent: SeatBase
  id: RMCCouchMid
  name: 沙发
  description: 一件瑞典平板包装家具，不过别向MTs要内六角扳手。
  suffix: Mid, Double
  placement:
    mode: SnapgridCenter
  components:
  - type: CMUReconFurniture
    material: CouchMiddle
  - type: VehicleSmashable
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/Couches/couch.rsi
    state: couch_mid
  - type: RMCMesonsNonviewable
  - type: BlockXenoConstruction
  - type: Damageable
    damageModifierSet: StructuralMarine
  - type: Injurable
    damageContainer: StructuralMarine
  - type: MeleeReceivedMultiplier
    xenoDamage:
      types:
        Slash: 51
    otherMultiplier: 1
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Flamability
    chance: 0.7
    rate: 2.5
    spread: 1.2
    burnDurationMin: 70
    burnDurationMax: 620

- type: entity
  parent: RMCCouchMid
  id: RMCCouchEnd
  suffix: End, Double
  components:
  - type: CMUReconFurniture
    material: CouchLeft
  - type: Sprite
    state: couch_end

