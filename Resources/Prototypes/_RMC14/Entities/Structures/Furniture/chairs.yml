# Wooden chair
- type: entity
  parent: CMSeatBase
  id: CMChairWood
  name: 木椅
  description: 旧永远不会老到不再时尚。
  components:
  - type: CMUReconFurniture
    material: WoodChair
  - type: Sprite
    state: wooden_chair
  - type: RMCStrapNoDrawDepthChange
  - type: Damageable
    damageModifierSet: Wood
  - type: Tag
    tags:
    - Wooden
  - type: StaticPrice
    price: 75
  - type: Appearance
  - type: Flamability
    chance: 1.0
    rate: 0.4
    range: 0.7
    spread: 1.0
  - type: MeleeReceivedMultiplier
    xenoDamage:
      types:
        Slash: 51
    otherMultiplier: 1
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          RMCPlankWood1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: CMChairWood
  id: CMChairWoodWings
  description: 旧事物永远不会因为太旧而不再时尚。
  components:
  - type: CMUReconFurniture
    material: WoodWingChair
  - type: Sprite
    state: wooden_chair_wings
