# Basic chair
- type: Tag
  id: RMCSeat

- type: entity
  abstract: true
  parent: SeatBase
  id: CMSeatBase
  name: 抽象椅子
  suffix: RMC
  components:
  - type: ResinClearable # CMU14
  - type: CMUReconFurniture
    material: Chair
  - type: CMUZPhysics
  - type: Corrodible
    timeToApply: 4
    structure: true
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/chairs.rsi
    state: chair
  - type: Tag
    tags:
    - RMCSeat
  - type: RMCMesonsNonviewable
  - type: Damageable
    damageModifierSet: StructuralMarine
  - type: Injurable
    damageContainer: StructuralMarine
  - type: MeleeReceivedMultiplier
    xenoDamage:
      types:
        Slash: 51
    otherMultiplier: 1
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  parent: [CMSeatBase, ChairFolding]
  id: CMChair
  name: 椅子
  description: 一个带有靠背板的矩形金属框架，由四条腿支撑。其设计旨在适配坐姿，坐起来或多或少还算舒适。
  components:
  - type: CMUReconFurniture
    material: FoldingChair
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Foldable
    anchorOnUnfold: true
  - type: RMCStrapNoDrawDepthChange
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/folding_chair.rsi
    layers:
    - state: chair
      map: ["unfoldedLayer"]
    - state: chair_folded
      map: ["foldedLayer"]
      visible: false
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 1
    soundHit:
      path: /Audio/_RMC14/Items/metal_chair_clang.ogg
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 10
  - type: Construction
    graph: CMSeat
    node: chair
  - type: RMCStaminaDamageOnHit
    requiresWield: true
    damage: 17

- type: entity
  parent: CMChair
  id: CMChairFolded
  suffix: RMC|folded
  components:
  - type: Foldable
    folded: true
  - type: Strap
    enabled: false

- type: entity
  parent: CMSeatBase
  id: CMChairNonFold
  abstract: true
  name: 椅子
  description: 一个带有靠背板的矩形金属框架，置于四条腿上。设计用于贴合坐姿，或多或少较为舒适。
  components:
  - type: Transform
    anchored: false
  - type: RMCStrapNoDrawDepthChange
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/chairs.rsi
    state: chair
  - type: Physics
    bodyType: Static
  - type: Construction
    graph: CMSeat
    node: chair

- type: entity
  parent: CMChairNonFold
  id: CMChairAlt
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/chairs.rsi
    state: chair_alt

- type: entity
  parent: CMChairNonFold
  id: RMCStool
  name: 凳子
  description: 把屁股放上去。
  components:
  - type: CMUReconFurniture
    material: Stool
  - type: Sprite
    state: stool
  - type: Construction
    graph: CMSeat
    node: stool

# Comfy chair
- type: entity
  parent: CMSeatBase
  id: CMChairComfy
  name: 舒适的椅子
  description: 一把配有皮革软垫和可调节头枕的椅子。你大概能在这类椅子上坐很久。
  placement:
    mode: SnapgridCenter
  components:
  - type: CMUReconFurniture
    material: Armchair
  - type: Sprite
    state: comfychair
  - type: RMCStrapNoDrawDepthChange
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Construction
    graph: CMSeat
    node: chairComfy

- type: entity
  parent: CMChairComfy
  id: CMChairComfyARES
  description: 一把功能性座椅，设计用于让单人舒适地坐着，旨在促进与飞船人工智能的互动。
  suffix: RMC|ARES
  components:
  - type: Sprite
    state: comfychair_ares

- type: entity
  parent: CMChairComfyARES
  id: RMCChairComfyAI
  name: AI界面椅
  suffix: RMC|AI
  components:
  - type: Sprite
    state: ai_interface_chair

- type: entity
  parent: CMChairComfy
  id: CMChairComfyBeige
  suffix: RMC|Beige
  components:
  - type: Sprite
    state: comfychair_beige

- type: entity
  parent: CMChairComfy
  id: CMChairComfyBlack
  suffix: RMC|Black
  components:
  - type: Sprite
    state: comfychair_black

- type: entity
  parent: CMChairComfy
  id: CMChairComfyBlue
  suffix: RMC|Blue
  components:
  - type: Sprite
    state: comfychair_blue

- type: entity
  parent: CMChairComfy
  id: CMChairComfyLime
  suffix: RMC|Lime
  components:
  - type: Sprite
    state: comfychair_lime

- type: entity
  parent: CMChairComfy
  id: CMChairComfyOrange
  suffix: RMC|Orange
  components:
  - type: Sprite
    state: comfychair_orange

- type: entity
  parent: CMChairComfy
  id: CMChairComfyTeal
  suffix: RMC|Teal
  components:
  - type: Sprite
    state: comfychair_teal

- type: entity
  parent: CMChairComfy
  id: CMChairComfyAlpha
  description: 一把简单的椅子，永久固定在地板上，旋转部件已被拆除，以迫使注意力难以持久的士兵在简报期间保持不动。表面覆着吱嘎作响且硬得过分的人造革，用阿尔法小队红色涂得深浅不均。只供最勇敢、最新入伍的海军陆战队新兵使用。
  suffix: RMC|Alpha
  components:
  - type: Sprite
    state: comfychair_alpha

- type: entity
  parent: CMChairComfy
  id: CMChairComfyBravo
  description: 一张永久固定在地板上的简易椅子，旋转部件已被拆除，以迫使注意力不集中的士兵在简报期间保持不动。表面覆盖着吱嘎作响且硬得离谱的人造革，涂着不均匀的布拉沃小队棕色。经认证四面加固，可抵御敌军入侵。
  suffix: RMC|Bravo
  components:
  - type: Sprite
    state: comfychair_bravo

- type: entity
  parent: CMChairComfy
  id: CMChairComfyCharlie
  description: 一把简单的椅子，永久固定在地板上，旋转部件被拆掉，以迫使注意力持续时间短的士兵在简报期间保持不动。表面覆盖着吱吱作响且硬得要命的人造革，被不均匀地漆成查理小队紫色。若没有一顿丰盛的早餐与之相伴，就显得格格不入。
  suffix: RMC|Charlie
  components:
  - type: Sprite
    state: comfychair_charlie

- type: entity
  parent: CMChairComfy
  id: CMChairComfyDelta
  description: 一把简单的椅子，永久固定在地板上，旋转部件已被拆除，以迫使注意力不集中的士兵在简报期间保持不动。表面覆着吱吱作响且硬得离谱的人造革，用德尔塔小队蓝不均匀地涂装。这把椅子最可能最先投入战斗，也最先阵亡。
  suffix: RMC|Delta
  components:
  - type: Sprite
    state: comfychair_delta

- type: entity
  parent: CMChairComfy
  id: RMCChairComfyAlien
  name: 外星椅子
  suffix: RMC|Alien
  components:
  - type: Sprite
    state: comfychair_alien

# Sofa
