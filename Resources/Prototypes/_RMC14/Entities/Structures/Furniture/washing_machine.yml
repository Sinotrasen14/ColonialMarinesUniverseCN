- type: entity
  id: CMWashingMachine
  parent: BaseStructure
  name: 洗衣机
  description: WM-321 是一款坚固耐用的圆柱形强力设备，配备透明视窗。这一台无法运行。
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.3
        density: 155
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Clickable
  - type: InteractionOutline
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: start
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/washing_machine.rsi
    layers:
    - state: washing_machine_closed
      map: ["enum.OpenableVisuals.Layer"]
    snapCardinals: true
  - type: Openable
    openOnActivate: true
    closeable: true
    sound:
      path: /Audio/Effects/closetopen.ogg
    closeSound:
      path: /Audio/Effects/closetclose.ogg
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          true: {state: washing_machine_open}
          false: {state: washing_machine_closed}
  - type: RMCMesonsNonviewable

- type: entity
  parent: CMWashingMachine
  id: CMWashingMachineDouble
  name: 洗衣机（双缸）
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/washing_machine.rsi
    offset: "0.0,0.09"
    layers:
    - state: washing_machine_double_closed
      map: ["enum.OpenableVisuals.Layer"]
    snapCardinals: true
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          true: {state: washing_machine_double_open}
          false: {state: washing_machine_double_closed}
