## Tyrargo vehicle props
# they don't have collisions here and in CM cause Tyrargo vehicles are all walled off by invisible walls so they don't need it
- type: entity
  abstract: true
  id: RMCPropTyrargoVehicleBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    noRot: false
  - type: Physics
    fixedRotation: false
  - type: Sprite
    sprite: _RMC14/Structures/tyrargo_vehicles.rsi
  - type: Clickable
  - type: InteractionOutline
  - type: Corrodible
    isCorrodible: false

# AD-71E VTOL
- type: entity
  parent: RMCPropTyrargoVehicleBase
  id: RMCPropTyrargoVehicleVTOL
  name: AD-71E垂直起降飞行器
  description: 一架双倾转喷气式垂直起降飞行器，“黑足”是“熊猫”丑陋的大姐姐。她在火力和敏捷性上有所欠缺，却在实用性和“爱的把手”上远远弥补了回来。最初由联合国北岭在联合国领土上测试，“黑足”目前正在进行实战试验。这架飞行器似乎正在接受维护，尚未准备好飞行。
  components:
  - type: Physics
    canCollide: false
  - type: Sprite
    sprite: _RMC14/Structures/Tyrargo_Vehicles/tyrargo_vtol.rsi
    state: vtol

- type: entity
  parent: RMCPropTyrargoVehicleBase
  id: RMCPropTyrargoVehicleVTOLCrashed
  suffix: Crashed
  name: AD-71E垂直起降
  description: 双倾转喷气式垂直起降飞行器“黑脚”是“熊猫”丑陋的大姐姐。她在火力和机动性上的不足，远远被实用性和“游泳圈”弥补了。“黑脚”最初由联合国北岭在联合国领地上进行测试，目前正在进行实战试验。这架飞行器似乎已经坠毁着陆，且无法操作。
  components:
  - type: Physics
    canCollide: false
  - type: Sprite
    sprite: _RMC14/Structures/Tyrargo_Vehicles/tyrargo_vtol.rsi
    state: vtol_damaged

# F-44
- type: entity
  parent: RMCPropTyrargoVehicleBase
  id: RMCPropTyrargoVehicleEvacBlack
  suffix: Black
  name: F-44 空天战斗机
  description: 一种高科技、覆有银色涂层的 F-44 空天战斗机，由 UNMC 用于深度侦察任务。单是那层吸热涂料，造价可能就超过你所在小队全部薪水的总和。然而不幸的是，北部防线被突破时，这架战机正处于维修周期中，因此不得不将它撤离。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Tyrargo_Vehicles/tyrargo_evac.rsi
    state: evac_black
  - type: Physics
    fixedRotation: true
    canCollide: false
- type: entity
  parent: RMCPropTyrargoVehicleBase
  id: RMCPropTyrargoVehicleEvacGreen
  name: F-44 空天战斗机
  suffix: Green
  description: UNMC使用的先进F-44空天战斗机。这架战斗机已风光不再，内部线路严重受损，弹舱维修尚未完成。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Tyrargo_Vehicles/tyrargo_evac.rsi
    state: evac_green
  - type: Physics
    fixedRotation: true

# M887
    canCollide: false
- type: entity
  parent: RMCPropTyrargoVehicleBase
  id: RMCPropTyrargoVehicleTruck
  name: M887 卡车
  description: 一辆小型厢式货车。它是一种紧凑型车辆，带有矩形货厢，通常用于运输货物或小型设备。它采用高车顶和笔直的车身侧面，提供充足的垂直储物空间。其尺寸使其机动灵活，非常适合城市驾驶和狭窄空间。这辆厢式货车似乎已无法使用，可能是因为在近期的疫情爆发期间使用过度。
  components:
  - type: Physics
    canCollide: false
  - type: Sprite
    sprite: _RMC14/Structures/Tyrargo_Vehicles/tyrargo_truck.rsi
    state: truck

