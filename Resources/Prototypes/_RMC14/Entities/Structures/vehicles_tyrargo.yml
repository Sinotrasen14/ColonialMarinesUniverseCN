# Marshal IFV
- type: entity
  parent: RMCPropTyrargoVehicleBase
  id: RMCPropTyrargoVehicleIFV
  name: M34“元帅”步兵战车
  description: 由韦斯顿-山田开发，RAT（漫游者武装运输车）最初是为TSE军方设计的，作为其RT系列远征车辆的武装版本，结果却被联合国海军陆战队采用。它比海军陆战队使用的M570系列更重、更耐用，因为他们不需要能够通过空投船运输的装甲运兵车。
  components:
  - type: Physics
    canCollide: false
  - type: Sprite
    sprite: _RMC14/Structures/Tyrargo_Vehicles/tyrargo_ifv.rsi
    state: ifv

