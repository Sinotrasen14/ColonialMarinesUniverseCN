- type: entity
  id: HiveRecoveryNodeXeno
  parent: BaseHiveStructure
  name: 恢复节点
  description: 一个温暖而令人舒缓的光源，伴随着微弱的嗡嗡声脉动。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/hive_structures.rsi
    state: recovery
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: MeleeReceivedMultiplier
    xenoDamage:
      types:
        Slash: 100
  - type: RecoveryNode
  - type: HiveConstructionRequiresHiveCore
  - type: HiveConstructionLimited
    id: HiveRecoveryNodeXeno
  - type: HiveConstructionRequiresHiveWeeds
  - type: HiveConstructionRequiresSpace
  - type: DoAfter
  - type: XenoStructureMapTracked
  - type: TacticalMapTracked
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: recovery_node

- type: entity
  id: HiveRecoveryNodeXenoConstructionNode
  parent: BaseHiveStructureNode
  name: 恢复节点
  description: 一种温暖、舒缓的光源，伴随着微弱的嗡鸣声脉动。看起来像是某种事物的标记。
  suffix: Construction
  components:
  - type: Sprite
    color: '#FFFFFFAA'
    layers:
    - sprite: _RMC14/Structures/Xenos/hive_structures.rsi
      state: recovery
    - sprite: _RMC14/Interface/xeno_hud.rsi
      state: xeno_structure_node_indicator
      scale: 0.8, 0.8
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: HiveConstructionNode
    initialPlasmaCost: 400
    plasmaCost: 450
    spawn: HiveRecoveryNodeXeno
  - type: HiveConstructionRequiresHiveCore
  - type: HiveConstructionLimited
    id: HiveRecoveryNodeXeno
  - type: HiveConstructionRequiresHiveWeeds
  - type: HiveConstructionRequiresSpace
  - type: WarpPoint
    location: cmu-warp-location-recovery-node
