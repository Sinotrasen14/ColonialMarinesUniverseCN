- type: entity
  id: XenoTunnel
  name: 隧道
  description: 一个隧道入口。看起来像是某种有爪的野兽挖出来的。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_tunnel.rsi
    state: hole
    noRot: true
  - type: InteractionOutline
  - type: Clickable
  - type: RMCNightVisionVisible
    priority: -1
    transparency: 0.2
  - type: DestroyedByExplosionType
    explosion: RMCOBXenoTunnel
  - type: RMCMesonsNonviewable
    xenoVisible: true
  - type: XenoTunnel
  - type: NpcFactionMember # CMU14: hostile structure, valid sentry/turret target
    factions:
    - RMCXeno
  - type: XenoStructureMapTracked
  - type: TacticalMapTracked
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: xenotunnel
  - type: TacticalMapAlwaysVisible
    visibleToXenos: true
    visibleAsXenoStructure: true
    visibleToMarines: false
  - type: UserInterface
    interfaces:
      enum.SelectDestinationTunnelUI.Key:
        type: SelectDestinationTunnelBui
      enum.NameTunnelUI.Key:
        type: NameTunnelBui
  - type: DeletedByWeedKiller
  - type: XenoFriendly
  - type: RMCTrackable

- type: entity
  parent: XenoTunnel
  id: XenoTunnelMaint
  name: 维修舱口
  description: 维修舱口的描述：通往维修隧道的入口。你可以在里面看到一些黏液和树脂。碎片残骸让你无法进一步查看。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_tunnel.rsi
    state: maintenancehatch_alt

- type: entity
  parent: XenoTunnelMaint
  id: XenoTunnelMaintNoXenoDesc
  description: 维修隧道的入口。散落的碎片让你无法靠近细看。
  suffix: No Xeno Desc

- type: entity
  parent: XenoTunnelMaint
  id: XenoTunnelMaintHybrisa
  name: 下水道检查井
  components:
  - type: Sprite
    state: wymanhole

- type: entity
  parent: XenoTunnelMaintNoXenoDesc
  id: XenoTunnelMaintHybrisaNoXenoDesc
  name: 下水道检查井
  components:
  - type: Sprite
    state: wymanhole
