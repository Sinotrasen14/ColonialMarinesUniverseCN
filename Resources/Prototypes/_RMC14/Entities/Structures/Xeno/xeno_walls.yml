- type: entity
  parent: CMBaseWallXeno
  id: WallXenoResin
  name: 树脂墙
  description: 奇怪的黏液凝固成了一堵墙。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
  - type: Icon
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
    state: resin
  - type: IconSmooth
    key: walls
    base: resin
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 900
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: VehicleSmashable
    deleteOnHit: true
    damageOnHit: 900
    # CMU14: xeno feedback and lifecycle.
    selfDamageMultiplier: 0.25
    slowdownMultiplier: 0.2
    slowdownDuration: 1.5
    requiredVehicleTag: VehicleHeavy
    smashSound:
      collection: XenoResinBreak
  - type: XenoNestSurface
  - type: XenoConstructionMinRange
  - type: XenoConstructionPlasmaCost
    plasma: 120
    scalingCost: true
  - type: XenoStructureUpgradeable
    to: WallXenoResinThick
    cost: 50
  - type: Appearance
  - type: Flamability
    chance: 1.0
    rate: 15.0
    range: 0.8
    spread: 0.8
  - type: MeleeReceivedMultiplier
    xenoDamage:
      types:
        Slash: 225

- type: entity
  parent: WallXenoResinThick
  id: WallXenoResinImpenetrable
  name: 不可穿透的树脂墙
  description: 完全无敌。经过足够时间后，它应该会退化为可受伤的状态。
  suffix: Invincible, 25 minutes
  components:
  - type: InvincibleHiveStructure
    replace: WallXenoResinThick

- type: entity
  parent: DoorXenoResinThick
  id: DoorXenoResinImpenetrable
  name: 坚不可摧的树脂门
  description: 完全不可摧毁。经过足够时间后，它应该会退化为可被破坏的状态。
  suffix: Invincible, 25 minutes
  components:
  - type: InvincibleHiveStructure
    replace: DoorXenoResinThick
    blockerId: RMCBlockerMarine

- type: entity
  id: RMCBlockerMarine
  name: 海洋阻断剂
  suffix: DO NOT MAP
  categories: [HideSpawnMenu]
  components:
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49" # don't want this colliding with walls or they won't close
        density: 100
        mask:
        - MobMask
  - type: XenoStunnedPreventCollision

- type: entity
  parent: WallXenoResin
  id: WallXenoResinThick
  name: 厚树脂墙
  description: 奇怪的黏液凝固成了一堵厚墙。
  components:
  - type: VehicleReinforcedObstacle
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
  - type: Icon
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
    state: thickresin
  - type: IconSmooth
    key: walls
    base: thickresin
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 1350
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: VehicleSmashable
    deleteOnHit: true
    damageOnHit: 1350
    selfDamageMultiplier: 1.2
    slowdownMultiplier: 0.2
    slowdownDuration: 1.5
    requiredVehicleTag: VehicleHeavy
    smashSound:
      collection: XenoResinBreak
  - type: Flamability
    chance: 0.8
    rate: 22.5
    range: 0.7
    spread: 0.6
  - type: MeleeReceivedMultiplier
    xenoDamage:
      types:
        Slash: 338
  - type: XenoConstructionPlasmaCost
    plasma: 170
    scalingCost: true
  - type: XenoStructureUpgradeable
    to:

