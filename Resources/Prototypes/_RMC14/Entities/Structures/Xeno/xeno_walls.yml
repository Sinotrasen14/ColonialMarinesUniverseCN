  parent: WallXenoResin
  id: BaseWallXenoResinReflective
  name: 反光树脂墙
  description: 奇怪的硬化黏液凝固成了一面细腻光滑的墙。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/bone_resin.rsi
  - type: Icon
    sprite: _RMC14/Structures/Walls/bone_resin.rsi
    state: bone_resin
  - type: IconSmooth
