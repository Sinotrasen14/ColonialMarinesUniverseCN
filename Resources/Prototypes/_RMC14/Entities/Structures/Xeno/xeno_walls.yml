  id: WallXenoResinReflectiveUnstable
  name: 弱化的反射墙
  description: 奇怪的史莱姆带着奇特的硬化碎片凝固成了一堵墙。看起来它只能维持片刻，随后就会崩塌。
  components:
  - type: TimedDespawn
    lifetime: 13.0
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
