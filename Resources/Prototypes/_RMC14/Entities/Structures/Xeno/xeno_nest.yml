- type: entity
  id: XenoNest
  name: 异形巢穴
  description: 这是一团令人毛骨悚然的、厚重黏稠的树脂，形状像巢穴。
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: FixedIdentity
    name: cmu-job-name-xeno-unknown
    whitelist:
      components:
      - Marine
  - type: Physics
    bodyType: Static
  - type: Appearance
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_weeds.rsi
    state: nest_overlay
    drawdepth: OverMobs
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: Clickable
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralXeno
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: XenoNest
  - type: XenoFriendly
  - type: RMCNightVisionVisible
    priority: 1
