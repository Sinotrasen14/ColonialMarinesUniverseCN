- type: entity
  parent: BaseItem
  id: XenoFruitBase
  abstract: true
  name: 树脂果
  description: 一种本不该存在的果实
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: FixedIdentity
    name: cmu-job-name-xeno-unknown
    whitelist:
      components:
      - Marine
  - type: Appearance
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
      xeno_fruit:
        shape: !type:PhysShapeCircle
          radius: 1.5
        hard: false
        mask:
        - MobLayer
  - type: CollisionWake
    enabled: false
  - type: Flammable
    fireSpread: false
    damage:
      types:
        Heat: 3
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_fruit.rsi
    drawdepth: SmallMobs
    layers:
    - state: fruit_lesser_immature
      map: ["enum.XenoFruitLayers.Base"]
  - type: Item
    size: Large
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralXeno
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger: !type:DamageTypeTrigger
        damageType: Heat
        damage: 60
      behaviors:
      - !type:BurnBodyBehavior {}
  - type: XenoFriendly
  - type: NpcFactionMember # CMU14: hostile structure, valid sentry/turret target
    factions:
    - RMCXeno
  - type: RMCNightVisionVisible
    priority: -1
  - type: Corrodible
    isCorrodible: false
  - type: XenoFruit
    canConsumeAtFull: true
    outlineColor: "#000000FF"
  - type: RMCMesonsNonviewable
    xenoVisible: true

- type: entity
  parent: XenoFruitBase
  id: XenoFruitLesser
  name: 次级树脂果
  description: 一个奇怪的、略带绿色的、看起来像水果的东西。
  components:
  - type: XenoFruit
    itemState: fruit_lesser_item
    growingState: fruit_lesser_immature
    grownState: fruit_lesser
    eatenState: fruit_lesser_spent
    growTime: 15
    popup: rmc-xeno-fruit-effect-lesser
    canConsumeAtFull: false
    outlineColor: "#17991b80"
  - type: XenoFruitHeal
    healAmount: 50

- type: entity
  parent: XenoFruitLesser
  id: XenoFruitGreater
  name: 高级树脂果
  components:
  - type: XenoFruit
    itemState: fruit_greater_item
    growingState: fruit_greater_immature
    grownState: fruit_greater
    eatenState: fruit_greater_spent
    growTime: 30
    popup: rmc-xeno-fruit-effect-greater
    canConsumeAtFull: false
    color: "#17991B"
  - type: XenoFruitHeal
    healAmount: 75
  - type: XenoFruitRegen
    tickCount: 5      # 100 health over 5 seconds
    tickPeriod: 1
    regenPerTick: 20

- type: entity
  parent: XenoFruitBase
  id: XenoFruitUnstable
  name: 不稳定的树脂果
  description: 一个奇怪的蓝绿色、看起来像水果的东西。
  components:
  - type: XenoFruit
    itemState: fruit_unstable_item
    growingState: fruit_unstable_immature
    grownState: fruit_unstable
    eatenState: fruit_unstable_spent
    growTime: 45
    popup: rmc-xeno-fruit-effect-unstable
    color: "#179973"
    outlineColor: "#17997280"
  - type: XenoFruitRegen
    tickCount: 15     # 75 health over 15 seconds
    tickPeriod: 1
    regenPerTick: 5
  - type: XenoFruitShield
    duration: 60
    shieldAmount: 200
    shieldDecay: 10
    shieldRatio: 0.3

- type: entity
  parent: XenoFruitBase
  id: XenoFruitSpore
  name: 孢子树脂果实
  description: 一个看起来像蘑菇的奇怪东西，上面有橙色发光的小囊袋，在怪异的茎秆上上下浮动。
  components:
  - type: XenoFruit
    itemState: fruit_spore_item
    growingState: fruit_spore_immature
    grownState: fruit_spore
    eatenState: fruit_spore_spent
    growTime: 15
    popup: rmc-xeno-fruit-effect-spore
    color: "#994617"
    outlineColor: "#99461780"
  - type: XenoFruitHaste
    duration: 90
    reductionMax: 0.25
    reductionPerSlash: 0.05
  - type: XenoPheromones
    pheromonesMultiplier: 1
  - type: XenoPheromonesObject

- type: entity
  parent: XenoFruitBase
  id: XenoFruitSpeed
  name: 迅捷树脂果
  description: 一个奇怪的、略带紫色的、看起来像水果的东西。
  components:
  - type: XenoFruit
    itemState: fruit_speed_item
    growingState: fruit_speed_immature
    grownState: fruit_speed
    eatenState: fruit_speed_spent
    growTime: 35
    popup: rmc-xeno-fruit-effect-speed
    color: "#5B248C"
    outlineColor: "#9061BA80"
  - type: XenoFruitSpeed
    speedModifier: 0.2

- type: entity
  parent: XenoFruitBase
  id: XenoFruitPlasma
  name: 凝血树脂果
  description: 一个奇怪的偏蓝色水果状物体。
  components:
  - type: XenoFruit
    itemState: fruit_plasma_item
    growingState: fruit_plasma_immature
    grownState: fruit_plasma
    eatenState: fruit_plasma_spent
    growTime: 25
    popup: rmc-xeno-fruit-effect-plasma
    color: "#287A90"
    outlineColor: "#4AACC780"
  - type: XenoFruitPlasma
    tickCount: 5      # 240 plasma over 15 seconds
    tickPeriod: 3
    regenPerTick: 48
