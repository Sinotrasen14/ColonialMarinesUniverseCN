- type: entity
  parent: RMCPropBase
  id: RMCPropTurbine
  name: 动力涡轮
  description: 一台巨大的涡轮机，靠天知道什么东西运转。它或许可以由懂得正确方法的人启动。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Props/biomass_turbine.rsi
    state: biomass_turbine
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-1.5,0.5,1.5"
        density: 190
        layer:
        - MobMask

- type: entity
  parent: RMCPropBase
  id: RMCPropTurbineStrutsRight
  name: 动力涡轮支柱
  suffix: Right
  description: 管道，也许是通向涡轮的支撑杆，又或者是用来支撑那个大大的涡轮的。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Props/biomass_turbine.rsi
    state: support_struts_r
  - type: Physics
    canCollide: false

- type: entity
  parent: RMCPropTurbineStrutsRight
  id: RMCPropTurbineStrutsLeft
  suffix: Left
  components:
  - type: Sprite
    state: support_struts_l

- type: entity
  parent: RMCPropBase
  id: RMCPropTurbineStrutsBorder
  name: 动力涡轮警示条纹
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Props/biomass_turbine.rsi
    state: biomass_turbine_border
  - type: Physics
    canCollide: false
