- type: entity
  parent: CMBarricadeBase
  id: RMCBarricadeWood
  name: 木制路障
  description: 由木板钉合而成的墙。不太坚固，但能提供一些遮蔽。
  components:
  - type: VehicleSmashable
    minDestroyWeightClass: Light
    minContinueWeightClass: Medium
  - type: Sprite
    drawdepth: WallTops
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: wooden
    - map: ["acided"]
  - type: Appearance
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: NailgunRepairable
    # cm13 max_health%: 1
    repairValues:
      RMCWood: 100
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          RMCPlankWood1:
            min: 3
            max: 3
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: BarricadeWoodGraph
    node: nodeWood
  - type: XenoToggleChargingDamage
    sound:
      collection: WoodDestroy
    damage:
      types:
        Blunt: 22
    destroy: true
  - type: XenoCrusherChargable
    instantDestroy: true
  - type: Climbable
  - type: BarricadeBlock
    bidirectional: true
    blocking: 45
