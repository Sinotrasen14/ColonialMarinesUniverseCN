# Base
- type: entity
  abstract: true
  id: RMCBarricadeUpgradeBase
  components:
  - type: RMCConstructionUpgrade
  - type: Sprite
    sprite: _RMC14/Interface/barricade_upgrades.rsi

# Metal
- type: entity
  parent: RMCBarricadeUpgradeBase
  id: RMCExplosiveUpgrade
  name: 复合升级（++爆炸，++投射物，++火焰）
  categories: [HideSpawnMenu]
  components:
  - type: RMCConstructionUpgrade
    upgradedPopup: rmc-construction-upgrade-explosive
    upgradedEntity: CMBarricadeExplosive
    baseEntity: CMBarricadeMetal
  - type: Sprite
    state: explosive

- type: entity
  parent: RMCBarricadeUpgradeBase
  id: RMCBiohazardUpgrade
  name: 生物危害升级（+燃烧）
  categories: [HideSpawnMenu]
  components:
  - type: RMCConstructionUpgrade
    upgradedPopup: rmc-construction-upgrade-burn
    upgradedEntity: CMBarricadeBurn
    baseEntity: CMBarricadeMetal
  - type: Sprite
    state: burn

- type: entity
  parent: RMCBarricadeUpgradeBase
  id: RMCBruteUpgrade
  name: 强化升级（+蛮兵）
  categories: [HideSpawnMenu]
  components:
  - type: RMCConstructionUpgrade
    upgradedPopup: rmc-construction-upgrade-brute
    upgradedEntity: CMBarricadeBrute
    baseEntity: CMBarricadeMetal
  - type: Sprite
    state: brute

# Plasteel
- type: entity
  parent: RMCExplosiveUpgrade
  id: RMCExplosiveUpgradePlasteel
  categories: [HideSpawnMenu]
  components:
  - type: RMCConstructionUpgrade
    upgradedEntity: RMCBarricadeExplosivePlasteel
    baseEntity: RMCBarricadePlasteel

- type: entity
  parent: RMCBiohazardUpgrade
  id: RMCBiohazardUpgradePlasteel
  categories: [HideSpawnMenu]
  components:
  - type: RMCConstructionUpgrade
    upgradedEntity: RMCBarricadeBurnPlasteel
    baseEntity: RMCBarricadePlasteel

- type: entity
  parent: RMCBruteUpgrade
  id: RMCBruteUpgradePlasteel
  categories: [HideSpawnMenu]
  components:
  - type: RMCConstructionUpgrade
    upgradedEntity: RMCBarricadeBrutePlasteel
    baseEntity: RMCBarricadePlasteel
