- type: entity
  parent: RMCBarricadePlasteel
  id: RMCBarricadeExplosivePlasteel
  suffix: Composite
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: DamageOverlay_0
      map: ["enum.RMCDamageOverlayVisuals.DamageOverlay"]
      sprite: _RMC14/Structures/Walls/Barricades/plasteel_barricade_cracks.rsi
    - state: AdditionalDamageOverlay_0
      map: ["enum.RMCDamageOverlayVisuals.AdditionalDamageOverlay"]
      sprite: _RMC14/Structures/Walls/Barricades/explosive_barricade_cracks.rsi
    - map: ["acided"]
  - type: DamageVisuals
    targetLayers:
    - "enum.RMCDamageOverlayVisuals.DamageOverlay"
    - "enum.RMCDamageOverlayVisuals.AdditionalDamageOverlay"
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: RMCConstructionUpgradeTarget
    upgrades:
    downgrade: RMCExplosiveUpgradePlasteel
  - type: Flammable
    damage:
      types:
        Heat: 1.875
  - type: BarricadeBlock
    bidirectional: true
    blocking: 55

- type: entity
  parent: CMBarricadeMetalDoor
  id: CMBarricadePlasteelDoor
  name: 折叠式玻璃钢路障
  description: 一种坚固的折叠式玻璃钢路障，比金属路障更坚固。可以随时闭合和打开。用焊枪修理。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: folding_plasteel
      map: ["enum.DoorVisualLayers.Base"]
      visible: false
    - state: DamageOverlay_0
      map: ["enum.RMCDamageOverlayVisuals.DamageOverlay"]
      sprite: _RMC14/Structures/Walls/Barricades/folding_plasteel_cracks.rsi
    - state: folding_plasteel_connection_1
      map: ["enum.RMCFoldingBarricadeLinkingVisualLayers.North"]
      visible: false
    - state: folding_plasteel_connection_2
      map: ["enum.RMCFoldingBarricadeLinkingVisualLayers.South"]
      visible: false
    - state: folding_plasteel_connection_4
      map: ["enum.RMCFoldingBarricadeLinkingVisualLayers.East"]
      visible: false
    - state: folding_plasteel_connection_8
      map: ["enum.RMCFoldingBarricadeLinkingVisualLayers.West"]
      visible: false
    - map: ["acided"]
    drawdepth: WallTops
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 50
    trackAllDamage: true
    overlay: false
    targetLayers:
    - "enum.RMCDamageOverlayVisuals.DamageOverlay"
    damageGroup: "Brute"
    hideIfZero: false
  - type: RMCFoldingBarricadeLinking
    linkable: true
    connectionStates:
      North:
        Closed: folding_plasteel_connection_1
        Open: folding_plasteel_closed_connection_1
      South:
        Closed: folding_plasteel_connection_2
        Open: folding_plasteel_closed_connection_2
      East:
        Closed: folding_plasteel_connection_4
        Open: folding_plasteel_closed_connection_4
      West:
        Closed: folding_plasteel_connection_8
        Open: folding_plasteel_closed_connection_8
  - type: RMCRepairable
    heal: 200
    skill: RMCSkillConstruction
    delay: 10
    fuelUsed: 2
    repairableDamageLimit: 600
  - type: NailgunRepairable
    # cm13 max_health%: 0.3
    repairValues:
      CMPlasteel: 240
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetPlasteel1:
            min: 4
            max: 4
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: GenericVisualizer
    visuals:
      enum.RMCFoldingBarricadeLinkingVisuals.North:
        enum.RMCFoldingBarricadeLinkingVisualLayers.North:
          None: {visible: false}
          Closed: {state: folding_plasteel_connection_1, visible: true}
          Open: {state: folding_plasteel_closed_connection_1, visible: true}
      enum.RMCFoldingBarricadeLinkingVisuals.South:
        enum.RMCFoldingBarricadeLinkingVisualLayers.South:
          None: {visible: false}
          Closed: {state: folding_plasteel_connection_2, visible: true}
          Open: {state: folding_plasteel_closed_connection_2, visible: true}
      enum.RMCFoldingBarricadeLinkingVisuals.East:
        enum.RMCFoldingBarricadeLinkingVisualLayers.East:
          None: {visible: false}
          Closed: {state: folding_plasteel_connection_4, visible: true}
          Open: {state: folding_plasteel_closed_connection_4, visible: true}
      enum.RMCFoldingBarricadeLinkingVisuals.West:
        enum.RMCFoldingBarricadeLinkingVisualLayers.West:
          None: {visible: false}
          Closed: {state: folding_plasteel_connection_8, visible: true}
          Open: {state: folding_plasteel_closed_connection_8, visible: true}
      enum.BarbedWireVisualLayers.Wire:
        barbWired:
          UnWired: {state: folding_plasteel_closed_wire, visible: false}
          WiredClosed: {state: folding_plasteel_wire, visible: true}
          WiredOpen: {state: folding_plasteel_closed_wire, visible: true}
      enum.SprayAcidedVisuals.Acided:
        acided:
          true:
            sprite: _RMC14/Effects/xeno_spray_acid.rsi
            state: acid
            visible: true
          false:
            visible: false
      enum.DoorVisuals.State:
        enum.RMCDamageOverlayVisuals.DamageOverlay:
          Open: {sprite: _RMC14/Structures/Walls/Barricades/folding_plasteel_closed_cracks.rsi}
          Closed: {sprite: _RMC14/Structures/Walls/Barricades/folding_plasteel_cracks.rsi}
  - type: Door
    openSpriteState: folding_plasteel_closed
    closedSpriteState: folding_plasteel
    canPry: false
    occludes: false
    changeAirtight: false
    bumpOpen: false
    clickOpen: true
    canCrush: false
    closeTimeOne: 0
    closeTimeTwo: 0
    openTimeOne: 0
    openTimeTwo: 0
    openingAnimationTime: 0
    closingAnimationTime: 0
    # Allow you to close barricades while people are standing on them or multiple are wrenched in the same tile
    performCollisionCheck: false
    openSound:
      path: /Audio/Items/ratchet.ogg
    closeSound:
      path: /Audio/Items/ratchet.ogg
  - type: Construction
    graph: BarricadePlasteelDoorGraph
    node: nodeBarricadePlasteelDoor
