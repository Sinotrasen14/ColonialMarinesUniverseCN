# Plasteel Barricade Tree
- type: entity
  parent: CMBarricadeBase
  id: RMCBarricadePlasteel
  name: 玻璃钢路障
  description: 一种由加固玻璃钢板制成的坚固且易于组装的路障，是防御工事的巅峰。使用喷灯进行修理。
  components:
  - type: Climbable
  - type: Anchorable
  - type: MeleeSound
    soundGroups:
      Brute:
        path: "/Audio/_RMC14/Structures/metalhit.ogg"
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: DamageOverlay_0
      map: ["enum.RMCDamageOverlayVisuals.DamageOverlay"]
      sprite: _RMC14/Structures/Walls/Barricades/plasteel_barricade_cracks.rsi
    - map: ["acided"]
    drawdepth: WallTops
  - type: GenericVisualizer
    visuals:
      enum.BarbedWireVisualLayers.Wire:
        barbWired:
          UnWired: {state: plasteel_wire, visible: false}
          WiredClosed: {state: plasteel_wire, visible: true}
      enum.SprayAcidedVisuals.Acided:
        acided:
          true:
            sprite: _RMC14/Effects/xeno_spray_acid.rsi
            state: acid
            visible: true
          false:
            visible: false
  - type: InteractionPopup
    interactSuccessString: fence-rattle-success
    messagePerceivedByOthers: fence-rattle-success
    interactSuccessSound:
      collection: FenceRattle
  - type: RMCRepairable
    heal: 200
    skill: RMCSkillConstruction
    delay: 10
    fuelUsed: 2
    repairableDamageLimit: 675
  - type: NailgunRepairable
    # cm13 max_health%: 0.45
    repairValues:
      CMPlasteel: 400
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 900
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetPlasteel1:
            min: 3
            max: 3
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 56.25
    trackAllDamage: true
    overlay: false
    targetLayers:
    - "enum.RMCDamageOverlayVisuals.DamageOverlay"
    damageGroup: "Brute"
    hideIfZero: false
  - type: Barbed
    thornsDamage:
      types:
        Slash: 10
  - type: Construction
    graph: BarricadePlasteelGraph
    node: nodePlasteel
  - type: RMCConstructionUpgradeTarget
    upgrades: ["RMCExplosiveUpgradePlasteel", "RMCBiohazardUpgradePlasteel", "RMCBruteUpgradePlasteel"]
  - type: Tag
    tags:
    - RMCPlasteelBarricade

- type: Tag
  id: RMCPlasteelBarricade

# Metal Barricade Upgrades
- type: entity
  parent: RMCBarricadePlasteel
  id: RMCBarricadeBurnPlasteel
  suffix: Biohazard
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: DamageOverlay_0
      map: ["enum.RMCDamageOverlayVisuals.DamageOverlay"]
      sprite: _RMC14/Structures/Walls/Barricades/plasteel_barricade_cracks.rsi
    - state: AdditionalDamageOverlay_0
      map: ["enum.RMCDamageOverlayVisuals.AdditionalDamageOverlay"]
      sprite: _RMC14/Structures/Walls/Barricades/burn_barricade_cracks.rsi
    - map: ["acided"]
  - type: DamageVisuals
    targetLayers:
    - "enum.RMCDamageOverlayVisuals.DamageOverlay"
    - "enum.RMCDamageOverlayVisuals.AdditionalDamageOverlay"
  - type: Damageable
    damageModifierSet: CMBurnBarricade
  - type: Injurable
    damageContainer: Inorganic
  - type: RMCConstructionUpgradeTarget
    upgrades:
    downgrade: RMCBiohazardUpgradePlasteel
  - type: Flammable
    damage:
      types:
        Heat: 2.8125

- type: entity
  parent: RMCBarricadePlasteel
  id: RMCBarricadeBrutePlasteel
  suffix: Reinforced
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: DamageOverlay_0
      map: ["enum.RMCDamageOverlayVisuals.DamageOverlay"]
      sprite: _RMC14/Structures/Walls/Barricades/plasteel_barricade_cracks.rsi
    - state: AdditionalDamageOverlay_0
      map: ["enum.RMCDamageOverlayVisuals.AdditionalDamageOverlay"]
      sprite: _RMC14/Structures/Walls/Barricades/brute_barricade_cracks.rsi
    - map: ["acided"]
  - type: DamageVisuals
    targetLayers:
    - "enum.RMCDamageOverlayVisuals.DamageOverlay"
    - "enum.RMCDamageOverlayVisuals.AdditionalDamageOverlay"
  - type: Damageable
    damageModifierSet: CMBruteBarricade
  - type: Injurable
    damageContainer: Inorganic
  - type: RMCConstructionUpgradeTarget
    upgrades:
    downgrade: RMCBruteUpgradePlasteel
  - type: BarricadeBlock
