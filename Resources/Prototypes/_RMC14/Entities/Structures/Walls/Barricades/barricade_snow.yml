- type: entity
  parent: CMBarricadeBase
  id: RMCBarricadeSnow
  name: 雪垒
  description: 一堆雪堆成的斜面墙。作为掩体，从统计上看比稀薄的空气要强。
  components:
  - type: VehicleSmashable
    minDestroyWeightClass: Light
    minContinueWeightClass: Medium
  - type: Sprite
    drawdepth: WallTops
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: snow
      map: ["enum.DoorVisualLayers.Base"]
  - type: Appearance
  - type: RotationDrawDepth
    southDrawDepth: OverMobs
  - type: Barricade
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: InteractionOutline
  - type: NailgunRepairable
    # cm13 max_health%: 1
#    repairSnow: 75
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 19
    trackAllDamage: true
    damageOverlay:
      sprite: _RMC14/Structures/Walls/Barricades/snow_cracks.rsi
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/Footsteps/snowstep3.ogg
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Climbable
  - type: XenoToggleChargingDamage
    sound:
      path: /Audio/Effects/Footsteps/snowstep3.ogg
  - type: BarricadeBlock
    bidirectional: true
    blocking: 38
