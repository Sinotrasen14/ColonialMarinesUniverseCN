- type: entity
  parent: CMBarricadeBase
  id: CMBarricadeFolding
  name: 便携式复合路障
  description: 已部署的 MB-6 折叠路障。它足够轻，可以打包收起；但又足够坚固，可以守住防线。
  components:
  - type: Transform
    anchored: true
  - type: MeleeSound
    soundGroups:
      Brute:
        path: "/Audio/_RMC14/Structures/metalhit.ogg"
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: DamageOverlay_0
      map: ["enum.RMCDamageOverlayVisuals.DamageOverlay"]
      sprite: _RMC14/Structures/Walls/Barricades/folding_cracks.rsi
    - map: ["acided"]
    drawdepth: WallTops
  - type: DirectionalAttackBlocker
    maxHealth: 350
  - type: Damageable
    damageModifierSet: CMFoldingBarricade
  - type: Injurable
    damageContainer: Inorganic
  - type: RMCRepairable
    heal: 200
    skill: RMCSkillConstruction
    delay: 10
    fuelUsed: 2
  - type: NailgunRepairable
    repairValues:
      CMSteel: 105
      CMPlasteel: 157.5
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 350
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 21.875
    trackAllDamage: true
    overlay: false
    targetLayers:
    - "enum.RMCDamageOverlayVisuals.DamageOverlay"
    damageGroup: "Brute"
    hideIfZero: false
  - type: RMCFoldingBarricade
