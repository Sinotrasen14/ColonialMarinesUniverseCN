# Rocks

- type: entity
  parent: CMBaseWallInvincible
  id: RMCWallHybrisaRock
  name: 岩壁
  description: 由古老沉积岩构成的巨大石柱矗立在你面前。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/hybrisa_rock.rsi
    state: rock
  - type: Icon
    sprite: _RMC14/Structures/Walls/hybrisa_rock.rsi
    state: rock
  - type: IconSmooth
    key: walls
    additionalKeys:
    - windows
    - doors
    base: rock

- type: entity
  parent: RMCWallHybrisaRock
  id: RMCWallHybrisaRockBorder
  suffix: border
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/hybrisa_rock.rsi
    state: rock_border
  - type: Icon
    sprite: _RMC14/Structures/Walls/hybrisa_rock.rsi
    state: rock_border
  - type: IconSmooth
    key: walls
    additionalKeys:
    - windows
    - doors
    base: rock_border

- type: entity
  parent: RMCWallHybrisaRock
  id: RMCWallHybrisaRockTimed
  suffix: TIMED
  components:
  - type: TimedDespawn
    lifetime: 2400

# Engineer Ship

- type: entity
