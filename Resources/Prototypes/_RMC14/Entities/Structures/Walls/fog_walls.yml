# TODO RMC14 make a central system to manage these instead of ticking them all separately
- type: entity
  id: RMCFogWallPermanent
  name: 浓雾
  description: 看起来太危险了，无法穿越。
  suffix: Permanent
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: Effects
    sprite: _RMC14/Effects/fog.rsi
    state: smoke
  - type: PlacementReplacement
    key: cm_fog_walls
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: Occluder
  - type: Fog

- type: entity
  parent: RMCFogWallPermanent
  id: RMCFogWall25
  description: 看起来实在太危险了，没法穿越。最好等它散去再说。
  suffix: 25 minutes
  components:
  - type: TimedDespawn
    lifetime: 1500

- type: entity
  parent: RMCFogWall25
  id: RMCFogWall15
  suffix: 15 minutes
  components:
  - type: TimedDespawn
    lifetime: 900

- type: entity
  parent: MarkerBase
  id: RMCFogWallRemoverOne
  name: 随机迷雾移除器
  description: 将此迷雾标记为在回合开始时随机移除。
  suffix: group one
  components:
  - type: Sprite
    drawdepth: Overdoors
    sprite: Markers/cross.rsi
    state: red
  - type: RandomAnchoredRemover
    group: RMCFogWallRemoverOne
    whitelist:
      components:
      - Fog

- type: entity
  parent: MarkerBase
  id: RMCFogWallAdderOne
  name: 随机雾生成点
  description: 标记一个在回合开始时随机生成雾的位置。
  suffix: group one, 25 minutes
  components:
  - type: Sprite
    drawdepth: Overdoors
    sprite: Markers/cross.rsi
    state: green
  - type: RandomAnchoredSpawner
    group: RMCFogWallRemoverOne
    spawn: RMCFogWall25

- type: entity
  parent: RMCFogWallRemoverOne
  id: RMCFogWallRemoverTwo
  suffix: group two
  components:
  - type: RandomAnchoredRemover
    group: RMCFogWallRemoverTwo

- type: entity
  parent: RMCFogWallAdderOne
  id: RMCFogWallAdderTwo
  suffix: group two, 25 minutes
  components:
  - type: RandomAnchoredSpawner
    group: RMCFogWallRemoverTwo

- type: entity
  parent: RMCFogWallRemoverOne
  id: RMCFogWallRemoverThree
  suffix: group three
  components:
  - type: RandomAnchoredRemover
    group: RMCFogWallRemoverThree

- type: entity
  parent: RMCFogWallAdderOne
  id: RMCFogWallAdderThree
  suffix: group three, 25 minutes
  components:
  - type: RandomAnchoredSpawner
    group: RMCFogWallRemoverThree

- type: entity
  id: RMCFogShockwave
  name: 冲击波烟雾
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: Effects
    sprite: _RMC14/Effects/fog.rsi
    state: smoke
  - type: TimedDespawn
    lifetime: 0.05
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: RMCFogSpawner15
  parent: MarkerBase
  name: 防雾器
  suffix: 15 minutes
  components:
  - type: Sprite
    sprite: _RMC14/Markers/landmarks.rsi
    state: fog
  - type: RandomSpawner # This is horrible if anyone knows something that just spawns something then tell me.
    prototypes:
    - RMCFogWall15
    chance: 1
