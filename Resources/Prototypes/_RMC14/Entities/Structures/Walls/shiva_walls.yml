  description: 一层又一层肮脏的黑冰结壳覆盖在古老的岩层上。夏季月份，永久冻土层会在20英寸至12英寸之间波动。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/shiva_ice.rsi
  - type: Icon
    sprite: _RMC14/Structures/Walls/shiva_ice.rsi
