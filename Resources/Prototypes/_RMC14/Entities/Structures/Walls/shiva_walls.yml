- type: entity
  parent: CMWallMetal
  id: RCMWallShivaFab
  name: 预制结构墙
  description: 这种结构由金属支撑杆和坚固的聚凯夫隆塑料制成。这种塑料是用于联合国防弹背心以及美国殖民海军陆战队和进步人民联盟制服所用材料的衍生物。这些墙体被拉紧，并加固成了更永久的结构。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/shiva_fab.rsi
    state: shiva_fab
  - type: Icon
    sprite: _RMC14/Structures/Walls/shiva_fab.rsi
    state: shiva_fab
  - type: IconSmooth
    key: walls
    additionalKeys:
    - windows
    - doors
    base: shiva_fab

