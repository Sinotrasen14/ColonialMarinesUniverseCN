- type: entity
  parent: CMWallReinforced
  id: RMCWallSandstone
  name: 砂岩墙
  description: 一堵覆有砂岩板的墙。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/stone.rsi
    state: stone
    color: "#c6a480"
  - type: Icon
    sprite: _RMC14/Structures/Walls/stone.rsi
    state: stone
  - type: IconSmooth
    key: walls
    additionalKeys:
    - windows
    base: stone

- type: entity
  parent: RMCWallSandstone
  id: RMCWallSandstoneTemple
  name: 砂岩神庙墙
  description: 一堵厚重的砂岩墙。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/stone.rsi
    state: stone
    color: "#b29082"
  - type: Icon
    sprite: _RMC14/Structures/Walls/stone.rsi
    state: stone
  - type: IconSmooth
    key: walls
    additionalKeys:
    - windows
    base: stone

- type: entity
  parent: RMCWallSandstoneTemple
  id: RMCWallSandstoneTempleTimed
  suffix: Timed
  components:
  - type: TimedDespawn
    lifetime: 1200

- type: entity
  parent: RMCWallSandstone
  id: RMCWallSandstoneTempleRuned
  name: 刻有符文的砂岩神庙墙壁
  description: 一面厚重的砂岩墙，其表面刻有精美的雕纹与符文。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/runedstone.rsi
    state: runedstone
    color: "#b29082"
  - type: Icon
    sprite: _RMC14/Structures/Walls/runedstone.rsi
    state: runedstone
  - type: IconSmooth
    key: walls
    additionalKeys:
    - windows
    base: runedstone

- type: entity
  parent: RMCWallSandstoneTemple
  id: RMCWallSandstoneTempleGrey
  components:
  - type: Sprite
    color: '#666666'

- type: entity
  parent: RMCWallSandstoneTempleGrey
  id: RMCWallSandstoneMemorial
  name: 纪念墙

- type: entity
  parent: RMCWallSandstone
  id: RMCWallUranium
  name: 铀墙
  description: 一面带有铀镀层的墙。这大概不是个好主意。
  components:
  - type: Sprite
    color: '#1b4506'

- type: entity
  parent: RMCWallSandstone
  id: RMCWallUraniumBroken
  name: 破损的铀墙
  description: 一面正在渗漏某种东西的镀铀墙。光是看着它就让人头晕目眩。
  components:
  - type: Sprite
    color: '#660202'

- type: entity
  parent: CMBaseWall
  id: RMCWallGold
  name: 金墙
  description: 一面镀金的墙。时尚！
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/gold.rsi
    state: gold0
  - type: Icon
    sprite: _RMC14/Structures/Walls/gold.rsi
    state: gold0
  - type: Tag
    tags:
    - Wall
  - type: ReceiverXenoClaws
    maxHealth: 9000
    minimumClawStrength: VerySharp
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 9000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 150
