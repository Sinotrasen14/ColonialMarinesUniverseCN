- type: entity
  abstract: true
  id: RMCTrashBinBase
  parent: BaseStructure
  name: 垃圾桶
  description: 一个维兰德-汤谷垃圾桶，用来处理你不想要的物品，或者你也可以像其他所有混蛋一样，直接把你的屎扔在地上。
  placement:
    mode: SnapgridCenter
    snap:
    - Disposal
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Piping/disposal.rsi
    layers:
    - state: trashcan
      map: ["enum.DisposalUnitVisualLayers.Base"]
    - state: disposal-flush
      map: ["enum.DisposalUnitVisualLayers.OverlayFlushing"]
      visible: false
    - state: dispover-ready
      map: ["enum.DisposalUnitVisualLayers.OverlayCharging"]
    - state: dispover-full
      map: ["enum.DisposalUnitVisualLayers.OverlayFull"]
      visible: false
    - state: dispover-handle
      map: ["enum.DisposalUnitVisualLayers.OverlayEngaged"]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.DisposalUnitVisuals.IsReady:
        enum.DisposalUnitVisualLayers.Base:
          true: {state: trashcan}
          false: {state: trashcan}
      enum.DisposalUnitVisuals.IsFlushing:
        enum.DisposalUnitVisualLayers.OverlayFlushing:
          true: {visible: true}
          false: {visible: false}
      enum.DisposalUnitVisuals.IsEngaged:
        enum.DisposalUnitVisualLayers.OverlayEngaged:
          true: {visible: true}
          false: {visible: false}
      enum.DisposalUnitVisuals.IsCharging:
        enum.DisposalUnitVisualLayers.OverlayCharging:
          true: {state: dispover-charge, visible: true}
          false: {state: dispover-ready, visible: true}
      enum.DisposalUnitVisuals.IsFull:
        enum.DisposalUnitVisualLayers.OverlayFull:
          true: {visible: true}
          false: {visible: false}
      enum.AnchorVisuals.Anchored:
        enum.DisposalUnitVisualLayers.Base:
          true: {state: trashcan}
          false: {state: condisposal}
        enum.DisposalUnitVisualLayers.OverlayEngaged:
          false: {visible: false}
        enum.DisposalUnitVisualLayers.OverlayCharging:
          false: {visible: false}
        enum.DisposalUnitVisualLayers.OverlayFull:
          false: {visible: false}
  - type: Physics
    bodyType: Static
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
  - type: Damageable
    damageModifierSet: StructuralMarine
  - type: Injurable
    damageContainer: StructuralMarine
  - type: Appearance
  - type: InteractionOutline
  - type: Anchorable
    flags:
    - None
  - type: ContainerContainer
    containers:
      DisposalUnitComponent: !type:Container
  - type: RequireProjectileTarget
  - type: DisposalUnit
  - type: ThrowInsertContainer
    containerId: DisposalUnitComponent
    probability: 0
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
