- type: entity
  id: RMCRotaryPhone
  name: 转盘电话
  description: 拨号盘有点发紧。
  components:
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite: _RMC14/Structures/rotary_phone.rsi
    drawdepth: WallMountedItems
    layers:
    - state: rotary_phone
      map: ["base"]
  - type: InteractionOutline
  - type: Clickable
  - type: RotaryPhone
  - type: ContainerContainer
    containers:
      rmc_rotary_phone_telephone: !type:ContainerSlot
  - type: ActivatableUI
    key: enum.RMCTelephoneUiKey.Key
  - type: UserInterface
    interfaces:
      enum.RMCTelephoneUiKey.Key:
        type: RMCTelephoneBui
  - type: ActivatableUIBlacklist
    blacklist:
      components:
      - Xeno
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.RotaryPhoneLayers.Layer:
        base:
          Base: {state: rotary_phone}
          Ring: {state: rotary_phone_ring}
          Ear: {state: rotary_phone_ear}
  - type: WallMount
    arc: 360
  - type: GuideHelp
    guides:
    - RMCGuideMarineCommunications
    - RMCGuideCommunicationsTowers
    - RMCGuideRoleCombatTechnician
    - RMCGuideRoleMaintenanceTechnician
  - type: RMCMesonsNonviewable

- type: entity
  parent: RMCRotaryPhone
  id: RMCRotaryPhoneWallmount
  name: 壁挂式电话
  description: "这是一部壁挂式电话。小字写着：请将您的钥匙卡插入下方插槽，以便将您的详细信息记录到主机中。遗憾的是，插槽卡住了。不过，您仍然可以使用这部电话。"
  components:
  - type: Sprite
    sprite: _RMC14/Structures/wallmount_phone.rsi
    layers:
    - state: wall_phone
      map: ["base"]
  - type: GenericVisualizer
    visuals:
      enum.RotaryPhoneLayers.Layer:
        base:
          Base: {state: wall_phone}
          Ring: {state: wall_phone_ring}
          Ear: {state: wall_phone_ear}

- type: entity
  parent: BaseItem
  id: RMCTelephone
  name: 电话
  components:
  - type: Sprite
    sprite: _RMC14/Objects/phone.rsi
    state: rpb_phone
  - type: Item
    size: Invalid
  - type: RMCTelephone
  - type: Corrodible
    isCorrodible: false
  - type: BlockEntityStorage
  - type: Undisposable
  - type: GuideHelp
    guides:
    - RMCGuideMarineCommunications
    - RMCGuideCommunicationsTowers
    - RMCGuideRoleCombatTechnician
    - RMCGuideRoleMaintenanceTechnician


# Misc
- type: entity
  parent: RMCRotaryPhone
  id: RMCRotaryPhoneCommandTent
  name: 指挥帐篷

- type: entity
  parent: RMCRotaryPhone
  id: RMCRotaryPhoneReqTent
  name: 军需帐篷

- type: entity
  parent: RMCRotaryPhone
  id: RMCRotaryPhoneMessTent
  name: 食堂帐篷

- type: entity
  parent: RMCRotaryPhone
  id: RMCRotaryPhoneMPTent
  name: 宪兵帐篷

# Admin
- type: entity
  parent: RMCRotaryPhone
  id: RMCRotaryPhoneAdmin
  suffix: Admin
  components:
  - type: RotaryPhone
    canDnd: true
    category: Comms Relay
    notifyAdmins: true

- type: entity
  parent: RMCRotaryPhoneWallmount
  id: RMCRotaryPhoneWallmountAdmin
  suffix: Admin
  components:
  - type: RotaryPhone
    canDnd: true
    category: Comms Relay
    notifyAdmins: true
