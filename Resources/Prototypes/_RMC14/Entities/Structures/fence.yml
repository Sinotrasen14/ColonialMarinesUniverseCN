# TODO RMC14 cutting
- type: entity
  parent: BaseFenceMetal
  id: CMFence
  name: 铁丝网
  description: 一张横跨在两根杆子之间的大金属网。旨在以廉价的方式分隔区域，同时让人能透过它看到另一边。
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/fences.rsi
    state: fence0
  - type: InteractionOutline
  - type: Clickable
  - type: VehicleSmashable
    deleteOnHit: false
    damageOnHit: 50
    slowdownBelowWeightClass: Medium
    slowdownMultiplier: 0.5
    slowdownDuration: 0.4
  - type: IconSmooth
    key: fences
    base: fence
    mode: CardinalFlags
  - type: Damageable
    damageModifierSet: StructuralMarine
  - type: Injurable
    damageContainer: StructuralMarine
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger: !type:DamageTrigger
        damage: 550
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Items/wirecutter.ogg
      - !type:ChangeConstructionNodeBehavior
        node: rmcFenceBroken
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: CMFence
    node: fenceMetal
  - type: RMCDropshipBlocked
  - type: MinimapColor
    color: "#8d2294ad"
  - type: DamageOnXenoScissors
    damage:
      types:
        Slash: 50
  - type: XenoToggleChargingDamage
    stageLoss: 1
    stageLossProbability: 0.5
    damage:
      types:
        Blunt: 22
  - type: XenoCrusherChargable
  - type: RMCMesonsNonviewable

- type: entity
  parent: CMBaseStructureCorrodible
  id: RMCFenceBroken
  name: 破损的栅栏
  description: 两根柱子之间散落着一团乱糟糟的破铁丝，并没有挡住任何人的去路。
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/fences.rsi
    state: brokenfence0
  - type: Clickable
  - type: InteractionOutline
  - type: PlacementReplacement
    key: walls
  - type: IconSmooth
    key: fences
    base: brokenfence
    mode: CardinalFlags
  - type: Physics
    canCollide: false
  - type: Damageable
    damageModifierSet: StructuralMarine
  - type: Injurable
    damageContainer: StructuralMarine
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: RMCDropshipBlocked
  - type: MinimapColor
    color: "#8d2294ad"
  - type: Construction
    graph: CMFence
    node: rmcFenceBroken
  - type: Tag
    tags: []

- type: entity
  parent: CMFence
  id: RMCFenceHybrisa
  components:
  - type: Sprite
    sprite: _RMC14/Structures/hybrisa_fences.rsi
    state: fence0
  - type: Construction
    graph: RMCFenceHybrisa
    node: fenceMetal

- type: entity
  parent: RMCFenceBroken
  id: RMCFenceHybrisaBroken
  components:
  - type: Sprite
    sprite: _RMC14/Structures/hybrisa_fences.rsi
    state: brokenfence0
  - type: Construction
    graph: RMCFenceHybrisa
    node: rmcFenceBroken

- type: entity
  parent: CMFence
  id: RMCFenceHybrisaElectric
  suffix: electric
  components:
  - type: Sprite
    sprite: _RMC14/Structures/hybrisa_fences_electric.rsi
    state: fence0
  - type: Construction
    graph: RMCFenceHybrisaElectric
    node: fenceMetal
  - type: XenoCrusherChargable
    setDamage:
      types:
        Blunt: 50
    passOnDestroy: true
