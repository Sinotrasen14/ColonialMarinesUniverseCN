- type: entity
  abstract: true
  id: RMCBarrelPileBase
  name: 桶堆
  description: 大堆能量。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,2.4,2.5"
        density: 190
        layer:
        - MobMask
  - type: Sprite
    sprite: _RMC14/Structures/barrel_yard.rsi
    offset: 1, 1
  - type: Clickable
  - type: DeleteOnExplosion
  - type: RMCMesonsNonviewable
  - type: Flamability
    chance: 0.35
    rate: 2.0
    spread: 1.0
    burnDurationMin: 70
    burnDurationMax: 620

- type: entity
  parent: RMCBarrelPileBase
  id: RMCBarrelPileYard
  components:
  - type: Sprite
    state: pile_0

- type: entity
  parent: BaseStructureDynamic
  id: RMCBarrelBase
  name: 木桶
  categories: [HideSpawnMenu]
  description: 一个储物桶。
  components:
  - type: XenoCrusherChargable
    instantDestroy: true
    passOnDestroy: true
  - type: VehicleSmashable
  - type: Sprite
    sprite: _RMC14/Structures/barrels.rsi
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.18,-0.48,0.18,0.48"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet:
  - type: Injurable
    damageContainer: Inorganic
  - type: InteractionOutline
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: CrateOpenable
  - type: RMCMesonsNonviewable
  - type: SpawnOnTerminate
    spawn: RMCSpawnerRandomCrateLoot
  - type: Flamability
    chance: 0.25
    rate: 1.5
    spread: 0.8
    burnDurationMin: 70
    burnDurationMax: 620

- type: entity
  parent: RMCBarrelBase
  id: RMCBarrelBlue
  name: 蓝色储物桶
  description: 一个蓝色储物桶。
  components:
  - type: Sprite
    state: barrel_blue

- type: entity
  parent: RMCBarrelBase
  id: RMCBarrelGreen
  name: 绿色桶
  description: 一个绿色储物桶。
  components:
  - type: Sprite
    state: barrel_green

- type: entity
  parent: RMCBarrelBase
  id: RMCBarrelRed
  name: 红色桶
  description: 一个红色的储物桶。
  components:
  - type: Sprite
    state: barrel_red

- type: entity
  parent: RMCBarrelBase
  id: RMCBarrelWhite
  name: 白色桶
  description: 一个白色储物桶。
  components:
  - type: Sprite
    state: barrel_white

- type: entity
  parent: RMCBarrelBase
  id: RMCBarrelYellow
  name: 黄色桶
  description: 一个黄色的储物桶。
  components:
  - type: Sprite
    state: barrel_yellow
