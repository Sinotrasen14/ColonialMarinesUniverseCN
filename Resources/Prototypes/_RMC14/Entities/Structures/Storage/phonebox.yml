# Base

- type: entity
  parent: BaseStructureDynamic
  id: RMCPhoneboxBase
  name: 电话亭
  description: 这是一个电话亭，技术虽然过时，但很可靠。这些电话亭用于在整个殖民地以及相连殖民地之间进行通信，不受干扰。尽管它们很可靠，但似乎线路断了。
  abstract: true
  components:
  - type: Transform
    noRot: true
    anchored: true
  - type: Sprite
    noRot: true
    sprite: _RMC14/Structures/Storage/Closets/phonebox_off.rsi
    offset: 0.15,0.5
    layers:
    - state: base
      map: ["enum.StorageVisualLayers.Base"]
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: base
    stateDoorOpen: open
    stateDoorClosed: closed
  - type: ItemSlots
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        density: 75
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: EntityStorage
  - type: ContainerContainer
    containers:
      entity_storage: !type:Container
      paper_label: !type:ContainerSlot
  - type: InsertBlacklist
    blacklist:
      components:
      - Xeno
  - type: Anchorable
    flags:
    - None
  - type: PlaceableSurface
    placeCentered: true
    isPlaceable: false
  - type: Damageable
    damageModifierSet: StructuralMarine
  - type: Injurable
    damageContainer: StructuralMarine
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6

# Broken Base

- type: entity
  parent: BaseStructureDynamic
  id: RMCPhoneboxBrokenBase
  name: 损坏的电话亭
  description: 这是一个电话亭，技术虽已过时但很可靠。人们用它在整个殖民地以及相连的殖民地之间进行通信，且不受干扰。它似乎已经完全损毁，沾满血迹，玻璃也碎了。躲在里面毫无意义。
  abstract: true
  components:
  - type: Transform
    noRot: true
    anchored: true
  - type: Sprite
    noRot: true
    sprite: _RMC14/Structures/Storage/Closets/phonebox_off.rsi
    offset: 0.15,0.5
  - type: Appearance
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        density: 75
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Anchorable
    flags:
    - None
  - type: PlaceableSurface
    placeCentered: true
    isPlaceable: false
  - type: Damageable
    damageModifierSet: StructuralMarine
  - type: Injurable
    damageContainer: StructuralMarine
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6

# Phone Box

- type: entity
  parent: RMCPhoneboxBase
  id: RMCPhoneboxOff
  suffix: Off
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Storage/Closets/phonebox_off.rsi

- type: entity
  parent: RMCPhoneboxBase
  id: RMCPhoneboxOn
  suffix: On
  # cmu edit start: working payphone
  name: 公用电话亭
  description: 一个公用电话亭，技术过时却依然可靠。右键点击它拨打电话，或走进里面享受一点私密空间。
  # cmu edit end
  components:
  # cmu edit start: working payphone
  - type: CMUPayphone
  - type: RotaryPhone
    category: Payphones
    callableByAll: true
    tryGetHolderName: false
  - type: ActivatableUI
    key: enum.RMCTelephoneUiKey.Key
    verbOnly: true
    verbText: cmu-payphone-use
  - type: UserInterface
    interfaces:
      enum.RMCTelephoneUiKey.Key:
        type: RMCTelephoneBui
  - type: ActivatableUIBlacklist
    blacklist:
      components:
      - Xeno
  # cmu edit end
  - type: Sprite
    sprite: _RMC14/Structures/Storage/Closets/phonebox_on.rsi
  - type: PointLight
    enabled: true
    radius: 1.5
    netsync: true
    energy: 3
    offset: "0,0"
    color: "#00AAFF"
    lightMask: ConeQuad

# Broken Phone Box

- type: entity
  parent: RMCPhoneboxBrokenBase
  id: RMCPhoneboxBroken
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Storage/Closets/broken_phonebox.rsi
    state: phonebox_off_broken

- type: entity
  parent: RMCPhoneboxBrokenBase
  id: RMCPhoneboxBrokenBloody
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Storage/Closets/broken_phonebox.rsi
    state: phonebox_bloody_off_broken
