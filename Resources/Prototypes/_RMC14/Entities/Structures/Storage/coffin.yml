- type: entity
  parent: CrateCoffin
  id: CMCoffin
  name: 棺材
  description: 这是为逝去亲人准备的安葬容器。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Storage/Coffins/standard.rsi
    layers:
    - state: closed
      map: ["enum.StorageVisualLayers.Base"]
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: closed
    stateDoorOpen: open
    stateDoorClosed: closed
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1: # TODO RMC14 wood material
            min: 1
            max: 4
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: CMCoffin
  id: CMCoffinMarine
  name: 海军陆战队棺材
  description: 为深爱的已故海军陆战队员准备的棺材，饰以红色，内部饰有海军陆战队徽章。永远忠诚。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Storage/Coffins/marine.rsi

- type: entity
  parent: CMCoffin
  id: CMCoffinPred
  name: 奇怪的棺材
  description: 这是为逝去的挚爱之人准备的葬具。侧面似乎有奇怪的标记……？
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Storage/Coffins/pred.rsi
