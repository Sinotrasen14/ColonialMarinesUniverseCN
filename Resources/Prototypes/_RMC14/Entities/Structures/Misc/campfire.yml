- type: entity
  parent: CMBaseStructure
  id: RMCBrazier
  name: 火盆
  description: 金属盘里燃烧着一堆木柴。
  components:
  - type: Sprite
    noRot: true
    sprite: _RMC14/Structures/brazier.rsi
    layers:
    - state: brazier
    - state: burning
      map: ["burning"]
      visible: false
  - type: RMCMesonsNonviewable
  - type: Campfire
    fuelRequired: false
  - type: PointLight
    enabled: false
    radius: 10
    energy: 3
    color: "#FFC90C"
  - type: AmbientSound
    enabled: false
    volume: -5
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CampfireVisuals.Lit:
        burning:
          true: {visible: true}
          false: {visible: false}
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Tag
    tags: []

- type: entity
  parent: CMBaseStructure
  id: RMCCampfire
  name: 篝火
  description: 一件能让战友们变成终身好友的实用工具。拉把椅子过来吧！
  components:
  - type: Sprite
    noRot: true
    sprite: _RMC14/Structures/campfire.rsi
    layers:
    - state: campfire
    - state: burning
      map: ["burning"]
      visible: false
  - type: Construction
    graph: RMCCampfire
    node: Campfire
  - type: RMCMesonsNonviewable
  - type: Campfire
    fuel: 5
  - type: PointLight
    enabled: false
    radius: 5
    energy: 3
    color: "#FFC90C"
  - type: AmbientSound
    enabled: false
    volume: -5
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CampfireVisuals.Lit:
        burning:
          true: {visible: true}
          false: {visible: false}
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Tag
    tags: []
