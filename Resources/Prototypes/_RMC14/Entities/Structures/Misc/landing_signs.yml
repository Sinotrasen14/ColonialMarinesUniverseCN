- type: entity
  parent: CMBaseStructureCorrodible
  abstract: true
  id: RMCBaseLandingSign
  name: 标志
  description: 一个标志。
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: InteractionOutline
  - type: Sprite
    drawdepth: OverMobs
    sprite: _RMC14/Structures/landing_signs.rsi
  - type: AnimationPlayer
  - type: RMCMesonsNonviewable

- type: entity
  parent: RMCBaseLandingSign
  id: RMCLazarusLandingSign
  name: 拉撒路登陆点标牌
  description: 一块大标牌上写着“拉撒路登陆点 por-”，其余部分被血污覆盖。
  components:
  - type: Sprite
    state: laz_sign

- type: entity
  parent: RMCLazarusLandingSign
  id: RMCLazarusLandingSignFixed
  description: 一块大标牌，上面写着“拉撒路登陆点——人口73”。公司标志醒目地印在角落。
  components:
  - type: Sprite
    state: laz_sign_fixed

- type: entity
  parent: RMCBaseLandingSign
  id: RMCSolarisRidgeSign
  name: Solaris Ridge 标志牌
  description: 一块大标志牌上写着“Solaris Ridge -”，其余部分已被刮掉。
  components:
  - type: Sprite
    state: red_sign

- type: entity
  parent: RMCBaseLandingSign
  id: RMCPrisonSign
  name: 联合国监狱停靠站标牌
  description: 一块大标牌上写着“联合国监狱停靠站——”，其余部分被爪痕遮住了。
  components:
  - type: Sprite
    state: prison_sign

- type: entity
  parent: RMCBaseLandingSign
  id: RMCShivaIceSign
  name: 湿婆冰上登陆点招牌
  description: 一块巨大的招牌，上面写着“湿婆冰上登陆点——”，弹孔和破损的金属遮住了招牌其余的部分。
  components:
  - type: Sprite
    state: ice_sign

- type: entity
  parent: RMCBaseLandingSign
  id: RMCTrijentSign
  name: Trijent 着陆点标牌
  description: 一块大标牌，上面写着‘Trijent 采矿殖民-’，其余部分被看起来像是干涸血迹的东西和破损遮挡。
  components:
  - type: Sprite
    state: dam_sign

- type: entity
  parent: RMCTrijentSign
  id: RMCTrijentSignAlt
  description: 一块大标牌，上面写着“Trijent采矿殖民地”，其中一半用日文书写。
  components:
  - type: Sprite
    state: dam_sign_2

- type: entity
  parent: RMCBaseLandingSign
  id: RMCSorokyneSign
  name: 索罗基内降落标牌
  description: 一块巨大的标牌，上面写着‘索罗基内 - СОРОКІНО - 人口 110’。公司标志自豪地印在角落。别吃涂了树脂的雪。
  components:
  - type: Sprite
    state: sorokyne_1

- type: entity
  parent: RMCSorokyneSign
  id: RMCSorokyneSignAlt
  description: 一块大标牌，上面写着“索罗基内——СОРОКІНО——人口 110”。公司标志自豪地印在角落。有人用青绿色油漆在标牌的大部分区域粗野地写上了“滚开”。
  components:
  - type: Sprite
    state: sorokyne

- type: entity
  parent: RMCBaseLandingSign
  id: RMCNewVaraderoSign
  name: 新巴拉德罗登陆标志牌
  description: 一块写着“新巴拉德罗”的大标志牌。这里总是阳光明媚！
  components:
  - type: Sprite
    state: new_varadero

- type: entity
  parent: RMCBaseLandingSign
  id: RMCFortBicepSign
  name: Fort Bicep 标牌
  description: 一个写着“Fort Bicep，T-COMMS”的大标牌。
  components:
  - type: Sprite
    state: fort_biceps

- type: entity
  parent: RMCBaseLandingSign
  id: RMCHybrisaProsperaSign
  name: 海布里萨·普罗斯佩拉欢迎标牌
  description: 一块大型标牌，上面写着“欢迎来到海布里萨·普罗斯佩拉”，维兰德-汤谷的“翅膀”和标志装饰着标牌，还有关于该殖民地的一些信息。
  components:
  - type: Sprite
    state: hybrisa_sign

- type: entity
  parent: RMCBaseLandingSign
  id: RMCHybrisaProsperaMedicalSign
  name: 海布里萨·普罗斯佩拉——紧急医疗着陆区一号标志牌
  description: 一块大型标志牌，上面写着“紧急医疗 - HBP - LZ - 01”。
  components:
  - type: Sprite
    state: hybrisamedical_sign

- type: entity
  parent: RMCBaseLandingSign
  id: RMCHybrisaProsperaMiningSign
  name: 海布里萨·普罗斯佩拉 - 维兰德-汤谷塔尔塔罗斯矿业 - 二号着陆区标牌
  description: 一块大型标牌，上面写着“WEYA - TMCC Mining - HBP - LZ - 01”，标牌上装饰着塔尔塔罗斯矿业的标志。
  components:
  - type: Sprite
    state: hybrisamining_sign

- type: entity
  parent: RMCBaseLandingSign
  id: RMCChancesClaimLandingSign
  name: 钱斯领地着陆标牌
  description: 一块写有“钱斯领地”的大型标牌，角落里写有关于殖民地的信息。标牌的大部分因持续的风雨而损坏，不过上面的文字和公司配色的点缀似乎已被重新粉刷。
  components:
  - type: Sprite
    state: chances_claim

- type: entity
  parent: RMCBaseLandingSign
  id: RMCPortNereidCargoSign
  name: 涅瑞伊得港——维兰德-汤谷 AC-170 货运站——一号着陆区标牌
  description: 一块巨大的标牌，上面标明此区域为“AC-170 货运站”。它显然经历了多日雨水，丛林植物已经开始攀爬其上。
  components:
  - type: Sprite
    state: nereidcargo_sign

- type: entity
  parent: RMCBaseLandingSign
  id: RMCPortNereidSpaceportSign
  name: 涅瑞伊德港——涅瑞伊德港国际太空港——二号着陆区标志
  description: 一个巨大的标志牌，上面写着“涅瑞伊德港太空港”。在蓝光下，你可以读到一些关于殖民地极其平淡无奇的信息，上方是一幅流畅的图形，看起来像是一艘风格化的飞船。虽然标志牌上长着一些藤蔓，但显然已被重新粉刷过许多次，使其保持干净而光滑。
  components:
  - type: Sprite
    state: nereidspaceport_sign

