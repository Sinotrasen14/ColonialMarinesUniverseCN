- type: entity
  parent: CMSeatBase
  id: CMSeatPassenger
  name: 乘客座椅
  description: 一把坚固的椅子，带有可降下并罩住身体的支架。可在车辆碰撞时防止你被甩来甩去并因此受伤。孩子们，系好安全带！若损坏，可用焊接工具修理。
  placement:
    mode: PlaceFree
  components:
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/vehicle_seats.rsi
    state: base

- type: entity
  parent: CMSeatPassenger
  id: RMCSeatVehiclePassenger
  description: 一把坚固的椅子，带有可在你身体上方降下的固定架。可防止在车辆碰撞时被甩来甩去并因此受伤。孩子们，系好安全带！
  components:
  - type: RemoveComponents
    components:
    - type: Damageable
    - type: Injurable
    - type: Destructible
    - type: Corrodible

- type: entity
  parent: CMSeatBase
  id: CMSeatPilot
  name: 飞行员座椅
  description: 供飞行员乘坐的特制座椅。
  placement:
    mode: PlaceFree
  components:
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/vehicle_seats.rsi
    state: pilot_chair
  - type: RemoveComponents
    components:
    - type: Damageable
    - type: Injurable

- type: entity
  parent: CMSeatBase
  id: RMCSeatDriver
  name: 驾驶员座椅
  description: 专为驾驶员乘坐而设计的座椅。
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/vehicle_seats.rsi
    state: pilot_chair
  - type: VehicleDriverSeat
    skills:
      all:
        RMCSkillVehicles: 1
  - type: RemoveComponents
    components:
    - type: Damageable
    - type: Injurable
    - type: Destructible
    - type: Corrodible

- type: entity
  parent: RMCSeatDriver
  id: RMCSeatVanDriver
  name: van driver seat
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/chairs.rsi
    state: comfychair

- type: entity
  parent: CMSeatBase
