  description: 为大型类人猎人精心制作的椅子。
  placement:
    mode: PlaceFree
  components:
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/vehicle_seats.rsi
    state: chair

- type: entity
  parent: CMSeatBase
  id: RMCSeatWhite
  name: 乘客座椅
  description: 一把坚固的座椅，带有可降下罩住身体的护架。可防止在车辆碰撞时被甩来甩去，从而避免受伤。系好安全带，孩子们！若损坏，请用焊接工具修复。
  placement:
    mode: PlaceFree
  components:
