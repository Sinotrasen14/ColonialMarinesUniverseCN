- type: entity
  parent: MarkerBase
  id: RMCDropshipDoorBlocker
  name: 运输船舱门阻挡器
  description: 阻止路障被拉入运输船。
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      dropship:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        layer:
        - DropshipImpassable

- type: entity
  parent: CMBaseStructureCorrodible
  id: RMCUtilityAttachmentPoint
  name: 公用设施连接点
  description: 公用设施系统的连接点
  components:
  - type: GuideHelp
    guides:
    - RMCGuideRoleCAS
  - type: Sprite
    sprite: _RMC14/Structures/Machines/dropship_attachment_points.rsi
    layers:
    - state: "equip_base"
      map: ["enum.DropshipPointVisualsLayers.AttachedUtility"]
    - state: "equip_base"
      map: ["enum.DropshipPointVisualsLayers.AttachmentBase"]
  - type: Icon
    sprite: _RMC14/Structures/Machines/dropship_attachment_points.rsi
    state: "equip_base"
  - type: Physics
    canCollide: false
  - type: Occluder
    enabled: false
  - type: InteractionOutline
  - type: Clickable
  - type: DropshipUtilityPoint
  - type: DropshipPointVisuals
  - type: Appearance
  - type: Tag
    tags:
    - RMCDropshipUtilityPoint

- type: entity
  parent: RMCUtilityAttachmentPoint
  id: CMUGunshipHardpointAttachmentPoint
  name: 挂点连接点
  description: 一种用于需多人操作的炮艇挂载点系统的受限连接点。
  components:
  - type: GunshipHardpointAttachmentPoint
  - type: Tag
    tags:
    - CMUGunshipHardpointAttachmentPoint

- type: entity
  parent: RMCUtilityAttachmentPoint
  id: CMUGunshipUtilityAttachmentPoint
  name: 炮艇通用系统挂载点
  description: 用于炮艇通用系统的受限挂载点。
  components:
  - type: GunshipUtilityAttachmentPoint
  - type: Tag
    tags:
    - CMUGunshipUtilityAttachmentPoint

- type: entity
  parent: CMBaseStructureCorrodible
  id: RMCEngineAttachmentPoint
  name: 引擎系统安装点
  description: 一个可以使用动力装载机安装重型设备的地方。
  components:
  - type: GuideHelp
    guides:
    - RMCGuideRoleCAS
  - type: Transform
    anchored: false
  - type: Sprite
    sprite: _RMC14/Objects/dropship_attachments.rsi
    layers:
    - state: "fuel_base"
      map: ["enum.DropshipPointVisualsLayers.AttachedUtility"]
      rotation: 180
      visible: false
    - state: "fuel_base"
      map: ["enum.DropshipPointVisualsLayers.AttachmentBase"]
  - type: Icon
    sprite: _RMC14/Objects/dropship_attachments.rsi
    state: "fuel_base"
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Occluder
    enabled: false
  - type: InteractionOutline
  - type: Clickable
  - type: DropshipEnginePoint
  - type: DropshipPointVisuals
  - type: Appearance
  - type: Tag
    tags:
    - RMCDropshipEnginePoint
  - type: WallMount
    arc: 360

- type: entity
  abstract: true
  parent: CMBaseStructureCorrodible
  id: RMCElectronicSystemAttachPoint
  categories: [HideSpawnMenu]
  name: 电子系统挂载点
  description: 可使用动力装载机安装重型设备的地点。
  components:
  - type: InteractionOutline
  - type: Clickable
  - type: DropshipElectronicSystemPoint
  - type: DropshipPointVisuals
  - type: Appearance
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Tag
    tags:
    - RMCDropshipElectronicSystemPoint

- type: Tag
  id: RMCDropshipEnginePoint

- type: Tag
  id: RMCDropshipElectronicSystemPoint
