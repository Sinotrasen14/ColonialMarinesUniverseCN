# Prefabs

- type: entity
  abstract: true
  id: RMCPrefabBase
  name: 预制结构
  description: 这种结构由金属支撑杆和坚固的聚凯夫隆塑料制成，是联合国防弹背心以及 USCMC 和 UPP 制服所用材料的衍生物。松散的墙体随每一阵风翻卷。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,1.5,1.9"
        density: 190
        layer:
        - MobMask
  - type: Sprite
    sprite: _RMC14/Structures/prefabs.rsi
    offset: 0.5, 0.5
  - type: Occluder
    polygon:
    - -0.5,-0.5
    - 1.5,-0.5
    - 1.5,1.9
    - -0.5,1.9

- type: entity
  abstract: true
  id: RMCPrefabBaseTop
  name: 预制结构
  description: 这种结构由金属支撑杆和坚固的聚凯夫隆塑料制成。这种材料是联合国防弹背心以及美国殖民地海军陆战队和进步人民联盟制服所用材料的衍生物。松垂的壁面随每一阵风翻动。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.1,0.1"
        density: 190
        layer:
        - MobMask
  - type: Sprite
    sprite: _RMC14/Structures/prefabs.rsi
    offset: 0.5, 0.5

