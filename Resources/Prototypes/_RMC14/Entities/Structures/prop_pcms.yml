- type: entity
  id: RMCPropPCMS
  name: 便携式可变信息标志
  description: 一种便携式可变信息标志，用于显示当地政府发布的官方指令。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    noRot: true
  - type: Physics
    bodyType: Static
    fixedRotation: true
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.7"
        density: 190
        layer:
        - MobMask
  - type: Sprite
    sprite: _RMC14/Structures/pcms.rsi
    offset: 0.5, 0.5
    state: base
  - type: DeleteOnExplosion
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Clickable
  - type: InteractionOutline
  - type: Corrodible
    isCorrodible: false
  - type: PointLight
    enabled: true
    radius: 2
    netsync: false
    energy: 2
    color: "#FA9632"

- type: entity
  parent: RMCPropPCMS
  id: RMCPropPCMS1
  suffix: Slow Down
  description: 一台 PCMS，它显示当地政府的官方指令。这一台显示的是“减速慢行”。
  components:
  - type: Sprite
    state: slow_down

- type: entity
  parent: RMCPropPCMS
  id: RMCPropPCMS2
  suffix: Tune To
  description: 一个PCMS，它显示当地政府发布的官方指示。这个显示的是“调到91.7 AM”。
  components:
  - type: Sprite
    state: tuneto

- type: entity
  parent: RMCPropPCMS
  id: RMCPropPCMS3
  suffix: Follow Orders
  description: 一个PCMS，它显示当地政府发布的官方指令。这个显示着“遵循UNMC命令”。
  components:
  - type: Sprite
    state: follow_orders

- type: entity
  parent: RMCPropPCMS
  id: RMCPropPCMS4
  suffix: Checkpoint Ahead
  description: 一种PCMS，用于显示当地政府发布的官方指示。这一台上显示的是“前方检查站”。
  components:
  - type: Sprite
    state: checkpoint

- type: entity
  parent: RMCPropPCMS
  id: RMCPropPCMS5
  suffix: Evac Center
  description: 一个PCMS，显示地方当局发布的官方指示。这一个显示的是‘疏散中心’。
  components:
  - type: Sprite
    state: evac_center
