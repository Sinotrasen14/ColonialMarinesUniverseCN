- type: entity
  parent: CMBaseStructureCorrodible
  id: CMHyperSleepChamber
  name: 超睡眠舱
  description: 一个带有LED显示屏的大型自动化舱，旨在让任何进入其中的人进入“超睡眠”，并与下层的一个长期超睡眠舱相连；“超睡眠”是大多数飞船上使用的一种非低温休眠状态。
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/Machines/hypersleep.rsi
    drawdepth: Mobs
    noRot: true
    layers:
    - state: open
      map: ["enum.HyperSleepChamberLayers.Base"]
  - type: UserInterface
    interfaces:
      enum.CryostorageUIKey.Key:
        type: CryostorageBoundUserInterface
  - type: ActivatableUI
    key: enum.CryostorageUIKey.Key
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: DragInsertContainer
    containerId: cm-hypersleep
  - type: ExitContainerOnMove
    containerId: cm-hypersleep
  - type: ContainerContainer
    containers:
      cm-hypersleep: !type:Container
  - type: HyperSleepChamber
  - type: Cryostorage
    containerId: cm-hypersleep
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CryostorageVisuals.Full:
        enum.HyperSleepChamberLayers.Base:
          true: {state: closed}
          false: {state: open}
  - type: InsertBlacklist
    blacklist:
      components:
      - Xeno
  - type: NoStunOnExit
  - type: RMCMesonsNonviewable

- type: entity
  parent: CMHyperSleepChamber
  id: CMHyperSleepChamberAlpha
  suffix: Alpha
  components:
  - type: SquadSpawner
    squad: SquadAlpha

- type: entity
  parent: CMHyperSleepChamber
  id: CMHyperSleepChamberBravo
  suffix: Bravo
  components:
  - type: SquadSpawner
    squad: SquadBravo

- type: entity
  parent: CMHyperSleepChamber
  id: CMHyperSleepChamberCharlie
  suffix: Charlie
  components:
  - type: SquadSpawner
    squad: SquadCharlie

- type: entity
  parent: CMHyperSleepChamber
  id: CMHyperSleepChamberDelta
  suffix: Delta
  components:
  - type: SquadSpawner
    squad: SquadDelta

- type: entity
  parent: CMHyperSleepChamber
  id: RMCHyperSleepChamberPVE
  suffix: PVE, East
  components:
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#75bdf0"
  - type: Sprite
    sprite: _RMC14/Structures/Machines/hypersleep_pve.rsi
    offset: 0.25, 0.25
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.55"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer

- type: entity
