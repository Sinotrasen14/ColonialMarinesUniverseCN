- type: entity
  id: RMCTelecomBusMainframe
  name: 总线主机
  description: 一种强大的硬件，用于快速发送海量数据。
  placement:
    mode: SnapgridCenter
  components: #has no collission in 13 they have invisible walls behind it
  - type: InteractionOutline
  - type: Clickable
  - type: Corrodible
    isCorrodible: false
  - type: ApcPowerReceiver
    powerLoad: 250
    needsPower: true
  - type: RMCPowerReceiver
    idleLoad: 5
    activeLoad: 10
    channel: Equipment
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/telecommunication.rsi
    layers:
    - state: bus_off
    - state: bus
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          true: {visible: true}
          false: {visible: false}
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer

- type: entity
  id: RMCTelecomReceiver
  parent: RMCTelecomBusMainframe
  name: 子空间接收器
  description: 这台机器呈碟形，带有绿色灯光。它旨在探测和处理子空间无线电活动。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/telecommunication.rsi
    layers:
    - state: broadcast_receiver_off
    - state: broadcast_receiver
      map: ["enum.PowerDeviceVisualLayers.Powered"]

- type: entity
  id: RMCTelecomBroadcaster #gets put ontop of stuff
  parent: RMCTelecomBusMainframe
  name: 亚空间广播器
  description: 一种用于广播经过处理的亚空间信号的碟形机器。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/telecommunication.rsi
    layers:
    - state: broadcaster_off
    - state: broadcaster
      map: ["enum.PowerDeviceVisualLayers.Powered"]

- type: entity
  id: RMCTelecomBroadcasterDD
  parent: RMCTelecomBroadcaster
  suffix: DrawDepth
  components:
  - type: Sprite
    drawdepth: "1"

- type: entity
