- type: entity
  id: RMCTelecomOSServerBox
  parent: RMCTelecomBusMainframe
  name: We-Yu OS服务器盒
  description: We-Yu OS是公司使用的一种专有操作系统，用于运行其几乎所有服务器、银行系统和管理系统。2144年的一次代码泄露让一些业余黑客认为，We-Yu OS大致基于2017年发布的TempleOS。但公司驳斥了这些说法。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/telecommunication.rsi
    layers:
    - state: WY_server_off
    - state: WY_server_on
      map: ["enum.PowerDeviceVisualLayers.Powered"]

- type: entity
  id: RMCTelecomBlackBox
  parent: RMCTelecomBusMainframe
  name: 黑匣子记录器
  description: 黑匣子记录器是一种用于记录船舶系统数据的设备。它被设计为防篡改，并能承受极端条件。                                                                                                              #custom
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/telecommunication.rsi
    layers:
    - state: blackbox
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Corrodible
    isCorrodible: true

- type: entity
  id: RMCTelecomBlackBoxDD
  parent: RMCTelecomBlackBox
  suffix: DrawDepth
  components:
  - type: Sprite
    drawdepth: "1"

