- type: entity
  id: RMCASRSAccount
  name: ASRS账户
  categories: [HideSpawnMenu]
  components:
  - type: RequisitionsAccount
    randomCrates:
    - every: 600
      minimum: 4
      minimumFor: 5
      choices:
      - RMCCrateBoxBulletsRifle
      - RMCCrateBoxBulletsRifleAP
      - RMCCrateBoxAmmo458
      - RMCCrateBoxMagazineM54CE2
      - RMCCrateBoxMagazinePistolM1984
      - RMCCrateBoxMagazinePistolM1984AP
#      - RMCCrateBoxMagazinePistolM1984HP
      - RMCCrateBoxMagazineRifleM54C
      - RMCCrateBoxMagazineRifleM54CAP
      - RMCCrateBoxMagazineRifleM4SPRAP
      - RMCCrateBoxShellsShotgunSlugs
      - RMCCrateBoxShellsShotgunBuckshot
      - RMCCrateBoxShellsShotgunFlechette
      - RMCCrateBoxShellsShotgunBreaching
      - RMCCrateBoxMagazineBreaching
      - RMCCrateMagazineSmartGun
      - RMCCrateMagazineNapthalUT
      - RMCCrateMagazineBGel
      - RMCCrateMagazineFlamerMixed
      - RMCCrateGearPackFlare
      - RMCCrateFoodMRE
      - RMCCrateFlashlights
      - RMCCrateHighCapacityPowerCell
    - every: 300
      minimum: 1
      minimumFor: 3
      choices:
      - RMCCrateFoodMRE
      - RMCCrateFoodPizza
      - RMCCrateFoodIngredients
      - RMCCrateFoodDonuts

- type: entity
  parent: [CMBaseStructureCorrodible, CMCargoCatalog]
  id: CMASRSConsole
  name: 自动化仓储检索系统控制台
  description: 自动化仓储检索系统的控制台。
  suffix: Requisitions
  components:
  - type: ItemSlots
    slots:
      ItemCabinet:
        whitelist:
          tags:
          - Currency
  - type: ColonyAtm
  - type: Sprite
    sprite: _RMC14/Structures/Machines/asrs_console.rsi
    layers:
    - map: ["computerLayerBody"]
      state: off
    - map: ["computerLayerScreen"]
      state: on
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.35,0.25,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: CargoOrderConsole
  - type: ActivatableUI
    key: enum.RequisitionsUIKey.Key
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [["CMAccessRequisitions"]]
  - type: UserInterface
    interfaces:
      enum.RequisitionsUIKey.Key:
        type: RequisitionsBui
  - type: Computer
    board: CargoRequestComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b89f25"
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSource
    range: 200
    ports:
    - OrderSender
  - type: GuideHelp
    guides:
    - Cargo
  - type: CargoSellBlacklist
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false
  - type: Appearance
  - type: LitOnPowered
  - type: EmitSoundOnUIOpen
    sound:
      collection: RMCKeyboardTyping
      params:
        volume: -1
  - type: RequireProjectileTarget
  - type: InteractionOutline
  - type: ContainerContainer
    containers:
      board: !type:Container
        ents: []
        showEnts: false
        occludes: true
      ItemCabinet: !type:ContainerSlot
        ent:
        showEnts: false
        occludes: true
  - type: Corrodible
    isCorrodible: false
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: RMCMesonsNonviewable

- type: entity
  parent: CMASRSConsole
  id: CMASRSConsolePowered
  suffix: Powered
  components:
  - type: ContainerContainer
    containers:
      board: !type:Container
        ents: []
        showEnts: false
        occludes: true
      ItemCabinet: !type:ContainerSlot
        ent:
        showEnts: false
        occludes: true
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false # intentionally!


- type: entity
  id: CMCargoElevator
  name: 载货电梯
  suffix: Lowered, Requisitions
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Effects/elevator.rsi
    drawdepth: LowFloors
    layers:
    - state: supply_elevator_lowered
      map: ["enum.RequisitionsElevatorLayers.Base"]
  - type: Physics
    bodyType: static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-2.3,-2.3,2.3,2.3"
        layer:
        - MidImpassable
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: Chasm
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 1
    blacklist:
      tags:
      - Catwalk
  - type: RequisitionsElevator
  - type: CargoSellBlacklist
  - type: WarpPoint
    location: cmu-warp-location-the-pit

- type: entity
  parent: CMBaseStructureCorrodible
  id: CMRailing
  name: 可伸缩栏杆
  description: 看起来这不容易打开。
  suffix: Raised
  components:
  - type: Transform
    anchored: false
    noRot: false
  - type: Sprite
    sprite: _RMC14/Structures/railing.rsi
    offset: 0,0.5
    layers:
    - state: raised
      map: ["enum.RequisitionsRailingLayers.Base"]
    noRot: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,-0.3"
        layer:
        - TableLayer
        mask:
        - TableMask
        density: 1000
  - type: Climbable
  - type: RequisitionsRailing
    mode: Raised
  - type: CargoSellBlacklist
  - type: RMCMesonsNonviewable

- type: entity
  id: CMGear
  name: 齿轮
  description: ""
  placement:
    mode: SnapgridCenter
