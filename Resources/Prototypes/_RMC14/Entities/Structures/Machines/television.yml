- type: entity
  parent: [BaseMachinePowered, RMCConstructibleMachine]
  id: RMCTelevision
  name: 电视机
  description: 一台连接着录像机的旧电视机，你甚至可以用它来时光平移《魔兽世界》。
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    layers:
    - state: security_det # TODO RMC14 unpowered and broken sprite
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false
  - type: RMCPowerReceiver
    idleLoad: 300
    activeLoad: 300
    channel: Equipment
  - type: Appearance
  - type: ActivatableUI
    key: enum.RMCCameraUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.RMCCameraUiKey.Key:
        type: RMCCameraBui
  - type: RMCCameraComputer
    title: rmc-television-title
  - type: CameraNetworkReceiver
    networks: [RMCTelevision]
    supportedSources: Rmc
  - type: Machine
    board: RMCCircuitboardTelevision

- type: entity
  parent: CMBaseMachineCircuitboard
  id: RMCCircuitboardTelevision
  name: 电视机电路板
  description: 用于电视机的机器印刷电路板。
  components:
  - type: MachineBoard
    prototype: RMCTelevision

- type: entity
  parent: RMCTelevision
  id: RMCTelevisionWallMount
  suffix: Wall Mount
  components:
  - type: WallMount
    arc: 360
  - type: Transform
    anchored: false
    noRot: false
  - type: Anchorable
    flags: None
  - type: Sprite
    drawdepth: WallMountedItems
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false
  - type: RMCPowerReceiver
    idleLoad: 300
    activeLoad: 300
    channel: Equipment
  - type: Appearance
  - type: ActivatableUI
    key: enum.RMCCameraUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.RMCCameraUiKey.Key:
        type: RMCCameraBui
  - type: RMCCameraComputer
    title: rmc-television-title
  - type: CameraNetworkReceiver
    networks: [RMCTelevision]
    supportedSources: Rmc
  - type: Machine
    board: RMCCircuitboardTelevision
