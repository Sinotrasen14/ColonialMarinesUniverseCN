- type: entity
  parent: BaseMachinePowered
  abstract: true
  id: RMCBasePhotocopier
  name: 复印机
  description: 一台用于复印……你知道的，照片的复印机！也可用于复印纸质文件。这一特定型号由 AEGIS Armaments 制造，采用了比大多数现代复印机更廉价的机身。它使用更原始的复印技术，导致更多碳粉浪费和更差的打印能力。尽管如此，其廉价构造意味着成本更低，而对于大多数时候只需要打印一两页纸的人来说，它很划算。
  components:
  - type: Transform
    anchored: false
    noRot: true
  - type: Physics
    bodyType: Static
  - type: ApcPowerReceiver
    needsPower: false # TODO RMC14
    powerLoad: 0
  - type: LitOnPowered
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.25,0.45"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  parent: RMCBasePhotocopier
  id: RMCPhotocopier
  name: 复印机
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/photocopier.rsi
    drawdepth: Objects
    state: bigscanner
  - type: Icon
    sprite: _RMC14/Structures/Machines/photocopier.rsi
    state: bigscanner

- type: entity
  parent: RMCPhotocopier
  id: RMCPhotocopierSmallHitbox
  suffix: Smaller
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.05,0.4,0.05"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200

- type: entity
  parent: RMCBasePhotocopier
  id: RMCPhotocopierPro
  name: We-Yu复印机
  description: 一台用于复印……你知道的，照片的复印机！也可用于在纸上复印文件。这一特定型号由We-Yu制造，机身比你在小公司看到的普通复印机更现代、更坚固。它采用纸张打印领域的一些最先进技术，例如更节省碳粉以及更高的打印能力。这一切使其成为需要为日常工作打印大量文书的消费者中的最爱。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/photocopier.rsi
    drawdepth: Objects
    state: bigscannerpro
  - type: Icon
    sprite: _RMC14/Structures/Machines/photocopier.rsi
    state: bigscannerpro
