- type: entity
  parent: CMBaseStructure
  abstract: true
  id: CMComputerDropship
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/shuttle_console.rsi
    drawdepth: SmallObjects
  - type: Corrodible
    isCorrodible: false
  - type: InteractionOutline

- type: entity
  parent: CMComputerDropship
  id: CMComputerDropshipNavigation
  name: 运输机导航计算机
  description: 一种可用于自动驾驶或长途飞行的飞行计算机。
  components:
  - type: Sprite
    state: console
  - type: DropshipNavigationComputer
  - type: ActivatableUI
    key: enum.DropshipNavigationUiKey.Key
  - type: AccessReader
    access: [["AU14AccessGovforFTL"], ["AU14AccessGovforPilot"], ["AU14AccessOpforFTL"], ["AU14AccessOpforPilot"]]
  - type: ActivatableUIRequiresAccess
  - type: UserInterface
    interfaces:
      enum.DropshipNavigationUiKey.Key:
        type: DropshipNavigationBui
      enum.DropshipHijackerUiKey.Key:
        type: DropshipHijackerBui

- type: entity
  parent: CMComputerDropshipNavigation
  id: CMComputerDropshipNavigationOpfor
  name: 运输机导航计算机
  suffix: Opfor
  components:
  - type: AccessReader
    access: [["AU14AccessOpforFTL"], ["AU14AccessOpforPilot"]]
  - type: WhitelistedShuttle
    faction: opfor
    ShuttleType: Dropship

- type: entity
  parent: CMComputerDropshipNavigation
  id: CMComputerDropshipNavigationERT
  name: 运输穿梭机
  description: 运输穿梭机的飞行计算机。
  components:
  - type: Sprite
    state: syndishuttle
  - type: DropshipNavigationComputer
    hijackable: false

- type: entity
  parent: CMComputerDropshipNavigation
  id: CMComputerDropshipNavigationERTTSE
  name: 运输穿梭机
  description: 运输穿梭机的飞行计算机。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/hybrisa_computer_props.rsi
    state: blacksensor_comp2
  - type: DropshipNavigationComputer
    hijackable: false
  - type: Transform
    anchored: false

- type: entity
  parent: CMComputerDropshipNavigation
  id: CMComputerDropshipNavigationERTCLF
  name: 运输穿梭机
  description: 运输穿梭机的飞行计算机。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Dropships/clf.rsi
    state: 93
  - type: DropshipNavigationComputer
    hijackable: false
  - type: Transform
    anchored: false

- type: entity
  parent: CMComputerDropshipNavigationERT
  id: CMComputerDropshipNavigationERTThirdParty
  suffix: Third Party
  components:
  - type: AccessReader
    access: []
  - type: WhitelistedShuttle
    faction: thirdparty
    ShuttleType: Dropship
    autoReturn: true

- type: entity
  parent: CMComputerDropshipNavigationERTTSE
  id: CMComputerDropshipNavigationERTTSEThirdParty
  suffix: Third Party
  components:
  - type: AccessReader
    access: []
  - type: WhitelistedShuttle
    faction: thirdparty
    ShuttleType: Dropship
    autoReturn: true

- type: entity
  parent: CMComputerDropshipNavigationERTCLF
  id: CMComputerDropshipNavigationERTCLFThirdParty
  suffix: Third Party
  components:
  - type: AccessReader
    access: []
  - type: WhitelistedShuttle
    faction: thirdparty
    ShuttleType: Dropship
    autoReturn: true

- type: entity
  parent: CMComputerDropship
  id: CMComputerDropshipNavigationPlanetside
  name: 运输机导航计算机
  description: 一种可用于指挥已链接运输机的飞行计算机。
  suffix: Planetside
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/dropship_nav_computer.rsi
    state: on
  - type: ActivatableUI
    key: enum.DropshipTerminalUiKey.Key
  - type: AccessReader
    access: [["CMAccessDropship"], ["CMAccessSquadLeaderPrep"], ["CMAccessXeno"]] # Xeno have access as to not cause the "Access denied!" popup.
  - type: ActivatableUIRequiresAccess
  - type: DropshipTerminal
  - type: UserInterface
    interfaces:
      enum.DropshipTerminalUiKey.Key:
        type: DropshipTerminalBui

- type: entity
  parent: CMBaseStructure
  id: RMCComputerDropshipNavigationSmall
  name: 运输船导航计算机
  description: 一种可用于自动驾驶或远程飞行的飞行计算机。
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    drawdepth: Objects
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: security_cam
    layers: []
  - type: Clickable
  - type: Corrodible
    isCorrodible: false
  - type: InteractionOutline
  - type: WallMount
    arc: 360
  - type: DropshipNavigationComputer
  - type: ActivatableUI
    key: enum.DropshipNavigationUiKey.Key
  - type: AccessReader
    access: [["AU14AccessGovforFTL"], ["AU14AccessGovforPilot"], ["AU14AccessOpforFTL"], ["AU14AccessOpforPilot"]]
  - type: ActivatableUIRequiresAccess
  - type: UserInterface
    interfaces:
      enum.DropshipNavigationUiKey.Key:
        type: DropshipNavigationBui
      enum.DropshipHijackerUiKey.Key:
        type: DropshipHijackerBui
  - type: PointLight
    enabled: true
    radius: 1.5
    netsync: true
    energy: 1
    offset: "0,0"
    color: "#FFEFD2"
    lightMask: ConeQuad

- type: entity
  parent: CMBaseStructure
  id: RMCComputerDropshipWeaponsSmall
  name: 运输机武器计算机
  description: 一种紧凑型计算机，可管理运输机上安装的设备、武器和模拟程序。
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    drawdepth: Objects
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: security_cam
    layers: []
  - type: Clickable
  - type: Corrodible
    isCorrodible: false
  - type: InteractionOutline
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: WallMount
    arc: 360
  - type: ActivatableUI
    key: enum.DropshipTerminalWeaponsUi.Key
  - type: AccessReader
    access: [["AU14AccessGovforFTL"], ["AU14AccessGovforPilot"], ["AU14AccessOpforFTL"], ["AU14AccessOpforPilot"]]
  - type: ActivatableUIRequiresAccess
  - type: UserInterface
    interfaces:
      enum.DropshipTerminalWeaponsUi.Key:
        type: DropshipWeaponsBui
  - type: DropshipTerminalWeapons
  - type: RequiresSkill
    skills:
      RMCSkillPilot: 1
  - type: PointLight
    enabled: true
    radius: 1.5
    netsync: true
    energy: 1
    offset: "0,0"
    color: "#FFEFD2"
    lightMask: ConeQuad

