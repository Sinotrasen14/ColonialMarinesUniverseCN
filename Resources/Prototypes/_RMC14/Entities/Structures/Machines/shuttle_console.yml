  components:
  - type: Sprite
    state: green
  - type: FTLBeacon
  - type: DropshipDestination
    FactionControlling: thirdparty
  - type: FTLSmashImmune
  - type: NoFTL

- type: entity
  parent: CMDropshipDestinationThirdPartyWhitelist
  id: CMDropshipDestinationThirdPartyReturn
  name: 返回深空
  description: 将第三方运输舰送回其等待航线。

- type: entity
