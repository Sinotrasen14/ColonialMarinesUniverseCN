- type: entity
  parent: MarkerBase
  id: CMDropshipDestination
  name: 运输船目的地
  description: 定义运输船在被驾驶时可进行超光速跃迁前往的有效位置。
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    state: green
  - type: FTLBeacon
  - type: DropshipDestination
  - type: FTLSmashImmune
  - type: NoFTL

- type: entity
  parent: MarkerBase
  id: CMDropshipDestinationHome
  name: 运输舰目的地（家园）
  description: 定义运输舰在有人驾驶时可进行超光速跃迁前往的有效位置。（家园）
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    state: green
  - type: FTLBeacon
  - type: DropshipDestination
  # NOT YET IMPLEMENTED  home: True
  - type: FTLSmashImmune
  - type: NoFTL

- type: entity
  parent: MarkerBase
  id: CMDropshipDestinationOpforWhitelist
  name: 运输机目的地
  description: 定义运输机在被驾驶时进行超光速跳跃前往的有效位置。
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    state: green
  - type: FTLBeacon
  - type: DropshipDestination
    FactionControlling: opfor
  - type: FTLSmashImmune
  - type: NoFTL

- type: entity
  parent: MarkerBase
  id: CMDropshipHijackDestination
  name: 劫持目的地
  description: 定义运输舰被劫持时可超光速跃迁前往的有效地点。
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    state: green
  - type: FTLBeacon
  - type: DropshipHijackDestination
  - type: FTLSmashImmune
  - type: NoFTL

- type: entity
  parent: MarkerBase
  id: CMDropshipDestinationThirdPartyWhitelist
  name: 运输艇目的地（第三方）
  description: 定义第三方运输艇在有人驾驶时可超光速跃迁前往的有效位置。
