- type: entity
  id: RMCStatusDisplay
  name: 状态显示
  description: 显示飞船当前状态的监视器。它时不时会闪烁。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/Machines/status_display.rsi
    drawdepth: WallMountedItems
    layers:
    - state: frame
    - map: ["screen"]
      state: bluealert
      visible: false
    - map: ["enum.RMCAlertLevelDisplayVisualLayers.HourTens"]
    - map: ["enum.RMCAlertLevelDisplayVisualLayers.HourOnes"]
    - map: ["enum.RMCAlertLevelDisplayVisualLayers.Separator"]
    - map: ["enum.RMCAlertLevelDisplayVisualLayers.MinuteTens"]
    - map: ["enum.RMCAlertLevelDisplayVisualLayers.MinuteOnes"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.RMCAlertLevelsVisuals.Alert:
        screen:
          Green: {visible: false}
          Blue: {state: bluealert, visible: true}
          Red: {state: redalert, visible: true}
          Delta: {state: evac, visible: true}
        enum.RMCAlertLevelDisplayVisualLayers.HourTens:
          Green: {visible: true}
          Blue: {visible: false}
          Red: {visible: false}
          Delta: {visible: false}
        enum.RMCAlertLevelDisplayVisualLayers.HourOnes:
          Green: {visible: true}
          Blue: {visible: false}
          Red: {visible: false}
          Delta: {visible: false}
        enum.RMCAlertLevelDisplayVisualLayers.Separator:
          Green: {visible: true}
          Blue: {visible: false}
          Red: {visible: false}
          Delta: {visible: false}
        enum.RMCAlertLevelDisplayVisualLayers.MinuteTens:
          Green: {visible: true}
          Blue: {visible: false}
          Red: {visible: false}
          Delta: {visible: false}
        enum.RMCAlertLevelDisplayVisualLayers.MinuteOnes:
          Green: {visible: true}
          Blue: {visible: false}
          Red: {visible: false}
          Delta: {visible: false}
  - type: RMCAlertLevelDisplay
  - type: WallMount
    arc: 360

- type: entity
  id: RMCStatusDisplayProp
  name: 状态显示器
  description: 显示飞船当前状态的显示器。它时不时闪烁。
  suffix: Prop
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/Machines/status_display.rsi
    drawdepth: WallMountedItems
    state: frame
  - type: Appearance
  - type: WallMount
    arc: 360

- type: entity
  id: RMCStatusDisplayLarge
  name: 大型状态显示屏
  description: 一个大型壁挂式显示器。它似乎无法正常工作。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/Machines/status_display_large.rsi
    drawdepth: WallMountedItems
    state: frame
    offset: 0.5, 0.0
  - type: Appearance
  - type: WallMount
    arc: 360
