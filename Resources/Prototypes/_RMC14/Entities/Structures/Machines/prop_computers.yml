- type: entity
  abstract: true
  parent: CMBaseStructure
  id: RMCPropComputerBase
  name: 终端
  description: 这可用于多种功能。
  suffix: Prop
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: terminal
    layers: []
  - type: Clickable
  - type: Corrodible
    isCorrodible: false
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: WallMount
    arc: 360

- type: entity
  parent: RMCPropComputerBase
  id: RMCPropCommunicationsConsole
  name: 通信控制台
  components:
  - type: Sprite
    state: comm

- type: entity
  parent: RMCPropCommunicationsConsole
  id: RMCPropCommunicationsConsoleAlt
  suffix: Prop, Alt
  components:
  - type: Sprite
    state: comm_alt

- type: entity
  parent: RMCPropComputerBase
  id: RMCPersonalDesktop
  name: 个人桌面
  components:
  - type: Sprite
    state: terminal1

- type: entity
  parent: RMCPropComputerBase
  id: RMCSecurityCameraConsole
  name: 安防摄像头控制台
  components:
  - type: Sprite
    state: security_cam

- type: entity
  parent: RMCSecurityCameraConsole
  id: RMCDropshipWeaponsConsoleProp
  name: 运输机武器控制
  components:
  - type: Sprite
    drawdepth: Objects
  - type: PointLight
    enabled: true
    radius: 1.5
    netsync: true
    energy: 1
    offset: "0,0"
    color: "#FFEFD2"
    lightMask: ConeQuad

- type: entity
  parent: RMCPropComputerBase
  id: RMCSecurityRecordsConsole
  name: 安全记录
  components:
  - type: Sprite
    state: jas

- type: entity
  parent: RMCPropComputerBase
  id: RMCSecurityRecordsConsoleAlt
  name: 安全记录
  components:
  - type: Sprite
    state: security

- type: entity
  parent: RMCPropComputerBase
  id: RMCIdentificationComputer
  name: 识别计算机
  components:
  - type: Sprite
    state: engineering_terminal

- type: entity
  parent: RMCPropComputerBase
  id: RMCStationAlertComputer
  name: 车站警报计算机
  components:
  - type: Sprite
    state: atmos

- type: entity
  parent: RMCPropComputerBase
  id: RMCSystemsComputer
  name: 系统计算机
  components:
  - type: Sprite
    state: terminal
