- type: entity
  parent: ColMarTechFood
  id: RMCNutriCoVendor
  name: NutriCo 自动厨师
  description: 自动厨师食物分配器，能够分发含有任何人可能需要的所有必需维生素和营养的食物。看似不可食用的污泥经过各种加热器、重塑器和固化器的处理，再被人工调味，制成看起来和尝起来大致可食用的东西。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/NutriCo/food.rsi
    offset: 0, 0.5

- type: entity
  parent: RMCNutriCoVendor
  id: RMCVendorNutriCoFoodPMC
