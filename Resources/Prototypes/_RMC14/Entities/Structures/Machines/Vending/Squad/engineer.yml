- type: entity
  parent: ColMarTechBase
  id: ColMarTechSCTEquipment
  name: ColMarTech 小队战斗技术员装备架
  description: 一台自动化装备架，连接着一个巨大的战斗技术员制式装备储备库。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/clothing.rsi
  - type: AccessReader
    access: [["CMAccessCombatTechPrep"], ["AU14AccessGovforEngineering"], ["AU14AccessOpforEngineering"]]
  - type: CMAutomatedVendor
    jobs:
    - CMCombatTech
    sections:
    - name: 标准设备
      takeAll: CMStandard
      entries:
      - id: CMVendorBundleCombatTechnicianApparel
      - id: CMMRE
      #- id: CMMap # TODO: Make a map
    - name: 手套
      choices: {CMHands: 1}
      entries:
      - id: CMHandsInsulated
      - id: CMHandsBlackInsulated
    - name: 头盔
      choices: {CMHelmet: 1}
      entries:
      - id: CMArmorHelmetM10Tech
      - id: RMCArmorHelmetM10Welding
    - name: 护甲
      choices: {CMArmor: 1}
      entries:
      - id: RMCArmorVestSquad
      - id: RMCArmorM3LightVariants
        name: 轻甲
      - id: RMCArmorM3MediumVariants
        name: 中型护甲
        recommended: true
      - id: RMCArmorM3HeavyVariants
        name: 重甲
    - name: 背包
      choices: {CMBackpack: 1}
      entries:
      - id: RMCScabbardMacheteFilled
        name: 砍刀刀鞘（满）
      - id: CMBackpackMarineTech
        replaceSlot: back
      - id: CMSatchelMarineTech
        replaceSlot: back
      - id: CMBackpackWelder
        replaceSlot: back
        recommended: true
      - id: RMCSatchelWelder
        replaceSlot: back
      - id: RMCSatchelWelderChestrig
        replaceSlot: back
        recommended: true
    - name: 腰带
      choices: {CMBelt: 1}
      entries:
      - id: RMCBeltConstruction
        recommended: true
      - id: CMBeltUtilityFilled
        name: M276型工具腰带挂具（完整版）
        # mandatory: true, TODO allow vendors to mark entries as mandatory
      - id: RMCBeltUtilityGeneral
      - id: CMBeltMarine
      - id: RMCBeltHolsterPistol
      - id: RMCBeltHolsterRevolver
      - id: RMCBeltHolsterSMG
      - id: RMCBeltHolsterSMGPouch
      - id: RMCM82FHolster
      - id: RMCM276ShotgunShellLoadingRig
      - id: RMCBeltGrenade
    - name: 小袋
      choices: {RMCPouch: 2}
      entries:
      - id: RMCPouchConstruction
        recommended: true
      - id: RMCPouchFirstAidInjectors
        name: 急救包（可补充注射器）
        recommended: true
      - id: RMCPouchFirstAidSplintsGauzeOintment
        name: 急救袋（纱布、软膏）                        # TODO RMC14 splints comma
        recommended: true
      - id: RMCPouchFirstAidPills
        name: 急救包（药片）
        recommended: true
      - id: RMCPouchElectronicsFill
        name: 电子产品收纳袋（满装）
      - id: RMCPouchExplosive
      - id: RMCPouchFlareFilled
        name: 信号弹袋（满）
      - id: RMCPouchMagazinePistolLarge
      - id: RMCPouchMagazine
      - id: RMCPouchShotgun
      - id: RMCPouchGeneralMedium
      - id: RMCPouchPistol
      - id: RMCPouchToolsFill
        name: 工具袋（满）
      - id: RMCPouchEngineerKit
    - name: 配件
      choices: {CMAccessories: 1}
      entries:
      - id: RMCToolWebbingSmallFilled
        name: 小型工具织带（全）
        recommended: true
      - id: CMWebbingBlack
      - id: CMWebbingBrown
      - id: RMCWebbingLegPouch
      - id: RMCWebbingLegPouchBlack
      - id: CMWebbing
      - id: RMCWebbingBlackSmall
      - id: RMCWebbingDropPouch
      - id: RMCWebbingDropPouchBlack
      - id: CMWebbingHolster
      - id: RMCWebbingHolsterBlack
    - name: 面具
      choices: {CMMask: 1}
      entries:
      - id: CMMaskGas
      - id: CMMaskCoif
      - id: RMCMaskRebreather

- type: entity
  parent: ColMarTechBase
  id: ColMarTechSCTTools
  name: ColMarTech小队通讯技术工具自动售货机
  description: 一台储存多种在实地实用的额外工具的自动售货机。
  components:
  - type: AccessReader
    access: [["CMAccessCombatTechPrep"], ["AU14AccessGovforEngineering"], ["AU14AccessOpforEngineering"]]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/tool.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "normal-unshaded"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
  - type: CMAutomatedVendor
    access: ["CMAccessCombatTechPrep", "AU14AccessGovforEngineering", "AU14AccessOpforEngineering"]
    hackable: true
    jobs:
    - CMCombatTech
    sections:
    - name: 设备
      entries:
      - id: CMBeltUtility
        name: 多功能工具腰带
        amount: 4
      - id: RMCCableCoil
        amount: 4
      - id: RMCWeldingGoggles
        amount: 2
      - id: RMCEngineerKit
        amount: 2
    - name: 工具
      entries:
      - id: CMWelder
        amount: 4
      - id: CMCrowbar
        amount: 4
      - id: CMScrewdriver
        amount: 4
      - id: CMWirecutter
        amount: 4
      - id: CMWrench
        amount: 4
      - id: CMMultitool
        amount: 4
      - id: CMWelderSmall
        amount: 2
      - id: RMCLightReplacer
        amount: 4
    - name: 实用工具
      entries:
      - id: RMCSentryLaptop
        name: 哨兵枪网络笔记本电脑
        amount: 4
      - id: CMUDeployableZLevelLadder
        amount: 4
