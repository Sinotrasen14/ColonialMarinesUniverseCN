    - id: RMCAttachmentAngledGrip
    - id: RMCAttachmentSuppressor
    - id: RMCAttachmentExtendedBarrel
    - id: CMMagazineRifleM54CAP
      amount: 2

- type: entity
  parent: RMCKitBase
  id: RMCKitEngineering
  name: 工程补给包
  description: 包含一个工程袋，内有50金属、30塑钢和15铁丝网，以及一个电子袋，内有三块高容量电池。
  components:
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,9,1
  - type: Sprite
    sprite: _RMC14/Objects/Storage/procase_mini.rsi
  - type: Icon
    sprite: _RMC14/Objects/Storage/procase_mini.rsi
  - type: StorageFill
    contents:
    - id: RMCPouchConstructionFillLowGrade
    - id: RMCPouchElectronicsFill
    - id: RMCWeldingGoggles

- type: entity
  parent: RMCKitBase
  id: RMCKitPyroMini
  name: M240 烟火技师支援套件                   #cmu14
  description: 包含一个 M240 焚化器装置、一个 G4-1 燃料箱、3 个焚化器燃料罐以及一个便携式灭火器。                                                          #cmu14
  components:
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,11,1
  - type: Sprite
    sprite: _RMC14/Objects/Storage/procase_mini.rsi
  - type: Icon
    sprite: _RMC14/Objects/Storage/procase_mini.rsi
  - type: StorageFill
    contents:
    - id: RMCBackpackFlamer
    - id: RMCWeaponFlamer
    - id: RMCTankFlamer
      amount: 2 # TODO RMC14 projectile nozzle
    - id: RMCTankFlamerBGel
    - id: CMFireExtinguisherPortable

- type: entity
  parent: CMArmorB12
  id: RMCArmorB12Zipties
  name: 领袖 B12 型海军陆战队装甲
  description: 一套专为快速移动打造的轻量碳纤维护甲。采用可爱的森林绿设计。用它切换内置手电筒。此款另有一个独立小袋，用于放置扎带盒。
  suffix: Zipties
  components:
  - type: Storage
    grid:
    - 0,0,7,1
  - type: StorageFill
    contents:
    - id: RMCBoxZiptie
  - type: LimitedStorage
    limits:
    - popup: rmc-storage-limit-not-ziptie-box
      blacklist:
        tags:
        - RMCBoxZipties
      whitelist:
      count: 3

- type: entity
  parent: CMArmorM4
  id: RMCArmorM4Zipties
  name: 队长M4样式陆战队护甲
  description: 一件经过精心改装与制作的混合护甲，结合了Smart-Gunner网布与M3样式护板。坚固却灵活，为你所有的包袋留出空间。这一件还为扎带盒配有独立小袋。
  suffix: Zipties
  components:
  - type: Storage
    grid:
    - 0,0,9,1
  - type: StorageFill
    contents:
    - id: RMCBoxZiptie
  - type: LimitedStorage
    limits:
    - popup: rmc-storage-limit-not-ziptie-box
      blacklist:
        tags:
        - RMCBoxZipties
      whitelist:
      count: 4
