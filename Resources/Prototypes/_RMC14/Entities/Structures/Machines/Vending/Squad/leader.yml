- type: entity
  parent: ColMarTechBase
  id: ColMarTechSLEquipment
  name: ColMarTech小队队长装备架
  description: 一个自动化装备架，连接着一个巨大的存储库，存放着小队队长的标准配发装备。
  components:
  - type: AccessReader
    access:
    - ["CMAccessSquadLeaderPrep"]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/clothing.rsi
  - type: CMAutomatedVendor
    jobs:
    - CMSquadLeader
    sections:
    - name: 标准设备
      takeAll: CMStandard
      entries:
      - id: CMVendorBundleSquadLeaderApparel
      - id: RMCBackpackRTO
        replaceSlot: back
      - id: CMMRE
      #- id: CMMap # TODO: Make a map
    - name: 护甲
      choices: {CMArmour: 1}
      entries:
      - id: RMCArmorB12Zipties
        name: 队长 B12 式海军陆战队装甲（扎带）
        recommended: true
      - id: RMCArmorM4Zipties
        name: 领袖M4型陆战队装甲（扎带）
      - id: RMCArmorVestSquadLeader
        name: 领队M3-XL迷彩防弹背心（扎带）
    - name: 背包
      choices: {CMBackpack: 1}
      entries:
      - id: CMBackpackMarine
      - id: RMCScabbardMacheteFilled
      - id: CMSatchelMarine
        recommended: true
    - name: 腰带
      choices: {CMBelt: 1}
      entries:
      - id: RMCBeltUtilityGeneral
      - id: CMBeltMarine
        recommended: true
      - id: CMBeltMedicBag
      - id: CMBeltMedical
      - id: RMCBeltHolsterPistol
      - id: RMCBeltHolsterM13
      - id: RMCBeltHolsterRevolver
      - id: RMCBeltHolsterSMG
      - id: RMCBeltHolsterSMGPouch
      - id: RMCM82FHolster
      - id: RMCM276ShotgunShellLoadingRig
      - id: CMBeltUtilityFilled
        name: M276型工具腰带挂具（满配）
      - id: RMCBeltGrenade
    - name: 小袋
      choices: {RMCPouch: 2}
      entries:
      - id: RMCPouchAutoinjectorFill
        recommended: true
      - id: RMCPouchFirstAidInjectors
        name: 急救袋（可补充注射器）
      - id: RMCPouchFirstAidSplintsGauzeOintment
        name: 急救包（纱布、药膏）                        # TODO RMC14 splints comma
      - id: RMCPouchFirstAidPills
        name: 急救袋（药丸）
        recommended: true
      - id: RMCPouchFlareFilled
        name: 信号弹袋（满）
      - id: RMCPouchFuelTank
      - id: RMCPouchGeneralLarge
        recommended: true
      - id: RMCPouchSling
      - id: RMCPouchMagazineLarge
      - id: RMCPouchShotgunLarge
      - id: RMCPouchMagazinePistolLarge
      - id: RMCPouchPistol
    - name: 配件
      choices: {CMAccessories: 1}
      entries:
      - id: CMWebbingBlack
      - id: CMWebbingBrown
        recommended: true
      - id: RMCWebbingLegPouch
      - id: RMCWebbingLegPouchBlack
      - id: CMWebbing
      - id: RMCWebbingBlackSmall
      - id: RMCWebbingDropPouch
      - id: RMCWebbingDropPouchBlack
      - id: CMWebbingHolster
      - id: RMCWebbingHolsterBlack
    - name: 面具
      choices: {CMMask: 1}
      entries:
      - id: CMMaskGas
      - id: CMMaskCoif
      - id: RMCMaskRebreather

- type: entity
  parent: CMVendorBundleRiflemanApparel
  id: RMCVendorBundleCrewLeader
  name: 小队队长必备装备
  description: 包含一个激光指示器、一包信号弹、一份破门炸药和一个灭火器。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Explosives/plastic_explosives.rsi
    state: icon
  - type: CMVendorBundle
    bundle:
    - RMCExplosivePlastic
    - RMCExplosiveBreachingCharge
    - RMCPackFlareCAS
    - RMCLaserDesignator
    - CMFireExtinguisherPortable
    - RMCFulton20
    - RMCBoxZiptie
    - RMCWhistle

- type: entity
  parent: RMCKitBase
  id: RMCKitRifleM4SPR
  name: M4SPR精确射手套件
  description: 包含一把M4SPR步枪、一个4倍瞄准镜、一个消音器、一根加长枪管和2个穿甲弹匣。
  components:
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,9,1
  - type: StorageFill
    contents:
    - id: WeaponRifleM4SPR
    - id: RMCAttachmentS84xTelescopicScope
    - id: RMCAttachmentSuppressor
    - id: RMCAttachmentExtendedBarrel
    - id: CMMagazineRifleM4SPRAP
      amount: 2

- type: entity
  parent: RMCKitBase
  id: RMCKitCM54C
  name: M54C步枪套件
  description: 包含一把M54C步枪、一个斜角握把、一个消音器、一根加长枪管和2个AP弹匣。
  components:
