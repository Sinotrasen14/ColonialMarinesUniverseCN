        amount: 25
        recommended: true
      - id: RMCAttachmentFlashlightGrip
        amount: 10
        recommended: true
      - id: RMCAttachmentU1GrenadeLauncher
        amount: 25
    - name: 公用事业
      entries:
      - id: RMCM5Bayonet
        amount: 25
      - id: CMPackFlare
        amount: 10
        recommended: true
    - name: 杂志盒
      hasBoxes: true
      jobs:
      - CMQuartermaster
      - CMCargoTech
      entries:
