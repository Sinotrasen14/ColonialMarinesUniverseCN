- type: entity
  parent: ColMarTechBase
  id: ColMarTechFLEquipment
  name: ColMarTech 火力小组组长装备架
  description: 连接到火力小组组长标准配发装备海量储备库的自动化装备架。
  components:
  - type: AccessReader
    access:
    - ["CMAccessFTLPrep"]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/clothing.rsi
  - type: CMAutomatedVendor
    jobs:
    - CMFireteamLeader
    sections:
    - name: 标准设备
      takeAll: CMStandard
      entries:
      - id: CMVendorBundleFireteamLeaderApparel
      - id: RMCBackpackRTO
        replaceSlot: back
      - id: CMMRE
      #- id: CMMap # TODO: Make a map
      - id: RMCVendorBundleCrewFireteamLeader
    - name: 手套
      choices: {CMHands: 1}
      entries:
      - id: CMHandsInsulated
      - id: CMHandsBlackInsulated
    - name: 护甲
      choices: {CMArmor: 1}
      entries:
      - id: CMArmorM4
        recommended: true
      - id: RMCArmorVestSquad
    - name: 腰带
      choices: {CMBelt: 1}
      entries:
      - id: RMCBeltUtilityGeneral
      - id: CMBeltMarine
        recommended: true
      - id: RMCBeltHolsterPistol
      - id: RMCBeltHolsterM13
      - id: RMCBeltHolsterRevolver
      - id: RMCBeltHolsterSMG
      - id: RMCBeltHolsterSMGPouch
      - id: RMCM82FHolster
      - id: RMCM276ShotgunShellLoadingRig
      - id: CMBeltUtilityFilled
        name: M276型工具腰带装备（完整版）
        recommended: true
      - id: RMCBeltGrenade
    - name: 小袋
      choices: {RMCPouch: 2}
      entries:
      - id: RMCPouchFirstAidInjectors
        name: 急救包（可补充注射器）
        recommended: true
      - id: RMCPouchFirstAidSplintsGauzeOintment
        name: 急救袋（纱布、药膏）                        # TODO RMC14 splints comma
        recommended: true
      - id: RMCPouchFirstAidPills
        name: 急救袋（药片）
      - id: RMCPouchFirstResponder
      - id: RMCPouchFlareFilled
        name: 信号弹袋（满）
      - id: RMCPouchFuelTank
      - id: RMCPouchGeneralLarge
      - id: RMCPouchSling
      - id: RMCPouchMagazinePistolLarge
      - id: RMCPouchMagazine
      - id: RMCPouchShotgun
      - id: RMCPouchPistol
      - id: RMCPouchToolsFill
        recommended: true
        name: 工具袋（已满）
    - name: 配件
      choices: {CMAccessories: 1}
      entries:
      - id: CMWebbingBlack
      - id: RMCWebbingLegPouch
      - id: RMCWebbingLegPouchBlack
      - id: CMWebbingBrown
        recommended: true
      - id: CMWebbing
      - id: RMCWebbingBlackSmall
      - id: RMCWebbingDropPouch
      - id: RMCWebbingDropPouchBlack
      - id: CMWebbingHolster
      - id: RMCWebbingHolsterBlack
    - name: 面具
      choices: {CMMask: 1}
      entries:
      - id: CMMaskGas
      - id: CMMaskCoif
      - id: RMCMaskRebreather

- type: entity
  parent: CMVendorBundleRiflemanApparel
  id: RMCVendorBundleCrewFireteamLeader
  name: 火力小组组长必备装备
  description: 包含一个激光指示器，以及两包信号弹。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/binoculars.rsi
    layers:
    - state: rangefinder
    - state: laser_cas
  - type: CMVendorBundle
    bundle:
    - RMCPackFlareCAS
    - RMCPackFlareCAS
    - RMCLaserDesignator
