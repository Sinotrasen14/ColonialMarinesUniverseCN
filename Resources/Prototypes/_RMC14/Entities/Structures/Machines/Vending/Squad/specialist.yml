        points: 40
      - id: CMMagazineSniperM96SIncendiary
        points: 40
      - id: CMMagazineSniperM96S
        points: 40
      - id: RMCMagazineSniperXM43E1AntiMateriel
        points: 40
    - name: 额外爆破手弹药
      entries:
