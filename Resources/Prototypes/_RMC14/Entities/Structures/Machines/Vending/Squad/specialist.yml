        points: 40
      - id: RMCRocket84mm
        points: 40
      - id: RMCRocket84mmWhitePhosphorus
        points: 40
    - name: 额外手榴弹
      entries:
      - id: CMGrenadeHighExplosive
        name: 30毫米HEDP爆破榴弹（x6）
        points: 40
        spawn: 6
      - id: RMCGrenadeIncendiary
        name: 30毫米HIAM榴弹（×6）
        points: 40
        spawn: 6
      #- id: M40HPDPWhitePhosphorusGrenadesx6
      #  points: 40
      - id: RMC40MMGrenadeM74AGMF
        points: 40
        spawn: 6
      - id: RMC40MMGrenadeM74AGMI
        points: 40
        spawn: 6
