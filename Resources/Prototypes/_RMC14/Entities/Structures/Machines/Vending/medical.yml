- type: entity
  parent: ColMarTechBaseAnchorable
  id: CMVendorBlood
  name: MM血液分配器
  description: 海洋医疗品牌血包分配器是2105年首屈一指的顶级血液分配器！立即购买吧！                                                                                 #dont update year, that`s a joke from cm13
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/blood.rsi
    snapCardinals: true
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "normal-unshaded"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: "panel"
      visible: false
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: ApcPowerReceiver
    needsPower: false # TODO RMC14
    powerLoad: 0
  - type: AccessReader
    access:
    - ["CMAccessMedical"]
  - type: CMAutomatedVendor
    hackable: true
    sections:
    - name: 血包
      entries:
      - id: CMBloodPackFull
        amount: 30 # 6 blood types, 5 each
    - name: 其他
      entries:
      - id: CMBloodPack
        amount: 5
        name: 空血袋
