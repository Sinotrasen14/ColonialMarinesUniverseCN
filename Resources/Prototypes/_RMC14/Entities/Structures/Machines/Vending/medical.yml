      components:
      - Hypospray
      - Vial
      tags:
      - Bottle
  - type: CMAutomatedVendor # TODO RMC14 different ui style
    hackable: true
    randomUnstockAmount: -1 # -1 is between 1 and the original amount
    randomEmptyChance: 0.25 # 25% chance
    sections:
    - name: 野外用品
      entries:
      - id: CMBurnKit10
        amount: 10
      - id: CMTraumaKit10
        amount: 10
      - id: CMOintment10
        amount: 10
      - id: CMGauze10
        amount: 10
#      - id: CMSplints10 # TODO RMC14
#        amount: 10
