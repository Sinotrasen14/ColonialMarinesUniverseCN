# EQUIPMENT VENDOR

- type: entity
  parent: ColMarTechBase
  id: ColMarTechCrewCombatCorrespondent
  name: ColMarTech 战地记者装备架
  description: 一个自动化装备架，连接着一个庞大的战地记者标准配发装备储存库。
  components:
  - type: AccessReader
    access:
    - ["CMAccessPress"]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/clothing.rsi
  - type: CMAutomatedVendor
    jobs:
    - CMCorrespondent
    sections:
    - name: 标准设备
      takeAll: CMStandard
      entries:
      - id: RMCVendorBundleCrewCombatCorrespondent
        name: 记者必备套装
      - id: CMSatchel
        name: 皮革挎包
      - id: RMCBackpackRTOBagPhone
        name: 便携式手机包
      - id: RMCCameraBroadcasting
        name: 新闻广播摄像机
        recommended: true
    #- name: Civilian Equipment TODO - Some way to ensure only the civilian correspondent can buy this
    #  takeAll: CMStandard
    #  entries:
    #  - id: PortableFaxMachine
    #    name: Portable Press Fax Machine
    #    recommended: true
    - name: 制服
      choices: {CMUniform: 1}
      entries:
      - id: RMCJumpsuitCorrespondentBlack
        name: 黑色制服
      - id: RMCJumpsuitCorrespondentOrange
        name: 橙色制服
      - id: RMCJumpsuitCorrespondentRed
        name: 红色制服
    - name: 护甲
      choices: {CMArmor: 1}
      entries:
      - id: CMArmorPress
        name: 战地记者的护甲
        recommended: true
      - id: RMCCoatCorrespondentBlue
        name: 蓝色背心
      - id: RMCHazardVestBlack
        name: 黑色背心
      - id: RMCCoatCorrespondentBlack
        name: 黑色外套
      - id: RMCCoatCorrespondentGreen
        name: 绿色外套
    - name: 头盔
      choices: {CMHelmet: 1}
      entries:
      - id: CMArmorHelmetPress
        name: 战地记者的头盔
        recommended: true
      - id: RMCHeadCapCorrespondent
        name: 战地记者帽
      - id: RMCHeadCapFedoraGrey
        name: Fedora
    - name: 补充装
      entries:
      #- id: /obj/item/device/camera
      #  name: Camera
      #  points: 10
      #- id: /obj/item/device/camera_film
      #  name: Camera Film
      #  points: 5
      #- id: /obj/item/device/toner
      #  name: Toner
      # points: 5
      - id: RMCBoxRegulationTapes
        name: 监管磁带
        points: 15
      - id: CMPaperBin30
        name: 纸箱
        points: 10

- type: entity
  parent: CMVendorBundleRiflemanApparel
  id: RMCVendorBundleCrewCombatCorrespondent
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Tools/Light/flashlight.rsi
    state: flashlight
  - type: CMVendorBundle
    bundle:
    - RMCFlashlight
    - CMPen
    - RMCBinoculars
    - CMClipboard # notepad
    - RMCUniversalRecorder
