# MEDICAL

- type: entity
  parent: ColMarTechBase
  id: ColMarTechCrewMedicalEquipment
  name: ColMarTech 医疗设备架
  description: 医疗部的自动设备售货机。
  components:
  - type: AccessReader
    access:
    - ["CMAccessMedical"]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/medical_equipment.rsi
  - type: CMAutomatedVendor
    jobs:
    - CMNurse
    - CMDoctor
    - RMCFieldDoctor
    - CMResearcher
    - CMCMO
    sections:
    - name: 医疗套装（必填）
      jobs:
      - CMDoctor
      - RMCFieldDoctor
      - CMResearcher
      - CMCMO
      takeAll: CMMedicalSet
      entries:
      - id: RMCVendorBundleCrewMedicalEssentialsDoctor
    - name: 医疗套装（必填）
      jobs:
      - CMNurse
      takeAll: CMMedicalSet
      entries:
      - id: CMVendorBundleCrewMedicalEssentialsNurse
    - name: 标准设备
      takeAll: CMStandard
      entries:
      - id: CMHandsLatex
      - id: CMHeadsetMedical
    - name: 眼镜
      choices: {CMEyewear: 1}
      entries:
      - id: RMCGlassesMedicalHUDGlasses
#      - id: Prescription Medical HUD Glasses
    - name: 制服
      choices: {CMUniform: 1}
      entries:
      - id: CMScrubsGreen
      - id: CMScrubsBlue
      - id: RMCScrubsLightBlue
      - id: CMScrubsPurple
      - id: RMCScrubsOlive
      - id: RMCScrubsGrey
    - name: 西装
      jobs:
      - CMNurse
      choices: {CMSuit: 1}
      entries:
      - id: RMCMedicalApron
    - name: 西装
      jobs:
      - CMDoctor
      choices: {CMSuit: 1}
      entries:
      - id: RMCLabcoat
      - id: RMCMedicalApron
#    - name: Snow gear (Snow use only)
#      takeall: CMSnowgear
#      entries:
#      - id: Snowcoat
#      - id: Balaclava
#      - id: Snow Scarf
    - name: 头饰
      choices: {CMHeadwear: 1}
      entries:
      - id: CMHeadCapSurgOrange
      - id: CMHeadCapSurgBlue
      - id: CMHeadCapSurgPurple
      - id: CMHeadCapSurgGreen
    - name: 腰带
      choices: {CMBelt: 1}
      entries:
      - id: CMBeltMedicBagFilled
        name: M276 型救生包（全套）
      - id: CMBeltMedicalFilled
        name: M276型医疗储物胸挂（满）
    - name: 背包
      choices: {CMBackpack: 1}
      entries:
      - id: CMBackpackMarine
        name: 背包
        replaceSlot: back
      - id: CMSatchelMarine
        name: 挎包
        replaceSlot: back
      - id: CMBackpackMedical
        replaceSlot: back
      - id: CMSatchelMedical
        replaceSlot: back
    - name: 小袋
      choices: {RMCPouch: 2}
      entries:
      - id: RMCPouchAutoinjector
      - id: RMCPouchFirstAidInjectors
        name: 急救包（可填充注射器）
      - id: RMCPouchFirstAidSplintsGauzeOintment
        name: 急救袋（纱布、药膏）                        # TODO RMC14 splints comma
      - id: RMCPouchFirstAidPills
        name: 急救药袋（药丸）
      - id: RMCPouchFirstResponder
      - id: RMCPouchMedical
      - id: RMCPouchMedkit
        recommended: true
      - id: RMCPouchReagentCanisterBicaridine
        recommended: true
        name: "加压试剂罐袋\n（比卡利定）"
      - id: RMCPouchReagentCanisterKelotane
        recommended: true
        name: "加压试剂罐袋\n（凯洛坦）"
      - id: RMCPouchReagentCanisterTricordrazineRevival
        recommended: true
        name: 增压试剂罐袋\n（复活混合剂 - 三可待因）
      #      - id: CMPressurizedReagentCanisterPouchPeridaxonRevivalMix
      #        recommended: true
      #        name: Pressurized Reagent Canister Pouch\n(Revival Mix - Peridaxon)
      - id: RMCPouchReagentCanisterTricordrazine
        recommended: true
        name: "加压试剂罐袋\n（三可拉嗪）"
      - id: RMCPouchReagentCanister
        recommended: true
        name: "加压试剂罐袋\n（空）"
      - id: RMCPouchSling
    - name: 配件
      choices: {CMAccessories: 1}
      entries:
      - id: CMWebbingBrown
      - id: CMWebbingBlack
      - id: RMCWebbingLegPouch
      - id: RMCWebbingLegPouchBlack
      - id: CMWebbing
      - id: RMCWebbingBlackSmall
      - id: RMCWebbingDropPouch
      - id: RMCWebbingDropPouchBlack
