- type: entity
  parent: CMVendorBundleRiflemanApparel
  id: RMCVendorBundleIntel
  name: 必备情报套装
  description: 包含撬棍、富尔顿回收装置、情报探测器和望远镜。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Tools/intel_detector.rsi
    state: datadetector
  - type: CMVendorBundle
    bundle:
    - CMCrowbar
    - RMCFulton20
    - RMCIntelDetector
    - RMCBinoculars

- type: entity
  parent: RMCKitBase
  id: RMCKitIntel
  name: 野战情报支援装备
  components:
