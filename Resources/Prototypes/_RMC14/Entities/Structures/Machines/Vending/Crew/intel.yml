    maxItemSize: Huge
    grid:
    - 0,0,9,1
  - type: Sprite
    sprite: _RMC14/Objects/Storage/procase_mini.rsi # TODO RMC14 jtac overlay icon
  - type: Icon
    sprite: _RMC14/Objects/Storage/procase_mini.rsi
  - type: StorageFill
    contents:
    - id: RMCFulton20
    - id: CMEncryptionKeyIntel
    - id: CMPamphletIntel
    - id: RMCIntelDetector
    - id: RMCPouchDocument
