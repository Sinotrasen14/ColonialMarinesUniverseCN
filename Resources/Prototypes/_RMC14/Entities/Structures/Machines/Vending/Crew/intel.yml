- type: entity
  parent: ColMarTechBase
  id: ColMarTechIntelGear
  name: ColMarTech情报官装备架
  description: 一个供情报官使用的自动化装备架。
  components:
  - type: AccessReader
    access:
    - ["RMCAccessCommand"]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/intel.rsi
  - type: CMAutomatedVendor
    jobs:
    - CMIntelOfficer
    sections:
    - name: 情报集（必填）
      takeAll: RMCIntelSet
      entries:
      - id: RMCVendorBundleIntel
    - name: 工程用品
      entries:
      - id: CMAPCElectronics
        points: 5
      - id: RMCExplosivePlastic
        points: 10
      - id: RMCWeldingGoggles
        points: 5
    - name: 主弹药
      entries:
      - id: CMMagazineRifleM4SPRAP
        points: 10
      - id: CMMagazineSMGM63AP
        points: 10
      - id: CMMagazineSMGM63Ext
        points: 10
      - id: CMMagazineRifleM54CAP
        points: 10
      - id: CMMagazineRifleM54CExt
        points: 10
    - name: 副武器弹药
      entries:
      - id: RMCSpeedLoader44Marksman
        points: 10 # TODO RMC14 heavy speed revolver
      - id: RMCMagazinePistolM1984AP
        points: 5
      - id: RMCMagazinePistolM1984HP
        points: 5
      - id: CMMagazinePistolMK80
        points: 10
      - id: RMCMagazinePistolSU6
        points: 10
    - name: 限制类枪支
      entries:
      - id: RMCGunCasePistolMK80
        points: 15
      - id: RMCGunCasePistolSmart
        points: 15
    - name: 受限装备
      entries:
      - id: CMBeltUtilityCombatFilled
        points: 15
    - name: 小袋
      entries:
      - id: RMCPouchMagazineLarge
        points: 10
      - id: RMCPouchShotgunLarge
        points: 10
      - id: RMCPouchAutoinjector
        points: 15
        recommended: true
      - id: RMCPouchMacheteFilled
        name: 砍刀袋（满）
        points: 10
    - name: 实用工具
      entries:
      - id: CMFireExtinguisherPortable
        points: 5
      - id: RMCFulton20
        points: 10
      - id: RMCMotionDetector
        points: 15
        recommended: true
      - id: RMCIntelDetector
        points: 5
    - name: 双筒望远镜
      entries:
      - id: RMCBinoculars
        points: 5
      - id: RMCRangefinder
        points: 10
      - id: RMCLaserDesignator
        points: 15
    - name: 头盔光学
      entries:
      - id: RMCVisorMedical
        points: 5
      - id: RMCVisorWelding
        points: 5
      - id: RMCVisorNightVision
        points: 25
        recommended: true
    - name: 收音机按键
      entries:
      - id: CMEncryptionKeyIntel
        points: 5
    - name: 备用英特尔套件
      entries:
      - id: RMCKitIntel
        name: 野战情报支援包（供未受训人员使用）
        points: 20

- type: entity
  parent: ColMarTechBase
  id: ColMarTechIntelEquipment
  name: ColMarTech情报官装备架
  description: 一个自动化装备架，与一个巨大的 IO 标准配发装备储存库相连。
  components:
  - type: AccessReader
    access:
    - ["RMCAccessCommand"]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/equipment.rsi
  - type: CMAutomatedVendor
    jobs:
    - CMIntelOfficer
    sections:
    - name: 标准设备
      takeAll: RMCIntelEquipment
      entries:
      - id: CMHeadsetIntel
      - id: CMMRE
    - name: 手套
      choices: {CMHands: 1}
      entries:
      - id: CMHandsInsulated
      - id: CMHandsBlackInsulated
    - name: 护甲
      takeOne: CMArmor
      entries:
      - id: RMCArmorXM4
      - id: RMCArmorM3LightVariants
      - id: RMCArmorVestIntel
    - name: 夹克
      choices: {CMCoat: 1}
      entries:
      - id: RMCCoatService
      - id: RMCCoatAllWeather
    - name: 背包
      choices: {CMBag: 1}
      entries:
      - id: CMSatchelMarineIntel
        replaceSlot: back
        recommended: true
      - id: RMCSatchelMarineIntelChestrig
        replaceSlot: back
        recommended: true
      - id: RMCSatchelMarineIntelSatchel
        replaceSlot: back
        recommended: true
      - id: RMCBackpackRTO
        replaceSlot: back
    - name: 头盔
      choices: {CMHelmet: 1}
      entries:
      - id: RMCArmorHelmetM12Intel
        recommended: true
    - name: 帽子
      choices: {CMHat: 1}
      entries:
      - id: RMCHeadBeretGreen
      - id: CMHeadBeretTan
      - id: CMHeadCapOfficer
    - name: 腰带
      choices: {CMBelt: 1}
      entries:
      - id: RMCBeltUtilityGeneral
      - id: CMBeltMarine
        recommended: true
      - id: RMCBeltHolsterPistol
      - id: RMCBeltHolsterSMG
      - id: RMCBeltHolsterRevolver
      - id: RMCM276ShotgunShellLoadingRig
      - id: CMBeltUtilityFilled
        name: M276 型工具腰带挂具（完整版）
        recommended: true
    - name: 小袋
      choices: {CMPouches: 2}
      entries:
      - id: RMCPouchDocument
        recommended: true
      - id: RMCPouchFirstAidInjectors
        name: 急救包（可再填充注射器）
      - id: RMCPouchFirstAidSplintsGauzeOintment
        name: 急救袋（纱布、药膏）                        # TODO RMC14 splints comma
      - id: RMCPouchFirstAidPills
        name: 急救包（药片包）
      - id: RMCPouchFlareFilled
        name: 信号弹袋（满）
      - id: RMCPouchFuelTank
      - id: RMCPouchGeneralLarge
      - id: RMCPouchMagazinePistolLarge
      - id: RMCPouchMagazine
      - id: RMCPouchShotgun
      - id: RMCPouchPistol
      - id: RMCPouchToolsFill
        name: 工具袋（已满）
        recommended: true
      - id: RMCPouchSling
    - name: 配件
      choices: {CMAccessories: 1}
      entries:
      - id: CMWebbingBlack
      - id: CMWebbingBrown
        recommended: true
      - id: RMCWebbingLegPouch
      - id: RMCWebbingLegPouchBlack
      - id: CMWebbingHolster
      - id: RMCWebbingHolsterBlack
      - id: CMWebbing
      - id: RMCWebbingBlackSmall
      - id: RMCWebbingDropPouch
      - id: RMCWebbingDropPouchBlack
    - name: 面具
      choices: {CMMask: 1}
      entries:
      - id: CMMaskGas
      - id: CMMaskCoif

