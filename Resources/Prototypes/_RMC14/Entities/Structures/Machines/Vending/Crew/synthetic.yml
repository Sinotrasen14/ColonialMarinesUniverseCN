- type: entity
  parent: ColMarTechBase
  id: ColMarTechCrewSynthetic
  name: ColMarTech合成人装备架
  description: 自动化装备架连接着一个储存各类装备的巨型存储库。仅合成人单位可访问。
  components:
  - type: AccessReader
    access:
    - ["RMCAccessSynth"]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/clothing.rsi
  - type: CMAutomatedVendor
    sections:
    - name: 标准设备
      takeAll: CMStandard
      entries:
      - id: RMCSynthExperimentalToolsToken
      - id: RMCSynthResetKey
      - id: RMCHeadsetSynth
    - name: 制服
      choices: {CMUniform: 1}
      entries:
      - id: RMCJumpsuitSynthetic
        # mandatory: true, TODO allow vendors to mark entries as mandatory
        # /obj/item/clothing/under/rank/synthetic/old
      - id: CMJumpsuitSyntheticPristine
      - id: CMJumpsuitSyntheticOutdated
      - id: CMJumpsuitAverageJoe
      - id: JumpsuitMarine
      - id: CMJumpsuitMarineMedic
      - id: CMJumpsuitSPP
      - id: CMJumpsuitSPPMedic
      - id: CMJumpsuitSPPEngi
    - name: 织带
      choices: {CMAccessories: 1}
      entries:
      - id: CMWebbingBrown
        recommended: true
      - id: CMWebbingBlack
      - id: RMCWebbingLegPouch
      - id: RMCWebbingLegPouchBlack
      - id: RMCWebbingDropPouch
      - id: RMCWebbingDropPouchBlack
      - id: CMWebbing
      - id: RMCWebbingBlackSmall
      - id: CMWebbingHolster
      - id: RMCWebbingHolsterBlack
    - name: 鞋子
      choices: {RMCShoes: 1}
      entries:
      - id: RMCShoesWhite
        recommended: true
      - id: CMBootsBlackFilled
      - id: CMBootsBrownFilled
      - id: CMBootsGreyFilled
      - id: CMBootsJungleFilled
    - name: 头盔
      choices: {CMHelmet: 1}
      entries:
      - id: RMCHardhatOrange
        name: 橙色安全帽
      - id: RMCHelmetWelding
      - id: CMHeadFlapCap
    - name: 西装   # Parity Vendor Fill has one for the map's camo, then still lets the synth choose from any of the options. Hence why this has so many options.
      choices: {CMSuit: 1}
      entries:
      - id: CMArmorM3VLSynth
        recommended: true
      - id: CMArmorM3VLSynthGray
      - id: CMArmorM3VLSynthDarkGray
      - id: CMArmorM3VLSynthJungle
      - id: CMArmorM3VLSynthDesert
      - id: CMArmorM3VLSynthSnow
      - id: CMArmorM3VLSynthClassic
      - id: CMArmorM3VLSynthUrban
      - id: RMCSuitBioGeneral
      - id: RMCSuitBioWeYa
      - id: RMCCoatSnow
      - id: RMCCoatSnowSoviet
    - name: 手套
      choices: {CMGloves: 1}
      entries:
      - id: CMHandsInsulated
        recommended: true
      - id: CMHandsBlackInsulated
        recommended: true
      - id: CMHandsBlackMarine
      - id: RMCHandsBrownMarine
      - id: RMCHandsGreyMarine
      - id: RMCHandsFingerlessMarine
      - id: CMHandsLatex
    - name: 背包
      choices: {CMBackpack: 1}
      entries:
      - id: RMCSmartpack
        name: S-V42 智能包，蓝色
        recommended: true
      - id: RMCSmartpackBlack
        name: S-V42智能包装，黑色
      - id: RMCSmartpackGreen
        name: S-V42智能包，绿色
      - id: RMCSmartpackTan
        name: S-V42智能包，棕褐色
      - id: RMCSmartpackWhite
        name: S-V42 智能包，白色
      - id: RMCSmartpackA1
        name: S-V42A1智能包，蓝色
      - id: RMCSmartpackA1Black
        name: S-V42A1 智能包，黑色
      - id: RMCSmartpackA1Green
        name: S-V42A1 智能包，绿色
      - id: RMCSmartpackA1Tan
        name: S-V42A1智能包，棕褐色
      - id: RMCSmartpackA1White
        name: S-V42A1 智能包，白色
    - name: 腰带
      choices: {CMBelt: 1}
      entries:
      - id: RMCBeltUtilityGeneral
      - id: CMBeltMedicBagFilled
        name: M276型救生包（满）
      - id: CMBeltMedicalFilled
        name: M276医疗储物架（满）
      - id: CMBeltUtilityFilled
        name: M276 工具腰带装备（完整版）
      - id: RMCBeltConstruction
        name: M277 图案构建装置
    - name: 小袋
      choices: {CMPouch: 2}
      entries:
      - id: RMCPouchAutoinjector
      - id: RMCPouchConstruction
      - id: RMCPouchDocument
      - id: RMCPouchElectronicsFill
        name: 电子产品收纳袋（满）
      - id: RMCPouchFirstAidInjectors
        name: 急救包（可补充注射器）
      - id: RMCPouchFirstAidSplintsGauzeOintment
        name: 急救包（纱布、药膏）                        # TODO RMC14 splints comma
      - id: RMCPouchFirstAidPills
        name: 急救袋（药丸）
      - id: RMCPouchFlareFilled
        name: 照明弹袋（满）
      - id: RMCPouchGeneralLarge
      - id: RMCPouchSling
      - id: RMCPouchMedical
      - id: RMCPouchMedkit
      - id: RMCPouchReagentCanisterTricordrazineRevival
        name: "加压试剂罐袋\n（复活混合剂 - 三环拉嗪）"
#     - id: CMPressurizedReagentCanisterPouchPeridaxonRevivalMix
#       name: Pressurized Reagent Canister Pouch\n(Revival Mix - Peridaxon)
#        recommended: true
      - id: RMCPouchReagentCanisterBicaridine
        name: "加压试剂罐袋\n（比卡立定）"
      - id: RMCPouchReagentCanisterKelotane
        name: "加压试剂罐袋\n（凯洛坦）"
      - id: RMCPouchReagentCanisterTricordrazine
        name: "加压试剂罐袋\n（三可定）"
      - id: RMCPouchReagentCanister
        name: "加压试剂罐袋\n（空）"
      - id: RMCPouchToolsFill
        name: 工具袋（满）
      - id: RMCPouchMacheteFilled
        name: 砍刀袋（满）
    - name: 小袋
      choices: {CMMask: 1}
      entries:
      - id: CMMaskSterile

