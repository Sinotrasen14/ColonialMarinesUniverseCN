# Flight Crew Vendors #

# Equipment Rack
- type: entity
  parent: ColMarTechBase
  id: ColMarTechDropshipCrewEquipment
  name: ColMarTech 运输机乘员装备架
  description: 运输机乘员用的自动装备售卖机
  components:
  - type: AccessReader
    access:
    - ["CMAccessPilot"]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/equipment.rsi
  - type: CMAutomatedVendor
    jobs:
    - CMDropshipCrewChief
    - CMPilotDropship
    - CMPilotGunship
    sections:
    - name: 标准设备
      takeAll: CMEquipment
      entries:
      # - id: CMJumpsuitPilot TODO RMC14: split DCC and Pilot Officer equipment vendors
      # - id: RMCJumpsuitPilotAlt
      # - id: CMHandsInsulated
      # - id: CMHandsBlackInsulated
      - id: CMArmorHelmetM30
      - id: RMCHeadCapPatrol
      - id: CMSatchel
      - id: CMMRE
    - name: 手套
      choices: {CMHands: 1}
      entries:
      - id: CMHandsInsulated
      - id: CMHandsBlackInsulated
    - name: 盔甲
      choices: {CMArmour: 1}
      entries:
      # - id: RMCArmorVestFlak TODO RMC14: same as the one in line 24
      - id: CMArmorM3VLFlakVest
      # - id: RMCCoatPilot TODO RMC14: same as the one in line 24
      - id: CMArmorM3VLBallistics
    - name: 个人随身武器
      choices: {CMSidearm: 1}
      entries:
      - id: CMWeaponPistolM1984
      - id: RMCMK80
    - name: 腰带
      choices: {CMBelt: 1}
      entries:
      - id: RMCBeltUtilityGeneral
      - id: CMBeltMarine
      - id: CMBeltMedicBagFilled
        name: M276型救生包（满）
        recommended: true
      - id: CMBeltMedicalFilled
        name: M276型医疗储物胸挂（满）
        recommended: true
      - id: RMCBeltHolsterSMGPouch
      - id: RMCBeltHolsterPistol
      - id: RMCBeltHolsterM13
      - id: RMCBeltHolsterRevolver
      - id: RMCM82FHolster
      - id: RMCM276ShotgunShellLoadingRig
    - name: 小袋
      choices: {CMPouches: 2}
      entries:
      - id: RMCPouchFirstAidInjectors
        name: 急救包（可再填充注射器）
        recommended: true
      - id: RMCPouchFirstAidSplintsGauzeOintment
        name: 急救包（纱布、药膏）
        recommended: true
      - id: RMCPouchFirstAidPills
        name: 急救包（药丸）
        recommended: true
      - id: RMCPouchFirstResponder
      - id: RMCPouchFlareFilled
        name: 信号弹袋（满）
      - id: RMCPouchGeneralLarge
      - id: RMCPouchMagazineLarge
      - id: RMCPouchMagazinePistolLarge
      - id: RMCPouchShotgunLarge
      - id: RMCPouchMedical
      - id: RMCPouchMedkit
      - id: RMCPouchPistol
      - id: RMCPouchSling
    - name: 配件
      choices: {CMAccessories: 1}
      entries:
      - id: CMWebbingBrown
        recommended: true
      - id: CMWebbingBlack
        recommended: true
      - id: RMCWebbingLegPouch
      - id: RMCWebbingLegPouchBlack
      - id: RMCWebbingDropPouch
      - id: RMCWebbingDropPouchBlack
      - id: CMWebbing
      - id: RMCWebbingBlackSmall
      - id: CMWebbingHolster
      - id: RMCWebbingHolsterBlack
    - name: 眼镜
      choices: {CMGlasses: 1}
      entries:
      - id: RMCSunglasses
      - id: RMCGlassesMedicalHUDGlasses
        recommended: true
      - id: RMCGlassesAviators
    - name: 飞行护目镜
      choices: {CMFlightVisor: 1}
      entries:
      - id: RMCVisorPilotBlack
      - id: RMCVisorPilotDarkblue
      - id: RMCVisorPilotLightblue
      - id: RMCVisorPilotPurple
      - id: RMCVisorPilotRed
      - id: RMCVisorPilotYellow
    - name: 面具
      choices: {CMMasks: 1}
      entries:
      - id: CMMaskGas
      - id: CMMaskCoif
      - id: RMCMaskRebreather
    - name: 附件
      entries:
      - id: RMCAttachmentAngledGrip
        points: 10
      - id: RMCAttachmentExtendedBarrel
        points: 10
      - id: RMCAttachmentExtendedCompensator
        points: 10
      - id: RMCAttachmentRecoilCompensatorM13
        points: 10
      - id: RMCAttachmentGyroscopicStabilizer
        points: 10
      - id: RMCAttachmentLaserSight
        points: 10
      - id: RMCAttachmentU7UnderbarrelShotgun # This is called "Masterkey" in flight vend; not sure if accurate.
        points: 10
      - id: RMCAttachmentM13StockSolid
        points: 10
      - id: RMCAttachmentM42A2CollapsibleStock
        points: 10
      - id: RMCAttachmentM63Stock
        points: 10
      - id: RMCAttachmentM54CStockSolid
        points: 10
      - id: RMCAttachmentRecoilCompensator
        points: 10
      - id: RMCAttachmentS5RedDotSight
        points: 10
      - id: RMCAttachmentS5MicroRedDotSight
        points: 10
      - id: RMCAttachmentS6ReflexSight
        points: 10
      - id: RMCAttachmentSuppressor
        points: 10
      - id: RMCAttachmentSuppressorCompact
        points: 10
      - id: RMCAttachmentVerticalGrip
        points: 10
    - name: 弹药
      entries:
      - id: CMMagazineRifleM4SPRAP
        points: 10
      - id: CMMagazineRifleM4SPRExt
        points: 10
      - id: CMMagazineSMGM63AP
        points: 10
      - id: CMMagazineSMGM63Ext
        points: 10
      - id: CMMagazineRifleM54CAP
        points: 10
      - id: CMMagazineRifleM54CExt
        points: 10
      - id: RMCSpeedLoader44Marksman
        points: 10
    - name: 实用工具
      entries:
      # - id: CMPOFlightsuit # TODO: Port Flightsuit (not the uniform they normally wear)
      #   points: 10
      - id: CMFireExtinguisherPortable
        name: 灭火器（便携式）
        points: 5
      - id: RMCPouchGeneralLarge
        points: 15
      - id: RMCPouchMagazineLarge
        points: 15
      - id: RMCScabbardMacheteFilled
        name: 砍刀鞘（满）
        points: 10
      - id: RMCPouchMacheteFilled
        name: 砍刀袋（满）
        points: 15
      - id: RMCMotionDetector
        points: 15
        recommended: true

