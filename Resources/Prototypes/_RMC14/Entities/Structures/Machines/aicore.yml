- type: entity
  id: RMCAICore
  name: ARES v3.2
  description: 这是 UNS Almayer 的人工智能系统。与许多其他军用级人工智能系统一样，这个系统由 We-Yu 制造。
  placement:
    mode: SnapgridCenter
  components: #has no collission in 13 they have invisible walls behind it
  - type: InteractionOutline
  - type: ARESCore
  - type: Clickable
  - type: Corrodible
    isCorrodible: false
  - type: ApcPowerReceiver
    powerLoad: 250
    needsPower: true
  - type: RMCPowerReceiver
    idleLoad: 5
    activeLoad: 10
    channel: Equipment
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/aicore.rsi
    layers:
    - state: hydra-off
    - state: hydra
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          true: {visible: true}
          false: {visible: false}
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 1000 # Okey hear me out down there... Health is 1000 in 13 but you can go over 1000+ and it goes on...
#      behaviors:
#      - !type:DoActsBehavior Commented this part out because in 13 after 200+ damage it fucking explodes
#        acts: [ "Destruction" ] Explosion does not destroy it and just disables it till a AI techie arrives(admin)
# to fix the AI core. Leaving it here for now because of that

- type: entity
  id: RMCAICoreProcessor
  name: ARES 处理器
  description: ARES 的外部处理器，用于处理海量信息。
  placement:
    mode: SnapgridCenter
  components: #has no collission in 13 they have invisible walls behind it
  - type: InteractionOutline
  - type: Clickable
  - type: Corrodible
    isCorrodible: false
  - type: ApcPowerReceiver
    powerLoad: 250
    needsPower: true
  - type: RMCPowerReceiver
    idleLoad: 5
    activeLoad: 10
    channel: Equipment
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/aicoremachinery.rsi
    layers:
    - state: processor_off
    - state: processor
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          true: {visible: true}
          false: {visible: false}
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 1000 # Okey hear me out down there... Health is 1000 in 13 but you can go over 1000+ and it goes on...
#      behaviors:
#      - !type:DoActsBehavior
#        acts: [ "Destruction" ]

- type: entity
  id: RMCAICoreProcessorBioscan
  parent: RMCAICoreProcessor
  name: ARES 处理器（生物扫描）
  description: ARES 生物扫描系统的外部组件。没有它，UNS Almayer 将无法运行生物扫描！
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/aicoremachinery.rsi
    layers:
    - state: bio_processor_off
    - state: bio_processor
      map: ["enum.PowerDeviceVisualLayers.Powered"]

- type: entity
  id: RMCAICoreProcessorInterface
  parent: RMCAICoreProcessor
  name: ARES 处理器（接口）
  description: ARES 的外部处理器；该处理器负责处理与船员交互的核心流程，包括无线电传输和广播。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/aicoremachinery.rsi
    layers:
    - state: bio_processor_off
    - state: bio_processor
      map: ["enum.PowerDeviceVisualLayers.Powered"]

- type: entity
  id: RMCAICoreProcessorHERMES
  parent: RMCAICoreProcessor
  name: ARES 处理器（HERMES）
  description: ARES 处理器（HERMES）的外部组件。主要负责协调普通人与维护无人机。它绝对不是从诺瓦里斯工业偷来的。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/aicoremachinery.rsi
    layers:
    - state: apollo_processor_off
    - state: apollo_processor
      map: ["enum.PowerDeviceVisualLayers.Powered"]

- type: entity
  id: RMCAICoreCPU
  parent: RMCAICoreProcessor
  name: ARES中央处理器
  description: 这是ARES的中央处理器。其外壳设计可抵御核爆，该中央处理器还包含ARES的黑匣子记录器。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/aicoremachinery.rsi
    layers:
    - state: cpu_off
    - state: cpu
      map: ["enum.PowerDeviceVisualLayers.Powered"]

- type: entity
  id: RMCAICoreSubstrate
  parent: RMCAICoreProcessor
  name: ARES 基质
  description: ARES 的记忆基质，包含复杂的协议和信息。有限的能力可以仅靠基质运行，无需主 ARES 单元处于运行状态。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/aicoremachinery.rsi
    layers:
    - state: substrate_off
    - state: substrate
      map: ["enum.PowerDeviceVisualLayers.Powered"]

- type: entity
  parent: RMCCommunicationsConsoleBase
  id: RMCAIConsoleARES
  name: ARES 接口
  description: 一个用于与 ARES 对接的控制台，支持一对一通信。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/aicoremachinery.rsi
    state: console
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false # Intentional

- type: entity
  parent: RMCAIConsoleARES
  id: RMCAIConsoleInterface
  name: AI接口控制台
  description: 一台庞大笨重的计算机，旨在让用户与飞船的人工智能进行交互。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/AIStuff/aiconsoleinterface.rsi
    state: console
    offset: 0, -0.55

- type: entity
  parent: RMCCommunicationsConsoleBase
  id: RMCAIConsoleHERMES
  name: HERMES 维护控制器
  description: 一个为方便普通用户及其操作而构建的控制台，让资源分配变得简单。
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _RMC14/Structures/Machines/AIStuff/aicoremachinery.rsi
    state: console
    layers: []
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false # Intentional
  - type: ARESExternalTerminal
    showsLogs: true
  - type: ActivatableUI
    key: enum.ARESExternalTerminalUIKey.Key
  - type: UserInterface
    interfaces:
      enum.ARESExternalTerminalUIKey.Key:
        type: ARESExternalTerminalBui

- type: entity
  abstract: true
  id: MasterARESLogType
  name: SYS错误日志
  components:
  - type: ARESLogType

