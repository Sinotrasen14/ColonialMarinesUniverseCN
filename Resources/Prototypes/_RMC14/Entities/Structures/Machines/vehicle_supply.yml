- type: entity
  parent: VehicleSupplyConsole
  id: AU14VehicleSupplyConsoleUSCMLimited
  name: 载具补给控制台
  description: 用于订购载具及其挂载点的控制台。

- type: entity
  id: VehicleLift
  name: 载具举升机
  suffix: Lowered, Vehicle Supply
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Effects/elevator.rsi
    drawdepth: LowFloors
    layers:
    - state: supply_elevator_lowered
      map: [ "rmc-vehicle-supply-lift-base" ]
  - type: Physics
    bodyType: static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-2.3,-2.3,2.3,2.3"
        layer:
        - WallLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: Chasm
    # cmu edit start: thrown stuff falls in like the ASRS lift, vehicles don't
    blacklist:
      components:
      - Vehicle
    # cmu edit end
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 1
    blacklist:
      tags:
      - Catwalk
  - type: VehicleSupplyLift
    railingRange: 7
