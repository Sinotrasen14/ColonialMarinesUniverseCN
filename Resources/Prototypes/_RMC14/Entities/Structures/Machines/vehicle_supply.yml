- type: entity
  parent: CMBaseStructureCorrodible
  id: VehicleSupplyConsole # CMU14: filtered by platoon, without research gates.
  name: 载具补给控制台
  description: 用于订购载具及其挂载点的控制台。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/asrs_console.rsi
    layers:
    - map: ["computerLayerBody"]
      state: off
    - map: ["computerLayerScreen"]
      state: on
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.35,0.25,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ActivatableUI
    key: enum.VehicleSupplyUIKey.Key
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [["RMCAccessVehicleCrew"]]
  - type: UserInterface
    interfaces:
      enum.VehicleSupplyUIKey.Key:
        type: VehicleSupplyBui
  - type: VehicleSupplyConsole
    vehicles:
    # CMU14: fighter and portable faction-owned VTOL pad.
