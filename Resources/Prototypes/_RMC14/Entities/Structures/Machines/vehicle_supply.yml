    - name: M2420 JTMV 武装型
      vehicle: VehicleHumvee
      group: vehicle-armed # cmu edit: armed, so it takes the VTOL/APC slot
      hardpoints:
      - VehicleHumveeTurret
      - VehicleHumveeTurretArmed
      - VehicleHumveeCannon
      - VehicleHumveeLauncher
      - VehicleHumveeSnowplow
      - VehicleHumveeOverlight
