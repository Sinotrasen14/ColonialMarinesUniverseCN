# M34 Incinerator

- type: entity
  parent: RMCGunRackBase
  id: RMCGunRackM34IncineratorEmpty
  name: M240焚化器枪架
  suffix: M240 Incinerator, Empty
  description: AEGIS 生产的长枪存放枪架。虽然初始型号原本应具备极强的可改装性，但美国海军陆战队委托制造了带固定插槽的枪架，这些插槽只能适配 M240 焚化器单元。有人说这些枪架更便宜，也有人说主要原因是海军陆战队员能轻易弄坏任何比钨球更复杂的东西。
  components:
  - type: ContainerContainer
    containers:
      item_1: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent:
      item_2: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/GunRacks/m34_rack.rsi
  - type: ItemSlots
    slots:
      item_1:
        name: M240 焚化器
        whitelist:
          tags:
          - RMCWeaponIncineratorM34
      item_2:
        name: M240焚化器
        whitelist:
          tags:
          - RMCWeaponIncineratorM34
  - type: ItemMapper
    mapLayers:
      fill_1:
        minCount: 1
        whitelist:
          tags:
          - RMCWeaponIncineratorM34
      fill_2:
        minCount: 2
        whitelist:
          tags:
          - RMCWeaponIncineratorM34

- type: entity
  parent: RMCGunRackM34IncineratorEmpty
  id: RMCGunRackM34IncineratorFilled
  suffix: M240 Incinerator, Filled
  components:
  - type: ContainerFill
    containers:
      item_1:
      - RMCWeaponFlamerPVE
      item_2:
      - RMCWeaponFlamerPVE

