- type: entity
  abstract: true
  id: RMCGunRackBase
  name: 枪架
  description: AEGIS生产的用于存放长枪的枪架。虽然初版型号本应具备极强的改装性，但UNMC委托订购的是带固定槽位的枪架。有人说它们更便宜，也有人说主要原因是陆战队员总能轻松弄坏任何比钨球更复杂的东西。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Tag
    tags:
    - Structure
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/GunRacks/m54c_rack.rsi
    state: empty
  - type: WallMount
    arc: 360
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: Pullable
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralMarine
  - type: Destructible # TODO RMC14 some of these should just be knocked over with a do after by xenos
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: ItemSlots
  - type: CMItemSlots
  - type: Appearance
