- type: entity
  parent: RMCMobCatCalico
  id: CMMobJones
  name: 琼斯 | Jones
  description: 一个强硬、年老的流浪者，似乎无人知道其来历。 | A tough, old stray whose origin no one seems to know.
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      45: Critical
      50: Dead # A TOUGH old stray, yes this is parity reasoning
  - type: Grammar
    attributes:
      proper: true
      gender: male
  - type: WarpPoint
    follow: true
    location: cmu-warp-location-jones

- type: entity
  parent: RMCMobCatCalico
  id: RMCMobOrion
  name: 奥赖恩 | Orion
  description: 一只驯化的猫科宠物。项圈上写着“奥赖恩”。 | A domesticated, feline pet. The collar says 'Orion'.
  components:
  - type: WarpPoint
    follow: true
    location: cmu-warp-location-orion

- type: entity
  parent: RMCMobCat
  id: RMCMobGarry
  name: 加里 | Garry
  description: 她的毛发具有天鹅绒般的外观和触感，尾巴偶尔会轻轻颤动。 | Her fur has the look and feel of velvet, and her tail quivers occasionally.
  components:
  - type: Grammar
    attributes:
      proper: true
      gender: female
  - type: WarpPoint
    follow: true
    location: cmu-warp-location-garry

