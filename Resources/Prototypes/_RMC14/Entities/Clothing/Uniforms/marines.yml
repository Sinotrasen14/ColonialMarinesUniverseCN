# CBRN

- type: entity
  parent: RMCMarineUniformBase
  id: RMCCBRNSuit
  name: M3 MOPP 防护服
  description: M3 MOPP 防护服经过专门设计和制造，可在战场上保护穿戴者，使其免于无防护地暴露于任何化学、生物、放射或核（CBRN）威胁。一旦接触有毒环境，该防护服的建议使用寿命为二十四小时，但视严重程度而定，可缩短至八小时或更短。
  components:
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot
        ent:
        showEnts: false
        occludes: true
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Uniforms/Marine/cbrnsuit.rsi
  - type: CMArmor
    bullet: 10
    melee: 10
    bio: 100
    explosionArmor: 10
  - type: ToggleableClothing
    action: ActionToggleCBRNHelmet
    clothingPrototype: RMCArmorHelmetCBRN
    slot: head
    requiredSlot: INNERCLOTHING

