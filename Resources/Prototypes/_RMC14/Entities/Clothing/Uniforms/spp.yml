  name: UPP民用款橙色工装裤
  description: 一套民用款橙色工装裤，内搭一件深棕褐色汗衫。材质质量低劣，但聊胜于无。这种款式的服装通常会发给从事繁重劳动的人。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Uniforms/SPP/civ1.rsi
- type: entity
  parent: CMJumpsuitSPPCiv1
  id: CMJumpsuitSPPCiv2
  name: UPP民用风格棕褐色工装裤
  description: 一套民用风格的棕褐色工装裤，配一件蓝色内衫。材质质量很差，不过总比没有好。这种风格的服装通常发给从事繁重劳动的人。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Uniforms/SPP/civ2.rsi
- type: entity
  parent: CMJumpsuitSPPCiv1
  id: CMJumpsuitSPPCiv3
  name: UPP平民风格衬衫和裤子
  description: 一套平民风格的棕褐色衬衫和牛仔裤。材质虽然低劣，但足够舒适，可在一天中的任何时段穿着。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Uniforms/SPP/civ3.rsi
- type: entity
  parent: CMJumpsuitSPPCiv1
  id: CMJumpsuitSPPCiv4
  name: UPP平民风格背心和裤子
  description: 一套平民风格的棕色背心和橙色裤子。材质出奇地不错，而UPP的平民并不常穿这种衣服，原因有两个。他们通常买不起这样的衣服，而就算买得起，也会让自己成为靶子。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Uniforms/SPP/civ4.rsi
- type: entity
  parent: CMJumpsuitSPPCiv1
  id: RMCJumpsuitSPPCiv5
  name: 产业联合体矿用工作服
  description: 一件耐用的橄榄绿色连体服，穿在无袖、蓬松的橙色工作背心里面——产业联合体劳工的标准配发装备。背心褪色的面料内衬有加固衬垫，对工作场所的危险只能提供最低限度的防护。背上印有一颗红星徽记，表明穿戴者是产业联合体工业劳动力的一员。僵硬、不舒适、批量生产，但在深空劳动的严酷环境中，有总比没有好。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Uniforms/SPP/civ5.rsi
