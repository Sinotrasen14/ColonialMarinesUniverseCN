- type: entity
  parent: RMCPonchoBase
  id: RMCPoncho
  name: UNMC雨披
  description: 标准UNMC雨披为每种气候都提供了不同款式。它经过定制，可连接标准UNMC装甲型号，并穿在制服外，既舒适，又能按需保暖或降温，而且十分合身。一名陆战队员别无所求。它被亲切地称为“woobie”。
