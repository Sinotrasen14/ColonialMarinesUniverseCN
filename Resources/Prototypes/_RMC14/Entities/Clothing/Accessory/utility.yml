- type: entity
  abstract: true
  parent: RMCBaseUniformAccessory
  id: RMCUtilityBase
  name: 实用配件
  description: 一种抽象的实用配件。
  components:
  - type: UniformAccessory
    category: Utility
    limit: 1
    hiddenByJacketRolling: false
- type: entity
  parent: RMCUtilityBase
  id: RMCStethoscope
  name: 听诊器
  description: 一种过时但仍然有用的医疗器具，用于聆听人体发出的声音。它还能让你看起来像知道自己在做什么。
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _RMC14/Objects/Medical/stethoscope.rsi
    state: icon
  - type: Clothing
    sprite: _RMC14/Objects/Medical/stethoscope.rsi
    quickEquip: true
    slots:
    - neck
    clothingVisuals:
      neck:
      - state: utility
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medical/stethoscope.rsi
      state: utility
  - type: RMCStethoscope
- type: entity
  parent: RMCUtilityBase
  id: RMCHorizonFlower
  name: 蓝色地平线花
  description: 一朵美丽的蓝色花，象征着希望与怀念。
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Accessory/horizon_flower.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Clothing/Accessory/horizon_flower.rsi
      state: flower
