    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          true:
            state: icon-on
          false:
            state: icon
  - type: Appearance
  - type: Tag
    tags:
    - RipOffOnInfection
  - type: OverwatchCamera
- type: entity
  parent: RMCM5CameraGear
  id: RMCCameraGearPMC
  name: Mk3战术俯视摄像头头盔
  description: 对RCM所配备摄像机装备的改装与加固版本，战术俯视摄像单元被Weyland-Yutani PMC部队使用，这些部队放弃了典型的防护头盔，使其调度员能够持续掌握作战人员的当前状态。
