- type: entity
  parent: BaseItem
  abstract: true
  id: RMCArmorWebbingBase
  name: 有甲弹挂
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/ArmorWebbing/pouch.rsi
  - type: Item
    size: Large
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,5,1
  - type: Webbing
    components:
    - type: Storage
      maxItemSize: Small
      grid:
      - 0,0,5,1 # 3 slots
    - type: FixedItemSizeStorage
    - type: ExplosionResistance
      damageCoefficient: 0
      worn: false
    - type: RMCStorageEjectHand
      state: Open
    - type: StoreAfterFailedInteract
  - type: ExplosionResistance
    damageCoefficient: 0
    worn: false
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: StoreAfterFailedInteract
  - type: Tag
    tags:
    - ArmorWebbing

- type: entity
  parent: RMCArmorWebbingBase
  id: RMCArmorWebbingDrum
  name: 鼓式有甲弹挂
  description: 一个棕色背带，配有一对大口袋，可以装高容量弹鼓和其他大弹夹。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/ArmorWebbing/drum.rsi
    state: webbing
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,3,1
    whitelist:
      tags:
      - CMMagazinePistol
      - RMCMagazineRevolver
      - CMMagazineRifle
      - RMCMagazineShotgun
      - CMMagazineSmg
      - CMMagazineSniper
      - RMCShellShotgun
      - RMCShellShotgunHDSG
      - RMCMagazineSmartGun
  - type: FixedItemSizeStorage
  - type: Webbing
    components:
    - type: Storage
      maxItemSize: Normal
      grid:
      - 0,0,3,1
      whitelist:
        tags:
        - CMMagazinePistol
        - RMCMagazineRevolver
        - CMMagazineRifle
        - RMCMagazineShotgun
        - CMMagazineSmg
        - CMMagazineSniper
        - RMCShellShotgun
        - RMCShellShotgunHDSG
        - RMCMagazineSmartGun
    - type: FixedItemSizeStorage
    - type: RMCStorageEjectHand
      state: Open
    - type: ExplosionResistance
      damageCoefficient: 0
      worn: false
    - type: StoreAfterFailedInteract

