- type: entity
  parent: ClothingShoesBase
  id: RMCShoesLaceup
  name: 系带鞋
  description: 时尚的巅峰，而且它们已经预先擦亮！
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Shoes/laceup.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Shoes/laceup.rsi
  - type: ContainerContainer
    containers:
      item: !type:ContainerSlot
  - type: ItemSlots
    slots:
      item:
        name: rmc枪
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m42a2.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m42a2.ogg
        whitelist:
          tags:
          - Holdout
  - type: Matchbox
  - type: CMHolster
  - type: CMItemSlots
  - type: UsableWhileDevoured

