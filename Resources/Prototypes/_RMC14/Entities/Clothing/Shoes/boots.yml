# Dress Shoes
- type: entity
  parent: RMCShoesLaceupDress
  id: CMShoesLaceupCommander
  name: 指挥官礼服鞋
  description: 配有特制鞋底，能更好地践踏下方的人。

- type: entity
  abstract: true
  id: RMCItemSlotM5Bayonet
  suffix: Filled
  components:
  - type: ContainerContainer
    containers:
      item: !type:ContainerSlot
  - type: ItemSlots
    slots:
      item:
        name: 厘米刀
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m42a2.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m42a2.ogg
        whitelist:
          tags:
          - Knife
          - Holdout
          - Screwdriver
          - RMCScalpel
          - ThrowingKnife
        startingItem: RMCM5Bayonet
  - type: CMItemSlots
    startingItem: RMCM5Bayonet
  - type: Appearance

# Black Boots
- type: entity
  parent: ClothingShoesMilitaryBase
  id: CMBootsBlack
  name: 作战靴
  description: 标准配发作战靴，适用于战斗场景或战斗情况。随时随地，皆为战斗。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Shoes/Boots/black.rsi
    layers:
    - state: icon
    - state: filled
      map: ["enum.CMItemSlotsLayers.Fill"]
  - type: EmitSoundOnDrop
    sound:
      collection: RMCEquipArmor
      params:
        volume: -4
  - type: EmitSoundOnLand
    sound:
      collection: RMCEquipArmor
      params:
        volume: -4
  - type: Clothing
    unequipSound:
      collection: RMCEquipArmor
    sprite: _RMC14/Objects/Clothing/Shoes/Boots/black.rsi
  - type: ContainerContainer
    containers:
      item: !type:ContainerSlot
  - type: ItemSlots
    slots:
      item:
        name: CM刀
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m42a2.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m42a2.ogg
        whitelist:
          tags:
          - Knife
          - Holdout
          - Screwdriver
          - RMCScalpel
  - type: Matchbox
  - type: CMHolster
  - type: CMItemSlots
  - type: UsableWhileDevoured
  - type: CMArmor
    melee: 25
    bullet: 25
    explosionArmor: 20

- type: entity
  parent: [RMCItemSlotM5Bayonet, CMBootsBlack]
  id: CMBootsBlackFilled
  suffix: Filled

- type: entity
  parent: CMBootsBlackFilled
  id: RMCScoutShoes
  name: 渗透者靴              # Could probably use it's own sprite
  description: 一双经过改装的作战靴，几处经过削薄处理，并用布料以及某种皮革作为衬垫。
  components:
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCatwalk #I dunno what a better sound effect would be, catwalk stands out so it's there to alert xenos if scout moves while they are close
      params:
        volume: -14
        maxDistance: 0

- type: entity
  parent: CMBootsBlack
  id: RMCShoesCombat
  name: 战斗靴
  description: 当你真的想火力全开时。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Shoes/Boots/swat.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Shoes/Boots/swat.rsi

