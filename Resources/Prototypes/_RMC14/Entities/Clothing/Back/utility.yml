- type: entity
  parent: Clothing
  id: RMCParachute
  name: 降落伞
  description: 一个出奇地小却又笨重的背包，配有刚好足以让研发部通过健康与安全检查的安全带。标签上写着这个背包配有两个降落伞——主伞和备用伞，但你怀疑这包连一个都装不下。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Back/Backpacks/Marines/Parachute/parachute.rsi
    layers:
    - state: icon
  - type: Item
    size: Huge
  - type: Clothing
    slots:
    - back
  - type: ClothingIgnoreBlockBackpack
  - type: GrantParaDroppable
- type: entity
  id: RMCParachuteDeployed
  name: 已展开的降落伞
  components:
  - type: Sprite
    noRot: true
    sprite: _RMC14/Objects/Clothing/Back/Backpacks/Marines/Parachute/parachute_deployed.rsi
    layers:
    - drawdepth: overlay
    - state: cables
      drawdepth: Overlay
      offset: 0.0, 0.3
    - state: chute_animated
      drawdepth: Overlay
      offset: 0.0, 0.9
  - type: TimedDespawn
    lifetime: 3.5
  - type: Appearance
