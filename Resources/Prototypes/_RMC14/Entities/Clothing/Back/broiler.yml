  id: RMCBackpackBroiler
  name: Broiler-T 柔性加油系统
  description: 一种专用背部背带，用于携带Broiler-T柔性加油系统。由USCM烟火技师设计并供其使用。
  components:
  - type: Corrodible
    isCorrodible: false
  - type: Item
    size: Large
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Back/Satchels/Marines/broiler/jungle.rsi
    state: icon
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Back/Satchels/Marines/broiler/jungle.rsi
    quickEquip: false
    slots:
    - back
  - type: ItemMapper
    mapLayers:
      incinerator:
        whitelist:
          tags:
          - RMCWeaponIncineratorM34T
  - type: Appearance
  - type: CMHolster
    whitelist:
      tags:
      - RMCWeaponIncineratorM34T
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: CMItemSlots
    count: 3
    startingItems:
    - RMCTankFlamerLarge
    - RMCTankFlamerLargeB
    - RMCTankFlamerLargeX
    slot:
      name: 坦克
      whitelist:
        tags:
        - RMCTankFlamer
        - RMCTankFlamerLarge
  - type: ItemSlots
    slots:
      item:
        name: 焚烧炉
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/_RMC14/Weapons/Guns/gun_rifle_draw.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/gun_rifle_draw.ogg
        whitelist:
          tags:
          - RMCWeaponIncineratorM34T
  - type: ItemCamouflage
    camouflageVariations: {}
  - type: RMCMagneticItemReceiver
  - type: RMCBroiler
