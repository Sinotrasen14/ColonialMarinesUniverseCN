- type: entity
  parent: CMPersonalStorageBase
  id: RMCBackpackFlamer
  name: 海军烟火技师 G4-1 燃料箱
  description: 一种年代久远得多的背负装置，用两个罐体储存燃料。一个小型调节器位于两者之间。有几条绑带，最多可固定三个你将要补充燃料的火焰喷射器燃料罐。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Back/Satchels/Marines/flamethrower.rsi
    layers:
    - state: icon
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,5,1
    whitelist:
      components:
      - RMCFlamerTank
  - type: FixedItemSizeStorage
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 350
        reagents:
        - ReagentId: RMCNapalmUT
          Quantity: 350
  - type: DetailedExaminableSolution
    solution: tank
  - type: SolutionTransfer
    transferAmount: 350
    maxTransferAmount: 350
    minTransferAmount: 350
  - type: RefillableSolution
    solution: tank
  - type: DrawableSolution
    solution: tank
  - type: RMCRefillSolutionOnStore
  - type: RMCSolutionTransferWhitelist
    popup: rmc-solution-transfer-whitelist-failed-not-welding-tank
    targetWhitelist:
      tags:
      - RMCTankReagent
  - type: NoMixingReagents
  - type: Tag
    tags:
    - RMCBackpackFlamer
  - type: CMStorageVisualizer
    storageClosed: null
    storageOpen: null
  - type: RMCFlamerBackpack
  - type: ItemCamouflage
    camouflageVariations: {}
- type: Tag
  id: RMCBackpackFlamer
