  id: RMCHandsVeteranCBRN
  name: M3 MOPP手套
  description: M3 MOPP手套由经过处理的venlar制成，旨在保护使用者在CBRN环境中作业时双手免受污染。特别注重让使用者的双手具有足够灵活性，以完整操作步枪或使用大多数手持工具，同时手指上的圆形粘合图案可为使用者提供更强的抓握力。标准CBRN规程规定，手套在暴露于中等污染水平后，其最大有效使用寿命约为二十四小时，并建议使用者在此之后将其丢弃并更换。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Hands/Gloves/cbrn.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Hands/Gloves/cbrn.rsi
