  description: 一件坚固耐用、适应全天候的作战夹克，配发给IASF伞兵团。它设计灵活多用，既可作为野战服装，也可作为轻便的防护层。采用防弹纤维加固并经过耐候处理，能对弹片和轻武器射击提供有限防护，同时让伞兵在严酷环境中保持舒适。其深绿色外观与耐用面料，使其成为现役部署与休班穿着的必备之选。
