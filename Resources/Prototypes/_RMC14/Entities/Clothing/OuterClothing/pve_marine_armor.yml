- type: entity
  parent: RMCBasePVEEquipmentCase
  id: RMCPVEArmorCaseBase
  name: 基础护甲箱
  description: 一个护甲套装箱。
  components:
  - type: Icon
    sprite: _RMC14/Objects/Storage/PVE_Cases/Armor/marine.rsi
    state: icon
  - type: Sprite
    sprite: _RMC14/Objects/Storage/PVE_Cases/Armor/marine.rsi
    layers:
    - state: base
    - state: armor
      map:
      - armor
      visible: false
    - state: lid_closed
      map:
      - lid
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        lid:
          true:
            state: lid_open
          false:
            state: lid_closed
  - type: Storage
    maxItemSize: Ginormous
    grid:
    - 0,0,15,1
    whitelist:
      tags:
      - RMCHelmet
      - RMCPVEArmor
      - RMCPVEArmorAccessory
  - type: ItemMapper
    mapLayers:
      armor:
        whitelist:
          tags:
          - RMCPVEArmor
  - type: LimitedStorage
    limits:
    - popup: rmc-storage-limit-generic
      whitelist:
        tags:
        - RMCPVEArmor
    - popup: rmc-storage-limit-generic
      whitelist:
        tags:
        - RMCHelmet
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_RMC14/Handling/wirecutter_pickup.ogg
      params:
        volume: -4
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/wirecutter_drop.ogg
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Items/wirecutter_drop.ogg
      params:
        volume: -4
