  name: 苍鹰空降合成背心
  description: A lightweight, high-mobility flak vest designed for synthetic units
    attached to the IASF Paratrooper regiments. Developed by Weyland-Yutani, the Goshawk
    offers crucial protection while ensuring paratroopers retain full freedom of movement
    during high-risk insertions. Advanced composite plating and reinforced webbing
    make it effective against shrapnel and small-arms fire, striking the perfect balance
    between defense and agility for those who strike fast and strike hard.
