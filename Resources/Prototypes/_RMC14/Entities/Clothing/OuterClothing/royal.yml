  name: 苍鹰空降背心
  description: 一种专为 IASF 空降兵设计的轻量、高机动性防弹背心。由维兰德-尤坦尼开发，苍鹰在提供关键防护的同时，确保空降兵在高风险突入行动中保持完全的行动自由。先进复合装甲板和加固织带使其能有效抵御弹片和轻武器火力，为那些快速出击、猛烈打击的人员在防御与敏捷之间实现完美平衡。
  suffix: Survivor, Paratrooper
