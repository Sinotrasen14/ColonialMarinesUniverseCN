# Bases
- type: entity
  parent: RMCBaseArmor
  id: RMCSuitEVABase
  name: 压力服
  description: 一套又重又笨的太空服。
  abstract: true
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/EVA/unmc.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/OuterClothing/EVA/unmc.rsi
    equipDelay: 2
    unequipDelay: 2
  - type: ToggleableClothing
    clothingPrototype: RMCHelmetEVAUNMC
  # cmu edit start: every pressure suit carries its own air, as much as a field oxygen tank
  - type: Tag
    tags:
    - Hardsuit
    - GasTank
  - type: ActivatableUI
    key: enum.SharedGasTankUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SharedGasTankUiKey.Key:
        type: GasTankBoundUserInterface
  - type: GasTank
    releasePressure: 21.3
    air:
      volume: 7
      moles:
      - 3.932493683 # oxygen
      temperature: 293.15
  - type: UseDelay
    delays:
      gasTank:
        length: 1.0
  # cmu edit end
  # cmu edit start: suit and helmet together seal the wearer against vacuum and high pressure
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  # cmu edit end
  - type: CMArmor
    bio: 30 # RMC14 TODO: 30 rads aswell
    melee: 15
    bullet: 20
    explosionArmor: 10
  - type: ClothingSpeedModifier
    walkModifier: .5
    sprintModifier: .5
  - type: CMHardArmor
  - type: RMCBulkyArmor
  - type: RMCMagneticArmor
  - type: RMCArmorSpeedTier
    speedTier: heavy
  - type: CMUItemStain
    wornStates:
      outerClothing: bigsuit_blood

- type: entity
  parent: RMCHardHat
  id: RMCHelmetEVABase
  categories: [ HideSpawnMenu ]
  name: 压力头盔
  description: 一个沉重的太空头盔，设计用来与压力服配合使用。
  abstract: true
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Head/Helmets/EVA/unmc.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Head/Helmets/EVA/unmc.rsi
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
  - type: CMArmor
    bio: 30
    melee: 15
    bullet: 20
    explosionArmor: 10
  # cmu edit start: suit and helmet together seal the wearer against vacuum and high pressure
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  # cmu edit end
  - type: BreathMask
  - type: IdentityBlocker
  - type: IngestionBlocker
  - type: PointLight
    enabled: false
    radius: 5
    offset: 0,-0.85
    rotation: 90
    softness: 5
    autoRot: true
    netsync: false
    color: "#FFFFFF"
    lightMask: EllipseWide
  - type: RemoveComponents
    components:
    - type: Storage
    - type: LimitedStorage

- type: entity
  parent: RMCSuitEVABase
  id: RMCSuitEVASGO
  name: 智能枪兼容压力服
  suffix: Smart Gun harness
  description: 一个又重又笨的太空服。不知为何，这套服装似乎配备了智能武器系统的接口。
  abstract: true
  components:
  - type: ClothingBlockBackpack
  - type: SmartGunArmor

# UNMC
- type: entity
  parent: RMCSuitEVABase
  id: RMCSuitEVAUNMC
  # cmu edit start: generic, wearable over any uniform
  name: "MK.35 压力服"
  description: "一套厚重笨大的军用级宇航服。"
  # cmu edit end
  components:
  # cmu edit start: no built-in helmet; the MK.35 pressure helmet is worn separately
  - type: RemoveComponents
    components:
    - type: ToggleableClothing
      clothingPrototype: RMCHelmetEVAUNMC
  # cmu edit end
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/EVA/unmc.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/OuterClothing/EVA/unmc.rsi
    equipDelay: 2
    unequipDelay: 2
  # cmu edit: removed the marine uniform requirement
  - type: ActivatableUI
    key: enum.SharedGasTankUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SharedGasTankUiKey.Key:
        type: GasTankBoundUserInterface
  - type: GasTank
    releasePressure: 21.3
    air:
      # cmu edit start: as much as a field oxygen tank
      volume: 7
      moles:
      - 3.932493683 # oxygen
      # cmu edit end
      temperature: 293.15
  - type: Tag
    tags:
    - GasTank
  - type: UseDelay
    delays:
      gasTank:
        length: 1.0

- type: entity
  parent: RMCSuitEVASGO
  id: RMCSuitEVAUNMCSGO
  name: UNMC MK.35 ML66A 兼容压力服
  description: 一套厚重笨重的军用级太空服，由联合国海军陆战队和其他一些联合国组织使用。看起来这套服装有必要的接口，可以兼容 ML66A 智能枪。
  components:
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: ClothingRequireEquipped
    denyReason: rmc-armor-not-marine-jumpsuit
    whitelist:
      tags:
      - RMCUniformMarine

- type: entity
  parent: RMCHelmetEVABase
  id: RMCHelmetEVAUNMC
  # cmu edit: worn on its own now, so it can be spawned (was HideSpawnMenu)
  # cmu edit start: generic, wearable over any uniform
  name: "MK.35 压力头盔"
  description: "一顶厚重的太空头盔，设计用于搭配 MK.35 压力服。"
  # cmu edit end
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Head/Helmets/EVA/unmc.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Head/Helmets/EVA/unmc.rsi
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
  # cmu edit: removed the marine uniform requirement

