- type: entity
  parent: BaseItem
  id: RMCVisorBase
  abstract: true
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/helmet_visors.rsi
  - type: Item
    size: Tiny
  - type: ToggleVisor
- type: entity
  parent:
  - RMCVisorBase
  - RMCPowerCellSlotUnremovableSuper
  id: RMCVisorNightVision
  name: 夜视光学设备
  description: 一种可插入标准UNMC头盔的面罩式平视显示器。此型号可提供一种夜视能力，是经费正常的部队中标准配发的装备。可将其插入充电器，为内部电池充电。
  components:
  - type: Sprite
    state: nvg_sight
  - type: PowerCellDraw
    enabled: false
    drawRate: 76
  - type: Visor
    toggledSprite:
      sprite: _RMC14/Objects/Clothing/Head/Helmets/huds.rsi
      state: nvg_sight_right
    onIcon:
      sprite: _RMC14/Objects/Clothing/helmet_visors.rsi
      state: nvg_sight_down
  - type: NightVisionVisor
  - type: ToggleVisor
    ignoreRedundancy: true
  - type: ComponentToggler
    components:
    - type: PointLight
      enabled: true
      radius: 1.7
      softness: 1
      color: '#008000'
- type: entity
  parent: RMCVisorBase
  id: RMCVisorMedical
  name: 基础医疗光学目镜
  description: 一种可插入标准UNMC头盔的护目镜式平视显示器。此类型可提供抬头显示，显示附近类人生物的健康状态数据。
  components:
  - type: Sprite
    state: med_sight
  - type: Visor
    toggledSprite:
      sprite: _RMC14/Objects/Clothing/Head/Helmets/huds.rsi
      state: med_sight_right
    onIcon:
      sprite: _RMC14/Objects/Clothing/helmet_visors.rsi
      state: med_sight_down
  - type: ComponentToggler
    components:
    - type: ShowHealthBars
      damageContainers:
      - Biological
    - type: HolocardScanner
    - type: ShowHealthIcons
      damageContainers:
      - Biological
- type: entity
  parent: RMCVisorMedical
  id: RMCVisorMedicalAdvanced
  name: 高级医疗光学目镜
  description: 一种可插入标准UNMC头盔的护目镜式HUD。该型号提供平视显示，可显示附近类人生物的健康状况与研究笔记数据。
  components:
  - type: Sprite
    state: med_adv_sight
  - type: Visor
    onIcon:
      sprite: _RMC14/Objects/Clothing/helmet_visors.rsi
      state: med_adv_sight_down
    skillsRequired:
      all:
        RMCSkillMedical: 2
- type: entity
  parent: RMCVisorMedicalAdvanced
  id: RMCVisorMedicalAdvancedIntegrated
  suffix: Integrated
  components:
  - type: UnremovableVisor
  - type: Visor
    toggledSprite:
      sprite: _RMC14/Objects/Clothing/Head/Helmets/huds.rsi
      state: med_sight_left
- type: entity
  parent: RMCVisorBase
  id: RMCVisorWelding
  name: 焊接护目镜
  description: 可插入标准UNMC头盔的护目镜式HUD。此类型可保护眼睛免受焊接作业伤害。
  components:
  - type: Sprite
    state: sight_empty
  - type: Visor
    toggledSprite:
      sprite: _RMC14/Objects/Clothing/Head/Helmets/huds.rsi
      state: weld_visor
    onIcon:
      sprite: _RMC14/Objects/Clothing/helmet_visors.rsi
      state: blank_hud_sight_down
  - type: ComponentToggler
    components:
    - type: EyeProtection
    - type: WeldingVision
- type: entity
  parent: RMCVisorWelding
  id: RMCVisorWeldingIntegrated
  suffix: Integrated
  components:
  - type: UnremovableVisor
- type: entity
  parent: RMCVisorBase
  id: RMCVisorSquad
  name: 小队光学目镜
  description: 一种可插入标准UNMC头盔的护目镜式HUD。该型号可为海军陆战队小队提供平视显示。
  components:
  - type: Sprite
    state: hud_sight
  - type: Visor
    toggledSprite:
      sprite: _RMC14/Objects/Clothing/Head/Helmets/huds.rsi
      state: hud_sight_right
    onIcon:
      sprite: _RMC14/Objects/Clothing/helmet_visors.rsi
      state: hud_sight_down
  - type: ComponentToggler
    components:
    - type: GrantMarineIcons
- type: entity
  parent: RMCVisorSquad
  id: RMCVisorSquadIntegrated
  suffix: Integrated
  components:
  - type: UnremovableVisor
  - type: Visor
    toggledSprite:
      sprite: _RMC14/Objects/Clothing/Head/Helmets/huds.rsi
      state: hud_sight_left
