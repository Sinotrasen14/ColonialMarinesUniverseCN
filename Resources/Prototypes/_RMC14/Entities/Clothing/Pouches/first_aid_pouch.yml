- type: entity
  parent:
  - RMCPouchOpenClosed
  - RMCPouchStorage
  id: RMCPouchFirstAid
  name: 急救袋
  description: 默认情况下，里面装有自动注射器，但也可能装有药膏、绷带和药片包。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Pouches/firstaid.rsi
  - type: Storage
    grid:
    - 0,0,7,1
    whitelist:
      tags:
      - CMOintment
      - CMAutoInjector
      - Brutepack
      - PillPacket
  - type: FixedItemSizeStorage
  - type: IgnoreContentsSize
    items:
      tags:
      - PillPacket
- type: entity
  parent: RMCPouchFirstAid
