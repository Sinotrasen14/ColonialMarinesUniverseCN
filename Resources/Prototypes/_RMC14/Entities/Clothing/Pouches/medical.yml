  description: 一个用于携带补给的袋子，旨在协助医务人员并在战场上快速应对伤情，而不立即进行治疗。可容纳轮床、静滞袋和健康分析仪等补给品。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Pouches/frt_med.rsi
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,9,1
    whitelist:
      tags:
      - DiscreteHealthAnalyzer
      - Pill
      - Syringe
      - PillCanister
      - CMTraumaKit
      - CMBurnKit
