- type: entity
  parent:
  - RMCPouchOpenClosed
  - RMCPouchStorage
  id: RMCPouchMedkit
  name: 医疗包收纳袋
  description: 它专门用于存放医疗物品。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Pouches/medkit.rsi
  - type: StorageStoreSkillRequired
    entries:
    - whitelist:
        tags:
        - DiscreteHealthAnalyzer
        - Dropper
        - Pill
        - PillPacket
        - Bottle
        - Syringe
        - PillCanister
        - CMTraumaKit
        - CMBurnKit
        - CMOintment
        - Brutepack
        - CMBloodPack
        - CMAutoInjector
        - RMCSyringeCase
        - CMSurgicalCase
        - CMFireExtinguisherPortable
        - CMRollerItem
        - CMSurgicalLine
        - CMSynthGraft
        - BodyBag
        - Hypospray
        - CMUCastItem
        components:
        - Hypospray
      skills:
        all:
          RMCSkillMedical: 2
  - type: Storage
    grid:
    - 0,0,13,1
    maxItemSize: Large
    whitelist:
      tags:
      - DiscreteHealthAnalyzer
      - Dropper
      - Pill
      - PillPacket
      - Bottle
      - Syringe
      - PillCanister
      - CMTraumaKit
      - CMBurnKit
      - CMOintment
      - Brutepack
      - CMBloodPack
      - CMAutoInjector
      - RMCSyringeCase
      - CMSurgicalCase
      - CMFireExtinguisherPortable
      - CMRollerItem
      - CMSurgicalLine
      - CMSynthGraft
      - BodyBag
      - Hypospray
      components:
      - Hypospray
  - type: FixedItemSizeStorage
  - type: IgnoreContentsSize
    items:
      tags:
      - CMSurgicalCase
