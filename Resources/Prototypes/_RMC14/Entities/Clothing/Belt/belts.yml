- type: entity
  parent: CMBeltMarine
  id: CMBeltSmartGunOperator
  name: M280型智能枪操作员弹鼓腰带
  description: 尽管弹鼓第一，极其不符合人体工学，第二，需要极其精密的加工才能通用适配（剧透一下，它们并不能，这进一步助长了‘智能枪个性’的迷思），海军陆战队还是决定为 ML66A 系统的弹鼓弹药配发一种改良型陆战队腰带（更正式的编号为 M280），上面带有挂钩和防尘盖（对普通陆战队员来说过于复杂）。当弹鼓上的携行卡扣没有卡在浸了油的魔术贴里时，这套装具实际上确实能相当不错地固定住大量弹鼓。但归根结底，和标准装具相比……它很烂，可这不正是当海军陆战队员的意义所在吗？
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Belt/smart_gun_operator/jungle-classic.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Belt/smart_gun_operator/jungle-classic.rsi
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,11,1 # 6 slots
    whitelist:
      tags:
      - CMMagazinePistol
      - CMMagazineRifle
      - RMCMagazineShotgun
      - CMMagazineSmg
      - CMMagazineSniper
      - RMCMagazineSmartGun
      - RMCShellShotgun
      - RMCShellShotgunHDSG
      - Flare
  - type: FixedItemSizeStorage
  - type: IgnoreContentsSize
    items:
      tags:
      - RMCMagazineSmartGun
  - type: ItemCamouflage
    camouflageVariations:
      Jungle: _RMC14/Objects/Clothing/Belt/smart_gun_operator/jungle-classic.rsi
      Snow: _RMC14/Objects/Clothing/Belt/smart_gun_operator/snow-urban.rsi
      Desert: _RMC14/Objects/Clothing/Belt/smart_gun_operator/desert.rsi
      Urban: _RMC14/Objects/Clothing/Belt/smart_gun_operator/snow-urban.rsi
      Classic: _RMC14/Objects/Clothing/Belt/smart_gun_operator/jungle-classic.rsi

