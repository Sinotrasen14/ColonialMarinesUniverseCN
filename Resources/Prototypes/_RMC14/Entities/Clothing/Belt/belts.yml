# Storage
- type: entity
  parent: CMBeltBaseStorage
  id: CMBeltMarine
  name: M276型弹药携行装具
  description: M276是美国殖民地海军陆战队的标准负重装具。它由一条模块化腰带和各种扣具组成。这是标准型号，专为大批量弹药携行行动设计。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Belt/marine/jungle-classic.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Belt/marine/jungle-classic.rsi
  - type: Item
    size: Large
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,9,1 # 5 slots
    whitelist:
      tags:
      - Flare
      - RMCShellShotgun
      - RMCShellShotgunHDSG
      - CMMagazinePistol
      - RMCMagazineRevolver
      - CMMagazineRifle
      - RMCMagazineShotgun
      - CMMagazineSmg
      - CMMagazineSniper
      - Grenade
      #      - # TODO RMC14 mines
      #      - # TODO RMC14 snacks
      components:
      - BallisticAmmoProvider
    blacklist:
      tags:
      - RMCAttachmentUnderbarrel
  - type: IgnoreContentsSize
    items:
      tags:
      - CMMagazineRifle
      - RMCMagazineShotgun
      - RMCShellShotgunHDSG
      - CMMagazineSmg
  - type: FixedItemSizeStorage
  - type: ItemCamouflage
    camouflageVariations:
      Jungle: _RMC14/Objects/Clothing/Belt/marine/jungle-classic.rsi
      Snow: _RMC14/Objects/Clothing/Belt/marine/snow-urban.rsi
      Desert: _RMC14/Objects/Clothing/Belt/marine/desert.rsi
      Urban: _RMC14/Objects/Clothing/Belt/marine/snow-urban.rsi
      Classic: _RMC14/Objects/Clothing/Belt/marine/jungle-classic.rsi

