#
# You're probably looking for: CMU14/RoundSetup/Intel/Tech/**
#

- type: entity
  abstract: true
  parent: BaseItem
  id: RMCIntelBase
  name: 情报物品
  components:
  - type: Corrodible
    isCorrodible: false
  - type: IntelDetectorTracked

- type: entity
  abstract: true
  parent: RMCIntelBase
  id: RMCIntelReadableBase
  components:
  - type: IntelReadObjective
    value: 0.1
  - type: IntelRetrieveItemObjective
    value: 0.1
  - type: Tag
    tags:
    - RMCIntelItem

- type: entity
  parent: RMCIntelReadableBase
  id: RMCIntelPaperScrap
  name: 废纸
  description: 一张废纸，你觉得有些字可能还看得懂。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/paper.rsi
    state: paper_words
  - type: Item
    size: Tiny
  - type: IntelReadObjective
    state: Active
  - type: IntelClues
    clue: rmc-intel-clue-paper-scrap

- type: entity
  parent: RMCIntelReadableBase
  id: RMCIntelProgressReport
  name: 进展报告
  description: 某人给他们的主管写的一份关于某个项目状态的书面报告。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/paper.rsi
    state: paper_p_words
  - type: Item
    size: Tiny
  - type: IntelReadObjective
    value: 0.2
    delay: 6
  - type: IntelClues
    clue: rmc-intel-clue-progress-report
    category: rmc-intel-reports

- type: entity
  parent: RMCIntelReadableBase
  id: RMCIntelFolder
  name: 情报文件夹
  description: 一个里面有些文件的文件夹。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/paper.rsi
    layers:
    - state: folder
      map: ["base" ]
  - type: Item
    size: Tiny
  - type: IntelReadObjective
    value: 0.2
    delay: 4
  - type: IntelRequires
    requiresCount: 2
  - type: IntelClues
    clue: rmc-intel-clue-folder
    category: rmc-intel-folders
  - type: RandomSprite
    available:
    - base:
        folder: ""
        folder_black: ""
        folder_blue: ""
        folder_red: ""
        folder_yellow: ""

- type: entity
  parent: RMCIntelReadableBase
  id: RMCIntelTechnicalManual
  name: 技术手册
  description: 一本高度专业化的技术手册，可能对相关领域的某些人有用。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Books/Other/book.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: IntelReadObjective
    value: 0.35
    delay: 20
  - type: IntelRequires
    requiresCount: 2
  - type: IntelClues
    clue: rmc-intel-clue-technical-manual
    category: rmc-intel-manuals

- type: entity
  abstract: true
  parent: RMCIntelBase
  id: RMCIntelRetrieveDeviceBase
  components:
  - type: IntelRetrieveItemObjective
    state: Active
    value: 0.7
  - type: IntelClues
    clues: 8
  - type: IntelSerial

- type: entity
  parent: [CMHealthAnalyzer, RMCIntelRetrieveDeviceBase]
  id: RMCIntelRetrieveHealthAnalyzer
  suffix: Intel, Experimental Device
  components:
  - type: IntelClues
    clue: rmc-intel-clue-experimental-device

- type: entity
  parent: RMCCommunicationsConsoleBase
  id: RMCTechTreeConsole
  name: 情报科技树控制台
  description: 一个用来购买科技产品的机器。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: techweb
  - type: InteractionOutline
  - type: ActivatableUI
    key: enum.TechControlConsoleUI.Key
  - type: UserInterface
    interfaces:
      enum.TechControlConsoleUI.Key:
        type: TechControlConsoleBui
  - type: TechControlConsole
  - type: ActivatableUIBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  parent: RMCCommunicationsConsoleBase
  id: RMCComputerIntel
  name: 情报英特尔电脑
  description: 一台 UNMC Intel 电脑，用于数据编目和分发。
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: terminal1_old
  - type: InteractionOutline
  - type: IntelConsole
- type: entity
  id: RMCIntelTechTree
  name: intel tech tree
  categories: [ HideSpawnMenu ]
  components:
  - type: IntelTechTree
    tree:
      options:
      -
        - name: 解锁一级科技
          description: 将科技树转到另一个等级。
          cost: 0
          events:
          - !type:TechUnlockTierEvent
            tier: 1
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: upgrade
      -
        # CMU14: ARC supply belongs to the WY platoon catalog, not research.
        - name: Requisition Budget Increase
          description: 把资源分配到各个支出申请上。
          cost: 7
          increase: 1
          repurchasable: true
          events:
          - !type:TechRequisitionsBudgetEvent
            amount: 5000
          - !type:TechAnnounceEvent
            author:  SPECIAL ASSETS AUTHORIZED
            message: Additional supply budget has been authorised for this operation.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: budget_req
        - name: 空投预算增加
          description: 将资源分配到空投制造器。
          cost: 6
          increase: 1
          repurchasable: true
          events:
          - !type:TechDropshipBudgetEvent
            amount: 2000
          - !type:TechAnnounceEvent
            author:  SPECIAL ASSETS AUTHORIZED
            message: Additional dropship part fabricator points have been authorised for this operation.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: budget_ds
        - name: 解锁二级科技
          description: 将科技树转到另一个等级
          cost: 5
          events:
          - !type:TechUnlockTierEvent
            tier: 2
          - !type:TechAnnounceEvent
            author: ALMAYER DEFCON LEVEL INCREASED
            message: "THREAT ASSESSMENT LEVEL INCREASED TO LEVEL 2.

              LEVEL 2 assets have been authorised to handle the situation."
            sound: /Audio/_RMC14/AI/commandreport.ogg
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: upgrade
      -
        - name: 额外OB弹药 - 高爆
          description: 高爆轰炸弹药，用于装入轨道加农炮。
          cost: 5
          increase: 2
          repurchasable: true
          events:
          - !type:TechLogisticsDeliveryEvent
            object: RMCOrbitalCannonWarheadExplosive
          - !type:TechAnnounceEvent
            author:  SPECIAL ASSETS AUTHORIZED
            message: Additional Orbital Bombardment warheads (HE) have been delivered to Requisitions' ASRS.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: ob_he
        - name: 额外的OB弹药 - 燃烧弹
          description: 高度易燃的轰击弹药，用于装入轨道加农炮。
          cost: 5
          increase: 2
          repurchasable: true
          events:
          - !type:TechLogisticsDeliveryEvent
            object: RMCOrbitalCannonWarheadIncendiary
          - !type:TechAnnounceEvent
            author:  SPECIAL ASSETS AUTHORIZED
            message: Additional Orbital Bombardment warheads (Incendiary) have been delivered to Requisitions' ASRS.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: ob_incend
        - name: 额外OB弹药 - 集束
          description: 高爆炸性弹药，会碎裂，用于装载到轨道加农炮里。
          cost: 5
          increase: 2
          repurchasable: true
          events:
          - !type:TechLogisticsDeliveryEvent
            object: RMCOrbitalCannonWarheadCluster
          - !type:TechAnnounceEvent
            author:  SPECIAL ASSETS AUTHORIZED
            message: Additional Orbital Bombardment warheads (Cluster) have been delivered to Requisitions' ASRS.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: ob_cluster
        - name: 解锁三级科技
          description: 将科技树转到另一个等级
          cost: 5
          events:
          - !type:TechUnlockTierEvent
            tier: 3
          - !type:TechAnnounceEvent
            author: ALMAYER DEFCON LEVEL INCREASED
            message: "THREAT ASSESSMENT LEVEL INCREASED TO LEVEL 3.

              LEVEL 3 assets have been authorised to handle the situation."
            sound: /Audio/_RMC14/AI/commandreport.ogg
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: upgrade
      -
        - name: 叫醒增援部队
          description: 唤醒额外的部队来应对任何威胁。
          cost: 6
          increase: 6
          repurchasable: true
          events:
          - !type:TechCryoMarinesEvent
          - !type:TechAnnounceEvent
            author:  SPECIAL ASSETS AUTHORIZED
            message: Additional troops are being taken out of cryo.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: cryotroops
        - name: 唤醒额外专家
          description: 唤醒额外的专家来应对任何威胁。
          cost: 8
          events:
          - !type:TechCryoSpecEvent
          - !type:TechAnnounceEvent
            author:  SPECIAL ASSETS AUTHORIZED
            message: An additional specialist is being taken out of cryo.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: overshield
        - name: 解锁四级科技
          description: 将科技树转到另一个等级
          cost: 5
          events:
          - !type:TechUnlockTierEvent
            tier: 4
          - !type:TechAnnounceEvent
            author: ALMAYER DEFCON LEVEL INCREASED
            message: "THREAT ASSESSMENT LEVEL INCREASED TO LEVEL 4.

              LEVEL 4 assets have been authorised to handle the situation."
            sound: /Audio/_RMC14/AI/commandreport.ogg
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: upgrade
      -
        - name: 核装置
          description: 	购买一枚核装置。只能在行动进行116分钟后购买。这是唯一能确保的方式。
          cost: 5
          timeLock: 115m
          events:
          - !type:TechLogisticsDeliveryEvent
            object: RMCNuke
          - !type:TechAnnounceEvent
            author:  SPECIAL ASSETS AUTHORIZED
            message: The deployment of Nuclear Ordnance have been authorized and will be delivered to the Requisitions Department, via ASRS.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: nuke
  - type: VehicleSupplyTech
- type: Tag
  id: RMCIntelItem

- type: entity
  parent: RMCIntelPaperScrap
  id: RMCIntelDebug
  suffix: DEBUG, DO NOT MAP
  components:
  - type: IntelReadObjective
    state: Active
    value: 999
