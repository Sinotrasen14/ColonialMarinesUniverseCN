# Plasteel

- type: material
  id: CMPlasteel
  stackEntity: CMSheetPlasteel
  name: 材料-塑钢
  icon: {sprite: _RMC14/Objects/Materials/Sheets/plasteel.rsi, state: plasteel}
  color: "#696969"
  price: 0.00746

- type: stack
  id: CMPlasteel
  name: 塑钢
  icon: {sprite: /Textures/_RMC14/Objects/Materials/Sheets/plasteel.rsi, state: plasteel}
  spawn: CMSheetPlasteel
  maxCount: 50

- type: entity
  parent: CMSheetMetalBase
  id: CMSheetPlasteel
  name: 塑钢板
  description: 塑钢板是一种昂贵、耐用的材料，由铂金、钢和先进聚合物结合制成，形成一种耐腐蚀、高度耐用且轻质的金属。它之所以没有被更频繁使用，唯一原因就是它实在贵得要命。
  suffix: Filled
  components:
  - type: RMCConstructionItem
    buildable:
    - RMCPlasteelBarricadeFoldableBuild
    - RMCPlasteelBarricadeBuild
    - RMCDividerConstruction
    - RMCReinforcedWindowFrameBuild
    - RMCDividerConstruction
    - RMCPlasteelRodBuild
    - RMCMetalCrateBuild
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CMPlasteel: 3750
  - type: Stack
    count: 40
    stackType: CMPlasteel
    baseLayer: base
    layerStates:
    - plasteel
    - plasteel_2
    - plasteel_3
    - plasteel_4
  - type: Sprite
    sprite: _RMC14/Objects/Materials/Sheets/plasteel.rsi
    layers:
    - state: plasteel_4
      map: ["base"]
  - type: Item
    sprite: _RMC14/Objects/Materials/Sheets/plasteel.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
    heldPrefix: plasteel
  - type: UserInterface
    interfaces:
      enum.RMCConstructionUiKey.Key:
        type: RMCConstructionBui

