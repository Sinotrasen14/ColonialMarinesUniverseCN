  - type: Stack
    stackType: CMSteel
    count: 20

- type: entity
  parent: CMSheetMetal
  id: CMSheetMetal30
  suffix: "30"
  components:
  - type: Sprite
    state: metal_3
  - type: Stack
    stackType: CMSteel
    count: 30

- type: entity
  parent: CMSheetMetal
  id: CMSheetMetal40
  suffix: "40"
  components:
