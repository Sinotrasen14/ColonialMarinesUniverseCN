# Phoron
- type: material
  id: CMPhoron
  stackEntity: CMSheetPhoron
  name: 材料-福龙Phoron
  icon: {sprite: _RMC14/Objects/Materials/Sheets/phoron.rsi, state: phoron}
  color: "#7e009e"
  price: 0.01

- type: stack
  id: CMPhoron
  name: 福龙Phoron
  icon: {sprite: _RMC14/Objects/Materials/Sheets/phoron.rsi, state: phoron}
  spawn: CMSheetPhoron
  maxCount: 50

- type: entity
  parent: SheetOtherBase
  id: CMSheetPhoron
  name: 固态福龙Phoron
  description: 福隆是一种极其稀有且具有奇特性质的矿物，常用于前沿研究。考虑到它可能具有相当强的毒性和易燃性，仅仅要将其制成稳定的固态形式就已经够困难了。
  suffix: Full
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CMPhoron: 2000
  - type: Stack
    stackType: CMPhoron
    count: 50
  - type: Sprite
    state: phoron
    sprite: _RMC14/Objects/Materials/Sheets/phoron.rsi
  - type: Item
    heldPrefix: phoron
    size: Normal
    sprite: _RMC14/Objects/Materials/Sheets/phoron.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Appearance
  - type: Extractable
    grindableSolutionName: phoron
  - type: SolutionContainerManager
    solutions:
      phoron:
        reagents:
        - ReagentId: RMCPhoron
          Quantity: 20
  - type: Tag
    tags:
    - Sheet

- type: entity
  parent: CMSheetPhoron
  id: CMSheetPhoron15
  suffix: 15
  components:
  - type: Stack
    count: 15

- type: entity
  parent: CMSheetPhoron
  id: CMSheetPhoron25
  suffix: 25
  components:
  - type: Stack
    count: 25

- type: entity
  parent: CMSheetPhoron
  id: CMSheetPhoron30
  suffix: "30"
  components:
  - type: Stack
    count: 30

- type: entity
  parent: CMSheetPhoron
  id: CMSheetPhoron1
  suffix: Single
  components:
  - type: Stack
    count: 1

# Wood
- type: material
  id: RMCWood
  stackEntity: RMCPlankWood
  name: 材料-木材
  icon: {sprite: _RMC14/Objects/Materials/Sheets/wood.rsi, state: wood}
  color: "#966F33"
  price: 0.00133

- type: stack
  id: RMCWood
  name: 木板
  icon: {sprite: _RMC14/Objects/Materials/Sheets/wood.rsi, state: wood}
  spawn: RMCPlankWood
  maxCount: 50

- type: entity
  parent: SheetOtherBase
  id: RMCPlankWood
  name: 木板
  description: 只能猜测这是一堆木头。
  suffix: Full
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      RMCWood: 3750
  - type: Stack
    stackType: RMCWood
    count: 50
    baseLayer: base
    layerStates:
    - wood
    - wood_2
    - wood_3
    - wood_4
  - type: Sprite
    sprite: _RMC14/Objects/Materials/Sheets/wood.rsi
    state: wood_4
    layers:
    - state: wood_4
      map: ["base"]
  - type: Item
    sprite: _RMC14/Objects/Materials/Sheets/wood.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
    heldPrefix: wood
    size: Normal
  - type: Appearance
  - type: Flamability
    chance: 1.0
    rate: 0.4
    range: 0.8
    spread: 0.8
    destroyAnyway: true
  - type: Tag
    tags:
    - Sheet
  - type: RMCConstructionItem
    buildable:
    - RMCFloorTileWoodBuild
    - RMCCampfireBuild
    - AU14TorchBuild
    - AU14BaseballBatBuild
    - AU14FishingRodBuild
    - AU14WoodenChairBuild
    - RMCWoodenBarricadeBuild
    - RMCWoodenCrateBuild
    - AU14WoodenCrossBuild
    - AU14WoodenSandalsBuild
    # wooden door
    - AU14CoffinBuild
    - AU14WoodenTableBuild
    - AU14FancyWoodenTableBuild
    # wooden pole
  - type: UserInterface
    interfaces:
      enum.RMCConstructionUiKey.Key:
        type: RMCConstructionBui
  - type: CampfireFuel
    fuelAmount: 1

- type: entity
  parent: RMCPlankWood
  id: RMCPlankWood10
  suffix: 10
  components:
  - type: Stack
    count: 10

- type: entity
  parent: RMCPlankWood
  id: RMCPlankWood25
  suffix: 25
  components:
  - type: Stack
    count: 25

- type: entity
  parent: RMCPlankWood
  id: RMCPlankWood50
  suffix: 50
  components:
  - type: Stack
    count: 50

- type: entity
  parent: RMCPlankWood
  id: RMCPlankWood1
  suffix: Single
  components:
  - type: Stack
    count: 1

- type: entity
  parent: RMCPlankWood
  id: RMCPlankWood2
  suffix: 2
  components:
