  - type: Stack
    stackType: BarbedWire
    count: 15

- type: entity
  parent: BarbedWireBase
  id: BarbedWire1
  suffix: Single
  components:
  - type: Sprite
    state: barbed_wire
  - type: Stack
    stackType: BarbedWire
    count: 1
  - type: Construction
    graph: BarbedWireGraph
    node: nodeBarbedWire
