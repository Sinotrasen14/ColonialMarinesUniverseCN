- type: entity
  abstract: true
  id: BarbedWireBase
  parent: BaseItem
  name: 带刺铁丝网
  suffix: Filled
  description: 一种金属围栏铁丝，沿铁丝以一定间隔布置有锋利边缘或尖刺。简而言之，碰到它会很疼。非常疼。将其放在路障上，可防止不速之客毫无痛感地突破。
  components:
  - type: Tag
    tags:
    - Metal
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Stack
    stackType: BarbedWire
    baseLayer: base
    layerStates:
    - barbed_wire
    - barbed_wire_2
    - barbed_wire_3
  - type: Sprite
    sprite: _RMC14/Objects/barbed_wire.rsi
    state: barbed_wire_3
    layers:
    - state: barbed_wire_3
      map: ["base"]
  - type: Item
    size: Small
  - type: Appearance
  - type: BarbedWire
  - type: RMCConstructionItem
    buildable:
    - RMCRazorwireBuild
  - type: UserInterface
    interfaces:
      enum.RMCConstructionUiKey.Key:
        type: RMCConstructionBui

- type: entity
  parent: BarbedWireBase
  id: BarbedWire10
  suffix: "10"
  components:
  - type: Sprite
    state: barbed_wire
  - type: Stack
    stackType: BarbedWire
    count: 10

- type: entity
  parent: BarbedWireBase
