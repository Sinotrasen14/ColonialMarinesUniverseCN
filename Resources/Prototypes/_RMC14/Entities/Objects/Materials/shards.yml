- type: entity
  parent: BaseItem
  id: CMShardBase
  abstract: true
  components:
  - type: Tool
    qualities:
    - Slicing
  - type: Sprite
    layers:
    - sprite: _RMC14/Objects/Materials/shards.rsi
      state: large
      map: ["enum.DamageStateVisualLayers.Base"]
  - type: Appearance
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        large: ""
        medium: ""
        small: ""
        tiny: ""
  - type: Item
    sprite: Objects/Materials/Shards/shard.rsi
    size: Tiny
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 2
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage
  - type: Damageable
    damageModifierSet: Glass
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: MeleeWeapon
    attackRate: 1
    damage:
      types:
        Slash: 3.5
  - type: CMSurgeryTool
  - type: CMScalpel
  - type: CMRetractor
  - type: CMUImprovisedSurgeryTool
    delayMultiplier: 2.3
    mishapChance: 0.18
    mishapDamageType: Slash
    mishapDamageAmount: 4
    failurePenalty: 2

- type: entity
  parent: CMShardBase
  id: CMShardGlass
  name: 玻璃碎片
  description: 一块碎玻璃。也许可以当作……投掷武器使用？
  components:
  - type: ToolRefinable
    refineResult:
    - id: CMSheetGlass1
  - type: Tag
    tags:
    - GlassShard
    - Trash

- type: entity
  parent: CMShardBase
  id: RMCShardIce
  name: 冰碎片
  description: 一块冰碎片。也许可以用作……投掷武器？
  components:
  - type: Tag
    tags:
    - Trash

- type: entity
  parent: CMShardBase
  id: CMShardPhoron
  name: 福龙Phoron碎片
  description: 一块破碎的phoron玻璃碎片。比普通玻璃碎片坚固得多。显然还不够结实，当不了窗户。
  components:
  - type: Sprite
    layers:
    - sprite: _RMC14/Objects/Materials/shards.rsi
      state: phoron
      map: ["enum.DamageStateVisualLayers.Base"]
  - type: Appearance
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        phoron: ""
        phoronlarge: ""
        phoronmedium: ""
        phoronsmall: ""
  - type: ToolRefinable
    refineResult:
    - id: CMSheetGlass1
    - id: CMSheetPhoron1
  - type: Tag
    tags:
    - PlasmaGlassShard
    - Trash
