- type: entity
  parent: BaseItem
  id: CMHealthAnalyzer
  name: HF2健康分析仪
  description: 一种手持式人体扫描仪，能够分辨受试者的生命体征。前面板能够提供受试者状态的基本读数。
  suffix: RMC14
  components:
  - type: Item
    size: Small
  - type: Tag
    tags:
    - DiscreteHealthAnalyzer
  - type: Sprite
    sprite: _RMC14/Objects/Medical/health_analyzer.rsi
    state: health
  - type: ActivatableUI
    key: enum.HealthScannerUIKey.Key
    inHandsOnly: false
  - type: UserInterface
    interfaces:
      enum.HealthScannerUIKey.Key:
        type: HealthScannerBui
  - type: HealthScanner
    sound:
      path: "/Audio/_RMC14/Medical/healthanalyzer.ogg"
  - type: Appearance
  - type: GuideHelp
    guides:
    - MedicalDoctor
  - type: UseDelay
    delay: 1
  - type: MedicallyUnskilledDoAfter
  - type: Clothing
    quickEquip: false
    slots:
    - suitstorage
  - type: RMCItemKeepUIOpenOnStorageClosed
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 200
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
