# - Bonedrill
- type: entity
  parent: CMSurgicalDrill
  id: CMSurgicalDrillPredator
  name: 骨钻
  components:
  - type: Sprite
    state: predator_drill



# Scalpel
- type: entity
  parent: CMBaseToolSurgery
  id: CMScalpel
  name: 手术刀
  description: 切，切，再切一次。
  components:
  - type: CMSurgeryTool
    startSound:
      path: /Audio/_RMC14/Medical/Surgery/scalpel1.ogg
    endSound:
      path: /Audio/_RMC14/Medical/Surgery/scalpel2.ogg
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: Item
    size: Tiny
    sprite: _RMC14/Objects/Medical/Surgery/scalpel.rsi
  - type: Utensil
    types:
    - Knife
  - type: MeleeWeapon
    wideAnimationRotation: 90
    swingLeft: true
    attackRate: 1.5
    damage:
      types:
        Slash: 8
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: CMScalpel
  - type: CMUShrapnelExtractor
    removeCount: 3
    delay: 1.25
    painPenalty: 3
    damageOnExtract: 1
  - type: CMUBurnDebridementTool
  - type: Tag
    tags:
    - RMCScalpel
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 10000
      CMGlass: 5000

# - Predator
- type: entity
  parent: CMScalpel
  id: CMScalpelPredator
  name: 切割机
  components:
  - type: Sprite
    state: predator_scalpel

# - Laser
- type: entity
  parent: CMScalpel
  id: CMScalpelLaser
  name: 原型激光手术刀
  description: 一把加装定向激光的手术刀，用于在切开时控制出血。它也可作为烧灼器使用。这把看起来像是不可靠的早期型号。
  components:
  - type: Sprite
    layers:
    - state: scalpel_laser
      map: ["enum.ToggleableVisuals.Layer"]
  - type: MeleeWeapon
    damage:
      types:
        Slash: 0
  - type: ItemToggle
    predictable: false
  - type: ItemToggleHot
  - type: CMCautery
  - type: Tag
    tags:
    - CMCautery
    - RMCScalpel
  - type: UseDelay
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Slash: 14
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          true: {state: scalpel_laser_on}
          false: {state: scalpel_laser}

# - - Improved
- type: entity
  parent: CMScalpelLaser
  id: CMScalpelLaserImproved
  name: 激光手术刀
  description: 一把配有定向激光的手术刀，用于在切开时控制出血。也可用作烧灼器。这把看起来值得信赖，不过还能更好。
  components:
  - type: Sprite
    layers:
    - state: scalpel_laser_2
      map: ["enum.ToggleableVisuals.Layer"]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          true: {state: scalpel_laser_2_on}
          false: {state: scalpel_laser_2}

# - - Advanced
- type: entity
  parent: CMScalpelLaser
  id: CMScalpelLaserAdvanced
  name: 高级激光手术刀
  description: 一把配有定向激光的手术刀，用于在切开时控制出血。也可用作烧灼器。这把看起来是精密能量刀具的巅峰！
  components:
  - type: Sprite
    layers:
    - state: scalpel_laser_3
      map: ["enum.ToggleableVisuals.Layer"]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          true: {state: scalpel_laser_3_on}
          false: {state: scalpel_laser_3}

# - Pict System
- type: entity
  parent: CMScalpel
  id: CMScalpelPICT
  name: PICT系统
  description: PICT系统使用高频振动刀片、激光烧灼和抽吸液体控制系统，在防止任何液体泄漏的同时精确切断目标组织。尽管其研发计划波折重重且价格骇人，但在复杂的实验性手术之外，它并不比一把普通的二十美元手术刀更好，也无法无血地切出全长切口。
  components:
  - type: Sprite
    state: pict_system
  - type: CMCautery

# - Manager
- type: entity
  parent: CMScalpel
  id: CMScalpelManager
  name: 切口管理系统
  description: 作为外科医生身体的真正延伸，这一奇迹能即刻、彻底地准备好切口，让治疗步骤得以立即开始。
  components:
  - type: Sprite
    state: scalpel_manager
  - type: CMUIncisionManagementSystem



