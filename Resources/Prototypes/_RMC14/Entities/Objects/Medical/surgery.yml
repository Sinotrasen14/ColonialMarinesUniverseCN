# Base
- type: entity
  parent: BaseToolSurgery
  id: CMBaseToolSurgery
  abstract: true
  name: 回缩器
  description: 收回东西。
  components:
  - type: Item
    size: Small
  - type: CMSurgeryTool
  - type: Clothing
    quickEquip: false
    slots:
    - suitstorage
  - type: StaticPrice
    price: 24

# Retractor
- type: entity
  parent: CMBaseToolSurgery
  id: CMRetractor
  name: 牵开器
  description: 牵开东西。
  components:
  - type: CMSurgeryTool
    startSound:
      path: /Audio/_RMC14/Medical/Surgery/retractor1.ogg
    endSound:
      path: /Audio/_RMC14/Medical/Surgery/retractor2.ogg
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/retractor.rsi
    state: retractor
  - type: Item
    sprite: _RMC14/Objects/Medical/Surgery/retractor.rsi
  - type: CMRetractor
  - type: Tag
    tags:
    - CMRetractor
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 10000
      CMGlass: 5000

# - Predator
- type: entity
  parent: CMRetractor
  id: CMRetractorPredator
  name: 开启者
  components:
  - type: Sprite
    state: predator_retractor



