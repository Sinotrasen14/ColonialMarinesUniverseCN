# Surgical drill
- type: entity
  parent: CMBaseToolSurgery
  id: CMSurgicalDrill
  name: 手术钻
  description: 你可以用这个物品钻孔。你懂吗？
  components:
  - type: CMSurgeryTool
    startSound:
      path: /Audio/_RMC14/Medical/Surgery/saw.ogg
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/drill.rsi
    state: drill
