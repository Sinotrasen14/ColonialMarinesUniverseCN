- type: entity
  abstract: true
  parent: BaseStorageItem
  id: CMPacketPills
  name: 药片包
  description: 装有药片。一旦取出，就无法放回。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/pill_packets.rsi
  - type: Item
    size: Small
  - type: Storage # TODO RMC14 quick-eject
    maxItemSize: Small
    grid:
    - 0,0,7,1 # 4 slots
    whitelist:
      components:
      - Pill
  - type: FixedItemSizeStorage
  - type: Tag
    tags:
    - PillPacket
  - type: IconLabel
    textColor: White
    storedOffset: -12, 12
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: Clothing
    quickEquip: false
    slots:
    - suitstorage

- type: Tag
  id: PillPacket

- type: entity
  parent: CMPacketPills
  id: CMPacketPillsTricordrazine
  name: 三卡地嗪药片包
  description: 这个药片包内装有三卡地嗪药片。能轻微治愈所有类型的伤害。一旦取出，就无法放回。短时间内不要服用超过2片。
  components:
  - type: Sprite
    state: tricordrazine_packet
  - type: StorageFill
    contents:
    - id: CMPillTricordrazine
      amount: 4
  - type: IconLabel
    labelTextLocId: rmc-tricordazine-container-label-text

- type: entity
  parent: CMPacketPills
  id: CMPacketPillsBicaridine
  name: 比卡立定药片包
  description: 这个药包内装有比卡立定药片。能有效治疗钝击伤害。一旦取出，就无法放回。短时间内不要服用超过2片。
  components:
  - type: Sprite
    state: bicaridine_packet
  - type: StorageFill
    contents:
    - id: CMPillBicaridine
      amount: 4
  - type: IconLabel
    labelTextLocId: rmc-bicaridine-container-label-text

- type: entity
  parent: CMPacketPills
  id: CMPacketPillsKelotane
  name: 凯洛坦药丸包
  description: 这个药丸包内装有凯洛坦药丸。能有效治疗烧伤。一旦取出，就无法再放回。短时间内不要服用超过2粒。
  components:
  - type: Sprite
    state: kelotane_packet
  - type: StorageFill
    contents:
    - id: CMPillKelotane
      amount: 4
  - type: IconLabel
    labelTextLocId: rmc-kelotane-container-label-text

