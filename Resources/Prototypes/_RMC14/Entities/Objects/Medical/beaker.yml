# Parent for containers that cannot be filled/drained by hand.
- type: entity
  parent: BaseItem
  id: RMCSealedChemicalContainer
  abstract: true
  components:
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:SpillBehavior
        solution: beaker
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: MeleeWeapon
    soundNoDamage:
      path: "/Audio/Effects/Fluids/splat.ogg"
    damage:
      types:
        Blunt: 0
  - type: MixableSolution
    solution: beaker
  - type: FitsInDispenser
    solution: beaker
  - type: ExaminableSolution
    solution: beaker
  - type: SolutionTransfer
    canChangeTransferAmount: true
    canSend: false
    canReceive: false
  - type: RMCPressurizedSolution
    solution: beaker
  - type: SolutionItemStatus
    solution: beaker
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: Appearance
  - type: Damageable
    damageModifierSet: Glass
  - type: Injurable
    damageContainer: Inorganic
  - type: DnaSubstanceTrace

# Minitank /obj/item/reagent_container/glass/minitank
- type: entity
  parent: RMCBeakerBaseMetallic
  id: CMMiniTank
  name: MS-11智能补充罐
  description: 一个坚固的小型储罐，能够为以前需要纳米医疗系统才能补充的自动注射器进行补充。借助微芯片的奇妙功能，它会自动将正确的化学物质装入大多数单试剂自动注射器中。不过，它无法部分填充这些注射器。顶部有一个阀门，可将试剂转移到另一个容器，或将其完全排空。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Tanks/minitank.rsi
    layers:
    - state: icon
    - state: minitank1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    size: Normal
    sprite: _RMC14/Objects/Tanks/minitank.rsi
  - type: Solution
    solution:
      maxVol: 180
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: minitank
  - type: StaticPrice
    price: 20
  - type: Tag
    tags:
    - RMCMiniTank
    - ChemDispensable
  - type: RMCSmartRefillTank
    solution: beaker
  - type: SolutionTransfer
    transferAmount: 180
    maxTransferAmount: 180
    canChangeTransferAmount: true
    transferAmounts:
    - 5
    - 10
    - 15
    - 30
    - 45
    - 60
    - 90
    - 120
    - 180
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 500

- type: Tag
  id: RMCMiniTank

