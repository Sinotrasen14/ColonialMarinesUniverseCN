- type: entity
  parent: CMBeakerBase
  id: CMBeaker
  name: 烧杯
  description: 一个烧杯。最多可容纳 60 个单位。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/beaker.rsi
    layers:
    - state: beaker
    - state: beaker1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: lid_beaker
      map: ["enum.OpenableVisuals.Layer"]
      visible: false
  - type: Item
    size: Small
    sprite: _RMC14/Objects/Medical/beaker.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: beaker
  - type: Solution
    id: beaker
    solution:
      maxVol: 60
  - type: Openable
    opened: true
    closeable: true
    examineText: rmc-bottle-closed
    openVerbText: rmc-bottle-remove-lid
    closeVerbText: rmc-bottle-put-lid
    sound:
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          true: {visible: false}
          false: {visible: true}
  - type: Spillable
    solution: beaker
  - type: StaticPrice
    price: 10
  - type: Clothing
    quickEquip: false
    slots:
    - suitstorage
  - type: PhysicalComposition
    materialComposition:
      CMGlass: 500

