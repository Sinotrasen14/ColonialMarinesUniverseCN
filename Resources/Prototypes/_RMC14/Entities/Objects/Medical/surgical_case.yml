- type: entity
  parent: BaseStorageItem
  id: CMSurgicalCase
  name: 手术器械箱
  description: 这是一个用于存放基本手术器械的医疗箱。                                   # TODO RMC14 extended description with instructions for treating internal bleeds once those are added
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Storage/surgical_case.rsi
    layers:
    - state: surgical_case_base
    - state: surgical_case_open
      map: ["openLayer"]
      visible: false
    - state: surgical_case_closed
      map: ["closedLayer"]
      visible: false
  - type: Item
    size: Small
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,15,1
    whitelist:
      components:
      - CMScalpel
      - CMHemostat
      - CMRetractor
      - CMBoneGel
      - CMCircularSaw
      - CMCautery
      - CMUFixOVein
      tags:
      - CMSurgicalLine
      - CMBoneSaw
      - CMSynthGraft
  - type: FixedItemSizeStorage
  - type: Tag
    tags:
    - CMSurgicalCase
  - type: GenericVisualizer
    visuals:
      enum.SharedBagOpenVisuals.BagState:
        openLayer:
          Open: {visible: true}
          Closed: {visible: false}
        closedLayer:
          Open: {visible: false}
          Closed: {visible: true}
  - type: Appearance
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: PhysicalComposition
    materialComposition:
      RMCPlastic: 1000

- type: entity
  parent: CMSurgicalCase
  id: CMSurgicalCaseFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: CMScalpel
    - id: CMHemostat
    - id: CMRetractor
    - id: CMCautery
    - id: CMUFixOVein
    - id: CMCircularSaw
    - id: CMBoneGel
    - id: CMSurgicalLine
    - id: CMSynthGraft

- type: entity
  parent: CMSurgicalCase
  id: RMCSurgicalCaseRCM
  name: RCM外科手术箱
  description: 一种供皇家皇冠海军陆战队使用的改进型外科手术箱，可容纳更多工具。
  suffix: RCM
  components:
  - type: Storage
    grid:
    - 0,0,9,1 # 5 slots

- type: entity
  parent: RMCSurgicalCaseRCM
  id: RMCSurgicalCaseRCMFilled # TODO RMC14 unique sprite
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: CMScalpel
    - id: CMHemostat
    - id: CMRetractor
    - id: CMSurgicalLine
    - id: CMSynthGraft
