- type: entity
  parent: BaseItem
  id: CMBaseDefibrillator
  name: 急救除颤器
  description: 一种手持式急救除颤器，用于使发生心室颤动的患者恢复心律。可选择性地让人起死回生。
  abstract: true
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/defib.rsi
    layers:
    - state: defib
    - state: defib_on
      map: ["enum.ToggleableVisuals.Layer"]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          true: {visible: true}
          false: {visible: false}
  - type: Item
    size: Normal
    sprite: _RMC14/Objects/Medical/defib.rsi
    heldPrefix: defib
  - type: Speech
    speechVerb: Robotic
  - type: ItemToggle
    soundActivate:
      path: /Audio/_RMC14/Medical/defib_SafetyOn.ogg
    soundDeactivate:
      path: /Audio/_RMC14/Medical/defib_safetyOff.ogg
  - type: Defibrillator
    zapDelay: 0
    doAfterDuration: 4
    allowDoAfterMovement: false
    canDefibCrit: false
    rmcZapHeal:
    - Brute: -12
    - Burn: -12
    - Toxin: -12
    - Genetic: -12
    zapHeal:
      types:
        Asphyxiation: -200
        Bloodloss: -200
    zapSound:
      path: /Audio/_RMC14/Medical/defib_release.ogg
      params:
        volume: -6
    chargeSound:
      path: /Audio/_RMC14/Medical/defib_charge.ogg
      params:
        volume: -8
    failureSound:
      path: /Audio/_RMC14/Medical/defib_failed.ogg
      params:
        volume: -6
    successSound:
      path: /Audio/_RMC14/Medical/defib_success.ogg
      params:
        volume: -6
    readySound:
      path: /Audio/_RMC14/Medical/defib_ready.ogg
      params:
        volume: -6
    zapDamage: 0
  - type: DoAfter
  - type: UseDelay
  - type: StaticPrice
    price: 100
  - type: GuideHelp
    guides:
    - MedicalDoctor
  - type: RequiresSkill
    skills:
      RMCSkillMedical: 2
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  id: CMDefibrillator
  parent: [CMBaseDefibrillator, RMCPowerCellSlotUnremovable]
  suffix: RMC14
  components:
  - type: PowerCellDraw
    enabled: false
    useCharge: 66
  - type: RMCPowerUsageDisplay
  - type: UseOnSynthBlocked
    whitelist:
      components:
      - Marine

- type: entity
  id: CMDefibrillatorEmpty
  parent: CMDefibrillator
  suffix: RMC14, Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

- type: entity
  parent: CMBaseDefibrillator
  id: CMDefibrillatorInfinite
  suffix: RMC14, Infinite

- type: entity
  id: RMCDefibrillatorCompact
  parent: CMDefibrillator
  name: 自动体外除颤器
  description: 此款除颤器与标准 Lifepak 相比充电容量较小，但体积更小，使用更快捷。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/compact_defib.rsi
  - type: Item
    sprite: _RMC14/Objects/Medical/compact_defib.rsi
    size: Small
  - type: PowerCellDraw
    useCharge: 350
  # cmu edit start: AEDs analyze, talk the user through the shock and pick their own energy
  - type: CMUDefibCharge
    fixed: true
  - type: CMUDefibVoice
    automated: true
    shockAdvisedSound:
      path: /Audio/CMU14/Medical/MedicalDevices/AED/shockadvised.ogg
      params:
        volume: -6
        maxDistance: 6
    noShockAdvisedSound:
      path: /Audio/CMU14/Medical/MedicalDevices/AED/noshockadvised.ogg
      params:
        volume: -6
        maxDistance: 6
    standClearSound:
      path: /Audio/CMU14/Medical/MedicalDevices/AED/standclear_pushtoshock.ogg
      params:
        volume: -6
        maxDistance: 6
    standClearBeforeShock: 2.6
  - type: GuideHelp
    guides:
    - CMUGuideDefibrillators
    - MedicalDoctor
  - type: Defibrillator
    chargeSound:
      path: /Audio/CMU14/Medical/MedicalDevices/AED/charging.ogg
      params:
        volume: -10
        maxDistance: 6
    zapSound:
      path: /Audio/CMU14/Medical/MedicalDevices/AED/shock.ogg
      params:
        volume: -6
        maxDistance: 6
    successSound:
      path: /Audio/CMU14/Medical/MedicalDevices/AED/ifnopulsepushanalyze.ogg
      params:
        volume: -6
        maxDistance: 6
    readySound:
      path: /Audio/CMU14/Medical/MedicalDevices/AED/heartrate_AEDBeepLoopable.ogg
      params:
        volume: -6
        maxDistance: 6
  # cmu edit end

- type: entity
  id: CMUDefibrillatorCompactSynth
  parent: RMCDefibrillatorCompact
  name: 高级自动体外除颤器
  description: 普通自动体外除颤器的改良版本，它使用一种实验性电池来保持其紧凑尺寸，同时仍能比传统紧凑型除颤器储存多得多的电量。遗憾的是，由于该技术仍处于早期阶段，其内部金属密度极高且十分沉重，只有合成人才能较为合理地携带并使用该设备。
  components:
  - type: PowerCellDraw
    useCharge: 132
  - type: WhitelistPickupBy
    whitelist:
      components:
      - Synth
  - type: RMCSynthItemRestriction

# TODO RMC14: synth reset key sprites currently all use a makeshift_key placeholder.
# Replace them with original art that does not include Alien media logos.
- type: entity
  parent: [CMBaseDefibrillator, RMCPowerCellSlotUnremovable]
  id: RMCSynthResetKey
  name: We-Yu 合成体重置钥匙
  description: 该设备可以修复合成体的重大故障或程序错误，并且能够重启遭遇严重故障的合成体。使用后必须重新充电。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/synth_reset_key.rsi
    layers:
    - state: reset_key
    - state: reset_key_on
      map: ["enum.ToggleableVisuals.Layer"]
      visible: false
  - type: PowerCellDraw
    enabled: false
    useCharge: 1000
  - type: RMCPowerUsageDisplay
  - type: RequiresSkill
    skills:
      RMCSkillEngineer: 1
  - type: ItemToggle
    soundActivate:
      path: /Audio/_RMC14/Machines/click.ogg
    soundDeactivate:
      path: /Audio/_RMC14/Machines/click.ogg
  - type: Defibrillator
    zapSound:
      path: /Audio/_RMC14/Medical/reset_key_release.ogg
      params:
        volume: -6
    chargeSound:
      path: /Audio/_RMC14/Medical/reset_key_powerup.ogg
      params:
        volume: -8
    failureSound:
      path: /Audio/_RMC14/Medical/reset_key_shortbeep.ogg
      params:
        volume: -6
    successSound:
      path: /Audio/_RMC14/Medical/reset_key_boot_on.ogg
      params:
        volume: -6
  - type: UseOnSynthBlocked
    reversed: true
    popup: rmc-species-synth-reset-key-invalid
    whitelist:
      components:
      - Marine
  - type: SynthRepairer
  - type: Item
    size: Small
    sprite: _RMC14/Objects/Devices/synth_reset_key.rsi
    heldPrefix:
  - type: Tag
    tags:
    - RMCSynthResetKey

- type: entity
