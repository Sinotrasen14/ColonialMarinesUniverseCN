- type: entity
  parent: BaseStorageItem
  id: CMFirstAidKit
  name: 急救包
  description: 这是一个用于处理严重小伤的急救医疗包。受过医疗训练后，你可以把它装进背包。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/first_aid_kits.rsi
    layers:
    - state: firstaid
    - state: kit_empty
      map: ["openLayer"]
      visible: false
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,13,1 # 7 slots
    whitelist:
      tags:
      - CMMedicalUpgradeKit
      - DiscreteHealthAnalyzer
      - Dropper
      - Pill
      - PillPacket
      - Bottle
      - Syringe
      - PillCanister
      - CMTraumaKit
      - CMBurnKit
      - Ointment
      - CMOintment
      - Brutepack
      - Bloodpack
      #      - TODO RMC14 splint
      - RMCPenlight
      - CMAutoInjector
      - RMCSyringeCase
      - CMSurgicalLine
      - CMSynthGraft
      - CMRollerItem
      - BodyBag
      - Hypospray
      - CMBloodPack
      - CMSurgicalCase
      components:
      - Hypospray
  - type: Item
    size: Normal
    sprite: _RMC14/Objects/Medical/first_aid_kits.rsi
    heldPrefix: firstaid
  - type: Tag
    tags:
    - CMFirstAidKit
  - type: GenericVisualizer
    visuals:
      enum.SharedBagOpenVisuals.BagState:
        openLayer:
          Open: {visible: true}
          Closed: {visible: false}
  - type: Appearance
  - type: IgnoreContentsSize
    items:
      tags:
      - CMMedicalUpgradeKit
      - PillPacket
      - PillCanister
      - CMSurgicalCase
      - RMCSyringeCase
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: StorageNestedOpenSkillRequired
    skills:
      all:
        RMCSkillMedical: 2
  - type: PhysicalComposition
    materialComposition:
      RMCPlastic: 2000

