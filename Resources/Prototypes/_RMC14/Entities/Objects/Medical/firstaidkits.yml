- type: entity
  parent: CMFirstAidKit
  id: CMBurnAidKit
  name: 火灾急救包
  description: 这是一个应急医疗包，用于运输机弹药库突然自燃焚毁时。经过医疗训练后，你可以把它装进背包。
  components:
  - type: Sprite
    layers:
    - state: firefirstaid
    - state: kit_empty
      map: ["openLayer"]
      visible: false
  - type: Item
    heldPrefix: firefirstaid

- type: entity
  parent: CMBurnAidKit
  id: CMBurnAidKitFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: CMHealthAnalyzer
    - id: CMOintment10
      amount: 2
    - id: CMKelotaneAutoInjector
      amount: 3
#    - id: CMPainStopAutoInjectorNoSkill

