- type: entity
  abstract: true
  parent: BaseItem
  id: CMAutoInjectorBase
  name: 自动注射器
  description: 一种自动注射器。
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/auto_injectors.rsi
    layers:
    - state: autoinjector
    - state: autoinjector1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    size: Small
    sprite:
    inhandVisuals: {}
  - type: Hypospray
    solutionName: pen
    injectSound: /Audio/_RMC14/Medical/hypospray.ogg
    transferAmount: 15
    injectOnly: true
    onlyAffectsMobs: true
    canContainerDraw: false
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 45
  - type: ExaminableSolution
    solution: pen
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: autoinjector
    emptySpriteName: autoinjector
    changeColor: true
  - type: Appearance
  - type: Tag
    tags:
    - CMAutoInjector
  - type: UseDelay
    delay: 0.333
  - type: IconLabel
    textColor: White
    storedOffset: -12, 12
  - type: RMCSmartFridgeInsertable
  - type: PhysicalComposition
    materialComposition:
      RMCPlastic: 300
  - type: SpaceGarbage
  - type: StaticPrice
    price: 75
  - type: TrashOnSolutionEmpty
    solution: pen

- type: entity
  parent: CMAutoInjectorBase
  id: CMAutoInjector
  abstract: true
  components:
  - type: MedicallyUnskilledDoAfter
  - type: CMRefillableSolution
    solution: pen
    reagents: {}

- type: entity
  parent: CMAutoInjector
  id: CMEmergencyAutoInjector
  name: 应急自动注射器（注意）
  description: 一种装有特殊化学药剂混合物的自动注射器，用于危及生命的情况。无需任何培训即可使用。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/emergency_auto_injector.rsi
    layers:
    - state: autoinjector
    - state: autoinjector1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite:
  - type: Hypospray
    transferAmount: 58 # TODO RMC14 77
    injectSound: /Audio/_RMC14/Medical/air_release.ogg
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 58 # TODO RMC14 77
        reagents:
        - ReagentId: CMBicaridine
          Quantity: 29
        - ReagentId: CMKelotane
          Quantity: 29
#        - ReagentId: CMOxycodone # TODO RMC14 oxycodone
#          Quantity: 19
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
  - type: MedicallyUnskilledDoAfter
    min: 0
    doAfter: 0
  - type: IconLabel
    labelTextLocId: rmc-emergency-medicine-container-label-text

