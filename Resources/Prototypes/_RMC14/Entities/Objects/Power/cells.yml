- type: entity
  parent: BaseItem
  id: RMCPowerCell
  name: 动力电池
  description: 一种可充电的电化学动力电池。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Power/cells.rsi
    layers:
    - map: ["enum.PowerCellVisualLayers.Base"]
      state: cell
    - map: ["enum.PowerCellVisualLayers.Unshaded"]
      state: o2
      shader: unshaded
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: PowerCell
  - type: Appearance
  - type: Riggable
  - type: Tag
    tags:
    - PowerCell
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 700
      CMGlass: 50
  - type: StaticPrice
    price: 1.1

- type: entity
  parent: RMCPowerCell
  id: RMCPowerCellCrap
  name: 维-尤可充电迷你电池
  description: 廉价、一次性的电池，由维-尤公司提供。加入“可充电”功能只是为了更好推销给那些一心要“用到它彻底散架”的独立殖民者，这是边疆地区的一种普遍心态。
  components:
  - type: Sprite
    layers:
    - map: ["enum.PowerCellVisualLayers.Base"]
      state: mini-cell
    - map: ["enum.PowerCellVisualLayers.Unshaded"]
      state: o2
      shader: unshaded
  - type: Battery
    maxCharge: 500
    startingCharge: 500
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 700
      CMGlass: 40

- type: entity
  parent: RMCPowerCellCrap
