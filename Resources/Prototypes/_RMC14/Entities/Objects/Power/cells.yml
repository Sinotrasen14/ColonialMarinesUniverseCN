- type: entity
  parent: RMCPowerCell
  id: RMCPowerCellSmartgun
  name: 智能枪 DV9 电池
  description: "标准配发的9伏锂干电池，在UNMC中最常用于为智能枪供电。根据手册，一节电池最多可支持50000发，并直接插入智能枪的电源插口，而该插口仅兼容此类电池。各种辅助模式通常会使可支持的发数远低于此。虽然这种电池与大多数标准电气系统不兼容，但在紧急情况下可用普通充电器充电。UNMC的智能枪手常常会十分珍视地保管着它们。"
  components:
  - type: Sprite
    layers:
    - map: ["enum.PowerCellVisualLayers.Base"]
      state: smartguncell
  - type: Battery
    maxCharge: 10000
    startingCharge: 10000
  - type: SmartGunBattery
  - type: PhysicalComposition
    materialComposition: {}

- type: entity
  id: RMCPowerCellSlot
  abstract: true
  components:
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot {}
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: RMCPowerCell

- type: entity
  parent: RMCPowerCellSlot
  id: RMCPowerCellSlotUnremovable
