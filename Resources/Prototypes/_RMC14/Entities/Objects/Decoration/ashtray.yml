- type: entity
  parent: Ashtray
  id: RMCAshtray
  name: 塑料烟灰缸
  description: 便宜的塑料烟灰缸。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Decoration/ashtray.rsi
    layers:
    - state: icon-0
      map: ["enum.StorageFillLayers.Fill"]
  - type: StorageFillVisualizer
    fillBaseName: icon
    maxFillLevels: 2
  - type: ItemCounter
    layerStates: [] # StorageFillVisualizer replaces the inherited ashtray layers.
  - type: PhysicalComposition
    materialComposition: # "Plastic" ¯\_(ツ)_/¯
      CMSteel: 30
      CMGlass: 30

- type: entity
  parent: RMCAshtray
  id: RMCAshtrayBronze
  name: 青铜烟灰缸
  description: 厚重的青铜烟灰缸。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Decoration/ashtray-br.rsi
    layers:
    - state: icon-0
      map: ["enum.StorageFillLayers.Fill"]
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 80

- type: entity
  parent: RMCAshtray
  id: RMCAshtrayGlass
  name: 玻璃烟灰缸
  description: 玻璃烟灰缸。看起来很易碎。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Decoration/ashtray-gl.rsi
    layers:
    - state: icon-0
      map: ["enum.StorageFillLayers.Fill"]
  - type: PhysicalComposition
    materialComposition:
      CMGlass: 60
