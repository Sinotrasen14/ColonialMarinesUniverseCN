- type: entity
  parent: BaseItem
  id: RMCIntelDetector
  name: 数据探测器
  description: 一种用于探测可能有助于情报收集的物体的装置。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Tools/intel_detector.rsi
    layers:
    - state: datadetector
      map: ["base"]
    state: detector
  - type: Item
    size: Normal
  - type: Clothing
    slots:
    - suitstorage
    - belt
  - type: IntelDetector
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.IntelDetectorLayer.State:
        base:
          true: {state: datadetector_on_0}
          false: {state: datadetector}
  - type: Tag
    tags:
    - RMCDetector
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
