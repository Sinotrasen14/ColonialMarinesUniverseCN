# Welding fuel amounts are multiplied by 2.5 from 13 until we make them work exactly the same
- type: entity
  parent: [BaseItem, RMCBaseMeleeWeapon]
  id: RMCWelderBase
  name: 喷灯
  description: "只要有燃料，它就能熔化任何东西，别忘了戴护目镜！"
  abstract: true
  components:
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Items/welder_drop.ogg
      params:
        volume: -4
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/welder_drop.ogg
      params:
        volume: -4
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_RMC14/Handling/weldingtool_pickup.ogg
      params:
        volume: -4
  - type: Sprite
    sprite: _RMC14/Objects/Tools/welder.rsi
    layers:
    - state: icon
      map: ["enum.ToggleableVisuals.Enabled"]
    - state: welder_on
      map: ["enum.ToggleableVisuals.Layer"]
      visible: false
      shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Enabled:
          true: {visible: false}
          false: {visible: true}
        enum.ToggleableVisuals.Layer:
          true: {visible: true}
          false: {visible: false}
  - type: Item
    size: Small
    sprite: _RMC14/Objects/Tools/welder.rsi
  - type: ItemToggle
    predictable: false
    soundActivate:
      path: /Audio/_RMC14/Handling/weldingtool_on.ogg
    soundDeactivate:
      path: /Audio/_RMC14/Handling/weldingtool_off.ogg
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -12
    deactivatedSoundOnHitNoDamage:
      collection: MetalThud
    activatedDamage:
      types:
        Heat: 15
  - type: ItemToggleSize
    activatedSize: Large
  - type: ItemToggleHot
  - type: ComponentToggler
    components:
    - type: DisarmMalus
      malus: 0.6
  - type: ToggleableVisuals
    spriteLayer: on
    inhandVisuals:
      left:
      - state: inhand-left-on
        shader: unshaded
      right:
      - state: inhand-right-on
        shader: unshaded
  - type: SolutionContainerManager
    solutions:
      welder:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 100
        maxVol: 100
  - type: UseDelay
  - type: MeleeWeapon
    wideAnimationRotation: -90
    damage:
      types:
        Blunt: 12
    soundHit:
      collection: GenericHit
  - type: RefillableSolution
    solution: welder
  - type: Tool
    useSound:
      collection: Welder
    qualities: [Welding]
  - type: Welder
    fuelConsumption: 0.06 # TODO RMC14 change this when welders are fixed
    fuelLitCost: 0
  - type: PointLight
    enabled: false
    radius: 1.5
    color: orange
    netsync: false
  - type: ItemTogglePointLight
  - type: Appearance
  - type: IgnitionSource
    temperature: 700
  - type: Blowtorch
  - type: CMSurgeryTool
  - type: CMCautery
  - type: CMUImprovisedSurgeryTool
    delayMultiplier: 1.4
    mishapChance: 0.08
    mishapDamageType: Heat
    mishapDamageAmount: 4
  - type: Clothing
    quickEquip: false
    slots:
    - Suitstorage
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 70
      CMGlass: 30
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  parent: RMCWelderBase
  id: CMWelder
  components:
  - type: RequiresEyeProtection
  - type: SolutionContainerManager
    solutions:
      welder:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 100
        maxVol: 100 # TODO RMC14 40 when welders are fixed

- type: entity
  parent: CMWelder
  id: RMCWelderEmpty # for autolathe
  suffix: Empty
  components:
  - type: RequiresEyeProtection
  - type: SolutionContainerManager
    solutions:
      welder:
        reagents: []
        maxVol: 100 # TODO RMC14 40 when welders are fixed

- type: entity
  parent: RMCWelderBase
  id: RMCWelderAdmin
  name: 管理员喷灯
  description: 只要燃料充足，它能熔化任何东西，别管你的护目镜了！
  suffix: Admin, DO NOT MAP
  components:
  - type: SolutionContainerManager
    solutions:
      welder:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 500
        maxVol: 500

- type: entity
  parent: RMCWelderBase
  id: CMWelderSmall
  name: ME3 手持焊枪
  description: 一种紧凑的手持焊枪，供海军陆战队在战场上执行切割和焊接任务。由于体积小且强度低，其功能与全尺寸的技师用喷灯相比十分有限。
  components:
  - type: RequiresEyeProtection # CMU14
  - type: Sprite
    sprite: _RMC14/Objects/Tools/welder_hand.rsi
  - type: Item
    sprite: _RMC14/Objects/Tools/welder_hand.rsi
  - type: SolutionContainerManager
    solutions:
      welder:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 12.5
        maxVol: 12.5 # TODO RMC14 5 when welders are fixed

- type: entity
  parent: RMCWelderBase
  id: RMCWelderIndustrial
  name: 工业喷灯
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Tools/welder_industrial.rsi
    layers:
    - state: icon
      map: ["enum.ToggleableVisuals.Enabled"]
    - state: welder_on
      map: ["enum.ToggleableVisuals.Layer"]
      visible: false
      shader: unshaded
  - type: Item
    sprite: _RMC14/Objects/Tools/welder_industrial.rsi
  - type: RequiresEyeProtection
  - type: SolutionContainerManager
    solutions:
      welder:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 150
        maxVol: 150 # TODO RMC14 60 when welders are fixed
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 70
      CMGlass: 60

- type: entity
  parent: RMCWelderBase
  id: RMCWelderPVE
  name: 改装的喷灯
  description: 标准喷灯的“更先进”版本，这个喷灯上固定了一个用于保护眼睛的焊接护罩。看起来这个护目罩是从标准 ME3 手持焊接器上扯下来的，然后被粗糙地装了上去。
  suffix: Eye Protection
  components:
  - type: SolutionContainerManager
    solutions:
      welder:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 100
        maxVol: 100 # TODO RMC14 40 when welders are fixed

- type: entity
  parent: RMCWelderIndustrial
  id: RMCWelderExperimental
  name: 实验性焊接器
  description: 合成级实验性焊接器，配有紧凑型燃料回收器。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Tools/welder_industrial.rsi
  - type: Item
    sprite: _RMC14/Objects/Tools/welder_industrial.rsi
  - type: SolutionContainerManager
    solutions:
      welder:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 200
        maxVol: 200
  - type: RMCSelfRechargingSolution
    solutionId: welder
    reagent: WeldingFuel
    rechargeAmount: 1
    rechargeEvery: 1
  - type: RMCSynthItemRestriction
    checkPickup: false
