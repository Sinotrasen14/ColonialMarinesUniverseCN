- type: entity
  parent: BaseItem
  name: 紧凑型钉枪
  id: RMCNailgunCompact
  description: 一种木工工具，用于将钉子钉入坚硬表面。由于钉子周围缺少气体密封，它无法以攻击方式发射钉子，这意味着它无法积聚发射所需的压力。
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/nailgun_compact.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-4
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/nailgun_compact.rsi
    slots:
    - suitStorage
    - Back
    quickEquip: false
  - type: AmmoCounter
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Item
    size: Small
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 杂志
        startingItem: RMCMagazineSMGNailgun
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineSMGNailgun
  - type: Nailgun
  - type: MagazineAmmoProvider
    autoEject: true
  - type: RMCAmmoEject
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: AltFireMelee
  - type: MeleeWeapon
    resetOnHandSelected: false
    attackRate: 1
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: GenericHit
  - type: EmitSoundOnPickup
    sound:
      collection: RMCEquipGun
      params:
        volume: -6
  - type: EmitSoundOnDrop
    sound:
      collection: RMCRustleGun
      params:
        volume: -4
  - type: EmitSoundOnLand
    sound:
      collection: RMCRustleGun
      params:
        volume: -4
  - type: UsableWhileDevoured
    canUnequip: true
  - type: Tag
    tags:
    - RMCNailgunCompact

- type: entity
  parent: RMCNailgunCompact
  name: 战术紧凑型钉枪
  id: RMCNailgunTactical
  description: 一种木工工具，用于将钉子钉入坚硬的表面。这把是军用级，橄榄绿且战术风十足。不能将钉子作为投射物发射。
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/nailgun_tactical.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/nailgun_tactical.rsi
  - type: Nailgun
    materialPerRepair: 2
  - type: Tag
    tags:
    - RMCNailgunTactical

- type: Tag
  id: RMCNailgunCompact

- type: Tag
  id: RMCNailgunTactical
