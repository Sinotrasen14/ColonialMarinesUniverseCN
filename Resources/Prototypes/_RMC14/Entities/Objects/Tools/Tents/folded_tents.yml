# Standard Tents
- type: entity
  parent: BaseItem
  id: RMCTentUNMCStandardFolded
  name: 折叠式野战帐篷
  description: 标准野战帐篷。这一款只是通用版本。在合适的位置展开，营造微型前沿作战基地的氛围。入口朝南。
  components:
  - type: Item
    size: Huge
  - type: Sprite
    sprite: _RMC14/Objects/Tents/folded_tents.rsi
    layers:
    - state: base_tent
  - type: RMCDeployable
      # As an example all fields are listed here even if their values match the default value
    deployTime: 10
    collapseTime: 10
    deployArea: !type:PhysShapeAabb
      bounds: "-0.4,0.6,1.4,4.4"   # The non-perfect rectangle allows the tent to be placed close to the walls
    collapseToolPrototype: CMEntrenchingTool
    areaBlockedCheck: true
    failIfNotSurface: true
    deploySetups:
    - prototype: RMCTentUNMCStandard
      neverRedeployableSetup: false
      mode: ReactiveParental
      anchor: true
      offset: 0.2, 0
      angle: 0

- type: entity
  parent: RMCTentUNMCStandardFolded
  id: RMCTentUNMCBigFolded
  name: 折叠的大帐篷
  description: 标准野战帐篷。这只是通用的大型版本。在合适的地点展开，营造微型前沿作战基地的氛围。入口朝南。
  components:
  - type: RMCDeployable
    deployTime: 10
    collapseTime: 10
    deployArea: !type:PhysShapeAabb
      bounds: "-0.4,0.6,2.1,4.4"   # The non-perfect rectangle allows the tent to be placed close to the walls
    collapseToolPrototype: CMEntrenchingTool
    areaBlockedCheck: true
    failIfNotSurface: true
    deploySetups:
    - prototype: RMCTentUNMCStandard
      neverRedeployableSetup: false
      mode: ReactiveParental
      anchor: true
      offset: 0.2, 0
      angle: 0

- type: entity
  parent: RMCTentUNMCStandardFolded
  id: AU14TentBigFoldedSurgical
  name: 折叠手术帐篷
  description: 一座大型野战手术帐篷。这一顶配备了先进的野战手术设施。入口朝南。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Tents/folded_tents.rsi
    layers:
    - state: base_tent
    - state: med_base
  - type: RMCDeployable
    deployTime: 10
    collapseTime: 10
    deployArea: !type:PhysShapeAabb
      bounds: "-0.4,0.6,2.1,4.4" # The non-perfect rectangle allows the tent to be placed close to the walls
    collapseToolPrototype: CMEntrenchingTool
    areaBlockedCheck: true
    failIfNotSurface: true
    deploySetups:
    - prototype: AU14TentBigMedical
      neverRedeployableSetup: false
      mode: ReactiveParental
      anchor: true
      offset: 0, 0
      angle: 0
    - prototype: AU14VendorBloodFieldPowered
      mode: Reactive
      offset: -1, 0.5
    - prototype: AU14IVFoldable
      mode: Reactive
      offset: 0, 0.5
    - prototype: RMCTableBrown
      mode: Reactive
      offset: -1, -0.5
    - prototype: RMCTableBrown
      mode: Reactive
      offset: -1, -1.5
    - prototype: RMCTableBrown
      mode: Reactive
      anchor: false
      offset: 1, 0.5
    - prototype: CMSurgicalCaseFilled
      anchor: false
      offset: 1, 0.5
    - prototype: CMPortableSurgicalBed
      anchor: false
      offset: 1, -0.5

