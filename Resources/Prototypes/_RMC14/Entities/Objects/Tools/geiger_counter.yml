- type: entity
  parent: GeigerCounter
  id: RMCGeigerCounter
  name: 盖革计数器
  description: 一种用于检测辐射的手持工具，以希沃特为计量单位。作为化生放核应急人员和核工程师的常用装备，该型号似乎由维兰德-汤谷公司制造。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Tools/geiger_counter.rsi
    layers:
    - state: geiger_base
    - state: geiger_on_idle
      map: ["enum.GeigerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Item
    sprite: _RMC14/Objects/Tools/geiger_counter.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.GeigerVisuals.IsEnabled:
        GeigerLayers.Screen:
          true: {visible: true}
          false: {visible: false}
      enum.GeigerVisuals.DangerLevel:
        GeigerLayers.Screen:
          None: {state: geiger_on_idle}
          Low: {state: geiger_on_low}
          Med: {state: geiger_on_med}
          High: {state: geiger_on_high}
          Extreme: {state: geiger_on_ext}
  - type: PhysicalComposition
    materialComposition: {}
