- type: entity
  abstract: true
  parent: BaseItem
  id: CMPackFlareBase
  name: M94标记照明弹包
  description: 一包八枚M94标记照明弹。由海军陆战队士兵携带，用于照亮普通TNR肩灯无法照到的黑暗区域。
  components:
  - type: Item
    size: Normal
  - type: Tag
    tags:
    - CMFlarePack
  - type: CMItemSlots
    count: 8
    slot:
      name: 弗莱尔
      whitelist:
        tags:
        - RMCFlare
  - type: Sprite
    sprite: _RMC14/Objects/Storage/boxes.rsi
    layers:
    - state: m94_e
      map: ["emptyLayer"]
    - state: m94
      map: ["fullLayer"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CMItemSlotsLayers.Fill:
        fullLayer:
          Empty: {visible: false}
          Low: {visible: true}
          Medium: {visible: true}
          High: {visible: true}
          Full: {visible: true}
        emptyLayer:
          Empty: {visible: true}
          Low: {visible: false}
          Medium: {visible: false}
          High: {visible: false}
          Full: {visible: false}

- type: entity
  parent: CMPackFlareBase
  id: CMPackFlare
  suffix: Filled
  components:
  - type: CMItemSlots
    startingItem: CMFlare

