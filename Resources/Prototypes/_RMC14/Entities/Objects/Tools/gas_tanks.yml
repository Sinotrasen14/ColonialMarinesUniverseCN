# Gas Tanks /obj/item/tank/oxygen  # Base Gas Tank code/game/objects/items/tanks/tanks.dm

# for future needs
- type: entity
  abstract: true
  parent: GasTankBase
  id: CMGasTankBase
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: integrity-unshaded-0
      sprite: Objects/Tanks/generic.rsi
      map: ["enum.MaxPressureVisualLayers.BaseUnshaded"]
      shader: unshaded
      visible: false
    - state: mask
      sprite: Objects/Tanks/generic.rsi
      map: ["enum.MaxPressureVisualLayers.Base"]
      visible: false
  - type: PhysicalComposition
    materialComposition: {}

