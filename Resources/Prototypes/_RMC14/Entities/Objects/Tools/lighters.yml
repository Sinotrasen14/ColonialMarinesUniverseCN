- type: entity
  abstract: true
  parent: FlippoLighter
  id: RMCLighterBase
  components:
  - type: Item
    size: Tiny
    sprite: Objects/Tools/lighters.rsi
  - type: Clothing
    quickEquip: false
    slots:
    - suitstorage
  - type: RMCLighter
  - type: ItemTogglePointLight

- type: entity
  abstract: true
  parent: CheapLighter
  id: RMCLighterCheapBase
  components:
  - type: Item
    size: Tiny
    sprite: _RMC14/Objects/Tools/Lighters/basic.rsi
  - type: Clothing
    quickEquip: false
    slots:
    - suitstorage
  - type: RMCLighter
  - type: ItemTogglePointLight

- type: entity
  name: Zippo打火机
  description: 一款精致的钢制Zippo打火机。以时尚的方式点燃。
  parent: RMCLighterBase
  id: RMCZippo
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Tools/Lighters/zippo.rsi
    layers:
    - state: closed
      map: ["base"]
    - state: open
      map: ["top"]
      visible: false
    - state: open
      map: ["open"]
      visible: false
    - state: lighter_flame
      map: ["flame"]
      visible: false
      shader: unshaded
  - type: Item
    size: Tiny
    sprite: _RMC14/Objects/Tools/Lighters/zippo.rsi
  - type: Clothing
    quickEquip: false
    slots:
    - suitstorage
  - type: RMCLighter
  - type: HelmetAccessory
    rsi:
      sprite: _RMC14/Objects/Clothing/HelmetGarb/Smoking/Zippos/zippo.rsi
      state: helmet
  - type: ToggleableVisuals
    spriteLayer: lighter_flame
    inhandVisuals:
      left:
      - state: inhand-left-flame
        shader: unshaded
      right:
      - state: inhand-right-flame
        shader: unshaded

- type: entity
  name: We-Yu 行政版 Zippo 打火机
  description: 一款以公司黑金配色点缀的卓越 Zippo 打火机。
  parent: RMCZippo
  id: RMCZippoExec
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Tools/Lighters/execzippo.rsi
  - type: HelmetAccessory
    rsi:
      sprite: _RMC14/Objects/Clothing/HelmetGarb/Smoking/Zippos/execzippo.rsi
      state: helmet

- type: entity
  name: 金色芝宝打火机
  description: 一款金色阳极氧化处理的芝宝打火机。有些浮夸，但确实很显眼。
  parent: RMCZippo
  id: RMCZippoGold
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Tools/Lighters/goldzippo.rsi
  - type: HelmetAccessory
    rsi:
      sprite: _RMC14/Objects/Clothing/HelmetGarb/Smoking/Zippos/goldzippo.rsi
      state: helmet

- type: entity
  name: 廉价打火机
  description: 一个廉价得如同免费的打火机。
  parent: RMCLighterCheapBase
  id: RMCLighter
  components:
  - type: Item
    heldPrefix:
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: lighterOnSounds
    soundDeactivate:
      collection: lighterOffSounds
  - type: Sprite
    sprite: _RMC14/Objects/Tools/Lighters/basic.rsi
    layers:
    - state: lighter_c
      map: ["base"]
    - state: lighter_c_on
      map: ["top"]
      visible: false
    - state: lighter_c_on
      map: ["open"]
      visible: false
    - state: lighter_flame
      map: ["flame"]
      visible: false
      shader: unshaded

  - type: ToggleableVisuals
    spriteLayer: lighter_flame
    inhandVisuals:
      left:
      - state: inhand-left-flame
        shader: unshaded
      right:
      - state: inhand-right-flame
        shader: unshaded
  - type: RandomSprite
    available:
    - base:
        lighter_c: ""
      top:
        lighter_c_on: ""
      open:
        lighter_c_on: ""
    - base:
        lighter_r: ""
      top:
        lighter_r_on: ""
      open:
        lighter_r_on: ""
    - base:
        lighter_g: ""
      top:
        lighter_g_on: ""
      open:
        lighter_g_on: ""
    - base:
        lighter_y: ""
      top:
        lighter_y_on: ""
      open:
        lighter_y_on: ""
    - base:
        lighter_u: ""
      top:
        lighter_u_on: ""
      open:
        lighter_u_on: ""
  - type: HelmetAccessory
    rsi:
      sprite: _RMC14/Objects/Clothing/HelmetGarb/Smoking/cheap_lighter.rsi
      state: helmet
