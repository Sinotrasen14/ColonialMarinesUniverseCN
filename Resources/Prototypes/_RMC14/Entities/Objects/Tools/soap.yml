- type: entity
  parent: BaseItem
  id: CMSoap
  name: 肥皂
  description: 一块便宜的肥皂。没有气味。
  components:
  - type: Tag
    tags:
    - Soap
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Janitorial/soap.rsi
    state: soap
  - type: Item
    sprite: Objects/Specific/Janitorial/soap.rsi
    size: Tiny
  - type: Physics
    bodyType: Dynamic
  - type: Solution
    id: soap
    solution:
      maxVol: 50
      reagents:
      - ReagentId: SoapReagent
        Quantity: 50
  - type: SolutionTransfer
    transferAmount: 10
    minTransferAmount: 1
    maxTransferAmount: 25
    canReceive: false
    canChangeTransferAmount: true
  - type: DrainableSolution
    solution: soap
  - type: DeleteOnSolutionEmpty
    solution: soap
  - type: FlavorProfile
    flavors:
    - clean
  - type: Edible
    solution: soap
  - type: BadFood
  - type: CleansForensics
  - type: Residue
    residueAdjective: residue-slippery
    residueColor: residue-green

