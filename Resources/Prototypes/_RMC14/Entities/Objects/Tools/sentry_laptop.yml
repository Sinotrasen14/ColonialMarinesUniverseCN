- type: entity
  parent: BaseItem
  id: RMCSentryLaptop
  name: 哨兵笔记本电脑
  description: 一台用于远程控制和监控哨兵枪的加固型军用笔记本电脑。可放置在桌子上以便更轻松地使用。使用安全访问调谐器将哨兵连接到笔记本电脑网络。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/sentrycomp.rsi
    layers:
    - state: sentrycomp_cl
      map: ["enum.SentryLaptopVisualLayers.Base"]
  - type: Item
    size: Normal
    sprite: _RMC14/Objects/Devices/sentrycomp.rsi
  - type: Clickable
  - type: InteractionOutline
  - type: CollisionWake
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.15,0.25,0.15"
        density: 50
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SentryLaptopVisuals.State:
        enum.SentryLaptopVisualLayers.Base:
          Closed: {state: sentrycomp_cl}
          Open: {state: sentrycomp_op}
          Active: {state: sentrycomp_on}
  - type: UserInterface
    interfaces:
      enum.SentryLaptopUiKey.Key:
        type: SentryLaptopBui
  - type: ActivatableUI
    key: enum.SentryLaptopUiKey.Key
    inHandsOnly: false
  - type: DeviceNetwork
  - type: DeviceLinkSource
    ports: [SentryControl]
  - type: SentryLaptop
  - type: UseDelay
    delay: 0.5
  - type: RequiresSkill
    skills:
      RMCSkillEngineer: 2
  - type: Tag
    tags:
    - RMCSentryLaptop

