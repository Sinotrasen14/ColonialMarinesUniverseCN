- type: entity
  abstract: true
  parent: BaseItem
  id: RMCFlagCarriableBase
  name: 旗帜
  components:
  - type: Sprite
    layers:
    - state: icon
      map: ["base"]
  - type: Item
    size: Large
  - type: Corrodible
    isCorrodible: false
  - type: Appearance
  - type: PlantableFlag
  - type: GenericVisualizer
    visuals:
      enum.PlantableFlagVisuals.Planted:
        base:
          true: {state: deploy}
          false: {state: icon}

- type: entity
  parent: RMCFlagCarriableBase
  id: RMCFlagCarriableUN
  name: 联合国旗帜
  description: "联合国旗帜。"              # This one looks ready to be planted into the ground."
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Flags/un_flag.rsi
  - type: RMCLoreExaminable
    content: rmc-lore-examinable-un-flag
    factions:
    - UNMC

- type: entity
  parent: RMCFlagCarriableBase
  id: RMCFlagCarriableUNMC
  name: UNMC旗帜
  description: "UNMC的旗帜。"              # This one looks ready to be planted into the ground."
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Flags/unmc_flag.rsi
