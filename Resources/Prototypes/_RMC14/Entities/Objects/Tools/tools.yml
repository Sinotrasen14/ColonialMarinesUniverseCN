  components:
  - type: Sprite
    sprite: _RMC14/Objects/Tools/maintenance_jack.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _RMC14/Objects/Tools/maintenance_jack.rsi
    storedRotation: 0
  - type: Clothing
    quickEquip: false
    sprite: _RMC14/Objects/Tools/maintenance_jack.rsi
    slots:
    - Back
    - Suitstorage
  - type: Tool
    qualities:
    - Prying
    - Anchoring
    - VehicleServicing
    useSound:
      path: /Audio/Items/jaws_pry.ogg
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 2
    useSound:
      path: /Audio/Items/jaws_pry.ogg
  - type: ToolTileCompatible
    delay: 0
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.8
    damage:
      types:
        Blunt: 20
        Structural: 30
    soundHit:
      collection: MetalThud
  - type: DamageImpactProfile
    melee:
      contact: Crush
      penetration: None
      energy: Medium
  - type: RMCSynthItemRestriction
    checkPickup: false
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 200

