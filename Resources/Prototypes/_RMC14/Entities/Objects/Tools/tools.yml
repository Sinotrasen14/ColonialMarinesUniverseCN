- type: entity
  parent: BaseItem
  id: MaintenanceJack
  name: 车辆维修千斤顶
  description: 用于维修装甲车辆的重型硬点千斤顶。能在撬棍无法使用的地方发挥作用。
  suffix: RMC
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Tools/maintenance_jack.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _RMC14/Objects/Tools/maintenance_jack.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Tools/maintenance_jack.rsi
    slots:
    - Suitstorage
    - Belt
  - type: Tool
    qualities:
    - VehicleServicing
    speedModifier: 1.0
  - type: PhysicalComposition
    materialComposition:
      Steel: 200
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
  - type: DamageImpactProfile
    melee:
      contact: Crush
      penetration: None
  - type: CMSurgeryTool
  - type: CMRetractor
  - type: CMBoneSetter
  - type: CMUImprovisedSurgeryTool
    delayMultiplier: 1.8
    mishapChance: 0.14
    mishapDamageType: Blunt
    mishapDamageAmount: 5
    failurePenalty: 1

