  name: 紫水晶服役奖章
  description: 一枚淡紫色奖章，授予在UNMC服役的海军陆战队员。这枚奖章及其后的奖章代表着一个历经无数次漫长而艰难的部署，却战胜了它们并从中学习的人。

- type: entity
  parent: RMCMedalBase
