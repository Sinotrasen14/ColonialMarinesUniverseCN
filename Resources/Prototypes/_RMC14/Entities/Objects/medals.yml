      sprite: _RMC14/Objects/Medals/gold.rsi
      state: equipped

- type: entity
  parent: RMCMedalGold
  id: RMCMedalGoldExceptionalHeroism
  name: 非凡英勇勋章
  description: 一枚极其罕见的金色勋章，仅由UNMC颁发。获得此类勋章是最高荣誉，因此现存数量极少。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/gold.rsi
    state: icon_co
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/gold.rsi
      state: equipped_co

- type: entity
  parent: RMCMedalGold
  id: RMCMedalHighCommandHonor
  name: UNMC最高司令部荣誉勋章
  description: 一枚星形金色勋章，仅由UNMC最高司令部授予。它并非仅凭英勇就能获得，而是由指挥当局授予，以表彰超越公认英雄主义的功绩。作为UNMC的至高荣誉，它令其他所有嘉奖黯然失色。其获得者被历史铭记，而非沦为统计数据。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/gold_star.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/gold_star.rsi
      state: equipped_co

- type: entity
  parent: RMCMedalGold
  id: RMCMedalGoldService
  name: 金色服役勋章
  description: 一枚为表彰海军陆战队队员在UNMC中服役而颁发的反光金色勋章。它代表着许多海军陆战队队员在各自岗位上成为高度合格人员所迈出的第一个重要步骤。

- type: entity
  parent: RMCMedalBase
