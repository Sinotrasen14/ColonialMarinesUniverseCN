  name: 银质服役奖章
  description: 一枚闪亮的银质奖章，授予在UNMC中服役的海军陆战队员。虽然有些常见，但它象征着某人在所属部门和技能上日益增长的专业能力以及投入的时间。

- type: entity
  parent: RMCMedalBase
