    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/emerald.rsi
      state: equipped

- type: entity
  parent: RMCMedalEmerald
  id: RMCMedalEmeraldService
  name: 翡翠服役勋章
  description: 一枚明亮的翡翠勋章，授予在UNMC中服役的海军陆战队员。翡翠勋章用于表彰海军陆战队员在其岗位上多年努力成长与学习，它是以服役勋章体现海军陆战队员职业生涯的最终奖项之一。

- type: entity
  parent: RMCMedalBase
