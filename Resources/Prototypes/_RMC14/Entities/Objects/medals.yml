  name: 红宝石服务勋章
  description: 深红色勋章，授予在UNMC中持续服役的海军陆战队员。这枚勋章象征着对同一部门和岗位的真正奉献。

- type: entity
  parent: RMCMedalBase
  id: RMCMedalAmethyst
  name: 紫水晶勋章
  description: 一枚传说中的紫水晶勋章，仅能由最高指挥部因极其特殊的情况颁发。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/amethyst.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/amethyst.rsi
      state: equipped

- type: entity
