    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/prismatic.rsi
      state: equipped

- type: entity
  parent: RMCMedalPrismatic
  id: RMCMedalPrismaticService
  name: 棱彩服役勋章
  description: 一枚多彩的棱彩勋章，授予在UNMC内服役的陆战队员。棱彩勋章传统上授予那些在自己的岗位上服役了无数年的人。此类勋章通常由副官或代表UNMC指挥部成员的参谋直接颁发，作为最终可能获得的服役勋章。

