  description: 一枚银质奖章，用于奖励表现出非凡英勇的行为。通常授予那些在队伍中脱颖而出的人，无论是在领导技能方面，还是在任务成功至关重要的行动方面。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/silver.rsi
    state: icon_co
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/silver.rsi
      state: equipped_co

- type: entity
  parent: RMCMedalSilver
