  name: 青铜服役奖章
  description: 一枚青铜奖章，授予在UNMC中服役的海军陆战队员。虽然它是最常见的奖章，却象征着某人在相应职位上迈出的最初几步。

- type: entity
  parent: RMCMedalBase
