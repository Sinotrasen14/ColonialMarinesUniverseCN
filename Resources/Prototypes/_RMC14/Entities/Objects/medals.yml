  description: 一枚深蓝色勋章，授予在UNMC内服役的海军陆战队员。此类勋章颁发给那些对自己的岗位及其成功表现出明显热情的人。

- type: entity
  parent: RMCMedalBase
  id: RMCMedalRuby
  name: 红宝石勋章
  description: 一枚崇高的红宝石勋章，仅在特殊情况下才能由将军颁发。
