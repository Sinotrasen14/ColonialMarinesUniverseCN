- type: entity
  parent: BaseItem
  id: RMCDropshipMaintsComputer
  name: 运输机维护计算机
  description: 一台打开着的运输机维护计算机，不过它似乎处于关闭状态。技术人员和飞行员用它来查找运输机上损坏或发生故障的系统。它有用于不同系统的各种接口。
  suffix: Open
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/dropship_maint_comp.rsi
    layers:
    - state: hangar_comp
      map: ["enum.ToggleableVisuals.Enabled"]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Enabled:
          true: {state: hangar_comp}
          false: {state: hangar_comp_open}
  - type: Item
    size: Large
    sprite: _RMC14/Objects/Devices/dropship_maint_comp.rsi
  - type: ItemToggle
    activated: false
  - type: Appearance

- type: entity
  parent: RMCDropshipMaintsComputer
  id: RMCDropshipMaintsComputerOpen
  name: 空投船维护计算机
  description: 一台封闭式空投船维护计算机，技术人员和飞行员用它来查明空投船出了什么问题。它配有用于不同系统的各种接口。
  suffix: Closed
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/dropship_maint_comp.rsi
    layers:
    - state: hangar_comp
      map: ["enum.ToggleableVisuals.Enabled"]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Enabled:
          true: {state: hangar_comp}
          false: {state: hangar_comp_open}
  - type: Item
    size: Large
    sprite: _RMC14/Objects/Devices/dropship_maint_comp.rsi
  - type: ItemToggle
    activated: true
  - type: Appearance
