- type: entity
  parent: BaseStructureDynamic
  id: RMCSmallFloodlight
  name: 小型泛光灯
  description: 黑暗中的一点微光。
  components:
  - type: XenoCrusherChargable
    instantDestroy: true
    passOnDestroy: true
  - type: VehicleSmashable
    minDestroyWeightClass: Light
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
  - type: Sprite
    noRot: true
    sprite: _RMC14/Objects/Misc/Lights/floodlight.rsi
    layers:
    - state: smallfloodon   # Temporary until power works.
    - state: smallflood
      visible: false
      map: ["light"]
  - type: InteractionOutline
  - type: Repairable
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: PointLight
    enabled: true
    radius: 6
    netsync: false
    energy: 2
    offset: "0, 0"
    color: "#ECFFFF"
    lightMask: ConeQuad
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetMetal1:
            min: 1
            max: 1
          CMSheetGlass1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 50
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Appearance

- type: entity
  parent: RMCSmallFloodlight
  id: RMCSmallFloodlightUnanchored
  name: 小型泛光灯
  description: 黑暗中的一点微光。
  categories: [HideSpawnMenu]
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic

- type: entity
  parent: BaseStructure
  id: RMCTallFloodlight # CMU14
  name: 高杆泛光灯
  description: 黑暗中的一束光柱。
  placement:
    mode: SnapgridCenter
  components:
  - type: VehicleSmashable
    selfDamageMultiplier: 0.25 # CMU14: unplowed light-pole impacts still damage the vehicle.
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
    flags:
    - Anchorable
  - type: Sprite
    noRot: true
    sprite: _RMC14/Objects/Misc/Lights/floodlightbig.rsi
    layers:
    - state: bigflood
    - state: bigfloodon
      visible: true
      map: ["light"]
    offset: "0.0,0.5"
    drawdepth: Mobs
  - type: Construction
    graph: RMCFloodlightBroken
    node: completed
  - type: InteractionOutline
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: PointLight
    enabled: true
    radius: 7
    netsync: false
    offset: "0,0.5"
    color: "#ECFFFF"
    lightMask: ConeQuad
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: start
  - type: Repairable
  - type: Corrodible # Repairable, not destructible.
    isCorrodible: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 50
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Appearance
  - type: ToggleableVisuals
    spriteLayer: light
  - type: RMCReactorPoweredLight
  - type: PreventAttackLightOff
  - type: RequireProjectileTarget

- type: entity
  parent: BaseStructure
  id: RMCFloodlightBroken # CMU14
  name: 高大的损坏泛光灯
  description: 一张粘贴的便条上写着“要修理，拧下面板，用撬棍撬出损坏的组件，把它焊好，添加2根电缆，然后合上面板。”
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Anchorable
    flags:
    - Anchorable
  - type: Sprite
    noRot: true
    sprite: _RMC14/Objects/Misc/Lights/floodlightbig.rsi
    state: broken
    offset: "0.0,0.5"
    drawdepth: Mobs
  - type: Construction
    graph: RMCFloodlightBroken
    node: start
  - type: InteractionOutline
  - type: Corrodible # Repairable, not destructible.
    isCorrodible: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 155
        mask:
        - MachineMask
        layer:
        - MachineLayer

# LZ Floodlights

- type: entity
  parent: BaseStructure
  id: RMCLZFloodlight
  name: 着陆灯
  description: 一种强光灯，通常安置在着陆区附近，以提供更好的能见度。这个似乎已被螺栓固定，无法移动。
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    noRot: true
    sprite: _RMC14/Objects/Misc/Lights/floodlight.rsi
    state: magical
  - type: InteractionOutline
  - type: PointLight
    enabled: true
    radius: 6
    energy: 2
    netsync: false
    color: "#ECFFFF"
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 50
        mask:
        - HighImpassable
  - type: Corrodible
    isCorrodible: false
  - type: Appearance
  - type: Eye
  - type: CMUWarshipExteriorLight # CMU14: hull floodlight switches off on red alert, see CMUWarshipAlertLightsSystem

- type: entity
  abstract: true
  id: LandingZoneLightBase
  name: 着陆灯
  description: 着陆灯，如果正在闪烁，请保持距离！
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Lights/landinglight.rsi
    layers:
    - map: ["enum.LandingLightVisuals.Off"]
      state: landingstripe
    - map: ["enum.LandingLightVisuals.On"]
      state: landingstripe0
      visible: false
  - type: Appearance
  - type: Clickable
  - type: LandingLight
  - type: PointLight
    color: "#FF1A1A"
    energy: 1
    radius: 2
    softness: 1
    offset: "0, -0.5"
    enabled: false

- type: entity
  parent: LandingZoneLightBase
  id: LandingZoneLightOne
  suffix: 1

- type: entity
  parent: LandingZoneLightBase
  id: LandingZoneLightTwo
  suffix: 2
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Lights/landinglight.rsi
    layers:
    - map: ["enum.LandingLightVisuals.Off"]
      state: landingstripe
    - map: ["enum.LandingLightVisuals.On"]
      state: landingstripe1
      visible: false
  - type: LandingLight
    onState: landingstripe1

- type: entity
  parent: LandingZoneLightBase
  id: LandingZoneLightThree
  suffix: 3
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Lights/landinglight.rsi
    layers:
    - map: ["enum.LandingLightVisuals.Off"]
      state: landingstripe
    - map: ["enum.LandingLightVisuals.On"]
      state: landingstripe2
      visible: false
  - type: LandingLight
    onState: landingstripe2

- type: entity
  parent: LandingZoneLightBase
  id: LandingZoneLightFour
  suffix: 4
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Lights/landinglight.rsi
    layers:
    - map: ["enum.LandingLightVisuals.Off"]
      state: landingstripe
    - map: ["enum.LandingLightVisuals.On"]
      state: landingstripe3
      visible: false
  - type: LandingLight
    onState: landingstripe3

- type: entity
  parent: LandingZoneLightBase
  id: LandingZoneLightStanding
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Lights/landinglight.rsi
    layers:
    - map: ["enum.LandingLightVisuals.Off"]
      state: lz_spoke_light
    - map: ["enum.LandingLightVisuals.On"]
      state: lz_spoke_light1
      visible: false
  - type: LandingLight
    onState: lz_spoke_light1
  - type: PointLight
    color: "#FF1A1A"
    energy: 1.5
    radius: 4
    softness: 1
    enabled: false

