  description: 一份经过大量涂黑的韦斯顿-山田研究摘要。它极为详细地记述了“异星生物”的咔嗒声、嘶嘶声和信息素触发机制。尝试模仿这些声音会让你的喉咙发痛，并令你毛骨悚然。
  components:
  - type: SkillPamphlet
    language: Xeno

# gives primitive language
- type: entity
