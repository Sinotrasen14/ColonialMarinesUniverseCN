- type: entity
  parent: BaseItem
  id: CMPamphlet
  name: 教学小册子
  description: 用于快速传授重要知识的小册子。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/pamphlets.rsi
    state: pamphlet_written
  - type: Item
    size: Tiny
  - type: SkillPamphlet
    whitelists:
    - popup: rmc-pamphlets-cant-use
      restrictions:
        components:
        - Marine
  - type: EmitSoundOnPickup
    sound:
      collection: RMCPaperPickup
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      collection: RMCPaperDrop
      params:
        volume: -5
  - type: EmitSoundOnLand
    sound:
      collection: RMCPaperDrop
      params:
        volume: -5
  - type: Tag
    tags:
    - RMCSkillPamphlet

