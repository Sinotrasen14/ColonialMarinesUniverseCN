# LANGUAGE / bypasses limit

#
- type: entity
  parent: CMPamphlet
  id: CMPamphletLanguage
  name: 翻译小册子
  description: 一本供懒惰的海军陆战队口译员在现场快速学习新语言使用的小册子。
  abstract: true
  components:
  - type: SkillPamphlet
    bypassLimit: true

# gives japanese language
- type: entity
  parent: CMPamphletLanguage
  id: CMPamphletLanguageJapanese
  name: 《Turedobando Yohei Adobencha Zohuken》的书页
  description: 一本卷了角的热门异世界漫画。即使你不在意剧情，带有注释的拟声词和对话也能为学习这门语言打下出乎意料的扎实基础。
  components:
  - type: SkillPamphlet
    language: Japanese

# gives chinese language
- type: entity
  parent: CMPamphletLanguage
  id: CMPamphletLanguageMandarin
  name: 《小红皮书》中的几页
  description: 一本为 SPP 工业硬件编写的、内容密集的覆膜技术手册。摸索维护规程犹如烈火试炼，但你最终会学会这套操作。
  components:
  - type: SkillPamphlet
    language: Mandarin
  # desc starts with "没有共产党就没有新中国!" but RMC14 doesnt support chinese letters :(

# gives german language
- type: entity
  parent: CMPamphletLanguage
  id: CMPamphletLanguageGerman
  name: 《99个气球》歌词翻译
  description: 一张沾满啤酒渍的卡拉OK歌词单。上面大多是20世纪流行金曲，但足以帮你在一个讲德语的采矿殖民地中周旋而不挨揍。
  components:
  - type: SkillPamphlet
    language: German

# gives spanish language
- type: entity
  parent: CMPamphletLanguage
  id: CMPamphletLanguageSpanish
  name: 拉丁美洲——快速翻译指南
  description: 一本由联合国发行的“殖民地间关系”小册子。它本意是用于维和行动，但主要还是成了海军陆战队员寻找最近酒吧的指南。
  components:
  - type: SkillPamphlet
    language: Spanish

# gives french language
- type: entity
  parent: CMPamphletLanguage
  id: CMPamphletLanguageFrench
  name: 《小王子》的折角书页
  description: 几页来自22世纪初一本时尚杂志的破烂书页。它能教你刚好够用的上流社会词汇，让你听起来有格调，或者至少像个傲慢的游客。
  components:
  - type: SkillPamphlet
    language: French

# gives russian language
- type: entity
  parent: CMPamphletLanguage
  id: CMPamphletLanguageRussian
  name: 皱巴巴的音译笔记
  description: 潦草地写在旧日记本页面上的粗粝实地笔记。在如何服从命令、打赢酒吧斗殴、向阵亡者敬酒这些音译拼写之间，页边空白处藏着足够学会基础的语法。
  components:
  - type: SkillPamphlet
    language: Russian

# gives sign language
- type: entity
  parent: CMPamphletLanguage
  id: CMPamphletLanguageSign
  name: 图解手势信号指南
  description: 一份 UNMC 覆膜指南，介绍“战术手势信号”。它涵盖了当任何声响都可能招致杀身之祸时用于协调的基本手势，还包括几个非官方手势，用来在不让指挥官听到的情况下侮辱队友。
  components:
  - type: SkillPamphlet
    language: SignLanguage


# RESTRICTED LANGUAGES


