# PENS

- type: entity
  parent: Pen
  id: CMPen
  name: 笔
  description: 这是一支普通的黑色墨水笔。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/paper.rsi
    state: pen
  - type: Item
    size: Tiny
    sprite: _RMC14/Objects/Misc/paper.rsi
    heldPrefix: pen
  - type: Clothing
    equippedPrefix: pen
    sprite: _RMC14/Objects/Misc/paper.rsi
    quickEquip: false
    slots:
    - Suitstorage
    - Ears
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 10

- type: entity
  parent: CMPen
  id: CMPenClicky # TODO RMC14 make it clicky
  name: WEYU笔
  description: 这是一支 WEYU 品牌的按动声格外清脆的黑色墨水笔。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/paper.rsi
    state: weya_pen
  - type: Item
    sprite: _RMC14/Objects/Misc/paper.rsi

- type: entity
  parent: CMPen
  id: CMPenFountain
  name: 钢笔
  description: 这款钢笔是对 AEGIS 卓越工艺与巧思的奢华见证，堪称设计与功能性的典范。饰有金色点缀与精巧机械结构，只需轻轻一转，即可在众多墨色之间迅速切换。作为精密工程的产物，钢笔内部的每个机械装置都旨在实现从一种颜色到另一种颜色的无缝、轻松过渡，成就一件兼具奢华与多功能的书写工具。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/paper.rsi
    state: fountain_pen
  - type: Item
    sprite: _RMC14/Objects/Misc/paper.rsi
  - type: RMCLoreExaminable
    content: rmc-lore-examinable-fountain-pen
