- type: entity
  parent: BaseStructure
  id: RMCPlanterBox
  name: 种植箱
  description: 根格半埋在种植箱内。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    noRot: true
    sprite: _RMC14/Structures/Furniture/planter_box.rsi
    drawdepth: FloorTiles
    state: planter_box
  - type: Appearance
  - type: Damageable
    damageModifierSet:
  - type: Injurable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -4
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: BarricadeBlock
    bidirectional: true
    blocking: 65

- type: entity
  parent: RMCPlanterBox
  id: RMCSoilNet
  name: 土壤网
  description: 科学家利用这些悬挂网在一小片地面上叠加网格以进行研究。
  components:
  - type: Sprite
    state: soil_grid
  - type: SpriteFade
