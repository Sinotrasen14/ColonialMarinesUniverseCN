- type: entity
  id: RMCAegisBox
  name: AEGIS安全箱
  description: 一个用于运输 AEGIS 设备的安全储物箱。看起来足够坚固，能承受除轨道打击以外的任何冲击。它已上锁，需要 AEGIS 身份卡才能打开。
  placement:
    mode: SnapgridCenter
  components:
  - type: WarpPoint
    follow: true
  - type: PointLight
    radius: 20
    energy: 5.0
    color: "#FFE4CEFF"
    lightMask: ConeDouble
  - type: RotatingLight
    speed: 90
  - type: Sprite
    sprite: _RMC14/Objects/secure_box.rsi
    layers:
    - state: aegis_crate
      map: ["enum.AegisCrateVisualLayers.Base"]
  - type: AegisCrate
    openSound: /Audio/_RMC14/Structures/secure_box_opening/secure_box_opening.ogg
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: aegiscrate
  - type: TacticalMapTracked
  - type: XenoMapTracked
  - type: MarineMapTracked
  - type: InteractionOutline
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - CrateMask
        layer:
        - MachineLayer
  - type: AccessReader
    access: [["CMAccessAegis"]]
  - type: AnimationPlayer
  - type: Appearance
  - type: Corrodible
    isCorrodible: false
  - type: DestroyedByExplosionType
    explosion: RMCOBXenoTunnel
  - type: Transform
    anchored: true
