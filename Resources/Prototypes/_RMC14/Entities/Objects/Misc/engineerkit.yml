- type: entity
  parent: BaseStorageItem
  id: RMCEngineerKit
  name: 工程师工具包
  description: 战斗工程工具包，旨在将电气和机械补给带入战场。接受过工程训练后，你可以将其装入背包。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/engineer_kit.rsi
    layers:
    - state: toolkit
    - state: toolkit_empty
      map: ["openLayer"]
      visible: false
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,13,1 # 7 slots
    whitelist:
      tags:
      - DoorElectronics
      - RMCCircuitboard
      - Flashlight
      - RMCWeldingGoggle
      # - TODO RMC14 RMCAnalyzer
      # - TODO RMC14 RMCDemoScanner
      # - TODO RMC14 RMCReagentScanner
      - CableCoil
      - PowerCell
      # - TODO RMC14 RMCAssembly
      # - TODO RMC14 RMCStockParts,
      - RMCExplosiveBreachingCharge
      - RMCSynthResetKey
      components:
      - TrayScanner
  - type: FixedItemSizeStorage
  - type: Item
    size: Normal
  - type: Tag
    tags:
    - RMCEngineerKit
  - type: GenericVisualizer
    visuals:
      enum.SharedBagOpenVisuals.BagState:
        openLayer:
          Open: {visible: true}
          Closed: {visible: false}
  - type: Appearance
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: StorageNestedOpenSkillRequired
    skills:
      all:
        RMCSkillEngineer: 2

- type: entity
  parent: RMCEngineerKit
  id: RMCEngineerKitRCMPVEFilled
  suffix: Filled, RCM, PVE
  components:
  - type: StorageFill
    contents:
    - id: RMCCableCoil30
    - id: CMAPCElectronics
      amount: 3
    - id: RMCPowerCellAPC
    - id: RMCPowerCellAPC
    - id: RMCExplosivePlastic
