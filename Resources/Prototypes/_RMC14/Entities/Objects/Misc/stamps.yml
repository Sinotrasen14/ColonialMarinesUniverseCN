    heldPrefix: stamp
  - type: Sprite
    sprite: _RMC14/Objects/Misc/paper.rsi
    state: stamp-def
  - type: Stamp
    stampedName: stamp-component-stamped-name-cm-default
    stampState: "paper_stamp-def"

