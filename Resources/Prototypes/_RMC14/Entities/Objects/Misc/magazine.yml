- type: entity
  parent: RMCMagazineBootsN160
  id: RMCMagazineBootsN70
  name: 《靴子！》第70期。
  description: UNMC唯一的官方杂志，标题为“陆战队70：战争的未来”。文章随后详细介绍了“陆战队70”的计划与实施，这是一个旨在帮助UNMC为2110年实现现代化的项目。

- type: entity
  parent: RMCMagazineBootsN160
  id: RMCMagazineBootsN113
  name: 《靴子！》第113期。
