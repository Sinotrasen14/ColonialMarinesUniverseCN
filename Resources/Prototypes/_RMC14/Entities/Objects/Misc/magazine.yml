  components:
  - type: RMCLoreExaminable
    content: rmc-lore-examinable-boots-113

- type: entity
  parent: RMCMagazineBootsN160
  id: RMCMagazineBootsN117
  name: 《靴子！》第117期。
  description: UNMC唯一的官方杂志，标题为“停止投罐”。该简短段落进一步解释了海军陆战队员把CN-20神经毒气当作恶作剧扔进卫生间会带来哪些危险。

- type: entity
  parent: RMCMagazineBootsN160
  id: RMCMagazineBootsN120
  name: 靴子！第120期。
  description: 唯一官方UNMC杂志，标题为“华莱士·凯利·哈尔，2136—2181”。

- type: entity
  parent: RMCMagazineBootsN160
  id: RMCMagazineBootsN125
  name: 《靴子！》第125期。
  description: UNMC唯一的官方杂志，标题写着“布拉沃小队……不只是执行前沿作战基地任务！”。尽管标题如此，文章主要由路障照片和弹药箱摆放示意图组成。

- type: entity
  parent: RMCMagazineBootsN160
  id: RMCMagazineBootsN131
  name: 《靴子！》第131期。
  description: 唯一的 UNMC 官方杂志，标题写着“禁止闷吸”。下一段详细说明了 HSDP 烟雾弹为何在长时间吸入暴露下不安全，以及缺氧为何不是一种好的嗨法。

- type: entity
  parent: RMCMagazineBootsN160
  id: RMCMagazineBootsN150
  name: 《靴子！》第150期。
  description: UNMC 唯一官方杂志，标题写着“UPP 口粮，真相”。其封面展示了一份缴获的 UPP 单兵口粮。
  components:
  - type: RMCLoreExaminable
    content: rmc-lore-examinable-boots-150

- type: entity
  parent: RMCMagazineBootsN160
  id: RMCMagazineBootsN189
  name: 《军靴！》第189期。
  description: 唯一一本 UNMC 官方杂志，标题写着“宪兵版，那些帮助海军陆战队员帮助他们自己的人！”。与你见过的每一本第189期一样，有人特意用粗俗语言和不雅图画污损了它。

