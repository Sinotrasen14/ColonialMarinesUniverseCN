- type: entity
  parent: DoorElectronics
  id: CMAirlockCircuitBoard
  name: 气闸电路板
  description: 用于气闸的电子电路板。

- type: entity
  parent: CMMiniTank
  id: RMCES11MobileFuelCanister
  name: ES-11 移动式燃料罐
  description: 用于现场维修与补给的紧凑型焊接燃料罐。

- type: entity
  parent: BaseStorageItem
  id: RMCSynthRepairKit
  name: 合成修复套件
  description: 用于合成结构修复的紧凑型现场工具与替换线缆套件。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/engineer_kit.rsi
    layers:
    - state: toolkit
    - state: toolkit_empty
      map: ["openLayer"]
      visible: false
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,11,1
    whitelist:
      tags:
      - Crowbar
      - Screwdriver
      - Wirecutter
      - Wrench
      - CableCoil
      - Multitool
      - PowerCell
      components:
      - Welder
      - PowerCell
      - TrayScanner
  - type: FixedItemSizeStorage
  - type: Item
    size: Normal
  - type: GenericVisualizer
    visuals:
      enum.SharedBagOpenVisuals.BagState:
        openLayer:
          Open: {visible: true}
          Closed: {visible: false}
  - type: Appearance

- type: entity
  parent: RMCSynthRepairKit
  id: RMCSynthRepairKitFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: CMWelder
    - id: RMCCableCoil30
    - id: CMWirecutter
    - id: CMMultitool

- type: entity
  parent: RMCSynthRepairKit
  id: RMCSynthRepairKitEliteFilled
  name: 精英合成维修包
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: RMCCableCoil30
      amount: 2
    - id: CMWirecutter
    - id: CMMultitool
    - id: CMTRayScanner
