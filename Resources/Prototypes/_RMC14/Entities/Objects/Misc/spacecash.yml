- type: Tag
  id: Currency

- type: entity
  parent: SpaceCash
  id: RMCSpaceCash
  name: 美元
  description: 十张百元美钞，由联合国财政部铸造。每张都饰有一位昔日强大星球上早已被遗忘的外交官的面孔。这些钞票不仅仅是货币，它们仿佛有生命，仿佛承载着古老历史的重量，以及那些曾掌控庞大帝国之人的评判。每张钞票上的面孔似乎都以无声的强烈注视着你，仿佛每一张都认为，只有它才应当归你所有。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/spacecash.rsi
    layers:
    - state: spacecash
      map: ["base"]
  - type: Item
    size: Tiny
    shape:
  - type: Tag
    tags:
    - Holdout
    - RMCSpaceCash
    - Currency
  - type: Stack
    stackType: Dollar
    count: 1
    baseLayer: base
    layerStates:
    - spacecash
    - spacecash_10
    - spacecash_20
    - spacecash_50
    - spacecash_100
    - spacecash_200
    - spacecash_500
    - spacecash_1000
  - type: StackLayerThreshold
    thresholds: [10, 20, 50, 100, 200, 500, 1000]
  - type: PhysicalComposition
    materialComposition:
      Dollar: 1
  - type: Appearance

- type: entity
  parent: RMCSpaceCash
  id: RMCSpaceCash1
  name: 1美元纸币
  description: 一张由美国财政部发行的一美元纸币。其设计上印有一位来自过去时代、早已被遗忘的人物的肖像，这位领袖的遗产如今对美国民众而言已无足轻重。虽然对于来自该国某些地区的人来说，它承载着情感价值，但它的实际价值微乎其微。在大多数地方，它或许只能为你换来半个热狗或类似的廉价零食。

- type: material
  id: Dollar
  name: 1美元纸币
  unit: materials-unit-bill
  stackEntity: RMCSpaceCash1
  icon: {sprite: /Textures/_RMC14/Objects/Misc/spacecash.rsi, state: spacecash}
  price: 1

- type: stack
  id: Dollar
  name: 1美元纸币
  icon: {sprite: /Textures/_RMC14/Objects/Misc/spacecash.rsi, state: spacecash}
  spawn: RMCSpaceCash1

