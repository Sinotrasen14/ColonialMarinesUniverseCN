- type: entity
  parent: BaseStructure
  id: RMCLightStick
  name: 红色荧光棒
  description: 你可以把它们插在地上。
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    noRot: true
    sprite: _RMC14/Objects/Misc/Lights/lightstick.rsi
    state: lightstick_spoke1
  - type: InteractionOutline
  - type: PointLight
    enabled: true
    radius: 1.65
    energy: 5
    netsync: false
    color: "#FF0000"
  - type: Appearance

- type: entity
  parent: RMCLightStick
  id: RMCLightStickRedSmall
  components:
  - type: Sprite
    state: lightstick_red_variant1

- type: entity
  parent: RMCLightStick
  id: RMCLightStickBlueSmall
  name: 蓝色荧光棒
  components:
  - type: Sprite
    state: lightstick_blue_variant1
  - type: PointLight
    color: "#2D2DE3"
