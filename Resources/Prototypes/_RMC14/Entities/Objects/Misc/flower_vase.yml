- type: entity
  parent: BaseItem
  id: RMCFlowerVase
  name: 插有红白花的花瓶
  description: 一个插满红白玫瑰的花瓶。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/flower_vase.rsi
    state: redwhiteflowers
  - type: Damageable
    damageModifierSet: Glass
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpillBehavior {}
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
        transferForensics: true
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: DamageOnLand
    ignoreResistances: true
    damage:
      types:
        Blunt: 5
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
  - type: PhysicalComposition
    materialComposition: {}

- type: entity
  parent: RMCFlowerVase
  id: RMCFlowerVaseBlue
  name: 装有蓝白花的花瓶
  description: 一个装满蓝白玫瑰的花瓶。
  components:
  - type: Sprite
    state: bluewhiteflowers
