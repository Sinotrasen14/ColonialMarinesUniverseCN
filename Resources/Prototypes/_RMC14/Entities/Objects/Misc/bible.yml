- type: entity
  name: 《圣经》
  description: 一本收录了你常听人提起的那位知名人物的圣典的书。
  parent: BaseStorageItem
  id: RMCBible
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Books/Bibles/bible.rsi
    state: icon
  - type: UseDelay
    delay: 10.0
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    damage:
      types:
        Holy: 25
        Blunt: 1
  - type: Clothing
    slots:
    - Belt
  - type: Storage
    grid:
    - 0,0,0,1
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Tag
    tags:
    - Book
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  parent: RMCBible
  id: RMCBibleHEFA
  name: 高爆破片杀伤手榴弹的圣典
  description: 愿汝受赞颂，可敬的克莱尔斯迈尔，汝将我们引至破片之光！我们已宣誓献身于高爆破片杀伤手榴弹之主的神圣服役；我们虽人数寥寥，却是沉默多数的声音！由RESS印制。
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Books/Tomes/hefa.rsi
    state: icon
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,5,1 # 3 HEFA nades
    whitelist:
      tags:
      - RMCGrenadeHEFA
  - type: StorageFill
    contents:
    - id: CMGrenadeFrag
      amount: 3
