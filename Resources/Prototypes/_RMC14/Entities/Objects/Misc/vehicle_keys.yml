- type: entity
  parent: BaseItem
  id: RMCVehicleKeyBase
  abstract: true
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/vehicle_key.rsi
    state: key
  - type: Item
    size: Tiny
  - type: VehicleKey

- type: entity
  parent: RMCVehicleKeyBase
  id: RMCVehicleKey
  name: 车辆钥匙
  description: 为特定锁具切割的车辆钥匙。
  components:
  - type: VehicleKey
    mode: Normal

- type: entity
  parent: RMCVehicleKeyBase
  id: RMCVehicleKeyBlank
  name: 空白车辆钥匙
  description: 一种未编程的车辆钥匙，可写入车辆。
  components:
  - type: VehicleKey
    mode: Blank

- type: entity
  parent: RMCVehicleKeyBase
  id: RMCVehicleKeyDuplicator
  name: 车辆钥匙复制坯
  description: 一种用于复制现有车辆钥匙的空白车辆钥匙。
  components:
  - type: VehicleKey
    mode: Duplicator
