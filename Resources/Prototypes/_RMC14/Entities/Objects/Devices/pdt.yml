- type: entity
  parent: [BaseItem, PowerCellSlotSmallItem]
  id: RMCPDTLocatorTube
  name: PDT/L定位管
  description: 一种手持式定位管，可与腕戴式 PDT 手环配对使用。它可向配对的手环提供方向和距离读数。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/pdt_locator_tube.rsi
    layers:
    - state: icon
    - state: screen
      shader: unshaded
      visible: false
      map: ["enum.PDTLocatorVisualLayers.Screen"]
    - state: unlinked
      shader: unshaded
      visible: false
      map: ["enum.PDTLocatorVisualLayers.Bracelet"]
  - type: Item
    size: Small
  - type: Tag
    tags:
    - PDTLocator
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PDTLocatorVisuals.Screen:
        enum.PDTLocatorVisualLayers.Screen:
          Off: {visible: false}
          Normal: {state: screen, visible: true}
          Yellow: {state: screen-yellow, visible: true}
          Red: {state: screen-red, visible: true}
      enum.PDTLocatorVisuals.Bracelet:
        enum.PDTLocatorVisualLayers.Bracelet:
          Hidden: {visible: false}
          Linked: {state: linked, visible: true}
          Unlinked: {state: unlinked, visible: true}
  - type: PDTLocator
  - type: UseDelay
    delay: 1
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: RMCPowerCellCrap

- type: entity
  parent: RMCWatchBaseL
  id: RMCPDTBracelet
  name: PDT腕带手环
  description: 一种腕戴式个人数据发射器手环，旨在与PDT/L定位管配对使用。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Accessory/Watches/pdt.rsi
    layers:
    - state: icon
      map: ["base"]
  - type: RandomSprite
    available:
    - base:
        icon: ""
        icon-1: ""
        icon-2: ""
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Clothing/Accessory/Watches/pdt.rsi
      state: watchL
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Accessory/Watches/pdt.rsi
    slots:
    - GLOVES
  - type: PDTBracelet

- type: entity
  parent: RMCWatchCase
  id: CMSparePDTLBattleBuddyKit
  name: 靴子！PDT/L 战斗伙伴套装
  description: 一个坚固的小箱子，内含一根 PDT/L 定位管、与其配对的手腕 PDT 手环，以及一块备用的 We-Ya 微型电池。
  components:
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,5,1
    whitelist:
      tags:
      - PDTLocator
      - Watch
      - PowerCell
  - type: StorageFill
    contents:
    - id: RMCPDTLocatorTube
    - id: RMCPDTBracelet
    - id: RMCPowerCellCrap
  - type: PDTKit

- type: Tag
  id: PDTLocator
