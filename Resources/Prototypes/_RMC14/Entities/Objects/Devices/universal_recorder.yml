- type: entity
  abstract: true
  parent: BaseItem
  id: RMCUniversalRecorderBase
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/cassette_player.rsi
    layers:
    - map: ["enum.UniversalRecorderVisualLayers.Base"]
      state: taperecorder_idle
  - type: Item
    size: Small
  - type: Tag
    tags:
    - SecBeltEquip
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/Handling/taperecorder_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Handling/taperecorder_drop.ogg
  - type: Appearance
  - type: UniversalRecorder
    tapeSlot:
      name: rmc-universal-recorder-slot-name
      insertSuccessPopup: rmc-universal-recorder-popup-insert-generic
      insertSound: /Audio/Items/taperecorder/taperecorder_close.ogg
      ejectSound: /Audio/Items/taperecorder/taperecorder_open.ogg
      whitelist:
        components:
        - UniversalRecorderTape
  - type: ContainerContainer
    containers:
      rmc_universal_recorder_tape: !type:ContainerSlot {}
  - type: UserInterface
    interfaces:
      enum.UniversalRecorderUiKey.Recorder:
        type: UniversalRecorderRecorderBui
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 60
      CMGlass: 30

- type: entity
  parent: RMCUniversalRecorderBase
  id: RMCUniversalRecorderEmpty
  name: 通用录音机
  description: 一种可以将对话录制在磁带上并回放的设备。适合用于上诉或证人陈述。
  suffix: Empty
  components:
  - type: ItemSlots
    allowSmartEquip: false
  - type: UniversalRecorderRuntime
    warningSent: false
    waitingForHissLoop: false
    state: Stopped
    recordingStartedAt: 0
    recordingBaseOffset: 0
    playbackStream:
    playbackStartStream:
    playbackIndex: 0
    pendingSilenceSeconds:
    nextPrintAt: 0
    nextPlaybackAt: 0
    hissLoopStartAt: 0
  - type: Sprite
    layers:
    - map: ["enum.UniversalRecorderVisualLayers.Base"]
      state: taperecorder_empty

- type: entity
  parent: RMCUniversalRecorderBase
  id: RMCUniversalRecorder
  name: 通用录音机
  description: 一种可在磁带上录制对话并回放的设备。适合用于上诉或证人陈述。
  components:
  - type: ItemSlots
    allowSmartEquip: false
  - type: UniversalRecorderRuntime
    warningSent: false
    waitingForHissLoop: false
    state: Stopped
    recordingStartedAt: 0
    recordingBaseOffset: 0
    playbackStream:
    playbackStartStream:
    playbackIndex: 0
    pendingSilenceSeconds:
    nextPrintAt: 0
    nextPlaybackAt: 0
    hissLoopStartAt: 0
  - type: UniversalRecorder
    tapeSlot:
      startingItem: RMCUniversalRecorderTape

- type: entity
  abstract: true
  parent: BaseItem
  id: RMCUniversalRecorderTapeBase
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/cassette_player.rsi
    layers:
    - map: ["enum.UniversalRecorderTapeVisualLayers.Base"]
      state: cassette_regulation
    - map: ["enum.UniversalRecorderTapeVisualLayers.Ribbon"]
      state: ribbon_overlay
      visible: false
  - type: Item
    size: Small
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/Handling/tape_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Handling/tape_drop.ogg
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.UniversalRecorderTapeVisuals.Side:
        enum.UniversalRecorderTapeVisualLayers.Base:
          enum.UniversalRecorderTapeSide.Front:
            state: cassette_regulation
          enum.UniversalRecorderTapeSide.Back:
            state: cassette_flip
      enum.UniversalRecorderTapeVisuals.Unspooled:
        enum.UniversalRecorderTapeVisualLayers.Ribbon:
          true: {visible: true}
          false: {visible: false}
  - type: UniversalRecorderTape
  - type: UserInterface
    interfaces:
      enum.UniversalRecorderUiKey.Tape:
        type: UniversalRecorderTapeBui
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 20
      CMGlass: 5

- type: entity
  parent: RMCUniversalRecorderTapeBase
  id: RMCUniversalRecorderTape
  name: 标准磁带
  description: 一种每面最多可容纳二十分钟内容的磁带。

- type: entity
  parent: RMCBoxCardboard
  id: RMCBoxRegulationTapesEmpty
  name: 一盒调节磁带（x5）
  description: 一盒用于通用记录器的调节磁带。
  components:
  - type: Sprite
    state: box
  - type: Item
    size: Small
    shape:

- type: entity
  parent: RMCBoxRegulationTapesEmpty
  id: RMCBoxRegulationTapes
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: RMCUniversalRecorderTape
      amount: 5

- type: entity
  parent: RMCBoxRegulationTapesEmpty
  id: RMCBoxRegulationTapesFull
  name: 一盒标准胶带（x7）
  suffix: FullyFilled
  components:
  - type: StorageFill
    contents:
    - id: RMCUniversalRecorderTape
      amount: 7

- type: Tag
  id: Recorder
