- type: entity
  parent: BaseItem
  id: RMCDigitalClock
  name: 数字时钟
  description: 一个电池供电的时钟，能够将走时误差控制在约5秒内……它从来就没那么准过。
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _RMC14/Objects/Devices/clocks.rsi
    state: digital_clock
  - type: RMCClock

- type: entity
  id: RMCCatClock
  name: 猫钟
  description: 一台令人难以置信地诡异的猫钟，每一声滴答都在扫视着房间。
  components:
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _RMC14/Objects/Devices/clocks.rsi
    state: cat_clock_motion
  - type: RMCClock
  - type: WallMount
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false

- type: entity
  id: RMCWoodClock
  name: 木钟
  description: 一个普通的钟，用来查看时间。
  components:
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _RMC14/Objects/Devices/clocks.rsi
    state: wood_clock
  - type: RMCClock
  - type: WallMount
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false

- type: entity
  parent: RMCWoodClock
  id: RMCGoldClock
  name: 黄金钟
  description: 一座招摇的钟，用来向别人炫耀你有多富有。
  components:
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _RMC14/Objects/Devices/clocks.rsi
    state: gold_clock
