- type: entity
  parent: TimerTrigger
  id: RMCTimerTrigger
  name: 计时器
  description: 用于计时。非常适合需要倒计时的装置。滴答滴答。
  suffix: RMC
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/timer.rsi
    state: timer
  - type: PayloadTrigger
    components:
    - type: TriggerOnUse
      keyOut: startTimer
    - type: TimerTrigger
      keysIn:
      - startTimer
      keyOut: trigger
      delay: 3
      delayOptions: [3, 5, 10]
      initialBeepDelay: 0
      beepInterval: 10
      beepSound:
        path: /Audio/_RMC14/Explosion/armbomb.ogg
        params:
          volume: -5
      popup:
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 500
      CMGlass: 50
      # 10 waste?
