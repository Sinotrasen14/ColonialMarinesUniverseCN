- type: entity
  parent: BaseItem
  id: RMCBinoculars
  name: 双筒望远镜
  description: 军方配发的双筒望远镜。
  suffix: RMC
  components:
  - type: Item
    size: Small
    heldPrefix: binoculars
  - type: Sprite
    sprite: _RMC14/Objects/Devices/binoculars.rsi
    state: binoculars
  - type: Scope
    useInHand: true
    scopedHeldSuffix: _eyes
    zoomLevels:
    - zoom: 1.6
      offset: 14
      allowMovement: true
      doAfter: 0
  - type: Tag
    tags:
    - Binoculars
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_RMC14/Handling/wirecutter_pickup.ogg
      params:
        volume: -6
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/wirecutter_drop.ogg
      params:
        volume: -4
  - type: Clothing
    quickEquip: false
    slots:
    - suitstorage
  - type: Appearance
  - type: ItemCamouflage
    states:
      Jungle: binoculars
      Desert: d_binoculars
      Snow: s_binoculars
      Classic: c_binoculars
      Urban: u_binoculars

- type: entity
  parent: RMCBinoculars
  id: RMCBinocularsPVE
  suffix: PVE
  name: 战术单筒望远镜
  description: 军用配发的单筒望远镜。
  components:
  # Start _CMU14
  - type: Item
    heldPrefix: monocular
  # End _CMU14
  - type: Sprite
    sprite: CMU14/Objects/Devices/monocular.rsi # _CMU14
    state: monocular
  - type: Scope
    zoomLevels:
    - zoom: 1.4
      offset: 10
      allowMovement: false
      doAfter: 0.1
  - type: ItemCamouflage
    states: {}

- type: entity
  parent: RMCBinoculars
  id: RMCBinocularsCiv
  name: 双筒望远镜
  description: 一副双筒望远镜。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/binoculars.rsi
    state: binoculars_civ
  - type: ItemCamouflage
    states: {}

- type: entity
  parent: RMCBinocularsCiv
  id: RMCBinocularsCivPVE
  suffix: PVE
  components:
  - type: Scope
    zoomLevels:
    - zoom: 1.6
      offset: 14
      allowMovement: false
      doAfter: 0.1

- type: entity
  parent: RMCBinoculars
  id: RMCRangefinder
  name: 测距仪
  description: "一副具有测距功能的双筒望远镜。点击地块以获取其坐标。"
  components:
  - type: Item
    heldPrefix: rangefinder
  - type: Sprite
    sprite: _RMC14/Objects/Devices/binoculars.rsi
    layers:
    - state: rangefinder
      map: ["enum.ItemCamouflageLayers.Layer"]
    - map: ["light"]
  - type: Rangefinder
  - type: UseDelay
    delay: 0
  - type: UserInterface
    interfaces:
      enum.RangefinderUiKey.Key:
        type: RangefinderBui
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.RangefinderLayers.Layer:
        light:
          Rangefinder: {state: laser_range}
          Designator: {state: laser_cas}
          Spotter: {state: laser_spotter}
  - type: ItemCamouflage
    states:
      Jungle: rangefinder
      Desert: d_rangefinder
      Snow: s_rangefinder
      Classic: c_rangefinder
      Urban: u_rangefinder

- type: entity
  parent: RMCRangefinder
  id: RMCLaserDesignator
  name: 激光指示器
  description: "一种具有两种模式的激光指示器：使用红外激光为近距空中支援标记目标，以及测距。点击地块即可瞄准目标。"
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/binoculars.rsi
    layers:
    - state: rangefinder
    - state: laser_cas
  - type: Rangefinder
    mode: Designator
    canDesignate: true

- type: entity
  parent: RMCLaserDesignator
  id: RMCLaserDesignatorPVE
  suffix: PVE
  name: 战术单目指示器
  description: 双模式战术单目指示器，为配合近距空中支援部队与轨道支援而开发。点击地块以指定目标。
  components:
  # Start _CMU14
  - type: Item
    heldPrefix: advanced_monocular
  # End _CMU14
  - type: Sprite
    sprite: CMU14/Objects/Devices/advanced_monocular.rsi # _CMU14
    layers:
    - state: advanced_monocular
    - state: laser_cas_mono
  - type: GenericVisualizer
    visuals:
      enum.RangefinderLayers.Layer:
        light:
          Rangefinder: {state: laser_range_mono}
          Designator: {state: laser_cas_mono}
          Spotter: {state: laser_spotter_mono}
  - type: Scope
    zoomLevels:
    - zoom: 1.4
      offset: 10
      allowMovement: false
      doAfter: 0.1
  - type: ItemCamouflage
    states: {}

- type: entity
  parent: RMCRangefinder
  id: RMCLaserDesignatorSpotter
  name: 观察员激光指示器
  description: "一种专门设计的激光指示器，配发给 UNMC 观察员，具有两种模式：使用红外激光为近距空中支援标记目标，以及测距。点击一个格子即可标记目标。此外，受过训练的观察员可以为 UNMC 精确射手用激光照射目标，提高目标捕获速度。一道瞄准光束会将双筒望远镜与目标连接起来，但如果可能，它可能会继承使用者的隐身效果。"
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/binoculars.rsi
    layers:
    - state: rangefinder
    - state: laser_cas
    - state: spotter_overlay
  - type: Rangefinder
    mode: Designator
    canDesignate: true
  - type: Corrodible
    isCorrodible: false
  - type: Spotting
  - type: TargetingLaser
    laserState: laser_beam_spotter
    laserAlpha: 1
    gradualAlpha: false

- type: entity
  parent: RMCLaserDesignator
  id: RMCLaserDesignatorScout
  name: 侦察兵激光指示器
  description: "一种改进型激光指示器，配发给UNMC侦察兵，具有两种模式：使用红外激光为近距离空中支援标记目标，以及测距。点击地块以指定目标。"
  components:
  - type: Rangefinder
    delay: 3
  - type: Corrodible
    isCorrodible: false

- type: entity
  id: RMCRangefinderTarget
  name: 激光
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Effects/laser.rsi
    state: laser_target_coordinate
    drawdepth: Effects
  - type: PointLight
    enabled: true
    radius: 3
  - type: RMCNightVisionVisible

- type: entity
  parent: RMCRangefinderTarget
  id: RMCLaserDesignatorTarget
  description: 这是用于指示炮兵目标的激光，离它远点！
  components:
  - type: Sprite
    sprite: _RMC14/Effects/laser.rsi
    state: laser_target2
  - type: LaserDesignatorTarget
  - type: RMCStaticZoomLevel
  - type: Eye
    zoom: 0.5, 0.5
    drawFov: false

- type: entity
  parent: RMCRangefinderTarget
  id: RMCLaserDropshipTarget
  name: 闪烁激光
  components:
  - type: Sprite
    state: laser_target3
  - type: TimedDespawn
    lifetime: 1

- type: Tag
  id: Binoculars
