- type: entity
  parent: BaseItem
  id: RMCTabletCO
  name: 指挥平板
  abstract: true # disallow mappers to use this
  description: 一种供高级军官使用的便携式指挥界面，能够远距离向与其关联的计算机下达命令。其设计可抵御核弹。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/command_tablet.rsi
    state: cotablet
  - type: Item
    size: Normal
  - type: ActivatableUI
    key: enum.MarineCommunicationsComputerUI.Key
  - type: ActivatableUIRequiresAccess
  - type: UserInterface
    interfaces:
      enum.MarineCommunicationsComputerUI.Key:
        type: MarineCommunicationsComputerBui
      enum.MarineControlComputerUi.MedalsPanel:
        type: MedalsPanelBui
      enum.TacticalMapComputerUi.Key:
        type: TacticalMapComputerBui
      enum.DialogUiKey.Key:
        type: DialogBui
  - type: MarineCommunicationsComputer
    canCreateEcho: false
    canGiveMedals: true
    canInitiateEvac: true
  - type: TacticalMapComputer
  - type: MarineControlComputer
    canPrintCommendations: false
  - type: Tag
    tags:
    - CommandTablet
  - type: Corrodible
    isCorrodible: false

- type: Tag
  id: CommandTablet
