# Bureau
- type: entity
  parent: CMEncryptionKey
  id: RMCEncryptionKeyBureau
  name: 局加密密钥
  components:
  - type: EncryptionKey
    channels:
    - radioCMB
    - MarineCommon
    - MarineCommand
    - MarineMedical
    - MarineIntel
    - Colony
    defaultChannel: radioCMB
  - type: Sprite
    state: cap_key

- type: entity
  parent: CMEncryptionKey
  id: RMCEncryptionKeyBureauDamaged
  name: 损坏的局加密密钥
  components:
  - type: EncryptionKey
    channels:
    - radioCMB
    - Colony
    defaultChannel: Colony
  - type: Sprite
    state: cap_key

- type: entity
  parent: CMEncryptionKey
  id: RMCEncryptionKeyDukes
  name: 杜克加密密钥
  components:
  - type: EncryptionKey
    channels:
    - MarineCommon # TODO RMC14 add Freelancer (Duke) channel
    - Colony
    defaultChannel: Colony
  - type: Sprite
    state: cap_key

# UNISC

- type: entity
  parent: CMEncryptionKey
  id: CMEncryptionKeyUNISC
  name: unisc 加密密钥
  components:
  - type: EncryptionKey
    channels:
    - UNISOF
    defaultChannel: UNISOF
  - type: Sprite
    state: binary_key
