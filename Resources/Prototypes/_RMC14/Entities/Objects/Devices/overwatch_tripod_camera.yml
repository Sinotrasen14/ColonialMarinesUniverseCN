- type: entity
  parent: BaseItem
  id: RMCOverwatchCameraTripod
  name: 野外摄像头三脚架
  description: 一款可部署的 Motoca-430-T 三脚架摄像头，可连接至 Overwatch 网络。
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _RMC14/Objects/Devices/overwatch_tripod_camera.rsi
    layers:
    - state: undeployed
      map: ["tripod"]
  - type: Icon
    sprite: _RMC14/Objects/Devices/overwatch_tripod_camera.rsi
    state: deployed
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.RMCOverwatchTripodCameraVisuals.Deployed:
        tripod:
          true: {state: deployed}
          false: {state: undeployed}
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: RMCOverwatchTripodCamera
    deploySound:
      path: /Audio/_RMC14/Items/mine_armed.ogg
      params:
        volume: -12
        variation: 0.1
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
