- type: entity
  parent: BaseItem
  id: RMCPinpointerBase
  name: 精准定位器
  description: 一款坚固耐用的军用级追踪设备。会根据与目标的距离改变颜色。保持竖直以维持精度。
  suffix: RMC
  abstract: true
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    noRot: true
    sprite: _RMC14/Objects/Devices/pinpointer.rsi
    layers:
    - state: pinpointer
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: _RMC14/Objects/Devices/pinpointer.rsi
    state: pinpointer
  - type: Item
    sprite: _RMC14/Objects/Devices/pinpointer.rsi
    size: Small
  - type: Pinpointer
    closeDistance: 30
    mediumDistance: 80
    reachedDistance: 2
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PinpointerVisuals.IsActive:
        enum.PinpointerLayers.Screen:
          true: {visible: true}
          false: {visible: false}
      enum.PinpointerVisuals.TargetDistance:
        enum.PinpointerLayers.Screen:
          Unknown: {state: pinonnull}
          Reached: {state: pinondirect}
          Close: {state: pinonclose}
          Medium: {state: pinonmedium}
          Far: {state: pinonfar}
  - type: AnimationPlayer
  - type: Tag
    tags:
    - RMCPinpointer

- type: entity
  parent: RMCPinpointerBase
  id: RMCPinpointerUniversal
  suffix: Universal
  components:
  - type: Pinpointer
    updateTargetName: true
    canRetarget: true

- type: entity
  parent: RMCPinpointerBase
  id: RMCPinpointerAegisID
  suffix: RMC, AEGIS
  components:
  - type: Pinpointer
    component: AegisTrackable
    targetName: AEGIS ID card
