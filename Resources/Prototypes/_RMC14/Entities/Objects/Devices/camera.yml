- type: entity
  parent: BaseItem
  id: RMCCameraBroadcasting
  name: 广播摄像机
  description: 积极记录你所目睹的一切，从舰上的单调日常到下方残酷的战场。                                                                          # TODO Has a built-in printer for action shots.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/broadcasting_camera.rsi
    state: icon
  - type: Item
    size: Huge
  - type: Wieldable
    freeHandsRequired: 0
  - type: Eye
    zoom: 0.5, 0.5
  - type: RMCStaticZoomLevel
  - type: Scope
    useInHand: true
    requireWielding: true
    zoomLevels:
    - zoom: 1.6
      offset: 14
      allowMovement: true
      doAfter: 0
  - type: SurveillanceCameraMicrophone
    blacklist:
      components:
      - SurveillanceCamera
      - SurveillanceCameraMonitor
      - RadioSpeaker
      - Xeno
  - type: ActiveListener
    range: 10
  - type: RMCCamera
    rename: false
  - type: CameraNetworkMember
    networks: [RMCTelevision]
    sourceKinds: Rmc
  - type: Corrodible
    isCorrodible: false
