- type: entity
  parent: BaseItem
  id: RMCPortableVendor
  name: 自动化存储公文包
  description: 一个手提箱大小的自动化存储与检索系统。旨在高效存储并选择性地分发小件物品。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Storage/Briefcases/secure.rsi
    state: secure
  - type: Item
    size: Large
  - type: Clickable
  - type: UserInterface
    interfaces:
      enum.CMAutomatedVendorUI.Key:
        type: CMAutomatedVendorBui
  - type: ActivatableUI
    key: enum.CMAutomatedVendorUI.Key
  - type: ActivatableUIRequiresAccess
  - type: Tag
    tags:
    - Briefcase

