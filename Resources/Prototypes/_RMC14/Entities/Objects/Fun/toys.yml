- type: entity
  parent: RMCPlushieSharkBlue
  id: RMCShorkMedicalOfficer
  name: Shork医疗官毛绒玩偶
  description: Shork医疗官很失望地看到你又进了手术室。也许你该更好地照顾自己？
  suffix: RMC
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Fun/smo.rsi
    state: SMO
  - type: Item
    inhandVisuals:
      left:
      - state: SMO-inhand-left
      right:
      - state: SMO-inhand-right

- type: entity
  parent: CMPlushieBase
  id: CMPlushieFarwa
  name: 法尔瓦毛绒玩偶
  description: 法尔瓦毛绒玩偶。它柔软又舒适！
  components:
  - type: Sprite
    state: farwa

- type: entity
  parent: CMPlushieBase
  id: CMPlushieBarricade
  name: 毛绒玩具路障
  description: 害怕的时候、有点疼的时候，或者任何其他情况下，都很适合捏一捏。
  components:
  - type: Sprite
    state: barricade

- type: entity
  parent: CMPlushieBase
  id: CMPlushieBee
  name: 蜜蜂毛绒玩具
  description: 一个可爱的玩具，能唤醒最内敛的陆战队员心中的战士精神。
  components:
  - type: Sprite
    state: bee

- type: entity
  parent: CMPlushieBase
  id: CMPlushieRock
  name: 石头毛绒玩具
  description: 至少标签上写着它是毛绒玩具。
  components:
  - type: Sprite
    state: rock

- type: entity
  parent: CMPlushieBase
  id: CMPlushieTherapy
  name: 疗愈毛绒玩具
  description: 一种帮助海军陆战队员在经历战斗创伤后从精神和行为障碍中恢复的疗愈玩具。
  components:
  - type: Sprite
    layers:
    - state: therapy
      map: ["enum.DamageStateVisualLayers.Base"]
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        therapy: Rainbow

- type: entity
  parent: CMPlushieBase
  id: CMPlushieRunnerBeret
  name: XX 疗愈毛绒玩具
  description: 别难过！要开心（庆幸你还活着）！
  components:
  - type: Sprite
    state: runner_beret
  - type: Rotatable

- type: entity
  parent: CMPlushieBase
  id: RCMPlushieRounyLizard
  name: 傻乎乎的Rouny毛绒玩偶
  description: 由UNMC生产的一款傻乎乎的Rouny毛绒玩偶，用于缓解海军陆战队员的压力，事实证明，将它扔到墙上极为有效。
  components:
  - type: Sprite
    state: rouny_plushie

- type: entity
  parent: RMCPlushieBaseAdmin
  id: RMCPlushieAlec
  name: 显眼的毛绒玩具
  description: 你几乎能感觉到它散发出的怨毒。它的背上有一个小标签，上面列出了制作它所用的几种廉价且低致敏性的织物。最下方是制造商的名字，德雷克工业公司。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Fun/alec_plushie.rsi
    state: icon
  - type: Clothing
    sprite: _RMC14/Objects/Fun/alec_plushie.rsi
  - type: EmitSoundOnUse
    sound:
      collection: bottleOpenSounds
  - type: EmitSoundOnActivate
    sound:
      collection: bottleOpenSounds

- type: entity
  parent: RMCPlushieBaseAdmin
  id: RMCPlushieNyx
  name: 被诅咒的毛绒玩偶
  description: 有传闻说，如果你向这个毛绒玩偶索要金属，你的灵魂就会被困在坑里。还有传闻说，这个毛绒玩偶由99%的棉制成。
  components:
  - type: Sprite
    state: plushie_moth
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Voice/Moth/moth_chitter.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Voice/Moth/moth_chitter.ogg
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Voice/Moth/moth_chitter.ogg
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Voice/Moth/moth_chitter.ogg
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Voice/Moth/moth_chitter.ogg
  - type: Edible
    requiresSpecialDigestion: true
    useSound:
      path: /Audio/Voice/Moth/moth_chitter.ogg

- type: entity
  parent: RMCPlushieNyx
  id: RMCPlushieMotivationalMoth
  name: 励志海洋蛾
  description: 一个柔软、毛茸茸的海洋小伴侣，献给那些只需一点动力就能冲过终点线的人。你能做到的，没错没错！被捏时，它会开心地吱吱叫！
  suffix: DO NOT MAP
  components:
  - type: Sprite
    state: plushie_wawa

- type: entity
