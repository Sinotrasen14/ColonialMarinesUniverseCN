- type: entity
  parent: CMPaper
  id: RMCSpaceGrunts
  name: 太空步兵
  description: 一款围绕 UNMC 的桌面游戏，容易上手，玩法简单，最重要的是整个小队都能玩得尽兴。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/paper.rsi
    layers:
    - state: paper_stack
    - state: paper_stack_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamped
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: Paper
    contentSize: 20000
    content: rmc-book-text-space-grunts
