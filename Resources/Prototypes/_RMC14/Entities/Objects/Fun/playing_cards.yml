- type: entity
  abstract: true
  parent: BaseItem
  id: RMCPlayingCardBase
  categories: [HideSpawnMenu]
  name: 扑克牌
  description: 一张标准扑克牌。
  components:
  - type: PlayingCard
  - type: Sprite
    sprite: _RMC14/Objects/Fun/playing_cards.rsi
    state: spades_ace
  - type: Item
    size: Tiny

# Individual card (spawned from deck)
- type: entity
  parent: RMCPlayingCardBase
  id: RMCPlayingCard
  categories: [HideSpawnMenu]

# Hand of cards
- type: entity
  parent: BaseItem
  id: RMCPlayingCardHand
  name: 一手牌
  description: 一手扑克牌。
  categories: [HideSpawnMenu]
  components:
  - type: PlayingCardHand
  - type: Sprite
    sprite: _RMC14/Objects/Fun/playing_cards.rsi
    state: back_deck
  - type: Item
    size: Tiny
  - type: UseDelay
    delay: 0.1
  - type: UserInterface
    interfaces:
      enum.PlayingCardHandUi.Key:
        type: PlayingCardHandBui

# Deck of cards
- type: entity
  parent: BaseItem
  id: RMCPlayingCardDeck
  name: 一副牌
  suffix: RMC
  description: 我发誓那个游戏叫金鱼！
  components:
  - type: PlayingCardDeck
    cardPrototype: RMCPlayingCard
  - type: Sprite
    sprite: _RMC14/Objects/Fun/playing_cards.rsi
    state: deck
  - type: Item
    size: Tiny
  - type: UseDelay
    delay: 0.1
