- type: entity
  parent: RMCKatana
  id: RMCKatanaSharp
  name: 锋利得离谱的武士刀
  description: "够了。我受够了现在RMC-14里到处搞的“大师级杂种剑”这种狗屁。武士刀配得上比这好得多的东西。远比这好，好得多得多。\n\n我清楚自己在说什么。我本人曾在日本花240万日元（约合2万美元）订制了一把真正的武士刀，到现在已经用它练习将近两年了。我甚至能用我的武士刀切开实心钢板。\n\n日本刀匠会花数年时间打造一把武士刀，并把它折叠上百万次，以造出人类已知最精良的刀刃。\n\n武士刀比欧洲剑锋利三倍，硬度同样也是三倍。长剑能砍穿的东西，武士刀都能砍得更利落。我很确定，武士刀只需一个简单的垂直劈砍，就能轻松把穿着全身板甲的骑士劈成两半。\n\n有没有想过，为什么中世纪欧洲从没费心去征服日本？没错，他们太害怕与纪律严明的武士以及他们那毁灭性的武士刀交手。即便在第二次世界大战中，美国士兵也会优先瞄准那些手持武士刀的人，因为他们的杀伤力令人畏惧，也令人敬重。"
  suffix: Admeme #TODO Kill delay, Katana dueling, Cuts 8 times(per swing?), and other stuff in 13's code.
