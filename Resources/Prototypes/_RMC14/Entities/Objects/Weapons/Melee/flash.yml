- type: entity
  parent: Flash
  id: CMFlash
  name: 闪光
  description: 用于致盲和当个混蛋。每60秒充能一次闪光。每次使用之间必须等待5秒，让电容器重新充能。
  components:
  - type: Flash
    slowTo: 0.55
    meleeStunDuration: 8
    range: 3
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Melee/flash.rsi
  - type: Item
    size: Small
    sprite: _RMC14/Objects/Weapons/Melee/flash.rsi
  - type: LimitedCharges
    maxCharges: 2
    lastCharges: 2
  - type: AutoRecharge
    rechargeDuration: 60
  - type: UseDelay
    delay: 5
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FlashVisuals.Flashing:
        enum.FlashVisualLayers.LightLayer:
          true: {visible: true}
          false: {visible: false}
  - type: MeleeRequiresSkill
    skills:
      RMCSkillPolice: 1
