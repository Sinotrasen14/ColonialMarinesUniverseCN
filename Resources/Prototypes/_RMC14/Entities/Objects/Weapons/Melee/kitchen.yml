- type: entity
  parent: [RMCBaseMeleeWeapon, BaseKnife]
  id: RMCKitchenKnife
  name: 刀
  description: 可以切开任何食物。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Melee/Kitchen/knife.rsi
    state: icon
  - type: Item
    size: Small
  - type: Clothing
    slots:
    - mask
    - pocket
    - suitstorage
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1
    damage:
      types:
        Slash: 10
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 10
  - type: DamageImpactProfile
    melee:
      contact: Stab
      penetration: Low
    thrown:
      contact: Stab
      penetration: Low
  - type: DisarmMalus
    malus: 0.225
  - type: UsableWhileDevoured
  - type: Tag
    tags:
    - Knife
  - type: DeleteOnExplosion
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 12000

- type: entity
  parent: RMCKitchenKnife
  id: RMCKitchenKnifePlastic
  name: 塑料刀
  description: 最钝的刀刃。
  components:
  - type: Sprite
    state: plastic
  - type: DamageImpactProfile
    melee:
      contact: Slash
      penetration: None
    thrown:
      contact: Fragment
      penetration: None
  - type: PhysicalComposition
    materialComposition: {}

- type: entity
  parent: RMCKitchenKnife
  id: RMCKitchenKnifeChef
  name: 厨刀
  description: 由SpaceCook股份有限公司制造的多用途厨师刀。保证在未来数年内保持锋利。

- type: entity
  parent: RMCKitchenKnife
  id: RMCKitchenKnifeButcher
  name: 屠夫的剁肉刀
  description: 一个巨大的东西，用来剁肉和把肉切碎。这包括小丑以及小丑副产品。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Melee/Kitchen/cleaver.rsi
  - type: DamageImpactProfile
    melee:
      contact: Slash
      penetration: Low
    thrown:
      contact: Fragment
      penetration: Low
