- type: entity
  parent: BaseItem
  id: RMCStunBatonDamaged
  name: 损坏的电击棒
  description: 一根用来使人丧失行动能力的电击棒。这一根似乎已经相当破损且磨损严重，尤其是在开关附近。。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Melee/stun_baton.rsi
    layers:
    - state: stunbaton_off
      map: ["enum.ToggleableVisuals.Layer"]
  - type: Clothing
    quickEquip: false
    sprite: _RMC14/Objects/Weapons/Melee/stun_baton.rsi
    slots:
    - Belt
    - Suitstorage
  - type: Item
    heldPrefix: off
    size: Normal
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          true: {state: stunbaton_on}
          false: {state: stunbaton_off}

- type: entity
  parent: RMCStunBatonDamaged
  id: CMStunbaton
  name: 电击棒
  description: 一根用于使他人丧失行动能力的电击棒。
  components:
  - type: ItemToggleExaminableStatus
  - type: ItemToggleRequiresCharge
    requiredCharge: 50
  - type: MeleeBatteryHitsLeft
  - type: StaminaDamageOnHitRequiresToggle
  - type: StaminaDamageOnHitRequiresCharge
    requiredCharge: 50
  - type: RMCStaminaDamageOnHit
    damage: 30
    jitterDuration: 2
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/egloves.ogg
      params:
        variation: 0.2
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/egloves.ogg
      params:
        variation: 0.2
    activatedDamage:
      types:
        Blunt: 0
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 7
    bluntStaminaDamageFactor: 2.0
    angle: 60
    animation: WeaponArcThrust
  - type: DamageImpactProfile
    melee:
      contact: Crush
      penetration: None
    thrown:
      contact: Crush
      penetration: None
  - type: RMCStaminaDamageOnCollide
    damage: 35
  - type: Tag
    tags:
    - Stunbaton
  - type: LandAtCursor # it deals stamina damage when thrown
  - type: Battery
    maxCharge: 500
    startingCharge: 500
  - type: UseDelay

# TODO RMC14: Actually implement the telescopic baton
- type: entity
  parent: CMStunbaton
  id: RMCTelescopicBaton
  name: 伸缩警棍
  description: 一把紧凑但经过重新平衡的个人防卫武器。折叠后可以隐藏。
  components:
  - type: Item
    size: Small
