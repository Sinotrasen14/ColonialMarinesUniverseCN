- type: entity
  parent: [BaseItem, RMCBaseMeleeWeapon]
  id: RMCBaseballBat
  name: 木制棒球棒
  description: 一把大型木制棒球棒。常用于殖民地娱乐，但也用作自卫手段。常被暴徒和恶棍携带。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Melee/baseball_bat.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1
    damage:
      types:
        Blunt: 25
    soundHit:
      path: /Audio/_RMC14/Weapons/genhit3.ogg
  - type: DamageImpactProfile
    melee:
      contact: Crush
      penetration: None
  - type: Item
    size: Normal
    sprite: _RMC14/Objects/Weapons/Melee/baseball_bat.rsi

- type: entity
  parent: RMCBaseballBat
  id: RMCBaseballBatMetal
  name: 金属棒球棒
  description: 一把大型金属棒球棒。与木制棒球棒相比，金属棒球棒能提供略多一点的力道。通常由暴徒和恶棍携带。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Melee/metal_bat.rsi
    state: icon
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 35
  - type: DamageImpactProfile
    melee:
      contact: Crush
      penetration: None
      energy: Medium
  - type: Item
    sprite: _RMC14/Objects/Weapons/Melee/metal_bat.rsi
