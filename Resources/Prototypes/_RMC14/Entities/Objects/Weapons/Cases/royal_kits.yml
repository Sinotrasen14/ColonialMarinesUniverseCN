- type: entity
  parent: CMSniperEquipmentCase
  id: RMCScoutSniperSniperEquipmentCase
  name: 侦察狙击手装备箱
  description: "一个大型箱子，内含一把带消音器和瞄准镜的M96S-B步枪、其配套的头戴式瞄具、六个装标准弹药的备用弹匣以及一个两脚架。\n\n注意：你无法将物品放回此箱内。"
  suffix: Sniper
  components:
  - type: Sprite
    sprite: _RMC14/Objects/loadout_kits.rsi
    layers:
    - state: closed
      map: [base]
    - state: sniper
      map: [label]
  - type: Icon
    sprite: _RMC14/Objects/loadout_kits.rsi
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          true: {state: open}
          false: {state: closed}
        label:
          true: {visible: false}
          false: {visible: true}
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,17,1
  - type: StorageFill
    contents:
    - id: RMCVisorNightVision
    - id: CMMagazineSniperM96S
      amount: 6
    - id: RMCM96SBSniperRifle
    - id: RMCAttachmentBipod
  - type: CMChangeUserOnVend
    addComponents:
    - type: SniperWhitelist

- type: entity
  parent: CMSniperEquipmentCase
  id: RMCScoutSniperMarksmanEquipmentCase
  name: 侦察狙击手装备箱
  description: "一个大型装备箱，内含一支L112A1精确射手步枪、其配套的头戴式瞄准镜、十个装满碎甲弹的备用弹匣以及一个两脚架。"
  suffix: Marksman
  components:
  - type: Sprite
    sprite: _RMC14/Objects/loadout_kits.rsi
    layers:
    - state: closed
      map: [base]
    - state: sniper
      map: [label]
  - type: Icon
    sprite: _RMC14/Objects/loadout_kits.rsi
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          true: {state: open}
          false: {state: closed}
        label:
          true: {visible: false}
          false: {visible: true}
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,25,1
  - type: IgnoreContentsSize
    items:
      tags:
      - RMCL112SniperRifle
  - type: StorageFill
    contents:
    - id: RMCVisorNightVision
    - id: RMCL112SniperRifleSuppressedSH
    - id: RMCMagazineSniperL112SH
      amount: 10
    - id: RMCAttachmentBipod
  - type: CMChangeUserOnVend
    addComponents:
    - type: SniperWhitelist

# L49 assault shotgun
- type: entity
  parent: RMCGunCaseBase
  id: RMCL49Case
  name: L49突击霰弹枪枪箱
  suffix: PVE, RCM
  description: 装有L49突击霰弹枪的枪箱。内含L49武器、两盒L49B破门弹药以及一个L28型霰弹枪弹挂具。
  components:
  - type: Storage
    maxItemSize: Ginormous
    grid:
    - 0,0,7,1 # 4 slots
    whitelist:
      tags:
      - RMCWeaponShotgunL49
      - RMCBoxShotgunL49B
      - RMCL49Holster
  - type: StorageFill
    contents:
    - id: RMCWeaponShotgunL49
    - id: RMCBeltL49
    - id: RMCBoxShotgunL49B
      amount: 2
