- type: entity
  parent: RMCBaseEquipmentCase
  id: CMSmartGunOperatorEquipmentCase
  name: M56B智能枪系统箱
  description: "一个大箱子，内装一把M56B智能枪、一套M56战斗背带、一个头戴式瞄准具和一个电源包。\n\n注意：你无法将物品放回此箱内。"
  components:
  - type: Sprite
    layers:
    - state: closed
      map: [base]
    - state: smartgun
      map: [label]
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,13,1
  - type: StorageFill
    contents:
    - id: RMCGlassesSmartGunSight
    - id: RMCSmartGun
    - id: RMCPowerCellSmartgun
    - id: CMArmorSmartGunCombatHarness
    - id: RMCMagazineSmartGun
    - id: RMCMagazineSmartGun
    - id: RMCMagazineSmartGun

