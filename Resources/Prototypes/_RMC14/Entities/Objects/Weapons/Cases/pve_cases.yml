- type: entity
  parent: RMCCaseBase
  id: RMCBasePVEEquipmentCase
  abstract: true
  name: 基地装备箱
  description: 一个枪箱。
  suffix: PVE
  components:
  - type: Sprite
    layers:
    - state: base
    - state: gun
      map: [gun]
      visible: false
    - state: lid_closed
      map: [lid]
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        lid:
          true: {state: lid_open}
          false: {state: lid_closed}
  - type: Storage
    maxItemSize: Ginormous
    grid:
    - 0,0,7,1
  - type: FixedItemSizeStorage
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

