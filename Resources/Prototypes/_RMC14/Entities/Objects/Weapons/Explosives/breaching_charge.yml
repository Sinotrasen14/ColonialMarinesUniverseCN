- type: entity
  parent: BaseItem
  id: RMCExplosiveBreachingCharge
  name: 破门炸药             # TODO RMC14 disable with multitool?
  description: 一种用于破门闯入区域的爆炸装置，既能保护使用者免受爆炸冲击，又能在另一侧散布致命破片。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Explosives/satchel_charge.rsi
    state: icon
    layers:
    - state: icon
      map: ["base"]
  - type: Item
    size: Small
  - type: Sticky
    stickDelay: 1
    canUnstick: false
    stickPopupStart: comp-sticky-start-stick-bomb
    stickPopupSuccess: comp-sticky-success-stick-bomb
    unstickPopupStart: comp-sticky-start-unstick-bomb
    unstickPopupSuccess: comp-sticky-success-unstick-bomb
    whitelist:
      components:
      - RMCWallExplosionDeletable
  - type: Explosive
    explosionType: RMC
    totalIntensity: 1
    intensitySlope: 5
    maxIntensity: 1
    canCreateVacuum: false
  - type: ExplodeOnTrigger
  - type: StickyVisualizer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        base:
          Primed: {state: active}
          Unprimed: {state: icon}
  - type: RMCExplosiveDelete
  - type: Tag
    tags:
    - RMCExplosiveBreachingCharge
  - type: RequiresSkill
    skills:
      RMCSkillEngineer: 1

- type: entity
  parent: RMCExplosiveBreachingCharge
  id: RMCExplosiveBreachingChargeRubber
  name: X17防暴炸药
  description: 一种用于破开区域进入其中，同时保护使用者免受爆炸伤害的爆炸装置。与标准破门炸药不同，X17会呈锥形喷射橡胶弹丸，使目标丧失行动能力而非致死。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Explosives/satchel_charge_rubber.rsi
    state: icon
    layers:
    - state: icon
      map: ["base"]
  # TODO Shrapnel volume 20

# TSEPA variant
- type: entity
  parent: RMCExplosiveBreachingChargeRubber
  id: RMCExplosiveBreachingChargeRubberTSEPA
  name: TSEPA X17 防暴电击弹
  components:
  - type: RequiresSkill
    skills:
      RMCSkillPolice: 0
      RMCSkillEngineer: 1

- type: entity
  parent: RMCExplosiveBreachingCharge
  id: RMCExplosivePlastic
  name: 塑性炸药
  description: 用于在特定区域炸出孔洞，而不会产生过多额外的孔洞。
  components:
  - type: RMCVehicleDemolitionCharge
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Explosives/plastic_explosives.rsi
  - type: Explosive
    totalIntensity: 350
    intensitySlope: 6
    maxIntensity: 20
  - type: Sticky
    stickDelay: 5
    whitelist:
      components:
      - RMCWallExplosionDeletable
      - XenoTunnel
  - type: RMCExplosiveDelete
    delay: 10
    beepSound:
      path: "/Audio/Effects/beep1.ogg"
      params:
        volume: 4
    initialBeepDelay: 0
    beepInterval: 0.5
    whitelist:
      components:
      - XenoTunnel

- type: Tag
  id: RMCExplosiveBreachingCharge
