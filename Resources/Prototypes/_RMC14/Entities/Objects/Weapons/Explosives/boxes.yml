- type: entity
  abstract: true
  parent: CMPacketBase
  id: RMCBoxSmallBase
  name: 数据包
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Storage/packets.rsi
    layers:
    - state: minebox
      map: ["closedLayer"]
    - state: minebox_e
      map: ["openLayer", "emptyLayer"]
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,7,1
    whitelist:
      tags:
      - RMCExplosiveClaymoreMine
  - type: Tag
    tags:
    - RMCPacketGrenade

- type: entity
  parent: RMCBoxSmallBase
  id: RMCBoxClaymoreMineFilled
  name: M20 地雷箱
  suffix: Filled
  description: 一个装有五枚M20反步兵近炸地雷的安全箱。
  components:
  - type: StorageFill
    contents:
    - id: RMCExplosiveClaymoreMine
      amount: 4

- type: entity
  parent: RMCBoxSmallBase
  id: AU14BoxClaymoreMineIncendiaryFilled
  name: M20燃烧地雷箱
  suffix: Filled
  description: 一个装有五枚M20燃烧反步兵近炸地雷的保险箱。
  components:
  - type: StorageFill
    contents:
    - id: AU14ExplosiveClaymoreMineIncendiary
      amount: 4
  - type: Sprite
    sprite: _RMC14/Objects/Storage/packets.rsi
    layers:
    - state: mineboxi
      map: ["closedLayer"]
    - state: minebox_ei
      map: ["openLayer", "emptyLayer"]
