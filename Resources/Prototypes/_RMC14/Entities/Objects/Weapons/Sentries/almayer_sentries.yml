- type: entity
  parent: RMCBaseTurret
  id: RMCTurretAlmayer
  # cmu edit start: no UA/UN prefix on sentry names
  name: 635C固定式高斯炮塔
  # cmu edit end
  # cmu edit start: no UA/UN prefix on sentry descriptions
  description: 一种具有中程瞄准能力的全自动防御炮塔。配备一门改装的 M32-S 自动机炮和内置弹链供弹系统，并为战舰用途进行了改装。
  # cmu edit end
  components:
  - type: UserIFF
    factions: []
  - type: EntityIFF
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.45
        density: 60
        mask:
        - MachineMask
        layer:
        - MachineLayer
        - BulletImpassable
  - type: InteractionPopup
    interactDelay: 0.2
    successChance: 0.8
    interactSuccessString: petting-success-generic
    interactFailureString: petting-failure-generic
    interactSuccessSound:
      path: /Audio/Effects/double_beep.ogg
  - type: Corrodible
    isCorrodible: false
  - type: Gun
    fireRate: 2.5
  - type: BallisticAmmoProvider
    cycleable: false
    proto: RMCCartridgeSentry
    capacity: 99999
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: RMCHealthExaminable
    speciesType: Mechanical
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: HTN
    rootTask:
      task: RMCTurretCompound
    blackboard:
      SoundTargetInLOS: !type:SoundPathSpecifier
        path: /Audio/Effects/double_beep.ogg
      VisionRadius: !type:Single 5.5
      AggroVisionRadius: !type:Single 5.5

- type: entity
  parent: BaseStructure
  id: RMCDeployerSentry
  name: 哨戒炮部署系统
  description: 一个可部署哨戒炮的箱子。
  components:
  - type: Transform
    anchored: true
  - type: Appearance
  - type: Sprite
    sprite: _RMC14/Structures/Machines/sentry_deployer.rsi
    layers:
    - state: floor_sentry_installed
      map: ["enum.EquipmentDeployState.UnDeployed"]
    - state: floor_sentry_deployed
      map: ["enum.EquipmentDeployState.Deployed"]
      visible: false
  - type: RMCEquipmentDeployer
    deployPrototype: RMCTurretAlmayer
    isDeployableByHand: true
    isDeployable: true
    alertLevelRequired: Red
    blacklist:
      components:
      - Xeno
  - type: InteractionOutline
