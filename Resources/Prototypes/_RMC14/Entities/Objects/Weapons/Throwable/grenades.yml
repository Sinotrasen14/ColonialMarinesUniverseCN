    range: 3

- type: entity
  parent: CMGrenadeHighExplosive
  id: CMGrenadeFrag
  name: 30毫米高爆破片杀伤榴弹
  description: 高爆破片杀伤人员弹。一种体型小巧但威力出人意料地强的破片榴弹，正与30毫米高爆双用途弹一同逐步取代M15破片榴弹。可装填进榴弹发射器，也可用手投掷。
  components:
  # cmu edit start: not dual-purpose, so no impact fuse; the launcher's own fuse sets it off (cmss13-pve#517)
  - type: TriggerOnFixedDistanceStop
    delay: 10
  # cmu edit end
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Grenades/m40hefa.rsi
  - type: Explosive
    maxIntensity: 8 # max 40 brute 40 burn
    intensitySlope: 4
    totalIntensity: 110
    deleteAfterExplosion: false
  - type: ProjectileGrenade
    triggerKey: trigger
    fillPrototype: CMProjectileShrapnel
    capacity: 48
    directHit: false
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: Ammo
  - type: ClusterLimitHits
  - type: CMExplosionEffect
    maxShrapnel: 0
  - type: CMVocalizeTrigger
  - type: RMCScorchEffect
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCGrenadeM40
    - RMCGrenadeHEFA

