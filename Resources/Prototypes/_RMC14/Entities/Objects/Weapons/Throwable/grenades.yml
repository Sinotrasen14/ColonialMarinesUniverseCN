- type: entity
  abstract: true
  parent: GrenadeBase
  id: CMGrenadeBase
  name: 手榴弹
  description: 卧倒并掩护。
  components:
  - type: Explosive
    explosionType: RMC
  - type: ExplosionResistance
    damageCoefficient: 0
  - type: TriggerOnUse
    keyOut: startTimer
  - type: TimerTrigger
    keysIn:
    - startTimer
    keyOut: trigger
    delay: 4
    beepSound:
      # cmu edit start: grenade priming sound (cmss13-pve#517)
      path: "/Audio/CMU14/Weapons/Grenades/grenade.ogg"
      # cmu edit end
      params:
        volume: -5
    initialBeepDelay: 0
    beepInterval: 10
    popup:
  - type: TimerTriggerVisuals
  - type: IgnorePredictionHide
  - type: Clothing
    slots:
    - suitStorage
  - type: Destructible
    thresholds: []
  - type: ChangeItemSizeOnTimerTrigger
  - type: CancelUseWithCloak

- type: entity
  abstract: true
  id: RMCM40DPTags
  components:
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCGrenadeM40

- type: entity
  name: 闪光弹
  description: 非常适合阻止成群的暴乱者。别指望太阳镜能保护你……
  parent: CMGrenadeBase
  id: RMCGrenadeFlashBang
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Grenades/flashbang.rsi
  - type: EmitSoundOnTrigger
    sound:
      path: "/Audio/Effects/flash_bang.ogg"
    positional: true
  # cmu edit start
  - type: FlashOnTrigger
    range: 7
  # cmu edit end
  - type: DeleteOnTrigger
  - type: SpawnOnTrigger
    proto: GrenadeFlashEffect
  - type: Appearance
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Effects/countdown.ogg
  - type: Tag
    tags:
    - RMCGrenadeRiot
    - Grenade
    - RMCGrenadeFlashBang
  - type: RequiresSkill
    skills:
      RMCSkillPolice: 1

- type: entity
  parent:
  - CMGrenadeBase
  - RMCM40DPTags
  id: CMGrenadeHighExplosive
  # cmu edit start: M40 HEDP designation and impact fuse (cmss13-pve#517)
  name: M40高爆双用途榴弹
  description: 高爆双用途。一种小巧却强得出奇的榴弹，正在逐步淘汰 M15 高爆榴弹。爆炸时会产生强力爆破。可由榴弹发射器发射以撞击引爆，也可在手中激活引信后投掷，4 秒后引爆。
  # cmu edit end
  components:
  # cmu edit start: detonate on impact when fired from a launcher (cmss13-pve#517)
  - type: TriggerOnFixedDistanceStop
  # cmu edit end
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Grenades/m40hedp.rsi
  - type: ExplodeOnTrigger
  - type: Explosive
    maxIntensity: 20 # max 100 brute, 100 burn
    intensitySlope: 6
    totalIntensity: 200
    canCreateVacuum: false
  - type: Ammo
  - type: CMExplosionEffect
  - type: CMVocalizeTrigger
  - type: RMCScorchEffect
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCGrenadeM40
    - RMCGrenadeHEDP

- type: entity
  parent:
  - CMGrenadeBase
  - RMCM40DPTags
  id: CMGrenadeSmoke
  # cmu edit start: M47 HSDP designation and impact fuse (cmss13-pve#517)
  name: M47 HSDP烟雾弹
  description: M47 HSDP是一种小巧但威力强大的烟雾弹，与M40 HEDP基于同一平台。它可由榴弹发射器发射，撞击引爆，也可在手中激活引信后投掷，2.5秒后爆炸。
  # cmu edit end
  components:
  # cmu edit start: detonate on impact when fired from a launcher (cmss13-pve#517)
  - type: TriggerOnFixedDistanceStop
  # cmu edit end
  - type: TimerTrigger
    delay: 2.5
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Grenades/m40smoke.rsi
  - type: SpawnOnTrigger
    # cmu edit start: smoke grenades last 35 seconds
    proto: CMUSmokeGrenade
    # cmu edit end
  - type: EmitSoundOnTrigger
    sound: /Audio/Effects/smoke.ogg
    positional: true
  - type: DeleteOnTrigger
  # cmu edit start: use the standard grenade arm sound
  - type: TimerTriggerVisuals
    primingSound:
  # cmu edit end
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCGrenadeM40
    - RMCGrenadeRiot
  - type: Ammo

- type: entity
  parent: Smoke
  id: RMCSmokeExplosionProof
  components:
  - type: Transform
    anchored: true
  - type: Occluder
  - type: Sprite
    sprite: _RMC14/Effects/smoke.rsi
    state: smoke2
    # cmu edit start: non-lethal smoke is darker than WP smoke (cmss13-pve#719)
    color: "#adadad"
    # cmu edit end
  - type: TimedDespawn
    lifetime: 10
  - type: Tag
    tags:
    - HideContextMenu
  - type: Appearance
  - type: ActiveEdgeSpreader
  - type: EdgeSpreader
    id: RMCSmokeAcid
  - type: EvenSmoke
    spawn: RMCSmoke
    range: 3

- type: entity
  parent: RMCSmokeExplosionProof
  id: RMCSmokeExplosionProofSmall
  components:
  - type: EvenSmoke
    spawn: RMCSmoke
    range: 1

- type: entity
  parent: RMCSmokeExplosionProof
  id: RMCSmoke
  components:
  - type: DeleteOnExplosion

- type: entity
  parent: Smoke
  id: RMCSmokePhosphorusNoSpread
  categories: [HideSpawnMenu]
  components:
  - type: Transform
    anchored: true
  - type: Occluder
  - type: Sprite
    sprite: _RMC14/Effects/smoke.rsi
    state: smoke2
    # cmu edit start: WP smoke is lighter than non-lethal smoke (cmss13-pve#719)
    color: "#dddddd"
    # cmu edit end
  - type: TimedDespawn
    lifetime: 5
  - type: Tag
    tags:
    - HideContextMenu
  - type: Appearance
  - type: DeleteOnExplosion
  - type: RMCIgniteOnCollide
