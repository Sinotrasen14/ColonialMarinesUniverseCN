- type: entity
  parent: CMUIEDBase
  id: RMCGrenadeMolotov
  name: 简易燃烧弹
  description: 一种强效的简易燃烧弹，掺入少许火药。廉价、非常有效，在封闭空间内致命。常见于叛军和恐怖分子手中。很难预测它还有多少秒就会爆炸，所以要小心。很有可能，它会在你脸上炸开。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Grenades/molotov.rsi
    layers:
    - state: icon
  - type: TriggerOnIgniterUse
    keyOut: ignite
  - type: TimerTrigger
    keysIn:
    - ignite
    keyOut: trigger
    examinable: false
    initialBeepDelay: 0
    beepSound:
  - type: RandomTimerTrigger
    min: 1
    max: 4
  - type: CMVocalizeTrigger
  - type: TileFireOnTrigger
    spawn: RMCTileFire
    sound:
      path: /Audio/_RMC14/Weapons/Guns/Flamer/gun_flamethrower2.ogg
  - type: Tag
    tags:
    - Grenade

