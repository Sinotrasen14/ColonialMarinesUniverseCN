- type: entity
  parent: ModularGrenade
  id: RMCCustomGrenade
  name: 定制手雷
  description: 一枚采用30毫米外壳的定制化学手雷。这一款设计用于适配下挂式榴弹发射器，但也可以用手投掷。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Grenades/custom_grenade.rsi
    layers:
    - state: unfinished
      map: ["enum.ConstructionVisuals.Layer"]
  - type: ExplosionResistance
    damageCoefficient: 0
  - type: IgnorePredictionHide
  - type: Clothing
    slots:
    - suitStorage
  - type: Destructible
    thresholds: []
  - type: ChangeItemSizeOnTimerTrigger
  - type: CancelUseWithCloak
  - type: CMVocalizeTrigger
  - type: Ammo # TODO being able to lock the grenade
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          start: {state: unfinished}
          caseWithTrigger: {state: unfinished}
          caseWithPayload: {state: unfinished}
          grenade: {state: icon}
      enum.Trigger.TriggerVisuals.VisualState:
        enum.ConstructionVisuals.Layer:
          Primed: {state: primed}
          # Unprimed: <Use state determined by enum.ConstructionVisuals.Layer>
  - type: Construction
    graph: RMCCustomGrenadeGraph
    node: start
  - type: ContainerContainer
    containers:
      payload: !type:Container
      payloadTrigger: !type:Container
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 4250 # large custom grenade = 7000

# Metal Foam Grenade
- type: entity
  parent: RMCCustomGrenade
  id: RMCGrenadeCustomMetalFoam
  name: 金属泡沫手雷
  description: 用于紧急封堵漏气处。
  suffix: RMC
  components:
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCGrenadeM40
    - RMCGrenadeMetalFoam
  - type: ContainerFill
    containers:
      payload:
      - RMCChemicalPayloadMetalFoam
      payloadTrigger:
      - RMCTimerTrigger
  - type: Construction
    graph: RMCCustomGrenadeGraph
    node: grenade
  - type: DeleteOnTrigger
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Effects/Chemistry/bubbles.ogg
      params:
        variation: 0.2
    positional: true

- type: entity
  parent: ChemicalPayload
  id: RMCChemicalPayloadMetalFoam
  name: 泡沫金属载荷
  description: 化学载荷。有空间存放两个烧杯。
  suffix: RMC
  components:
  - type: ContainerContainer
    containers:
      BeakerSlotA: !type:ContainerSlot
      BeakerSlotB: !type:ContainerSlot
  - type: ContainerFill
    containers:
      BeakerSlotA:
      - RMCBeakerMetalFoamAluminum
      BeakerSlotB:
      - RMCBeakerMetalFoamingAgent

- type: entity
  parent: CMBeaker
  id: RMCBeakerMetalFoamAluminum
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    solution:
      maxVol: 60
      reagents:
      - ReagentId: RMCAluminum
        Quantity: 30

- type: entity
  parent: CMBeaker
  id: RMCBeakerMetalFoamingAgent
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    solution:
      maxVol: 60
      reagents:
      - ReagentId: FoamingAgent
        Quantity: 10
      - ReagentId: PolytrinicAcid
        Quantity: 10

# Weedkiller
- type: entity
  parent: RMCGrenadeCustomMetalFoam
  id: RMCGrenadeCustomWeedkiller
  name: 除草剂手雷
  description: 用于清除大片区域的入侵植物物种。内容物处于加压状态。请勿直接吸入内容物。
  suffix: RMC
  components:
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCGrenadeM40
    - RMCGrenadeWeedkiller
  - type: ContainerFill
    containers:
      payload:
      - RMCChemicalPayloadWeedkiller
      payloadTrigger:
      - RMCTimerTrigger
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Effects/smoke.ogg
      params:
        variation: 0.2
    positional: true

- type: entity
  parent: RMCChemicalPayloadMetalFoam
  id: RMCChemicalPayloadWeedkiller
  name: 除草剂有效载荷
  components:
  - type: ContainerFill
    containers:
      BeakerSlotA:
      - RMCBeakerWeedkillerPlantBGone
      BeakerSlotB:
      - RMCBeakerWeedkillerPhosphorus

- type: entity
  parent: CMBeaker
  id: RMCBeakerWeedkillerPlantBGone
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    solution:
      maxVol: 60
      reagents:
      - ReagentId: PlantBGone
        Quantity: 25
      - ReagentId: RMCPotassium
        Quantity: 25

- type: entity
  parent: CMBeaker
  id: RMCBeakerWeedkillerPhosphorus
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    solution:
      maxVol: 60
      reagents:
      - ReagentId: RMCSugar
        Quantity: 25
      - ReagentId: RMCPhosphorus
        Quantity: 25

# Other
- type: entity
  parent: BaseFoam
  id: RMCSmokeChemical
  name: 烟雾
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _RMC14/Effects/transparent_smoke.rsi
    state: smoke2
  - type: TimedDespawn
    lifetime: 10
  - type: DeleteOnExplosion
  - type: Appearance
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: RMCGrenadeCustomMetalFoam
  id: RMCGrenadeMFHS
  # cmu edit start - cmss13-pve#854 rename
  name: M42 金属泡沫船体密封剂手雷
  description: 一种金属泡沫船体密封剂手雷，最初用于紧急船体维修，但后来在战场上被用于许多其他用途。它采用与 M40 HEDP 相同的外壳，释放出液态金属，迅速硬化成一道脆弱的临时墙。
  # cmu edit end
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Grenades/m40mfhs.rsi

- type: Tag
  id: RMCGrenadeWeedkiller

- type: Tag
  id: RMCGrenadeMetalFoam

- type: Tag
  id: RMCGrenadeMFHS
