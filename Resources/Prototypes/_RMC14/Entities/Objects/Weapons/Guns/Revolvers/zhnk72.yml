- type: entity
  parent: [RMCBaseSlideMagazineVisualsBallistic, RMCWeaponRevolverBase]
  id: RMCWeaponRevolverZHNK72
  name: ZHNK-72左轮手枪
  description: ZHNK-72 是一款由 UPP 设计的左轮手枪。ZHNK-72 被 UPP 武装部队用于警务用途，同时也有少量配发给高级士官。
  components:
  - type: Tag
    tags:
    - Sidearm
    - RMCRevolver
    - RMCWeaponRevolverZHNK72
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/zhnk72.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/zhnk72.rsi
  - type: RevolverAmmoProvider
    whitelist:
      tags:
      - RMCSpeedLoaderZHNK72
      - RMCCartridgeRevolverZHNK72
    proto: RMCCartridgeRevolverZHNK72
    capacity: 7
    chambers: [true, true, true, true, true, true, true]
    ammoSlots: [null, null, null, null, null, null, null]
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_cmb_1.ogg
    soundEmpty:
      path: /Audio/_RMC14/Weapons/Guns/gun_cmb_click1.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilWielded: 0
    recoilUnwielded: 3
    scatterWielded: 5
    scatterUnwielded: 12
    baseFireRate: 3.5
    burstScatterMult: 4
  - type: GunDamageModifier
    multiplier: 1.2
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCM5Bayonet
          - RMCAttachmentRecoilCompensator
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentExtendedCompensator
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS5MicroRedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS42xTelescopicMiniscope
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentLaserSight
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.75, 0.1
      rmc-aslot-rail: -0.14, 0.158
      rmc-aslot-underbarrel: 0.38, -0.17

