- type: entity
  parent: [RMCBaseSlideMagazineVisualsBallistic, RMCWeaponRevolverBase]
  id: RMCWeaponRevolverRSh9
  name: RSh-9突击左轮手枪
  description: RSh-9突击左轮手枪是一种非常罕见的武器，最初应反恐部队的要求为室内近战清房而设计。这一把使用的是较小的9x39子弹，而非其原本装填的12.7x55mm子弹，它依然堪称终极杀人装置。
  components:
  - type: Tag
    tags:
    - Sidearm
    - RMCRevolver
    - RMCWeaponRevolverRSh9
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/rsh9.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/rsh9.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/rsh9_fire.ogg
  - type: RevolverAmmoProvider
    whitelist:
      tags:
      - RMCSpeedLoaderRsh9
      - RMCCartridgeRevolverRsh9
    proto: RMCCartridgeRevolverRsh9
    capacity: 6
    chambers: [true, true, true, true, true, true]
    ammoSlots: [null, null, null, null, null, null]
  - type: GunDamageModifier
    multiplier: 1.1
  - type: RMCSelectiveFire
    baseFireRate: 1.2
    scatterWielded: 8
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.1
    accuracyMultiplierUnwielded: 0.75
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentRecoilCompensator
          - RMCAttachmentBarrelCharger
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentLaserSight
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.81, 0.099
      rmc-aslot-rail: 0.1573, 0.188
      rmc-aslot-underbarrel: 0.375, -0.1825

