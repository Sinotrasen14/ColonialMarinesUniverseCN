  categories: [HideSpawnMenu]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 40
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 22
      falloff: 9999
      ignoreModifiers: true
    - range: 7
      falloff: 5
  - type: CMArmorPiercing
    amount: 0

- type: Tag
  id: RMCMagazineSMGMP27

