- type: entity
  parent: CMBaseWeaponSMG
  name: MP27冲锋枪
  id: RMCWeaponSMGMP27
  description: MP27是一种可追溯至近一个世纪前的古老设计，在它那个年代十分常见。如今，它仅被有限地用作廉价的电脑打印复制品或家族传家宝。极其符合人体工程学且轻量化的设计使其易于大规模生产，操控性也好得出奇，但所使用的廉价材料明显损害了武器的散布。
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/mp27.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/mp27.rsi
  - type: Gun
    shotsPerBurst: 2
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_mp27.ogg
      params:
        volume: -1
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilWielded: 0.1
    recoilUnwielded: 1
    scatterWielded: 15
    scatterUnwielded: 16
    baseFireRate: 6.66
    burstScatterMult: 3.5
    modifiers:
      Burst:
        fireDelay: 0.0999
        maxScatterModifier: 10
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 6
      FullAuto:
        maxScatterModifier: 3
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 4
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1
    accuracyMultiplierUnwielded: 0.9
  - type: MagazineAmmoProvider
    autoEject: false
    soundAutoEject:
  - type: WieldableSpeedModifiers
    base: 0.725
    light: 1
    medium: 1
    heavy: 1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: RMCMagazineSMGMP27
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineSMGMP27
          - RMCMagazineSMGMP27Extend
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentRecoilCompensator
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentSuppressor
          - RMCAttachmentSuppressorCompact
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS5MicroRedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS42xTelescopicMiniscope
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentLaserSight
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentBipod
          - RMCAttachmentBurstFireAssembly
          - RMCAttachmentExtinguisher
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.840, 0.02
      rmc-aslot-rail: 0.06, 0.09
      rmc-aslot-underbarrel: 0.465, -0.31
  - type: GunDamageModifier
    multiplier: 1

- type: entity
  parent: CMMagazineRifleBase
  id: RMCMagazineSMGMP27
  name: MP27弹匣（4.6×30毫米）
  description: MP27的4.6毫米弹匣。可发射又大又重的子弹，对冲锋枪而言具有明显的冲击力，但同样也有明显的散布和精度损失。
  components:
  - type: Tag
    tags:
    - CMMagazineSmg
    - RMCMagazineSMGMP27
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - RMCCartridge46x30mm
    proto: RMCCartridge46x30mm
    capacity: 30
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/mp27.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
    zeroOnlyOnEmpty: true
  - type: Appearance

- type: entity
  parent: RMCMagazineSMGMP27
  id: RMCMagazineSMGMP27Extend
  name: MP27 加长弹匣（4.6×30毫米）
  description: 用于MP27的4.6毫米加长弹匣。发射大而重的子弹，对冲锋枪而言具有明显的冲击力，但同样有明显的散布和精度下降。
  components:
  - type: Tag
    tags:
    - CMMagazineSmg
    - RMCMagazineSMGMP27
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - RMCCartridge46x30mm
    proto: RMCCartridge46x30mm
    capacity: 40
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/mp27extend.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: CMCartridge10x20mm
  id: RMCCartridge46x30mm
  name: 弹药（4.6×30毫米冲锋枪）
  description: 用于MP27冲锋枪的4.6毫米弹药
  components:
  - type: Tag
    tags:
    - Cartridge
    - RMCCartridge46x30mm
  - type: CartridgeAmmo
    proto: RMCBullet46x30mm

- type: entity
