- type: entity
  parent: CMBaseWeaponSMG
  name: 钉枪
  id: WeaponNailgun
  description: 一种木工工具，用于将钉子钉入坚硬的表面。当然，如果那里什么都没有，那就只是一枚非常锋利的钉子以高速发射出去……
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/nailgun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-4
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/nailgun.rsi
  - type: Item
    size: Normal
  - type: Gun
    shotsPerBurst: 3
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/nailgun_fire.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilWielded: 1
    recoilUnwielded: 1
    scatterWielded: 6
    scatterUnwielded: 12
    baseFireRate: 2.4
    burstScatterMult: 3
    modifiers:
      Burst:
        fireDelay: 0.0999
        maxScatterModifier: 10
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 6
      FullAuto:
        maxScatterModifier: 3
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 4
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.25
    accuracyMultiplierUnwielded: 1.2
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: RMCMagazineSMGNailgun
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineSMGNailgun
  - type: GunDamageModifier
    multiplier: 1.2
  - type: Nailgun
  - type: GunGroupPenalty
    angleIncrease: 0
    recoil: 0
    damageMultiplier: 1
  - type: Tag
    tags:
    - RMCWeaponSMGNailgun

- type: entity
  parent: CMMagazineRifleBase
  id: RMCMagazineSMGNailgun
  name: "钉枪弹匣（7×45毫米）"
  description: "一个装有超大号塑钢钉的大型弹匣。遗憾的是，这些钉子的生产成本让大多数军事项目难以承受，只有某些特定的建筑项目才会用到它们。"
  components:
  - type: Tag
    tags:
    - CMMagazineSmg
    - RMCMagazineSMGNailgun
  - type: BallisticAmmoProvider
    cycleable: false
    whitelist:
      tags:
      - RMCCartridge7x45mm
    proto: RMCCartridge7x45mm
    capacity: 48
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/nailgun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-6
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 7
    zeroVisible: false
    zeroOnlyOnEmpty: true
  - type: Appearance
  - type: Item
    size: Small

- type: entity
  parent: CMCartridgeSMGBase
  id: RMCCartridge7x45mm
  name: 钉子（7×45毫米）
  components:
  - type: Tag
    tags:
    - Cartridge
    - RMCCartridge7x45mm
  - type: CartridgeAmmo
    proto: RMCNail7x45mm

- type: entity
  parent: RMCBaseBullet
  id: RMCNail7x45mm
  categories: [HideSpawnMenu]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 25
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 22
      falloff: 9999
      ignoreModifiers: true
    - range: 4
      falloff: 6
  - type: CMArmorPiercing
    amount: 25
  - type: RMCProjectileAccuracy
    accuracy: 100
    thresholds:
    - range: 5
      falloff: 10

- type: Tag
  id: RMCWeaponSMGNailgun

- type: Tag
  id: RMCMagazineSMGNailgun
