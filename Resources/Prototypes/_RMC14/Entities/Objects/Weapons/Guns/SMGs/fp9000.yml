- type: entity
  parent: CMBaseWeaponSMG
  name: FN FP9000 步枪
  id: RMCWeaponSMGFP9000
  description: 一种老旧设计，却经受住了时间的考验。一份泄露且未加密的3D打印图样，再加上极其坚固且制造成本相当低廉的框架，确保这款武器在一个多世纪里始终是边缘殖民地和私人安保公司的主力装备。
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/fp9000.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/fp9000.rsi
  - type: Gun
    shotsPerBurst: 3
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/pdw90_shot.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilWielded: 1
    recoilUnwielded: 1
    scatterWielded: 5
    scatterUnwielded: 14
    baseFireRate: 4
    burstScatterMult: 7
    modifiers:
      Burst:
        fireDelay: 0.0999
        maxScatterModifier: 1.75
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 6
      FullAuto:
        maxScatterModifier: 1.85
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 4
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.25
    accuracyMultiplierUnwielded: 0.75
  - type: MagazineAmmoProvider
    autoEject: false
    soundAutoEject:
  - type: WieldableSpeedModifiers
    base: 0.725
    light: 1
    medium: 1
    heavy: 1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: RMCMagazineSMGFP9000
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineSMGFP9000
  - type: AttachableHolder
    randomAttachmentChance: 0
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentRecoilCompensator
          - RMCM5Bayonet
      rmc-aslot-rail:
        locked: true
        startingAttachable: RMCAttachmentFP9000Scope
        whitelist:
          tags:
          - RMCAttachmentFP9000Scope
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentLaserSight
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: 0.06, .15
      rmc-aslot-barrel: 0.81, 0.04
      rmc-aslot-underbarrel: 0.58, -0.25
  - type: GunDamageModifier
    multiplier: 1

- type: entity
  parent: RMCWeaponSMGFP9000
  name: FN FP9000/2 步枪
  id: RMCWeaponSMGFP9000PMC
  description: 尽管设计相当古老，FN FP9K 仍因其极高的可靠性和多功能性而在 PMC 小队中被频繁使用，使其能在任何情况下表现出色，尤其是因为他们使用的是该枪获得专利的官方版本，而该版本的设计随时间推移经过了多次升级与调校。
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/fp9000pmc.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/fp9000pmc.rsi
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.35
    accuracyMultiplierUnwielded: 0.75
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: RMCMagazineSMGFP9000
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineSMGFP9000
  - type: AttachableHolder
    randomAttachmentChance: 0.65
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentRecoilCompensator
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS5MicroRedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentMagneticHarness
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentLaserSight

- type: entity
  parent: CMMagazineRifleBase
  id: RMCMagazineSMGFP9000
  name: "FN FP9000 弹匣（5.7×28毫米）"
  description: "用于 FN FP9000 冲锋枪的 5.7×28 毫米弹匣。"
  components:
  - type: Tag
    tags:
    - CMMagazineSmg
    - RMCMagazineSMGFP9000
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - RMCCartridge57x28mmFP9000
    proto: RMCCartridge57x28mmFP9000
    capacity: 50
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/fp9000.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
    zeroOnlyOnEmpty: true
  - type: Appearance
  - type: RefillableByBulletBox
    bulletType: CMUBoxBulletsSMGP90
- type: entity
  parent: CMCartridge10x20mm
  id: RMCCartridge57x28mmFP9000
  name: 弹药（57×28mm冲锋枪）
  description: FN FP9000冲锋枪的5.7×28mm弹匣。
  components:
  - type: Tag
    tags:
    - Cartridge
    - RMCCartridge57x28mmFP9000
  - type: CartridgeAmmo
    proto: RMCBullet57x28mmFP9000

- type: entity
  parent: Bullet10x20mm
  id: RMCBullet57x28mmFP9000
  categories: [HideSpawnMenu]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 30
  - type: CMArmorPiercing
    amount: 30
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 24
      falloff: 9999
      ignoreModifiers: true
    - range: 7
      falloff: 4
  - type: RMCProjectileAccuracy
    accuracy: 105
    thresholds:
    - range: 16
      falloff: 10

- type: Tag
  id: RMCMagazineSMGFP9000

- type: Tag
  id: RMCCartridge57x28mmFP9000
