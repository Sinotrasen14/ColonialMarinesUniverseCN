- type: entity
  parent: CMBaseWeaponSMG # TODO RMC14 UZI CAN JAM
  name: 乌兹
  id: RMCWeaponSMGUZI
  description: 出口到90多个国家，不知怎么的，这件老古董竟然流落到了这里。用起来再简单不过了。
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/uzi.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Normal
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/uzi.rsi
    slots:
    - suitStorage
    - Back
    - belt
    - pocket
  - type: Gun
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_uzi.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - FullAuto
    recoilWielded: 0
    recoilUnwielded: 1
    scatterWielded: 8
    scatterUnwielded: 11
    baseFireRate: 7.5
    burstScatterMult: 3
    modifiers:
      FullAuto:
        maxScatterModifier: 4
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 50
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.1
    accuracyMultiplierUnwielded: 0.9
  - type: MagazineAmmoProvider
    autoEject: false
    soundAutoEject:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: RMCMagazineSMGUZI
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineSMGUZI
          - RMCMagazineSMGUZIExt
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentRecoilCompensator
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentSuppressor
          - RMCAttachmentSuppressorCompact
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS5MicroRedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS42xTelescopicMiniscope
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentBurstFireAssembly
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.71, 0.065
      rmc-aslot-rail: 0, 0.15
      rmc-aslot-underbarrel: 0.3, -0.31
  - type: GunDamageModifier
    multiplier: 1.1

- type: entity
  parent: CMMagazineRifleBase
  id: RMCMagazineSMGUZI
  name: UZI弹匣（9×21毫米）
  description: UZI的9×21毫米弹匣。看起来挺小的，是吧？再大点可能会导致供弹错误。
  components:
  - type: Tag
    tags:
    - CMMagazineSmg
    - RMCMagazineSMGUZI
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - RMCCartridge9x21mmSMGUZI
    proto: RMCCartridge9x21mmSMGUZI
    capacity: 25
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/uzi.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
    zeroOnlyOnEmpty: true
  - type: Appearance

- type: entity
  parent: RMCMagazineSMGUZI
  id: RMCMagazineSMGUZIExt
  name: UZI 扩容弹匣（9×21mm）
  components:
  - type: BallisticAmmoProvider
    capacity: 32
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/uziextended.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Tag
    tags:
    - CMMagazineSmg
    - RMCMagazineSMGUZIExt

- type: entity
  parent: CMCartridge9mmSMG
  id: RMCCartridge9x21mmSMGUZI
  description: 一种用于乌兹冲锋枪的9×21毫米枪弹。
  components:
  - type: Tag
    tags:
    - Cartridge
    - RMCCartridge9x21mmSMGUZI
  - type: CartridgeAmmo
    proto: Bullet9x21mmUZI

- type: entity
  parent: Bullet10x20mm
  id: Bullet9x21mmUZI
  categories: [HideSpawnMenu]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 35
  - type: CMArmorPiercing
    amount: 5

- type: Tag
  id: RMCMagazineSMGUZI

- type: Tag
  id: RMCCartridge9x21mmSMGUZI

- type: Tag
  id: RMCMagazineSMGUZIExt
