- type: entity
  parent: CMBaseWeaponSMG
  name: 19型冲锋枪
  id: RMCWeaponSMGType19
  description: 一种过时但可靠且威力强大的冲锋枪，源自进步人民联盟，如今仍在UPP中有限服役，但最常由准军事组织或企业安保部队使用。它通常使用35发直弹匣或71发弹鼓。
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/type19.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Normal
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/type19.rsi
  - type: Gun
    shotsPerBurst: 3
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/pdw90_shot.ogg # TODO SMG HEAVY Sound
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilWielded: 0.1
    recoilUnwielded: 1
    scatterWielded: 10
    scatterUnwielded: 16
    baseFireRate: 6.666
    burstScatterMult: 7
    modifiers:
      Burst:
        fireDelay: 0.0980
        maxScatterModifier: 10
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 6
      FullAuto:
        maxScatterModifier: 3
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 4
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.15
    accuracyMultiplierUnwielded: 0.75
  - type: MagazineAmmoProvider
    autoEject: false
    soundAutoEject:
  - type: WieldableSpeedModifiers
    base: 0.725
    light: 1
    medium: 1
    heavy: 1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: RMCMagazineSMGType19
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineSMGType19
          - RMCMagazineSMGType19Drum
  - type: AttachableHolder
    randomAttachmentChance: 0.1
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentRecoilCompensator
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentSuppressor
          - RMCAttachmentSuppressorCompact
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5MicroRedDotSight
          - RMCAttachmentS5RedDotSight
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentLaserSight
          - RMCAttachmentVerticalGrip
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.8, 0.095
      rmc-aslot-rail: -0.125, 0.15
      rmc-aslot-underbarrel: 0.475, -0.19
  - type: GunDamageModifier
    multiplier: 1.2

- type: entity
  parent: CMMagazineRifleBase
  id: RMCMagazineSMGType19
  name: 19式长弹匣（7.62×25毫米）
  description: 19式冲锋枪的35发长弹匣。
  components:
  - type: Tag
    tags:
    - CMMagazineSmg
    - RMCMagazineSMGType19
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - RMCCartridge762x25mm
    proto: RMCCartridge762x25mm
    capacity: 35
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/type19.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
    zeroOnlyOnEmpty: true
  - type: Appearance
  - type: RefillableByBulletBox
    bulletType: CMUBoxBulletsSMGType19

