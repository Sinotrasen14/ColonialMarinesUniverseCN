- type: entity
  parent: [RMCBaseWeaponShotgun, RMCBaseAttachableHolder]
  name: XM38战术霰弹枪
  id: RMCWeaponShotgunXM38
  description: 早在2168年，Wey-Yu就开始测试MK221。USCM获得了一台早期原型，后来通过一份有限军事合同采用了它。但USCM特种作战部队并不满意，并对他们能接触到的早期原型进行了迭代改进；最终，他们内部的军械师和修械匠造出了MK210，定名为XM38，一种可扣在腰带上的轻量折叠霰弹枪。而且，它还是全自动的，由冲压金属制成，并保留了下挂式榴弹发射器。真是一项工程奇迹。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Shotguns/xm38.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Shotguns/xm38.rsi
    slots:
    - suitStorage
    - belt
  - type: Gun
    soundGunshot:
      collection: RMCXM38Shoot
  - type: ShootUseDelay
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - FullAuto
    recoilWielded: 2
    recoilUnwielded: 4
    scatterWielded: 10
    scatterUnwielded: 20
    baseFireRate: 1.666
    burstScatterMult: 5
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.20
    accuracyMultiplierUnwielded: 0.95
  - type: RMCMagneticItem
  - type: GunDamageModifier
    multiplier: 1
  - type: BallisticAmmoProvider
    cycleable: false
    whitelist:
      tags:
      - RMCShellShotgun
    capacity: 10
  - type: AttachableHolder
    slots:
