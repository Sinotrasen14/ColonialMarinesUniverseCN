- type: entity
  parent: RMCBaseWeaponSniperRifle
  id: CMM96SSniperRifle
  name: M42A 带瞄准镜步枪
  description: "ARMAT制造的重型狙击步枪。它配有瞄准镜系统，可从15发弹匣中发射穿甲弹。“以优势火力求和平”"
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Snipers/m96s/desert.rsi
    layers:
    - state: bolt-open
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
    - sprite: _RMC14/Objects/Weapons/Guns/Attachments/barrel.rsi
      state: sniperbarrel
      offset: 0.715, 0.025
  - type: Item
    size: Large
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Snipers/m96s/desert.rsi
  - type: Tag
    tags:
    - CMM96SSniperRifle
  - type: GunUserWhitelist # CMU14
    whitelist:
      components:
      - SniperWhitelist
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
  - type: Gun
    shotsPerBurst: 1
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_sniper.ogg
  - type: RMCSelectiveFire
    recoilWielded: 1
    scatterWielded: 0
    baseFireRate: 0.667
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 3
  - type: WieldDelay
    baseDelay: 1.2
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: CMMagazineSniperM96S
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mar40_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mar40_unload.ogg
        priority: 2
        whitelist:
          tags:
          - CMMagazineSniperM96S
  - type: GunRequiresWield
  - type: Corrodible
    isCorrodible: false
  - type: GunIFF
    enabled: false # true
  - type: RMCNameItemOnVend
    item: PrimaryGun
  - type: AttachableHolder
    slots:
      rmc-aslot-rail:
        locked: true
        startingAttachable: RMCM96SIntegratedScope
        whitelist:
          tags:
          - RMCM96SIntegratedScope
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentBipod
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-underbarrel: 0.21875, -0.343
  - type: ItemCamouflage
    camouflageVariations:
      Jungle: _RMC14/Objects/Weapons/Guns/Snipers/m96s/jungle.rsi
      Desert: _RMC14/Objects/Weapons/Guns/Snipers/m96s/desert.rsi
      Snow: _RMC14/Objects/Weapons/Guns/Snipers/m96s/snow.rsi
      Classic: _RMC14/Objects/Weapons/Guns/Snipers/m96s/classic.rsi
      Urban: _RMC14/Objects/Weapons/Guns/Snipers/m96s/urban.rsi
  - type: RMCGunChamber
    enabled: false
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
      - CMUPathogenWalker

- type: entity
  parent: BaseItem
  id: CMMagazineSniperM96S
  name: "M42A 精确射手弹匣（10×28毫米）"
  description: 狙击步枪弹药弹匣。用其进行瞄准射击会造成显著伤害。
  components:
  - type: Tag
    tags:
    - CMMagazineSniper
    - CMMagazineSniperM96S
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CMCartridgeSniper10x28mm
    proto: CMCartridgeSniper10x28mm
    capacity: 15
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m42c.rsi
    layers:
    - state: mag-0
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
    zeroOnlyOnEmpty: true
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Appearance
  - type: Clothing
    slots:
    - suitStorage

- type: entity
  parent: CMMagazineSniperM96S
  id: CMMagazineSniperM96SIncendiary
  name: "M42A 燃烧弹弹匣（10×28毫米）"
  description: 狙击步枪弹药弹匣。用它进行瞄准射击会暂时致盲目标，并让烈焰燃烧得更旺。
  components:
  - type: BallisticAmmoProvider
    proto: CMCartridgeSniper10x28mmIncendiary
    capacity: 15
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m42c.rsi
    layers:
    - state: mag-0
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: band_e # TODO RMC14 band non e
      color: "#9C2219"

- type: entity
  parent: CMMagazineSniperM96S
