- type: entity
  parent: RMCM96SIntegratedScope
  id: RMCVultureScope
  name: M707 集成瞄准镜
  description: M707“秃鹰”的固定光学套件。
  components:
  - type: Sprite
    state: vulture_scope
  - type: AttachableVisuals
    suffix: ""
  - type: Tag
    tags:
    - RMCAttachmentRail
    - RMCVultureScope
  - type: AttachableToggleable
    actionId: RMCActionVultureScope
    icon:
      sprite: _RMC14/Actions/marine_sniper_actions.rsi
      state: zoom_scope
    iconActive:
      sprite: _RMC14/Actions/marine_sniper_actions.rsi
      state: unzoom_scope
    actionName: M707 Vulture Scope
    actionDesc: Use the Vulture's integrated scope.
  - type: Scope
    scopingToggleAction:
    cycleZoomLevelAction: RMCActionVultureCycleZoomLevel
    zoomLevels:
    - name: 8倍
      zoom: 1.8
      offset: 15
      allowMovement: false
      doAfter: 0
    - name: 4倍
      zoom: 1.2
      offset: 15
      allowMovement: false
      doAfter: 0
  - type: Appearance
  - type: ItemCamouflage
    states:
      Jungle: vulture_scope
      Desert: d_vulture_scope
      Snow: s_vulture_scope
      Classic: c_vulture_scope
      Urban: u_vulture_scope

