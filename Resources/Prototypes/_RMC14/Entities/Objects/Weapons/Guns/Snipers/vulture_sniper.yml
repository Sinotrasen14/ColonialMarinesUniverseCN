- type: entity
  parent: CMMagazineSniperM96S
  id: RMCMagazineSniperM707Vulture
  name: M707“秃鹫”弹匣（20×102毫米）
  description: M707“秃鹫”使用的20×102毫米反器材弹药四发弹匣。
  components:
  - type: Tag
    tags:
    - CMMagazineSniper
    - RMCMagazineSniperM707Vulture
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - RMCCartridgeSniper20x102mmVulture
    proto: RMCCartridgeSniper20x102mmVulture
    capacity: 4
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/vulture.rsi
    layers:
    - state: mag-0
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: CMCartridgeSniper10x28mm
  id: RMCCartridgeSniper20x102mmVulture
  name: 炮弹（20x102mm）
  components:
  - type: Tag
    tags:
    - Cartridge
    - RMCCartridgeSniper20x102mmVulture
  - type: CartridgeAmmo
    proto: RMCBulletSniper20x102mmVulture

- type: entity
  parent: RMCBaseBullet
  id: RMCBulletSniper20x102mmVulture
  name: 子弹（20x102mm）
  categories: [HideSpawnMenu]
  components:
  - type: FlyBySound
    prob: 1
    range: 4
    sound:
      collection: BulletMiss
      params:
        volume: 16
        referenceDistance: 8
        maxDistance: 24
        variation: 0.05
  - type: VultureProjectile
  - type: DamageImpactProfile
    projectile:
      contact: Generic
      penetration: Forced
      energy: Severe
  - type: Fixtures
    fixtures:
      projectile:
        shape: !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 2.5
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: false
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Piercing: 550
        Blunt: 25
        Structural: 1800
    soundHit:
      path: /Audio/_RMC14/Bullets/bullet_vulture_impact.ogg
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 32
      falloff: 9999
      ignoreModifiers: true
  - type: CMArmorPiercing
    amount: 70
  - type: RMCPenetratingProjectile
    range: 40
    rangeLossPerHit: 3
    damageMultiplierLossPerHit: 0.18
  - type: RMCStoppingPower
  - type: RMCStunOnHit
    stuns:
    - maxRange: 32
      knockBackPowerMin: 6
      knockBackPowerMax: 6
      knockBackSpeed: 8
      stunTime: 0
      superSlowTime: 0
      slowTime: 3
  - type: RMCProjectileAccuracy
    accuracy: 125
    thresholds:
    - range: 32
      falloff: 10
    - range: 10
      falloff: 15
      buildup: true
  - type: AimedShotEffect
    extraHits: 0.8

- type: entity
  parent: RMCBarrelAttachmentBase
