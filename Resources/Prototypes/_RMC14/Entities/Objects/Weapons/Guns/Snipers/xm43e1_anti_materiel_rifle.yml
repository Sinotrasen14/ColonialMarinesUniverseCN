- type: entity
  parent: RMCBaseWeaponSniperRifle
  id: RMCXM43E1AntiMaterielRifle
  name: XM43E1反器材步枪
  description: 由 AEGIS Armaments 生产的一种实验型反器材步枪，最近从一座废弃原型设施的深层仓库中重新回收。这一把目前正在进行实地测试。采用 10×99 毫米无壳弹。此武器能穿透薄金属板和墙壁，不过在此过程中会丧失大部分杀伤力。它甚至可用于爆破作业，已知有经验的使用者仅用一个标准弹匣的 10×99 毫米弹药，就能在野外拆解实心加固墙体的分段。在没有炸药或工程师的情况下，他们转而用 8 发子弹中的每一发来破坏关键结构支撑，在此过程中将墙体拆开。
  components:
  - type: GuideHelp
    guides:
    - RMCGuideRoleSpecSniper
  - type: GunUserWhitelist # CMU14
    whitelist:
      components:
      - SniperWhitelist
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Snipers/xm43e1/xm43e1_inhands.rsi
    layers:
    - state: base
      sprite: _RMC14/Objects/Weapons/Guns/Snipers/xm43e1/xm43e1_icon.rsi
    - state: bolt-open
      sprite: _RMC14/Objects/Weapons/Guns/Snipers/xm43e1/xm43e1_icon.rsi
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      sprite: _RMC14/Objects/Weapons/Guns/Snipers/xm43e1/xm43e1_icon.rsi
      map: ["enum.GunVisualLayers.Mag"]
#    - sprite: _RMC14/Objects/Weapons/Guns/Attachments/barrel.rsi
#      state: pmc_sniperbarrel
#      offset: 0.500, 0.050
  - type: Item
    size: Large
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Snipers/xm43e1/xm43e1_inhands.rsi
  - type: Tag
    tags:
    - RMCXM43E1AntiMaterielRifle
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
  - type: Gun
    shotsPerBurst: 1
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_sniper_heavy.ogg
  - type: RMCSelectiveFire
    recoilWielded: 1
    scatterWielded: 0
    baseFireRate: 0.335
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 3
  - type: WieldDelay
    baseDelay: 1.2
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: RMCMagazineSniperXM43E1AntiMateriel
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mar40_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mar40_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineXM43E1
  - type: GunRequiresWield
  - type: Corrodible
    isCorrodible: false
  - type: GunIFF
    enabled: true
  - type: RMCNameItemOnVend
    item: PrimaryGun
  - type: AttachableHolder
    slots:
      rmc-aslot-rail:
        locked: true
        startingAttachable: RMCXM43E1IntegratedScope
        whitelist:
          tags:
          - RMCXM43E1IntegratedScope
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentBipod
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-underbarrel: 0.21875, -0.343
  - type: AimedShot
    aimDuration: 2
    aimedShotCooldown: 4.5
  - type: TargetingLaser
  - type: RMCFocusedShooting
  - type: RMCGunChamber
    enabled: false
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
      - CMUPathogenWalker

- type: entity
  parent: CMMagazineSniperM96S
  id: RMCMagazineSniperXM43E1AntiMateriel
  name: XM43E1 精确射手弹匣（10×99毫米）
  description: 一匣无壳10×99毫米反器材弹，能够穿透大多数步兵级装备。取决于你击中的目标，它甚至可能有足够能量伤及目标后方的任何东西。
  components:
  - type: Tag
    tags:
    - RMCMagazineXM43E1
    - CMMagazineSniper
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - RMCCartridgeSniper10x99mmAntiMateriel
    proto: RMCCartridgeSniper10x99mmAntiMateriel
    capacity: 8
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/xm43e1.rsi
    layers:
    - state: mag-0
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: CMCartridgeSniper10x28mm
  id: RMCCartridgeSniper10x99mmAntiMateriel
  name: 弹药筒（10x99mm）（反器材）
  components:
  - type: Tag
    tags:
    - Cartridge
    - RMCCartridgeSniper10x99mmAntiMateriel
  - type: CartridgeAmmo
    proto: RMCBulletSniper10x99mmAntiMateriel
    deleteOnSpawn: true # CMU14: caseless ammo, no casing to eject

- type: entity
  parent: CMBulletSniper10x28mm
  id: RMCBulletSniper10x99mmAntiMateriel
  name: 子弹（10×99毫米）
  categories: [HideSpawnMenu]
  components:
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Piercing: 125
        Structural: 1275
  - type: DamageImpactProfile
    projectile:
      contact: Generic
      penetration: Forced
      energy: Severe
  - type: CMArmorPiercing
    amount: 75
  - type: RMCPenetratingProjectile
  - type: RMCStoppingPower
  - type: AimedShotEffect
    extraHits: 0.8

- type: Tag
  id: RMCXM43E1AntiMaterielRifle

- type: Tag
  id: RMCMagazineXM43E1

- type: Tag
  id: RMCCartridgeSniper10x99mmAntiMateriel
