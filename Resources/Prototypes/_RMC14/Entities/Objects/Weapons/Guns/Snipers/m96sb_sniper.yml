- type: entity
  parent: RMCBaseWeaponSniperRifle
  id: RMCM96SBSniperRifle
  name: M96S-B 带瞄准镜的消音步枪
  description: "由AEGIS军械公司制造的重型狙击步枪。经过一体式消音器改装，配有瞄准镜系统，可从15发弹匣中发射穿甲弹。“以优势火力实现和平”"
  components:
  - type: GuideHelp
    guides:
    - RMCGuideRoleSpecSniper
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Snipers/m96s/urban.rsi # TODO RMC14 duplicate this and revise on its own as m96sb.rsi when urban back sprites are fixed
    layers:
    - state: bolt-open
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
    - sprite: _RMC14/Objects/Weapons/Guns/Attachments/barrel.rsi
      state: suppressed_sniper_barrel
      offset: 0.715, 0.025
  - type: Item
    size: Large
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Snipers/m96s/urban.rsi
  - type: Tag
    tags:
    - CMM96SSniperRifle
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
  - type: Gun
    shotsPerBurst: 1
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_sniper.ogg
  - type: RMCSelectiveFire
    recoilWielded: 1
    scatterWielded: 0
    baseFireRate: 0.667
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 3
  - type: WieldDelay
    baseDelay: 1.2
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: CMMagazineSniperM96S
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mar40_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mar40_unload.ogg
        priority: 2
        whitelist:
          tags:
          - CMMagazineSniperM96S
  - type: GunUserWhitelist # CMU14
    whitelist:
      components:
      - SniperWhitelist
  - type: GunRequiresWield
  - type: Corrodible
    isCorrodible: false
  - type: GunIFF
    enabled: false
  - type: RMCNameItemOnVend
    item: PrimaryGun
  - type: AttachableHolder
    slots:
      rmc-aslot-rail:
        locked: true
        startingAttachable: RMCM96SIntegratedScope
        whitelist:
          tags:
          - RMCM96SIntegratedScope
      rmc-aslot-barrel:
        locked: true
        startingAttachable: RMCAttachmentSuppressorM96SB # TODO RMC14 unique barrel visuals
        whitelist:
          tags:
          - RMCAttachmentSuppressorM96SB
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentBipod
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-underbarrel: 0.21875, -0.343
  - type: RMCGunChamber
    enabled: false
