- type: entity
  parent: CMMagazineRifleBase
  id: RMCMagazineSentry
  name: "M30弹鼓（10×28毫米无壳弹）"
  # cmu edit start: no UA/UN prefix on sentry descriptions
  description: "一个用于571-C哨戒炮的弹鼓，装有500发10×28毫米无壳弹。当其弹药耗尽时，只需将其送入哨戒炮的供弹口即可。"
  # cmu edit end
  components:
  - type: Item
    size: Normal
  - type: Tag
    tags:
    - RMCMagazineSentry
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - RMCCartridgeSentry
    proto: RMCCartridgeSentry
    capacity: 500
    cycleable: false
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/un571c.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
    zeroOnlyOnEmpty: true
  - type: Appearance

- type: entity
  parent: CMMagazineRifleBase
  id: RMCMagazineSentryShotgun
  name: "12号霰弹弹鼓"
  # cmu edit start: no UA/UN prefix on sentry descriptions
  description: "一个装有50发12号鹿弹的弹鼓，用于12号霰弹哨戒炮。只需在哨戒炮弹药耗尽时将其装入哨戒炮的弹药口。"
  # cmu edit end
  components:
  - type: Tag
    tags:
    - RMCMagazineSentryShotgun
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - RMCShellShotgunBuckshot
    proto: CMShellShotgunBuckshot
    capacity: 50
    cycleable: false
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/un12g.rsi


