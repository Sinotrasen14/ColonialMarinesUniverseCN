- type: entity
  parent: RMCBaseWeaponLMG
  name: QYJ-72通用机枪
  id: RMCWeaponLMGQYJ72
  description: QYJ-72是进步人民联盟的制式通用机枪，采用7.62×54毫米R口径，发射威力强劲的枪弹，且射速很高。它配有容量达250发的超大弹箱，QYJ-72的设计将压制火力和以火力密度保证精度置于首位。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/LMGs/qyj_72/qyj_72_inhands.rsi
    layers:
    - state: base
      sprite: _RMC14/Objects/Weapons/Guns/LMGs/qyj_72/qyj_72_icon.rsi
    - state: bolt-open
      sprite: _RMC14/Objects/Weapons/Guns/LMGs/qyj_72/qyj_72_icon.rsi
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      sprite: _RMC14/Objects/Weapons/Guns/LMGs/qyj_72/qyj_72_icon.rsi
      map: ["enum.GunVisualLayers.Mag"]
    - state: cover-closed
      sprite: _RMC14/Objects/Weapons/Guns/LMGs/qyj_72/qyj_72_icon.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/LMGs/qyj_72/qyj_72_inhands.rsi
  - type: Tag
    tags:
    - RMCWeaponLMGQYJ72
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    shotsPerBurst: 6
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_m60.ogg
      params:
        volume: -4
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilWielded: 0
    recoilUnwielded: 0
    scatterWielded: 1
    scatterUnwielded: 1
    baseFireRate: 3.6
    burstScatterMult: 3
    modifiers:
      Burst:
        fireDelay: 0.35
        maxScatterModifier: 10
        shotsToMaxScatter: 6
      FullAuto:
        fireDelay: 0.01
        maxScatterModifier: 3
        shotsToMaxScatter: 6
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: RMCMagazineLMGQYJ72
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineLMGQYJ72
  - type: GunDamageModifier
    multiplier: 1
  # - type: UniqueAction
  # - type: BreechLoaded
  #   needOpenClose: false
  # - type: Appearance
  # - type: GenericVisualizer
  #   visuals:
  #     enum.BreechVisuals.Open:
  #       enum.BreechVisuals.Open:
  #         True: { state: cover-open }
  #         False: { state: cover-closed }
  - type: AttachableHolder
    slots:
      rmc-aslot-rail:
        startingAttachable: RMCAttachmentTwoPointSling
        whitelist:
          tags:
          - RMCAttachmentS42xTelescopicMiniscope
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
      rmc-aslot-underbarrel:
        startingAttachable: RMCAttachmentBipod
        whitelist:
          tags:
          - RMCAttachmentBipod
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: -0.1875, 0.125
      rmc-aslot-underbarrel: 0.418, -0.283
  - type: Wieldable
  - type: GunRequiresWield
  - type: Corrodible
    isCorrodible: false
  - type: SmartGun
  - type: RMCMagneticItem

- type: entity
  parent: RMCMagazineLMGBase
  id: RMCMagazineLMGQYJ72
  name: "QYJ-72 弹药箱（7.62×54mmR）"
  components:
  - type: Tag
    tags:
    - RMCMagazineLMG
    - RMCMagazineLMGQYJ72
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - RMCCartridgeLMGQYJ72
    proto: RMCCartridgeLMGQYJ72
    capacity: 250
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/qyj_72.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance

- type: entity
  parent: RMCCartridgeRifleAR10
  id: RMCCartridgeLMGQYJ72
  name: 枪弹（7.62×54mmR）
  description: 一发7.62×54mmR枪弹
  components:
  - type: Tag
    tags:
    - Cartridge
    - RMCCartridgeLMGQYJ72
  - type: CartridgeAmmo
    proto: RMCBulletLMGQYJ72

- type: entity
  parent: RMCBaseBullet
  id: RMCBulletLMGQYJ72
  categories: [HideSpawnMenu]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 40
  - type: DamageImpactProfile
    projectile:
      contact: Generic
      penetration: Medium
      energy: Medium
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 22
      falloff: 9999
      ignoreModifiers: true
  - type: CMArmorPiercing
    amount: 30
  - type: RMCProjectileAccuracy
    accuracy: 95
    thresholds:
    - range: 14
      falloff: 10

- type: Tag
  id: RMCWeaponLMGQYJ72

- type: Tag
  id: RMCMagazineLMGQYJ72

- type: Tag
  id: RMCCartridgeLMGQYJ72
