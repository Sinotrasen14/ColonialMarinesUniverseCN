- type: entity
  abstract: true
  id: RMCBaseWeaponMount
  name: 武器挂架
  description: 用于放置武器的挂架
  components:
  - type: Appearance
  - type: Corrodible
    isCorrodible: false
  - type: Strap
    whitelist: {components: [Marine]}
    position: Stand
    buckleSound: /Audio/_RMC14/Weapons/Guns/Reload/hpr_reload.ogg
    unbuckleSound: /Audio/_RMC14/Weapons/Guns/Reload/hpr_unload.ogg
    buckledAlertType:
    buckleOffset: "0,0.5"
  - type: WeaponMount
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49, 0.05"
        density: 5
        mask:
        - FullTileMask
        layer:
        - BarricadeImpassable
  - type: RMCRepairable
    heal: 40
    skill: RMCSkillConstruction
    delay: 8
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: RMCMesonsNonviewable
  - type: DamageExaminable
  - type: RMCHealthExaminable
    speciesType: Mechanical
  - type: Sprite
    drawdepth: Mobs
    noRot: true
  - type: RequireProjectileTarget

- type: entity
  parent: RMCBaseWeaponMount
  id: RMCML66DNestSandbag
  name: 带瞄准镜的M56D重型机枪巢
  description: 一架带瞄准镜的M56D重型机枪架设在一个配有沙袋的小型加固支柱上，为你的一切防御需求提供一个小型机枪巢。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/HMGs/ML66D/mount.rsi
    state: towergun
  - type: Transform
    anchored: true
  - type: RMCLungeProtection
  - type: DirectionalAttackBlocker
  - type: RMCLeapProtection
    inherentStunDuration: 3
    fullProtection: true
  - type: WeaponMount
    fixedWeaponPrototype: "RMCSmartGunMountedStatic"
    isWeaponSecured: true
    isWeaponLocked: true
  - type: Physics
    bodyType: Static

- type: entity
  parent: RMCML66DNestSandbag
  id: RMCML66DNestMetal
  name: 带瞄准镜的M56D重型机枪
  description: 一把带瞄准镜的M56D重型机枪，安装在金属盾牌后方。
  components:
  - type: Sprite
    state: towergun_folding

- type: entity
  parent: RMCML66DNestMetal
  id: RMCML66DNestDropship
  suffix: Dropship
  categories: [HideSpawnMenu]
  components:
  - type: Fixtures # CMU14
    fixtures: {}
  - type: Physics # CMU14: empty fixtures make init disable collision; declared so saves match
    canCollide: false
  - type: WeaponMount
    occupiedDrawDepth: Overdoors
    emptyDrawDepth: Overdoors

- type: entity
  parent: RMCML66DNestDropship
  id: CMUM2CDoorGunDropship
  name: M2C重机枪
  suffix: Dropship
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/HMGs/m2c.rsi
    layers:
    - state: m2c
      map: ["enum.WeaponMountComponentVisualLayers.Mounted"]
      visible: false
    - state: m2c_magazine
      map: ["enum.WeaponMountComponentVisualLayers.MountedAmmo"]
      visible: false
    - state: m2c_overheat
      map: ["enum.WeaponMountComponentVisualLayers.Overheated"]
      visible: false
  - type: WeaponMount
    fixedWeaponPrototype: CMUMachineGunM2CDropshipLoaded
    isWeaponSecured: true
    isWeaponLocked: true
    canRotateWithoutTool: true
    mountExclusionAreaSize: 0
    barricadeExclusionAreaSize: 0
    occupiedDrawDepth: Overdoors
    emptyDrawDepth: Overdoors

- type: entity
  parent: [RMCBaseWeaponMount, BaseDeployFoldable, BaseItem]
  id: RMCML66DMount
  name: M56D架子
  description: 一种用于M56D的可折叠支架，可为M56D提供稳定性。
  suffix: Folded
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/HMGs/ML66D/mount.rsi
    state: folded_mount
    layers:
    - state: ml66d_mount
      map: ["unfoldedLayer"]
    - state: folded_mount
      map: ["foldedLayer"]
      visible: false
    - state: ml66d
      map: ["enum.WeaponMountComponentVisualLayers.Mounted"]
      visible: false
    - state: ml66d_magazine
      map: ["enum.WeaponMountComponentVisualLayers.MountedAmmo"]
      visible: false
    - state: ml66d_gun_mount
      map: ["enum.WeaponMountComponentVisualLayers.Folded"]
      visible: false
    - state: ml66d_gun_mount_magazine
      map: ["enum.WeaponMountComponentVisualLayers.FoldedAmmo"]
      visible: false
  - type: Foldable
    folded: true
    enableStrapOnUnfold: false
  - type: Anchorable
    tool: Screwing
  - type: Rotatable
  - type: Strap
    enabled: false
  - type: Clothing
    slots:
    - suitStorage
    - Back
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:EmptyContainersBehaviour
        containers:
        - weapon
  - type: CollisionWake
  - type: Tag
    tags:
    - ML66DMount
  - type: WeaponMount
    mountableWhitelist:
      tags:
      - RMCSmartGunMounted

- type: entity
  parent: RMCML66DMount
  id: RMCML66DMountAssembled
  name: M56D重型机枪
  description: 可部署的重型机枪。它发射特制钨弹，以提升穿甲能力。
  suffix: Folded, Assembled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/HMGs/ML66D/mount.rsi
    state: folded_mount
    layers:
    - state: ml66d_mount
      map: ["unfoldedLayer"]
      visible: false
    - state: folded_mount
      map: ["foldedLayer"]
      visible: false
    - state: ml66d
      map: ["enum.WeaponMountComponentVisualLayers.Mounted"]
      visible: true
    - state: ml66d_magazine
      map: ["enum.WeaponMountComponentVisualLayers.MountedAmmo"]
      visible: true
    - state: ml66d_gun_mount
      map: ["enum.WeaponMountComponentVisualLayers.Folded"]
      visible: false
    - state: ml66d_gun_mount_magazine
      map: ["enum.WeaponMountComponentVisualLayers.FoldedAmmo"]
      visible: false
  - type: WeaponMount
    fixedWeaponPrototype: "RMCSmartGunMounted"
  - type: Item
    size: Huge

- type: entity
  parent: RMCML66DMountAssembled
  id: RMCML66DMountWeaponAssembledLoaded
  suffix: Folded, Assembled, Loaded
  components:
  - type: WeaponMount
    fixedWeaponPrototype: "RMCSmartGunMountedLoaded"

- type: entity
  parent: [RMCBaseWeaponMount, BaseItem]
  id: RMCM2CMount
  name: M2C重机枪
  description: 拆卸后的M2C重机枪，伸缩式三脚架已折叠，无法开火。
  components:
  - type: Item
    size: Huge
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/HMGs/m2c.rsi
    state: m2c_gun_mount
    layers:
    - state: m2c
      map: ["enum.WeaponMountComponentVisualLayers.Mounted"]
      visible: false
    - state: m2c_magazine
      map: ["enum.WeaponMountComponentVisualLayers.MountedAmmo"]
      visible: false
    - state: m2c_gun_mount
      map: ["enum.WeaponMountComponentVisualLayers.Folded"]
      visible: false
    - state: m2c_gun_mount_broken
      map: ["enum.WeaponMountComponentVisualLayers.Broken"]
      visible: false
    - state: mag-0
      map: ["enum.WeaponMountComponentVisualLayers.FoldedAmmo"]
      visible: false
    - state: m2c_overheat
      map: ["enum.WeaponMountComponentVisualLayers.Overheated"]
      visible: false
  - type: Strap
    enabled: false
  - type: Clothing
    slots:
    - suitStorage
    - Back
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 230
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Breakage"]
  - type: CollisionWake
  - type: WeaponMount
    fixedWeaponPrototype: "RMCMachineGunM2C"
    isWeaponSecured: true
    isWeaponLocked: true
    canRotateWithoutTool: true
    mountOnDeploy: false
    mountExclusionAreaSize: 0
    barricadeExclusionAreaSize: 2
    assembleDelay: 3
    undeploySound:
    acidableWhileUndeployed: true
  - type: Tag
    tags:
    - M2CMount
  - type: Foldable
    folded: true
    isLocked: true
  - type: Corrodible
    isCorrodible: true

- type: Tag
  id: ML66DMount

- type: Tag
  id: M2CMount
