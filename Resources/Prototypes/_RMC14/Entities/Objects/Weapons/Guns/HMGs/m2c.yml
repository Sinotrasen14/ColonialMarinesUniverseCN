- type: entity
  parent: [CMBaseWeaponGun, BaseItem]
  id: RMCMachineGunM2C
  categories: [HideSpawnMenu]
  name: M2C重机枪
  description: M2C重机枪枪架的上半部分。不过，没有三脚架它就没多大用处。
  components:
  - type: Item
    size: Huge
  - type: AmmoCounter
  - type: StaticPrice
    price: 500
  - type: MagazineAmmoProvider
    autoEject: true
  - type: RMCAmmoEject
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: RMCNameItemOnVend
    item: PrimaryGun
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/HMGs/m2c.rsi
    layers:
    - state: m2c_gun_mount
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    slots:
    - suitStorage
    - Back
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 20
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_m2c2.ogg
      params:
        volume: -2
        variation: 0.05
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - FullAuto
    recoilUnwielded: 0
    scatterUnwielded: 0
    baseFireRate: 7
    modifiers:
      FullAuto:
        maxScatterModifier: 0
        useBurstScatterMult: false
        unwieldedScatterMultiplier: 0
        shotsToMaxScatter: 125
  - type: RMCWeaponAccuracy
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineM2C
          - AU14MagazineM2CTracter
  - type: GunDamageModifier
    multiplier: 1
  - type: GunRequiresSkills
    skills:
      RMCSkillEngineer: 1
  - type: GunSkilledRecoil
    setRecoil: 0
    skills:
      RMCSkillFirearms: 0
    mustBeWielded: false
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/lmg_mouse.rsi
      state: all
  - type: MountableWeapon
  - type: GunUnskilledPenalty
    firearms: 0
    angleIncrease: 0
    accuracyAddMult: 0
  - type: Scope
    scopePopup:
    unScopePopup:
    canUseInsideContainer: true
    canUseNightVision: true
    zoomLevels:
    - zoom: 1
      offset: 7
      doAfter: 0
      allowMovement: true
  - type: Tag
    tags:
    - RMCMachineGunM2C
  - type: Overheat

- type: entity
  parent: RMCMachineGunM2C
  id: CMUMachineGunM2CDropshipLoaded
  suffix: Dropship, Loaded
  categories: [HideSpawnMenu]
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: RMCMagazineM2C
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineM2C
          - AU14MagazineM2CTracter

# Magazines
- type: entity
  parent: CMMagazineRifleBase
  id: RMCMagazineM2C
  name: M2C弹药箱（10×28毫米钨弹）
  description: 一箱125发、用于M2C重机枪系统的10×28毫米无壳钨弹。
  components:
  - type: Tag
    tags:
    - RMCMagazineM2C
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - RMCCartridgeHMG10x28mmTungsten
    proto: RMCCartridgeHMG10x28mmTungsten
    capacity: 125
    deleteWhenEmpty: false
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/HMGs/m2c.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    slots:
    - suitStorage

- type: entity
  parent: RMCMagazineM2C
  id: AU14MagazineM2CTracter
  name: M2C曳光弹弹药箱（10x28毫米钨芯曳光弹）
  description: 一箱125发10x28毫米无壳钨芯绿色曳光弹，用于M2C重机枪系统。
  components:
  - type: Tag
    tags:
    - AU14MagazineM2CTracter
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - AU14CartridgeHMG10x28mmTungstenTracer
    proto: AU14CartridgeHMG10x28mmTungstenTracer
    capacity: 125
    deleteWhenEmpty: false

# Cartridges

- type: entity
  parent: CMBaseCartridgeRifle
  id: RMCCartridgeHMG10x28mmTungsten
  name: 子弹（10x28毫米钨）
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/large_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: RMCBulletHMG10x28mmTungsten
    deleteOnSpawn: true # CMU14: caseless ammo, no casing to eject
  - type: Tag
    tags:
    - RMCCartridgeHMG10x28mmTungsten

- type: entity
  parent: RMCCartridgeHMG10x28mmTungsten
  id: AU14CartridgeHMG10x28mmTungstenTracer
  name: 弹药（10×28毫米钨芯曳光弹）
  components:
  - type: CartridgeAmmo
    proto: AU14BulletHMG10x28mmTungstenTracer
  - type: Tag
    tags:
    - AU14CartridgeHMG10x28mmTungstenTracer

# Projectiles

- type: entity
  parent: CMBulletBase
  id: RMCBulletHMG10x28mmTungsten
  name: 子弹（10×28毫米钨）
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/bullet_projectiles.rsi
    layers:
    - state: bullet
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Piercing: 50
  - type: DamageImpactProfile
    projectile:
      contact: Generic
      penetration: High
      energy: High
  - type: CMArmorPiercing
    amount: 30
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 2 # cm13 code says 7 but after testing it looks like it starts losing damage after the first tile
      falloff: 3
    - range: 15
      falloff: 9999
  - type: RMCProjectileAccuracy
    accuracy: 75
    thresholds:
    - range: 6 # porting this 1:1, which is what the component mentions, from cm13(10), makes it too accurate at high ranges so I lowered it
      falloff: 5

- type: entity
  parent: RMCBulletHMG10x28mmTungsten
  id: AU14BulletHMG10x28mmTungstenTracer
  name: 子弹（10×28毫米钨芯曳光弹）
  categories: [HideSpawnMenu]
  components:
  - type: PointLight
    enabled: true
    color: "#ff4300"
    radius: 2.0
    energy: 7.0

# Tags
- type: Tag
  id: RMCMagazineM2C

- type: Tag
  id: AU14MagazineM2CTracter

- type: Tag
  id: RMCMachineGunM2C

- type: Tag
  id: RMCCartridgeHMG10x28mmTungsten

- type: Tag
  id: AU14CartridgeHMG10x28mmTungstenTracer
