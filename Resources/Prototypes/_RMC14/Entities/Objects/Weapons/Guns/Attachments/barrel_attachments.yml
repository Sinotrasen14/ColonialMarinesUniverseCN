- type: entity
  abstract: true
  parent: RMCAttachableBase
  id: RMCBarrelAttachmentBase
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Attachments/barrel.rsi
  - type: Tag
    tags:
    - RMCAttachmentBarrel

- type: entity
  parent: RMCBarrelAttachmentBase
  id: RMCAttachmentExtendedBarrel # extended_barrel
  name: 加长枪管
  description: 加长枪管能加速并稳定子弹，提高初速。                                                              # and accuracy.
  components:
  - type: Sprite
    state: ebarrel
  - type: Tag
    tags:
    - RMCAttachmentBarrel
    - RMCAttachmentExtendedBarrel
  - type: AttachableVisuals
  - type: AttachableWeaponRangedMods
    modifiers:
    - conditions:
        wieldedOnly: true
      accuracyAddMult: 0.2
    - projectileSpeedFlat: 10
  - type: AttachableWieldDelayMods
    modifiers:
    - delay: 0.4

- type: entity
  parent: RMCAttachmentExtendedBarrel
  id: RMCAttachmentExtendedCompensator
  name: AB-RVX 加长型补偿器
  description: 一种精密设计的带排气孔枪管延长器，供多支联合国部队使用。可大幅提升精度、枪口控制与弹丸速度，但因压力泄放而降低终端伤害。
  components:
  - type: Sprite
    state: ebarrel_vented
  - type: Tag
    tags:
    - RMCAttachmentBarrel
    - RMCAttachmentExtendedCompensator
  - type: AttachableVisuals
  - type: AttachableWeaponRangedMods
    modifiers:
    - accuracyAddMult: 0.3
      projectileSpeedFlat: 10
      damageFalloffAddMult: -0.1
      damageAddMult: -0.1
      recoilFlat: -1
    - conditions:
        unwieldedOnly: true
      recoilFlat: 1
      accuracyAddMult: -0.3
  - type: AttachableWieldDelayMods
    modifiers:
    - delay: 0.4
  - type: ItemCamouflage
    states:
      Jungle: ebarrel_vented
      Desert: d_ebarrel_vented
      Snow: s_ebarrel_vented
      Classic: c_ebarrel_vented
      Urban: u_ebarrel_vented

- type: entity
  parent: RMCBarrelAttachmentBase
  id: RMCAttachmentBarrelMar50
  name: MAR-50枪管
  description: 一根重型枪管。
  components:
  - type: Sprite
    state: mar50barrel
  - type: Tag
    tags:
    - RMCAttachmentBarrel
    - RMCAttachmentBarrelMar50
  - type: AttachableVisuals
  - type: AttachableWeaponRangedMods
    modifiers:
    - accuracyAddMult: 0.15
    - scatterFlat: -6

- type: entity
  parent: RMCBarrelAttachmentBase
  id: RMCAttachmentBarrelCharger
  name: 枪管充能器
  description: 一种超螺纹枪管延长器，可安装在大多数枪械的枪口上。以降低射速为代价，大幅提升弹丸伤害。
  components:
  - type: Sprite
    state: hbarrel
  - type: Tag
    tags:
    - RMCAttachmentBarrel
    - RMCAttachmentBarrelCharger
  - type: AttachableVisuals
  - type: AttachableWeaponRangedMods
    modifiers:
    - fireDelayFlat: 0.25
    - conditions:
        wieldedOnly: true
      accuracyAddMult: -0.15
    - conditions:
        unwieldedOnly: true
      accuracyAddMult: -0.35
    - conditions:
        whitelist:
          tags:
          - RMCWeaponShotgun
      damageAddMult: 0.05
    - conditions:
        blacklist:
          tags:
          - RMCWeaponShotgun
      damageAddMult: 0.3

- type: entity
  parent: RMCBarrelAttachmentBase
  id: RMCAttachmentRecoilCompensator # compensator
  name: 后坐力补偿器
  description: "枪口配件，通过将排出的气体向上导流来降低后坐力。会降低后坐力，但代价是少量武器伤害。"          # increases accuracy and reduces recoil
  components:
  - type: Sprite
    state: comp
  - type: Tag
    tags:
    - RMCAttachmentBarrel
    - RMCAttachmentRecoilCompensator
  - type: AttachableVisuals
  - type: AttachableWeaponRangedMods
    modifiers:
    - accuracyAddMult: 0.2
      damageFalloffAddMult: 0.1
      damageAddMult: -0.1
    - conditions:
        wieldedOnly: true
      recoilFlat: -3
    - conditions:
        unwieldedOnly: true
      recoilFlat: -2

- type: entity
  parent: RMCBarrelAttachmentBase
  id: RMCAttachmentRecoilCompensatorM13
  name: M13 加长型后坐力补偿器
  description: 一款沉重、过度加固的补偿器与枪管延伸部件，用于 M13 自动手枪。大幅提升全自动射击时的后坐力控制，但代价是笨重且操控性下降。绝对是在补偿什么，但效果极其凶猛。
  components:
  - type: Sprite
    state: m10_overcomp
  - type: Tag
    tags:
    - RMCAttachmentBarrel
    - RMCAttachmentRecoilCompensatorM13
  - type: AttachableVisuals
  - type: AttachableWeaponRangedMods
    modifiers:
    - accuracyAddMult: 0.15
      damageAddMult: 0.05
      recoilFlat: -2
    - conditions:
        unwieldedOnly: true
      accuracyAddMult: -0.2
  - type: ItemCamouflage
    states:
      Jungle: m10_overcomp
      Desert: d_m10_overcomp
      Snow: s_m10_overcomp
      Classic: c_m10_overcomp
      Urban: u_m10_overcomp
  - type: RMCLoreExaminable
    content: rmc-lore-examinable-m13-extended-recoil-compensator

- type: entity
  parent: RMCAttachmentRecoilCompensatorM13
  id: RMCAttachmentRecoilCompensatorM13Spiked
  name: M13加长型尖刺后坐力补偿器
  description: 一个重得离谱、过度设计的后坐力补偿器和枪管延长件，用于M13自动手枪，末端装有经过硬化处理的尖刺帽。大幅提升全自动射击时的后坐力控制，还能在近距离把这把手枪变成一根凶狠的棍棒。绝对是在补偿什么，但粗暴有效。
  components:
  - type: Sprite
    state: m10_overcomp_spike
  - type: Tag
    tags:
    - RMCAttachmentBarrel
    - RMCAttachmentRecoilCompensatorM13Spiked
  - type: AttachableWeaponMeleeMods
    modifiers:
    - bonusDamage:
        types:
          Slash: 20
  - type: ItemCamouflage
    states:
      Jungle: m10_overcomp_spike
      Desert: d_m10_overcomp_spike
      Snow: s_m10_overcomp_spike
      Classic: c_m10_overcomp_spike
      Urban: u_m10_overcomp_spike

- type: entity
  parent: RMCBarrelAttachmentBase
  id: RMCAttachmentShotgunChoke # choke
  name: 霰弹枪收束器
  description: "一种可插入 M42A2 霰弹枪的螺纹收束器。可提升精准度、弹速，收束散布，并提高循环速率。作为交换，弹丸伤害与冲击力会降低。同时会增加后坐力。不推荐使用独头弹。"
  components:
  - type: Sprite
    state: choke
  - type: Tag
    tags:
    - RMCAttachmentBarrel
    - RMCAttachmentShotgunChoke
  - type: AttachableVisuals
  - type: GrantProjectileStunAdjust
    stunDurationAdjustment: 0
    knockBackPowerMinAdjustment: 0
    knockBackPowerMaxAdjustment: 0
  - type: AttachableWeaponRangedMods
    modifiers:
    - fireDelayFlat: -1
    - scatterFlat: -5
    - accuracyAddMult: 0.25
      damageFalloffAddMult: -0.3
      damageAddMult: -0.2
      rangeFlat: 1
    - conditions:
        wieldedOnly: true
      recoilFlat: 2
    - conditions:
        unwieldedOnly: true
      recoilFlat: 2
  - type: AttachableSilencer
    sound:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_shotgun_choke.ogg
    hideMuzzleFlash: false

- type: entity
  parent: RMCBarrelAttachmentBase
  id: RMCAttachmentSuppressor # suppressor
  name: 抑制器
  description: "一个带有排气口的小管，用于排出噪音和气体。它不能完全使武器消音，但确实能让武器安静得多，代价是伤害略微降低。"
  components:
  - type: Sprite
    state: suppressor
  - type: Tag
    tags:
    - RMCAttachmentBarrel
    - RMCAttachmentSuppressor
  - type: AttachableVisuals
  - type: AttachableSilencer
    sound:
      collection: CMSilencedShoot
      params:
        maxDistance: 6
  - type: AttachableWeaponRangedMods
    modifiers:
    - damageFalloffAddMult: 0.1

- type: entity
  parent: RMCAttachmentSuppressor
  id: RMCAttachmentSuppressorCompact
  name: 紧凑型抑制器
  description: 一款专为冲锋枪和副武器设计的轻量、低矮型抑制器。它能减弱声音和枪口闪光，同时略微提升稳定性和精准度，但会略微降低弹丸速度和终端伤害。
  components:
  - type: Sprite
    state: suppressor_sleek
  - type: Tag
    tags:
    - RMCAttachmentBarrel
    - RMCAttachmentSuppressorCompact
  - type: AttachableSilencer
    sound:
      collection: RMCSilencedShootAlt
      params:
        maxDistance: 6

- type: entity
  parent: RMCAttachmentSuppressor
  id: RMCAttachmentSuppressorXM40
  name: XM40 抑制器
  description: "一个带有排气口的小管，用于排出噪音和气体。无法完全消除武器的声音，但可以使其安静得多，代价是伤害略微降低。"
