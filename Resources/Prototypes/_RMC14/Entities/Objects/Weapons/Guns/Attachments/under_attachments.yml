- type: entity
  parent: RMCAttachmentU1GrenadeLauncher
  id: RMCAttachmentM203GrenadeLauncher
  name: M203榴弹发射器
  description: 一种古董下挂式榴弹发射器。1969年为M16配用，但早在几个世纪前就已淘汰；它为何会出现在这里，对你而言是个谜。它只能装填一发专用的40毫米榴弹，没有现代敌我识别系统，不会穿过你的友军。
  components:
  - type: Sprite
    layers:
    - state: grenade-m203
      map: ["enum.BreechVisuals.Open"]
  - type: GunIFF
