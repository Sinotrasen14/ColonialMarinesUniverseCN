      path: /Audio/Weapons/Guns/Gunshots/flaregun.ogg
  - type: RMCAmmoEject
    containerID: ballistic-ammo
    ejectSound:
      collection: CMShotgunLoad
      params:
        variation: 0.2
  - type: RMCSelectiveFire
    scatterWielded: 0
    scatterUnwielded: 0
    baseFireRate: 10
    burstScatterMult: 0
  - type: ShootAtFixedPoint
