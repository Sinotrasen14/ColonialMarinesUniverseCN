    deactivatePopupText: attachable-popup-switch-from-generic
    activateSound:
      path: /Audio/_RMC14/Attachable/gun_u7_activate.ogg
      params:
        volume: -2
    actionName: Switch to the underbarrel flare gun
    actionDesc: Switch to using the underbarrel flare gun.
    icon:
      sprite: _RMC14/Objects/Weapons/Guns/Attachments/under.rsi
      state: flaregun
    iconActive:
      sprite: _RMC14/Objects/Weapons/Guns/Attachments/under.rsi
      state: flaregun-on
  - type: AttachableVisuals
    offset: -0.17, 0.22
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/shotgun_mouse.rsi
      state: all

- type: entity
  parent: RMCUnderAttachmentBase
  id: RMCAttachmentMiniFlamethrower
  name: 下挂式火焰喷射器                 # TODO RMC14 intensity toggle
  description: 一种可安装在武器上的可重复装填火焰喷射器附件。它有一个副模式，可喷出更猛烈的火焰，但推进能力大幅降低，且燃料消耗极大。
