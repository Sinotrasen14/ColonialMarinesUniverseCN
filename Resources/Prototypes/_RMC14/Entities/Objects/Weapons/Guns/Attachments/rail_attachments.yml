  name: L989A2 准直瞄准具组件
  description: 天哪……我觉得那个应该是粘在上面的……
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Attachments/rail.rsi
    state: collisight
  - type: AttachableToggleable
    breakOnMove: false
    icon:
      sprite: _RMC14/Objects/Weapons/Guns/Attachments/rail.rsi
      state: collisight
    actionName: Look through collimator sight
    actionDesc: Lets you see further and rain down explosives on the enemy without hitting your fellow Marines.
  - type: Scope
    zoomLevels:
    - zoom: 1
      offset: 10
      allowMovement: true
      doAfter: 0
  - type: AttachableSpeedMods
    modifiers:
    - conditions:
        activeOnly: true
      walk: -0.31
      sprint: -0.448
  - type: Tag
    tags:
    - RMCAttachmentRail
    - RMCAttachmentMGLIntegratedScope

