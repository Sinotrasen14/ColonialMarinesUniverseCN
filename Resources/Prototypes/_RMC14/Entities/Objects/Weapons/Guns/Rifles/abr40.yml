- type: entity
  parent: CMMagazineRifleBase
  id: RMCMagazineRifleABR40
  name: ABR-40 弹匣（10×24毫米）
  description: 一个装有全金属被甲弹的 ABR-40 弹匣，可在射击场或狩猎时使用。理论上可与 L42A 战斗步枪交叉兼容。
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - RMCMagazineRifleABR40
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CMCartridgeRifle10x24mm
    proto: CMCartridgeRifle10x24mm
    capacity: 12
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/abr40.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance
  - type: RefillableByBulletBox
    bulletType: RMCBoxBulletsRifle

- type: Tag
  id: RMCWeaponRifleABR40Tactical

- type: Tag
  id: RMCMagazineRifleABR40
