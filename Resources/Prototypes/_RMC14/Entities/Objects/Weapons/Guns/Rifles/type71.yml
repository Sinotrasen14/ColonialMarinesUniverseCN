- type: entity # Type 71 Base Rifle
  parent: [CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals]
  name: 71式突击步枪
  id: RMCWeaponRifleType71
  description: 作为UPP武装部队的主力制式步枪，71式是一款符合人体工程学、轻量化的突击步枪，发射5.45×39毫米弹药。按照压倒性优势与压制的条令原则，该步枪具备高射速和高容量弹匣。尽管精度不佳，但内置的减后坐机制使该步枪在点射时出奇地易于控制。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/type71.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/type71.rsi
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    shotsPerBurst: 4
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    soundGunshot:
      collection: RMCType71Shoot
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilUnwielded: 3
    scatterWielded: 10
    scatterUnwielded: 14
    baseFireRate: 2.8
    burstScatterMult: 1
    modifiers:
      Burst:
        fireDelay: 0.2331
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.2
    accuracyMultiplierUnwielded: 0.65
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineRifleType71
          - RMCMagazineRifleType71AP
          - RMCMagazineRifleType71HEAP
        startingItem: RMCMagazineRifleType71AP
  - type: GunDamageModifier
    multiplier: 1
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentSuppressor
          - RMCM5Bayonet
          - RMCAttachmentBarrelCharger
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS84xTelescopicScope
          - RMCAttachmentS42xTelescopicMiniscope
      rmc-aslot-stock:
        locked: true
        startingAttachable: RMCAttachmentType71Stock
        whitelist:
          tags:
          - RMCAttachmentType71Stock
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentLaserSight
          - RMCAttachmentVerticalGrip
          - RMCAttachmentExtinguisher
          - RMCAttachmentFlamer
          - RMCAttachmentBurstFireAssembly
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.75, -0.03125
      rmc-aslot-rail: -0.03125, 0.185
      rmc-aslot-stock: -0.5625, -0.03125
      rmc-aslot-underbarrel: 0.34375, -0.34375
  - type: ItemCamouflage
    camouflageVariations: {}
  - type: Tag
    tags:
    - RMCWeaponRifleType71

