- type: entity
  parent: [CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals]
  id: WeaponRifleMAR40
  name: MAR-40 战斗步枪
  description: 廉价、可靠的突击步枪，使用7.62×39毫米弹药。常见于罪犯或雇佣兵手中，或是UPP或CLF手中。
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/mar40.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/mar40.rsi
  - type: Gun
    burstCooldown: 0.1665
    shotsPerBurst: 4
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_mar40.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilWielded: 1
    recoilUnwielded: 4
    scatterWielded: 5
    scatterUnwielded: 20
    baseFireRate: 3.2
    burstScatterMult: 1
    modifiers:
      Burst:
        maxScatterModifier: 6
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 4
      FullAuto:
        maxScatterModifier: 9
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 4
  - type: MagazineAmmoProvider
    autoEject: false
    soundAutoEject:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: RMCMagazineRifleMAR40
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mar40_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mar40_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineRifleMAR40
          - RMCMagazineRifleMAR40Ext
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.2
    accuracyMultiplierUnwielded: 0.65
  - type: AttachableHolder
    randomAttachmentChance: 0.38
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentSuppressor
          - RMCAttachmentRecoilCompensator
          - RMCAttachmentExtendedCompensator
          - RMCM5Bayonet
        random:
        - RMCAttachmentExtendedBarrel
        - RMCAttachmentSuppressor
        - RMCAttachmentRecoilCompensator
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
        random:
        - RMCAttachmentMagneticHarness
        - RMCAttachmentS5RedDotSight
        - RMCAttachmentS6ReflexSight
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentBipod
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentU7UnderbarrelShotgun
          - RMCAttachmentExtinguisher
          - RMCAttachmentBurstFireAssembly
          - RMCAttachmentFlamer
        random:
        - RMCAttachmentU7UnderbarrelShotgun
        - RMCAttachmentGyroscopicStabilizer
        - RMCAttachmentUnderbarrelExtinguisher
        - RMCAttachmentMiniFlamethrower
        - RMCAttachmentBipod
        - RMCAttachmentBurstFireAssembly
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.75, 0.00
      rmc-aslot-rail: -0.23, 0.091
      rmc-aslot-underbarrel: 0.35, -0.3

