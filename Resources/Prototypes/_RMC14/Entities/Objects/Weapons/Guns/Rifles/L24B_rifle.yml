  name: L23B‘破门者’突击步枪
  description: 皇家海军陆战队突击队的脉冲式8.8×51毫米无壳突击步枪，是每位皇家海军陆战队突击队员的亲密伙伴。具备半自动和点射射击模式，并配有一体式30毫米榴弹发射器，可备用携带两枚榴弹，膛内还可装填一枚。
