  - type: Sprite
    sprite: CMU14/Weapons/Guns/RMC/L23.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: CMU14/Weapons/Guns/RMC/L23.rsi
  - type: Gun
    shotsPerBurst: 3
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    soundGunshot:
      collection: AU14L23FireSound
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilWielded: 2
    recoilUnwielded: 0.5
    scatterWielded: 3
    scatterUnwielded: 10
    baseFireRate: 3.5
