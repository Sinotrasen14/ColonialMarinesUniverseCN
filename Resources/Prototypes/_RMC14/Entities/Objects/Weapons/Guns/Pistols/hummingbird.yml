- type: entity
  parent: [RMCBaseSlideMagazineVisuals, CMWeaponPistolBase]
  id: RMCWeaponPistolD18
  name: D18 蜂鸟
  description: D18蜂鸟手枪于2090年代中期生产，是一种廉价的隐蔽携带枪械，并迅速在平民群体中流行起来。它在边境地区作为个人防卫手枪十分常见。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/m43.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/m43.rsi
  - type: RMCSelectiveFire
    scatterWielded: 6
    scatterUnwielded: 6
    baseFireRate: 10
    burstScatterMult: 3
  - type: MagazineAmmoProvider
    autoEject: false
    soundAutoEject:
  - type: Item
    size: Tiny
  - type: GunDamageModifier
    multiplier: 1.2
  - type: Tag
    tags:
    - Holdout
    - RMCWeaponPistolD18
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: RMCMagazinePistolD18
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mk80_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_88m4_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazinePistolD18
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentSuppressor
          - RMCAttachmentSuppressorCompact
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.620, 0.05
      rmc-aslot-rail: -0.03, 0.09

- type: entity
  parent: CMBaseMagazinePistol
  id: RMCMagazinePistolD18
  name: D18弹匣（9毫米）
  description: 一个小型D18弹匣，能装下七发9毫米子弹。它究竟是怎么做到这么小的？
  components:
  - type: Tag
    tags:
    - CMMagazinePistol
    - RMCMagazinePistolD18
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CMCartridgePistol9mm
    proto: CMCartridgePistol9mm
    capacity: 7
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m4a3.rsi # Placeholder
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: RefillableByBulletBox
    bulletType: CMUBoxBulletsPistol9MM

- type: Tag
  id: RMCMagazinePistolD18

- type: Tag # For stuff like the D18 and Holdout Pistol
  id: Holdout

- type: Tag
  id: RMCWeaponPistolD18
