  id: RMCMagazinePistolHandcannonHI
  name: 高冲击游隼手炮弹匣（.50）
  description: 七发威力极其恐怖的.50口径毁灭弹药。弹头覆有合成锇铅合金，足以让任何被击中的目标踉跄失衡。请让枪口远离任何你珍视的东西。
  components:
  - type: Tag
    tags:
    - CMMagazinePistol
    - RMCMagazinePistolHandcannonHI
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - RMCCartridgePistolHandcannonHI
    proto: RMCCartridgePistolHandcannonHI
    capacity: 7
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/handcannon.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: ammo_band
      color: "#00CDEA"

- type: entity
  parent: CMBaseMagazinePistol
  id: RMCMagazinePistolHandcannonHIAP
  name: 高冲击穿甲游隼手炮弹匣（.50）
  description: 七发威力毁灭性的.50口径弹药。能造成毁灭性打击。子弹尖端采用锇钨碳化物合金，不仅能震慑目标，还能撕裂任何目标的装甲。由于生产成本高昂且担心击穿船体，仅少量配发。请勿对准任何你珍视的东西。
  components:
  - type: Tag
    tags:
    - CMMagazinePistol
    - RMCMagazinePistolHandcannonHIAP
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
