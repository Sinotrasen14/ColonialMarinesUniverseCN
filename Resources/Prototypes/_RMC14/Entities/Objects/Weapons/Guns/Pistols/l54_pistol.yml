  name: L54A2制式手枪            # TSE service pistol - same stats as the M1984
  description: NSPA的标准配发半自动制式手枪。采用9毫米口径，可与UNCMC广泛使用的M1984手枪相媲美。直到最近，它也曾是RMC的标准配发手枪，后被L165A1取代。
  components:
  - type: Tag
    tags:
    - Sidearm
    - RMCWeaponPistolL54
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/l54.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/l54.rsi
  - type: Gun
    soundGunshot:
      collection: AU14L54FireSound
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mk80_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mk80_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazinePistolL54
        startingItem: RMCMagazinePistolL54

