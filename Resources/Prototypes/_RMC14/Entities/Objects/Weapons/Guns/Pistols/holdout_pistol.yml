- type: entity
  parent: [RMCBaseSlideMagazineVisuals, CMWeaponPistolBase]
  id: RMCWeaponPistolHoldout
  name: 隐藏式手枪
  description: 一把小巧的手枪，专为藏在难以触及的地方而设计。最好别问它的来历。
  suffix: Filled
  components:
  - type: Item
    size: Tiny
  - type: RMCSelectiveFire
    scatterWielded: 10
    scatterUnwielded: 10
    baseFireRate: 4
    burstScatterMult: 10
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/holdout.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/holdout.rsi
  - type: MagazineAmmoProvider
    autoEject: false
    soundAutoEject:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: RMCMagazinePistolHoldout
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mk80_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_88m4_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazinePistolHoldout
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentSuppressor
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentBurstFireAssembly
          - RMCAttachmentLaserSight
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.71, 0.095
      rmc-aslot-rail: -0.065, 0.125
      rmc-aslot-underbarrel: 0.312, -0.25
  - type: Tag
    tags:
    - Holdout

- type: entity
  parent: CMBaseMagazinePistol
  id: RMCMagazinePistolHoldout
  name: 袖珍手枪弹匣（.22）
  description: 一个出奇小巧的弹匣，可装 .22 子弹。虽然比不上蜂鸟手枪，但也快接近了。
  components:
  - type: Tag
    tags:
    - CMMagazinePistol
    - RMCMagazinePistolHoldout
  - type: Item
    size: Tiny
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CMCartridgePistol22mm
    proto: CMCartridgePistol22mm
    capacity: 5
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/holdout.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: CMBulletBase
  id: CMBulletPistol22mm
  name: 子弹（.22）
  categories: [HideSpawnMenu]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 20
  - type: CMArmorPiercing
    amount: 10

- type: entity
  id: CMCartridgePistol22mm
  name: 子弹（.22）
  parent: CMCartridgePistolBase
  components:
  - type: Tag
    tags:
    - Cartridge
    - CMCartridgePistol22mm
  - type: CartridgeAmmo
    proto: CMBulletPistol22mm

- type: Tag
  id: RMCMagazinePistolHoldout
