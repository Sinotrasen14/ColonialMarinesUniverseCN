- type: entity
  parent: [RMCBaseSlideMagazineVisuals, CMWeaponPistolBase]
  id: RMCWeaponPistolNP92
  name: NP92手枪
  description: UPP的标准配发副武器。NP92是一种小巧但威力强大的副武器，深受大多数配发者的喜爱，不过有些人更喜欢它原本要取代的武器——73式。使用12发弹匣。
  components:
  - type: Tag
    tags:
    - Sidearm
    - RMCWeaponPistolNP92
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/np92.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/np92.rsi
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.25
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 8
  - type: Gun
    shotsPerBurst: 3
    availableModes:
    - SemiAuto
    - Burst
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_88m4_v7.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    scatterWielded: 5
    scatterUnwielded: 5
    baseFireRate: 3.5
    burstScatterMult: 5
    modifiers:
      Burst:
        fireDelay: 0.1665
        maxScatterModifier: 10
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 6
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_88m4_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_88m4_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazinePistolNP92
          - RMCMagazinePistolNP92Extended
        startingItem: RMCMagazinePistolNP92
  - type: GunDamageModifier
    multiplier: 1.15
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentSuppressor
          - RMCAttachmentSuppressorCompact
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS5MicroRedDotSight
          - RMCAttachmentS6ReflexSight
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.625, 0.125
      rmc-aslot-rail: -0.03, 0.185

