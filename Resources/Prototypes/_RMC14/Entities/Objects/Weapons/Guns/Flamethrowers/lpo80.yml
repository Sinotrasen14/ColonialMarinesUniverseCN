- type: entity
  parent: RMCWeaponFlamer
  id: RMCWeaponFlamerSPP
  name: LPO80焚烧装置
  description: 一种老旧但有效的轻型战斗焚烧装置，官方作为反工事工具服役，但实际中用于近距离战斗，以逼出敌方战斗人员。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/lpo80.rsi
  - type: Item
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/lpo80.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/lpo80.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 坦克
        startingItem: RMCTankFlamerSPP
        insertSound: /Audio/_RMC14/Weapons/Handling/flamer_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Handling/flamer_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCTankFlamerSPP
  - type: AttachableHolder # TODO RMC14 barrel nozzle
    slots:
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
      rmc-aslot-stock:
        locked: true
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentExtinguisher
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: -0.032, 0.092
      rmc-aslot-stock: -0.468, 0.064
      rmc-aslot-underbarrel: 0.284, -0.313
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
      - CMUPathogenWalker

- type: entity
  parent: RMCWeaponFlamer
  id: RMCWeaponFlamerSpecUPP
  name: LPO80-T 焚烧器单元
  description: 一台老旧但有效的轻型战斗焚烧器，官方服役用途是作为反工事工具，但实际上被用于近距离战斗中，以逼出敌方战斗人员。这一台似乎经过翻新，以适配某些燃料箱。
  components:
  - type: Corrodible
    isCorrodible: false
  - type: GunUserWhitelist # CMU14
    whitelist:
      components:
      - PyroWhitelist
  - type: RMCCanUseBroiler
  - type: RMCIgniter
    enabled: true
    locked: true
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/lpo80.rsi
  - type: Item
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/lpo80.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/lpo80.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 坦克
        startingItem: RMCTankFlamerLargeUPP
        insertSound: /Audio/_RMC14/Weapons/Handling/flamer_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Handling/flamer_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCTankFlamerLargeUPP
          - RMCTankFlamerXLargeUPP
          - RMCTankFlamerBLargeUPP
  - type: AttachableHolder # TODO RMC14 barrel nozzle
    slots:
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
      rmc-aslot-stock:
        locked: true
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentExtinguisher
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: -0.032, 0.092
      rmc-aslot-stock: -0.468, 0.064
      rmc-aslot-underbarrel: 0.284, -0.313
  - type: Tag
    tags:
    - RMCWeaponFlamerSpecUPP

- type: entity
  parent: RMCTankFlamer
  id: RMCTankFlamerSPP
  name: LPO80焚烧炉燃料箱
  description: 用于储存供LPO80焚烧炉设备使用燃料的燃料箱。请小心搬运。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/lpo80.rsi
    state: flametank
    layers:
    - state: flametank
    - state: flametank_strip1
    - state: flametank_strip2
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: flametank_strip
  - type: Tag
    tags:
    - RMCTankFlamerSPP

- type: entity
  parent: RMCTankFlamer
  id: RMCTankFlamerLargeUPP
  name: LPO80-T焚烧炉储罐
  description: 用于储存供LPO80焚烧炉装置使用的燃料的燃料储罐。请小心搬运。这个似乎比标准LPO80储罐更大，可能用于长时间运行。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/lpo80.rsi
    state: flametank
    layers:
    - state: flametank
    - state: flametank_strip1
    - state: flametank_strip2
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 250
        reagents:
        - ReagentId: RMCNapalmUT
          Quantity: 250
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: flametank_strip
  - type: Tag
    tags:
    - RMCTankFlamerLargeUPP

- type: Tag
  id: RMCTankFlamerLargeUPP

