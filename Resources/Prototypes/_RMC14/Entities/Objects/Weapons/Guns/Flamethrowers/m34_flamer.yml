- type: entity
  parent: [CMBaseWeaponGun, BaseItem, RMCBaseAttachableHolder]
  id: RMCWeaponFlamer
  name: M240焚化器装置
  description: M240焚化器装置已被证明是清除软目标最有效的武器之一。这是一件相当致命的武器，既令人畏惧又值得敬畏。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/m34.rsi
    state: base
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
    - state: strip
      color: "#DD9B00"
      map: ["enum.RMCFlamerVisualLayers.Strip"]
    - state: lit
      map: ["enum.RMCIgniterVisuals.Ignited"]
  - type: Item
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/m34.rsi
    size: Large
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/m34.rsi
    slots:
    - suitStorage
    - Back
  - type: Gun
    cameraRecoilScalar: 0
    fireRate: 0.7 #cmu14
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      collection: RMCFlamerShoot
  # CMU14: no flat use delay, cadence is ShootUseDelay plus WieldDelay
  #- type: UseDelay
  #  delay: 2
  - type: ShootUseDelay
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 坦克
        startingItem: RMCTankFlamer
        insertSound: /Audio/_RMC14/Weapons/Handling/flamer_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Handling/flamer_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCTankFlamer
  - type: WieldDelay
    baseDelay: 1.0 #CMU14 Change
  - type: Wieldable
  - type: WieldableSpeedModifiers
    base: 0.5
    light: 0.69
    medium: 0.75
    heavy: 0.806
  - type: GunRequiresWield
  - type: RMCFlamerAmmoProvider
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: AttachableHolder # TODO RMC14 barrel nozzle
    slots:
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentExtinguisher
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: -0.032, 0.092
      rmc-aslot-underbarrel: 0.284, -0.313
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/flamer_mouse.rsi
      state: all
  - type: RMCIgniter
  - type: RMCAmmoEject
  - type: GenericVisualizer
    visuals:
      enum.RMCFlamerVisualLayers.Strip:
        enum.RMCFlamerVisualLayers.Strip:
          true: {visible: true}
          false: {visible: false}
      enum.RMCIgniterVisuals.Ignited:
        enum.RMCIgniterVisuals.Ignited:
          true: {visible: true}
          false: {visible: false}
  - type: Tag
    tags:
    - RMCWeaponIncineratorM34
  - type: RMCNameItemOnVend
    item: PrimaryGun
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
      - CMUPathogenWalker

- type: entity
  parent: RMCWeaponFlamer
  id: RMCWeaponFlamerPVE
  suffix: PVE
  components:
  - type: Gun
    fireRate: 2

- type: Tag
  id: RMCWeaponIncineratorM34

- type: entity
  parent: RMCWeaponFlamer
  id: RMCWeaponFlamerUnloaded
  suffix: Unloaded
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 坦克
        startingItem:
        insertSound: /Audio/_RMC14/Weapons/Handling/flamer_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Handling/flamer_unload.ogg
        priority: 2
        whitelist:
          components:
          - RMCFlamerTank

- type: entity
  parent: BaseItem
  id: RMCBaseTankFlamer
  abstract: true
  components:
  - type: Item
    size: Normal
  - type: RMCFlushableSolution
    solution: rmc_flamer_tank
    flushTime: 1.5
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: Tag
    tags:
    - RMCTankFlamer
  - type: RefillableSolution
    solution: rmc_flamer_tank
  - type: DetailedExaminableSolution
    solution: rmc_flamer_tank

- type: entity
  parent: RMCBaseTankFlamer
  id: RMCTankFlamer
  name: 焚化器燃料罐
  description: 用于储存M240焚化器单元所需燃料的燃料罐。请小心搬运。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/flamethrower.rsi
    state: flametank_custom
    layers:
    - state: flametank_custom
    - state: flametank_custom_strip2
    - state: flametank_custom_strip2
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: Item
    size: Normal
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 100
        reagents:
        - ReagentId: RMCNapalmUT
          Quantity: 100
  - type: RMCFlamerTank
  - type: RMCSolutionTransferWhitelist
    popup: rmc-solution-transfer-whitelist-failed-not-reagent-tank
    targetWhitelist:
      components:
      - RMCFlamerBackpack
      tags:
      - RMCTankReagent
      - RMCBackpackFlamer
  - type: NoMixingReagents
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: flametank_custom_strip
  - type: Appearance
  - type: SolutionStorageFillable
    solution: rmc_flamer_tank

- type: entity
  parent: RMCTankFlamer
  id: RMCTankFlamerCustom
  name: M240定制焚化器燃料罐
  description: 用于M240焚化器单元的燃料罐。
  # description: A fuel tank for use in the M34 incinerator unit. This one has been modified with a pressure regulator and an internal propellant tank.
  components:
  - type: RMCFlamerTank
    maxRange: 5
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 100
        reagents: []
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 3750

- type: entity
  parent: RMCTankFlamer
  id: RMCTankFlamerBGel
  name: M240焚化器燃料罐（B凝胶）
  description: 一个装满专用超浓稠纳帕尔燃料B凝胶的燃料罐，这是一种凝固汽油的凝胶变体，容易被扑灭，但喷射得更远，滞留时间更长。请格外小心处理。
  components:
  - type: RMCFlamerTank
    maxRange: 7
    maxDuration: 50
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 200
        reagents:
        - ReagentId: RMCBGel
          Quantity: 200

- type: entity
  parent: RMCTankFlamer
  id: RMCTankFlamerUpgraded
  name: M240升级型焚化器燃料罐
  description: 用于M240焚化器的燃料罐。此罐经过改装，内部推进剂罐更大且更精密，从而拥有更大容量并可容纳更强力的燃料。
  components:
  - type: RMCFlamerTank
    maxIntensity: 60
    maxRange: 7
    maxDuration: 50
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 200
        reagents: []

- type: Tag
  id: RMCTankFlamer

- type: entity
  parent: RMCGunCaseBase
  id: RMCCaseFlamer
  name: M240焚化器箱
  description: 一个装有M240焚化器单元的枪箱。它确实已经装填好了，但你仍需要在前行途中寻找额外的燃料罐。
  components:
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,7,1
    whitelist:
      components:
      - RMCFlamerAmmoProvider
      - RMCFlamerTank
      tags:
      - RMCAttachmentExtinguisher
  - type: StorageFill
    contents:
    - id: RMCWeaponFlamer
    - id: RMCTankFlamer
      amount: 2
    - id: RMCAttachmentUnderbarrelExtinguisher
