- type: entity
  parent: RMCWeaponFlamer
  id: RMCWeaponFlamerSpec
  name: M240-T 焚化器              #cmu14
  description: M240-T 型号是 M240 焚化器单元的改进版本，能够散布更多种类的燃料。                                                                                     #cmu14
  components:
  # CMU14: no flat use delay, cadence is ShootUseDelay plus WieldDelay
  #- type: UseDelay
  #  delay: 3
  - type: Corrodible
    isCorrodible: false
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/m34t.rsi
  - type: Item
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/m34t.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/m34t.rsi
  - type: WieldDelay #CMU14 Change
    baseDelay: 1.75
  - type: AttachableHolder # NOTE: The nozzle is only for the base M34.
    slots:
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
      rmc-aslot-underbarrel:
        locked: true
        startingAttachable: RMCAttachmentUnderbarrelExtinguisherSpec
        whitelist:
          tags:
          - RMCAttachmentExtinguisher
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 坦克
        startingItem:
        insertSound: /Audio/_RMC14/Weapons/Handling/flamer_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Handling/flamer_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCTankFlamer
          - RMCTankFlamerLarge
  - type: Tag
    tags:
    - RMCWeaponIncineratorM34T
  - type: RMCCanUseBroiler
  - type: RMCIgniter
    enabled: true
    locked: true
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
      - CMUPathogenWalker
  - type: GunUserWhitelist # CMU14
    whitelist:
      components:
      - PyroWhitelist

- type: entity
  parent: RMCTankFlamer
  id: RMCTankFlamerLarge
  name: M240大型焚化炉燃料罐
  description: 用于M240-T焚化炉装置的大型燃料罐。操作时务必极其小心。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/flamethrower.rsi
    state: flametank_large_custom
    layers:
    - state: flametank_large_custom
    - state: flametank_large_custom_strip2
    - state: flametank_large_custom_strip2
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 250
        reagents:
        - ReagentId: RMCNapalmUT
          Quantity: 250
  - type: RMCFlamerTank
    maxIntensity: 80
    maxRange: 5
    maxDuration: 24
  - type: Tag
    tags:
    - RMCTankFlamerLarge

- type: entity
  parent: RMCTankFlamerLarge
  id: RMCTankFlamerLargeB
  name: M240大型焚化炉燃料罐（B）
  description: 一个装有超稠萘燃料B型的大型燃料罐，这是凝固汽油的一种特殊变体，容易被扑灭，但会在缓慢燃烧的同时扩散至大片区域。
  components:
  - type: RMCFlamerTank
    maxRange: 6
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 250
        reagents:
        - ReagentId: RMCNapalmB
          Quantity: 250

- type: entity
  parent: RMCTankFlamerLarge
  id: RMCTankFlamerLargeX
  name: M240大型焚化炉燃料罐（X）
  description: 一种用于M240-T焚化炉装置的大型燃料罐，内装X型超浓稠石脑油燃料，这是一种黏稠的可燃液态化学品，燃烧时温度极高。请务必极其小心地处理。
  components:
  - type: RMCFlamerTank
    maxRange: 6
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 250
        reagents:
        - ReagentId: RMCNapalmX
          Quantity: 250

- type: entity
  parent: RMCTankFlamerLarge
  id: RMCTankFlamerLargeEX
  name: M240大型焚化炉燃料罐（EX）
  description: 一个大型燃料罐，内装超浓萘燃料EX型。这是一种黏稠的可燃液态化学品，燃烧温度极高，能直接熔化穿透大多数阻燃材料，用于M240-T焚化炉装置。请务必极其小心地处理。
  components:
  - type: RMCFlamerTank
    maxRange: 7
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 250
        reagents:
        - ReagentId: RMCNapalmEX
          Quantity: 250

- type: entity
  parent: RMCTankFlamerLarge
  id: RMCTankFlamerLargeCustom
  name: M240大型定制焚化炉燃料罐
  description: M240-T焚化炉装置用大型燃料罐。
  # description: A large fuel tank for use in the M34-T incinerator unit. This one has been modified with a pressure regulator and a large internal propellant tank. Must be manually attached.
  components:
  - type: RMCFlamerTank
    maxIntensity: 60
    maxRange: 8
    maxDuration: 50
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 450
        reagents: []
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 3750

- type: Tag
  id: RMCTankFlamerLarge

- type: Tag
  id: RMCWeaponIncineratorM34T
