- type: entity
  parent: RMCWeaponFlamer
  id: RMCWeaponFL3Flamer
  name: 火焰喷射器3重型焚烧装置
  description: 一种重型工业焚烧装置，由维兰德公司生产，后来由维兰德-汤谷公司生产。常见于边境殖民地的植被清理任务中，通常不会在战斗中出现，但实际使用时极具毁灭性。
  components:
  - type: Corrodible
    isCorrodible: false
  - type: RMCMagneticItem
  - type: GunUserWhitelist # CMU14
    whitelist:
      components:
      - PyroWhitelist
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/FL3/fl3_inhands.rsi
    layers:
    - state: base
      sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/FL3/fl3_icon.rsi
    - state: mag-0
      sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/FL3/fl3_icon.rsi
      map: ["enum.GunVisualLayers.Mag"]
    - state: strip
      sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/FL3/fl3_icon.rsi
      color: "#DD9B00"
      map: ["enum.RMCFlamerVisualLayers.Strip"]
    - state: lit
      sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/FL3/fl3_icon.rsi
      map: ["enum.RMCIgniterVisuals.Ignited"]
  - type: Item
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/FL3/fl3_inhands.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/FL3/fl3_inhands.rsi
    slots:
    - suitStorage
    - Back
    - Belt
  - type: Gun
    soundGunshot:
      collection: RMCFlamerFL3Shoot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 坦克
        startingItem: RMCTankFlamerFL3
        insertSound: /Audio/_RMC14/Weapons/Guns/Flamer/wy_flamer_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Flamer/wy_flamer_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCTankFlamerFL3
          - RMCTankFlamerFL3X
          - RMCTankFlamerFL3B
  - type: RMCIgniter
    sound:
      path: /Audio/_RMC14/Weapons/Guns/Flamer/wy_flamer_ignite.ogg
  - type: AttachableHolder
    slots: {}
  - type: Tag
    tags:
    - RMCWeaponIncineratorFL3
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
      - CMUPathogenWalker

- type: entity
  parent: RMCWeaponFL3Flamer
  id: RMCWeaponFL3FlamerPVE
  suffix: PVE
  components:
  - type: RMCMagneticItem
  - type: Gun
    fireRate: 2

- type: entity
  parent: RMCWeaponFL3Flamer
  id: RMCWeaponFL3FlamerWhiteout
  suffix: Whiteout
  components:
  - type: RMCMagneticItem
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 坦克
        startingItem: RMCTankFlamerFL3Whiteout
        insertSound: /Audio/_RMC14/Weapons/Guns/Flamer/wy_flamer_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Flamer/wy_flamer_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCTankFlamerFL3

- type: entity
  parent: RMCTankFlamer
  id: RMCTankFlamerFL3
  name: FW3重型焚化罐
  description: 一种重型大容量储罐，供火焰喷射器3重型焚化单元使用。这个储罐上有一个蓝色的耐热维兰德-汤谷标志。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/fl3.rsi
    state: flametank
    layers:
    - state: flametank
    - state: flametank_strip1
    - state: flametank_strip2
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: RMCFlamerTank
    maxIntensity: 70
    maxRange: 8
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 300
        reagents:
        - ReagentId: RMCNapalmUT
          Quantity: 300
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: flametank_strip
  - type: Tag
    tags:
    - RMCTankFlamerFL3

