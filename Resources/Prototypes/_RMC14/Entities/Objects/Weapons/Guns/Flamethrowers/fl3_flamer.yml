- type: entity
  parent: RMCTankFlamerFL3
  id: RMCTankFlamerFL3Whiteout
  name: FW3重型焚化器燃料罐（EX）
  description: 一个重型燃料罐，装有EX型超浓萘燃料，这是一种粘稠的可燃液体化学物质，燃烧温度极高，能直接熔化穿透大多数阻燃材料，供FW3重型焚化器使用。罐身上有一个蓝色的耐热韦兰德-汤谷标志。小心处理。
  components:
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 300
        reagents:
