- type: entity
  parent: RMCStockAttachmentCollapsibleBase
  id: RMCAttachmentSmartgunHarness # TODO RMC14 - This should remove GunRequiresWield when active
  categories: [HideSpawnMenu]
  name: ML66A重型支援枪挂具
  description: 一款专为ML66A重型支援枪设计的专用挂具，有助于控制后坐力并保持稳定，同时便于轻松操控武器，甚至无需握持即可将其悬挂。
  suffix: PVE
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Attachments/rmc_stock.rsi
    state: smartgun_harness
  - type: Tag
    tags:
    - RMCAttachmentStock
    - RMCAttachmentSmartgunHarness
  - type: AttachableToggleable
    doAfter: 0.35
    heldOnlyActivate: true
    activatePopupText: attachable-popup-activate-lock
    deactivatePopupText: attachable-popup-deactivate-unlock
    icon:
      sprite: _RMC14/Objects/Weapons/Guns/Attachments/rmc_stock.rsi
      state: smartgun_harness
    iconActive:
      sprite: _RMC14/Objects/Weapons/Guns/Attachments/rmc_stock.rsi
      state: smartgun_harness
    actionName: Toggle ML66A Heavy Support Gun Harness
    actionDesc: Lock the harness to your rig.
  - type: AttachablePreventDropToggleable
  - type: AttachableWeaponRangedMods
    modifiers:
    - conditions:
        activeOnly: true
      accuracyAddMult: 0.2
      recoilFlat: -2

- type: Tag
  id: RMCAttachmentSmartgunHarness

- type: entity
  parent: RMCSmartGunPVENoCamo
  id: RMCSmartGunRCMPVE
  name: ML66C通用机枪
  description: 一款由皇家皇冠海军陆战队使用的重型、机动式机枪。它在联合国ML66A平台基础上经过大幅改装，发射10×30毫米全息制导弹药。                                                                                    # In parity this is 10x28 HT but I don't want to make more unnecessary duplicate gear
  suffix: PVE, RCM
  components:
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_ml66a_2.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/SmartGuns/royal_gpmg.rsi
    layers:
    - state: base
      sprite: _RMC14/Objects/Weapons/Guns/SmartGuns/royal_gpmg.rsi
    - state: mag-0
      sprite: _RMC14/Objects/Weapons/Guns/SmartGuns/royal_gpmg.rsi
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/SmartGuns/royal_gpmg.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: RMCMagazineSmartGunHT
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_sg_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_sg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineSmartGunHT
          - RMCMagazineSmartGun # needs this or magazines are entirely unusable
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: RMCPowerCellSmartgun
        whitelist:
          components:
          - SmartGunBattery
