- type: entity
  parent: [CMBaseWeaponRifle, RMCBaseAttachableHolder, RMCBaseWeaponMagazineVisuals]
  name: 巴西拉-阿姆斯特朗栓动狩猎步枪
  id: RMCWeaponBoltActionRifle
  description: 以其古怪的设计师命名，巴西拉-阿姆斯特朗是一支廉价但可靠的民用栓动步枪，常见于外层殖民地。尽管法律强制限制其弹匣容量，但其重量轻、精度传奇，因而深受猎人和竞技射手的欢迎。
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/hunting.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/hunting.rsi
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_basira.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilWielded: 1
    recoilUnwielded: 4
    scatterWielded: 3
    scatterUnwielded: 20
    baseFireRate: 1.25
    burstScatterMult: 5
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.35
    accuracyMultiplierUnwielded: 0.35
  - type: UniqueAction
  - type: BreechLoaded
    needOpenClose: true
    openSound:
      path: "/Audio/_RMC14/Weapons/Guns/Breech/pkd_open_chamber.ogg"
    closeSound:
      path: "/Audio/_RMC14/Weapons/Guns/Breech/pkd_close_chamber.ogg"
  - type: MagazineAmmoProvider
    autoEject: false
    soundAutoEject:
  - type: GenericVisualizer
    visuals:
      enum.BreechVisuals.Open:
        enum.BreechVisuals.Open:
          true: {state: bolt-open}
          false: {state: base}
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣
        startingItem: RMCMagazineRifleHunting
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineRifleHunting
  - type: GunDamageModifier
    multiplier: 1.4
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCM5Bayonet
      rmc-aslot-rail:
        startingAttachable: RMCAttachmentMiniscopeHunting
        whitelist:
          tags:
          - RMCAttachmentHuntingScope
          - RMCAttachmentMiniscopeHunting
          - RMCAttachmentS84xTelescopicScope
      rmc-aslot-stock:
        locked: true
        startingAttachable: RMCAttachmentHuntingStock
        whitelist:
          tags:
          - RMCAttachmentHuntingStock
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.80, 0.06
      rmc-aslot-rail: -0.28, 0.06
      rmc-aslot-stock: -0.74, -0.14
  - type: ItemCamouflage
    camouflageVariations: {}
  - type: Corrodible
    isCorrodible: false
  - type: GunRequiresWield

- type: entity
  parent: CMMagazineRifleBase
  id: RMCMagazineRifleHunting
  name: "巴西拉-阿姆斯特朗弹匣（6.5毫米）"
  components:
  - type: Item
    size: Small
  - type: Tag
    tags:
    - CMMagazineRifle
    - RMCMagazineRifleHunting
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - RMCCartridgeBoltActionRifle
    proto: RMCCartridgeBoltActionRifle
    capacity: 10
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/hunting.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance

- type: entity
  parent: CMBaseCartridgeRifle
  id: RMCCartridgeBoltActionRifle
  name: 弹药（6.5毫米）
  description: "用于Basira-Armstrong猎枪的6.5毫米弹药。符合民用猎枪15发弹药限制。"
  components:
  - type: Tag
    tags:
    - Cartridge
    - RMCCartridgeBoltActionRifle
  - type: CartridgeAmmo
    proto: RMCBulletRifleHunting

- type: entity
  parent: BulletRifle10x24mm
  id: RMCBulletRifleHunting
  categories: [HideSpawnMenu]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 29
  - type: CMArmorPiercing
    amount: 18
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 30
      falloff: 1
      ignoreModifiers: true
    - range: 7
      falloff: 0
  - type: RMCStunOnHit
    stuns:
    - whitelist:
        minMobSize: VerySmallXeno
      maxRange: 3.5
      losesEffectWithRange: true
      stunTime: 0
      superSlowTime: 0
      slowTime: 0

- type: Tag
  id: RMCMagazineRifleHunting

- type: Tag
  id: RMCCartridgeBoltActionRifle

- type: Tag
  id: RMCWeaponBoltActionRifle
