- type: entity
  parent: [RMCBaseSlideMagazineVisualsBallistic, RMCBaseWeaponGrenadeLauncher]
  id: RMCWeaponLauncherM85A1
  name: M85A1榴弹发射器
  description: 一种重型、低角度、折开式40毫米榴弹发射器。核心设计陈旧，逊于更现代的M92、M95半自动榴弹发射器和M94撞击式发射器，但操作它既不需要磁性衔铁，也不需要高深的专业技能，更不必说近乎无瑕的可靠性、极低的成本和极轻的重量，因为其大部分由聚合物材料制成。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/GrenadeLaunchers/m85a1/m85a1_inhands.rsi
    layers:
    - sprite: _RMC14/Objects/Weapons/Guns/GrenadeLaunchers/m85a1/m85a1_icon.rsi
      state: base
      map: ["enum.BreechVisuals.Open"]
  - type: GenericVisualizer
    visuals:
      enum.BreechVisuals.Open:
        enum.BreechVisuals.Open:
          true: {state: bolt-open}
          false: {state: base}
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/GrenadeLaunchers/m85a1/m85a1_inhands.rsi
    slots:
    - Back
    - suitStorage
  - type: Gun
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/m79_shoot.ogg
  - type: UniqueAction
  - type: UseDelay
  - type: BreechLoaded
    openSound:
      path: /Audio/_RMC14/Weapons/Guns/Breech/pkd_open_chamber.ogg
    closeSound:
      path: /Audio/_RMC14/Weapons/Guns/Breech/pkd_close_chamber.ogg
    toggleDelay: 1.1
    needOpenClose: true
  - type: RMCSelectiveFire
    baseFireRate: 0.833
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - LauncherCompatibleGrenade
    capacity: 1
    soundInsert:
      path: /Audio/_RMC14/Weapons/Guns/Reload/m79_reload.ogg
    proto: RMCBatonSlugHIRR
  - type: AttachableHolder
    slots:
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: 0, 0.093
  - type: Tag
    tags:
    - RMCWeaponLauncherM85A1
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
      - CMUPathogenWalker

- type: Tag
  id: RMCWeaponLauncherM85A1
