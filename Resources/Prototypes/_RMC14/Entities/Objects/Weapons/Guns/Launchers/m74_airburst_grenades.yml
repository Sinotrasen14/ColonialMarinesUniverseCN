#SHELLS
- type: entity
  abstract: true
  parent: BaseItem
  id: RMCBaseAirBurstGrenade
  name: 空爆榴弹
  components:
  - type: Appearance
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Explosives/grenade_launcher.rsi
    layers:
    - state: grenade_m74_airburst_f
  - type: Item
    size: Small
  - type: Clothing
    slots:
    - suitStorage
  - type: Destructible
    thresholds: []
  - type: IgnorePredictionHide
  - type: Ammo

- type: entity
  parent: RMCBaseAirBurstGrenade
  id: RMC40MMGrenadeM74AGMF
  name: M74 AGM-F 40毫米破片榴弹
  description: M74——空爆榴弹——破片。此榴弹必须用榴弹发射器发射，到达目标位置后即引爆。它会在自身前方以锥形散布锯齿状弹片，将肌腱与装甲一并撕裂。散布模式针对大型目标进行了优化。直接命中时会出现过穿。
  components:
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCAirburstGrenade
    - RMCGrenadeAGMF
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: RMCAirBurstProjectileFrag

- type: entity
  parent: RMC40MMGrenadeM74AGMF
  id: RMC40MMGrenadeM74AGMI
  name: M74 AGM-I 40毫米燃烧榴弹
  description: M74——空爆榴弹——燃烧型。此榴弹必须用榴弹发射器发射，并在到达目标位置后引爆。它会向自身前方锥形区域散布锯齿状破片，撕裂肌腱与装甲。散布模式针对大型目标进行了优化。直接命中时存在过度穿透问题。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Explosives/grenade_launcher.rsi
    layers:
    - state: grenade_m74_airburst_i
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: RMCAirBurstProjectileIncendiary
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCAirburstGrenade
    - RMCGrenadeAGMI

- type: entity
  parent: RMC40MMGrenadeM74AGMF
  id: RMCHornetShellM74AGMS
  name: M74 AGM-H 40毫米大黄蜂弹
  description: 功能与标准 AGM-F 40毫米榴弹完全相同，不同之处在于大黄蜂弹不会炸成破片，而是会射出带有全息瞄准的 .22lr 子弹。在远距离相当于霰弹。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Explosives/grenade_launcher.rsi
    layers:
    - state: grenade_hornet
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: RMCAirBurstProjectileHornet
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCAirburstGrenade
    - RMCGrenadeAGMH

- type: entity
  parent: RMC40MMGrenadeM74AGMF
  id: RMCStarShellM74AGMS
  name: M74 AGM-S照明弹
  description: 功能与标准 AGM-F 40毫米榴弹完全相同，不同之处在于它不会炸出破片，而是爆裂成燃烧的磷，照亮周围区域。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Explosives/grenade_launcher.rsi
    layers:
    - state: grenade_starshell
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: RMCAirBurstProjectileStarShell

- type: entity
  parent: RMC40MMGrenadeM74AGMF
  id: RMCBatonSlugHIRR
  name: HIRR 警棍弹
  description: HIRR警棍弹是M15橡胶弹丸的同类，由于弹托壳体内的推进剂装填过量，已被从军队和民用警察部队中召回。如今，它被用作与人类以及有时非人类部队交战时的一种低致命性选项。历史上，HIRR在大角星冲突期间极受欢迎，因为人们发现其冲击力能通过将大角星抵抗力量的肋骨打断并刺入肺部，可靠地使其失能。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Explosives/grenade_launcher.rsi
    layers:
    - state: baton_slug
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: RMCBatonSlugProjectile
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCGrenadeAGMR
  - type: InheritAcid

- type: entity
  parent: RMC40MMGrenadeM74AGMF
  id: RMC40MMGrenadeM74AGMS
  name: M74 AGM-S 40毫米烟雾弹
  description: M74 - 空爆榴弹 - 烟雾弹。此榴弹必须使用榴弹发射器发射，并在到达目标位置后引爆。引爆时，会立即将其外壳内的多种化学物质混合，形成烟雾云。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Explosives/grenade_launcher.rsi
    layers:
    - state: grenade_m74_airburst_s
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: RMCAirBurstProjectileSmoke
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCAirburstGrenade
    - RMCGrenadeAGMS

- type: entity
  parent: RMC40MMGrenadeM74AGMS
  id: RMC40MMGrenadeM74AGMSVehicle
  components:
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: RMCAirBurstProjectileSmokeVehicle

#PROJECTILES
- type: entity
  abstract: true
  parent: RMCBaseBullet
  id: RMCBaseAirBurstProjectile
  categories: [HideSpawnMenu]
  components:
  - type: TriggerOnFixedDistanceStop
    delay: 0
  - type: SpawnOnTrigger
    proto: CMExplosionEffectGrenade
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Explosives/grenade_launcher.rsi
    layers:
    - state: grenade_m74_airburst_f_active
  - type: Projectile
    deleteOnCollide: false
    impactEffect: BulletImpactEffect
    maxFixedRange: 7
    damage:
      types:
        Piercing: 100
    soundHit:
      path: /Audio/Effects/gen_hit.ogg
  - type: ClusterLimitHits
    limit: 0
    ignoreFirstHit: true
  - type: CMExplosionEffect
    maxShrapnel: 0
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: Fixtures
    fixtures:
      projectile:
        shape: !type:PhysShapeAabb
          bounds: "-0.15,-0.45,0.15,0.15"
        mask:
        - ItemMask
        restitution: 1
  - type: IgnorePredictionHide

- type: entity
  parent: RMCBaseAirBurstProjectile
  id: RMCAirBurstProjectileFrag
  name: M74 AGM-F 40毫米榴弹
  categories: [HideSpawnMenu]
  components:
  - type: ProjectileGrenade
    evenSpread: true
    minVelocity: 0.5
    maxVelocity: 1.5
    fillPrototype: RMCShrapnelJagged
    rebounds: true
    capacity: 16
    spreadAngle: 40
  - type: ClusterLimitHits
    limit: 5

- type: entity
  parent: RMCBaseAirBurstProjectile
  id: RMCAirBurstProjectileIncendiary
  name: M74 AGM-I 40毫米榴弹
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Explosives/grenade_launcher.rsi
    layers:
    - state: grenade_m74_airburst_i_active
  - type: ProjectileGrenade
    evenSpread: true
    minVelocity: 0.5
    maxVelocity: 1.5
    fillPrototype: RMCShrapnelIncendiary
    rebounds: true
    capacity: 5
    spreadAngle: 40
  - type: DirectionalTileFireOnTrigger
    range: 3
    spawn: RMCTileFire
    sound: /Audio/_RMC14/Effects/hit_on_shattered_glass.ogg
    intensity: 20
    duration: 15

- type: entity
  parent: RMCBaseAirBurstProjectile
  id: RMCAirBurstProjectileHornet
  name: M74 AGM-H 40毫米大黄蜂炮弹
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Explosives/grenade_launcher.rsi
    layers:
    - state: grenade_hornet_active
  - type: ProjectileGrenade
    evenSpread: true
    minVelocity: 0.5
    maxVelocity: 1.5
    rebounds: true
    fillPrototype: RMCHornetRound
    capacity: 15
    spreadAngle: 25

- type: entity
  parent: RMCBaseAirBurstProjectile
  id: RMCAirBurstProjectileStarShell
  name: M74 AGM-S 照明弹
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Explosives/grenade_launcher.rsi
    layers:
    - state: grenade_starshell_active
  - type: ProjectileGrenade
    evenSpread: true
    rebounds: true
    fillPrototype: RMCStarShellBullet
    inheritIFF: true
    minVelocity: 0
    maxVelocity: 0
    capacity: 8
    spreadAngle: 360
  - type: Projectile
    impactEffect: BulletImpactEffect
    deleteOnCollide: false
    maxFixedRange: 7
    damage:
      types:
        Piercing: 30
    soundHit:
      path: /Audio/Effects/gen_hit.ogg
  - type: OnShootTriggerAmmoTimer
    delay: 0.25

- type: entity
  parent: RMCBaseAirBurstProjectile
  id: RMCAirBurstProjectileSmoke
  name: M74 AGM-S 40毫米榴弹
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Explosives/grenade_launcher.rsi
    layers:
    - state: grenade_m74_airburst_s_active
  - type: Projectile
    impactEffect: BulletImpactEffect
    deleteOnCollide: false
    maxFixedRange: 9
    damage:
      types:
        Piercing: 30
    soundHit:
      path: /Audio/Effects/gen_hit.ogg
  - type: SpawnOnTerminate
    spawn: RMCSmoke
  - type: EmitSoundOnTrigger
    sound: /Audio/Effects/smoke.ogg
    positional: true
  - type: DeleteOnTrigger

- type: entity
  parent: RMCAirBurstProjectileSmoke
  id: RMCAirBurstProjectileSmokeVehicle
  categories: [HideSpawnMenu]
  components:
  - type: ProjectileSpread
    proto: RMCAirBurstProjectileSmokeVehicle
    count: 3
    spread: 45
  - type: TimedDespawn
    lifetime: 2

#Payload projectiles
- type: entity
  parent: RMCBaseBullet
  id: RMCStarShellBullet
  name: 照明弹
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/airburst_projectiles.rsi
    layers:
    - state: starshell_bullet
  - type: GunIFF
    enabled: true
  - type: Projectile
    deleteOnCollide: false
    impactEffect: BulletImpactEffect
    damage:
      types:
        Piercing: 2.5
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: ScatteringGrenade
    triggerOnWallCollide: true
    fillPrototype: RMCStarShellAsh
    capacity: 1
    delayBeforeTriggerContents: 0
    distance: 0
    toggleContents: true
  - type: PointLight
    enabled: true
    color: "#FFCCCC"
    radius: 2.0
    energy: 7.0
  - type: IgniteOnProjectileHit
    duration: 2
  - type: Fixtures
    fixtures:
      projectile:
        hard: false
        shape: !type:PhysShapeAabb
          bounds: "-0.15,-0.45,0.15,0.15"
        mask:
        - Impassable
        - BulletImpassable

- type: entity
  parent: RMCBaseBullet
  id: RMCBaseAirburstRound
  categories: [HideSpawnMenu]
  abstract: true
  components:
  - type: PreventCollideWithDead

- type: entity
  parent: RMCBaseAirburstRound
  id: RMCHornetRound
  name: .22霍纳特弹
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/airburst_projectiles.rsi
    layers:
    - state: hornet_round
  - type: HoloTargeting
    stacks: 20
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Piercing: 10
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: CMArmorPiercing
    amount: 25

- type: entity
  parent: RMCBaseAirburstRound
  id: RMCShrapnelJagged
  name: 锯齿状弹片
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/shotgun_projectiles.rsi
    layers:
    - state: buckshot
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Piercing: 30
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: CMArmorPiercing
    amount: 10
  - type: RMCStunOnHit
    stuns:
    - whitelist:
        minMobSize: VerySmallXeno
      maxRange: 10
      stunTime: 0
      slowTime: 0.8
  - type: RMCProjectileAccuracy
    accuracy: 100
    thresholds:
    - range: 7
      falloff: 33

- type: entity
  parent: RMCBaseAirburstRound
  id: RMCShrapnelIncendiary
  name: 燃烧的弹片
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/shotgun_projectiles.rsi
    layers:
    - state: beanbag
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Piercing: 30
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: CMArmorPiercing
    amount: 20
  - type: IgniteOnProjectileHit
  - type: PointLight
    enabled: true
    color: "#ff4300"
    radius: 1.5
    energy: 0.5
  - type: RMCProjectileAccuracy
    accuracy: 100
    thresholds:
    - range: 7
      falloff: 33

- type: entity
  parent: RMCBaseBullet
  id: RMCBatonSlugProjectile
  name: HIRR警棍弹
  description: 作为M15橡胶弹丸的同类，HIRR警棍弹曾因弹托外壳内推进剂装填过量，而被从军队和民用警察部队中召回。如今，它被用作与人类、有时是非人类部队交战时的低致命性选项。历史上，HIRR在阿克图鲁斯冲突期间极其受欢迎，因为其冲击力被证实能通过打断他们的肋骨并使其刺入肺部，可靠地使阿克图鲁斯抵抗力量丧失战斗力。
  categories: [HideSpawnMenu]
  components:
  - type: TriggerOnFixedDistanceStop
    delay: 0
  - type: IgnorePredictionHide
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Explosives/grenade_launcher.rsi
    layers:
    - state: baton_slug_active
      shader: unshaded
  - type: Projectile
    deleteOnCollide: false
    impactEffect: BulletImpactEffect
    damage:
      types:
        Blunt: 15
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: RMCStunOnHit
    stuns:
    - whitelist:
      maxRange: 10
      stunTime: 1.6
      slowTime: 4
      knockBackPowerMin: 1
      knockBackPowerMax: 3
      knockBackSpeed: 5
      forceKnockBack: true
      slowsEffectBigXenos: true
      dazeTime: 3.4
  - type: RMCProjectileAccuracy
    accuracy: 100
    thresholds:
    - range: 7
      falloff: 10
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: ScatteringGrenade
    spreadAngle: 45
    directHitTrigger: true
    fillPrototype: RMCBatonSlugHIRR
    capacity: 1
    distance: 1
  - type: InheritAcid
  - type: IgnoreArc
  - type: Fixtures
    fixtures:
      projectile:
        shape: !type:PhysShapeAabb
          bounds: "-0.15,-0.45,0.15,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable

