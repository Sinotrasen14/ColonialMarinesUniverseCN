- type: entity
  name: M81 防暴榴弹发射器
  parent: [RMCBaseWeaponGrenadeLauncher]
  id: RMCWeaponLauncherM81
  description: M81防暴榴弹发射器是一款单发、肩射、折开式榴弹发射器，专为警察使用低致命弹药而设计。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/GrenadeLaunchers/m81.rsi
    layers:
    - state: base
      map: ["enum.BreechVisuals.Open"]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/GrenadeLaunchers/m79.rsi
    slots:
    - Back
    - suitStorage
  - type: Gun
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/m79_shoot.ogg
  - type: RMCSelectiveFire
    baseFireRate: 0.833
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - RMCGrenadeRiot
    capacity: 1
    soundInsert:
      path: /Audio/_RMC14/Weapons/Guns/Reload/m79_reload.ogg
  - type: GenericVisualizer
    visuals:
      enum.BreechVisuals.Open:
        enum.BreechVisuals.Open:
          true: {state: bolt-open}
          false: {state: base}
  - type: UniqueAction
  - type: BreechLoaded
    needOpenClose: false
  - type: RequiresSkill
    skills:
      RMCSkillPolice: 1
