- type: entity
  parent: [BaseWeaponLauncher, CMBaseWeaponGun]
  id: RMCBaseWeaponLauncher
  abstract: true
  components:
  - type: GuideHelp
    guides:
    - RMCGuideRoleSpecDemo
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/RocketLaunchers/m5spec.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    quickEquip: true
    slots:
    - suitStorage
  - type: Gun
    fireRate: 0.83
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/m5_shoot.ogg
    resetOnHandSelected: false
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - RMCRocketAmmo84mm
    capacity: 1
    cycleable: true
    mayTransfer: false
    insertDelay: 6.0
    cycleDelay: 6.0
    proto: RMCRocket84mm
    soundInsert:
      path: /Audio/_RMC14/Weapons/Guns/Cock/m5_ammo.ogg
  - type: Corrodible
    isCorrodible: true
  - type: ExplosionResistance
    damageCoefficient: 0
  - type: Wieldable
  - type: GunRequiresWield
  - type: RMCNameItemOnVend
    item: PrimaryGun
  - type: OnShootTriggerAmmoTimer
    delay: 0.2 # TODO RMC14 Make some way for rockets to explode when they stop, for shooting at the ground closer than max range.
    # This is a temporary hack to guarantee it will always go off after stopping even if it doesn't collide with anything.
    # Works for almost all gameplay purposes at least right now because even max range rockets are less than 0.2s and it's fast enough not matter.
  - type: ShootAtFixedPoint
    shootArcProj: false
  - type: WieldableSpeedModifiers
    base: 0.5
    light: 0.69
    medium: 0.75
    heavy: 0.806
  - type: WieldDelay
    baseDelay: 1.2
    preventFiring: true
  - type: IgnorePredictionHide
  - type: GunIgnorePrediction
  - type: AssistedReloadWeapon
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/explosive_mouse.rsi
      state: all

- type: entity
  parent: [RMCBaseWeaponLauncher, RMCBaseAttachableHolder]
  name: M7肩射多用途突击武器
  id: RMCWeaponLauncherM5ATL
  description: "M7肩射多用途突击武器是一种威力强大的反装甲步兵武器。它用于摧毁轻型坦克和敌方建筑，是一种具有多种战斗用途的危险武器，具体取决于装填的弹药，并且能够发射炮弹和火箭推进榴弹。"
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/RocketLaunchers/m5atl/m5atl_inhands.rsi
    layers:
    - state: base
      sprite: _RMC14/Objects/Weapons/Guns/RocketLaunchers/m5atl/m5atl_icon.rsi
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/RocketLaunchers/m5atl/m5atl_inhands.rsi
  - type: Gun
    fireRate: 0.83
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/m5_shoot.ogg
  - type: Corrodible
    isCorrodible: false
  - type: RMCMagneticItem
  # cmu edit start
  - type: CMUBackblast
    nearEffect: CMUBackblastSmokeNear
    farEffect: CMUBackblastSmokeFar
  # cmu edit end
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
      - CMUPathogenWalker
#  - type: GunUserWhitelist # CMU14
#    whitelist:
#      components:
#      - DemoSpecWhitelist

- type: entity
  parent: [RMCBaseWeaponLauncher, RMCBaseAttachableHolder]
  name: EMBLR
  id: CMUWeaponLauncherEMBLR
  description: "一种德国设计的便携式防空导弹系统，旨在取代老旧的俄制“长矛”导弹发射器。它在排级层面为UPPAC成员提供了尚可的防空能力。该装备的电子系统似乎已被拆除，使其变成一种“反坦克武器”。"
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/UPP/emblr/emblr_inhands.rsi
    layers:
    - state: base
      sprite: CMU14/Weapons/Guns/UPP/emblr/emblr_icon.rsi
      map: ["enum.GunVisualLayers.Base"]
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CMURocketAmmo70mm
    capacity: 1
    cycleable: true
    mayTransfer: false
    insertDelay: 6.0
    cycleDelay: 6.0
    proto: CMURocket70mm
  - type: Clothing
    sprite: CMU14/Weapons/Guns/UPP/emblr/emblr_inhands.rsi
  - type: Gun
    fireRate: 0.83
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/m5_shoot.ogg
  - type: Corrodible
    isCorrodible: false
  - type: RMCMagneticItem
  # cmu edit start
  - type: CMUBackblast
    nearEffect: CMUBackblastSmokeNear
    farEffect: CMUBackblastSmokeFar
  # cmu edit end
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
      - CMUPathogenWalker
  - type: GunUserWhitelist # CMU14: demo specialist only
    whitelist:
      components:
      - DemoSpecWhitelist

# 84mm HE
- type: entity
  id: RMCRocket84mm
  name: 84毫米高爆火箭弹
  parent: BaseItem
  description: 可与M5-ATL兼容并装有高爆弹头的火箭发射管。直接命中时对软目标造成高额伤害，并在5米宽范围内溅射其他目标。对重装甲目标效果减弱。
  components:
  - type: Tag
    tags:
    - RMCRocketAmmo84mm
  - type: CartridgeAmmo
    proto: RMCProjectileRocket84mm
    deleteOnSpawn: false
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Explosives/m5spec.rsi
    layers:
    - state: m5_84mm_he
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Item
    size: Normal
  - type: Appearance
  - type: SpentAmmoVisuals
    state: m5_84mm_he
    suffix: false
  - type: IgnorePredictionHide
  - type: AssistedReloadAmmo

- type: entity
  id: CMURocket70mm
  name: 70毫米高爆火箭弹
  parent: BaseItem
  description: 一个用于EMBLR地对空武器系统的矮粗导弹发射筒。与其USCM对应型号不同，“鹅”携带一个小而威力强大的弹头。这一个的侧面写有‘高爆’。
  components:
  - type: Tag
    tags:
    - CMURocketAmmo70mm
  - type: CartridgeAmmo
    proto: CMUProjectileRocket70mmHE
    deleteOnSpawn: false
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Explosives/emblr.rsi
    layers:
    - state: emblr
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Item
    size: Normal
  - type: Appearance
  - type: SpentAmmoVisuals
    state: spent
    suffix: false
  - type: IgnorePredictionHide
  - type: AssistedReloadAmmo

- type: entity
  id: CMUProjectileRocket70mm
  name: 70毫米高爆火箭弹
  categories: [HideSpawnMenu]
  description: 哎呀。
  components:
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      projectile:
        shape: !type:PhysShapeAabb
          bounds: "-0.15,-0.15,0.15,0.15"
          # Bigger than bullets. Rectangle won't work since AABB shapes don't rotate. This should help significantly with explosion consistency.
        hard: false
        mask:
        - Impassable
        - BulletImpassable
        restitution: 0.0
        density: 20
  - type: Projectile
    deleteOnCollide: false
    impactEffect: BulletImpactEffect
    damage:
      types:
        Blunt: 15
    maxFixedRange: 6 # 7 tiles
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/emblr.rsi
    layers:
    - state: emblr_projectile
  - type: IgnorePredictionHide
  - type: RMCProjectileAccuracy
    accuracy: 95
    thresholds:
    - range: 7
      falloff: 10
  - type: DeleteOnTrigger

- type: entity
  parent: CMUProjectileRocket70mm
  id: CMUProjectileRocket70mmHE
  name: 70毫米高爆火箭弹
  categories: [HideSpawnMenu]
  description: 哎呀。
  components:
  - type: TriggerOnCollide
    # TODO RMC14 Make TriggerOnCollide spawn the explosion on the OtherEntity tile more consistently, so the explosion is centered properly
    fixtureID: projectile # no parent entity from BaseBulletTrigger because it has Clickable
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: RMC
    maxIntensity: 30
    intensitySlope: 10
    totalIntensity: 290
    maxTileBreak: 0
  - type: CMExplosionEffect
  - type: RMCScorchEffect
  - type: PointLight
    radius: 3.5
    color: orange
    energy: 0.5
  - type: IgnorePredictionHide
  - type: RMCProjectileAccuracy
    accuracy: 95
    thresholds:
    - range: 7
      falloff: 10
  - type: VehicleDamageMultiplier
    multiplier: 8

