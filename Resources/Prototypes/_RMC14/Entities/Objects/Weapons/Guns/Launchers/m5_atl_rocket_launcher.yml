  name: 84毫米反装甲火箭
  parent: RMCRocket84mm
  description: 一种与M5-ATL兼容的火箭筒，装有穿甲弹头。能够穿透并击倒重装甲目标。几乎不造成溅射伤害。对大多数目标必定造成眩晕。在7米内具有高精度。
  components:
  - type: CartridgeAmmo
    proto: RMCProjectileRocket84mmAntiArmor
    deleteOnSpawn: false
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Explosives/m5spec.rsi
    layers:
