      map: ["enum.AmmoVisualLayers.Base"]
  - type: SpentAmmoVisuals
    state: spent
    suffix: false
  - type: IgnorePredictionHide

- type: entity
  id: CMUProjectileRocket70mmAntiArmor
  name: 70毫米反装甲火箭弹
  parent: CMUProjectileRocket70mm
  categories: [HideSpawnMenu]
  components:
  - type: TankCookOffProjectile # CMU14
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Blunt: 160
        Heat: 150
        # 10 brute damage + 150 brute and 150 burn to simulate direct explosive damage.
        # Temporary mechanic to make it consistent with intended main target damage.
    maxFixedRange: 5 # 6 tiles
  - type: CMArmorPiercing
    amount: 100 # Ignores all armor.
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/emblr.rsi
    layers:
    - state: emblr_projectile
  - type: Explosive
    # TODO RMC14 Very inconsistent because explosions spawn at epicenter of the rocket, not the hit entity. Proper values are around (50, 40, 90)
    explosionType: RMC
    maxIntensity: 10
    intensitySlope: 5
    totalIntensity: 35
    maxTileBreak: 0
  - type: RMCKnockOutOnCollide # Hardcoded 6 second stun, different from explosions.
    paralyzeTime: 6
  - type: IgnorePredictionHide
  - type: RMCProjectileAccuracy
    accuracy: 125
    thresholds:
    - range: 6
      falloff: 10
  - type: VehicleDamageMultiplier
    multiplier: 10



