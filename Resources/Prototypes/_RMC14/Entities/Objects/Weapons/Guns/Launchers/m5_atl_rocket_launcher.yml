      map: ["enum.AmmoVisualLayers.Base"]
  - type: SpentAmmoVisuals
    state: m5_84mm_ap
    suffix: false
  - type: IgnorePredictionHide

- type: entity
  id: CMURocket70mmAntiArmor
  name: 70毫米反装甲火箭
  parent: CMURocket70mm
  description: 一个用于EMBLR地对空武器系统的粗短导弹发射筒。与美国殖民地海军陆战队的对应型号不同，“鹅”式携带了一枚小巧但威力强大的弹头。这一枚的侧面写有“穿甲”字样。
  components:
  - type: CartridgeAmmo
    proto: RMCProjectileRocket84mmAntiArmor
    deleteOnSpawn: false
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Explosives/emblr.rsi
    layers:
