# Base
- type: entity
  abstract: true
  id: RMCMechBase
  components:
  - type: Corrodible
    isCorrodible: true
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _RMC14/Objects/power_loader.rsi
    layers:
    - state: powerloader_open
      map: ["buckledLayer"]
  - type: MobMover
  - type: DoAfter
  - type: MeleeWeapon
    hidden: true
    attackRate: 1
    damage:
      types:
        Blunt: 30
    soundHit:
      collection: MetalThud
  - type: Puller
    needsHands: false
  - type: InputMover
  - type: InteractionOutline
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 1
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: CMUZPhysics
  - type: CMUVehicleZTraversal
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Appearance
  - type: ContainerContainer
    containers:
      rmc-mech-pilot: !type:ContainerSlot
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Mecha/sound_mecha_powerloader_step.ogg
  - type: RMCAllowStrapMovement
  - type: Strap
    buckleSound:
      path: /Audio/_RMC14/Mecha/powerloader_buckle.ogg
      params:
        variation: 0.1
    unbuckleSound:
      path: /Audio/_RMC14/Mecha/powerloader_unbuckle.ogg
      params:
        variation: 0.1
    blacklist:
      components:
      - Xeno
  - type: RMCStrapDrawDepth
    unstrappedDepth: Mobs
    strappedDepth: OverMobs
  - type: GenericVisualizer
    visuals:
      enum.StrapVisuals.State:
        buckledLayer:
          true: {state: powerloader_overlay}
          false: {state: powerloader_open}
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          RMCPowerCellAPC:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]

# Wreckages
- type: entity
  id: RMCMechPowerLoaderWreckage
  name: 卡特彼勒 P-5000 工作装载机残骸
  description: 某台不幸工作装载机的残骸。完全无法修复。
  components:
  - type: Corrodible
    isCorrodible: true
  - type: Sprite
    drawdepth: BelowMobs
    noRot: true
    sprite: _RMC14/Objects/power_loader.rsi
    layers:
    - state: wreck
  - type: Clickable
  - type: InputMover
  - type: InteractionOutline
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Mecha/sound_mecha_powerloader_step.ogg
  - type: Strap
    blacklist:
      components:
      - Xeno
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: RMCMechPowerLoaderWreckage
  id: RMCMechPowerLoaderWreckageGreen
  name: 约翰迪尔4300动力装载机残骸
  components:
  - type: Sprite
    drawdepth: BelowMobs
    noRot: true
    sprite: _RMC14/Objects/power_loader.rsi
    layers:
    - state: wreck_jd

- type: entity
  parent: RMCMechPowerLoaderWreckage
  id: RMCMechPowerLoaderWreckageBlue
  name: 卡特彼勒 P-5200 装载机残骸
  components:
  - type: Sprite
    drawdepth: BelowMobs
    noRot: true
    sprite: _RMC14/Objects/power_loader.rsi
    layers:
    - state: wreck_ft

- type: entity
  parent: RMCMechBase
  id: RMCMechPowerLoader
  name: 卡特彼勒 P-5000 工作装载机
  description: 卡特彼勒 P-5000 工作装载机是一款商用机械化外骨骼，用于搬运重型材料和物体，最初由威兰德公司于2025年1月29日设计。这是一种陈旧但可靠的设计，广泛用于各地的仓库、建筑工地和军用舰船。
  components:
  - type: PowerLoader
    skills:
      all:
        RMCSkillPowerLoader: 1
  - type: CMUVehicleZTraversal
    canUseStairs: true
  - type: Hands
  - type: GiveHands
    hands:
    - name: 右手
      location: Right
    - name: 左手
      location: Left
  - type: IgnoreInteractionRange
    whitelist:
      tags:
      - RMCDropshipEnginePoint
    range: 2
  - type: SpawnOnTerminate
    spawn: RMCMechPowerLoaderWreckage

- type: entity
  parent: RMCMechPowerLoader
  id: RMCMechPowerLoaderGreen
  name: 约翰迪尔 4300 动力装载机
  description: 约翰迪尔 4300 动力装载机是一种商用机械外骨骼，用于举升重型材料和物体，以卡特彼勒 P-5000 为基础，最初由韦兰公司于 2025 年 1 月 29 日设计。这是一种老旧但可靠的设计，广泛应用于各地的仓库、建筑工地和军用舰船。这一台拥有标志性的绿色与黄色涂装。
  components:
  - type: Sprite
    layers:
    - state: powerloader_open_jd
      map: ["buckledLayer"]
  - type: GenericVisualizer
    visuals:
      enum.StrapVisuals.State:
        buckledLayer:
          true: {state: powerloader_overlay_jd}
          false: {state: powerloader_open_jd}
  - type: SpawnOnTerminate
    spawn: RMCMechPowerLoaderWreckageGreen

- type: entity
  parent: RMCMechPowerLoader
  id: RMCMechPowerLoaderBlue
  name: 卡特彼勒 P-5200 工作装载机
  description: 现代化的设计，旨在超越曾用于高级港口和设施的老旧型号。
  components:
  - type: Sprite
    layers:
    - state: powerloader_open_ft
      map: ["buckledLayer"]
  - type: GenericVisualizer
    visuals:
      enum.StrapVisuals.State:
        buckledLayer:
          true: {state: powerloader_overlay_ft}
          false: {state: powerloader_open_ft}
  - type: SpawnOnTerminate
    spawn: RMCMechPowerLoaderWreckageBlue
