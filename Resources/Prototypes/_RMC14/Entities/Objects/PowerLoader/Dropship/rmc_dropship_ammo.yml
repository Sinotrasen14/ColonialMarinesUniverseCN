- type: entity
  abstract: true
  parent: RMCDropshipAttachmentBase
  id: RMCDropshipAttachmentAmmo
  components:
  - type: Sprite
    sprite: _RMC14/Objects/dropship_ammo.rsi
  - type: DropshipAmmo
    rounds: 400
    maxRounds: 400
  - type: PowerLoaderAttachable
    attachableTypes:
    - RMCDropshipWeaponPoint
  - type: PowerLoaderDetachable
  - type: PowerLoaderGrabbable
    virtualRight: RMCVirtualDropshipAmmoRight
    virtualLeft: RMCVirtualDropshipAmmoLeft
  - type: Appearance

- type: entity
  parent: RMCDropshipAttachmentAmmo
  id: RMCDropshipAttachmentAmmoGAU
  name: PGU-100多用途30毫米弹药箱
  description: "一箱装满PGU-100 30毫米多用途弹药的弹药箱，专为穿透轻型（非加固）结构而设计，同时可撕碎步兵、IAV、LAV、IMV和MRAP。可在广阔区域内用于对付4级及更高级别的外星虫族侵扰，也符合允许用于对抗4级及更高级别叛乱势力的武器装备规定。然而，它缺乏穿甲能力，因此需要使用反坦克30毫米弹药。可装入GAU-21 30毫米机炮。"
  components:
  #cmu start
  - type: RMCGenericExamine
    message: It can penetrate 1 z-level.
  #cmu end
  - type: Sprite
    layers:
    - state: 30mm_crate_10
      map: ["enum.DropshipAmmoVisuals.Fill"]
  - type: DropshipAmmo
    ammoType: 30mm_crate
    rounds: 400
    maxRounds: 400
    roundsPerShot: 40
    fireMissionDelay: 1
    damage:
      types:
        Blunt: 35
        Slash: 35
        Piercing: 35
    armorPiercing: 10
    zLevelPenetration: 1
    applyEffectsOnPenetrationLevels: true
    weapon: RMCDropshipAttachmentGau21Cannon
    soundCockpit: /Audio/_RMC14/Dropship/gau_incockpit.ogg
    soundGround: /Audio/_RMC14/Dropship/gau.ogg
    soundImpact:
      path: /Audio/_RMC14/Dropship/gauimpact.ogg
      params:
        volume: -6
    impactEffects:
    - RMCEffectExplosionParticle
  - type: DropshipFabricatorPrintable
    category: Ammo
    cost: 400

- type: entity
  parent: RMCDropshipAttachmentAmmoGAU
  id: RMCDropshipAttachmentAmmoGAUAP
  name: PGU-105 30毫米反坦克弹药箱
  description: "一整箱PGU-105特种30毫米APFSDS钛钨合金穿甲弹，专为在近距离空中支援中对抗同级和接近同级的装甲运兵车、步兵战车和主战坦克而制造。当从GAU-21发射时，它设计为可击穿最高相当于1350毫米轧制均质装甲的厚度。然而，它对软目标的效能要低得多，这种情况下建议使用30毫米普通弹。警告：如果运输机未以所需速度拉起，弹药脱落的弹托可能有害。请查阅手册第3574页，该手册可在任何AEGIS商店订购。可装填至GAU-21 30毫米机炮。"
  components:
  #cmu start
  - type: RMCGenericExamine
    message: It can penetrate 2 z-levels.
  #cmu end
  - type: Sprite
    layers:
    - state: 30mm_crate_hv_10
      map: ["enum.DropshipAmmoVisuals.Fill"]
  - type: DropshipAmmo
    ammoType: 30mm_crate_hv
    bulletSpread: 4
    damage:
      types:
        Blunt: 26.66
        Slash: 26.67
        Piercing: 26.67
    armorPiercing: 40
    travelTime: 6
    #cmu start
    zLevelPenetration: 2
    applyEffectsOnPenetrationLevels: true
    #cmu end
  - type: DropshipFabricatorPrintable
    category: Ammo
    cost: 450

- type: entity
  id: RMCEffectExplosionParticle
  name: 爆炸
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Effects/effects.rsi
    state: explosion_particle
  - type: TimedDespawn
    lifetime: 0.5
  - type: EffectAlphaAnimation
  - type: PointLight
    enabled: true
    radius: 1
  - type: RMCScorchEffectOnSpawn
    probability: 0.5
    tileLimit: 4
    scatter: true
    randomRotation: true

- type: entity
  abstract: true
  parent: RMCDropshipAttachmentAmmo
  id: RMCDropshipAttachmentAmmoRocket
  name: 抽象火箭
  components:
  #cmu start
  - type: RMCGenericExamine
    message: It can penetrate 2 z-levels.
  #cmu end
  - type: Sprite
    sprite: _RMC14/Objects/dropship_ammo_64.rsi
    offset: 0.5, 0.5
