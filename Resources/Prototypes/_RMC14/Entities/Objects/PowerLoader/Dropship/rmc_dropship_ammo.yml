    #cmu start
    zLevelPenetration: 2
    applyEffectsOnPenetrationLevels: true
    #cmu end
    weapon: RMCDropshipAttachmentGuidedMissileLauncher
    soundCockpit: /Audio/_RMC14/Effects/rocketpod_fire.ogg
    soundMarker: /Audio/_RMC14/Effects/rocketpod_fire.ogg #IncommingRocket.ogg sounds better, and more accurate, but this is what is used in parity, i believe it to be a mistake in the original PR, but we can change it in the future
    deleteOnEmpty: true

- type: entity
  parent: RMCDropshipAttachmentAmmoRocket
  id: RMCDropshipAttachmentAmmoRocketWidowmaker
  name: AIM-224A“寡妇制造者”
  description: AIM-224A导弹是最新空对空导弹技术的改装型。由于对其制导战斗部的改进使其无法被干扰，进而造就了其高击杀率，因此被众多运输机飞行员起了“寡妇制造者”的绰号。它不太适合对地轰炸，但其高速使其能迅速抵达目标。由于运输机弹药短缺，这一枚已被改装为自由落体炸弹。可装入LAU-444制导导弹发射器。
  components:
  #cmu start
  - type: RMCGenericExamine
    message: It can penetrate 2 z-levels.
  #cmu end
  - type: DropshipAmmo
    travelTime: 3
    #cmu start
    zLevelPenetration: 2
    applyEffectsOnPenetrationLevels: true
    #cmu end
    explosion:
      total: 3000
      slope: 5.5
      max: 55
  - type: DropshipFabricatorPrintable
    category: Ammo
    cost: 700

