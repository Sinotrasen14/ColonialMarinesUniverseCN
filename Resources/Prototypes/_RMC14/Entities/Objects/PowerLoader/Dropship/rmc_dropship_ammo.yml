- type: entity
  parent: RMCDropshipAttachmentAmmo
  id: RMCDropshipAttachmentAmmoGAU
  name: PGU-100多用途30毫米弹药箱
  description: "一箱装满PGU-100 30毫米多用途弹药的弹药箱，专为穿透轻型（非加固）结构而设计，同时可撕碎步兵、IAV、LAV、IMV和MRAP。可在广阔区域内用于对付4级及更高级别的外星虫族侵扰，也符合允许用于对抗4级及更高级别叛乱势力的武器装备规定。然而，它缺乏穿甲能力，因此需要使用反坦克30毫米弹药。可装入GAU-21 30毫米机炮。"
  components:
  - type: Sprite
    layers:
    - state: 30mm_crate_10
      map: ["enum.DropshipAmmoVisuals.Fill"]
  - type: DropshipAmmo
    ammoType: 30mm_crate
    rounds: 400
    maxRounds: 400
    roundsPerShot: 40
    fireMissionDelay: 1
    damage:
      types:
        Blunt: 35
        Slash: 35
        Piercing: 35
    armorPiercing: 10
    weapon: RMCDropshipAttachmentGau21Cannon
    soundCockpit: /Audio/_RMC14/Dropship/gau_incockpit.ogg
    soundGround: /Audio/_RMC14/Dropship/gau.ogg
    soundImpact:
      path: /Audio/_RMC14/Dropship/gauimpact.ogg
      params:
        volume: -6
    impactEffects:
    - RMCEffectExplosionParticle
  - type: DropshipFabricatorPrintable
    category: Ammo
    cost: 400

