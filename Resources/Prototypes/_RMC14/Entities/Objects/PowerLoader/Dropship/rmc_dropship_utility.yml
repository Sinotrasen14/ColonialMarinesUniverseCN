- type: entity
  abstract: true
  parent: RMCDropshipAttachmentBase
  id: RMCDropshipAttachmentUtility
  components:
  - type: Sprite
    sprite: _RMC14/Objects/dropship_utility_attachments.rsi
  - type: DropshipFabricatorPrintable
    category: Equipment
    cost: 400
  - type: PowerLoaderGrabbable
    delay: 1
  - type: DropshipUtility
    skills:
      all:
        RMCSkillPilot: 2
  - type: PowerLoaderAttachable
    attachDelay: 7
    attachableTypes:
    - RMCDropshipUtilityPoint
  - type: PowerLoaderDetachable
    detachDelay: 7

- type: entity
  parent: RMCDropshipAttachmentUtility
  id: RMCDropshipAttachmentMedevac
  name: RMU-4M医疗后送系统
  description: 一种绞盘系统，用于将躺在医用担架上的受伤陆战队员吊运到运输机上。可连接至运输机后部的乘员使用挂载点。
  components:
  - type: Sprite
    layers:
    - state: medevac_system
  - type: DropshipFabricatorPrintable
    cost: 50
  - type: DropshipUtility
    activateDelay: 20
    activateInTransport: true
    skills:
      all:
        RMCSkillMedical: 2
  - type: DropshipAttachedSprite
    sprite:
      sprite: _RMC14/Objects/dropship_utility_attachments.rsi
      state: medevac_system_deployed
  - type: Medevac
  - type: AnimationPlayer

- type: entity
  parent: RMCDropshipAttachmentUtility
  id: RMCDropshipAttachmentFulton
  name: RMU-19富尔顿回收系统
  description: 一种用于在高空回收任何富尔顿回收气球的绞盘系统。请务必将其开启！
  components:
  - type: Sprite
    layers:
    - state: fulton_system
  - type: DropshipFabricatorPrintable
    cost: 50
  - type: DropshipUtility
    activateDelay: 5
    activateInTransport: true
  - type: DropshipAttachedSprite
    sprite:
      sprite: _RMC14/Objects/dropship_utility_attachments.rsi
      state: fulton_system_deployed
  - type: RMCFulton
  - type: AnimationPlayer

- type: entity
  parent: RMCDropshipAttachmentUtility
  id: RMCDropshipAttachmentParaDrop
  name: HPU-1 空投部署系统
  components:
  - type: Sprite
    layers:
    - state: paradrop_system
  - type: DropshipFabricatorPrintable
    cost: 50
  - type: DropshipUtility
  - type: DropshipAttachedSprite
    sprite:
      sprite: _RMC14/Objects/dropship_utility_attachments.rsi
      state: paradrop_system_deployed
  - type: RMCParaDrop

- type: entity
  parent: RMCDropshipAttachmentUtility
  id: RMCDropshipAttachmentDoorGun
  name: MTU-4B 舱门机枪手硬点系统
  description: 一个可部署一挺需多人操作、带瞄准镜的M56D重机枪的箱体。可安装在运输机的外挂武器挂点和乘员舱挂点上。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/dropship_utility_attachments.rsi
    layers:
    - state: mg_system
  - type: DropshipFabricatorPrintable
    cost: 500
  - type: DropshipUtility
  - type: DropshipAttachedSprite
    sprite:
      sprite: _RMC14/Objects/dropship_utility_attachments.rsi
      state: mg_system_installed
    weaponSlotSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: mg_system_installed
  - type: PowerLoaderAttachable
    attachableTypes:
    - RMCDropshipUtilityPoint
    - RMCDropshipWeaponPoint
    - CMUGunshipHardpointAttachmentPoint
  - type: RMCEquipmentDeployer
    deployPrototype: RMCML66DNestDropship
    isDeployableByHand: true
    utilityDeployedSprite:
      sprite: _RMC14/Objects/dropship_utility_attachments.rsi
      state: mg_system_deployed
    weaponDeployedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: mg_system_deployed
    blacklist:
      components:
      - Xeno
  - type: GunshipDoorGunnerAttachment

- type: entity
  parent: RMCDropshipAttachmentDoorGun
  id: CMUDropshipAttachmentDoorGunM2C
  name: MTU-4C M2C 舱门机枪手挂载点系统
  description: 一个可展开需多人操作的 M2C 重机枪的箱体。可安装在武装直升机挂载点连接点上。
  components:
  - type: PowerLoaderAttachable
    attachableTypes:
    - CMUGunshipHardpointAttachmentPoint
  - type: RMCEquipmentDeployer
    deployPrototype: CMUM2CDoorGunDropship

- type: entity
  parent: RMCDropshipAttachmentUtility
  id: RMCDropshipAttachmentSentryDefenseSystem
  name: A/A-32-P 哨戒防御系统
  description: 一个可展开哨戒炮塔的箱体。可同时安装于运输机的外部武器挂点和乘员舱挂点。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/dropship_utility_attachments.rsi
    layers:
    - state: sentry_system
  - type: DropshipFabricatorPrintable
    cost: 300
  - type: DropshipUtility
  - type: DropshipAttachedSprite
    sprite:
      sprite: _RMC14/Objects/dropship_utility_attachments.rsi
      state: sentry_system_installed
    weaponSlotSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: sentry_system_installed
  - type: PowerLoaderAttachable
    attachableTypes:
    - RMCDropshipUtilityPoint
    - RMCDropshipWeaponPoint
  - type: RMCEquipmentDeployer
    deployPrototype: RMCSentryDropship
    dropShipWindowButtonText: Sentry
    starboardForeDeployDirection: 0, 1
    portForeDeployDirection: 0, 1
    starboardWingDeployDirection: 1, 0
    portWingDeployDirection: -1, 0
    utilityDeployedSprite:
      sprite: _RMC14/Objects/dropship_utility_attachments.rsi
      state: sentry_system_deployed
    weaponDeployedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: sentry_system_deployed
    blacklist:
      components:
      - Xeno

- type: entity
  parent: RMCDropshipAttachmentUtility
  id: RMCDropshipAttachmentLaunchBay
  name: LAG-14内置哨兵发射器
  description: 一个用于投放特殊弹药的发射舱。可装入运输机的乘员武器基座内。移动它需要某种起重设备。可使用 A/C-49-P 空投哨兵作为弹药。
  components:
  - type: Sprite
    layers:
    - state: launch_bay
  - type: DropshipFabricatorPrintable
    cost: 300
  - type: DropshipUtility
  - type: DropshipAttachedSprite
    sprite:
      sprite: _RMC14/Objects/dropship_utility_attachments.rsi
      state: launch_bay_deployed
  - type: RMCOrbitalDeployer
  - type: PowerLoaderAttachable
    attachableTypes:
    - RMCDropshipUtilityPoint
    - CMUGunshipUtilityAttachmentPoint

- type: entity
  parent: RMCDropshipAttachmentUtility
  id: CMUDropshipAttachmentEEXRappelSystem
  name: EEX 索降系统
  description: 一种可展开的索降系统，用于在战术悬停状态下从运输机部署陆战队员。需要下方一层有坚实且无障碍的地面。
  components:
  - type: Sprite
    layers:
    - state: paradrop_system
  - type: DropshipFabricatorPrintable
    cost: 300
  - type: DropshipUtility
  - type: DropshipAttachedSprite
    sprite:
      sprite: _RMC14/Objects/dropship_utility_attachments.rsi
      state: paradrop_system_deployed
  - type: PowerLoaderAttachable
    attachableTypes:
    - RMCDropshipUtilityPoint
    - CMUGunshipUtilityAttachmentPoint
  - type: RMCEquipmentDeployer
    deployPrototype: CMUEEXRappelDropshipEndpoint
    dropShipWindowButtonText: Rappel
    canAutoDeploy: false
    isDeployableByHand: true
    serverAuthoritativeDeployment: true
    utilityDeployedSprite:
      sprite: _RMC14/Objects/dropship_utility_attachments.rsi
      state: paradrop_system_deployed
  - type: EEXRappelSystem

- type: entity
  parent: CMUZLevelRopeThroughDown2
  id: CMUEEXRappelDropshipEndpoint
  name: EEX 索降绳
  description: 一条从空投飞船垂下的可伸缩索降绳。
  components:
  - type: Sprite
    drawdepth: SmallObjects

- type: entity
  parent: CMUZLevelRopeThroughUp
  id: CMUEEXRappelGroundEndpoint
  name: EEX索降绳
  description: 一条可延长的索降绳，可向上返回至空投飞船。
