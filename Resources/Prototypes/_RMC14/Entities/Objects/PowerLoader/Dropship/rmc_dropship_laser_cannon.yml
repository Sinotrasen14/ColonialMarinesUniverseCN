- type: entity
  parent: RMCDropshipAttachmentWeapon
  id: RMCDropshipAttachmentLaserCannon
  name: LWU-6B激光炮
  description: 这是UNMC最近获得的最先进技术，它能发射由电池供电的脉冲激光束，速度接近光速，点燃它所触及的一切。移动它需要某种升降装置。可使用BTU-17/LW高容量激光电池。
  components:
  - type: Sprite
    layers:
    - state: laser_beam
      offset: 0.5, 0.5
  - type: DropshipFabricatorPrintable
    cost: 500
  - type: DropshipWeapon
    abbreviation: LZR
    fireDelay: 5
    fireInTransport: true
    skills:
      all:
        RMCSkillPilot: 1
    weaponAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: laser_beam_installed
    ammoEmptyAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: laser_beam_loaded
    ammoAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: laser_beam_loaded

- type: entity
  parent: RMCDropshipAttachmentAmmo
  id: RMCDropshipAttachmentAmmoLaserCannon
  name: BTU-17/LW 大容量激光电池
  description: 一种大容量激光电池，用于为激光束武器供电。可装入 LWU-6B 激光炮。
  components:
  - type: Sprite
    layers:
    - state: laser_battery_10
      map: ["enum.DropshipAmmoVisuals.Fill"]
  - type: DropshipAmmo
    ammoType: laser_battery
    rounds: 100
    maxRounds: 100
    roundsPerShot: 10
    shotsPerVolley: 10
    targetSpread: 1
    bulletSpread: 0
    travelTime: 1
    fireMissionDelay: 3
    weapon: RMCDropshipAttachmentLaserCannon
    soundEveryShots: 1
    soundCockpit: /Audio/Machines/phasein.ogg
    soundMarker: /Audio/_RMC14/Binoculars/nightvision.ogg
    soundImpact:
      path: /Audio/_RMC14/Effects/laser_cannon.ogg
      params:
        volume: -6
    fire:
      type: RMCTileFireLaser
      range: 3
      total: 16
    deleteOnEmpty: true
  - type: DropshipFabricatorPrintable
    category: Ammo
    cost: 500
