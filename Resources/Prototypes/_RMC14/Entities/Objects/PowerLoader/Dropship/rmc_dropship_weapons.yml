- type: entity
  abstract: true
  parent: RMCDropshipAttachmentBase
  id: RMCDropshipAttachmentWeapon
  components:
  - type: DropshipFabricatorPrintable
    category: Equipment
    cost: 400
  - type: PowerLoaderGrabbable
    delay: 1
  - type: DropshipWeapon
    skills:
      all:
        RMCSkillPilot: 2
  - type: PowerLoaderAttachable
    attachDelay: 7
    attachableTypes:
    - RMCDropshipWeaponPoint
  - type: PowerLoaderDetachable
    detachDelay: 7

- type: entity
  parent: RMCDropshipAttachmentWeapon
  id: RMCDropshipAttachmentGau21Cannon
  name: GAU-21 30毫米机炮
  description: 一门拆卸下来的 GAU-21“响尾蛇”30毫米旋转机炮。它似乎缺少供弹链节，并且连接电线外露。能够每分钟发射5200发，因其威力而令许多人畏惧。在最初生产批次中，因其在运输机上引起的振动而获得“响尾蛇”的绰号。可接受 PGU-100/PGU-105 弹药箱。
  components:
  - type: Sprite
    layers:
    - state: 30mm_cannon
      offset: 0.5, 0.5
  - type: DropshipFabricatorPrintable
    cost: 400
  - type: DropshipWeapon
    abbreviation: GAU
    fireDelay: 2
    fireInTransport: true
    skills:
      all:
        RMCSkillPilot: 1
    weaponAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: 30mm_cannon_installed
    ammoEmptyAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: 30mm_cannon_loaded0
    ammoAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: 30mm_cannon_loaded1

- type: entity
  parent: RMCDropshipAttachmentWeapon
  id: CMUDropshipAttachmentM4332FlareLauncher
  name: M4332信号弹发射器
  description: 一种由飞行员控制的前向信号弹发射器，带有活动范围有限的万向架。它只能安装在直射挂点上。
  components:
  - type: Sprite
    sprite: CMU14/Objects/Dropship/m4332_flare_launcher.rsi
    enableOverrideDir: true
    overrideDir: North
    layers:
    - state: signal_flare_launcher_unloadedalt
      offset: 0.5, 0.5
  - type: DropshipFabricatorPrintable
    category: Equipment
    cost: 300
  - type: PowerLoaderAttachable
    attachDelay: 7
    attachableTypes:
    - RMCDropshipDirectFirePoint
  - type: DropshipWeapon
    abbreviation: FLR
    directFireOnly: true
    weaponAttachedSprite:
      sprite: CMU14/Objects/Dropship/m4332_flare_launcher.rsi
      state: signal_flare_launcher_unloadedalt
    ammoEmptyAttachedSprite:
      sprite: CMU14/Objects/Dropship/m4332_flare_launcher.rsi
      state: signal_flare_launcher_unloaded
    ammoAttachedSprite:
      sprite: CMU14/Objects/Dropship/m4332_flare_launcher.rsi
      state: signal_flare_launcher_loaded
  - type: GunshipDirectFireWeapon
    projectile: RMCFlareCASBullet
    ammoPrototype: CMUDropshipAttachmentAmmoM4332Flares
    gimbalDegrees: 30
  - type: Gun
    projectileSpeed: 20
    fireRate: 0.6666667
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/flaregun.ogg
    cameraRecoilScalar: 0
  # Signal-flare projectiles intentionally remain visible during prediction.
  # Make this remote mount authoritative so the predicted and server copies do
  # not appear together as two separate flares to its pilot.
  - type: GunIgnorePrediction
  - type: GunClickToFire

- type: entity
  parent: RMCDropshipAttachmentWeapon
  id: RMCDropshipAttachmentGuidedMissileLauncher
  name: LAU-444 制导导弹发射器
  description: 一种能够发射单枚激光制导导弹的导弹吊舱武器系统。移动它需要某种起重装置。可兼容 AGM、AIM、BLU 和 GBU 导弹系统。
  components:
  - type: Sprite
    layers:
    - state: rocket_pod
      offset: 0.5, 0.5
  - type: DropshipFabricatorPrintable
    cost: 600
  - type: DropshipWeapon
    abbreviation: MSL
    fireDelay: 5
    weaponAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: rocket_pod_installed
    ammoEmptyAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: rocket_pod_installed
    ammoAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: rocket_pod_loaded

- type: entity
  parent: RMCDropshipAttachmentWeapon
  id: RMCDropshipAttachmentRocketPod
  name: LAU-229火箭发射巢
  description: 一个能够发射六枚激光制导微型火箭的火箭发射巢。移动它需要某种起重装置。可使用AGR-59系列微型火箭。
  components:
  - type: Sprite
    layers:
    - state: minirocket_pod
      offset: 0.5, 0.5
  - type: DropshipFabricatorPrintable
    cost: 600
  - type: DropshipWeapon
    abbreviation: RKT
    fireDelay: 1
    weaponAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: minirocket_pod_installed
    ammoEmptyAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: minirocket_pod_installed
    ammoAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: minirocket_pod_loaded
    ammoSpriteThresholds: [5, 4, 3, 2, 1]
