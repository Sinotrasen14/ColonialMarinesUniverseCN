- type: entity
  parent: CMIDCardBase
  id: RMCIDCardTSEPA
  name: TSEPA银色徽章
  description: 这枚银色徽章代表佩戴者是TSEPA治安官。它是正义、权威与保护的象征，保护那些无力自保的人。这枚徽章代表着对始终恪守的誓言的一份承诺。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/CMIDs/tsepa_silver.rsi
    state: tsepa
  - type: Clothing
    slots:
    - idcard
    sprite: _RMC14/Objects/CMIDs/tsepa_silver.rsi
  - type: ItemIFF
    factions:
    - FactionTSE

