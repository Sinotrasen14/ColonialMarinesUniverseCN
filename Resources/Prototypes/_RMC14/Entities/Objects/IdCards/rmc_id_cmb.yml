- type: entity
  parent: CMIDCardBase
  id: RMCIDCardCMBDeputy
  name: CMB副警长银质徽章
  description: 这枚银质徽章代表佩戴者是CMB副警长。它是正义、权威和保护的象征。保护那些无力自保的人。这枚徽章代表着对始终恪守誓言的承诺。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/CMIDs/cmb_deputy.rsi
    state: icon
  - type: Clothing
    slots:
    - idcard
    sprite: _RMC14/Objects/CMIDs/cmb_deputy.rsi
  - type: PresetIdCard
    job: CMBureauDeputy

- type: entity
  parent: RMCIDCardCMBDeputy
  id: RMCIDCardCMBRiotOfficer
  name: CMB防暴控制官银质徽章
  description: 这枚银质徽章表明佩戴者是CMB防暴控制官。它是正义、权威和保护的象征。保护那些无法保护自己的人。这枚徽章代表着对始终恪守的誓言的承诺。

- type: entity
  parent: CMIDCardBase
  id: RMCIDCardCMBMarshal
  name: CMB执法官金徽章
  description: 一枚令人梦寐以求的金徽章，象征着佩戴者是少数在外环巡逻的CMB执法官之一。它是正义、权威与保护的象征。保护那些无力自保之人。这枚徽章代表着对始终恪守的庄严誓言的承诺。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/CMIDs/cmb_marshal.rsi
    state: icon
  - type: Clothing
    slots:
    - idcard
    sprite: _RMC14/Objects/CMIDs/cmb_marshal.rsi

