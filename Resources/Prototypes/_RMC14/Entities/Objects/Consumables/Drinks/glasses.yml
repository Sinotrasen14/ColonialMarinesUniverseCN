- type: entity
  parent: DrinkBaseCup
  id: RMCPintGlass
  name: 品脱杯
  description: 一个纯正老炮儿的品脱杯。很少见到它不带一层啤酒泡沫。
  components:
  - type: Solution
    solution:
      maxVol: 100
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Drinks/pint_glass.rsi
    layers:
    - state: icon-0
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: icon-3
      visible: false
  - type: Item
    size: Small
  - type: DamageOnLand
    damage: {}
  - type: DamageOtherOnHit
    damage: {}
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: icon-
  - type: Destructible
    thresholds: [] # TODO RMC14 destroy on explosion unless inside a container
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  parent: RMCPintGlass
  id: RMCPintGlassFull
  suffix: full
  components:
  - type: Solution
    solution:
      maxVol: 100
      reagents:
      - ReagentId: Beer
        Quantity: 100

- type: entity
  parent: DrinkBaseCup
  id: RMCDrinkGlass
  name: 玻璃杯
  description: 你的标准玻璃杯。
  components:
  - type: Solution
    id: drink
    solution:
      maxVol: 50
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Drinks/drink_glass.rsi
    layers:
    - state: icon
      map: ["enum.SolutionContainerLayers.Base"]
    - state: fill-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    size: Small
  - type: DamageOnLand
    damage: {}
  - type: DamageOtherOnHit
    damage: {}
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: fill-
  - type: Destructible
    thresholds: [] # TODO RMC14 destroy on explosion unless inside a container
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: Tag
    tags:
    - DrinkGlass
