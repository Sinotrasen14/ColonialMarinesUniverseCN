- type: entity
  abstract: true
  parent: DrinkBase
  id: CMCanteenBase
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Drinks/canteen.rsi
  - type: Item
    size: Small
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: Solution
    solution:
      maxVol: 60
      reagents:
      - ReagentId: Water
        Quantity: 60
  - type: Tag
    tags:
    - DrinkGlass
  - type: SolutionTransfer
    transferAmount: 60
    maxTransferAmount: 60
    canChangeTransferAmount: true
    transferAmounts:
    - 5
    - 10
    - 15
    - 25
    - 30
    - 40
    - 60
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpillBehavior {}
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: RMCFlask

- type: entity
  parent: CMCanteenBase
  id: CMCanteen
  name: 水壶
  description: 你从你可靠的海军陆战队水壶里抿了一口……
  components:
  - type: Sprite
    state: canteen

- type: entity
  parent: CMCanteenBase
  id: CMMetalFlask
  name: 金属瓶
  description: 液体容量不错的金属瓶。
  suffix: Empty
  components:
  - type: Sprite
    state: flask
  - type: Solution
    solution:
      maxVol: 60

- type: entity
  parent: CMCanteenBase
  id: CMMarineFlask
  name: 海军陆战队水壶
  description: 一种金属水壶，压印有美国海军陆战队标志，里面很可能装着水、机油和医用酒精混合而成的浆液。
  components:
  - type: Sprite
    state: flask_marine

- type: entity
  parent: CMCanteenBase
  id: CMWEYAFlask
  name: We-Ya 水壶
  description: 一个金属水壶，上面压印着We-Yu的标志性徽标，大概是某个企业马屁精下令备货到UA军舰食堂小卖部的。
  components:
  - type: Sprite
    state: flask_we_ya

- type: entity
  parent: [CMCanteenBase, DrinkBaseOpenable, DrinkVisualsOpenable]
  id: RMCWeYaThermos
  name: We-Ya 保温瓶
  description: 一款造型流畅的金属保温瓶，饰有维兰德-汤谷公司的配色。营销宣传声称它能承受相当于核爆的冲击，不过这大概只是公关说辞。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Drinks/weya_thermos.rsi
  - type: Openable
    sound:
      collection: flaskOpenSounds
    closeable: true
    closeSound:
      collection: flaskCloseSounds
