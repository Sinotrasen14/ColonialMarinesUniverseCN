- type: entity
  parent: DrinkBottlePlasticBaseFull
  id: CMDrinkWEYAWaterBottle30
  name: 威宇瓶装泉水
  description: 定价过高的“泉水”。由威宇公司装瓶。
  components:
  - type: Solution
    solution:
      maxVol: 50
      reagents:
      - ReagentId: Water
        Quantity: 30
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Drinks/WEYADrinks/weya_water_bottle.rsi
    layers:
    - state: icon
      map: ["enum.OpenableVisuals.Layer"]
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          true: {state: "icon_open"}
          false: {state: "icon"}
  - type: Item
    size: Small
  - type: DamageOnLand
    damage: {}
  - type: DamageOtherOnHit
    damage: {}
  - type: Appearance
  - type: Sealable
  - type: MREItem
  - type: Destructible
    thresholds: [] # TODO RMC14 destroy on explosion unless inside a container
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: PhysicalComposition
    materialComposition:
      RMCPlastic: 5

- type: entity
  parent: CMDrinkWEYAWaterBottle30
  id: RMCDrinkWEYABugJuice
  name: 韦兰-尤塔尼虫汁蛋白饮料
  description: 韦-尤牌塑料瓶，装满看起来有毒的绿色黏液，尝起来像猕猴桃，但你非常确定这里面根本没有猕猴桃。
  components:
  - type: Solution
    solution:
      maxVol: 30
      reagents:
      - ReagentId: RMCJuiceBug
        Quantity: 30
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Drinks/WEYADrinks/weya_bug_juice.rsi
    layers:
    - state: icon
      map: ["enum.OpenableVisuals.Layer"]
  - type: RMCLoreExaminable
    content: rmc-lore-examinable-bug-juice

- type: entity
  parent: CMDrinkWEYAWaterBottle30
  id: RMCDrinkWEYACocoMilk
  name: 韦兰-尤塔尼瓶装椰奶
  description: 富含维生素和（人工）风味，几口即可解渴。由韦兰-尤塔尼公司装瓶。
  components:
  - type: Solution
    solution:
      maxVol: 30
      reagents:
      - ReagentId: RMCCocoMilk
        Quantity: 30
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Drinks/WEYADrinks/weya_coco_milk.rsi
    layers:
    - state: icon
      map: ["enum.OpenableVisuals.Layer"]

- type: entity
  parent: CMDrinkWEYAWaterBottle30
  id: RMCDrinkWEYASoylent
  name: 韦兰-尤塔尼高级巧克力索伦特
  description: 一个装满黏稠美味、巧克力风味的塑料瓶。一瓶就含有足够一顿午餐的热量——别一口气全喝完，最好别冒肚子疼的风险。
  components:
  - type: Solution
    solution:
      maxVol: 30
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: RMCSoyMilk
        Quantity: 10
      - ReagentId: RMCChocolateDrink
        Quantity: 10
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Drinks/WEYADrinks/weya_soylent.rsi
    layers:
    - state: icon
      map: ["enum.OpenableVisuals.Layer"]
  - type: RMCLoreExaminable
    content: rmc-lore-examinable-soylent
