- type: entity
  parent: DrinkBaseMug
  id: RMCCoffeeCup
  name: 马克杯
  description: 一个陶瓷马克杯。几乎肯定会摔落，把滚烫的饮料洒在你崭新的衬衫上。哎哟。
  suffix: RMC
  components:
  - type: Solution
    id: drink
    solution:
      maxVol: 30
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Drinks/coffee_cup.rsi
    layers:
    - state: icon-0
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: icon-3
      visible: false
  - type: Item
    size: Small
  - type: DamageOnLand
    damage: {}
  - type: DamageOtherOnHit
    damage: {}
  - type: Appearance
  - type: SolutionContainerVisuals
    fillBaseName: icon-
  - type: Destructible
    thresholds: [] # TODO RMC14 destroy on explosion unless inside a container
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: Tag
    tags:
    - DrinkGlass
  - type: PhysicalComposition
    materialComposition: {}

- type: entity
  parent: RMCCoffeeCup
  id: RMCCoffeeCupFilled
  suffix: RMC, Filled, RMCCoffee
  components:
  - type: Solution
    solution:
      maxVol: 30
      reagents:
      - ReagentId: RMCCoffee
        Quantity: 30

