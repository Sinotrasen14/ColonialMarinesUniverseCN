- type: entity
  parent: Cigarette
  id: RMCCigarette
  description: 一根未过滤的烟草与尼古丁烟卷。吸食它会让更多焦油和烟灰进入你的嘴里。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigarettes/unfiltered_roll.rsi
    state: unlit-icon

- type: entity
  id: RMCCigaretteSpent
  parent: RMCCigarette
  suffix: spent
  components:
  - type: Sprite
    state: burnt-icon
  - type: Smokable
    state: Burnt
  - type: Solution
    id: smokable
    solution:
      maxVol: 20
  - type: Tag
    tags:
    - Cigarette
    - Trash
    - Burnt

- type: entity
  parent: RMCCigarettePackLuckySloths
  id: RMCCigarettePackWeYaGold
  name: We-Yu 金装烟包
  description: 建设更美好的世界，卷出更好的香烟。这些精美香烟是维兰德-尤塔尼进军市场的产品，背后有强悍的法律团队撑腰。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigarettes/we_ya_gold_packet.rsi
  - type: HelmetAccessory
    rsi:
      sprite: _RMC14/Objects/Clothing/HelmetGarb/Smoking/CigPacks/weya.rsi
      state: helmet

- type: entity
  parent: RMCCigarettePackLuckySloths
  id: RMCCigarettePackExecutiveSelect
  name: 高管精选烟包
  description: 这些香烟是奢华的极致。它们口感顺滑，格调酷炫，闻起来有胜利的气息……还有香烟烟雾的味道。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigarettes/executive_select.rsi
  - type: HelmetAccessory
    rsi:
      sprite: _RMC14/Objects/Clothing/HelmetGarb/Smoking/CigPacks/exec.rsi
      state: helmet

- type: entity
  parent: RMCCigarettePackLuckySloths
  id: RMCCigarettePackArcturianAce
  name: 大角星王牌
  description: 一个入门级香烟品牌，采用亮蓝色包装。你大概也猜得到，这些烟对你其实没什么好处，但既然是大角星出品，宝贝，那又有什么关系呢！
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigarettes/arcturian_ace.rsi

- type: entity
  parent: RMCCigarettePackLuckySloths
  id: RMCCigarettePackLadyFingers
  name: 淑女手指
  description: 这些极其浓烈、没有过滤嘴的薄荷香烟似乎不太有淑女风范。就此而言，它们也似乎不太像手指。吸烟可能会致死，但糟糕的品牌包装几乎同样糟糕。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigarettes/lady_fingers.rsi
  - type: RMCLoreExaminable
    content: rmc-lore-examinable-lady-fingers

- type: entity
  parent: RMCCigarettePackLuckySloths
  id: RMCCigarettePackElectroGolds
  name: 基尔兰电子金香烟
  description: 满怀爱意地机器卷制，只为取悦你。适合当你想要显得酷，而缓慢而可怕的死亡风险并不真正构成考虑因素之时。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigarettes/electro_golds.rsi
  - type: RMCLoreExaminable #TODO: Replace "premier station" with whatever the station gets named
    content: rmc-lore-examinable-kierland-electro-golds

- type: entity
  parent: RMCCigarettePackLuckySloths
  id: RMCCigarettePackEmeraldGreens
  name: 翡翠绿
  description: 它们会让你想起一个恶心、满是焦油的爱尔兰翻版。这些廉价香烟是韦兰-尤塔尼进军大众市场的产品。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigarettes/emerald_greens.rsi
  - type: RMCLoreExaminable
    content: rmc-lore-examinable-emerald-greens

- type: entity
  parent: RMCCigarettePackLuckySloths
  id: RMCCigarettePackSolRedsTurquoise
  name: 绿松石红日
  description: 声称纯天然、有机，不含添加剂。对健康并不比其他品牌好多少，但味道不错，而且极易上瘾。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigarettes/sol_reds.rsi

- type: entity
  parent: RMCCigarettePackLuckySloths
  id: RMCCigarettePackSolRedsYellow
  name: 黄太阳红
  description: 宣称全天然、有机，无添加剂。对健康并不比其他品牌好多少，但味道不错，而且极易上瘾。这种似乎风味更醇厚。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigarettes/sol_reds_yellow.rsi
