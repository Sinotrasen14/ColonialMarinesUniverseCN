- type: entity
  parent: CigPackBase
  id: CMCigarettePackLuckySlothsMini
  name: 好彩迷你烟包
  description: 这些四包装的好彩烟每个MRE里都有。它们不如某些TWE MRE里的大使皇冠烟好，但至少是免费的。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigarettes/lucky_sloths_4.rsi
    layers:
    - state: closed
    - state: open
      map: ["openLayer"]
      visible: false
    - state: cig1
      map: ["cig1"]
      visible: false
    - state: cig2
      map: ["cig2"]
      visible: false
    - state: cig3
      map: ["cig3"]
      visible: false
    - state: cig4
      map: ["cig4"]
      visible: false
  - type: Storage
    grid:
    - 0,0,7,1
    whitelist:
      tags:
      - Cigarette
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: RMCCigarette
        amount: 4
  - type: ItemCounter
    count:
      tags: [Cigarette]
    composite: true
    layerStates:
    - cig1
    - cig2
    - cig3
    - cig4
  - type: MREItem
  - type: FixedItemSizeStorage
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: Clothing
    quickEquip: false
    slots:
    - suitstorage
  - type: HelmetAccessory
    rsi:
      sprite: _RMC14/Objects/Clothing/HelmetGarb/Smoking/CigPacks/sloths.rsi
      state: helmet
  - type: Tag
    tags:
    - CigPack
    - Trash
  - type: PhysicalComposition
    materialComposition: {}

