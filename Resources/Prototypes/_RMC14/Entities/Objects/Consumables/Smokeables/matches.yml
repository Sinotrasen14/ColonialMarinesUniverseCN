- type: entity
  name: 火柴盒
  description: 一小盒“太空防护”高级火柴。
  parent: [SmallboxItem, BaseBagOpenClose]
  id: RMCMatchbox
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/matchbox_drop.ogg
  - type: Matchbox
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Matchboxes/matchbox.rsi
    layers:
    - state: matchbox
    - state: matchbox-0
      map: ["enum.StorageFillLayers.Fill"]
      visible: false
  - type: Item
    sprite: Objects/Tools/matches.rsi
    heldPrefix: matchbox
    size: Tiny
  - type: Clothing
    slots:
    - belt
  - type: StorageFillVisualizer
    maxFillLevels: 7
    fillBaseName: matchbox
  - type: Storage
    grid:
    - 0,0,13,1
    whitelist:
      tags:
      - Matchstick
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        enum.StorageFillLayers.Fill:
          true: {visible: true}
          false: {visible: false}
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: HelmetAccessory
    rsi:
      sprite: _RMC14/Objects/Clothing/HelmetGarb/Smoking/matches/matches.rsi
      state: helmet

- type: entity
  name: 火柴盒
  parent: RMCMatchbox
  id: RMCMatchboxFull
  suffix: Full
  components:
  - type: StorageFill
    contents:
    - id: RMCMatchstick
      amount: 14

- type: entity
  name: 火柴
  description: 一根简单的火柴，用于点燃优质烟草。
  parent: Matchstick
  id: RMCMatchstick
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Matches/match.rsi
    state: match_unlit

- type: entity
  name: 纸火柴
  description: 一根简单的火柴，用于点燃上等烟草。
  parent: RMCMatchstick
  id: RMCMatchstickPaper
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Matches/paper.rsi
    state: match_unlit
