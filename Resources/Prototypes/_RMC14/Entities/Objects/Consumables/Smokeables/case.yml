- type: entity
  parent: CigarCase
  id: RMCCigarCase
  name: 雪茄盒
  description: 用于在不抽雪茄时存放雪茄的盒子。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigars/cigar_case.rsi
    layers:
    - state: closed
    - state: open
      map: ["openLayer"]
      visible: false
    - state: cig1
      map: ["cig1"]
      visible: false
    - state: cig2
      map: ["cig2"]
      visible: false
    - state: cig3
      map: ["cig3"]
      visible: false
    - state: cig4
      map: ["cig4"]
      visible: false
    - state: cig5
      map: ["cig5"]
      visible: false
    - state: cig6
      map: ["cig6"]
      visible: false
    - state: cig7
      map: ["cig7"]
      visible: false
  - type: Storage
    grid:
    - 0,0,6,1
    whitelist:
      tags:
      - Cigar
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: Cigar
        amount: 7
  - type: ItemCounter
    count:
      tags: [Cigar]
    composite: true
    layerStates:
    - cig1
    - cig2
    - cig3
    - cig4
    - cig5
    - cig6
    - cig7
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: Clothing
    slots:
    - belt
  - type: Item
    size: Small

- type: entity
  parent: CigarCase
  id: RMCTarbackCase
  name: 塔巴克斯雪茄盒
  description: 别让花哨的盒子和一张胡扯传统与品质的纸片骗了你。这些雪茄是最差的货色。在哥伦比亚卷制。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigars/tarback_box.rsi
    layers:
    - state: closed
    - state: open
      map: ["openLayer"]
      visible: false
    - state: cig1
      map: ["cig1"]
      visible: false
    - state: cig2
      map: ["cig2"]
      visible: false
    - state: cig3
      map: ["cig3"]
      visible: false
    - state: cig4
      map: ["cig4"]
      visible: false
    - state: cig5
      map: ["cig5"]
      visible: false
  - type: Storage
    grid:
    - 0,0,4,1
    whitelist:
      tags:
      - Cigar
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: CMTarbackCigar
        amount: 5
  - type: ItemCounter
    count:
      tags: [Cigar]
    composite: true
    layerStates:
    - cig1
    - cig2
    - cig3
    - cig4
    - cig5
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  parent: RMCTarbackCase
  id: RMCShioRoyalsCase
