- type: entity
  id: CMTarbackCigar
  parent: Cigar
  name: 塔巴克雪茄
  description: "塔巴克雪茄，由赖斯兰烟草出品。卫生局局长已宣布，吸塔巴克雪茄可能危害人的健康。赖斯兰烟草已宣布，卫生局局长是个婊子。在哥伦比亚卷制。"
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigars/tarback.rsi
    state: unlit-icon
  - type: Tag
    tags:
    - Cigar
    - Trash
  - type: Clothing
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigars/tarback.rsi
    slots: [mask]
    equippedPrefix: unlit
  - type: Item
    size: Tiny
    sprite: Objects/Consumable/Smokeables/Cigars/cigar.rsi
    heldPrefix: unlit
  - type: HelmetAccessory
    rsi:
      sprite: _RMC14/Objects/Clothing/HelmetGarb/Smoking/cigar.rsi
      state: helmet

- type: entity
  id: CMTarbackCigarSpent
  parent: CMTarbackCigar
  suffix: spent
  components:
  - type: Sprite
    state: burnt-icon
  - type: Smokable
    state: Burnt
  - type: Solution
    id: smokable
    solution:
      maxVol: 20
  - type: Tag
    tags:
    - Cigar
    - Trash
    - Burnt

- type: entity
  id: RMCTarbackTube
  parent: BaseStorageItem
  name: 塔巴克管装雪茄
  description: 一支装在防护金属管中的塔巴克雪茄。差不多是能弄到的最低端货色了。在哥伦比亚卷制。
  components:
  - type: Item
    size: Small
  - type: Clothing
    slots:
    - belt
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigars/tarback_tube.rsi
    state: tarbacktube_empty
    layers:
    - state: tarbacktube_empty
      map: ["openLayer", "emptyLayer"]
    - state: tarbacktube
      map: ["closedLayer"]
      visible: false
  - type: Storage
    grid:
    - 0,0,0,1
    whitelist:
      tags:
      - Cigar
      - Trash
  - type: StorageFill
    contents:
    - id: CMTarbackCigar
  - type: CMStorageVisualizer
    storageClosed: closedLayer
    storageOpen: openLayer
    storageEmpty: emptyLayer
  - type: Appearance
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

# Shio Royals
- type: entity
  parent: CMTarbackCigar
  id: RMCShioCigar
  name: Shio Royals雪茄
  description: "Shio Royals，由Weyland-Yutani生产。它似乎在某种程度上暗示着海浪与海洋。在日本卷制。"
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigars/shio_royals.rsi
    state: unlit-icon
  - type: Item
    size: Tiny
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigars/shio_royals.rsi
    heldPrefix: unlit

- type: entity
  parent: RMCShioCigar
  id: RMCShioCigarSpent
  suffix: spent
  components:
  - type: Sprite
    state: burnt-icon
  - type: Smokable
    state: Burnt
  - type: Solution
    solution:
      maxVol: 20
  - type: Tag
    tags:
    - Cigar
    - Trash
    - Burnt

- type: entity
  parent: RMCTarbackTube
  id: RMCShioRoyalsTube
  name: Shio Royals 管装雪茄
  description: 一支装在银色保护金属管中的 Shio Royals 雪茄。尽管 Weyland-Yutani 和竞争对手雪茄公司都宣称如此，这些雪茄其实完全中规中矩。在日本卷制。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Cigars/shio_royals_tube.rsi
    state: shioroyalstube_empty
    layers:
    - state: shioroyalstube_empty
      map: ["openLayer", "emptyLayer"]
    - state: shioroyalstube
      map: ["closedLayer"]
      visible: false
  - type: StorageFill
    contents:
    - id: RMCShioCigar

