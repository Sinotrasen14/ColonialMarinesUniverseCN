# TODO RMC14 different light/burn chances per matchbook
- type: entity
  parent: Matchbox
  id: CMMatchBook
  name: 幸运树懒火柴本
  description: 一小本廉价纸火柴。想点着它们？祝你好运。由“幸运树懒”制造，但当你试图在这上面划火柴却烧到手时，你可一点都不幸运。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Matchboxes/matchbook.rsi
    layers:
    - state: mpacket
    - state: mpacket0
      map: ["openLayer"]
    - state: mpacket1
      map: ["mpacket1"]
      visible: false
    - state: mpacket2
      map: ["mpacket2"]
      visible: false
    - state: mpacket3
      map: ["mpacket3"]
      visible: false
    - state: mpacket4
      map: ["mpacket4"]
      visible: false
    - state: mpacket5
      map: ["mpacket5"]
      visible: false
    - state: mpacket6
      map: ["mpacket6"]
      visible: false
  - type: Item
    size: Tiny
    sprite: _RMC14/Objects/Consumable/Smokeables/Matchboxes/matchbook.rsi
    heldPrefix:
  - type: Storage
    grid:
    - 0,0,5,1
    whitelist:
      tags:
      - Matchstick
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: RMCMatchstickPaper
        amount: 6
  - type: ItemCounter
    count:
      tags: [Matchstick]
    composite: true
    layerStates:
    - mpacket1
    - mpacket2
    - mpacket3
    - mpacket4
    - mpacket5
    - mpacket6
  - type: MREItem
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: HelmetAccessory
    rsi:
      sprite: _RMC14/Objects/Clothing/HelmetGarb/Smoking/matches/matches_mre.rsi
      state: helmet

- type: entity
  parent: CMMatchBook
  id: CMBrownMatchBook
  name: 棕色火柴本
  description: 一本廉价纸质火柴的小册子。祝你好运能把它们点着。用普通棕色纸制成。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Matchboxes/brown_matchbook.rsi
  - type: Item
    sprite: _RMC14/Objects/Consumable/Smokeables/Matchboxes/brown_matchbook.rsi

- type: entity
  parent: CMMatchBook
  id: CMExecutiveSelectMatchbook
  name: 高管精选火柴册
  description: 一小本昂贵的纸质火柴。这些几乎每次都能点燃！
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Matchboxes/executive_select_matchbook.rsi
  - type: Item
    sprite: _RMC14/Objects/Consumable/Smokeables/Matchboxes/executive_select_matchbook.rsi

- type: entity
  parent: CMMatchBook
  id: CMElectroMatchbook
  name: 电击火柴册
  description: 一小本廉价纸火柴。祝你好运能把它们点着。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Matchboxes/electro_matchbook.rsi
  - type: Item
    sprite: _RMC14/Objects/Consumable/Smokeables/Matchboxes/electro_matchbook.rsi

- type: entity
  parent: CMMatchBook
  id: CMExecutiveWEYAMatchbook
  name: 威亚金色火柴册
  description: 一本昂贵的小册子，内装纸火柴。这些火柴几乎每次都能点着，至少包装上是这么宣称的。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Smokeables/Matchboxes/we_ya_matchbook.rsi
  - type: Item
    sprite: _RMC14/Objects/Consumable/Smokeables/Matchboxes/we_ya_matchbook.rsi
