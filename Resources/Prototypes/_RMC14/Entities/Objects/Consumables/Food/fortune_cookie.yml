- type: entity
  parent: BaseItem
  id: CMFortuneCookie
  name: 幸运饼干
  description: 一块金棕色的幸运饼干。有人说里面的纸条甚至能预知未来，不管那意味着什么。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/fortune_cookie.rsi
    state: base
  - type: Item
    size: Small
    heldPrefix:
  - type: SpawnItemsOnUse
    items:
    - id: CMFortuneCookieCracked
    - id: CMFortuneCookiePaper
    sound:
      path: /Audio/_RMC14/Food/pillbottle.ogg
  - type: MREItem

- type: entity
  parent: CMFoodBase
  id: CMFortuneCookieCracked
  name: 破碎的幸运饼干
  description: 一个金棕色的幸运饼干。有人说里面的纸条甚至能够预测未来，不管那意味着什么。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/fortune_cookie.rsi
    state: open
  - type: Item
    size: Small
  - type: FlavorProfile
    flavors:
    - fortunecookie
  - type: Solution
    id: food
    solution:
      maxVol: 1
      reagents:
      - ReagentId: Nutriment
        Quantity: 1

- type: entity
  parent: FoodCookieFortune
  id: CMFortuneCookiePaper
  name: 财富
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/fortune_paper.rsi
    state: paper
  - type: Item
    size: Tiny
  - type: RandomMetadata
    descriptionSegments: [CMFortunes]

- type: localizedDataset
  id: CMFortunes
  values:
    prefix: rmc-fortune-
    count: 380
