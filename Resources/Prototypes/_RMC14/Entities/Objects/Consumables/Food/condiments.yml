# Base
- type: entity
  parent: BaseItem
  id: RMCCondiment
  name: 调味品容器
  description: 只是普通的调味品容器。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/condiments.rsi
    state: emptycondiment
  - type: Solution
    id: food
    solution:
      maxVol: 50
  - type: DrawableSolution
    solution: food
  - type: DrainableSolution
    solution: food
  - type: Edible
    edible: Drink
    solution: food
    destroyOnEmpty: false
    utensil: None
  - type: Openable
    sound:
      collection: bottleOpenSounds
    closeable: true
    closeSound:
      collection: bottleCloseSounds
  - type: RefillableSolution
    solution: food
  - type: Spillable
    solution: food
  - type: SolutionTransfer
    canChangeTransferAmount: true
    minTransferAmount: 5
    maxTransferAmount: 50

- type: entity
  abstract: true
  parent: RMCCondiment
  id: RMCCondimentSmall
  components:
  - type: Solution
    id: food
    solution:
      maxVol: 20
  - type: SolutionTransfer
    maxTransferAmount: 20

- type: entity
  abstract: true
  parent: RMCCondiment
  id: RMCCondimentHotsauce
  name: 辣酱父对象
  components:
  - type: Sprite
    state: icon
  - type: Solution
    id: food
    solution:
      maxVol: 60
      reagents:
      - ReagentId: Hotsauce
        Quantity: 60
  - type: SolutionTransfer
    maxTransferAmount: 60

