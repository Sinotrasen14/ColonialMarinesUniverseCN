# Components
- type: entity
  abstract: true
  parent: CMMREComponentBase
  id: CMMREDessertComponentBase
  description: 一个MRE配菜组件。包含一份甜点，应在主菜之后食用（如果你很叛逆，也可以在主菜之前食用）。
  components:
  - type: Sprite
    state: dessert

- type: entity
  parent: CMMREDessertComponentBase
  id: CMMREComponentSpicedApples
  name: MRE 组件（香料苹果）
  description: MRE 的配菜组件。内含一份甜点，应在主餐后食用（如果你够叛逆，也可以在主餐前吃）。这一款是香料苹果。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: CMMREFoodSpicedApples

- type: entity
  parent: CMMREDessertComponentBase
  id: CMMREComponentChocolateBrownie
  name: MRE 组件（巧克力布朗尼）
  description: MRE 配菜组件。内含一份甜点，应在主餐后食用（如果你够叛逆，也可以在主餐前食用）。这一款是巧克力布朗尼。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: CMMREFoodChocolateBrownie

- type: entity
  parent: CMMREDessertComponentBase
  id: CMMREComponentSugarCookie
  name: MRE 组件（糖饼干）
  description: MRE 的配餐组件。内含一份甜点，应在主餐后食用（如果你够叛逆，也可以在主餐前吃）。这一份是糖饼干。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: CMMREFoodSugarCookie

- type: entity
  parent: CMMREDessertComponentBase
  id: CMMREComponentCocoBar
  name: MRE 组件（可可棒）
  description: 一个 MRE 配餐组件。内含一份甜点，应在主餐后食用（或者，如果你很叛逆，也可以在主餐前吃）。这个是可可棒。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: CMMREFoodCocoBar

- type: entity
  parent: CMMREDessertComponentBase
  id: CMMREComponentFlan
  name: MRE 组件（焦糖布丁）
  description: MRE 的配菜组件。内含一份甜点，应在主菜后食用（如果你比较叛逆，也可以在主菜前吃）。这一份是焦糖布丁。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: CMMREFoodFlan

- type: entity
  parent: CMMREDessertComponentBase
  id: CMMREComponentHoneyFlan
  name: MRE 组件（蜂蜜焦糖布丁）
  description: 一种 MRE 配菜组件。内含一份甜点，应在主餐后食用（如果你比较叛逆，也可以在主餐前吃）。这一款是蜂蜜焦糖布丁。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: CMMREFoodHoneyFlan

# Foods
- type: entity
  abstract: true
  parent: CMMREFoodBase
  id: CMMREFoodDessert
  components:
  - type: Edible
    transferAmount: 1
  - type: Solution
    id: food
    solution:
      maxVol: 3
      reagents:
      - ReagentId: Nutriment
        Quantity: 2
      - ReagentId: RMCSugar
        Quantity: 2
      - ReagentId: Theobromine
        Quantity: 1

- type: entity
  parent: CMMREFoodDessert
  id: CMMREFoodSpicedApples
  name: 香料苹果
  description: 海军陆战队标准配发即食口粮的内容物。这一份是香料苹果。
  components:
  - type: Sprite
    state: spiced_apples
  - type: FlavorProfile
    flavors:
    - SpicedApples

- type: entity
  parent: CMMREFoodDessert
  id: CMMREFoodChocolateBrownie
  name: 巧克力布朗尼
  description: 一份海军陆战队标准配发即食口粮的内容物。这一份是巧克力布朗尼。
  components:
  - type: Sprite
    state: chocolate_brownie
  - type: FlavorProfile
    flavors:
    - ChocolateBrownie

- type: entity
  parent: CMMREFoodDessert
  id: CMMREFoodSugarCookie
  name: 糖饼干
  description: 海军陆战队标准配发单兵口粮的内容物。这一份是糖饼干。
  components:
  - type: Sprite
    state: sugar_cookie
  - type: FlavorProfile
    flavors:
    - SugarCookie

- type: entity
  parent: CMMREFoodDessert
  id: CMMREFoodCocoBar
  name: 椰子棒
  description: 海军陆战队标准配发即食口粮的内容。这一份是椰子棒。
  components:
  - type: Sprite
    state: coco_bar
  - type: FlavorProfile
    flavors:
    - CocoBar

- type: entity
  parent: CMMREFoodDessert
  id: CMMREFoodFlan
  name: 焦糖布丁
  description: 海军陆战队标准配发即食口粮的内容。这一份是焦糖布丁。
  components:
  - type: Sprite
    state: flan
  - type: FlavorProfile
    flavors:
    - Flan

- type: entity
  parent: CMMREFoodDessert
  id: CMMREFoodHoneyFlan
  name: 蜂蜜焦糖布丁
  description: 海军陆战队标准配发即食口粮的内容物。这一份是蜂蜜焦糖布丁。
  components:
  - type: Sprite
    state: honey_flan
  - type: FlavorProfile
    flavors:
    - HoneyFlan

# Flavors
- type: flavor
  id: SpicedApples
  flavorType: Complex
  description: 像加香料的苹果

- type: flavor
  id: ChocolateBrownie
  flavorType: Complex
  description: 喜欢巧克力布朗尼

- type: flavor
  id: SugarCookie
  flavorType: Complex
  description: 像糖饼干

- type: flavor
  id: CocoBar
  flavorType: Complex
  description: 喜欢巧克力

- type: flavor
  id: Flan
  flavorType: Complex
  description: 像焦糖布丁

- type: flavor
  id: HoneyFlan
  flavorType: Complex
  description: 像蜂蜜布丁一样
