# Components
- type: entity
  abstract: true
  parent: CMMREComponentBase
  id: CMMRESideComponentBase
  description: 单兵口粮的配菜组件。包含一份配菜，可与主餐一同食用。
  components:
  - type: Sprite
    state: side

- type: entity
  parent: CMMRESideComponentBase
  id: CMMREComponentCracker
  name: MRE 组件（饼干）
  description: 一个 MRE 配餐组件。包含一份配餐，可与主餐一同食用。这一份是饼干。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: CMMREFoodCracker

- type: entity
  parent: CMMRESideComponentBase
  id: CMMREComponentRiceOnigiri
  name: MRE 组件（饭团）
  description: MRE 配菜组件。包含一份配菜，可与主餐一同食用。这个是米饭饭团。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: CMMREFoodRiceOnigiri

- type: entity
  parent: CMMRESideComponentBase
  id: CMMREComponentMashedPotatoes
  name: MRE配菜（土豆泥）
  description: MRE 配菜组件。包含一份配菜，可与主餐一起食用。这一份是土豆泥。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: CMMREFoodMashedPotatoes

- type: entity
  parent: CMMRESideComponentBase
  id: CMMREComponentRisotto
  name: MRE 组件（意式烩饭）
  description: 一个 MRE 配菜组件。内含一份配菜，可与主菜一同食用。这个配菜是意式烩饭。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: CMMREFoodRisotto

# Foods
- type: entity
  abstract: true
  parent: CMMREFoodBase
  id: CMMREFoodSide
  components:
  - type: Edible
    transferAmount: 1.6
  - type: Solution
    id: food
    solution:
      maxVol: 8
      reagents:
      - ReagentId: Nutriment
        Quantity: 6
      - ReagentId: TableSalt
        Quantity: 2
  - type: Extractable
    grindableSolutionName: food
  - type: InjectableSolution
    solution: food

- type: entity
  parent: CMMREFoodSide
  id: CMMREFoodCracker
  name: 饼干
  description: 海军陆战队标准配发即食口粮的内容物。这一份是饼干。
  components:
  - type: Sprite
    state: cracker
  - type: FlavorProfile
    flavors:
    - Cracker

- type: entity
  parent: CMMREFoodSide
  id: CMMREFoodRiceOnigiri
  name: 米饭饭团
  description: 海军陆战队标准配发单兵口粮的内容物。这一份是米饭饭团。
  components:
  - type: Sprite
    state: rice_onigiri
  - type: FlavorProfile
    flavors:
    - RiceOnigiri

- type: entity
  parent: CMMREFoodSide
  id: CMMREFoodMashedPotatoes
  name: 土豆泥
  description: 海军陆战队标准配发即食口粮的内容。这一份是土豆泥。
  components:
  - type: Sprite
    state: mashed_potatoes
  - type: FlavorProfile
    flavors:
    - Potato

- type: entity
  parent: CMMREFoodSide
  id: CMMREFoodRisotto
  name: 意式烩饭
  description: 海军陆战队标准配发即食口粮的内容物。这一份是意式烩饭。
  components:
  - type: Sprite
    state: risotto
  - type: FlavorProfile
    flavors:
    - Risotto

# Flavors
- type: flavor
  id: Cracker
  flavorType: Complex
  description: 像饼干一样

- type: flavor
  id: RiceOnigiri
  flavorType: Complex
  description: 喜欢米饭

- type: flavor
  id: Potato
  flavorType: Complex
  description: 喜欢土豆

- type: flavor
  id: Risotto
  flavorType: Complex
  description: 像意大利烩饭
