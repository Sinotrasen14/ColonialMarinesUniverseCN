  - type: MREItem

- type: entity
  parent: RMCBoxMagazineSupplySmallBase
  id: RMCBoxMREEmpty
  name: 一箱单兵口粮（12份）
  description: 一箱单兵口粮。营养丰富，但不好吃。
  components:
  - type: Construction
    graph: RMCBoxMagazine
    node: RMCBoxMREEmpty
  - type: ItemSlots
  - type: CMItemSlots
    count: 12
    slot:
      name: MRE
      whitelist:
        tags:
        - MRE
  - type: Sprite
    layers:
    - state: supply_box_small
      color: "#b59471"
    - state: supply_ammo_small_full
      map: ["enum.CMItemSlotsLayers.Fill"]
      color: "#a69571"
    - state: supply_box_small_food
      color: "#b59471"
    - state: supply_lid_small_closed
      map: ["lid"]
      color: "#b59471"
    - state: supply_lid_small_closed_marking
      map: ["lid_marking"]
      color: "#b59471"

