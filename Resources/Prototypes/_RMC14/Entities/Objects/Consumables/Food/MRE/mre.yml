- type: entity
  parent: BaseStorageItem
#cmu edit start
  id: CMMRE
  name: 即食口粮
  description: 即食口粮。一种单餐战斗口粮，旨在为士兵提供足够营养，以支撑一天的高强度工作。它的过期日期至少比你的作战预期寿命还要晚20年。
#cmu edit end
  components:
  - type: Tag
    tags:
    - MRE
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/mre.rsi
    state: closed
  - type: Item
    size: Small
  - type: Storage
    grid:
    - 0,0,13,1
    maxItemSize: Small
    whitelist:
      components:
      - MREItem
  - type: Openable
    sound:
      collection: CMFoodRip
  - type: MRERequireOpenBeforeStorage
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          true: {state: "open"}
          false: {state: "closed"}
  - type: StorageFill
    contents:
    - id: CMMREComponentBonelessPorkRibs
      orGroup: main
    - id: CMMREComponentGrilledChicken
      orGroup: main
    - id: CMMREComponentPizzaSquare
      orGroup: main
    - id: CMMREComponentSpaghettiChunks
      orGroup: main
    - id: CMMREComponentChickenTender
      orGroup: main
    - id: CMMREComponentCracker
      orGroup: side
    - id: CMMREComponentRiceOnigiri
      orGroup: side
    - id: CMMREComponentMashedPotatoes
      orGroup: side
    - id: CMMREComponentRisotto
      orGroup: side
    - id: CMMREComponentBiscuit
      orGroup: snack
    - id: CMMREComponentMeatballs
      orGroup: snack
    - id: RMCMREComponentMeatzels
      orGroup: snack
    - id: CMMREComponentPretzels
      orGroup: snack
    - id: CMMREComponentPeanuts
      orGroup: snack
    - id: CMMREComponentSushi
      orGroup: snack
    - id: CMMREComponentBiscuit
      orGroup: dessert
    - id: CMMREComponentChocolateBrownie
      orGroup: dessert
    - id: CMMREComponentSugarCookie
      orGroup: dessert
    - id: CMMREComponentCocoBar
      orGroup: dessert
    - id: CMMREComponentFlan
      orGroup: dessert
    - id: CMMREComponentHoneyFlan
      orGroup: dessert
    - id: CMDrinkWEYAWaterBottle30
    - id: CMFortuneCookie
      prob: 0.333
    - id: CMCigarettePackLuckySlothsMini
    - id: CMMatchBook
      orGroup: matchbook
    - id: CMBrownMatchBook
      orGroup: matchbook
    - id: CMExecutiveSelectMatchbook
      orGroup: matchbook
    - id: CMElectroMatchbook
      orGroup: matchbook
    - id: CMExecutiveWEYAMatchbook
      orGroup: matchbook
  - type: FixedItemSizeStorage
  - type: RemoveOnlyStorage
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: CargoSellBlacklist

- type: entity
  abstract: true
  parent: BaseItem
  id: CMMREComponentBase
  name: MRE组件
  description: 一份“即食口粮”中的一包，属于海军陆战队。内含一餐的一部分，为野外食用而准备。
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/mre_components.rsi
  - type: Item
    size: Small
  - type: SpawnItemsOnUse
    sound:
      collection: CMFoodRip
  - type: MREItem

- type: entity
  abstract: true
  parent: CMFoodBase
  id: CMMREFoodBase
  description: 海军陆战队标准配发的即食口粮的内容。
  components:
