# Foods
- type: entity
  abstract: true
  parent: CMMREFoodBase
  id: CMMREFoodMain
  components:
  - type: Edible
    transferAmount: 4
  - type: Solution
    id: food
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Nutriment
        Quantity: 14
      - ReagentId: TableSalt
        Quantity: 6
  - type: Extractable
    grindableSolutionName: food
  - type: InjectableSolution
    solution: food

