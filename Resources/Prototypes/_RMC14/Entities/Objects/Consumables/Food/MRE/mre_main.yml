# CLF

- type: entity
  abstract: true
  parent: CMMREFoodMain
  id: RMCMREFoodCLF
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/mre_clf.rsi
  - type: Edible
    transferAmount: 4
  - type: Solution
    id: food
    solution:
      maxVol: 30
      reagents:
      - ReagentId: Nutriment
        Quantity: 26
      - ReagentId: TableSalt
        Quantity: 4

- type: entity
  parent: RMCMREFoodCLF
  id: RMCMREFoodMeatSlab
  name: 包裹肉排
  description: 一块包裹着、快速烤过的半熟肉排。
  components:
  - type: Sprite
    state: open_meat
  - type: FlavorProfile
    flavors:
    - meaty

- type: entity
  parent: RMCMREFoodCLF
  id: RMCMREFoodMeatSlabCheese
  name: 奶酪肉排卷
  description: 一卷包好的半熟肉排，快速烤过后覆满融化的奶酪。油润得妙不可言。
  components:
  - type: Sprite
    state: open_meat_cheese
  - type: FlavorProfile
    flavors:
    - meaty
    - cheesy

- type: entity
  parent: RMCMREFoodCLF
  id: RMCMREFoodBread
  name: 包装好的酸面包
  description: 一条包装好的小干酸面包。
  components:
  - type: Sprite
    state: open_bread
  - type: FlavorProfile
    flavors:
    - bread

- type: entity
  parent: RMCMREFoodMeatSlabCheese
  id: RMCMREFoodMargaritaPizza
  name: 包装好的玛格丽塔披萨
  description: 一个包装好的小玛格丽塔披萨。
  components:
  - type: Sprite
    state: open_pizza

# SPP survival ration

- type: entity
  parent: CMMREFoodMain
  id: RMCMRESPPSurvivalRationTypeA
  name: 生存口粮
  suffix: Type A
  description: 一块紧实的冻干肉或冻干鱼，含有以浓缩粉末形式添加的营养剂。由于为长期储存而制备，它几乎没有调味或色泽，这种物品的吸引力纯粹在于其提供营养的能力。
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    state: spp_1

- type: entity
  parent: CMMREFoodMain
  id: RMCMRESPPSurvivalRationTypeB
  name: 生存口粮
  suffix: Type B
  description: 一团紧实的、类似面团的米或燕麦球，含有以致密粉末形式添加的营养剂。由于为长期储存而制作，它几乎没有调味或着色，其吸引力纯粹在于能够提供维持生存的养分。
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    state: spp_2

