# Components
- type: entity
  abstract: true
  parent: CMMREComponentBase
  id: CMMRESnackComponentBase
  description: MRE 零食组件。内含一份轻食，以备你不太饿时食用。
  components:
  - type: Sprite
    state: snack

- type: entity
  parent: CMMRESnackComponentBase
  id: CMMREComponentBiscuit
  name: MRE 组件（饼干）
  description: 一个 MRE 零食组件。内含一份清淡零食，以防你不太饿。这个是饼干。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: CMMREFoodBiscuit

- type: entity
  parent: CMMRESnackComponentBase
  id: CMMREComponentMeatballs
  name: MRE 组件（肉丸）
  description: MRE 零食组件。内含一份清淡零食，供你不太饿时食用。这一份是肉丸。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: CMMREFoodMeatballs

- type: entity
  parent: CMMRESnackComponentBase
  id: RMCMREComponentMeatzels
  name: MRE组件（肉味椒盐卷饼）
  description: MRE零食组件。内含一份清淡零食，以防你当时并不太饿。这个是……肉味椒盐卷饼？
  components:
  - type: SpawnItemsOnUse
    items:
    - id: RMCMREFoodMeatzels

- type: entity
  parent: CMMRESnackComponentBase
  id: CMMREComponentPretzels
  name: MRE组件（椒盐卷饼）
  description: 一种MRE零食组件。内含一份小零食，供你不太饿时食用。这一份是椒盐卷饼。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: CMMREFoodPretzels

- type: entity
  parent: CMMRESnackComponentBase
  id: CMMREComponentPeanuts
  name: MRE 组件（花生）
  description: MRE 零食组件。内含一份小零食，以防你不太饿。这份是花生。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: CMMREFoodPeanuts

- type: entity
  parent: CMMRESnackComponentBase
  id: CMMREComponentSushi
  name: MRE 组件（寿司）
  description: 一个MRE零食组件。内含一份小零食，以防你不太饿。这一份是寿司。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: CMMREFoodSushi

# Foods
- type: entity
  abstract: true
  parent: CMMREFoodBase
  id: CMMREFoodSnack
  components:
  - type: Edible
    transferAmount: 1.2
  - type: Solution
    id: food
    solution:
      maxVol: 3
      reagents:
      - ReagentId: Nutriment
        Quantity: 4
      - ReagentId: TableSalt
        Quantity: 2

- type: entity
  parent: CMMREFoodSnack
  id: CMMREFoodBiscuit
  name: 饼干
  description: 海军陆战队标准配发单兵口粮的内容物。这个是饼干。
  components:
  - type: Sprite
    state: biscuit
  - type: FlavorProfile
    flavors:
    - Biscuit

- type: entity
  parent: CMMREFoodSnack
  id: CMMREFoodMeatballs
  name: 肉丸
  description: 海军陆战队标准配发的即食口粮内含物。这一份是肉丸。
  components:
  - type: Sprite
    state: meatballs
  - type: FlavorProfile
    flavors:
    - Meatballs

- type: entity
  parent: CMMREFoodSnack
  id: RMCMREFoodMeatzels
  name: 肉味脆饼
  description: 海军陆战队标准配发的即食口粮的内容物。这一份是……肉味脆饼？
  components:
  - type: Sprite
    state: meatzels
  - type: FlavorProfile
    flavors:
    - Meatballs

- type: entity
  parent: CMMREFoodSnack
  id: CMMREFoodPretzels
  name: 椒盐脆饼
  description: 海军陆战队标准配发即食口粮的内容物。这一份是椒盐脆饼。
  components:
  - type: Sprite
    state: pretzels
  - type: FlavorProfile
    flavors:
    - Pretzels

- type: entity
  parent: CMMREFoodSnack
  id: CMMREFoodPeanuts
  name: 花生
  description: 海军陆战队标准配发即食口粮的内容。这一份是花生。
  components:
  - type: Sprite
    state: peanuts
  - type: FlavorProfile
    flavors:
    - Peanuts

- type: entity
  parent: CMMREFoodSnack
  id: CMMREFoodSushi
  name: 寿司
  description: 海军陆战队标准配发即食口粮的内容。这一份是寿司。
  components:
  - type: Sprite
    state: sushi
  - type: FlavorProfile
    flavors:
    - Sushi

