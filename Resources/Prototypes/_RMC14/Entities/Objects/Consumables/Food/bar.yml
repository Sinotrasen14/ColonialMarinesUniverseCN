- type: entity
  abstract: true
  parent: CMFoodBase
  id: CMBarFoodBase
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/bar.rsi
  - type: Solution
    id: food
    solution:
      maxVol: 50
      reagents:
      - ReagentId: Nutriment
        Quantity: 8
  - type: Item
    size: Tiny
    sprite: _RMC14/Objects/Consumable/Food/bar.rsi
  - type: Extractable
    grindableSolutionName: food
  - type: InjectableSolution
    solution: food
  - type: DrawableSolution
    solution: food

- type: entity
  parent: CMBarFoodBase
  id: CMMarineProteinBar
  name: 不新鲜的海军陆战队蛋白棒
  description: 你平生见过的外观最假的蛋白棒，外面裹着一层代用巧克力。制作这些蛋白棒所用的粉末，是乳清替代品的替代品的替代品。
  components:
  - type: Sprite
    state: protein_bar

- type: entity
  parent: CMBarFoodBase
  id: RMCMarineRCMSnackBar
  name: 棕色饼干零食棒
  description: 披着伪装的恶魔。食用方便，味道和口感都相当不错，但短时间内吃超过一根，就能保证你至少两周都不用在野外挖茅坑。
  components:
  - type: Sprite # TODO RMC14 find a proper sprite for this
    sprite: _RMC14/Objects/Consumable/Food/packaged.rsi
    state: barcardine-o
