- type: entity
  parent: CMFoodBase
  id: RMCFoodMeatFish
  name: 生鱼柳
  description: 某种鱼，可能是从某处海洋里拖网捞上来的，或者是在大桶里养出来的。
  components:
  - type: FlavorProfile
    flavors:
    - fishy
  - type: Tag
    tags:
    - Raw
    - Meat
  - type: Edible
    transferAmount: 3 # 3 bites
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/misc.rsi
    state: rawfish
  - type: Solution
    id: food
    solution:
      maxVol: 5
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
      - ReagentId: UncookedAnimalProteins
        Quantity: 1
  - type: Item
    size: Small
    sprite: _RMC14/Objects/Consumable/Food/misc.rsi
  - type: Extractable
    grindableSolutionName: food
  - type: InjectableSolution
    solution: food
  - type: DrawableSolution
    solution: food

