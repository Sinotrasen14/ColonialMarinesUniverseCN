# Festive

- type: entity
  parent: CMMarinePreparedMealBase
  id: RMCMarinePreparedMealCookies
  name: "‘圣诞’餐：糖饼干"
  description: M25糖饼干餐旨在让海军陆战队员感受到圣诞节的喜悦。但令上级军官困惑的是，这种节省成本的措施——仅仅将蛋白棒做成带有代巧克力碎粒的饼干形状，并用人工着色水替代原本应有的牛奶——并未受到大多数海军陆战队员的欢迎。
  components:
  - type: Sprite
    state: cookies
  - type: Edible
    transferAmount: 8
  - type: Solution
    id: food
    solution:
      maxVol: 50
      reagents:
      - ReagentId: Nutriment
        Quantity: 15
      - ReagentId: RMCSugar
        Quantity: 9

- type: entity
  parent: CMMarinePreparedMealBase
  id: RMCMarinePreparedMealGingerbread
  name: "‘X-MAS’餐：姜饼饼干"
  description: M25姜饼饼干餐的设计初衷，是为了让海军陆战队员能方便且廉价地获取姜饼饼干，以此替代一年一度的姜饼制作课程，因为基础节日庆典课程的开支不断上涨，而成功率又低得滑稽。然而，由于节省成本的措施，这些饼干很少能带来快乐，也无法唤起节日气氛。
  components:
  - type: Sprite
    state: gingerbread
  - type: Edible
    transferAmount: 8
  - type: Solution
    id: food
    solution:
      maxVol: 50
      reagents:
      - ReagentId: Nutriment
        Quantity: 15
      - ReagentId: RMCSugar
        Quantity: 9

- type: entity
  parent: CMMarinePreparedMealBase
  id: RMCMarinePreparedMealFruitcake
  name: "“X-MAS”餐：水果蛋糕"
  description: M25水果蛋糕餐是军官委员会作为M25计划的一部分设计的第三餐；这一点从面包和葡萄干果那糟糕的坚硬与酸涩中体现出来。可以合乎逻辑地推断，兜售这一选项的人，连同设计和制作这个水果蛋糕的人，比格林奇和吝啬鬼加在一起还要坏。
  components:
  - type: Sprite
    state: fruit_cake
  - type: Edible
    transferAmount: 8
  - type: Solution
    id: food
    solution:
      maxVol: 50
      reagents:
      - ReagentId: Nutriment
        Quantity: 15
      - ReagentId: RMCSugar
        Quantity: 9

