- type: entity
  parent: CMFoodBase
  id: RMCFoodSnackBase
  abstract: true
  components:
  - type: Edible
  - type: Tag
    tags:
    - FoodSnack
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/packaged.rsi
  - type: Solution
    id: food
    solution:
      maxVol: 25   # Room for extra condiments
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
  - type: Item
    sprite: _RMC14/Objects/Consumable/Food/packaged.rsi
    heldPrefix: packet
    size: Tiny
  - type: Extractable
    grindableSolutionName: food
  - type: InjectableSolution
    solution: food
  - type: DrawableSolution
    solution: food

- type: entity
  parent: RMCFoodSnackBase
  id: RMCFoodSnackBarcaridine
  name: 巴尔卡里定巧克力棒
  description: 一块经典的巧克力棒，闻起来像医疗舱。“巧克力有助于缓解疼痛。”
  components:
  - type: Sprite
    state: barcardine
  - type: Item
    size: Tiny
  - type: SpawnItemsOnUse
    items:
    - id: RMCFoodPacketBarcaridineTrash
    - id: RMCFoodSnackBarcaridineBar
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: RMCFoodSnackBase
  id: RMCFoodSnackBarcaridineBar
  name: 巴卡里丁巧克力棒
  description: 一条经典巧克力棒，闻起来像医疗舱。‘巧克力能缓解疼痛。’
  components:
  - type: FlavorProfile
    flavors:
    - chocolate
    - medicine
  - type: Sprite
    state: barcardine-o
  - type: Item
  - type: Solution
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Nutriment
        Quantity: 4
      - ReagentId: CocoaPowder
        Quantity: 3
      - ReagentId: CMBicaridine
        Quantity: 2   # Given that the overdose rate is a lot higher, I doubt this will cause issues, you'd need to eat more than 15 bars.

- type: entity
  parent: RMCFoodSnackBase
  id: RMCFoodSnackBoonie
  name: 布尼巧克力棒
  description: 两根美味的薄荷巧克力棒。‘有时候东西就是……遥不可及。’
  components:
  - type: Sprite
    state: boonie
  - type: Item
    size: Tiny
  - type: SpawnItemsOnUse
    items:
    - id: RMCFoodPacketBoonieTrash
    - id: RMCFoodSnackBoonieBar
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: RMCFoodSnackBase
  id: RMCFoodSnackBoonieBar
  name: 布尼巧克力棒
  description: 两根美味的薄荷巧克力棒。‘有时候，事物就是……遥不可及。’
  components:
  - type: FlavorProfile
    flavors:
    - chocolate
    - minty
  - type: Sprite
    state: boonie-o
  - type: Item
  - type: Solution
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Nutriment
        Quantity: 6
      - ReagentId: CocoaPowder
        Quantity: 4

- type: entity
  parent: RMCFoodSnackBase
  id: RMCFoodSnackCHUNK
  name: CHUNK 巧克力棒
  description: 一块 CHUNK 品牌巧克力棒。根据联邦法律，这是允许存在的最致密的巧克力。法律要求我们必须请您不要将这个钝器用于营养之外的任何用途。
  components:
  - type: Sprite
    state: chunk
  - type: Item
    size: Tiny
  - type: SpawnItemsOnUse
    items:
    - id: RMCFoodPacketCHUNKTrash
    - id: RMCFoodSnackCHUNKBar
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: RMCFoodSnackBase
  id: RMCFoodSnackCHUNKBar
  name: CHUNK 巧克力棒
  description: 一根CHUNK牌巧克力棒。根据联邦法律允许存在的最致密巧克力。法律要求我们请您不要将这件钝器用于营养以外的任何用途。
  components:
  - type: FlavorProfile
    flavors:
    - chocolate
  - type: Sprite
    state: chunk-o
  - type: Item
    size: Normal
  - type: Solution
    solution:
      maxVol: 20   # It's going to take a bit to eat this goddamn thing.
      reagents:
      - ReagentId: Nutriment
        Quantity: 7
      - ReagentId: CocoaPowder
        Quantity: 10
  - type: MeleeWeapon # True horror comes from improvisation.
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud

- type: entity
  parent: RMCFoodSnackBase
  id: RMCFoodSnackHUNK
  name: HUNK 巧克力棒
  description: 根据营销宣传，这是一“箱”巧克力。HUNK 巧克力棒是 CHUNK 巧克力棒的早期版本，在数起与牙齿断裂有关的集体诉讼后停产。
  components:
  - type: Sprite
    state: hunk
  - type: Item
    size: Large
  - type: SpawnItemsOnUse
    items:
    - id: RMCFoodPacketHUNKTrash
    - id: RMCFoodSnackHUNKBar
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: RMCFoodSnackBase
  id: RMCFoodSnackHUNKBar
  name: HUNK 巧克力棒
  description: 按照营销宣传，这是一“箱”巧克力。HUNK 是 CHUNK 巧克力棒的早期版本，在数起与牙齿崩裂有关的集体诉讼后停产。
  components:
  - type: FlavorProfile
    flavors:
    - metallic
    - chocolate
  - type: Sprite
    state: hunk-o
  - type: Item
    size: Large
  - type: Solution
    solution:
      maxVol: 40   # Remember what I said before? It's worse now.
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Iron   # IT CONTAINS 30 UNITS OF WHAT???
        Quantity: 30
      - ReagentId: CocoaPowder
        Quantity: 5
  - type: MeleeWeapon # You could legitimately use this as a strong melee weapon. That horrifies me.
    damage:
      types:
        Blunt: 35
    soundHit:
      collection: MetalThud

- type: entity
  parent: RMCFoodSnackBase
  id: RMCFoodSnackKeplarCrisps
  name: Keplar 薯片
  description: 它们好吃得令人不安！现在含有0%反式脂肪，并添加了真正的海盐。
  components:
  - type: FlavorProfile
    flavors:
    - potatoes
    - salty
  - type: Sprite
    state: kepler_chips
  - type: Solution
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Nutriment
        Quantity: 4
      - ReagentId: TableSalt   # Holy shit these are salty.
        Quantity: 12
  - type: Item
  - type: Edible
    trash:
    - RMCFoodPacketKeplerCrispsTrash

- type: entity
  parent: RMCFoodSnackBase
  id: RMCFoodSnackKeplarFlamehotCrisps
  name: 开普勒火辣薯片
  description: 它们好吃得令人不安！由于2165年“开普勒火辣薯片”发布时配合了一场时机绝佳的广告宣传活动，开普勒品牌得以在当年第三季度超越威兰德-尤坦尼的其他糖果类产品。反式脂肪含量为0%。
  components:
  - type: FlavorProfile
    flavors:
    - potatoes
    - spicy
    - salty
  - type: Sprite
    state: kepler_flame
  - type: Solution
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Nutriment
        Quantity: 4
      - ReagentId: TableSalt
        Quantity: 4
      - ReagentId: Hotsauce
        Quantity: 8
  - type: Item
  - type: Edible
    trash:
    - RMCFoodPacketKeplerCrispsFlamehotTrash

- type: entity
  parent: RMCFoodSnackBase
  id: RMCFoodSnackChipsPepper
  name: 黑胡椒味薯片
  description: 优质高级薯片，现在0%反式脂肪。现已添加黑胡椒！由We-Yu包装。
  components:
  - type: FlavorProfile
    flavors:
    - potatoes
    - peppery
  - type: Sprite
    state: wy_pepper
  - type: Solution
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Nutriment
        Quantity: 6
      - ReagentId: Blackpepper
        Quantity: 1
  - type: Item
  - type: Edible
    trash:
    - RMCFoodPacketPepperChipsTrash

