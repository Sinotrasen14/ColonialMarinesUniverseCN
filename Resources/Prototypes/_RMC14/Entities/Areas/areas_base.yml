    CAS: false

- type: entity
  parent: RMCAreaProtectionThree
  abstract: true
  id: RMCAreaUndergroundBlockCAS
  name: 地下区块CAS

- type: entity
  parent: RMCAreaProtectionThree
  abstract: true
