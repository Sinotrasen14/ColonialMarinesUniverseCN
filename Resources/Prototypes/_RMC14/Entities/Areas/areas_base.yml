# PORTING CHEATSHEET
# 0: Block nothing
# 1: Block mortar placement, lasing, medevac
# 2: Block CAS signals, supply drops, fultoning, mortar fire
# 3: Block CAS
# 4: Block OB

- type: entity
  abstract: true
  id: RMCAreaBase
  name: 区域
  suffix: Area
  placement:
    mode: SnapgridCenter
    snap:
    - RMCArea
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Areas/areas.rsi
    state: unknown
  - type: Marker
  - type: Clickable
  - type: InteractionOutline
  - type: Area
    CAS: true
    fulton: true
    lasing: true
    mortarPlacement: true
    mortarFire: true
    medevac: true
    OB: true
    supplyDrop: true
    paradropping: true
    countAsArrestedForEndConditions: false
  - type: PlacementReplacement
    key: rmc_areas

- type: entity
  parent: RMCAreaBase
  abstract: true
  id: RMCAreaProtectionZero
  name: 保护 0
  components:
  - type: Area
    CAS: true
    fulton: true
    lasing: true
    mortar: true
    medevac: true
    OB: true
    supplyDrop: true
    paradropping: true

- type: entity
  parent: RMCAreaProtectionZero
  abstract: true
  id: RMCAreaNone
  name: 无

- type: entity
  parent: RMCAreaProtectionZero
  abstract: true
  id: RMCAreaGlass
  name: 玻璃

- type: entity
  parent: RMCAreaBase
  abstract: true
  id: RMCAreaProtectionOne
  name: 保护 1
  components:
  - type: Area
    lasing: false
    mortar: false
    medevac: false
    paradropping: false

- type: entity
  parent: RMCAreaProtectionOne
  abstract: true
  id: RMCAreaProtectionMetal
  name: 金属

- type: entity
  parent: RMCAreaBase
  abstract: true
  id: RMCAreaProtectionTwo
  name: 保护 2
  components:
  - type: Area
    fulton: false
    supplyDrop: false

- type: entity
  parent: RMCAreaProtectionTwo
  abstract: true
  id: RMCAreaUndergroundAllowCAS
  name: 地下允许cas

- type: entity
  parent: RMCAreaProtectionTwo
  abstract: true
  id: RMCAreaUndergroundMetalAllowCAS
  name: 地下金属合金外壳

- type: entity
  parent: RMCAreaBase
  abstract: true
